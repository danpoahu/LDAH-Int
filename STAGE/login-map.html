<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LDAH Pacific Reach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F2A3A; --ink2:#3D5A6B; --mute:#6F8794; --line:#D9E6EB;
  --paper:#FBFAF6; --card:#FFFFFF;
  --ocean1:#F2FAFB; --ocean2:#CFE9EF; --ocean3:#A9D7E2;
  --teal:#0E7C86; --teal2:#14A3A8; --deep:#0B4F6C; --sand:#F3EBD8; --sandEdge:#C9B488; --land:#E7EFD9; --landEdge:#9DB48A;
  --purple:#7C3AED; --purple2:#A78BFA; --amber:#D97706;
  --serif:'Fraunces', Georgia, 'Times New Roman', serif;
  --sans:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:13px;-webkit-font-smoothing:antialiased;overflow:hidden}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:12px 20px 10px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fff, var(--paper))}
.kicker{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);font-weight:700}
h1{font-family:var(--serif);font-weight:600;font-size:25px;line-height:1.1;margin:2px 0 3px;letter-spacing:-.01em}
h1 em{font-style:italic;color:var(--teal)}
.asof{font-size:11.5px;color:var(--mute)}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.seg{display:inline-flex;background:#EEF4F6;border-radius:999px;padding:3px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;font:600 12px var(--sans);color:var(--ink2);padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.seg button.on{background:#fff;color:var(--deep);box-shadow:0 1px 3px rgba(11,79,108,.18)}
.tour{border:0;background:var(--deep);color:#fff;font:600 12px var(--sans);padding:8px 14px;border-radius:999px;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.tour:hover{background:var(--teal)}
.tour svg{width:12px;height:12px}
main{display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:0}
header>*{min-width:0;max-width:100%}
.seg{max-width:100%}
.mapwrap{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--ocean1)}
#map{width:100%;height:100%;display:block;touch-action:manipulation}
.crumbs{position:absolute;top:12px;left:14px;display:flex;gap:4px;align-items:center;background:rgba(255,255,255,.88);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:999px;padding:4px 6px;font-weight:600;font-size:12px;box-shadow:0 2px 10px rgba(15,42,58,.06)}
.crumbs button{border:0;background:none;font:inherit;color:var(--teal);cursor:pointer;padding:3px 8px;border-radius:999px}
.crumbs button:hover{background:#E6F4F5}
.crumbs button.cur{color:var(--ink);cursor:default;background:none}
.crumbs .sep{color:#AFC3CB}
.legend{position:absolute;left:14px;bottom:14px;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:11px;color:var(--ink2);box-shadow:0 4px 18px rgba(15,42,58,.07);max-width:300px}
.legend h4{margin:0 0 6px;font:700 10px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.legend .row{display:flex;align-items:center;gap:7px;margin:3px 0}
.legend .dot{width:11px;height:11px;border-radius:50%;flex:none}
.legend svg{display:block}
.scalebar{position:absolute;right:14px;bottom:14px;font-size:10.5px;color:var(--ink2);text-align:right;background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:10px;padding:6px 9px}
.scalebar .bar{height:5px;border:1.5px solid var(--ink2);border-top:0;margin-top:3px}
.insight{position:absolute;top:56px;right:14px;width:236px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:10px;padding:10px 12px;box-shadow:0 6px 22px rgba(15,42,58,.09);font-size:12px;color:var(--ink2);transition:opacity .5s, transform .5s}
.insight b{color:var(--ink)}
.insight .big{font:600 22px var(--serif);color:var(--amber);line-height:1.1;margin:2px 0}
.insight .k{font:700 10px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--amber)}
.insight.hide{opacity:0;transform:translateY(-6px);pointer-events:none}
.caption{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--deep);color:#fff;padding:9px 16px;border-radius:999px;font:500 13px var(--sans);box-shadow:0 6px 20px rgba(11,79,108,.3);opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.caption.show{opacity:1}
.tip{position:absolute;pointer-events:none;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 11px;box-shadow:0 8px 26px rgba(15,42,58,.16);font-size:12px;color:var(--ink2);opacity:0;transition:opacity .12s;min-width:140px;z-index:5}
.tip .t{font:600 14px var(--serif);color:var(--ink)}
.tip .n{font:700 13px var(--sans);color:var(--teal);margin-top:2px}
.tip .n.p{color:var(--purple)}
.tip .s{font-size:11px;color:var(--mute);margin-top:1px}
/* rail */
aside{border-left:1px solid var(--line);background:var(--card);overflow-y:auto;padding:16px 18px 24px;min-height:0}
aside::-webkit-scrollbar{width:8px}aside::-webkit-scrollbar-thumb{background:#DCE7EB;border-radius:8px}
.hero{display:flex;align-items:baseline;gap:8px}
.hero .num{font:600 40px/1 var(--serif);color:var(--deep);letter-spacing:-.02em}
.hero .lbl{font-size:12px;color:var(--ink2)}
.split{display:flex;height:8px;border-radius:6px;overflow:hidden;margin:10px 0 6px;background:#EEF3F5}
.split span{display:block;height:100%}
.splitkey{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--ink2)}
.splitkey i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:0}
.sec{margin-top:18px}
.sec h3{font:700 10.5px var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--mute);margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.sec h3 small{letter-spacing:0;text-transform:none;font-weight:500;font-size:10.5px}
.rowb{display:grid;grid-template-columns:96px 1fr 44px;align-items:center;gap:8px;padding:4px 6px;margin:0 -6px;border-radius:7px;cursor:pointer}
.rowb:hover{background:#F1F8F9}
.rowb .nm{font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowb .nm small{display:block;font-weight:500;color:var(--mute);font-size:10.5px}
.rowb .track{height:7px;background:#EEF3F5;border-radius:5px;overflow:hidden}
.rowb .fill{height:100%;background:linear-gradient(90deg,var(--teal2),var(--deep));border-radius:5px;width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.rowb .fill.p{background:linear-gradient(90deg,var(--purple2),var(--purple))}
.rowb .ct{text-align:right;font:700 12.5px var(--sans);color:var(--ink);font-variant-numeric:tabular-nums}
ol.top{list-style:none;margin:0;padding:0;counter-reset:t}
ol.top li{counter-increment:t;display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:center;padding:5px 6px;margin:0 -6px;border-radius:7px;cursor:pointer}
ol.top li:hover{background:#F1F8F9}
ol.top li::before{content:counter(t);font:600 12px var(--serif);color:var(--teal);text-align:center}
ol.top .c{font-weight:600;font-size:12.5px}
ol.top .c small{color:var(--mute);font-weight:500;margin-left:5px;font-size:11px}
ol.top .v{font:700 12.5px var(--sans);font-variant-numeric:tabular-nums}
.partner{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:7px 8px;margin:0 -6px 4px;border-radius:9px;cursor:pointer;border:1px solid transparent}
.partner:hover{background:#F6F2FE;border-color:#E6DAFD}
.partner .pn{font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:6px}
.partner .pn i{width:9px;height:9px;border-radius:50%;background:var(--purple);display:inline-block}
.partner .pv{font:700 12.5px var(--sans);color:var(--purple);text-align:right}
.partner .meta{grid-column:1/-1;font-size:10.5px;color:var(--mute);display:flex;gap:10px;padding-left:15px}
.partner .meta b{color:var(--ink2);font-weight:600}
.offmap{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:12px}
.offmap .v{font-weight:700;text-align:right}
.offmap small{display:block;color:var(--mute);font-size:10.5px}
.notes{margin-top:18px;padding-top:12px;border-top:1px solid var(--line);font-size:10.5px;color:var(--mute);line-height:1.5}
.notes p{margin:0 0 6px}
.notes b{color:var(--ink2)}
.back{border:0;background:#EEF4F6;color:var(--teal);font:600 12px var(--sans);padding:5px 10px;border-radius:999px;cursor:pointer;margin-bottom:10px}
.ititle{font:600 28px/1.05 var(--serif);color:var(--ink);margin:0}
.isub{font-size:12px;color:var(--ink2);margin-top:4px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.stat{background:#F5FAFB;border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.stat .v{font:600 22px var(--serif);color:var(--deep)}
.stat .k{font-size:10.5px;color:var(--mute)}
.hood{padding-left:22px !important}
.hood .nm{font-weight:500 !important;color:var(--ink2)}
/* svg */
.isl{cursor:pointer;transition:fill .25s}
.isl:hover,.isl.hl{fill:#DCEBC9}
.bub{cursor:pointer;transition:opacity .45s}
.bub circle.b{fill:rgba(14,124,134,.78);stroke:#fff}
.bub.p circle.b{fill:rgba(124,58,237,.80)}
.bub.hiagg circle.b{fill:rgba(14,124,134,.5)}
.bub.nz circle.b{fill:rgba(255,255,255,.55);stroke:var(--teal)}
.bub:hover circle.b{fill:rgba(11,79,108,.92)}
.bub.p:hover circle.b{fill:rgba(91,33,182,.95)}
.bub.nz:hover circle.b{fill:rgba(14,124,134,.18)}
.bub.pulse circle.b{animation:pulse 1.1s ease-in-out 3}
@keyframes pulse{50%{fill:var(--amber)}}
.lbl{font-family:var(--sans);font-weight:600;fill:var(--ink);paint-order:stroke;stroke:rgba(251,250,246,.92);stroke-linejoin:round;pointer-events:none;transition:opacity .45s}
.lbl .cnt{fill:var(--teal);font-weight:700}
.lbl.p .cnt{fill:var(--purple)}
.ilbl{font-family:var(--serif);font-style:italic;fill:#5E7D5A;pointer-events:none;paint-order:stroke;stroke:rgba(242,250,251,.85);stroke-linejoin:round}
.olbl{font-family:var(--sans);font-weight:600;letter-spacing:.3em;text-transform:uppercase;fill:#7FAFBF;pointer-events:none}
.glbl{font-family:var(--sans);fill:#7FA3B0;pointer-events:none}
.heat{pointer-events:none;mix-blend-mode:multiply;transition:opacity .45s}
.fade{opacity:0;pointer-events:none}
.still *{transition:none !important;animation:none !important}
@media (max-width:1000px){
  body{overflow:auto}
  .app{height:auto}
  main{grid-template-columns:minmax(0,1fr)}
  .seg{flex-wrap:wrap}
  h1 em{white-space:normal}
  .mapwrap{height:68vh;min-height:420px}
  aside{border-left:0;border-top:1px solid var(--line)}
  header{flex-direction:column;align-items:flex-start;padding:12px 16px}
  .controls{justify-content:flex-start}
  .insight{display:none}
}
@media (max-width:560px){
  h1{font-size:20px}
  .legend{max-width:190px;font-size:10px;padding:7px 9px}
  .legend svg{display:none}
  .scalebar{display:none}
  .controls{gap:6px}
  .seg button{padding:5px 9px;font-size:11px}
}

/* Sign-in background (2026-10-03): the map only, no right-hand rail, no
   controls, tour or captions. Shown behind the LDAH Int sign-in box, which is
   public, so this is the baked 10-03 snapshot (aggregate counts, <3 rule). */
aside#rail,.controls,#tourBtn,.crumbs,.insight,.caption{display:none!important}
main{grid-template-columns:minmax(0,1fr)!important}
</style>
</head>

  for(const it of list){
    const fs=11.5, R=rpx(it,g)*Math.min(1,it.grow||0), txt=(it.ts.textContent+it.tc.textContent);
    const w=txt.length*fs*.6*px, h=fs*1.15*px, gap=3*px;
    const cands=[
      [it.x+R*px+gap, it.y+fs*.35*px, 'start', it.x+R*px+gap, it.y-h/2],
      [it.x-R*px-gap, it.y+fs*.35*px, 'end', it.x-R*px-gap-w, it.y-h/2],
      [it.x, it.y-R*px-gap-fs*.25*px, 'middle', it.x-w/2, it.y-R*px-gap-h],
      [it.x, it.y+R*px+gap+fs*.85*px, 'middle', it.x-w/2, it.y+R*px+gap]];
    let placed=false;
    for(const [tx,ty,anc,bx,by] of cands){const b={x:bx,y:by,w,h};if(!hit(b)){boxes.push(b);it.t.setAttribute('x',tx);it.t.setAttribute('y',ty);it.t.setAttribute('text-anchor',anc);placed=true;break;}}
    it.t.setAttribute('visibility',placed?'visible':'hidden');

}
function groupForView(v){return v==='pacific'?'pacific':v==='hawaii'?'state':'detail';}

let growStart=0, growGroup=null;
const STILL=/still/.test(location.search); if(STILL)document.documentElement.classList.add('still');
function growIn(g){growGroup=g;growStart=STILL?-1e7:performance.now();}

/* ---------- viewBox ---------- */
function boxToVB(box){
  const [n,s,w,e]=box; const [x0,y0]=P(n,w), [x1,y1]=P(s,e);
  let bw=x1-x0,bh=y1-y0; const W=svg.clientWidth||1000,H=svg.clientHeight||700;
  const pad=view==='pacific'?1.02:1.08; bw*=pad;bh*=pad;
  const cx=(x0+x1)/2, cy=(y0+y1)/2; const ar=W/H;
  if(bw/bh>ar)bh=bw/ar; else bw=bh*ar;
  return {x:cx-bw/2,y:cy-bh/2,w:bw,h:bh};
}
function setVB(v){vb=v;svg.setAttribute('viewBox',`${v.x} ${v.y} ${v.w} ${v.h}`);}
let anim=null;
function animateTo(target,dur=1400){
  const from=Object.assign({},vb), t0=performance.now();
  const fcx=from.x+from.w/2,fcy=from.y+from.h/2,tcx=target.x+target.w/2,tcy=target.y+target.h/2;
  const lw0=Math.log(from.w),lw1=Math.log(target.w);
  anim={step(now){let t=Math.min(1,(now-t0)/dur);const e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
    const w=Math.exp(lw0+(lw1-lw0)*e),h=w*(target.h/target.w);
    // centre follows zoom so the motion feels like flying, not sliding
    const zf=(Math.log(from.w)-Math.log(w))/((lw0-lw1)||1);const ce=isFinite(zf)?Math.min(1,Math.max(0,zf)):e;
    const cx=fcx+(tcx-fcx)*ce,cy=fcy+(tcy-fcy)*ce;
    setVB({x:cx-w/2,y:cy-h/2,w,h}); if(t>=1)anim=null;}};
}

/* ---------- frame loop ---------- */
function pxPerUnit(){return vb.w/(svg.clientWidth||1000);}
function frame(now){
  if(anim)anim.step(now);
  const px=pxPerUnit();
  for(const f of scaleList)f(px);
  // grow
  const gt=(now-growStart);
  for(const k in groups)for(const it of groups[k]){
    if(k===growGroup){const t=Math.min(1,Math.max(0,(gt-it.i*28)/700));it.grow=t<=0?0:easeOutBack(t);} else if(it.grow<1&&k!==growGroup){it.grow=1;}
    itemFrame(it,px);
  }
  layoutLabels(px);
  // arcs flow
  const showArcs=vb.w>150;
  gArcs.style.opacity=showArcs?1:0;
  if(showArcs){for(const a of arcs){if(!a.len)a.len=a.base.getTotalLength();
    a.flow.setAttribute('stroke-dashoffset',-(now/40)*a.px);
    const t=((now/4200)+a.phase)%1;const p=a.base.getPointAtLength(t*a.len);a.dot.setAttribute('cx',p.x);a.dot.setAttribute('cy',p.y);a.dot.style.opacity=Math.sin(t*Math.PI).toFixed(2);}}
  gDate.style.opacity=vb.w>150?1:0; gGrat.style.opacity=vb.w>120?1:.0; gGhost.style.opacity=vb.w>120?1:0;
  ilblHawaii.style.opacity=vb.w<200?1:0;
  scalebar(px);
  requestAnimationFrame(frame);
}
function scalebar(px){

  const nice=[1,2,5,10,20,25,50,100,200,250,500,1000,2000];let m=nice[0];for(const v of nice)if(v<=target)m=v;
  $('#sbBar').style.width=(m*unitsPerMile/px)+'px';$('#sbLbl').textContent=m.toLocaleString('en-US')+' miles';

/* ---------- clocks ---------- */
function clock(tz){const d=new Date(Date.now()+tz*3600e3);const day=d.toLocaleDateString('en-US',{weekday:'short',timeZone:'UTC'});const t=d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'UTC'});
  const hi=new Date(Date.now()-10*3600e3);const diff=Math.round((Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())-Date.UTC(hi.getUTCFullYear(),hi.getUTCMonth(),hi.getUTCDate()))/864e5);
  return `${day} ${t}`+(diff>0?' (tomorrow)':diff<0?' (yesterday)':'');}
