<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat viewport diagnostic</title>
<style>
  html,body{margin:0;background:#0f172a;color:#e2e8f0;font:15px -apple-system,sans-serif;}
  .wrap{padding:14px;}
  h1{font-size:17px;margin:0 0 10px;color:#38bdf8;}
  table{border-collapse:collapse;width:100%;font-size:15px;}
  td{padding:5px 6px;border-bottom:1px solid #1e293b;vertical-align:top;}
  td:first-child{color:#94a3b8;white-space:nowrap;}
  td:last-child{font-weight:700;text-align:right;font-variant-numeric:tabular-nums;}
  .ok{color:#4ade80;} .bad{color:#f87171;} .warn{color:#fbbf24;}
  .probe{position:fixed;top:0;left:0;width:1px;visibility:hidden;}
  .note{margin-top:12px;padding:10px;background:#1e293b;border-radius:8px;font-size:13px;line-height:1.5;color:#cbd5e1;}
</style></head><body>
<div class="probe" id="p_vh" style="height:100vh"></div>
<div class="probe" id="p_dvh" style="height:100dvh"></div>
<div class="probe" id="p_svh" style="height:100svh"></div>
<div class="probe" id="p_lvh" style="height:100lvh"></div>
<div class="wrap">
  <h1>Chat viewport diagnostic</h1>
  <table id="t"></table>
  <div class="note">Screenshot this whole screen and send it back. Rotate the iPad and tap here to re-read if asked.</div>
</div>
<script>
function px(el){ return Math.round(el.getBoundingClientRect().height); }
function row(k,v,cls){ return '<tr><td>'+k+'</td><td class="'+(cls||'')+'">'+v+'</td></tr>'; }
async function render(){
  var vv = window.visualViewport;
  var vh=px(document.getElementById('p_vh')), dvh=px(document.getElementById('p_dvh'));
  var svh=px(document.getElementById('p_svh')), lvh=px(document.getElementById('p_lvh'));
  var vvh = vv ? Math.round(vv.height) : 0;
  var h='';
  h+=row('window.innerHeight', window.innerHeight);
  h+=row('visualViewport.height', vv ? vvh : 'UNSUPPORTED', vv?'ok':'bad');
  h+=row('visualViewport.offsetTop', vv ? Math.round(vv.offsetTop) : '—');
  h+=row('documentElement.clientHeight', document.documentElement.clientHeight);
  h+=row('100vh resolves to', vh);
  h+=row('100dvh resolves to', dvh, dvh===vh ? 'warn' : 'ok');
  h+=row('100svh resolves to', svh);
  h+=row('100lvh resolves to', lvh);
  h+=row('dvh supported?', (dvh>0 && CSS.supports('height','100dvh')) ? 'YES' : 'NO', (dvh>0&&CSS.supports('height','100dvh'))?'ok':'bad');
  h+=row('100vh minus real visible', (vh-(vvh||vh)), (vh-(vvh||vh))>4?'bad':'ok');
  h+=row('devicePixelRatio', window.devicePixelRatio);
  h+=row('screen', screen.width+' x '+screen.height);
  // Which chat.html version is this browser actually holding?
  try{
    var r=await fetch('chat.html',{cache:'no-store'});
    var t=await r.text();
    var m=t.match(/chat-core\.js\?v=([0-9.]+)/);
    h+=row('chat.html on SERVER references', m?('v'+m[1]):'?', 'ok');
  }catch(e){ h+=row('server chat.html fetch', 'FAILED', 'bad'); }
  try{
    var r2=await fetch('chat.html');           // whatever the cache gives
    var t2=await r2.text();
    var m2=t2.match(/chat-core\.js\?v=([0-9.]+)/);
    var hasFix = /chat-vvh/.test(t2);
    h+=row('chat.html YOUR BROWSER has', m2?('v'+m2[1]):'?', hasFix?'ok':'bad');
    h+=row('...contains the viewport fix?', hasFix?'YES':'NO — STALE CACHE', hasFix?'ok':'bad');
  }catch(e){ h+=row('cached chat.html', 'FAILED', 'bad'); }
  h+=row('user agent', navigator.userAgent.slice(0,60));
  document.getElementById('t').innerHTML=h;
}
render();
if(window.visualViewport){ visualViewport.addEventListener('resize',render); }
window.addEventListener('resize',render);
document.body.addEventListener('click',render);
</script></body></html>
