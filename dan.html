<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>LDAH Contact Alerts</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0F172A; color: #E2E8F0; min-height: 100vh; }
  .header { padding: 20px 16px 12px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1E293B; }
  .header h1 { font-size: 1.2rem; font-weight: 700; color: #F8FAFC; }
  .header h1 span { color: #38BDF8; }
  .badge { background: #DC2626; color: #fff; font-size: .75rem; font-weight: 700; border-radius: 20px; padding: 2px 10px; margin-left: 8px; display: none; }
  .status { font-size: .7rem; color: #64748B; display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #22C55E; display: inline-block; }
  .dot.off { background: #64748B; }
  .empty { text-align: center; padding: 80px 20px; color: #475569; }
  .empty p { font-size: .9rem; margin-top: 8px; }
  .list { padding: 8px; }
  .card { background: #1E293B; border-radius: 12px; padding: 14px 16px; margin-bottom: 8px; border-left: 4px solid #38BDF8; }
  .card.new { border-left-color: #F59E0B; animation: fadeIn 0.3s ease; }
  .card .name { font-weight: 600; font-size: .95rem; color: #F8FAFC; }
  .card .time { font-size: .7rem; color: #64748B; margin-top: 2px; }
  .card .message { font-size: .82rem; color: #94A3B8; margin-top: 8px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .email-row { margin-top: 10px; display: flex; align-items: center; gap: 8px; }
  .card .email-btn { background: #0EA5E9; color: #fff; text-decoration: none; font-size: .8rem; font-weight: 600; padding: 6px 14px; border-radius: 8px; display: inline-block; }
  .card .email-btn:active { opacity: .8; }
  .card .email-addr { font-size: .78rem; color: #38BDF8; }
  .card .phone { font-size: .78rem; color: #64748B; margin-top: 4px; }
  .card .source-badge { display: inline-block; font-size: .65rem; font-weight: 600; background: #312E81; color: #A5B4FC; border-radius: 6px; padding: 2px 8px; margin-left: 6px; }
  .filter-bar { padding: 12px 16px; display: flex; gap: 8px; }
  .filter-btn { background: #1E293B; color: #94A3B8; border: none; font-size: .78rem; font-weight: 600; padding: 6px 14px; border-radius: 20px; cursor: pointer; }
  .filter-btn.active { background: #0EA5E9; color: #fff; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div class="header">
  <h1><span>LDAH</span> Contact Alerts <span class="badge" id="newBadge">0</span></h1>
  <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Connecting...</span></div>
</div>

<div class="filter-bar">
  <button class="filter-btn active" onclick="setFilter('new')">New</button>
  <button class="filter-btn" onclick="setFilter('all')">All</button>
</div>

<div class="list" id="list">
  <div class="empty"><p>Listening for new contacts...</p></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
  firebase.initializeApp({
    apiKey: "AIzaSyAU3CQ07bCVKlJ1qGak-150kaJEyPKldLk",
    authDomain: "ldah-932d5.firebaseapp.com",
    projectId: "ldah-932d5",
    storageBucket: "ldah-932d5.firebasestorage.app",
    messagingSenderId: "662130454003",
    appId: "1:662130454003:web:437576d5a5811ecd8df686"
  });
  var db = firebase.firestore();
  var contacts = [];
  var filter = 'new';
  var firstLoad = true;

  // Request notification permission
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }

  function notify(name, email) {
    if ('Notification' in window && Notification.permission === 'granted') {
      new Notification('New LDAH Contact', { body: name + ' — ' + email, icon: 'logo_blue.png' });
    }
    // Audio ping
    try {
      var ac = new (window.AudioContext || window.webkitAudioContext)();
      var osc = ac.createOscillator();
      var gain = ac.createGain();
      osc.frequency.value = 880;
      osc.type = 'sine';
      gain.gain.value = 0.15;
      osc.connect(gain);
      gain.connect(ac.destination);
      osc.start();
      osc.stop(ac.currentTime + 0.15);
    } catch(e) {}
  }

  function timeAgo(ts) {
    if (!ts) return '';
    var d = ts.toDate ? ts.toDate() : new Date(ts.seconds * 1000);
    var diff = (Date.now() - d.getTime()) / 1000;
    if (diff < 60) return 'Just now';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  }

  function render() {
    var list = document.getElementById('list');
    var filtered = filter === 'new' ? contacts.filter(function(c) { return !c.status || c.status === 'new'; }) : contacts;
    var newCount = contacts.filter(function(c) { return !c.status || c.status === 'new'; }).length;
    var badge = document.getElementById('newBadge');
    badge.textContent = newCount;
    badge.style.display = newCount > 0 ? 'inline' : 'none';
    document.title = newCount > 0 ? '(' + newCount + ') LDAH Contact Alerts' : 'LDAH Contact Alerts';

    if (!filtered.length) {
      list.innerHTML = '<div class="empty"><p>' + (filter === 'new' ? 'No new contacts' : 'No contacts yet') + '</p></div>';
      return;
    }
    var html = '';
    filtered.forEach(function(c) {
      var isNew = !c.status || c.status === 'new';
      var subject = encodeURIComponent('Re: Your message to LDAH');
      var mailto = 'mailto:' + encodeURIComponent(c.email || '') + '?subject=' + subject;
      html += '<div class="card' + (isNew ? ' new' : '') + '">';
      html += '<div class="name">' + esc(c.name || 'Unknown') + (c.source ? '<span class="source-badge">' + esc(c.source) + '</span>' : '') + '</div>';
      html += '<div class="time">' + timeAgo(c.submittedAt || c.timestamp) + '</div>';
      if (c.message) html += '<div class="message">' + esc(c.message) + '</div>';
      if (c.phone) html += '<div class="phone">' + esc(c.phone) + '</div>';
      html += '<div class="email-row">';
      if (c.email) html += '<a class="email-btn" href="' + mailto + '">Reply</a><span class="email-addr">' + esc(c.email) + '</span>';
      html += '</div></div>';
    });
    list.innerHTML = html;
  }

  function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

  function setFilter(f) {
    filter = f;
    document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.toggle('active', b.textContent.toLowerCase() === f); });
    render();
  }

  // Real-time listener
  db.collection('contactSubmissions').orderBy('timestamp', 'desc').limit(50).onSnapshot(function(snap) {
    var oldIds = contacts.map(function(c) { return c.id; });
    contacts = [];
    snap.forEach(function(doc) { contacts.push({ id: doc.id, ...doc.data() }); });

    // Notify on truly new docs (not first load)
    if (!firstLoad) {
      contacts.forEach(function(c) {
        if (oldIds.indexOf(c.id) === -1 && (!c.status || c.status === 'new')) {
          notify(c.name || 'New Contact', c.email || '');
        }
      });
    }
    firstLoad = false;
    document.getElementById('statusDot').className = 'dot';
    document.getElementById('statusText').textContent = 'Live';
    render();
  }, function(err) {
    document.getElementById('statusDot').className = 'dot off';
    document.getElementById('statusText').textContent = 'Disconnected';
    console.error(err);
  });
</script>
</body>
</html>
