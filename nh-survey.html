<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NH Survey">
<meta name="theme-color" content="#0891B2">
<title>NH Survey - Live</title>
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-512.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
  :root{
    --ocean-deep:#0891B2;
    --ocean-mid:#06B6D4;
    --sand-light:#FFFBEB;
    --bg-warm:#FEFDFB;
    --text-dark:#1E293B;
    --text-soft:#64748B;
    --border:#E2E8F0;
    --green:#16A34A;
    --amber:#F59E0B;
    --red:#DC2626;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:linear-gradient(180deg,var(--sand-light) 0%,var(--bg-warm) 100%);min-height:100vh;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;color:var(--text-dark);-webkit-font-smoothing:antialiased}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  header{position:sticky;top:0;top:env(safe-area-inset-top);z-index:10;background:rgba(255,251,235,.96);backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--border);padding:14px 16px 12px;padding-top:calc(14px + env(safe-area-inset-top))}
  .hdr-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .hdr-top img{width:32px;height:32px;border-radius:8px;flex-shrink:0}
  .hdr-top h1{font-family:'Outfit',sans-serif;font-size:17px;font-weight:600;color:var(--ocean-deep);margin:0;line-height:1.2}
  .hdr-top h1 span{color:var(--green);font-size:13px;font-weight:500}
  .hdr-count{font-family:'Outfit',sans-serif;font-size:28px;font-weight:700;color:var(--text-dark);line-height:1.1;margin:6px 0 2px}
  .hdr-count small{font-size:14px;font-weight:500;color:var(--text-soft);margin-left:6px}
  .hdr-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
  .hdr-updated{font-size:13px;color:var(--text-soft);display:flex;align-items:center;gap:6px;flex:1;min-width:0}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0;transition:background .3s}
  .dot.amber{background:var(--amber)}
  .dot.red{background:var(--red)}
  #refreshBtn{background:var(--ocean-deep);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600;font-family:inherit;min-height:44px;min-width:44px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;box-shadow:0 2px 6px rgba(8,145,178,.25)}
  #refreshBtn:active{transform:scale(.96);background:#0E7490}
  #refreshBtn[disabled]{opacity:.6}
  .spin{animation:spin 1s linear infinite;display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}
  main{padding:14px 16px calc(20px + env(safe-area-inset-bottom));max-width:100%;overflow-x:hidden}
  .empty,.gate{padding:40px 24px;text-align:center;color:var(--text-soft);font-size:15px;line-height:1.5}
  .gate{padding-top:80px}
  .gate h2{font-family:'Outfit',sans-serif;color:var(--ocean-deep);font-size:20px;margin:0 0 12px}
  .gate p{margin:0 0 20px}
  .gate a{display:inline-block;background:var(--ocean-deep);color:#fff;text-decoration:none;padding:14px 22px;border-radius:12px;font-weight:600;min-height:44px;font-size:15px}
  .err{background:#FEF2F2;border:1px solid #FECACA;color:#991B1B;padding:12px 14px;border-radius:12px;margin-bottom:12px;font-size:14px}
  .card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .card .when{font-size:13px;font-weight:600;color:var(--ocean-deep);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
  .card .name{font-family:'Outfit',sans-serif;font-size:18px;font-weight:600;color:var(--text-dark);line-height:1.3;margin-bottom:8px;word-wrap:break-word}
  .card .name.anon{color:var(--text-soft);font-style:italic;font-weight:500}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{display:inline-flex;align-items:center;gap:5px;background:var(--sand-light);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--text-dark);text-decoration:none;min-height:32px;word-break:break-all}
  .chip:active{background:#FEF3C7}
  .chip-ico{opacity:.6;flex-shrink:0}
  .loading{display:flex;justify-content:center;padding:40px 0;color:var(--text-soft);font-size:14px}
</style>
</head>
<body>

<div id="gate" class="gate" style="display:none">
  <h2 id="gateTitle">Sign in required</h2>
  <p id="gateMsg">Please sign in to the LDAH dashboard first, then come back to this page.</p>
  <a id="gateBtn" href="/LDAH-Int/">Open LDAH Dashboard</a>
</div>

<div id="app" style="display:none">
  <header>
    <div class="hdr-top">
      <img src="logo_blue.png" alt="LDAH" onerror="this.style.display='none'">
      <h1>NH Survey <span>&middot; Live</span></h1>
    </div>
    <div class="hdr-count"><span id="count">0</span><small>submissions</small></div>
    <div class="hdr-row">
      <div class="hdr-updated"><span class="dot" id="dot"></span><span id="updated">Connecting&hellip;</span></div>
      <button id="refreshBtn" type="button">&#x21BB; Refresh</button>
    </div>
  </header>
  <main>
    <div id="err" class="err" style="display:none"></div>
    <div id="list" class="loading">Loading&hellip;</div>
  </main>
</div>

<script>
(function(){
  const firebaseConfig = {
    apiKey: "AIzaSyAU3CQ07bCVKlJ1qGak-150kaJEyPKldLk",
    authDomain: "ldah-932d5.firebaseapp.com",
    projectId: "ldah-932d5",
    storageBucket: "ldah-932d5.firebasestorage.app",
    messagingSenderId: "662130454003",
    appId: "1:662130454003:web:437576d5a5811ecd8df686"
  };
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  const $ = (id) => document.getElementById(id);
  let lastUpdate = 0;
  let unsub = null;

  function showGate(title, msg){
    $('app').style.display = 'none';
    $('gate').style.display = 'block';
    $('gateTitle').textContent = title;
    $('gateMsg').textContent = msg;
  }
  function showApp(){
    $('gate').style.display = 'none';
    $('app').style.display = 'block';
  }
  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function fmtHST(ts){
    if (!ts || !ts.toDate) return '—';
    try {
      return ts.toDate().toLocaleString('en-US', {
        timeZone: 'Pacific/Honolulu', month: 'short', day: 'numeric',
        hour: 'numeric', minute: '2-digit', hour12: true
      }) + ' HST';
    } catch(e) { return '—'; }
  }
  function ago(ms){
    const s = Math.floor((Date.now() - ms) / 1000);
    if (s < 5) return 'Just now';
    if (s < 60) return s + 's ago';
    const m = Math.floor(s / 60);
    if (m < 60) return m + 'm ago';
    const h = Math.floor(m / 60);
    return h + 'h ago';
  }
  function tickUpdated(){
    if (!lastUpdate) return;
    const s = Math.floor((Date.now() - lastUpdate) / 1000);
    $('updated').textContent = 'Last updated ' + ago(lastUpdate);
    const dot = $('dot');
    dot.classList.remove('amber','red');
    if (s > 120) dot.classList.add('red');
    else if (s > 30) dot.classList.add('amber');
  }
  setInterval(tickUpdated, 10000);

  function render(docs){
    $('count').textContent = docs.length;
    const list = $('list');
    list.classList.remove('loading');
    if (!docs.length){
      list.innerHTML = '<div class="empty">No submissions yet.<br>Pull to refresh once submissions come in.</div>';
      return;
    }
    let html = '';
    docs.forEach(function(d){
      const data = d.data();
      const when = fmtHST(data.submittedAt);
      const name = (data.contactFullName || '').trim();
      const email = (data.contactEmail || '').trim();
      const phone = (data.contactPhone || '').trim();
      html += '<div class="card">';
      html += '<div class="when">' + escapeHtml(when) + '</div>';
      if (name) html += '<div class="name">' + escapeHtml(name) + '</div>';
      else html += '<div class="name anon">&mdash; anonymous &mdash;</div>';
      if (email || phone){
        html += '<div class="chips">';
        if (email) html += '<a class="chip" href="mailto:' + escapeHtml(email) + '"><span class="chip-ico">&#9993;</span>' + escapeHtml(email) + '</a>';
        if (phone) html += '<a class="chip" href="tel:' + escapeHtml(phone.replace(/[^\d+]/g,'')) + '"><span class="chip-ico">&#9742;</span>' + escapeHtml(phone) + '</a>';
        html += '</div>';
      }
      html += '</div>';
    });
    list.innerHTML = html;
  }

  function attachListener(){
    if (unsub) { try { unsub(); } catch(e){} }
    $('err').style.display = 'none';
    unsub = db.collection('nativeHawaiianSurveys')
      .orderBy('submittedAt', 'desc')
      .onSnapshot(function(snap){
        lastUpdate = Date.now();
        render(snap.docs);
        tickUpdated();
      }, function(err){
        console.error('Snapshot error', err);
        $('err').textContent = 'Connection error: ' + (err.message || err.code || 'unknown');
        $('err').style.display = 'block';
        $('dot').classList.remove('amber'); $('dot').classList.add('red');
      });
  }

  $('refreshBtn').addEventListener('click', function(){
    const btn = $('refreshBtn');
    btn.disabled = true;
    const orig = btn.innerHTML;
    btn.innerHTML = '<span class="spin">&#x21BB;</span> Refreshing';
    attachListener();
    setTimeout(function(){ btn.disabled = false; btn.innerHTML = orig; }, 700);
  });

  auth.onAuthStateChanged(async function(user){
    if (!user){
      showGate('Sign in required', 'Please sign in to the LDAH dashboard first, then come back to this page.');
      return;
    }
    try {
      const roleDoc = await db.collection('userRoles').doc(user.uid).get();
      const role = roleDoc.exists ? roleDoc.data().role : null;
      if (role !== 'superAdmin' && role !== 'admin'){
        showGate('Not authorized', 'Your account does not have admin access for this page.');
        return;
      }
      showApp();
      attachListener();
    } catch(e){
      console.error(e);
      showGate('Error', 'Could not verify your account. Try reloading.');
    }
  });
})();
</script>
</body>
</html>
