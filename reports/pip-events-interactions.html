<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>One-off Events and Interactions</title>
<!-- Code only. The report itself holds family details, so it lives in private
     Storage (trainingPrivate/pip-events-interactions/report.html, no storage
     rule = client-denied) and getTrainingImageUrls hands a 2-hour signed URL to
     signed-in LDAH staff only (never partners or the public). 2026-10-13. -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<style>
:root{--bg:#F8FAFC;--card:#fff;--ink:#0F172A;--soft:#64748B;--line:#E2E8F0;--acc:#0E7490}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1220;--card:#111A2E;--ink:#E2E8F0;--soft:#94A3B8;--line:#24324D;--acc:#22D3EE}}
:root[data-theme="dark"]{--bg:#0B1220;--card:#111A2E;--ink:#E2E8F0;--soft:#94A3B8;--line:#24324D;--acc:#22D3EE}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px 28px;max-width:520px;width:100%}
h1{font-size:1.25rem;margin:0 0 8px}p{margin:0 0 10px;color:var(--soft)}a{color:var(--acc);font-weight:700}
</style></head><body>
<div class="card"><h1>One-off events and interactions: PIP and LDAH compared</h1>
<p id="msg">Checking your LDAH-Int sign-in…</p></div>
<script>
firebase.initializeApp({apiKey:'AIzaSyAU3CQ07bCVKlJ1qGak-150kaJEyPKldLk',authDomain:'ldah-932d5.firebaseapp.com',projectId:'ldah-932d5',
  storageBucket:'ldah-932d5.firebasestorage.app',messagingSenderId:'662130454003',appId:'1:662130454003:web:437576d5a5811ecd8df686'});
const msg=document.getElementById('msg');
const SIGNIN='Sign in to <a href="../index.html">LDAH-Int</a> first, then open this link again.';
firebase.auth().onAuthStateChanged(async function(u){
  if(!u||u.isAnonymous){msg.innerHTML=SIGNIN;return}
  msg.textContent='Signed in. Opening the report, this can take a few seconds…';
  try{
    const r=await fetch('https://us-central1-ldah-932d5.cloudfunctions.net/getTrainingImageUrls',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({idToken:await u.getIdToken(),deckId:'pip-events-interactions'})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||'Could not open the report.');
    const url=(d.urls||{})['report.html'];
    if(!url)throw new Error('The report could not be found.');
    location.replace(url);
  }catch(e){msg.textContent=(e&&e.message)||'Could not open the report.'}
});
</script></body></html>
