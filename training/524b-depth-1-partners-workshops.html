<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>524B In Depth, Part 1: Working with Partners and Parent Workshops — Training</title>
<link rel="stylesheet" href="deck-base.css">
<!-- Same Firebase build as the dashboard, so the deck shares its sign-in and records progress. -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
/* 524B In Depth, Part 1 of 4 (2026-11-25). For LDAH staff AND Pacific partners: no staff names.
   Definitions follow the "524B Measures: Definitions for Staff Training" doc, with the
   suggested answers in its Decisions table (approved by Daniel 2026-11-25).
   Every screen is drawn in CSS. Every class starts with rb- or qz-. */
.rb-pink{position:absolute;background:#FDF2F8;border:2px solid #F9A8D4;border-radius:16px;box-shadow:0 14px 36px rgba(15,23,42,.14);padding:14px 18px;opacity:0;font-family:Arial,Helvetica,sans-serif}
.rb-pink .t{font-size:13px;font-weight:900;color:#BE185D;letter-spacing:.06em;text-transform:uppercase}
.rb-pink h4{margin:4px 0 2px;font-size:19px;color:#0B3A53}
.rb-pink .hlp{font-size:13px;color:#64748B;margin:0 0 8px;line-height:1.35}
.rb-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px}
.rb-c{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#1E293B;background:#fff;border:1.5px solid #FBCFE8;border-radius:8px;padding:4px 7px;transition:all .3s}
.rb-c i{width:17px;height:17px;border:2px solid #BE185D;border-radius:4px;flex:none;position:relative;background:#fff}
.rb-c.on i{background:#BE185D}.rb-c.on i::after{content:"";position:absolute;left:4px;top:0;width:5px;height:10px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.rb-c.on{border-color:#BE185D;background:#FFF1F7;box-shadow:0 0 0 3px rgba(190,24,93,.15)}
.rb-c b{color:#BE185D;min-width:32px}
.rb-field{background:#fff;border:1.5px solid #E2E8F0;border-radius:8px;padding:6px 10px;font-size:15px;color:#334155;margin-bottom:8px}
.rb-field small{display:block;font-size:11px;font-weight:800;color:#64748B;text-transform:uppercase;letter-spacing:.04em}
.rb-card{position:absolute;background:#fff;border-radius:16px;box-shadow:0 10px 26px rgba(15,23,42,.1);padding:14px 18px;opacity:0}
.rb-card h4{margin:0 0 6px;font-size:20px;color:#0B3A53}
.rb-card p,.rb-card li{font-size:16px;color:#334155;line-height:1.4;margin:0 0 6px}
.rb-card ul{margin:0;padding-left:20px}
.rb-card .code{display:inline-block;font-weight:900;color:#fff;background:#BE185D;border-radius:6px;padding:0 7px;margin-right:6px;font-size:14px}
.rb-card.warn{border-left:8px solid #F59E0B}.rb-card.ok{border-left:8px solid #15803D}.rb-card.info{border-left:8px solid #0891B2}.rb-card.no{border-left:8px solid #DC2626}
.rb-card .lab{font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
.rb-card.ok .lab{color:#15803D}.rb-card.no .lab{color:#B91C1C}.rb-card.info .lab{color:#0E7490}.rb-card.warn .lab{color:#B45309}
.rb-card.ms p{font-size:15px;margin:0}
.rb-head{position:absolute;left:70px;top:132px;width:540px;background:#BE185D;color:#fff;border-radius:16px;padding:14px 20px;opacity:0;box-shadow:0 10px 26px rgba(190,24,93,.25)}
.rb-head .cd{font-size:44px;font-weight:900;line-height:1}
.rb-head .nm{font-size:22px;font-weight:800;margin-top:4px}
.rb-quote{font-style:italic;color:#334155}
.rb-quote::before{content:"\201C"}.rb-quote::after{content:"\201D"}
.rb-tg{display:flex;gap:10px;margin-top:8px}
.rb-tg span{font-size:14px;font-weight:800;color:#0B3A53;background:#ECFEFF;border:1.5px solid #A5F3FC;border-radius:999px;padding:3px 12px}
.rb-ev{position:absolute;background:#fff;border-radius:14px;box-shadow:0 10px 26px rgba(15,23,42,.1);padding:14px 18px;opacity:0;width:350px}
.rb-ev .k{font-size:12px;font-weight:900;color:#D63384;letter-spacing:.06em;text-transform:uppercase}
.rb-ev h5{margin:3px 0 8px;font-size:18px;color:#0B3A53;line-height:1.25}
.rb-ev .tick{display:inline-block;font-size:14px;font-weight:800;color:#BE185D;background:#FFF1F7;border:1.5px solid #F9A8D4;border-radius:999px;padding:2px 10px;margin:0 6px 6px 0;opacity:0}
.rb-ev .tick.none{color:#475569;background:#F1F5F9;border-color:#CBD5E1}
.rb-ev p{font-size:14.5px;color:#475569;margin:6px 0 0;line-height:1.35}
.rb-flow{position:absolute;left:70px;top:150px;width:1140px;display:grid;grid-template-columns:1fr 60px 1fr 60px 1fr;align-items:center}
.rb-flow .st{background:#fff;border-radius:16px;box-shadow:0 10px 26px rgba(15,23,42,.1);padding:18px;min-height:250px;opacity:0;border-top:8px solid #BE185D}
.rb-flow .st.b{border-top-color:#0E7490}.rb-flow .st.c{border-top-color:#15803D}
.rb-flow .st h4{margin:0 0 8px;font-size:21px;color:#0B3A53}
.rb-flow .st p{font-size:16.5px;color:#475569;line-height:1.42;margin:0}
.rb-flow .ar{font-size:40px;color:#94A3B8;text-align:center;opacity:0}
.rb-role{position:absolute;top:150px;width:360px;height:420px;background:#fff;border-radius:18px;box-shadow:0 10px 26px rgba(15,23,42,.1);padding:18px 20px;opacity:0;border-top:10px solid #BE185D}
.rb-role .big{font-size:40px;font-weight:900;color:#BE185D}
.rb-role h4{margin:2px 0 10px;font-size:22px;color:#0B3A53}
.rb-role p{font-size:16.5px;color:#334155;line-height:1.42;margin:0 0 10px}
.rb-role .q{font-size:15px;font-weight:800;color:#0E7490;background:#ECFEFF;border-radius:10px;padding:8px 10px}
.rb-evname{transition:all .3s}
/* ---------- quiz (qz- prefix) ---------- */
.scene.quiz{background:linear-gradient(135deg,#FDF2F8,#E0F7FA)}
.qz-wrap{position:absolute;left:0;top:0;right:0;bottom:0}
.qz-intro{position:absolute;left:120px;top:190px;width:1040px;text-align:center;font-size:30px;font-weight:800;color:#0B3A53;line-height:1.35;animation:rise .5s both}
.qz-intro small{display:block;font-size:20px;color:#475569;font-weight:700;margin-top:14px}
.qz-card{position:absolute;left:120px;top:130px;width:1040px;background:#fff;border-radius:20px;box-shadow:0 18px 40px rgba(15,23,42,.14);padding:22px 30px;animation:rise .5s both}
.qz-n{font-size:14px;font-weight:900;color:var(--pink);letter-spacing:.08em;text-transform:uppercase}
.qz-q{font-size:25px;font-weight:800;line-height:1.25;margin:6px 0 16px}
.qz-o{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;font-size:20px;font-weight:700;background:#F8FAFC;border:3px solid #E2E8F0;border-radius:14px;padding:11px 16px;margin-bottom:10px;cursor:pointer;transition:border-color .2s,background .2s;color:var(--ink)}
.qz-o:hover:not([disabled]){border-color:#0891B2;background:#F0F9FF}
.qz-o[disabled]{cursor:default}
.qz-o .qz-L{width:38px;height:38px;border-radius:50%;background:#0E7490;color:#fff;display:flex;align-items:center;justify-content:center;flex:none;font-weight:900}
.qz-o.qz-no{border-color:#DC2626;background:#FEF2F2;animation:qzshake .4s}.qz-o.qz-no .qz-L{background:#DC2626}
.qz-o.qz-yes{border-color:#16A34A;background:#F0FDF4}.qz-o.qz-yes .qz-L{background:#16A34A}
.qz-fb{min-height:30px;font-size:18px;font-weight:700;margin-top:4px}.qz-fb.good{color:#15803D}.qz-fb.bad{color:#B91C1C}
.qz-stars{position:absolute;right:60px;top:46px;display:flex;gap:8px}
.qz-stars i{width:32px;height:32px;background:#E2E8F0;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);transition:background .3s}
.qz-stars i.on{background:#F59E0B;animation:popn .6s}
@keyframes qzshake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
</style></head><body>
<div id="view"><div id="stage"><div id="nbar"><i></i></div>
<div id="scenes"></div>
<div id="spot"></div>
<svg id="cursor" viewBox="0 0 28 32"><path d="M3 2 L3 26 L9.5 19.5 L14 29 L18.5 27 L14 17.5 L23 17.5 Z" fill="#fff" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/></svg>
</div></div>
<div id="cap" aria-live="polite"></div>
<div id="bar">
 <button id="prev">Back</button><button id="play">Start</button><button id="next">Next</button>
 <div id="dots"></div>
 <button id="capbtn" aria-pressed="false">Captions</button><button id="voice" aria-pressed="true">Voice on</button>
</div>
<script>
const DECK_ID='524b-depth-1';

const LOGO='../logo_blue.png';
const LOGOBOX=`<div style="position:absolute;left:70px;top:22px;background:#fff;border-radius:14px;padding:6px 10px;box-shadow:0 4px 14px rgba(0,0,0,.18);animation:rise .6s both"><img src="${LOGO}" alt="LDAH" style="height:80px;display:block"></div>`;
function all(s){return[...document.querySelectorAll('.scene.on '+s)]}
const show=(e,ms=500)=>anim(e,[{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],ms,'ease-out').then(()=>{e.style.opacity=1});
const PTS=(items,top=140)=>`<div class="abs" style="left:790px;top:${top}px;width:440px"><ul class="pts">${items.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;

/* All 20 boxes, exactly as DAN shows them (window._ES_M524 in index.html; 4.a and 4.b added 2026-11-19). */
const M=[['1.a','Co-sponsored event'],['1.b','Co-presentation'],['1.c','Materials at a collaborative event'],
 ['2.a','IDEA / IEP / rights workshop'],['2.b','Transition workshop'],['2.c','Workshop materials'],
 ['3.a','Connect-Gen / Learning Lab / SMART'],['3.b','Parent Talk Cafe'],['3.c','Tips and Tools'],
 ['4.a','Individual assistance (TA and mentoring)'],['4.b','Focused Support Planning (case advocacy)'],
 ['5.a','Workgroup, task force or advisory group'],['5.b','Parents as Partners volunteers'],
 ['6.a','Workshop for professionals'],['6.b','Rights information to professionals'],
 ['Y1.a','Youth conference'],['Y1.b','Youth materials: college, career, transition'],['Y2.a','Skillz Lab'],
 ['Y2.b','Youth materials: IEP, ADR, literacy, SEL'],['Y3.a','Youth Synergy']];
const BOXES=(on=[])=>`<div class="rb-grid">${M.map(([c,l])=>`<div class="rb-c${on.includes(c)?' on':''}" data-c="${c}"><i></i><b>${c}</b><span>${l}</span></div>`).join('')}</div>`;
const PINK=(l,t,w,extra='')=>`<div class="rb-pink k-pink" style="left:${l}px;top:${t}px;width:${w}px">${extra}<div class="t">Staff report</div><h4>524B measures</h4><p class="hlp">Tick what this counts toward on the 524B Status Chart. With none ticked, the chart decides from the title and tier.</p>${BOXES()}</div>`;
const box=c=>q(`.rb-c[data-c="${c}"]`);
const tick=async c=>{const b=box(c);await move(b,600);click();b.classList.add('on');await wait(220)};
const clearTicks=()=>all('.rb-c.on').forEach(b=>b.classList.remove('on'));
const setEv=async t=>{const e=q('.k-evname span');e.style.opacity=0;await wait(200);e.textContent=t;e.style.opacity=1};

/* One measure, one screen: header + federal wording + plain words on the left; four cards on the right. */
const MEASURE=d=>HEAD(d.kick,d.title)+`
 <div class="rb-head k-h"><div class="cd">${d.code}</div><div class="nm">${d.name}</div></div>
 <div class="rb-card k-w" style="left:70px;top:262px;width:540px"><div class="lab" style="color:#BE185D">Federal wording</div><p class="rb-quote">${d.fed}</p>
  <div class="rb-tg"><span>Hawai&#x2BB;i PTI: ${d.hi}</span><span>Pacific PTI: ${d.pip}</span></div></div>
 <div class="rb-card info k-p" style="left:70px;top:${d.pTop||520}px;width:540px"><div class="lab">In plain words</div><p style="font-size:18px;font-weight:700;color:#0B3A53">${d.plain}</p></div>
 <div class="rb-card ok ms k-t" style="left:640px;top:132px;width:570px"><div class="lab">Tick it when</div><p>${d.yes}</p></div>
 <div class="rb-card no ms k-n" style="left:640px;top:${d.nTop||266}px;width:570px"><div class="lab">Don&rsquo;t tick it when</div><p>${d.no}</p></div>
 <div class="rb-card info ms k-c" style="left:640px;top:${d.cTop||400}px;width:570px"><div class="lab">What the chart counts</div><p>${d.count}</p></div>
 <div class="rb-card warn ms k-x" style="left:640px;top:${d.xTop||534}px;width:570px"><div class="lab">Watch out for</div><p>${d.watch}</p></div>`;
const MSTEPS=s=>[
 {say:s[0],act:async()=>{await show(q('.k-h'));await show(q('.k-w'))}},
 {say:s[1],act:async()=>{await show(q('.k-p'));spot(q('.k-p'),4)}},
 {say:s[2],act:async()=>{spot(null);await show(q('.k-t'))}},
 {say:s[3],act:async()=>{await show(q('.k-n'))}},
 {say:s[4],act:async()=>{await show(q('.k-c'))}},
 {say:s[5],act:async()=>{await show(q('.k-x'));spot(q('.k-x'),4)}}];

/* ---- quiz: the standard ask()/QUIZ pair. Each answer goes to ldahTrack.quiz(sec,i,correct). ---- */
window.QUIZ_TOTAL=5;
function ask(Q,i,sec){const w=q('.qz-wrap');
 w.innerHTML=`<div class="qz-card"><div class="qz-n">Question ${i+1} of 5</div><div class="qz-q">${Q.q}</div>${Q.o.map((o,j)=>`<button class="qz-o" data-j="${j}"><span class="qz-L">${'ABC'[j]}</span><span>${o}</span></button>`).join('')}<div class="qz-fb"></div></div>`;
 const card=w.firstChild,fb=card.querySelector('.qz-fb'),btns=[...card.querySelectorAll('.qz-o')];
 const finish=()=>{btns.forEach(b=>b.disabled=true);btns[Q.a].classList.add('qz-yes');const st=document.querySelectorAll('.scene.on .qz-stars i')[i];if(st)st.classList.add('on');fb.className='qz-fb good';fb.textContent='Yes! '+Q.y};
 if(FAST){finish();return Promise.resolve()}
 return new Promise(res=>{btns.forEach((b,j)=>b.onclick=async()=>{
  if(b.disabled)return;
  if(window.ldahTrack)ldahTrack.quiz(sec,i,j===Q.a);
  if(j===Q.a){finish();const p=pos(b);confetti(p.x+60,p.y+20,70);await speak('Yes! '+Q.y,run);await wait(700);res()}
  else{b.disabled=true;b.classList.add('qz-no');fb.className='qz-fb bad';fb.textContent='Not quite. '+Q.n+' Try again.';speak('Not quite. '+Q.n+' Try again.',run)}})})}
const QUIZ=(sec,qs)=>({cls:'quiz',html:()=>HEAD('Quick check','Your turn!')+`<div class="qz-stars">${qs.map(()=>'<i></i>').join('')}</div><div class="qz-wrap"><div class="qz-intro">Five real events.<small>Pick the boxes you would tick. Your first answer to each one counts.</small></div></div>`,
 steps:[{say:'Quick check. Five real events. Pick the boxes you would tick. Your first answer to each one counts.'},
  ...qs.map((Q,i)=>({say:`Question ${i+1}. ${Q.q}`,act:()=>ask(Q,i,sec)}))]});

const SC=[
// ================= 1. COVER =================
{cls:'cover',html:()=>`${LOGOBOX}<div class="brand">Leadership in Disabilities &amp; Achievement of Hawaiʻi · LDAH and Pacific partners</div><div class="hello">Hi <span class="nm"></span></div>
 <h1>524B In Depth</h1><p class="sub" style="top:300px"><b>Part 1 of 4: Working with Partners and Parent Workshops.</b><br>What boxes 1.a to 2.c really mean, when to tick them, and how to tick several on one event.</p>
 <div style="position:absolute;left:820px;top:110px;width:390px;transform:rotate(3deg);animation:bob 6s ease-in-out infinite;z-index:3"><div class="rb-pink" style="position:relative;opacity:1;padding:12px 14px"><div class="t">Staff report</div><h4 style="font-size:17px">524B measures</h4>
  <div class="rb-grid" style="grid-template-columns:1fr">${M.slice(0,6).map(([c,l],i)=>`<div class="rb-c${(i===0||i===4)?' on':''}" style="font-size:12.5px"><i></i><b>${c}</b><span>${l}</span></div>`).join('')}</div></div></div>
 <div class="spark" style="left:790px;top:90px">${SPARK}</div><div class="spark" style="left:1200px;top:560px;animation-delay:1s">${SPARK}</div>
 <div class="gate" style="top:500px"><button class="btn" data-go="start">Start training</button><button class="btn ghost" data-go="skip">Skip for now</button><label><input type="checkbox" id="voiceChk" checked> Read it out loud to me</label></div>${WAVES}`,
 steps:[{say:"Hi {name}! Welcome to 524B In Depth, part 1 of 4. This part is for LDAH staff and our Pacific partners. It goes deep on the first six boxes: Group 1, working with other organizations, and Group 2, workshops for parents. You will also learn how to tick several boxes on one event. You can pause, go back, or watch again any time."}]},

// ================= 2. THE ONE RULE =================
{html:()=>HEAD('Before we start','The one rule behind every box')+`<div class="rb-flow">
 <div class="st k-s1"><h4>You tick boxes</h4><p>On the <b>Event Summary</b> or the <b>One-Off Event</b> form, in the pink <b>524B measures</b> box.</p></div><div class="ar k-a1">&rarr;</div>
 <div class="st b k-s2"><h4>Only the ticks count</h4><p>A ticked event counts toward <b>exactly</b> the boxes you ticked, <b>and nothing else</b>. DAN stops guessing from the title.</p></div><div class="ar k-a2">&rarr;</div>
 <div class="st c k-s3"><h4>So tick every box that fits</h4><p>Miss one, and that measure never sees the event. Tick one that doesn&rsquo;t fit, and the event lands in the wrong measure.</p></div></div>
 <div class="rb-card info k-s4" style="left:70px;top:470px;width:1140px"><p>This is why the definitions matter. Each box has a federal meaning. When everyone ticks by the same meaning, the report we send the U.S. Department of Education is right.</p></div>`,
 steps:[{say:"Before we start, here is the one rule behind every box. You tick the boxes in the pink 524B measures box, on the Event Summary or the One-Off Event form.",act:async()=>{await show(q('.k-s1'))}},
 {say:"Once you tick anything, the event counts toward exactly the boxes you ticked, and nothing else. DAN stops guessing from the title.",act:async()=>{await show(q('.k-a1'),300);await show(q('.k-s2'))}},
 {say:"So tick every box that fits. If you miss one, that measure never sees the event. If you tick one that doesn’t fit, the event lands in the wrong measure.",act:async()=>{await show(q('.k-a2'),300);await show(q('.k-s3'));spot(q('.k-s3'),4)}},
 {say:"That is why the definitions matter. Each box has a federal meaning. When everyone ticks by the same meaning, the report we send the U.S. Department of Education is right.",act:async()=>{spot(null);await show(q('.k-s4'))}}]},

// ================= 3. GROUP 1 OVERVIEW: OUR ROLE =================
{html:()=>HEAD('Group 1','Working with other organizations: what was our role?')+`
 <div class="rb-role k-r1" style="left:70px"><div class="big">1.a</div><h4>We hosted it together</h4><p>We planned and ran a training <b>with</b> another organization.</p><div class="q">Did a partner share the planning, the room or the costs?</div></div>
 <div class="rb-role k-r2" style="left:460px;border-top-color:#0E7490"><div class="big" style="color:#0E7490">1.b</div><h4>We presented</h4><p>We co-led a workshop with a partner, <b>or</b> we presented at <b>their</b> event.</p><div class="q">Did our staff stand up and teach, with or for a partner?</div></div>
 <div class="rb-role k-r3" style="left:850px;border-top-color:#15803D"><div class="big" style="color:#15803D">1.c</div><h4>We handed out materials</h4><p>Our materials went out at an event run <b>with</b> or <b>by</b> others, like a booth.</p><div class="q">Was it someone else&rsquo;s event, and we gave out materials?</div></div>`,
 steps:[{say:"Group 1 is about working with other organizations. All three boxes are about doing the work together with someone else. The difference is our role.",act:async()=>{}},
 {say:"[1.a|1 A]: we hosted it together. We planned and ran a training with another organization, like a school, an agency or another nonprofit.",act:async()=>{await show(q('.k-r1'))}},
 {say:"[1.b|1 B]: we presented. Our staff co-led a workshop with a partner, or we presented at the partner’s own event.",act:async()=>{await show(q('.k-r2'))}},
 {say:"[1.c|1 C]: we handed out materials at an event run with others or by others. A booth at a resource fair is the classic example.",act:async()=>{await show(q('.k-r3'))}}]},

// ================= 4. 1.a =================
{html:()=>MEASURE({kick:'Group 1 · In depth',title:'1.a Co-sponsored event',code:'1.a',name:'Co-sponsored event',
 fed:'Through identification of collaborative partners and community stakeholders, provide co-sponsored training events reaching 450 parents, family members and professionals.',
 hi:'450 people',pip:'500 people',pTop:540,
 plain:'A training event we planned and hosted together with another organization.',
 yes:'A transition night we ran with a high school. A workshop we hosted with an agency or another nonprofit. A training where a partner shared the planning, the room or the costs.',
 no:'We only borrowed or rented the room. The partner only advertised it. We had a booth at their event (that&rsquo;s 1.c). It wasn&rsquo;t a training.',
 count:'The people at the event: parents, family members and professionals. <b>Only counts if ticked.</b> DAN can&rsquo;t tell from a title that an event was shared.',
 watch:'Forgetting to tick it. This measure stays at zero unless someone ticks 1.a.'}),
 steps:MSTEPS([
 "[1.a|1 A], Co-sponsored event. The federal wording says we will provide co-sponsored training events with collaborative partners, reaching 450 people for Hawaiʻi and 500 for the Pacific.",
 "In plain words: a training event we planned and hosted together with another organization.",
 "Tick it when we ran it together. A transition night with a high school, a workshop with an agency or another nonprofit, or a training where the partner shared the planning, the room or the costs.",
 "Don’t tick it when we only borrowed the room, when the partner only advertised it, or when we just had a booth at their event. A booth is [1.c|1 C]. And it has to be a training.",
 "The chart counts the people at the event: parents, family members and professionals. And it only counts if ticked. DAN can’t tell from a title that an event was shared.",
