<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>524B In Depth, Part 3: Professionals and Youth — Training</title>
<link rel="stylesheet" href="deck-base.css">
<!-- Same Firebase build as the dashboard, so the deck shares its sign-in and records progress. -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
/* 524B In Depth Part 3 (2026-11-25), built from report-checkboxes.html.
   For LDAH staff AND Pacific partners (Daniel 2026-11-13): no Aloha/Mahalo, no staff names.
   Every screen is drawn in CSS from live DAN v154.74. Every class starts with rb- or qz-. */
.rb-pink{position:absolute;background:#FDF2F8;border:2px solid #F9A8D4;border-radius:16px;box-shadow:0 14px 36px rgba(15,23,42,.14);padding:16px 20px;opacity:0;font-family:Arial,Helvetica,sans-serif}
.rb-pink .t{font-size:13px;font-weight:900;color:#BE185D;letter-spacing:.06em;text-transform:uppercase}
.rb-pink h4{margin:4px 0 2px;font-size:20px;color:#0B3A53}
.rb-pink .hlp{font-size:13.5px;color:#64748B;margin:0 0 10px;line-height:1.35}
.rb-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.rb-c{display:flex;align-items:center;gap:8px;font-size:14px;color:#1E293B;background:#fff;border:1.5px solid #FBCFE8;border-radius:8px;padding:5px 8px;transition:all .3s}
.rb-c i{width:18px;height:18px;border:2px solid #BE185D;border-radius:4px;flex:none;position:relative;background:#fff}
.rb-c.on i{background:#BE185D}.rb-c.on i::after{content:"";position:absolute;left:4px;top:0;width:5px;height:10px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.rb-c.on{border-color:#BE185D;background:#FFF1F7}
.rb-c b{color:#BE185D;min-width:34px}
.rb-c.dim{opacity:.35}
.rb-field{background:#fff;border:1.5px solid #E2E8F0;border-radius:8px;padding:6px 10px;font-size:14px;color:#334155;margin-bottom:8px}
.rb-field small{display:block;font-size:11px;font-weight:800;color:#64748B;text-transform:uppercase;letter-spacing:.04em}
.rb-card{position:absolute;background:#fff;border-radius:16px;box-shadow:0 10px 26px rgba(15,23,42,.1);padding:16px 20px;opacity:0}
.rb-card h4{margin:0 0 8px;font-size:21px;color:#0B3A53}
.rb-card p,.rb-card li{font-size:16.5px;color:#334155;line-height:1.42;margin:0 0 7px}
.rb-card ul{margin:0;padding-left:20px}
.rb-card .code{display:inline-block;font-weight:900;color:#fff;background:#BE185D;border-radius:6px;padding:0 7px;margin-right:6px;font-size:14px}
.rb-card.y .code{background:#7C3AED}.rb-card.p .code{background:#0E7490}
.rb-card.warn{border-left:8px solid #F59E0B}.rb-card.ok{border-left:8px solid #15803D}.rb-card.info{border-left:8px solid #0891B2}
.rb-ev{position:absolute;background:#fff;border-radius:14px;box-shadow:0 10px 26px rgba(15,23,42,.1);padding:14px 18px;opacity:0;width:350px}
.rb-ev .k{font-size:12px;font-weight:900;color:#D63384;letter-spacing:.06em;text-transform:uppercase}
.rb-ev h5{margin:3px 0 8px;font-size:19px;color:#0B3A53;line-height:1.25}
.rb-ev .tick{display:inline-block;font-size:14px;font-weight:800;color:#BE185D;background:#FFF1F7;border:1.5px solid #F9A8D4;border-radius:999px;padding:2px 10px;margin:0 6px 6px 0;opacity:0}
.rb-ev .tick.none{color:#475569;background:#F1F5F9;border-color:#CBD5E1}
.rb-ev p{font-size:14.5px;color:#475569;margin:6px 0 0;line-height:1.35}
.rb-flow{position:absolute;left:70px;top:150px;width:1140px;display:grid;grid-template-columns:1fr 60px 1fr 60px 1fr;align-items:center}
.rb-flow .st{background:#fff;border-radius:16px;box-shadow:0 10px 26px rgba(15,23,42,.1);padding:18px;min-height:250px;opacity:0;border-top:8px solid #BE185D}
.rb-flow .st.b{border-top-color:#0E7490}.rb-flow .st.c{border-top-color:#15803D}
.rb-flow .st h4{margin:0 0 8px;font-size:21px;color:#0B3A53}
.rb-flow .st p{font-size:16.5px;color:#475569;line-height:1.42;margin:0}
.rb-flow .ar{font-size:40px;color:#94A3B8;text-align:center;opacity:0}
.rb-mt{position:absolute;background:#fff;border:1.5px solid #CBD5E1;border-radius:16px;box-shadow:0 14px 36px rgba(15,23,42,.14);padding:16px 20px;opacity:0;font-family:Arial,Helvetica,sans-serif}
.rb-mt h4{margin:0 0 10px;font-size:19px;color:#0B3A53}
.rb-pills{display:flex;flex-wrap:wrap;gap:7px}
.rb-pill{font-size:14px;font-weight:700;color:#334155;border:1.5px solid #CBD5E1;border-radius:999px;padding:5px 12px;background:#fff;transition:all .3s}
.rb-pill.on{background:#0E7490;border-color:#0E7490;color:#fff}
.rb-sel{display:flex;gap:8px;align-items:center;margin-bottom:12px;font-size:14px}
.rb-sel span{font-weight:800;color:#64748B;text-transform:uppercase;font-size:11px;letter-spacing:.04em}
.rb-sel b{border:1.5px solid #0E7490;border-radius:8px;padding:5px 10px;color:#0E7490;background:#ECFEFF}
/* ---------- quiz (qz- prefix) ---------- */
.scene.quiz{background:linear-gradient(135deg,#FDF2F8,#E0F7FA)}
.qz-wrap{position:absolute;left:0;top:0;right:0;bottom:0}
.qz-intro{position:absolute;left:120px;top:190px;width:1040px;text-align:center;font-size:30px;font-weight:800;color:#0B3A53;line-height:1.35;animation:rise .5s both}
.qz-intro small{display:block;font-size:20px;color:#475569;font-weight:700;margin-top:14px}
.qz-card{position:absolute;left:120px;top:138px;width:1040px;background:#fff;border-radius:20px;box-shadow:0 18px 40px rgba(15,23,42,.14);padding:22px 30px;animation:rise .5s both}
.qz-n{font-size:14px;font-weight:900;color:var(--pink);letter-spacing:.08em;text-transform:uppercase}
.qz-q{font-size:27px;font-weight:800;line-height:1.25;margin:6px 0 16px}
.qz-o{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;font-size:21px;font-weight:700;background:#F8FAFC;border:3px solid #E2E8F0;border-radius:14px;padding:11px 16px;margin-bottom:10px;cursor:pointer;transition:border-color .2s,background .2s;color:var(--ink)}
.qz-o:hover:not([disabled]){border-color:#0891B2;background:#F0F9FF}
.qz-o[disabled]{cursor:default}
.qz-o .qz-L{width:38px;height:38px;border-radius:50%;background:#0E7490;color:#fff;display:flex;align-items:center;justify-content:center;flex:none;font-weight:900}
.qz-o.qz-no{border-color:#DC2626;background:#FEF2F2;animation:qzshake .4s}.qz-o.qz-no .qz-L{background:#DC2626}
.qz-o.qz-yes{border-color:#16A34A;background:#F0FDF4}.qz-o.qz-yes .qz-L{background:#16A34A}
.qz-fb{min-height:30px;font-size:19px;font-weight:700;margin-top:4px}.qz-fb.good{color:#15803D}.qz-fb.bad{color:#B91C1C}
.qz-stars{position:absolute;right:60px;top:46px;display:flex;gap:8px}
.qz-stars i{width:36px;height:36px;background:#E2E8F0;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);transition:background .3s}
.qz-stars i.on{background:#F59E0B;animation:popn .6s}
@keyframes qzshake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.rb-fed{font-size:15.5px;color:#475569;font-style:italic;background:#F8FAFC;border-left:4px solid #94A3B8;padding:7px 11px;border-radius:6px;margin:0 0 9px;line-height:1.38}
.rb-tg{display:inline-block;font-size:12px;font-weight:900;color:#fff;background:#B45309;border-radius:999px;padding:2px 9px;margin-left:6px;vertical-align:2px;text-transform:uppercase;letter-spacing:.04em}
.rb-card .lbl{font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:#64748B;margin:0 0 3px}
.rb-vs{position:absolute;font-size:30px;font-weight:900;color:#94A3B8;opacity:0}
.rb-bar{display:flex;height:34px;border-radius:8px;overflow:hidden;margin:8px 0 6px;font-size:14px;font-weight:800;color:#fff}
.rb-bar span{display:flex;align-items:center;justify-content:center}
</style></head><body>
<div id="view"><div id="stage"><div id="nbar"><i></i></div>
<div id="scenes"></div>
<div id="spot"></div>
<svg id="cursor" viewBox="0 0 28 32"><path d="M3 2 L3 26 L9.5 19.5 L14 29 L18.5 27 L14 17.5 L23 17.5 Z" fill="#fff" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/></svg>
</div></div>
<div id="cap" aria-live="polite"></div>
<div id="bar">
 <button id="prev">Back</button><button id="play">Start</button><button id="next">Next</button>
 <div id="dots"></div>
 <button id="capbtn" aria-pressed="false">Captions</button><button id="voice" aria-pressed="true">Voice on</button>
</div>
<script>
const DECK_ID='524b-depth-3';

const LOGO='../logo_blue.png';
const LOGOBOX=`<div style="position:absolute;left:70px;top:22px;background:#fff;border-radius:14px;padding:6px 10px;box-shadow:0 4px 14px rgba(0,0,0,.18);animation:rise .6s both"><img src="${LOGO}" alt="LDAH" style="height:80px;display:block"></div>`;
function all(s){return[...document.querySelectorAll('.scene.on '+s)]}
const show=(e,ms=500)=>anim(e,[{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],ms,'ease-out').then(()=>{e.style.opacity=1});
const PTS=(items,top=140)=>`<div class="abs" style="left:790px;top:${top}px;width:440px"><ul class="pts">${items.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;

/* All 20 boxes, exactly as DAN shows them (window._ES_M524 in index.html; 4.a/4.b added 2026-11-19, 5.a/5.b 2026-11-13). */
const M=[['1.a','Co-sponsored event'],['1.b','Co-presentation'],['1.c','Materials at a collaborative event'],
 ['2.a','IDEA / IEP / rights workshop'],['2.b','Transition workshop'],['2.c','Workshop materials'],
 ['3.a','Connect-Gen / Learning Lab / SMART'],['3.b','Parent Talk Cafe'],['3.c','Tips and Tools'],
 ['4.a','Individual assistance (TA and mentoring)'],['4.b','Focused Support Planning (case advocacy)'],
 ['5.a','Workgroup, task force or advisory group'],['5.b','Parents as Partners volunteers'],
 ['6.a','Workshop for professionals'],['6.b','Rights information to professionals'],
 ['Y1.a','Youth conference'],['Y1.b','Youth materials: college, career, transition'],['Y2.a','Skillz Lab'],
 ['Y2.b','Youth materials: IEP, ADR, literacy, SEL'],['Y3.a','Youth Synergy']];
const BOXES=(on=[])=>`<div class="rb-grid">${M.map(([c,l])=>`<div class="rb-c${on.includes(c)?' on':''}" data-c="${c}"><i></i><b>${c}</b><span>${l}</span></div>`).join('')}</div>`;
const PINK=(l,t,w,extra='')=>`<div class="rb-pink k-pink" style="left:${l}px;top:${t}px;width:${w}px;padding:12px 16px">${extra}<div class="t">Staff report</div><h4>524B measures</h4><p class="hlp">Tick what this counts toward on the 524B Status Chart. With none ticked, the chart decides from the title and tier.</p>${BOXES()}</div>`;
const box=c=>q(`.rb-c[data-c="${c}"]`);
const tick=async c=>{const b=box(c);await move(b,700);click();b.classList.add('on');await wait(250)};
const untickAll=()=>all('.rb-c.on').forEach(b=>b.classList.remove('on'));

/* One measure, one scene: federal wording + plain words + what the chart counts (left), tick / don't tick (right), watch out (bottom left). */
const MEAS=(o)=>HEAD(o.kick,o.title)+`
 <div class="rb-card ${o.cls||''} k-m1" style="left:58px;top:120px;width:712px;height:350px">
  <h4><span class="code">${o.code}</span>${o.name}${o.tag?'<span class="rb-tg">Only counts if ticked</span>':''}</h4>
  <div class="lbl">The federal wording</div><p class="rb-fed">&ldquo;${o.fed}&rdquo;</p>
  <div class="lbl">In plain words</div><p><b>${o.plain}</b></p>
  <div class="lbl">What the chart counts</div><p>${o.counts}</p></div>
 <div class="rb-card warn k-m4" style="left:58px;top:488px;width:712px;height:150px"><h4>Watch out for</h4><p>${o.watch}</p></div>
 <div class="rb-card ok k-m2" style="left:790px;top:120px;width:430px;height:255px"><h4>Tick it when</h4><ul>${o.yes.map(t=>`<li>${t}</li>`).join('')}</ul></div>
 <div class="rb-card k-m3" style="left:790px;top:390px;width:430px;height:248px;border-left:8px solid #DC2626"><h4>Don&rsquo;t tick it when</h4><ul>${o.no.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
const MSTEPS=(s)=>[
 {say:s[0],act:async()=>{await show(q('.k-m1'));spot(q('.k-m1 .rb-fed'),4)}},
 {say:s[1],act:async()=>{spot(null);await show(q('.k-m2'))}},
 {say:s[2],act:async()=>{await show(q('.k-m3'))}},
 {say:s[3],act:async()=>{await show(q('.k-m4'));spot(q('.k-m4'),4)}}];

/* ---- quiz: the standard ask()/QUIZ pair, five questions. Each answer goes to ldahTrack.quiz(sec,i,correct). ---- */
window.QUIZ_TOTAL=5;
function ask(Q,i,sec){const w=q('.qz-wrap');
 w.innerHTML=`<div class="qz-card"><div class="qz-n">Question ${i+1} of 5</div><div class="qz-q" style="font-size:24px">${Q.q}</div>${Q.o.map((o,j)=>`<button class="qz-o" style="font-size:19px" data-j="${j}"><span class="qz-L">${'ABC'[j]}</span><span>${o}</span></button>`).join('')}<div class="qz-fb"></div></div>`;
 const card=w.firstChild,fb=card.querySelector('.qz-fb'),btns=[...card.querySelectorAll('.qz-o')];
 const finish=()=>{btns.forEach(b=>b.disabled=true);btns[Q.a].classList.add('qz-yes');const st=document.querySelectorAll('.scene.on .qz-stars i')[i];if(st)st.classList.add('on');fb.className='qz-fb good';fb.textContent='Yes! '+Q.y};
 if(FAST){finish();return Promise.resolve()}
 return new Promise(res=>{btns.forEach((b,j)=>b.onclick=async()=>{
  if(b.disabled)return;
  if(window.ldahTrack)ldahTrack.quiz(sec,i,j===Q.a);
  if(j===Q.a){finish();const p=pos(b);confetti(p.x+60,p.y+20,70);await speak('Yes! '+Q.y,run);await wait(700);res()}
  else{b.disabled=true;b.classList.add('qz-no');fb.className='qz-fb bad';fb.textContent='Not quite. '+Q.n+' Try again.';speak('Not quite. '+Q.n+' Try again.',run)}})})}
const QUIZ=(sec,qs)=>({cls:'quiz',html:()=>HEAD('Quick check','Your turn!')+`<div class="qz-stars">${qs.map(()=>'<i></i>').join('')}</div><div class="qz-wrap"><div class="qz-intro">Five real events. Which boxes?<small>Your first answer to each one counts. Click the answer you think is right.</small></div></div>`,
 steps:[{say:'Quick check. Five real events. Pick the boxes you would tick. Your first answer to each one counts.'},
  ...qs.map((Q,i)=>({say:`Question ${i+1}. ${Q.q}`,act:()=>ask(Q,i,sec)}))]});

const SC=[
// ================= 1. COVER =================
{cls:'cover',html:()=>`${LOGOBOX}<div class="brand">Leadership in Disabilities &amp; Achievement of Hawaiʻi · LDAH and Pacific partners</div><div class="hello">Hi <span class="nm"></span></div>
 <h1>524B In Depth</h1><p class="sub" style="top:356px">Part 3 of 4: Professionals and Youth. What 6.a, 6.b and the five Y boxes really mean, when to tick each one, and when one event needs several boxes.</p>
 <div style="position:absolute;left:820px;top:110px;width:390px;transform:rotate(3deg);animation:bob 6s ease-in-out infinite;z-index:3"><div class="rb-pink" style="position:relative;opacity:1;padding:12px 14px"><div class="t">Staff report</div><h4 style="font-size:17px">524B measures</h4>
  <div class="rb-grid" style="grid-template-columns:1fr">${M.slice(13).map(([c,l],i)=>`<div class="rb-c${(i===0||i===1||i===4||i===5)?' on':''}" style="font-size:12.5px"><i></i><b>${c}</b><span>${l}</span></div>`).join('')}</div></div></div>
 <div class="spark" style="left:790px;top:90px">${SPARK}</div><div class="spark" style="left:1200px;top:560px;animation-delay:1s">${SPARK}</div>
 <div class="gate" style="top:500px"><button class="btn" data-go="start">Start training</button><button class="btn ghost" data-go="skip">Skip for now</button><label><input type="checkbox" id="voiceChk" checked> Read it out loud to me</label></div>${WAVES}`,
 steps:[{say:"Hi {name}! This is 524B In Depth, part 3 of 4, for LDAH staff and our Pacific partners. It covers the boxes for professionals and for youth: what each one really means, when to tick it, and when one event needs several boxes. You can pause, go back, or watch again any time."}]},

// ================= 2. THE ONE RULE =================
{html:()=>HEAD('Before we start','The rule that matters most')+`<div class="rb-flow">
 <div class="st k-s1"><h4>A tick is exact</h4><p>When an event has <b>any</b> box ticked, the 524B Status Chart counts it toward <b>only the ticked boxes</b>. Nothing else.</p></div><div class="ar k-a1">&rarr;</div>
 <div class="st b k-s2"><h4>So tick every box that fits</h4><p>One event is often <b>two, three or four</b> measures. A training for teachers where you left rights handouts is <b>6.a and 6.b</b>.</p></div><div class="ar k-a2">&rarr;</div>
 <div class="st c k-s3"><h4>And only what fits</h4><p>A wrong tick moves people to the wrong measure. <b>Not sure?</b> Leave the boxes empty and the chart decides from the title and tier.</p></div></div>
 <div class="rb-card info k-s4" style="left:70px;top:440px;width:1140px"><p>This part: <b>6.a</b> and <b>6.b</b> for professionals, then <b>Y1.a, Y1.b, Y2.a, Y2.b and Y3.a</b> for youth. Parts 1 and 2 cover the parent and family boxes. Part 4 puts all 20 together.</p></div>`,
 steps:[{say:"Before we start, the rule that matters most. When an event has any box ticked, the 524B Status Chart counts it toward only the ticked boxes, and nothing else.",act:async()=>{await show(q('.k-s1'))}},
 {say:"So tick every box that fits. One event is often two, three or four measures. A training for teachers where you left rights handouts is [6.a|6 A] and [6.b|6 B].",act:async()=>{await show(q('.k-a1'),300);await show(q('.k-s2'));spot(q('.k-s2'),4)}},
 {say:"And tick only what fits. A wrong tick moves people to the wrong measure. If you are not sure, leave the boxes empty, and the chart decides from the title and tier.",act:async()=>{spot(null);await show(q('.k-a2'),300);await show(q('.k-s3'))}},
 {say:"In this part: [6.a|6 A] and [6.b|6 B] for professionals, then the five Y boxes for youth. Parts 1 and 2 cover the parent and family boxes, and part 4 puts all 20 together.",act:async()=>{await show(q('.k-s4'))}}]},

// ================= 3. 6.a =================
{html:()=>MEAS({kick:'Group 6 · Professionals',title:'6.a Workshop for professionals',cls:'p',code:'6.a',name:'Workshop for professionals',
 fed:'Provide workshops on IDEA 2004, HAR Chapter 60, school readiness screening, family engagement, behavioral supports, alternative dispute resolution, reaching 400 professionals.',
 plain:'We trained teachers, school staff, doctors, therapists or agency staff.',
 counts:'The <b>professionals</b> who attended. Target: 400 on the Hawaiʻi chart, 300 on the Pacific chart. With nothing ticked, the chart also finds it from the title.',
 yes:['A training for a school&rsquo;s teachers','A talk for pediatric or early intervention staff','A session for agency case workers'],
 no:['Most of the room were <b>parents</b>: that&rsquo;s Group 2','We only handed out materials: that&rsquo;s 6.b','We sat on their committee: that&rsquo;s 5.a'],
 watch:'A parent workshop with a few teachers in the room is <b>still Group 2</b>. Group 6 is about who the training was <b>for</b>.'}),
 steps:MSTEPS(["[6.a|6 A] is a workshop for professionals. Our grant promises workshops on IDEA, the Hawaii rules, school readiness, family engagement, behavior support and dispute resolution, reaching 400 professionals. In plain words: we trained teachers, school staff, doctors, therapists or agency staff. The chart counts the professionals who came.",
 "Tick it for a training for a school’s teachers, a talk for pediatric or early intervention staff, or a session for agency case workers.",
 "Don’t tick it when most of the room were parents. That’s Group 2. If we only handed out materials, that’s [6.b|6 B]. And if we sat on their committee, that’s 5.a.",
 "Watch out. A parent workshop with a few teachers in the room is still Group 2. Group 6 is about who the training was for."])},

// ================= 4. 6.b =================
{html:()=>MEAS({kick:'Group 6 · Professionals',title:'6.b Rights information to professionals',cls:'p',code:'6.b',name:'Rights information to professionals',tag:true,
 fed:'Disseminate information about special education rights, responsibilities and protections, and parent participation in school meetings, to 750 other professionals.',
 plain:'Professionals got written information about families&rsquo; rights and how families take part in school meetings.',
 counts:'The <b>professionals</b> who received it. Target: 750 Hawaiʻi, 800 Pacific. <b>DAN can&rsquo;t find it from a title.</b> If nobody ticks it, it stays at zero.',
 yes:['Rights handouts left at a <b>6.a</b> training: tick both','Materials sent to a school or agency','Our booth at a professional conference'],
 no:['The materials went to <b>families</b>: that&rsquo;s 1.c, 2.c or 3.c','The materials went to <b>youth</b>: that&rsquo;s Y1.b or Y2.b'],
 watch:'Forgetting <b>6.b</b> next to <b>6.a</b>. The training and the handouts are two separate measures, and 6.b only counts when ticked.'}),
 steps:MSTEPS(["[6.b|6 B] is rights information to professionals. The grant promises information about special education rights and parent participation in school meetings, reaching 750 other professionals. In plain words: professionals got written information about families’ rights. DAN can’t find this from a title, so it only counts when you tick it.",
 "Tick it when you left rights handouts at a [6.a|6 A] training, and tick both. Or when we sent materials to a school or agency, or had a booth at a professional conference.",
 "Don’t tick it when the materials went to families. That’s [1.c|1 C], [2.c|2 C] or [3.c|3 C]. And if they went to youth, that’s [Y1.b|Y 1 B] or [Y2.b|Y 2 B].",
 "Watch out for forgetting [6.b|6 B] next to [6.a|6 A]. The training and the handouts are two separate measures."])},
