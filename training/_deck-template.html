<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DECK TITLE — Training</title>
<link rel="stylesheet" href="deck-base.css">
<style>
/* Deck-specific mock UI only. deck-base.css already gives you:
   .cover .brand .hello h1 .sub .gate .btn  — cover slide
   .paper .spark .waves                     — cover decoration
   .dash .side .tabs .nav .main .search      — mock Int dashboard shell
   .win .tb .files .file .key .dragghost     — mock Finder window + drag
   .mini .status .ok                         — thumbnail strip + scan line
   .dc .badge .fname .days .consent .fg .fl .flag .fi  — draft/record card
   .row .inp .find .hint .sel2 .from .intro .cb .mut   — form bits
   .bub .anno .stamp                         — callouts, handwriting, red stamp
   ul.pts > li                               — the right-hand bullet list
   .band .ctrs .ctr .shot                    — My Day header band
   .tl .tick .mk .count                      — animated timeline
   .cl .ci .bx                               — recap checklist
   #spot #cursor .ripple .conf #nbar #bar #cap  — engine chrome
   Colors: --ink --soft --teal --teal2 --pink --bg --line --deep --amber
   Animations: rise fade bob twinkle drift scan blink rot popn bnc rip ring  */
</style></head><body>
<div id="view"><div id="stage"><div id="nbar"><i></i></div>
<div id="scenes"></div>
<div id="spot"></div>
<svg id="cursor" viewBox="0 0 28 32"><path d="M3 2 L3 26 L9.5 19.5 L14 29 L18.5 27 L14 17.5 L23 17.5 Z" fill="#fff" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/></svg>
</div></div>
<div id="cap" aria-live="polite"></div>
<div id="bar">
 <button id="prev">Back</button><button id="play">Start</button><button id="next">Next</button>
 <div id="dots"></div>
 <button id="capbtn" aria-pressed="false">Captions</button><button id="voice" aria-pressed="true">Voice on</button>
</div>
<script>
const DECK_ID='deck-slug-2026-09';

/* ---- deck-specific builders: draw the real screen in HTML/CSS, never a screenshot ---- */
// const thing=()=>`<div class="...">...</div>`;

const SC=[
// ---- COVER ----
{cls:'cover',html:()=>`<div class="brand">Leadership in Disabilities &amp; Achievement of Hawaiʻi</div><div class="hello">Aloha <span class="nm"></span></div>
 <h1>Deck title</h1><p class="sub">One-line promise. About N minutes.</p>
 <div class="gate"><button class="btn" data-go="start">Start training</button><button class="btn ghost" data-go="skip">Skip for now</button><label><input type="checkbox" id="voiceChk" checked> Read it out loud to me</label></div>${WAVES}`,
 steps:[{say:'Aloha {name}! ...'}]},

// ---- A TEACHING SCENE ----
{html:()=>HEAD('Step 1','What they do first')+`<div class="abs" style="left:58px;top:120px">MOCK UI HERE</div>
 <div class="abs" style="left:790px;top:150px;width:440px"><ul class="pts"><li>Point one.</li><li>Point two.</li></ul></div>`,
 // init:()=>{ /* set scene state before the first step */ },
 steps:[
 {say:'Narration for point one.',li:0,act:async()=>{spot(q('.something'),6)}},
 {say:'Narration for point two.',li:1,act:async()=>{const b=q('.btn2');await move(b,900);await click(b);hideCursor();spot(null)}}]},

// ---- RECAP ----
{html:()=>HEAD('Recap','Your checklist')+`<div class="cl">${['Step one','Step two'].map(t=>`<div class="ci"><div class="bx"><svg viewBox="0 0 26 26"><path d="M5 13 L11 19 L21 7"/></svg></div><span>${t}</span></div>`).join('')}</div>`,steps:[
 {say:'Let’s recap.',act:async()=>{for(const c of document.querySelectorAll('.scene.on .ci')){c.classList.add('on');await wait(160)}}},
 ...['Step one.','Step two.'].map((s,i)=>({say:s,act:async()=>{const cs=document.querySelectorAll('.scene.on .ci');cs.forEach((c,j)=>{c.classList.add('on');if(j<i)c.classList.add('done')});await wait(700);cs[i].classList.add('done')}}))]},

// ---- MAHALO ----
{cls:'cover',html:()=>`<div class="brand">Deck title</div><div class="hello">All done</div><h1>Mahalo<span class="nmc"></span>!</h1><p class="sub">One-line takeaway. Come back and watch it again any time.</p>
 <div class="gate" style="top:460px"><button class="btn ghost" data-go="again">Watch again</button><button class="btn" data-go="close">Close</button></div>${WAVES}`,
 steps:[{say:'Mahalo {name}! ...',act:async()=>{await wait(400);confetti(640,300,140)}}]}
];
</script>
<script src="deck-engine.js"></script></body></html>
