</div></div>

</div>
<script>
const DECK_ID='adding-people-the-right-way-2026-09';

/* Every screen below is drawn in HTML/CSS from the live dashboard (v151.50).
   Every person here is made up; nobody real appears. Emails use example.org. */
const EVN='Family Fun Day';
const P={
 malia:['Malia Tupou','malia.tupou@example.org','684-555-0111'],
 kalena:['Kalena Mahoe','LDAH staff',''],
 ana:['Ana Tupou','ana.tupou@example.org','684-555-0122'],
 tavita:['Tavita Leiataua','tavita.l@example.org','684-555-0134'],
 pua:['Pua Tuilagi','pua.tuilagi@example.org','684-555-0156']};

/* ---- small helpers ---- */
const tap=async(s,ms=850)=>{const e=typeof s==='string'?q(s):s;await move(e,ms);await click(e);return e};
function all(s){return[...document.querySelectorAll('.scene.on '+s)]}
const show=(e,ms=500)=>anim(e,[{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],ms,'ease-out');
/* A red or green message that stays until the next one, so it can be read. */
function toast(msg,kind){all('.toast').forEach(t=>t.remove());const t=add(`<div class="toast${kind?' '+kind:''}">${msg}</div>`);pop(t);return t}
const clearToast=()=>all('.toast').forEach(t=>t.remove());

/* ---- section cover + road map ---- */
const STOPS=['Search first','Adding someone new','Counting people without an email'];
const ROAD=n=>`<div class="road">${STOPS.map((s,i)=>`<div class="stop ${i+1<n?'done':i+1===n?'now':''}"><i>${i+1<n?'✓':i+1}</i>${s}</div>`).join('')}</div>`;
const SECT=(n,title,sub,say)=>({cls:'cover sect',html:()=>`<div class="bign">${n}</div><div class="brand">Part ${n} of 3</div><h1>${title}</h1><p class="sub">${sub}</p>${ROAD(n)}${WAVES}`,steps:[{say}]});

/* ---- quiz ---- */
function ask(Q,i,sec){const w=q('.qwrap');
 w.innerHTML=`<div class="qcard"><div class="qn">Question ${i+1}</div><div class="qq">${Q.q}</div>${Q.o.map((o,j)=>`<button class="qo" data-j="${j}"><span class="L">${'ABC'[j]}</span><span>${o}</span></button>`).join('')}<div class="qfb"></div></div>`;
 const card=w.firstChild,fb=card.querySelector('.qfb'),btns=[...card.querySelectorAll('.qo')];
 const finish=()=>{btns.forEach(b=>b.disabled=true);btns[Q.a].classList.add('yes');const st=all('.stars i')[i];if(st)st.classList.add('on');fb.className='qfb good';fb.textContent='Yes! '+Q.y};
 if(FAST){finish();return Promise.resolve()}
 return new Promise(res=>{btns.forEach((b,j)=>b.onclick=async()=>{
  if(b.disabled)return;
  if(window.ldahTrack)ldahTrack.quiz(sec,i,j===Q.a);
  if(j===Q.a){finish();const p=pos(b);confetti(p.x+60,p.y+20,70);await speak('Yes! '+Q.y,run);await wait(700);res()}
  else{b.disabled=true;b.classList.add('no');fb.className='qfb bad';fb.textContent='Not quite. '+Q.n+' Try again.';speak('Not quite. '+Q.n+' Try again.',run)}})})}
/* The first quiz explains how quizzes work; later ones just start. */
const QUIZ=(sec,qs,first)=>({cls:'quiz',html:()=>HEAD('Quick check · '+sec,'Your turn!')+`<div class="stars">${qs.map(()=>'<i></i>').join('')}</div><div class="qwrap"><div class="qintro">${qs.length} quick question${qs.length>1?'s':''}.${first?'<small>Click the answer you think is right. If you miss, you can try again. No one sees your score.</small>':''}</div></div>${first?'<div class="qhelp">Take your time. The next question waits for you.</div>':''}`,
 steps:[{say:first?`Quick check! ${qs.length} question${qs.length>1?'s':''}. Click the answer you think is right. If you miss, just try again. Nobody sees your score.`:`Quick check. ${qs.length} question${qs.length>1?'s':''}.`},
  ...qs.map((Q,i)=>({say:`Question ${i+1}. ${Q.q}`,act:()=>ask(Q,i,sec)}))]});

/* ---- the event window (bottom half of the one-off / upcoming event form) ---- */
const aRow=p=>`<div class="ap-row"><span><b>${p[0]}</b><small>${p[1]}</small></span><span><span class="ap-up">Update</span><span class="ap-x">×</span></span></div>`;
const inp=(v,ph,cls='')=>`<div class="ap-in ${cls}${v?'':' ph'}">${v||ph}</div>`;
const NCB=o=>`<div class="ap-ncb" style="display:${o.nc?'block':'none'}"><div class="ap-g2">${inp(o.ncName,'Full name','k-nn')}${inp('Parent/Guardian','','sel k-nt')}${inp(o.ncPhone,'Phone','k-np')}${inp(o.ncEmail,'Email','k-ne')}</div><div class="ap-need">An email is required. No email? Count them in the TOTAL box instead.</div><span class="ap-ca">Create &amp; add</span></div>`;
const EVW=o=>{o=o||{};const at=o.att||[];return `<div class="ap-w"><div class="ap-h"><span>${o.title||'Edit One-Off Event'}</span><span>×</span></div><div class="ap-v"><div class="ap-i" data-y="0">
 <div class="ap-ev"><div><label>Event name *</label>${inp(EVN)}</div><div><label>Date *</label>${inp('09/26/2026')}</div><div><label>Which island is this for? *</label>${inp('American Samoa','','sel')}</div></div>
 <div class="ap-skip">description, materials and comments are up here</div>
 <div class="ap-ah"><b>Attendees (<span class="ap-n">${at.length}</span>) · all marked attended</b><span class="ap-nc">+ New contact</span></div>
 <div class="ap-sw"><div class="ap-srch ph">Search contacts by name…</div></div>
 ${NCB(o)}
 <div class="ap-list">${at.length?at.map(aRow).join(''):'<div class="ap-emp">No attendees added yet.</div>'}</div>
 <div class="ap-tot"><label>How many people attended?</label><div class="ap-num${o.total?'':' ph'}">${o.total||'e.g. 24'}</div>
 <div class="ap-yn"><b>This is the TOTAL attendance</b>, including the people you marked attended above.<br>Example: 2 named above and 36 more with no names → enter 38.</div></div>
 <div style="height:20px"></div></div></div><div class="ap-ft"><span class="ap-cn">Cancel</span><span class="ap-sv">Save</span></div></div>`};
async function scrollW(to,ms=900){const inr=q('.ap-i')||q('.ap-ri');const vp=inr.parentElement;let y;
 if(to==='bottom')y=inr.scrollHeight-vp.clientHeight;else if(to&&to.nodeType)y=(to.getBoundingClientRect().top-inr.getBoundingClientRect().top)/scale-12;else y=to;
 y=Math.max(0,Math.min(y,inr.scrollHeight-vp.clientHeight));const from=+inr.dataset.y||0;
 await anim(inr,[{transform:`translateY(${-from}px)`},{transform:`translateY(${-y}px)`}],ms,'ease-in-out');inr.dataset.y=y}
function addAtt(p){const l=q('.ap-list');const e=l.querySelector('.ap-emp');if(e)e.remove();const r=el(aRow(p));l.appendChild(r);q('.ap-n').textContent=l.children.length;anim(r,[{opacity:0,transform:'translateX(-20px)'},{opacity:1,transform:'none'}],450,'ease-out');return r}
async function searchPick(word,rows,pick){const s=q('.ap-srch');await tap(s,700);await type(s,word,90);
 const dd=el(`<div class="ap-dd">${rows.map(r=>`<div><b>${r[0]}</b>${r[1]==='LDAH staff'?'<span class="ap-stf">LDAH staff</span>':`<small>${r[1]}</small>`}</div>`).join('')}</div>`);s.parentElement.appendChild(dd);await wait(500);
 if(pick==null)return dd;const row=dd.children[pick];await move(row,600);row.classList.add('hi');await click(row);await wait(200);dd.remove();s.textContent='Search contacts by name…';s.classList.add('ph');return addAtt(rows[pick])}
async function openNC(){const b=q('.ap-ncb');if(b.style.display!=='block'){await tap(q('.ap-nc'),700);b.style.display='block';await anim(b,[{opacity:0,transform:'scaleY(.6)'},{opacity:1,transform:'none'}],400,'ease-out')}}
async function fill(sel,text,ms=45){const e=q(sel);await tap(e,550);await type(e,text,ms);return e}
/* She leaves the email box: the live screen checks it right away (v151.49). */
async function leaveEmail(msg){const e=q('.k-ne');await move(q('.k-np'),500);await click(null);if(msg){e.classList.add('red');toast(msg,'bad')}else{e.classList.remove('red');clearToast()}}

/* ---- Update panel for an attendee (live: cmsOoEditAttendee, v150.11) ---- */
const DISL=['ADD-ADHD','Autism Spectrum (ASD)','Deaf/Hard of Hearing','Developmental Disability','Emotional Disability','Gifted','Intellectual Disability','Multiple Disabilities','No IDEA Disability','Orthopedic (Physical)','Other Health Disability','Specific Learning Disability','Speech or Language','Suspected','Traumatic Brain Injury','Visual (incl. blindness)','Deaf/Blindness'];
const EDP=p=>`<div class="ap-ed"><div class="ap-edh">Now add ${p[0]}’s details for the Event Report.</div><div class="ap-g2">${inp(p[2])}${inp(p[1])}</div><div class="ap-edn">Add or correct their phone and email.</div>
 <div style="margin-bottom:8px">${inp('','Child’s name','k-kid')}</div><div class="ap-g2">${inp('','— Child’s ethnicity —','sel k-eth')}${inp('','— Child age range —','sel k-age')}${inp('','— Child gender —','sel k-gen')}${inp('','— How they heard about LDAH —','sel k-how')}${inp('','— Military status —','sel')}${inp('','Zip code','k-zip')}</div>
 <div class="ap-dl">Child’s disability categories</div><div class="ap-dis">${DISL.map(d=>`<span data-d="${d}"><i></i>${d}</span>`).join('')}</div>
 <span class="ap-stc">Save to contact</span><span class="ap-ccl">Cancel</span></div>`;
async function pickFrom(target,opts,choice){const p=pos(target);const d=add(`<div class="ap-pick" style="left:${p.x}px;top:${p.y+p.h+2}px;width:${Math.max(p.w,200)}px">${opts.map(o=>`<div>${o}</div>`).join('')}</div>`);
 await wait(350);const row=[...d.children].find(x=>x.textContent===choice);await move(row,600);row.classList.add('hi');await click(row);await wait(200);d.remove();
 target.textContent=choice;target.classList.remove('ph')}

/* ---- contacts: family card views ---- */
const CLIST=()=>`<div class="ap-ch"><span>Contacts</span></div><div class="ap-cb"><div class="ap-srch ph k-cs">Search contacts by name, email, phone, type, org…</div><div class="ap-clist" style="margin-top:10px"></div></div>`;
const CDET=sp=>`<div class="ap-ch"><span>Malia Tupou</span><span>×</span></div><div class="ap-cb">
 <div class="ap-fact"><label>Type</label><div>Parent/Guardian</div></div>
 <div class="ap-fact"><label>Email</label><div><a>malia.tupou@example.org</a></div></div>

 <div class="ap-fact"><label>Location</label><div>American Samoa</div></div></div>
 <div class="ap-cfb"><span class="ap-b2">Close</span><span class="ap-bp k-ed">Edit Contact</span></div>`;
const CFORM=()=>`<div class="ap-ch"><span>Edit Contact</span><span>×</span></div><div class="ap-cf">
 <div><label>First Name *</label>${inp('Malia')}</div><div><label>Last Name *</label>${inp('Tupou')}</div>
 <div class="ap-s2"><label>Type *</label><div class="ap-pills"><span class="on">Parent/Guardian</span><span>Professional</span><span>Organization/Agency</span><span>Student</span></div></div>
 <div><label>Email</label>${inp('malia.tupou@example.org')}</div><div><label>Phone</label>${inp('684-555-0111')}</div>
 <div class="ap-sec">Second parent / guardian</div>
 <div><label>First name</label>${inp('','Optional','k-f1')}</div><div><label>Last name</label>${inp('','Optional','k-f2')}</div>

/* ---- duplicate window ---- */
const DG=(sub,row)=>`<div class="k-dgw"><div class="ap-dim"></div><div class="ap-dg"><div class="ap-dgh"><div class="ap-ic">!</div><div><b>This contact may already exist</b><span class="k-sub">${sub}</span></div></div>

const AGES=['Birth-2','3-5','6-12','13-18','Beyond H.S.'];

 </div></div></div>`;
const drow=k=>all('.ap-rw tr').find(r=>r.dataset.k===k);
async function enterNum(k,v){const r=drow(k);const b=r.querySelector('.ap-bxn');spot(r,3);await tap(b,650);b.classList.remove('ph');await type(b,String(v),160);
 const a=r.querySelector('.ap-auto');a.textContent=`Auto: ${AUTO[k]||0} (entered)`;a.classList.add('ent');anim(a,[{transform:'scale(1.3)'},{transform:'none'}],500)}

/* ---- people figures ---- */
const PPL=(named,tags)=>Array.from({length:named.length?23:0},(_,i)=>`<div class="ap-pp hid${i<3?' nmd':''}">${i<3?`<span class="ap-ptag">${tags[i]}</span>`:''}</div>`).join('');

const SC=[
// ================= COVER =================
{cls:'cover',html:()=>`<div class="brand">Leadership in Disabilities &amp; Achievement of Hawaiʻi · Pacific Island Partners</div><div class="hello">Aloha <span class="nm"></span></div>
 <h1>Adding people the right way</h1><p class="sub">Search first. One person, one card, one email. Count everyone else in the TOTAL. Three short parts, a quick quiz after each.</p>
 <div class="pipglow"></div><div class="piplogo"><img src="pip-logo.png" alt="Pacific Island Partners"></div>
 ${[[740,110,0],[1190,150,.8],[1210,400,1.6],[760,420,.4],[980,80,1.2]].map(p=>`<div class="pipspk" style="left:${p[0]}px;top:${p[1]}px;animation-delay:${p[2]}s">${SPARK}</div>`).join('')}
 <div class="gate"><button class="btn" data-go="start">Start training</button><button class="btn ghost" data-go="skip">Skip for now</button><label><input type="checkbox" id="voiceChk" checked> Read it out loud to me</label></div>${WAVES}`,
 steps:[{say:'Aloha {name}! Welcome. This training is about adding people to your events the right way. There are three short parts, and a friendly quiz after each one. You can pause, go back, or watch again any time.'}]},

// ================= WHY =================
{html:()=>HEAD('Why this matters','Every name is a person we can reach')+`<div class="ap-why">
 <div class="ap-wc"><h4>A person we can reach</h4>${[P.malia,P.ana,P.tavita].map(p=>`<div class="ap-pr"><i>${p[0].split(' ').map(w=>w[0]).join('')}</i><div><b>${p[0]}</b><small>✉ ${p[1]}</small></div></div>`).join('')}<p>Every name on an attendance list is someone we can <b>reach</b> and <b>follow up</b> with.</p></div>
 <div class="ap-wc pu"><h4>One person = one card</h4><div class="ap-mc k-m1" style="top:62px">Malia Tupou<small>her card</small></div><div class="ap-mc k-m2" style="top:128px;opacity:.9">Malia Tupou<small>a second card?</small></div>
  <div class="ap-hist">${['Signups','Interactions','Case notes','Events'].map(h=>`<span>${h}</span>`).join('')}</div><p>One card keeps <b>all of her history together</b>.</p></div>
 <div class="ap-wc gy"><h4>Can’t reach them? Still counted.</h4><div class="ap-bigt"><small>TOTAL</small><span class="k-t">0</span></div><div class="ap-crowd">${Array.from({length:16},()=>'<div class="ap-pp hid"></div>').join('')}</div><p>People we cannot reach go in the event’s <b>TOTAL</b>. They still count.</p></div></div>
 <div class="ap-note"><b>Good to know:</b> older entries without an email were moved into each event’s TOTAL. The event’s numbers (age, ethnicity, disability) were kept exactly. <b>No attendance was lost.</b></div>`,
 steps:[{say:'Before we start, here is why this matters.',act:async()=>{}},
 {say:'Every name on an attendance list must be a person we can reach. Someone we can email, to follow up and help their family.',act:async()=>{const c=all('.ap-wc')[0];await show(c);spot(c,6)}},
 {say:'One person gets one card. When the same parent has two cards, their history is split in two. With one card, their signups, interactions and case notes all stay together.',act:async()=>{spot(null);const c=all('.ap-wc')[1];await show(c);const m2=q('.k-m2');await wait(400);await anim(m2,[{transform:'none',opacity:.9},{transform:'translateY(-66px)',opacity:0}],900,'ease-in-out');m2.style.opacity=0;for(const h of c.querySelectorAll('.ap-hist span')){await anim(h,[{opacity:0,transform:'scale(.4)'},{opacity:1,transform:'none'}],350);h.style.opacity=1}}},
 {say:'And people we cannot reach are still counted. They go in the event’s TOTAL. Nobody is left out.',act:async()=>{const c=all('.ap-wc')[2];await show(c);for(const p of c.querySelectorAll('.ap-pp')){p.classList.remove('hid');anim(p,[{opacity:0,transform:'scale(.3)'},{opacity:1,transform:'none'}],300);await wait(50)}await countTo(q('.k-t'),16,'',700)}},
 {say:'Good to know. Some older entries had no email. We moved them into each event’s TOTAL. The event’s numbers for age, ethnicity and disability were kept exactly. So no attendance was lost.',act:async()=>{const n=q('.ap-note');await show(n);n.style.opacity=1;spot(n,6)}}]},

// ================= PART 1 =================
SECT(1,'Search first','Before you add anyone, type their name in the search box. Most people are already there.','Part one. Search first. This one habit keeps every family on one card.'),

{html:()=>HEAD('Part 1 · The event window','Type the name. Click the person.')+EVW({})+`<div class="abs" style="left:790px;top:150px;width:440px"><ul class="pts">
 <li>Open your event. Scroll down to <b>Attendees</b>.</li><li>Type the name in <b>Search contacts by name…</b></li><li>They appear? <b>Click them.</b> Done.</li><li>Only if nobody appears, use <b>+ New contact</b>.</li></ul></div>`,
 steps:[{say:'This is your event window. Scroll down to the part called Attendees.',li:0,act:async()=>{await scrollW(q('.ap-ah'));spot(q('.ap-ah'),5)}},
 {say:'Here is the search box. It says, Search contacts by name. Always type the name here first. Let’s add Malia.',li:1,act:async()=>{spot(q('.ap-srch'),5);await wait(600);spot(null);await searchPick('Malia',[P.malia],null)}},
 {say:'Malia is already in the system. So just click her name.',li:2,act:async()=>{const row=q('.ap-dd div');await move(row,600);row.classList.add('hi');await click(row);q('.ap-dd').remove();const s=q('.ap-srch');s.textContent='Search contacts by name…';s.classList.add('ph');const r=addAtt(P.malia);await wait(300);spot(r,4)}},
 {say:'She is on the list, with her own card and her own history. No new card was made.',li:2,act:async()=>{hideCursor();toast('Malia Tupou added.')}},
 {say:'Only when nobody appears in the search, then use the blue New contact button. We will learn that in part two.',li:3,act:async()=>{clearToast();spot(q('.ap-nc'),6)}}]},

{html:()=>HEAD('Part 1 · When staff visit','LDAH staff are in the search too')+EVW({att:[P.malia]})+`<div class="abs" style="left:790px;top:150px;width:440px"><ul class="pts">
 <li>LDAH staff now show up in <b>Search contacts by name…</b></li><li>They have a purple <b>LDAH staff</b> tag.</li><li>Pick their card. <b>Never</b> make a new one for staff.</li></ul></div>`,
 init:()=>{},
 steps:[{say:'Sometimes LDAH staff visit your event. For example, Kalena from LDAH comes to help.',li:0,act:async()=>{await scrollW(q('.ap-ah'),1)}},
 {say:'LDAH staff now appear in the same search. Type Kalena.',li:0,act:async()=>{await searchPick('Kalena',[P.kalena],null)}},
 {say:'See the purple tag. LDAH staff. Staff are already in the system.',li:1,act:async()=>spot(q('.ap-stf'),5)},
 {say:'So click their card. Never make a new card for someone from LDAH.',li:2,act:async()=>{spot(null);const row=q('.ap-dd div');await move(row,600);row.classList.add('hi');await click(row);q('.ap-dd').remove();const s=q('.ap-srch');s.textContent='Search contacts by name…';s.classList.add('ph');const r=addAtt(P.kalena);hideCursor();await wait(300);spot(r,4)}}]},

QUIZ('Part 1',[
 {q:'A mother comes to your event. What do you do first?',o:['Click + New contact','Type her name in Search contacts by name…','Only count her in the TOTAL box'],a:1,y:'Always search first. She may already have a card.',n:'Most people are already in the system.'},
 {q:'Kalena from LDAH visits your event. How do you add her?',o:['Make a new card with her email','Search her name and pick her card','Leave her off the list'],a:1,y:'Staff are in the search. Pick their card.',n:'Look for the purple LDAH staff tag in the search.'}],true),

// ================= PART 2 =================
SECT(2,'Adding someone new','When the search finds nobody. One person, one card, their own email. The system now helps you get it right.','Part two. Adding someone new. The system now checks a few things for you, so let’s see each one.'),

{html:()=>HEAD('Part 2 · + New contact','Each person needs their own email')+EVW({att:[P.malia]})+`<div class="ap-fam">
 <div class="ap-fc"><b>Malia Tupou</b><code>malia.tupou@example.org</code><em>Her own email ✓</em></div>
 <div class="ap-fc bad"><b>Ana Tupou</b><code>malia.tupou@example.org</code><em>Needs her own email</em></div></div>
 <div class="abs" style="left:790px;top:150px;width:440px"><ul class="pts">
 <li>Click <b>+ New contact</b>. A small box opens.</li><li><b>Name</b>, <b>type</b> and <b>Email</b>. A phone is extra. Then <b>Create &amp; add</b>.</li><li>An email is <b>required</b>. Their <b>own</b> email.</li><li>Two people <b>cannot share</b> one email.</li></ul></div>`,
 init:()=>{all('.ap-fc').forEach(f=>f.style.opacity=0)},
 steps:[{say:'The search found nobody. Now click the blue New contact button.',li:0,act:async()=>{await scrollW(q('.ap-ah'),1);await openNC();spot(q('.ap-ncb'),5)}},
 {say:'The box has the name. The type, like Parent or Guardian. The phone, which is extra. And the email. Then the green button, Create and add.',li:1,act:async()=>{for(const s of ['.k-nn','.k-nt','.k-np','.k-ne','.ap-ca']){spot(q(s),4);await wait(650)}spot(null)}},
 {say:'Read the orange line under the boxes. An email is required. No email? Count them in the TOTAL box instead. A phone alone is not enough to add someone by name.',li:2,act:async()=>spot(q('.ap-need'),4)},
 {say:'So here is the most important rule. A new person needs their own email. Each person has their own.',li:2,act:async()=>{spot(null);const f=all('.ap-fc')[0];await show(f);f.style.opacity=1}},
 {say:'Two people cannot share one email. If Malia’s sister Ana uses Malia’s email, the system cannot tell them apart. For her own card, Ana needs her own email.',li:3,act:async()=>{const f=all('.ap-fc')[1];await show(f);f.style.opacity=1;spot(f,5)}}]},

{html:()=>HEAD('Part 2 · The system helps','A staff email')+EVW({att:[P.malia],nc:1})+`<div class="abs" style="left:790px;top:150px;width:440px"><ul class="pts">
 <li>An email that ends in <b>@ldahawaii.org</b> or <b>@ldah.org</b> belongs to staff.</li><li>The box turns red, with a message.</li><li>Search their name and pick them instead.</li></ul></div>`,
 steps:[{say:'What if you type a staff email in the new contact box? Watch.',li:0,act:async()=>{await scrollW(q('.ap-ncb'),1);await fill('.k-nn','Kalena Mahoe');await fill('.k-ne','kalena@ldahawaii.org',40)}},
 {say:'Any email that ends in at ldahawaii dot org, or at ldah dot org, belongs to LDAH staff.',li:0,act:async()=>spot(q('.k-ne'),4)},
 {say:'When you leave the email box, it turns red, and a message says: Staff are already in the system. Search their name and pick them.',li:1,act:async()=>{spot(null);await leaveEmail('Staff are already in the system. Search their name and pick them.')}},
 {say:'So clear the box, and go back to the search, like we learned in part one.',li:2,act:async()=>{for(const s of ['.k-nn','.k-ne']){const e=q(s);e.textContent=s==='.k-nn'?'Full name':'Email';e.classList.add('ph');e.classList.remove('red')}clearToast();q('.ap-ncb').style.display='none';await scrollW(q('.ap-ah'),600);await searchPick('Kalena',[P.kalena],0);hideCursor()}}]},

{html:()=>HEAD('Part 2 · The system helps','An email that is already on a card')+EVW({att:[P.malia],nc:1})+`<div class="abs" style="left:790px;top:150px;width:440px"><ul class="pts">
 <li>That email is already on someone’s card.</li><li>The box turns red when you leave it.</li><li>Ask for <b>their own</b> email. Same family? See the <b>Same family</b> screen, two screens on.</li></ul></div>`,
 steps:[{say:'Now Ana is here. She is new. But she gives Malia’s email.',li:0,act:async()=>{await scrollW(q('.ap-ncb'),1);await fill('.k-nn','Ana Tupou');await fill('.k-np','684-555-0122',40);await fill('.k-ne','malia.tupou@example.org',35)}},
 {say:'When you leave the email box, it turns red. The message says: That email already belongs to Malia Tupou. Each person needs their own email.',li:1,act:async()=>{await leaveEmail('That email already belongs to Malia Tupou. Each person needs their own email. Same family? Open Malia Tupou’s card, click Edit, and add them under Second parent / guardian (a name is enough).');hideCursor()}},
 {say:'Then it says: Same family? Open Malia Tupou’s card, click Edit, and add them under Second parent or guardian, with their own email. We will do that together, two screens from now.',li:1,act:async()=>spot(q('.toast'),4)},
 {say:'If the email is on more than one card, the message also names the others. It is also on, and then the names.',li:1,act:async()=>{spot(null);toast('That email already belongs to Malia Tupou (it is also on Lani Tupou). Each person needs their own email. Same family? Open Malia Tupou’s card, click Edit, and add them under Second parent / guardian (a name is enough).','bad')}},
 {say:'Ana has her own home and family. So kindly ask Ana for her own email. She gives it. Now the box is fine.',li:2,act:async()=>{const e=q('.k-ne');await tap(e,600);await type(e,'ana.tupou@example.org',35);await leaveEmail('')}},
 {say:'Now her box is ready. On the next screen we click Create and add, and see what happens.',li:2,act:async()=>{hideCursor();spot(q('.ap-ca'),5)}}]},

{html:()=>HEAD('Part 2 · After Create & add','Now add their details')+EVW({att:[P.malia],nc:1,ncName:P.ana[0],ncPhone:P.ana[2],ncEmail:P.ana[1]})+`<div class="abs" style="left:790px;top:150px;width:440px"><ul class="pts">
 <li>Click <b>Create &amp; add</b>. A details panel <b>opens by itself</b> under the new row.</li><li>Type the <b>Child’s name</b>. Then pick <b>Child’s ethnicity</b>, <b>Child age range</b>, <b>Child gender</b>. Tick the <b>disability</b>. Type the <b>Zip code</b>.</li><li>Click <b>Save to contact</b>.</li><li>These details fill the <b>Event Report</b> for you.</li><li>Need to fix it later? Click <b>Update</b> on their row any time.</li></ul></div>`,
 steps:[{say:'Ana gave us her own email, so her box is ready. Click Create and add.',li:0,act:async()=>{await scrollW(q('.ap-ncb'),1);spot(q('.ap-ncb'),4);await wait(500);spot(null);await tap(q('.ap-ca'))}},
 {say:'Ana joins the list. And a panel opens by itself, right under her name. At the top it says: Now add Ana Tupou’s details for the Event Report.',li:0,act:async()=>{hideCursor();q('.ap-ncb').style.display='none';const r=addAtt(P.ana);r.querySelector('.ap-up').textContent='Close';const pnl=el(EDP(P.ana));r.after(pnl);await anim(pnl,[{opacity:0,transform:'scaleY(.7)'},{opacity:1,transform:'none'}],400,'ease-out');await scrollW(r);spot(q('.ap-edh'),4)}},
 {say:'Her phone and email are already here. The small line says: Add or correct their phone and email.',li:0,act:async()=>spot(q('.ap-edn'),4)},
 {say:'Start with the child’s name. These details are about the child. Ana’s son is Keoni Tupou.',li:1,act:async()=>{spot(null);await fill('.k-kid','Keoni Tupou',60)}},
 {say:'Now pick Keoni’s ethnicity. He is Pacific Islander.',li:1,act:async()=>{const e=q('.k-eth');await tap(e,600);await pickFrom(e,['— Child’s ethnicity —','African American','Asian','Caucasian','Filipino','Hispanic','Hawaiian/Part Hawaiian','Pacific Islander','Other/2 or more'],'Pacific Islander')}},
 {say:'Pick his age range. Keoni is eight, so six to twelve years. Then his gender.',li:1,act:async()=>{const a=q('.k-age');await tap(a,600);await pickFrom(a,['— Child age range —','Birth-2 yrs','3-5 yrs','6-12 yrs','13-17 yrs','High School','Adult (Beyond H.S.)'],'6-12 yrs');const g=q('.k-gen');await tap(g,600);await pickFrom(g,['— Child gender —','Female','Male','Non-binary','Prefer not to say'],'Male')}},
 {say:'Tick Keoni’s disability. Here it is Specific Learning Disability. Then type the zip code.',li:1,act:async()=>{const s=q('.ap-dis span[data-d="Specific Learning Disability"]');await tap(s,700);s.querySelector('i').classList.add('on');const z=q('.k-zip');await tap(z,600);await type(z,'96799',90)}},
 {say:'Click the green button, Save to contact. A green message says, Ana Tupou updated.',li:2,act:async()=>{await tap(q('.ap-stc'));hideCursor();q('.ap-ed').remove();all('.ap-up')[1].textContent='Update';await scrollW(q('.ap-ah'),500);toast('Ana Tupou updated.')}},
 {say:'These details fill the Event Report for you. Age of Children, Primary Ethnicity, and Federal Disability Categories count her automatically.',li:3,act:async()=>{clearToast();const n=add(`<div class="big-note" style="left:100px;top:440px;width:620px;font-size:18px;z-index:12">Ana’s details now count <b>automatically</b> in the Event Report:<br>Age of Children · Primary Ethnicity · Federal Disability Categories.</div>`);await pop(n)}},
 {say:'Need to fix it later? Click Update on their row, any time.',li:4,act:async()=>{all('.big-note').forEach(n=>n.remove());spot(all('.ap-up')[1],6)}},
 {say:'One reminder. People without an email are not added by name. You type their numbers in Event Report, Family Fun Day. Part three shows you how.',li:4,act:async()=>{spot(null);toast('No email? They are not added. Their numbers go in Event Report — Family Fun Day (Part 3).','info')}}]},

// ---- same family: one card; second parent by name, email only if their own (v151.60) ----
{html:()=>HEAD('Part 2 · Same family','Same family? One card.')+`<div class="ap-cw"></div><div class="abs" style="left:790px;top:150px;width:440px"><ul class="pts">
 <li>A family can share <b>one card</b>. Add the second parent to it.</li><li>Search the family name. Open their card. Click <b>Edit Contact</b>.</li><li>Go to <b>Second parent / guardian</b>. First name, Last name. Their email if they have one.</li><li>Click <b>Save Contact</b>. The card shows <b>2nd Parent</b>.</li><li>No email? <b>Just the name is fine.</b></li></ul></div>`,
 init:()=>{q('.ap-cw').innerHTML=CLIST()},
 steps:[{say:'Sione is Malia’s husband. They are one family, so they share one card. We add Sione to Malia’s card as the second parent.',li:0,act:async()=>{}},
 {say:'Go to Contacts. Search the family name, Tupou. Malia’s card appears. Click it.',li:1,act:async()=>{const s=q('.k-cs');await tap(s,700);await type(s,'Tupou',90);const r=el(`<div class="ap-row"><span><b>Malia Tupou</b><small>Parent/Guardian · malia.tupou@example.org</small></span></div>`);q('.ap-clist').appendChild(r);await show(r);await tap(r)}},
 {say:'Malia’s card opens. At the bottom, click Edit Contact.',li:1,act:async()=>{q('.ap-cw').innerHTML=CDET(false);await show(q('.ap-cw'));await tap(q('.k-ed'))}},
 {say:'The Edit Contact form opens. Look for the part called, Second parent or guardian. It has First name, Last name, and Email.',li:2,act:async()=>{q('.ap-cw').innerHTML=CFORM();hideCursor();await show(q('.ap-cw'));spot(q('.ap-sec'),5)}},
 {say:'Type Sione. Tupou. Sione has his own email, so type it too. Sione dot tupou at example dot org.',li:2,act:async()=>{spot(null);await fill('.k-f1','Sione',60);await fill('.k-f2','Tupou',60);await fill('.k-f3','sione.tupou@example.org',35)}},
 {say:'Click Save Contact.',li:3,act:async()=>{await tap(q('.k-save'));hideCursor();q('.ap-cw').innerHTML=CDET(true);await show(q('.ap-cw'))}},
 {say:'Now Malia’s card shows a new row. Second parent, Sione Tupou, with his email. One family, one card.',li:3,act:async()=>{const f=q('.ap-fact.new');spot(f,4);confetti(400,300,50)}},
 {say:'What if Sione has no email? That is fine. Just type his name. The card then shows, Sione Tupou, no email.',li:4,act:async()=>{const f=q('.ap-fact.new div');f.innerHTML='Sione Tupou <span class="ap-noe">(no email)</span>';anim(f,[{transform:'scale(1.08)'},{transform:'none'}],500);spot(q('.ap-fact.new'),4)}}]},

{html:()=>HEAD('Part 2 · Same family','Second parent: email if they have one')+`<div class="ap-rule" style="top:124px">A <b>name is enough</b> for the family card. If you add their email, it must be <b>their own</b>: different from the main email, and <b>not on any other card</b>.</div>
 <div class="ap-rule al" style="top:216px"><small>Message</small>The second parent / guardian needs their own email, different from the main one on this card.</div>
 <div class="ap-rule al" style="top:324px"><small>Message</small>That email already belongs to Ana Tupou. The second parent / guardian needs their own email.</div>
 <div class="ap-rule ev" style="top:444px"><b>Both parents at an event?</b> Add the family card <b>once</b>. Count the second person in the <b>TOTAL</b>.
  <div class="ap-mini"><div class="ap-row"><span><b>Malia Tupou</b><small>malia.tupou@example.org</small></span><span class="ap-x">×</span></div><div><b style="font-size:13px">TOTAL</b> <span class="ap-num k-mt">1</span></div></div></div>
 <div class="abs" style="left:790px;top:150px;width:440px"><ul class="pts"><li>A <b>name is enough</b>. Email only if they have one.</li><li>If you type an email, it must be <b>their own</b>. If not, the form stops you with a message.</li><li>Both parents came? Add the card <b>once</b>. Count the second person in the <b>TOTAL</b>.</li></ul></div>`,
 steps:[{say:'For the second parent, a name is enough. If you add their email, it must be their own. Different from the main email on the card, and not on any other card.',li:0,act:async()=>{const r=all('.ap-rule')[0];await show(r);r.style.opacity=1}},
 {say:'If you type the main email again, the form stops you. The message says: The second parent or guardian needs their own email, different from the main one on this card.',li:1,act:async()=>{const r=all('.ap-rule')[1];await show(r);r.style.opacity=1;spot(r,4)}},
 {say:'If the email is already on someone else’s card, the message says: That email already belongs to, and the name. The second parent or guardian needs their own email.',li:1,act:async()=>{const r=all('.ap-rule')[2];await show(r);r.style.opacity=1;spot(r,4)}},
 {say:'And if both parents come to an event, add the family card once. Then count the second person in the TOTAL box.',li:2,act:async()=>{const r=all('.ap-rule')[3];await show(r);r.style.opacity=1;spot(r,4);await wait(600);await countTo(q('.k-mt'),2,'',500)}}]},

{html:()=>HEAD('Part 2 · The system helps','This contact may already exist')+EVW({att:[P.malia,P.ana],nc:1})+`<div class="abs" style="left:790px;top:150px;width:440px"><ul class="pts">
 <li>Same name, a similar name, or the same phone? A window opens.</li><li>The tag says <b>same name</b>, <b>similar</b> or <b>same phone</b>.</li><li><b>Use the existing contact</b>. Almost always right.</li><li>Different person? Only if truly different. It is recorded.</li><li>Not sure? <b>Cancel</b> and check the spelling.</li></ul></div>`,
 steps:[{say:'Now Tavita is here. You type her name and her email, and click Create and add.',li:0,act:async()=>{await scrollW(q('.ap-ncb'),1);await fill('.k-nn','Tavita Leiataua');await fill('.k-ne','tleiataua@example.org',35);await tap(q('.ap-ca'))}},
 {say:'A window opens. This contact may already exist. There is already a Tavita Leiataua in the system.',li:0,act:async()=>{hideCursor();const h=add(DG('One contact already uses this name.',[P.tavita[0],P.tavita[1]+' · American Samoa · Parent/Guardian','same name']));await anim(q('.ap-dg'),[{opacity:0,transform:'scale(.85)'},{opacity:1,transform:'none'}],450);spot(q('.ap-dgh'),4)}},
 {say:'Read the line in the middle. Creating a second card splits their history. Interactions, signups and case notes end up on two records.',li:0,act:async()=>spot(q('.ap-dgb>p'),4)},
 {say:'Look at the little tag. Here it says same name. Other times it says similar, when the spelling is close. Or same phone, when the phone number you typed as extra information is already on a card.',li:1,act:async()=>{const t=q('.ap-tag');spot(t,5);await wait(1500);t.textContent='similar';t.classList.add('close');await wait(1300);t.textContent='same phone';await wait(1300);t.textContent='same name';t.classList.remove('close')}},
 {say:'Almost always, the right choice is the first button. Use the existing contact.',li:2,act:async()=>spot(q('.ap-use'),5)},
 {say:'The red button is only for a truly different person with the same name. If you pick it, it is recorded.',li:3,act:async()=>spot(q('.ap-new'),5)},
 {say:'Not sure? Click Cancel, let me check the spelling.',li:4,act:async()=>spot(q('.ap-cxl'),5)},
 {say:'This is the same Tavita. So I click Use the existing contact. She joins the list with her own card and history.',li:2,act:async()=>{spot(null);await tap(q('.ap-use'));q('.k-dgw').remove();q('.ap-ncb').style.display='none';hideCursor();const r=addAtt(P.tavita);spot(r,4)}}]},

{html:()=>HEAD('Part 2 · The system helps','No email? Count them instead')+EVW({att:[P.malia,P.ana,P.tavita],nc:1}),
 steps:[{say:'Now Lagi is here. She gives her name and a phone number, but she has no email address. A phone alone is not enough. You type her in and click Create and add.',act:async()=>{await scrollW(q('.ap-ncb'),1);await fill('.k-nn','Lagi Pele');await fill('.k-np','684-555-0145',40);await tap(q('.ap-ca'))}},
 {say:'A window opens in the middle of the screen. No email? Count them instead. Lagi Pele has no email address, so she is not added by name.',act:async()=>{hideCursor();add(`<div class="ap-shade"></div>`);const w=add(`<div class="ap-ne"><div class="ap-neh">No email? Count them instead</div><div class="ap-neb"><p><b>Lagi Pele</b> has no email address, so they are not added by name.</p><ol><li class="k-n1">Count them in <b>How many people attended?</b> (the <b>TOTAL</b> box) on this event.</li><li class="k-n2">After you save, open <b>Event Report — ${EVN}</b> (Reports → Event Attendance → click this event’s card) and add their numbers under <b>Age of Children</b>, <b>Primary Ethnicity</b> and <b>Federal Disability Categories</b>.</li></ol></div><div class="ap-nef"><span class="ap-ok">OK, take me to the TOTAL box</span></div></div>`);await anim(w,[{opacity:0,transform:'scale(.85)'},{opacity:1,transform:'none'}],450)}},
 {say:'Step one. Count her in the box, How many people attended. That is the TOTAL box, on this event.',act:async()=>spot(q('.k-n1'),5)},
 {say:'Step two. After you save, open the Event Report for this event, and add her numbers. Her child’s age, the child’s ethnicity, and the disability. We will do this together in part three.',act:async()=>spot(q('.k-n2'),5)},
 {say:'Click OK, take me to the TOTAL box.',act:async()=>{spot(null);await tap(q('.ap-ok'));all('.ap-shade,.ap-ne').forEach(e=>e.remove());for(const s of ['.k-nn','.k-np']){const e=q(s);e.textContent=s==='.k-nn'?'Full name':'Phone';e.classList.add('ph')}q('.ap-ncb').style.display='none';hideCursor();await scrollW('bottom');spot(q('.ap-num'),8)}},
 {say:'Here is the TOTAL box. Lagi is counted here, with everyone else who has no email. She still counts!',act:async()=>{const n=q('.ap-num');n.classList.remove('ph');await type(n,'23',160)}}]},

{html:()=>HEAD('Part 2 · The system helps','Finish the box before you save')+EVW({att:[P.malia,P.ana,P.tavita],nc:1,total:'23'})+`<div class="abs" style="left:790px;top:150px;width:440px"><ul class="pts">
 <li>You typed a new person, then clicked <b>Save</b>.</li><li>A red message stops you. Nobody is lost.</li><li>Press <b>Create &amp; add</b>, or clear the box. Then <b>Save</b>.</li></ul></div>`,
 steps:[{say:'One more helper. Pua gives you her details. You type them in the new contact box.',li:0,act:async()=>{await scrollW(q('.ap-ncb'),1);await fill('.k-nn','Pua Tuilagi');await fill('.k-np','684-555-0156',40);await fill('.k-ne','pua.tuilagi@example.org',35)}},
 {say:'But then you click Save, before Create and add.',li:0,act:async()=>{await tap(q('.ap-sv'))}},
 {say:'A red message says: The new contact box still has someone in it. Press Create and add, or clear it, before saving. This way, nobody is lost by mistake.',li:1,act:async()=>{toast('The new contact box still has someone in it. Press Create &amp; add, or clear it, before saving.','bad');spot(q('.ap-ncb'),5)}},
 {say:'So click Create and add. Pua joins the list. Now click Save.',li:2,act:async()=>{spot(null);clearToast();await tap(q('.ap-ca'));q('.ap-ncb').style.display='none';addAtt(P.pua);await wait(400);await tap(q('.ap-sv'));hideCursor();toast('One-off event updated.');confetti(1000,560,60)}}]},

{html:()=>HEAD('Part 2 · New Interaction','Quick Add Contact needs an email too')+`<div class="ap-ix"><div class="ap-ixh"><span>New Interaction</span><span>×</span></div><div class="ap-ixb">

 <div class="ap-nm"><i>!</i>No matching contact. Click + to add them.</div>
 <label>Summary</label><div class="ap-in ph">Short summary for quick scanning</div>
 <label>Notes</label><div class="ap-in ph" style="min-height:60px">Add details, context, and ‘why’ notes here (auditable).</div>
 <label>Follow-up date *</label><div class="ap-in ph" style="width:200px">mm/dd/yyyy</div><div style="height:70px"></div></div></div>
 <div class="ap-qc"><h3>Quick Add Contact</h3><p class="ap-qs">Creates a contact record so this interaction has someone to attach to.</p>
 <div class="ap-f"><label>Full name</label><div class="ap-in ph k-qn">First Last</div></div>
 <div class="ap-g2"><div><label style="font-size:12px;font-weight:700">Type</label><div class="ap-in sel">Parent/Guardian</div></div><div><label style="font-size:12px;font-weight:700">Phone</label><div class="ap-in ph k-np">(808) 555-0123</div></div></div>
 <div class="ap-f"><label>Email</label><div class="ap-in ph k-ne">parent@example.com</div></div>
 <div class="ap-qa"><span class="ap-qx">Cancel</span><span class="ap-qu">Create &amp; use</span></div></div>
 <div class="abs" style="left:790px;top:150px;width:440px"><ul class="pts">
 <li>In a <b>New Interaction</b>, a new name opens <b>Quick Add Contact</b>. Its button is <b>Create &amp; use</b>.</li><li>An email is <b>required</b> here too.</li><li>No email? Log it on the <b>family’s existing card</b>, or count them at the event in the <b>TOTAL</b>.</li><li>The <b>same checks</b> run: staff email, an email already on a card, same name or phone.</li></ul></div>`,
 steps:[{say:'The same checks also run in another place. When you write a New Interaction, and the family is new.',li:0,act:async()=>{const c=q('.k-cl');await tap(c,700);await type(c,'Lagi Pele',60);const b=q('.ap-nm');await show(b);b.style.opacity=1}},
 {say:'Click the plus button. The Quick Add Contact window opens.',li:0,act:async()=>{await tap(q('.ap-plus'));const w=q('.ap-qc');await anim(w,[{opacity:0,transform:'scale(.85)'},{opacity:1,transform:'none'}],450);w.style.opacity=1;hideCursor()}},
{say:'Here the button is called, Create and use. Lagi gives her name and phone, but no email. Click Create and use.',li:0,act:async()=>{const n=q('.k-qn');await tap(n,500);await type(n,'Lagi Pele',50);await fill('.k-np','684-555-0145',40);await tap(q('.ap-qu'))}},
 {say:'A red message says: An email is required to add someone. No email? Log the interaction on the family’s existing card, or count them at the event in the TOTAL box.',li:1,act:async()=>{hideCursor();toast('An email is required to add someone. No email? Log the interaction on the family’s existing card, or count them at the event in the TOTAL box.','bad');spot(q('.k-ne'),4)}},
 {say:'So search for the family’s card and log the interaction there. Or, if you met her at an event, count her in the TOTAL box.',li:2,act:async()=>{spot(null)}},
 {say:'All the other checks run here too. A staff email, an email that is already on someone’s card, and the same name or the same phone.',li:3,act:async()=>{clearToast()}},
 {say:'So the rules are the same everywhere. Search first. One person, one card, their own email.',li:3,act:async()=>{}}]},

QUIZ('Part 2',[
 {q:'Ana is Malia’s sister. She wants her own card, but she gives Malia’s email. Can you add Ana with that email?',o:['Yes, families can share','No. Each person needs their own email','Yes, if you add a note'],a:1,y:'A new card needs the person’s own email.',n:'Two cards with one email cannot be told apart.'},
 {q:'The window This contact may already exist shows the same name. Which button is almost always right?',o:['Use the existing contact','This is a different person — create a second card','Close the event without saving'],a:0,y:'Use the existing contact keeps their history together.',n:'A second card splits their history.'},
 {q:'Sione is Malia’s husband. He has his own email. What do you do?',o:['Make a new card for Sione','Open Malia’s card, click Edit Contact, and add him under Second parent / guardian','Use Malia’s email for him'],a:1,y:'One family, one card. Add Sione as the Second parent / guardian. His email only if he has one.',n:'A family can share one card.'},
 {q:'A father gives his name and phone, but no email. What do you do?',o:['Add him with just his phone','Make up an email for him','Count him in the TOTAL box, then add his numbers in the Event Report'],a:2,y:'Count him in the TOTAL, and add his numbers in the Event Report.',n:'A phone alone is not enough, and never make up an email.'}]),

SECT(3,'Counting people without an email','Two places: the TOTAL box on the event, and the numbers in the Event Report.','Part three. Counting people without an email. They still count, in two places.'),

{html:()=>HEAD('Part 3 · The TOTAL box','Everyone who came')+`<div class="ap-tc"><label>How many people attended?</label><div class="ap-num ph">e.g. 24</div>
 <div class="ap-yn"><b>This is the TOTAL attendance</b>, including the people you marked attended above.<br>Example: 2 named above and 36 more with no names → enter 38.</div></div>
 <div class="ap-ppl">${PPL([1,1,1],['Malia','Ana','Tavita'])}</div>
 <div class="ap-eq"><div><span class="a">3</span> named</div><div><span class="b">+ 20</span> no names</div><div>= <span class="c">23</span></div></div>`,
 steps:[{say:'Here is the box at the bottom of every event. It asks, How many people attended?',act:async()=>spot(q('.ap-num'),8)},
 {say:'Read the yellow note. This is the TOTAL attendance, including the people you marked attended above. So the TOTAL is everyone in the room.',act:async()=>spot(q('.ap-yn'),5)},
 {say:'Let’s count Family Fun Day. Three people are named on the list. Malia, Ana and Tavita.',act:async()=>{spot(null);const p=all('.ap-pp');for(let i=0;i<3;i++){p[i].classList.remove('hid');await pop(p[i])}await show(all('.ap-eq div')[0]);all('.ap-eq div')[0].style.opacity=1}},
 {say:'Twenty more people came with no email. Lagi is one of them. They have no names on the list.',act:async()=>{const p=all('.ap-pp');for(let i=3;i<23;i++){p[i].classList.remove('hid');anim(p[i],[{opacity:0,transform:'scale(.3)'},{opacity:1,transform:'none'}],300);await wait(50)}const d=all('.ap-eq div')[1];await show(d);d.style.opacity=1}},
 {say:'Three plus twenty is twenty three. So you type twenty three in the box. Not three. Not twenty. Twenty three.',act:async()=>{const d=all('.ap-eq div')[2];await show(d);d.style.opacity=1;const n=q('.ap-num');await tap(n,600);n.classList.remove('ph');await type(n,'23',160);hideCursor();confetti(900,330,70)}}]},

{html:()=>HEAD('Part 3 · Finding the Event Report','Reports → Event Attendance → the event card')+`<div class="ap-snav"><div>Home</div><div>Interactions</div><div>Contacts</div><div class="k-rep">Reports</div><div>Training Videos</div></div>
 <div class="ap-area"><div class="ap-tiles">${[['Interactions Summary','Weekly and monthly interaction counts.'],['Contact Demographics','Breakdown of contacts by type and region.'],['Event Attendance','Sign-up counts and attendance for events and workshops.'],['PTI Report','The reporting-period document.']].map(t=>`<div class="ap-tl"><b>${t[0]}</b>${t[1]}</div>`).join('')}</div></div>

 steps:[{say:'Now step two from the window. First, save your event. Then find its Event Report.',li:0,act:async()=>{}},

 {say:'Click the tile called Event Attendance.',li:2,act:async()=>{const t=all('.ap-tl')[2];await tap(t);spot(t,5);await wait(500);spot(null);
  q('.ap-area').innerHTML=`<div class="ap-eh">Event Attendance Report</div><div class="ap-cards">${[[EVN,'Sat, Sep 26, 2026','Attended: 23'],['Parent Support Circle','Tue, Sep 22, 2026','Attended: 12'],['Champions Club','Mon, Sep 21, 2026','Attended: 8'],['Autism Workshop','Wed, Sep 23, 2026','Attended: 40']].map(c=>`<div class="ap-ec"><span class="ap-chip">One-Off</span><b>${c[0]}</b><small>${c[1]}</small><small>${c[2]}</small></div>`).join('')}</div>`;await show(q('.ap-area'))}},
 {say:'Find your event. Here it is, Family Fun Day. Click anywhere on its card.',li:3,act:async()=>{const c=q('.ap-ec');spot(c,5);await wait(500);spot(null);await tap(c)}},
 {say:'The Event Report opens. At the top it says, Event Report, Family Fun Day.',li:4,act:async()=>{hideCursor();const w=add(RW());await anim(w,[{opacity:0,transform:'scale(.9)'},{opacity:1,transform:'none'}],500);spot(q('.ap-rh'),4)}}]},

{html:()=>HEAD('Part 3 · The Event Report','Add their numbers')+RW()+`<div class="abs" style="left:790px;top:150px;width:440px"><ul class="pts">
 <li>Each row has a <b>number box</b>, with <b>Auto: N</b> beside it.</li><li><b>Attendance Totals</b>: New Parent Total, Parent (returning), Youth with Disability, Professional/Other, Military Active Duty.</li><li><b>Age of Children</b>.</li><li><b>Primary Ethnicity</b>.</li><li><b>Federal Disability Categories</b>.</li><li>Typing a number saves it. You see <b>(entered)</b>.</li></ul></div>`,

 {say:'The Attendance Totals rows all work the same way. New Parent Total, Parent returning, Youth with Disability, Professional or Other, and Military Active Duty.',li:1,act:async()=>{hideCursor();spot(q('.ap-dt.pk'),3)}},
 {say:'Scroll down to Age of Children. Lagi’s child is eight years old. That is the six to twelve row. Auto says two, so type three.',li:2,act:async()=>{spot(null);await scrollW(q('.k-age'));await enterNum('6-12',3)}},
 {say:'Next, Primary Ethnicity. Lagi is Pacific Islander. Auto says three, so type four.',li:3,act:async()=>{spot(null);await scrollW(q('.k-eth'));await enterNum('Pacific Islander',4)}},
 {say:'Last, Federal Disability Categories. Her child has a Specific Learning Disability. Auto says one, so type two.',li:4,act:async()=>{spot(null);await scrollW(drow('Multiple Disabilities'));await enterNum('Specific Learning Disability',2)}},
 {say:'Typing a number saves it. Beside the box you now see the word, entered. That means you typed it. If you clear the box, it goes back to the automatic count.',li:5,act:async()=>{hideCursor();spot(drow('Specific Learning Disability').querySelector('.ap-auto'),5)}}]},

 {q:'Where do you add the age, ethnicity and disability numbers for people with no email?',o:['In the + New contact box','In the Event Report (Reports → Event Attendance → click the event card)','Nowhere, they only count in the TOTAL'],a:1,y:'The Event Report has a box for every row.',n:'Think of the window, No email? Count them instead. Step two.'}]),

{html:()=>HEAD('Recap','Your checklist')+`<div class="cl" style="top:130px">${['<b>Search first.</b> Type the name. If they appear, click them.','LDAH staff are in the search. <b>Pick their card</b>, never a new one.','A new person needs <b>their own email</b>. A phone alone is not enough.','<b>Same family?</b> One card. Add the second parent under <b>Second parent / guardian</b>. A name is enough.','<b>This contact may already exist?</b> Almost always <b>Use the existing contact</b>.','<b>No email?</b> Count them in the <b>TOTAL</b> box: everyone who came.','New person added? Fill their details: <b>Child’s name</b> first, then age, ethnicity, disability. No email? Type the numbers in the <b>Event Report</b>.'].map(t=>`<div class="ci" style="font-size:18.5px;padding:11px 18px;margin-bottom:9px"><div class="bx"><svg viewBox="0 0 26 26"><path d="M5 13 L11 19 L21 7"/></svg></div><span>${t}</span></div>`).join('')}</div>`,
 steps:[{say:'Let’s recap.',act:async()=>{for(const c of all('.ci')){c.classList.add('on');await wait(160)}}},
 ...['Search first. Type the name. If they appear, click them.','LDAH staff are in the search. Pick their card, never a new one.','A new person needs their own email. A phone alone is not enough.','Same family? One card. Open the family card, click Edit Contact, and add the second parent under Second parent or guardian. A name is enough. Their email only if it is their own.','If the window says, This contact may already exist, almost always click Use the existing contact.','No email? Count them in the TOTAL box. The TOTAL is everyone who came.','When you add someone new, fill their details. Start with the child’s name, then age, ethnicity and disability. No email? Type their numbers in the Event Report.'].map((s,i)=>({say:s,act:async()=>{const cs=all('.ci');cs.forEach((c,j)=>{c.classList.add('on');if(j<i)c.classList.add('done')});await wait(700);cs[i].classList.add('done')}}))]},
