<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Advocacy Starting Point — Training</title>
<link rel="stylesheet" href="deck-base.css">
<style>
/* the readiness bar, same as the Case Advocacy report */
.rb{display:flex;align-items:center;gap:8px}
.rb-track{position:relative;flex:none;width:210px;height:12px;border-radius:999px;background:#F1F5F9;overflow:hidden}
.rb-track.big{width:520px;height:26px}
.rb-track.big~.rb-score{font-size:20px}
.rb-ticks{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(10% - 1px),rgba(255,255,255,.9) calc(10% - 1px),rgba(255,255,255,.9) 10%)}
.rb-start,.rb-grow{position:absolute;top:0;bottom:0;width:0}
.rb-start{left:0;background:#F97316}
.rb-score{font-weight:800;font-size:13px;white-space:nowrap}
.rb-score .f{color:#F97316}.rb-score .a{color:#94A3B8;margin:0 2px}
.rb-delta{font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px;background:#DCFCE7;color:#166534;opacity:0}
.stg{font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin-top:4px}
/* the report */
.rpt{background:#fff;border-radius:14px;box-shadow:0 8px 24px rgba(15,23,42,.10);overflow:hidden;width:700px}
.rpt .hdr,.rpt .rw{display:grid;grid-template-columns:190px 80px 330px 1fr;gap:10px;padding:10px 14px;align-items:start}
.rpt .hdr{background:#F5F3FF;color:#6D28D9;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.rpt .rw{border-bottom:1px solid #EDE9FE;font-size:13px;opacity:0}
.rpt .rw .nm2{font-weight:800}.rpt .rw .em{font-size:11px;color:#64748B}
.rpt .rw .ch{color:#6D28D9;margin-right:6px;display:inline-block;transition:transform .3s}
.rpt .rw.open .ch{transform:rotate(90deg)}
.rpt .rdy{background:#FFFCF5;margin:-10px 0;padding:10px 6px}
.col-hl{outline:3px solid var(--pink);outline-offset:2px;border-radius:6px}
/* KPI tiles */
.tiles{display:flex;gap:12px}
.tile{background:#fff;border-radius:16px;box-shadow:0 6px 20px rgba(2,132,199,.10);padding:14px 16px;border-left:4px solid #6D28D9;width:210px;opacity:0}
.tile b{display:block;font-size:30px;line-height:1.1}.tile i{font-style:normal;font-size:13px;color:#64748B}
/* scale legend */
.scale{display:flex;flex-direction:column;gap:12px}
.sband{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;opacity:0;transform:translateX(-24px);transition:all .45s ease}
.sband.on{opacity:1;transform:none}
.sband .sw{width:70px;height:14px;border-radius:999px;flex:none}
.sband .bn{font-size:22px;font-weight:900;width:70px;flex:none}
.sband p{margin:0;font-size:16px;color:var(--soft)}.sband p b{color:var(--ink)}
/* breakdown panel */
.bd{display:grid;grid-template-columns:1fr 1fr;gap:16px;background:#FBFAFF;border:1px solid #EDE9FE;border-radius:14px;padding:14px;width:700px}
.bd h5{margin:0 0 8px;font-size:11px;color:#6D28D9;letter-spacing:.06em;text-transform:uppercase}
.base{background:#FFF7ED;border:1px solid #FED7AA;border-radius:12px;padding:11px 12px;font-size:12.5px}
.base .qt{color:#9A3412;font-style:italic;margin:5px 0 8px;line-height:1.4}
.base .ov{font-size:11px;color:#9A3412;font-weight:800}
.base .cfrow{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:12px;color:#9A3412;font-weight:700}
.selx{border:1px solid #CBD5E1;border-radius:6px;background:#fff;padding:3px 22px 3px 8px;font-weight:700;color:var(--ink);position:relative;min-width:44px}
.selx::after{content:"▾";position:absolute;right:6px;color:#64748B}
.cbtn{background:#6D28D9;color:#fff;border-radius:6px;padding:4px 12px;font-weight:800}
.ddrop{position:absolute;background:#fff;border:1px solid #CBD5E1;border-radius:8px;box-shadow:0 14px 34px rgba(15,23,42,.22);padding:4px;z-index:30;font-size:12.5px;width:64px}
.ddrop div{padding:3px 8px;border-radius:5px}.ddrop div.hi{background:#E0F2FE;color:#0E6E8C;font-weight:800}
.lg{font-size:12px;border-collapse:collapse;width:100%}
.lg td{padding:5px 4px;border-bottom:1px dashed #E9E4F8;vertical-align:top}
.lg .k{font-size:10px;font-weight:800;border-radius:6px;padding:1px 6px;white-space:nowrap}
.k.ws{background:#E0F2FE;color:#075985}.k.mt{background:#F3E8FF;color:#6B21A8}.k.ce{background:#DCFCE7;color:#166534}.k.nt{background:#F1F5F9;color:#475569}
.lg .pt{font-weight:900;color:#166534;text-align:right;white-space:nowrap}
.lg.hid tr{opacity:0}
/* interaction form */
.frm{background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(15,23,42,.14);width:640px;overflow:hidden}
.frm .ftop{background:linear-gradient(90deg,#6D28D9,#7C3AED);color:#fff;padding:12px 16px;font-weight:800;font-size:16px}
.frm .bd2{padding:14px 16px}
.frm label.l{display:block;font-size:11px;font-weight:800;color:#64748B;text-transform:uppercase;letter-spacing:.05em;margin:10px 0 4px}
.frm .fld{border:1px solid #CBD5E1;border-radius:8px;padding:8px 10px;font-size:14px;position:relative}
.frm .fld.fsel::after{content:"▾";position:absolute;right:10px;color:#64748B}
.mtg{border:2px dashed #C4B5FD;border-radius:12px;padding:10px 12px;margin-top:12px;background:#FAF5FF;opacity:0}
.mtg .rad{display:flex;gap:10px;margin-top:6px}
.mtg .rad span{border:1px solid #CBD5E1;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;background:#fff}
.mtg .rad span.pick{background:#DCFCE7;border-color:#22C55E;color:#166534}
.mtg .ftick{margin-top:9px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
.mtg .ftick i{width:18px;height:18px;border:2px solid #6D28D9;border-radius:4px;display:inline-block;position:relative}
.mtg .ftick i.on{background:#6D28D9}
.mtg .ftick i.on::after{content:"✓";color:#fff;position:absolute;left:2px;top:-3px;font-style:normal;font-size:14px}
/* the "teach the AI" scene */
.feed{display:flex;flex-direction:column;gap:12px;width:640px}
.fcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;box-shadow:0 8px 22px rgba(15,23,42,.08);opacity:0;display:flex;gap:14px;align-items:center}
.fcard .ic{width:44px;height:44px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;color:#fff}
.fcard p{margin:0;font-size:15px;color:var(--soft);line-height:1.4}.fcard p b{color:var(--ink)}
.brain{position:absolute;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#F9A8D4,#D63384 55%,#9D174D);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:34px;box-shadow:0 20px 50px rgba(214,51,132,.35);opacity:0}
.dotfly{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--teal2)}
.cmp2{display:grid;grid-template-columns:1fr 1fr;gap:18px;width:1160px}
.cmp2>div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:0 8px 24px rgba(15,23,42,.08);opacity:0}
.cmp2 h4{margin:0 0 8px;font-size:19px}
.cmp2 .nt{font-size:15px;line-height:1.5;color:var(--soft);background:#F8FAFC;border-radius:10px;padding:10px 12px;font-family:ui-monospace,Menlo,monospace}
.cmp2 .nt mark{background:#FDE68A;border-radius:3px;padding:0 2px}
</style></head><body>
<div id="view"><div id="stage"><div id="nbar"><i></i></div>
<div id="scenes"></div>
<div id="spot"></div>
<svg id="cursor" viewBox="0 0 28 32"><path d="M3 2 L3 26 L9.5 19.5 L14 29 L18.5 27 L14 17.5 L23 17.5 Z" fill="#fff" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/></svg>
</div></div>
<div id="cap" aria-live="polite"></div>
<div id="bar">
 <button id="prev">Back</button><button id="play">Start</button><button id="next">Next</button>
 <div id="dots"></div>
 <button id="capbtn" aria-pressed="false">Captions</button><button id="voice" aria-pressed="true">Voice on</button>
</div>
<script>
const DECK_ID='advocacy-starting-point-2026-09';

/* ---- colour along the scale: orange -> amber -> green, as on the report ---- */
function hx(h){return[1,3,5].map(i=>parseInt(h.substr(i,2),16))}
function mix(a,b,t){a=hx(a);b=hx(b);return'rgb('+a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(',')+')'}
function col(s){const t=s/10;return t<.5?mix('#F97316','#EAB308',t/.5):mix('#EAB308','#16A34A',(t-.5)/.5)}
function stg(s){return s>=10?['Self-advocate','#166534']:s>=7?['Getting there','#4D7C0F']:s>=2?['Knows the basics','#A16207']:['New to it','#C2410C']}

/* ---- mock builders: the real screens in HTML, never a screenshot ---- */
const BAR=(st,nw,big,cls)=>`<div class="rb ${cls||''}" data-s="${st}" data-n="${nw}"><div class="rb-track${big?' big':''}"><div class="rb-start"></div><div class="rb-grow" style="left:${st*10}%;background:linear-gradient(90deg,${col(st)},${col(nw)})"></div><div class="rb-ticks"></div></div>
 <span class="rb-score"><span class="f">${st}</span><span class="a">&rarr;</span><span style="color:${col(nw)}">${nw}</span></span>${nw>st?`<span class="rb-delta">+${nw-st}</span>`:''}</div>`;
async function grow(b,ms){ms=ms||700;const s=+b.dataset.s,n=+b.dataset.n;
 await anim(b.querySelector('.rb-start'),[{width:'0%'},{width:s*10+'%'}],ms,'ease-out');
 if(n>s)await anim(b.querySelector('.rb-grow'),[{width:'0%'},{width:(n-s)*10+'%'}],ms,'ease-out');
 const d=b.querySelector('.rb-delta');if(d)await anim(d,[{opacity:0,transform:'scale(.4)'},{opacity:1,transform:'scale(1)'}],380)}

const FAM=[['Kalani Example','kalani@example.com',2,3.5],['Mele Sample','mele.sample@example.com',4,5],['Noa Testperson','noa@example.org',1,1]];
const ROW=(f,i)=>{const s=stg(f[3]);return `<div class="rw r${i}"><div><span class="ch">▸</span><span class="nm2">${f[0]}</span><div class="em">${f[1]} · Oahu</div></div><div><b>${[88,71,47][i]}</b> days</div>
 <div class="rdy">${BAR(f[2],f[3],false,'b'+i)}<div class="stg" style="color:${s[1]}">${s[0]}</div></div><div><span style="background:#EDE9FE;color:#5B21B6;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:800">SIGNED</span></div></div>`};
const REPORT=()=>`<div class="rpt"><div class="hdr"><div>Family</div><div>Open</div><div class="hcol">Self-advocacy readiness</div><div>Authorization</div></div>${FAM.map(ROW).join('')}</div>`;

const PANEL=(conf,hid)=>`<div class="bd"><div><h5>Starting point · <span class="spn">2</span> of 10</h5>
 <div class="base">Suggested from the intake conversation on 2026-06-30:
  <div class="qt">“Mom said she has been to two IEP meetings but never knew she could ask for the evaluation in writing.”</div>
  <div class="ov ovl">${conf?'Confirmed by you · 2026-09-24':'Not confirmed yet. Confirm it or change it.'}</div>
  <div class="cfrow">Starting score <span class="selx">2</span> <span class="cbtn">Confirm</span></div></div></div>
 <div><h5>AI checks, every other day · +1.5 so far</h5><table class="lg${hid?' hid':''}">
  <tr><td><span class="k ws">Workshop</span></td><td>Attended Learning Labs: Understanding Your IEP.</td><td class="pt">+0.5</td></tr>
  <tr><td><span class="k mt">School mtg</span></td><td>Out of office meeting marked <b>Worked</b>.</td><td class="pt">+1.5</td></tr>
  <tr><td><span class="k nt">Note</span></td><td>Nothing new since 09-20.</td><td class="pt" style="color:#94A3B8">no change</td></tr></table></div></div>`;

const FORM=()=>`<div class="frm"><div class="ftop">New Interaction · Case advocacy</div><div class="bd2">
 <label class="l">Contact</label><div class="fld">Kalani Example</div>
 <label class="l">Channel</label><div class="fld fsel chn">Outbound Phone</div>
 <div class="mtg"><b style="font-size:13px;color:#6D28D9">How did it go?</b><div class="rad"><span class="o1">Worked</span><span class="o2">Partly</span><span class="o3">Didn't</span></div>
  <div class="ftick"><i class="tk"></i> Parent led it</div></div>
 <label class="l">Notes</label><div class="fld" style="height:54px;color:#94A3B8" id="nts">What happened…</div></div></div>`;

const SC=[
// ---- COVER ----
{cls:'cover',html:()=>`<div class="brand">Leadership in Disabilities &amp; Achievement of Hawaiʻi</div><div class="hello">Aloha <span class="nm"></span></div>
 <h1>The advocacy starting point</h1><p class="sub">How to review and set where each family starts on the 0 to 10 readiness scale. About six minutes.</p>
 <div class="abs cvm" style="left:720px;top:190px;background:#fff;border-radius:16px;padding:22px 24px;box-shadow:0 24px 60px rgba(0,0,0,.3);transform:rotate(3deg);animation:bob 5s ease-in-out infinite">
  <div style="color:#6D28D9;font-weight:900;font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px">Self-advocacy readiness</div>
  ${BAR(2,6.5,false,'cb0')}<div style="height:12px"></div>${BAR(4,5,false,'cb1')}<div style="height:12px"></div>${BAR(1,3,false,'cb2')}</div>
 <div class="spark" style="left:1190px;top:150px">${SPARK}</div><div class="spark" style="left:700px;top:470px;animation-delay:1s">${SPARK}</div>
 <div class="gate"><button class="btn" data-go="start">Start training</button><button class="btn ghost" data-go="skip">Skip for now</button><label><input type="checkbox" id="voiceChk" checked> Read it out loud to me</label></div>${WAVES}`,
 init:()=>{setTimeout(()=>{document.querySelectorAll('.scene.on .cvm .rb').forEach((b,i)=>setTimeout(()=>grow(b,600),i*350))},500)},
 steps:[{say:'Aloha {name}! Every family in case advocacy now has a readiness score, from zero to ten. This short training shows you how to review where each family starts, and how to change it when the suggestion is not right. About six minutes.'}]},

// ---- WHAT IT IS ----
{html:()=>HEAD('The idea','Where is this family on the journey?')+`<div class="abs" style="left:58px;top:140px;width:700px"><div class="scale">
 <div class="sband a0"><div class="sw" style="background:#F97316"></div><div class="bn" style="color:#C2410C">0–1</div><p><b>New to it.</b> Has never heard of IDEA or a 504.</p></div>
 <div class="sband a1"><div class="sw" style="background:linear-gradient(90deg,#F97316,#EAB308)"></div><div class="bn" style="color:#A16207">2–6</div><p><b>Knows the basics.</b> Has been through an IEP or two.</p></div>
 <div class="sband a2"><div class="sw" style="background:linear-gradient(90deg,#EAB308,#16A34A)"></div><div class="bn" style="color:#4D7C0F">7–9</div><p><b>Getting there.</b> Prepares, asks, and pushes back.</p></div>
 <div class="sband a3"><div class="sw" style="background:#16A34A"></div><div class="bn" style="color:#166534">10</div><p><b>Self-advocate.</b> Runs their own meetings without us.</p></div></div></div>
 <div class="abs" style="left:790px;top:148px;width:440px"><ul class="pts"><li>One number for <b>how ready a parent is to advocate for their own child</b>.</li><li>A perfect <b>10</b> is the goal: a family that <b>no longer needs us</b>.</li><li>It is for <b>staff only</b>. Families never see a number.</li></ul></div>`,steps:[
 {say:'Here is the idea. One number that says how ready a parent is to advocate for their own child.',li:0,act:async()=>{for(const b of document.querySelectorAll('.scene.on .sband')){b.classList.add('on');await wait(220)}}},
 {say:'Zero or one is a parent who is new to all of it, who has never heard of IDEA or a 504. Two to six knows the basics, they have been through an IEP or two.',li:0,act:async()=>{spot(q('.a0'),5);await wait(1600);spot(q('.a1'),5);await wait(1600)}},
 {say:'Seven to nine is a parent who is getting there. And a ten is our goal: a family that runs its own meetings, and does not need us any more.',li:1,act:async()=>{spot(q('.a2'),5);await wait(1500);spot(q('.a3'),5);await wait(900);const p=pos(q('.a3'));confetti(p.x+60,p.y+20,60);await wait(700);spot(null)}},
 {say:'And this is for staff only. Families never see a number.',li:2,act:async()=>{const s=add(`<div class="stamp" style="left:420px;top:560px">STAFF ONLY</div>`);await anim(s,[{opacity:0,transform:'rotate(-14deg) scale(2.2)'},{opacity:1,transform:'rotate(-14deg) scale(1)'}],450)}}]},

// ---- READING THE BAR ----
{html:()=>HEAD('Reading it','Orange is where they started')+`<div class="abs" style="left:58px;top:170px;width:700px">
 <div style="background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(15,23,42,.10);padding:26px 24px">${BAR(2,4.5,true,'bb')}
  <div class="stg" style="color:#A16207;font-size:13px;margin-top:10px">Knows the basics</div></div>
 <div class="anno an1" style="left:30px;top:104px;opacity:0">where they started</div>
 <div class="anno an2" style="left:250px;top:-40px;opacity:0">how far they have come</div></div>
 <div class="abs" style="left:790px;top:148px;width:440px"><ul class="pts"><li>The <b>orange</b> part is the <b>starting point</b>.</li><li>The part after it is <b>progress</b>, and it turns <b>greener</b> as it nears 10.</li><li>Beside it: <b>start → now</b>, and the green <b>+</b> badge is how much they have grown.</li></ul></div>`,steps:[
 {say:'Every family gets a bar like this one. The orange part is where the family started. That is the part you are going to review today.',li:0,act:async()=>{const b=q('.bb');await anim(b.querySelector('.rb-start'),[{width:'0%'},{width:'20%'}],900,'ease-out');await anim(q('.an1'),[{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],400)}},
 {say:'Everything after it is progress. The closer a family gets to ten, the greener it turns.',li:1,act:async()=>{const b=q('.bb');await anim(b.querySelector('.rb-grow'),[{width:'0%'},{width:'25%'}],1200,'ease-out');await anim(q('.an2'),[{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],400)}},
 {say:'Beside the bar it says start, then now. Two, then four and a half. And the green badge is how much they have grown.',li:2,act:async()=>{const d=q('.bb .rb-delta');await anim(d,[{opacity:0,transform:'scale(.3)'},{opacity:1,transform:'scale(1)'}],450);spot(q('.bb .rb-score'),8);await wait(1300);spot(d,6);await wait(1100);spot(null)}}]},

// ---- WHERE ----
{html:()=>HEAD('Getting there','Reports → Case Advocacy')+`<div class="abs" style="left:58px;top:128px;width:1170px">
 <div class="crumb">Main → <b>Reports</b> → <b>Case Advocacy</b></div>
 <div class="tiles"><div class="tile t0" style="border-left-color:#EAB308"><b><span style="color:#F97316">2.4</span> <span style="color:#94A3B8;font-size:20px">→</span> <span style="color:#65A30D">3.9</span></b><i>average readiness, start → now</i></div>
  <div class="tile t1" style="border-left-color:#16A34A"><b style="color:#16A34A" class="c1">0</b><i>at 9+ · ready to close</i></div>
  <div class="tile t2" style="border-left-color:#B45309"><b style="color:#B45309" class="c2">0</b><i>no movement in 30+ days</i></div></div>
 <div style="margin-top:18px">${REPORT()}</div></div>`,steps:[
 {say:'You will find it on the Case Advocacy report. Main, then Reports, then Case Advocacy.',act:async()=>{spot(q('.crumb'),6);await wait(1300);spot(null)}},
 {say:'At the top there are three new tiles. The average start and the average now, how many families are nine or above and nearly ready to close, and how many have not moved in a month.',act:async()=>{for(const t of ['.t0','.t1','.t2']){await anim(q(t),[{opacity:0,transform:'translateY(24px)'},{opacity:1,transform:'none'}],380)}countTo(q('.c1'),0);await countTo(q('.c2'),2)}},
 {say:'And every family has a bar in the new Self-advocacy readiness column. The list still runs oldest case first, just like before.',act:async()=>{for(const r of document.querySelectorAll('.scene.on .rw')){await anim(r,[{opacity:0,transform:'translateX(-30px)'},{opacity:1,transform:'none'}],340)}
   q('.hcol').classList.add('col-hl');for(const b of document.querySelectorAll('.scene.on .rw .rb'))grow(b,550);await wait(1600);q('.hcol').classList.remove('col-hl')}}]},

// ---- OPEN THE FAMILY ----
{html:()=>HEAD('Step 1','Open the family')+`<div class="abs" style="left:58px;top:130px;width:720px">
 <div class="rpt"><div class="hdr"><div>Family</div><div>Open</div><div>Self-advocacy readiness</div><div>Authorization</div></div>${ROW(FAM[0],0)}</div>
 <div class="pnl" style="margin-top:10px;opacity:0">${PANEL(false)}</div></div>
 <div class="abs" style="left:790px;top:148px;width:440px"><ul class="pts"><li>Click the little <b>▸</b> beside the family's name.</li><li>On the left: the <b>Starting point</b>.</li><li>The AI read the <b>first conversations</b> and <b>quotes the line</b> it based the number on.</li></ul></div>`,
 init:()=>{const r=q('.r0');r.style.opacity=1;const b=q('.r0 .rb');b.querySelector('.rb-start').style.width='20%';b.querySelector('.rb-grow').style.width='15%';b.querySelector('.rb-delta').style.opacity=1},
 steps:[
 {say:'To review a family, click the little arrow beside their name.',li:0,act:async()=>{const c=q('.r0 .ch');place(600,640,0);await move(c,900);await click(c);q('.r0').classList.add('open');hideCursor();
   await anim(q('.pnl'),[{opacity:0,transform:'translateY(-12px)'},{opacity:1,transform:'none'}],450)}},
 {say:'The panel opens underneath. On the left is the Starting point.',li:1,act:async()=>{spot(q('.base'),6);await wait(1200)}},
 {say:'The AI read the family’s first conversations with us, suggested a number, and it quotes the exact line it based that number on. So you can see its reasoning at a glance.',li:2,act:async()=>{spot(q('.qt'),5);await wait(2200);spot(null)}}]},

// ---- REVIEW ----
{html:()=>HEAD('Step 2','Review it: does the quote match what you know?')+`<div class="abs" style="left:58px;top:140px;width:720px">${PANEL(false)}
 <div class="anno an3" style="left:250px;top:250px;opacity:0">you know this family best</div></div>
 <div class="abs" style="left:790px;top:148px;width:440px"><ul class="pts"><li>Read the quote. <b>Is that this parent?</b></li><li>A start is always <b>between 0 and 6</b>. Higher numbers are earned later.</li><li>Never heard of IDEA or a 504? <b>0 or 1</b>.</li><li>Been through IEPs, knows the words? <b>2 to 6</b>.</li></ul></div>`,steps:[
 {say:'Now read that quote, and ask yourself one thing. Is that this parent? You have talked to them. You know this family far better than the AI does.',li:0,act:async()=>{spot(q('.qt'),5);await wait(1400);await anim(q('.an3'),[{opacity:0,transform:'rotate(-4deg) translateY(10px)'},{opacity:1,transform:'rotate(-4deg)'}],450);await wait(800);spot(null)}},
 {say:'A starting point is always somewhere between zero and six. Seven and above can only be earned, through workshops, meetings and certification, after the case opens.',li:1,act:async()=>{spot(q('.selx'),6);await wait(1800);spot(null)}},
 {say:'If the parent had never heard of IDEA or a 504, that is a zero or a one.',li:2,act:async()=>{await wait(900)}},
 {say:'If they have been through IEP meetings and know the basic words, that is somewhere from two to six. The more they already know, the higher.',li:3,act:async()=>{await wait(1200)}}]},

// ---- UPDATE ----
{html:()=>HEAD('Step 3','Change it, or confirm it')+`<div class="abs" style="left:58px;top:140px;width:720px">${PANEL(false)}</div>
 <div class="abs" style="left:790px;top:148px;width:440px"><ul class="pts"><li>Pick the right number in <b>Starting score</b>. Half points are fine.</li><li>Press <b>Confirm</b>.</li><li>It now says <b>Confirmed by</b> you, with the date.</li><li>Changed your mind later? Press <b>change</b>.</li></ul></div>`,steps:[
 {say:'Say you know this parent actually knows a good deal more than the notes showed. Open the Starting score box.',li:0,act:async()=>{const s=q('.selx');place(500,640,0);await move(s,900);await click(s);const p=pos(s);
   const d=add(`<div class="ddrop" style="left:${p.x}px;top:${p.y+26}px">${['0','0.5','1','1.5','2','2.5','3','3.5','4','4.5','5','5.5','6'].map(v=>`<div class="${v==='3'?'hi':''}">${v}</div>`).join('')}</div>`);
   await anim(d,[{opacity:0,transform:'translateY(-8px)'},{opacity:1,transform:'none'}],300);const h=d.querySelector('.hi');await move(h,700);await click(h);d.remove();s.textContent='3';await anim(s,[{background:'#FDE68A'},{background:'#fff'}],700)}},
 {say:'Pick three, and press Confirm.',li:1,act:async()=>{const c=q('.cbtn');await move(c,700);await click(c);hideCursor();const o=q('.ovl');o.textContent='Confirmed by you · 2026-09-24';o.style.color='#166534';
   await anim(o,[{transform:'scale(1.25)'},{transform:'scale(1)'}],450);q('.spn').textContent='3';const p=pos(c);confetti(p.x+30,p.y,50)}},
 {say:'That is it. The panel now says it was confirmed by you, and when. Everyone else can see it has been checked by a person.',li:2,act:async()=>{spot(q('.ovl'),5);await wait(1600);spot(null)}},
 {say:'And if you change your mind later, there is a small change link beside it. You can always come back.',li:3,act:async()=>{await wait(900)}}]},

// ---- WHAT HAPPENS TO THE BAR ----
{html:()=>HEAD('What moves','The progress stays, only the start shifts')+`<div class="abs" style="left:58px;top:180px;width:700px">
 <div style="background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(15,23,42,.10);padding:26px 24px">
  <div style="font-size:13px;color:#64748B;font-weight:800;margin-bottom:8px">BEFORE</div>${BAR(2,3.5,true,'x1')}
  <div style="font-size:13px;color:#64748B;font-weight:800;margin:22px 0 8px">AFTER YOU CONFIRM 3</div>${BAR(3,4.5,true,'x2')}</div></div>
 <div class="abs" style="left:790px;top:148px;width:440px"><ul class="pts"><li>Everything the family <b>has earned</b> stays with them.</li><li>Move the start up one, and the <b>now</b> moves up one too.</li><li>Nothing is lost, and <b>nothing is scored twice</b>.</li></ul></div>`,steps:[
 {say:'What happens to the bar when you change the start? Here it is before. A start of two, plus one and a half earned, makes three and a half.',li:0,act:async()=>{await grow(q('.x1'),800)}},
 {say:'Confirm a start of three, and everything the family earned comes along with it. Three, plus the same one and a half, makes four and a half.',li:1,act:async()=>{await grow(q('.x2'),800);spot(q('.x2 .rb-score'),8);await wait(1400);spot(null)}},
 {say:'So nothing they have earned is ever lost, and nothing is ever counted twice.',li:2,act:async()=>{await wait(900)}}]},

// ---- WHAT EARNS POINTS ----
{html:()=>HEAD('After the start','What the AI checks look for')+`<div class="abs" style="left:58px;top:150px;width:720px">${PANEL(true,true)}</div>
 <div class="abs" style="left:790px;top:148px;width:440px"><ul class="pts"><li>Every other day, the AI checks <b>only what is new</b>.</li><li><b>Workshops</b> the parent actually attended.</li><li><b>School meetings</b>, once we record how they went.</li><li><b>Certification</b>, and <b>notes</b> showing the parent doing it themselves.</li></ul></div>`,steps:[
 {say:'Once the start is set, the AI takes it from there. Every other day it looks at what is new for each family, and only what is new. It never goes back over what it already scored.',li:0,act:async()=>{spot(q('.lg'),6);for(const r of document.querySelectorAll('.scene.on .lg tr')){await anim(r,[{opacity:0,transform:'translateX(20px)'},{opacity:1,transform:'none'}],320)}await wait(600);spot(null)}},
 {say:'It gives points for workshops the parent actually attended.',li:1,act:async()=>{spot(q('.k.ws'),5);await wait(1200)}},
 {say:'For school meetings, once we have recorded how they went.',li:2,act:async()=>{spot(q('.k.mt'),5);await wait(1200)}},
 {say:'For certification, and for notes that show the parent doing things for themselves. Like writing to the school on their own.',li:3,act:async()=>{spot(null);await wait(1200)}}]},

// ---- LOGGING A SCHOOL MEETING ----
{html:()=>HEAD('Your part','Log school meetings so they count')+`<div class="abs" style="left:58px;top:128px;width:700px">${FORM()}</div>
 <div class="abs" style="left:790px;top:148px;width:440px"><ul class="pts"><li>Log it as an Interaction with the Channel <b>Out of office meeting</b>.</li><li>Two new boxes appear: <b>How did it go?</b></li><li>And <b>Parent led it</b>, when the parent ran the meeting.</li><li>A meeting logged any other way <b>does not count</b>.</li></ul></div>`,steps:[
 {say:'Here is the part that is up to you. When a family has a school meeting, log it as an interaction, and set the Channel to Out of office meeting.',li:0,act:async()=>{const c=q('.chn');place(500,640,0);await move(c,900);await click(c);c.textContent='Out of office meeting';await anim(c,[{background:'#FDE68A'},{background:'#fff'}],700)}},
 {say:'Two new boxes appear. How did it go: worked, partly, or didn’t.',li:1,act:async()=>{hideCursor();await anim(q('.mtg'),[{opacity:0,transform:'translateY(-12px) scale(.96)'},{opacity:1,transform:'none'}],450);const o=q('.o1');await move(o,700);await click(o);o.classList.add('pick')}},
 {say:'And Parent led it. Tick that when the parent ran the meeting themselves. That is the big one.',li:2,act:async()=>{const t=q('.tk');await move(t,700);await click(t);t.classList.add('on');hideCursor();const p=pos(t);confetti(p.x,p.y,40)}},
 {say:'One warning. A meeting logged any other way, say as a phone call, the AI cannot count. Out of office meeting is the only channel it reads for meetings.',li:3,act:async()=>{const s=add(`<div class="stamp" style="left:440px;top:560px;font-size:24px">ONLY THIS CHANNEL</div>`);await anim(s,[{opacity:0,transform:'rotate(-14deg) scale(2.2)'},{opacity:1,transform:'rotate(-14deg) scale(1)'}],450)}}]},

// ---- THIS IS THE START ----
{html:()=>HEAD('This is the start','We are still teaching the AI')+`<div class="abs" style="left:58px;top:140px"><div class="feed">
 <div class="fcard f0"><div class="ic" style="background:#0891B2">1</div><p>The AI only knows <b>what is in our notes</b>. Nothing else.</p></div>
 <div class="fcard f1"><div class="ic" style="background:#D63384">2</div><p>Every time you <b>correct a starting point</b>, you show us where it is getting it wrong.</p></div>
 <div class="fcard f2"><div class="ic" style="background:#7C3AED">3</div><p>The team will set <b>how the scoring works</b> at our Wednesday meetings, and the AI gets better each time.</p></div></div></div>
 <div class="brain" style="left:880px;top:230px">AI</div>`,steps:[
 {say:'Now the most important part. This is the start. We are still teaching the AI how to score our families, and it will not always be right.',act:async()=>{const b=q('.brain');await anim(b,[{opacity:0,transform:'scale(.3)'},{opacity:1,transform:'scale(1)'}],600);b.style.animation='bob 4s ease-in-out infinite'}},
 {say:'The AI only knows what is written in our notes. Nothing else. If it is not in the notes, as far as the AI is concerned, it did not happen.',act:async()=>{await anim(q('.f0'),[{opacity:0,transform:'translateX(-30px)'},{opacity:1,transform:'none'}],420);
   const bp=pos(q('.brain'));for(let i=0;i<6;i++){const d=add(`<div class="dotfly" style="left:700px;top:${190+i*14}px"></div>`);anim(d,[{transform:'translate(0,0)',opacity:1},{transform:`translate(${bp.x+80-700}px,${bp.y+90-190-i*14}px)`,opacity:0}],900,'ease-in',i*120).then(()=>d.remove())}await wait(1400)}},
 {say:'Every time you correct a starting point, you are showing us where it is getting things wrong. That is exactly what we need.',act:async()=>{await anim(q('.f1'),[{opacity:0,transform:'translateX(-30px)'},{opacity:1,transform:'none'}],420)}},
 {say:'And as a team, we will decide how the scoring should work, at our Wednesday meetings. What a ten really takes, and what each thing is worth. The AI gets better every time we do.',act:async()=>{await anim(q('.f2'),[{opacity:0,transform:'translateX(-30px)'},{opacity:1,transform:'none'}],420);const p=pos(q('.brain'));confetti(p.x+95,p.y+60,70)}}]},

// ---- WRITE NOTES THE AI CAN USE ----
{html:()=>HEAD('Help it learn','Write down what the parent did')+`<div class="abs" style="left:58px;top:140px"><div class="cmp2">
 <div class="cw0"><h4 style="color:#B45309">Hard for the AI</h4><div class="nt">Called mom. Discussed IEP. Will follow up.</div></div>
 <div class="cw1"><h4 style="color:#166534">Easy for the AI</h4><div class="nt">Mom <mark>wrote the email to the principal herself</mark> asking for the evaluation in writing. She <mark>brought her own list of questions</mark>.</div></div></div>
 <div style="margin-top:22px;width:1160px"><ul class="pts" style="font-size:18px"><li>Write down <b>what the parent did themselves</b>, in plain words.</li><li>Quote them when they say something that shows what they know, or don't.</li></ul></div></div>`,steps:[
 {say:'So here is how you can help it learn. Compare these two notes.',act:async()=>{for(const s of ['.cw0','.cw1']){await anim(q(s),[{opacity:0,transform:'translateY(30px)'},{opacity:1,transform:'none'}],450)}}},
 {say:'The first one tells the AI almost nothing. Called mom, discussed the IEP. It cannot tell whether that parent is growing.',act:async()=>{spot(q('.cw0'),7);await wait(1800)}},
 {say:'The second one shows the parent doing it herself. She wrote to the principal. She brought her own questions. That is what moves a family up the scale.',act:async()=>{spot(q('.cw1'),7);for(const m of document.querySelectorAll('.scene.on mark')){await anim(m,[{background:'transparent'},{background:'#FDE68A'}],500)}await wait(900);spot(null)}},
 {say:'So write down what the parent did themselves, in plain words.',li:0,act:async()=>{await wait(600)}},
 {say:'And when a parent says something that shows what they know, or what they do not know yet, quote them. Those quotes are what the AI learns from.',li:1,act:async()=>{await wait(900)}}]},

// ---- RECAP ----
{html:()=>HEAD('Recap','Your starting point checklist')+`<div class="cl">${[
 'Main → <b>Reports</b> → <b>Case Advocacy</b>, the <b>Self-advocacy readiness</b> column',
 '<b>Orange</b> = where they started · the rest = progress, greener toward <b>10</b>',
 'Click <b>▸</b>, read the <b>quote</b>: is that this parent?',
 'A start is <b>0 to 6</b> · never heard of IDEA = <b>0–1</b> · knows the basics = <b>2–6</b>',
 'Pick the number, press <b>Confirm</b> · <b>change</b> if you need to later',
 'Log school meetings as <b>Out of office meeting</b>, with <b>How did it go?</b> and <b>Parent led it</b>',
 'Write down <b>what the parent did themselves</b>. This is the start, and it gets better as we teach it'
 ].map(t=>`<div class="ci"><div class="bx"><svg viewBox="0 0 26 26"><path d="M5 13 L11 19 L21 7"/></svg></div><span>${t}</span></div>`).join('')}</div>`,steps:[
 {say:'Let’s recap.',act:async()=>{for(const c of document.querySelectorAll('.scene.on .ci')){c.classList.add('on');await wait(150)}}},
 ...['Reports, then Case Advocacy, and the readiness column.','Orange is where they started. The rest is progress.','Open the family and read the quote.','A start is always zero to six.','Pick the number and press Confirm.','Log school meetings as Out of office meeting, and say how it went.','Write down what the parent did themselves. This is the start.']
  .map((s,i)=>({say:s,act:async()=>{const cs=document.querySelectorAll('.scene.on .ci');cs.forEach((c,j)=>{c.classList.add('on');if(j<i)c.classList.add('done')});await wait(600);cs[i].classList.add('done')}}))]},

// ---- MAHALO ----
{cls:'cover',html:()=>`<div class="brand">The advocacy starting point</div><div class="hello">All done</div><h1>Mahalo<span class="nmc"></span>!</h1><p class="sub">Read the quote, set the start, write down what the parent did. Come back and watch it again any time.</p>
 <div class="abs cvm" style="left:740px;top:200px;background:#fff;border-radius:16px;padding:22px 24px;box-shadow:0 24px 60px rgba(0,0,0,.3);transform:rotate(3deg);animation:bob 5s ease-in-out infinite">${BAR(3,10,false,'mb')}<div class="stg" style="color:#166534;font-size:12px">Self-advocate</div></div>
 <div class="gate" style="top:460px"><button class="btn ghost" data-go="again">Watch again</button><button class="btn" data-go="close">Close</button></div>${WAVES}`,
 steps:[{say:'Mahalo {name}! Read the quote, set the starting point, and write down what the parent did. Every correction teaches it something. You have got this.',act:async()=>{await wait(300);grow(q('.mbar'),900);await wait(900);confetti(640,300,140)}}]}
];
</script>
