<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI: Upload a Flyer — Training</title>
<link rel="stylesheet" href="deck-base.css">
<style>
/* ── Events & Programs toolbar ───────────────────────────────────────── */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{font-size:12.5px;font-weight:700;color:#475569;background:#fff;border:1px solid #E2E8F0;border-radius:8px;padding:6px 11px}
.chip.act{background:#0891B2;color:#fff;border-color:#0891B2}
.tbar{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.addb{background:#0891B2;color:#fff;font-weight:800;font-size:15px;border-radius:9px;padding:9px 18px;transition:transform .15s}
.ghb{border:1px solid #CBD5E1;background:#fff;color:#0E6E8C;font-weight:700;font-size:12.5px;border-radius:8px;padding:7px 12px;margin-left:auto}

/* ── the Add-Event funnel ────────────────────────────────────────────── */
.fn{width:700px;background:#fff;border-radius:14px;box-shadow:0 20px 50px rgba(15,23,42,.3);overflow:hidden;font-size:13px}
.fnh{display:flex;align-items:center;gap:9px;padding:11px 14px;background:linear-gradient(90deg,#0E7490,#22A6C7);color:#fff}
.fnh b{font-size:15.5px;margin-right:auto}
.fnb{padding:15px 20px 16px}
.stp{display:flex;gap:8px;justify-content:center;align-items:center;margin-bottom:16px}
.stp i{width:25px;height:25px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;font-style:normal;background:#E2E8F0;color:#64748B;transition:all .35s}
.stp i.on{background:#0891B2;color:#fff}
.stp i.done{background:#67E8F9;color:#fff}
.stp s{width:22px;height:2px;background:#E2E8F0;display:block}
.fnt{text-align:center;font-size:15.5px;font-weight:800;color:#0891B2;margin-bottom:4px}
.fns{text-align:center;font-size:12.6px;color:#475569;margin-bottom:14px}
.skip{text-align:center;margin-top:10px;font-size:12.2px;color:#0891B2;font-weight:700}
.fbar{display:flex;justify-content:space-between;gap:8px;margin-top:18px;padding-top:12px;border-top:1px solid #E2E8F0}
.gb{border:1px solid #CBD5E1;background:#fff;color:#0E6E8C;font-weight:800;font-size:12.5px;border-radius:8px;padding:7px 14px}
.gb.inv{visibility:hidden}
.pb{background:#0891B2;color:#fff;font-weight:800;font-size:12.5px;border-radius:8px;padding:7px 14px;transition:transform .15s}
/* the real zone is a blue dashed box on a pale cyan fill */
.dz{border-color:#0891B2}
.dz .dzt b{font-size:14.5px}
.dz .dzt small{display:block;margin-top:4px}
.dz .drop{font-size:19px}

/* ── the flyer, drawn in CSS (never an image) ────────────────────────── */
.fly{width:152px;height:198px;background:#fff;border:1px solid #CBD5E1;border-radius:4px;box-shadow:0 16px 34px rgba(15,23,42,.3);padding:10px;overflow:hidden;position:relative}
.fly .bnd{height:26px;border-radius:3px;background:linear-gradient(90deg,#0E7490,#22A6C7)}
.fly .ttl{height:9px;border-radius:2px;background:#0F172A;margin-top:9px}
.fly .ttl.s{width:64%}
.fly .ln{height:5px;border-radius:2px;background:#CBD5E1;margin-top:6px}
.fly .w1{width:90%}.fly .w2{width:74%}.fly .w3{width:82%}
.fly .dt{height:7px;border-radius:2px;background:#B45309;margin-top:10px;width:58%}
.fly .dt.s2{width:50%;margin-top:6px}
.fly .blk{height:28px;border-radius:3px;background:#FDE68A;margin-top:11px}
.fly .sw{position:absolute;left:0;right:0;height:28px;top:-32px;background:linear-gradient(transparent,rgba(8,145,178,.6),transparent)}
.fly.scan .sw{animation:sweep 1.05s linear infinite}
@keyframes sweep{from{top:-32px}to{top:100%}}
.fly .noyr{position:absolute;right:-4px;bottom:44px;background:#DC2626;color:#fff;font-size:9.5px;font-weight:800;border-radius:6px;padding:3px 7px;opacity:0;transform:scale(.4);transition:all .4s cubic-bezier(.3,1.6,.5,1)}
.fly .noyr.on{opacity:1;transform:none}

/* ── type picker cards ───────────────────────────────────────────────── */
.tcs{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tc{border:2px solid #E2E8F0;border-radius:12px;padding:10px 12px;background:#fff;position:relative;transition:all .4s}
.tc.gs{background:#F0FDFF}
.tc b{display:block;font-weight:800;color:#0F172A;font-size:13px}
.tc b em{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle;font-style:normal}
.tc small{display:block;font-size:10.7px;color:#64748B;margin-top:3px;line-height:1.35}
.aig{position:absolute;top:8px;right:8px;color:#fff;font-size:9.5px;font-weight:800;border-radius:10px;padding:2px 7px;opacity:0;transform:scale(.4);transition:all .4s cubic-bezier(.3,1.6,.5,1)}
.aig.on{opacity:1;transform:none}

/* ── the pre-filled editor ───────────────────────────────────────────── */
.edc{width:706px;background:#fff;border:1px solid #D5DEE8;border-radius:12px;box-shadow:0 12px 30px rgba(15,23,42,.12);overflow:hidden}
.edh{display:flex;align-items:center;gap:8px;padding:10px 14px;background:linear-gradient(90deg,#0E7490,#22A6C7);color:#fff;font-weight:800;font-size:14.5px}
.edb{padding:12px 16px 14px}
.efg{display:grid;grid-template-columns:124px 1fr;gap:7px 12px;align-items:center}
.efl{font-size:10.6px;letter-spacing:.05em;text-transform:uppercase;color:#64748B;font-weight:800;text-align:right;line-height:1.2}
.efl u{color:#DC2626;text-decoration:none}
.efi{border:1px solid #CBD5E1;border-radius:5px;min-height:28px;padding:5px 9px;font-size:12.4px;background:#fff;white-space:nowrap;overflow:hidden;color:#0F172A;transition:box-shadow .4s}
.efi.ph{color:#94A3B8}
.efi.lit{box-shadow:inset 0 0 0 2px #67E8F9}
.efi.typing::after{content:"|";color:#0891B2;animation:blink .6s steps(1) infinite}
.efi.amb{background:#FFFBEB;border-color:#F59E0B}
.svb{background:#0891B2;color:#fff;font-weight:800;font-size:14px;border-radius:8px;padding:9px 22px;display:inline-block;margin-top:13px;transition:transform .15s}
.imgstub{height:34px;border-radius:5px;border:1px solid #CBD5E1;background:#F8FAFC;display:flex;align-items:center;gap:9px;padding:4px 8px;font-size:11.8px;color:#475569}
.imgstub .tn{width:20px;height:26px;border-radius:2px;background:linear-gradient(#22A6C7 0 30%,#fff 30%);border:1px solid #CBD5E1;flex:none}

/* ── warning rows ────────────────────────────────────────────────────── */
.wr{display:flex;flex-direction:column;gap:11px}
.wr .w{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--line);border-left:5px solid #B45309;border-radius:12px;padding:12px 18px;opacity:0;transform:translateX(-26px);transition:all .45s ease}
.wr .w.on{opacity:1;transform:none}
.wr .w b{font-size:16.5px;color:#0F172A;width:236px;flex:none}
.wr .w p{margin:0;font-size:15px;color:var(--soft);line-height:1.4}

/* ── toasts, alerts, failure cards ───────────────────────────────────── */
.toast{position:absolute;background:#0891B2;color:#fff;font-weight:700;font-size:14.5px;border-radius:9px;padding:11px 17px;box-shadow:0 14px 30px rgba(15,23,42,.3);z-index:35}
.toast.warn{background:#D97706}.toast.err{background:#DC2626}.toast.good{background:#16A34A}
.alrt{width:352px;background:#fff;border-radius:12px;box-shadow:0 22px 52px rgba(15,23,42,.35);overflow:hidden}
.alrt .at{background:#EEF2F6;padding:8px 14px;font-size:11.5px;font-weight:800;color:#475569;letter-spacing:.05em;text-transform:uppercase}
.alrt .ab{padding:16px 16px 6px;color:#0F172A;font-size:14px}
.alrt .af{padding:12px 16px 14px;text-align:right}
.alrt .ok2{background:#2563EB;color:#fff;font-weight:700;font-size:13px;border-radius:6px;padding:7px 22px;display:inline-block}
.fc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 18px;box-shadow:0 8px 24px rgba(15,23,42,.08);opacity:0}
.fc h4{margin:0 0 3px;font-size:18px;color:var(--teal)}
.fc .w{font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#94A3B8;margin-bottom:9px}
.fc p{margin:0;font-size:14px;color:var(--soft);line-height:1.45}
.fc q{display:block;background:#FFFBEB;border:1px solid #FDE68A;border-radius:8px;padding:8px 11px;margin-top:9px;font-size:13px;color:#92400E;quotes:none;line-height:1.4}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}

/* ── the public events page, for the "it goes live" scene ────────────── */
.pub{width:300px;background:#fff;border:1px solid #E2E8F0;border-radius:12px;overflow:hidden;box-shadow:0 12px 30px rgba(15,23,42,.14)}
.pub .ph2{height:104px;background:linear-gradient(135deg,#0E7490,#22A6C7)}
.pub .pt2{padding:11px 14px 4px;font-weight:800;font-size:15px;color:#0F172A}
.pub .pd{padding:0 14px 4px;font-size:12.5px;color:#64748B}
.pub .pg{margin:8px 14px 14px;background:#0891B2;color:#fff;font-weight:800;font-size:12.5px;border-radius:8px;padding:8px 0;text-align:center}
.browser{width:340px;border-radius:12px;overflow:hidden;box-shadow:0 18px 44px rgba(15,23,42,.3);background:#fff}
.browser .bt3{height:30px;background:#EEF2F6;display:flex;align-items:center;gap:6px;padding:0 11px;font-size:11px;color:#64748B;font-weight:700}
.browser .bt3 i{width:9px;height:9px;border-radius:50%;background:#CBD5E1;display:inline-block}
.browser .bc{padding:14px 20px}
</style></head><body>
<div id="view"><div id="stage"><div id="nbar"><i></i></div>
<div id="scenes"></div>
<div id="spot"></div>
<svg id="cursor" viewBox="0 0 28 32"><path d="M3 2 L3 26 L9.5 19.5 L14 29 L18.5 27 L14 17.5 L23 17.5 Z" fill="#fff" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/></svg>
</div></div>
<div id="cap" aria-live="polite"></div>
<div id="bar">
 <button id="prev">Back</button><button id="play">Start</button><button id="next">Next</button>
 <div id="dots"></div>
 <button id="capbtn" aria-pressed="false">Captions</button><button id="voice" aria-pressed="true">Voice on</button>
</div>
<script src="deck-mocks.js"></script>
<script>
const DECK_ID='ai-upload-flyers-2026-09';

/* A flyer, drawn entirely in CSS. Coloured blocks stand in for its text. */
const FLY=(cls)=>`<div class="fly ${cls||''}"><div class="sw"></div>
 <div class="bnd"></div><div class="ttl"></div><div class="ttl s"></div>
 <div class="ln w1"></div><div class="ln w2"></div><div class="ln w3"></div>
 <div class="dt"></div><div class="dt s2"></div><span class="noyr">no year</span>
 <div class="blk"></div></div>`;

/* The 7 type cards, in the order the funnel draws them. Colours are the live
   badge colours from _CMS_TYPE_META (index.html:30133-30139). */
const TYPES=[
 ['learning_labs','#0891B2','Learning Labs','Virtual workshop with signups &amp; Zoom.'],
 ['parent_talk_cafe','#F97316','Parent Talk Cafe','Casual Facebook-group chat; single confirmation, no Zoom reminders.'],
 ['connect_gen','#16A34A','Connect-Gen','Ongoing recurring program (weekly / monthly schedule).'],
 ['screening','#7C3AED','Screening','Booth with the full screening-consent QR form.'],
 ['remote_signup','#4F46E5','Remote Signup','Off-site in-person event that takes RSVPs / signups.'],
 ['outreach_booth','#92400E','Outreach Booth','Booth / table with a simple QR signup form.'],
 ['flyer','#F59E0B','Flyer','Announcement only &mdash; a flyer image, no signups.']];

const TCARDS=(guess)=>`<div class="tcs">${TYPES.map(([k,c,l,d])=>
 `<div class="tc t-${k}"><span class="aig a-${k}" style="background:${c}">AI guess</span>
  <b><em style="background:${c}"></em>${l}</b><small>${d}</small></div>`).join('')}</div>`;

const DOTS=(n)=>`<div class="stp">${[1,2,3].map(i=>
 `<i class="d${i} ${i===n?'on':(i<n?'done':'')}">${i}</i>`).join('<s></s>')}</div>`;

/* Step 1 of the funnel — every label verbatim from index.html:9053-9064 */
const STEP1=(status)=>`<div class="fn"><div class="fnh"><b>Add Event</b><span>&times;</span></div>
 <div class="fnb">${DOTS(1)}
  <div class="fnt">Start with the flyer</div>
  <div class="fns">Upload the event flyer &mdash; I'll read it, fill in the details, and guess the event type.</div>
  <div class="dz"><div class="dzt"><b>Click to upload a flyer <span>&mdash; or drag &amp; drop</span></b><small>JPG, PNG, WebP, or PDF &middot; max 6 MB</small></div><div class="drop">Drop it here</div></div>
  <div class="status">${status||''}</div>
  <div class="skip">No flyer &mdash; skip and pick the type &rarr;</div>
  <div class="fbar"><span class="gb inv">&larr; Back</span><span class="pb">No flyer &mdash; skip &rarr;</span></div>
 </div></div>`;

const STEP2=()=>`<div class="fn"><div class="fnh"><b>Add Event</b><span>&times;</span></div>
 <div class="fnb">${DOTS(2)}
  <div class="fnt" style="color:#0F172A">What kind of event is this?</div>
  <div class="fns">Pick a type &mdash; the right editor opens next, pre-filled.</div>
  ${TCARDS()}
  <div class="fbar"><span class="gb">&larr; Back</span></div>
 </div></div>`;

/* The pre-filled event editor. Field labels verbatim from index.html:9121-9210 */
const ROW=(cls,label,ph,req)=>`<div class="efl">${label}${req?' <u>*</u>':''}</div><div class="efi ph ${cls}">${ph}</div>`;
const EDITOR=()=>`<div class="edc"><div class="edh">Add Event</div><div class="edb"><div class="efg">
 ${ROW('f-title','Title','Event or program title',1)}
 ${ROW('f-desc','Description','Describe the event or program...')}
 <div class="efl">Image / Flyer</div><div class="imgstub f-img"><span class="tn"></span><span class="f-imgt">No file chosen</span></div>
 ${ROW('f-date','Event Date','yyyy-mm-dd',1)}
 ${ROW('f-time','Time','e.g. 2:00 PM')}
 ${ROW('f-loc','Location','e.g. Hawai&#699;i Convention Center')}
 ${ROW('f-sd','Signup Dates','none yet')}
 ${ROW('f-start','Start Showing','yyyy-mm-dd',1)}
 ${ROW('f-past','Move to Past','yyyy-mm-dd',1)}
 ${ROW('f-rem','Remove','yyyy-mm-dd',1)}
</div><span class="svb">Save</span></div></div>`;

const FILLS=[['f-title','Learning Labs November: Reading Aloud at Home'],
 ['f-desc','A two-part workshop on shared reading routines at home.'],
 ['f-date','2026-11-06'],['f-time','5:00 PM'],['f-loc','Zoom'],
 ['f-sd','November 6, 2026, 5:00 PM - Reading Aloud'],
 ['f-start','2026-09-23'],['f-past','2026-11-14'],['f-rem','2026-12-31']];

const SC=[

/* 1 ─────────────────────────────────────────────────────────────────── */
{cls:'cover',html:()=>`<div class="brand">Leadership in Disabilities &amp; Achievement of Hawai&#699;i</div><div class="hello">Aloha <span class="nm"></span></div>
 <h1>Let the flyer<br>fill in the form</h1><p class="sub">Drop an event flyer on the box and it reads it for you. Then you check it. About five minutes.</p>
 <div class="abs" style="left:800px;top:150px;transform:rotate(-6deg);animation:bob 5s ease-in-out infinite">${FLY()}</div>
 <div class="abs" style="left:980px;top:230px;transform:rotate(7deg);animation:bob 5s 1.2s ease-in-out infinite">${FLY()}</div>
 <div class="spark" style="left:1180px;top:140px">${SPARK}</div><div class="spark" style="left:760px;top:420px;animation-delay:1s">${SPARK}</div>
 <div class="gate"><button class="btn" data-go="start">Start training</button><button class="btn ghost" data-go="skip">Skip for now</button><label><input type="checkbox" id="voiceChk" checked> Read it out loud to me</label></div>${WAVES}`,
 steps:[{say:'Aloha {name}! When a new event flyer lands in your inbox, you don’t have to retype it. Drop it on the upload box and the details come across by themselves. Then you check the work. About five minutes.'}]},

/* 2 ─────────────────────────────────────────────────────────────────── */
{html:()=>HEAD('Getting there','Events &amp; Programs &rarr; + Add Event')+`<div class="abs" style="left:58px;top:128px;width:1170px">
 <div class="crumb">CMS &rarr; Content Management &rarr; <b>Events &amp; Programs</b></div>
 <div class="chips"><span class="chip act">All</span><span class="chip">Learning Labs</span><span class="chip">Parent Talk Cafe</span><span class="chip">Connect-Gen</span><span class="chip">Screening</span><span class="chip">Remote Signup</span><span class="chip">Outreach Booth</span><span class="chip">Flyer</span></div>
 <div class="tbar"><span class="addb">+ Add Event</span><span class="ghb">Show expired &amp; archived</span></div>
 ${ldahEventCards()}</div>`,steps:[
 {say:'Start on the CMS tab, open Content Management, then Events and Programs. This is the one list for everything.',act:async()=>{for(const c of document.querySelectorAll('.scene.on .evc')){await anim(c,[{opacity:0,transform:'translateY(40px)'},{opacity:1,transform:'none'}],380)}}},
 {say:'There is one blue button that makes anything: plus Add Event.',act:async()=>{const b=q('.addb');spot(b,6);place(640,660,0);await move(b,950);await wait(700)}},
 {say:'Press it and a little three-step wizard opens.',act:async()=>{const b=q('.addb');await click(b);await wait(200);hideCursor();spot(null);
   const m=add(`<div class="abs mw" style="left:290px;top:120px;transform:scale(.82);transform-origin:top left">${STEP1()}</div>`);
   await anim(m,[{opacity:0,transform:'scale(.6)'},{opacity:1,transform:'scale(.82)'}],500)}},
 {say:'Step one is the flyer. Step two is the type. Step three opens the editor. That is the whole thing.',act:async()=>{spot(q('.stp'),8);await wait(1700);spot(null)}}]},

/* 3 ─────────────────────────────────────────────────────────────────── */
{html:()=>HEAD('Step 1','The upload box, word for word')+`<div class="abs" style="left:58px;top:130px;transform:scale(.97);transform-origin:top left">${STEP1()}</div>
 <div class="abs" style="left:790px;top:148px;width:440px"><ul class="pts">
  <li><b>Click to upload a flyer</b> &mdash; or drag one straight onto the box.</li>
  <li><b>JPG, PNG, WebP, or PDF &middot; max 6 MB.</b> Nothing else is accepted.</li>
  <li>A photo off an iPhone is usually a <b>HEIC</b> &mdash; that one will be refused.</li>
  <li>No flyer? Use <b>No flyer &mdash; skip and pick the type</b> and fill the form by hand.</li></ul></div>`,steps:[
 {say:'Here is step one. The dashed box takes a click or a drag, whichever you prefer.',li:0,act:async()=>{spot(q('.dz'),6);await wait(1500)}},
 {say:'Read the small print under it. JPG, PNG, WebP or PDF, and under six megabytes. Nothing else gets through.',li:1,act:async()=>{spot(q('.dz small'),6);await wait(2000)}},
 {say:'That matters, because a photo taken on an iPhone is usually a HEIC file. Open it and save it as a JPG first, or it will be turned away.',li:2,act:async()=>{await wait(1600)}},
 {say:'And if there is no flyer at all, take the skip link underneath. You pick the type yourself and type the form in by hand.',li:3,act:async()=>{spot(q('.skip'),6);await wait(1600);spot(null)}}]},

/* 4 ─────────────────────────────────────────────────────────────────── */
{html:()=>HEAD('Step 1','Drag it in, and let it read')+`<div class="abs" style="left:58px;top:130px;transform:scale(.97);transform-origin:top left">${STEP1()}</div>
 <div class="abs fw" style="left:858px;top:498px">${FLY()}</div>
 <div class="abs" style="left:790px;top:148px;width:440px"><ul class="pts">
  <li>Drag the flyer over the box &mdash; it <b>turns pink and says Drop it here</b>.</li>
  <li>Let go, and the status line reads <b>Reading your flyer&hellip; (about 5&ndash;8 seconds)</b>.</li>
  <li>Nothing is saved yet. It is only <b>reading</b>.</li></ul></div>`,steps:[
 {say:'Now the part everybody enjoys. Take the flyer and drag it over the dashed box.',li:0,act:async()=>{const z=q('.dz'),f=q('.fw'),zp=pos(z),fp=pos(f);
   f.dataset.tx=(zp.x+zp.w/2-fp.x-76)+'';f.dataset.ty=(zp.y+zp.h/2-fp.y-99)+'';
   await anim(f,[{transform:'none'},{transform:`translate(${f.dataset.tx}px,${f.dataset.ty}px) scale(.82) rotate(-6deg)`}],1000,'cubic-bezier(.4,.1,.3,1)');
   z.classList.add('over')}},
 {say:'The box reacts. It goes pink and tells you to drop it here, so you know it has you.',li:0,act:async()=>{await wait(1400)}},
 {say:'Let go. The flyer disappears into the box and the status line underneath starts reading.',li:1,act:async()=>{const z=q('.dz'),f=q('.fw');
   await anim(f,[{transform:`translate(${f.dataset.tx}px,${f.dataset.ty}px) scale(.82) rotate(-6deg)`,opacity:1},{transform:`translate(${f.dataset.tx}px,${f.dataset.ty}px) scale(.2) rotate(-6deg)`,opacity:0}],450);
   z.classList.remove('over');
   const s=q('.status');s.innerHTML='Reading your flyer&hellip; (about 5&ndash;8 seconds)';spot(s,7);await wait(1800)}},
 {say:'Five to eight seconds is normal. Wait for it. Nothing has been saved at this point — it is only reading the page.',li:2,act:async()=>{await wait(1500);spot(null)}}]},

/* 5 ─────────────────────────────────────────────────────────────────── */
{html:()=>HEAD('Step 2','It guesses the type &mdash; you decide')+`<div class="abs" style="left:58px;top:126px;transform:scale(.93);transform-origin:top left">${STEP2()}</div>
 <div class="abs" style="left:790px;top:144px;width:440px"><ul class="pts">
  <li>Seven cards, one per event type.</li>
  <li>Its guess gets an <b>AI guess</b> badge and a coloured border.</li>
  <li>The badge is a <b>suggestion, not an answer</b>. Click whichever card is right.</li>
  <li>If it is unsure, <b>no card is badged</b> at all &mdash; that is normal.</li></ul></div>`,steps:[
 {say:'Once it has read the flyer, step two opens. Seven cards, one for each kind of event we run.',li:0,act:async()=>{for(const c of document.querySelectorAll('.scene.on .tc')){await anim(c,[{opacity:0,transform:'translateY(18px)'},{opacity:1,transform:'none'}],200)}}},
 {say:'It marks its best guess with an AI guess badge and tints that card.',li:1,act:async()=>{const c=q('.t-learning_labs');c.classList.add('gs');c.style.borderColor='#0891B2';q('.a-learning_labs').classList.add('on');spot(c,6);await wait(1600)}},
 {say:'Treat that badge as a suggestion, nothing more. If the flyer is really a Parent Talk Cafe, click Parent Talk Cafe. Your click always wins.',li:2,act:async()=>{const t=q('.t-parent_talk_cafe');place(300,620,0);await move(t,900);await click(t);t.classList.add('gs');t.style.borderColor='#F97316';await wait(900);hideCursor();spot(null)}},
 {say:'And sometimes no card is badged at all. That just means it was not confident enough to pick one, so you pick.',li:3,act:async()=>{await wait(1300)}}]},

/* 6 ─────────────────────────────────────────────────────────────────── */
{html:()=>HEAD('Step 3','The form fills itself in')+`<div class="abs" style="left:58px;top:128px;transform:scale(.9);transform-origin:top left">${EDITOR()}</div>
 <div class="abs" style="left:790px;top:148px;width:440px"><ul class="pts">
  <li>Title, Description, Event Date, Time, Location.</li>
  <li><b>The flyer itself</b> becomes the event image &mdash; you don't upload it twice.</li>
  <li>The <b>Signup Dates</b> list, one line per session on the flyer.</li>
  <li><b>Start Showing, Move to Past, Remove</b> &mdash; worked out from the last session.</li>
  <li>A <b>cyan glow</b> marks every field it touched. It fades after a few seconds.</li></ul></div>`,
 init:()=>{},steps:[
 {say:'Press Open editor and the real event form appears, already filled in. Watch the fields land.',li:0,act:async()=>{
   for(const [c,v] of FILLS.slice(0,5)){const e=q('.'+c);e.classList.add('lit');await type(e,v,16)}}},
 {say:'Title, description, the date, the time, and the location. Notice Location says Zoom — when the flyer mentions Zoom it writes Zoom for you.',li:0,act:async()=>{spot(q('.f-loc'),6);await wait(1800);spot(null)}},
 {say:'The flyer you dropped is reused as the event picture, so you never have to upload it a second time.',li:1,act:async()=>{const i=q('.f-imgt');i.textContent='flyer.jpg';q('.f-img').classList.add('lit');spot(q('.f-img'),6);await wait(1600);spot(null)}},
 {say:'Then the signup dates. One line for every dated session printed on the flyer.',li:2,act:async()=>{const e=q('.f-sd');e.classList.add('lit');await type(e,FILLS[5][1],16);spot(e,6);await wait(1100);spot(null)}},
 {say:'And the three lifecycle dates at the bottom. Start showing is today, move to past is the day after the last session, and remove is the end of the following month.',li:3,act:async()=>{
   for(const [c,v] of FILLS.slice(6)){const e=q('.'+c);e.classList.add('lit');await type(e,v,16)}await wait(700)}},
 {say:'Every field it touched carries that cyan glow for a few seconds. That is your checklist — glow means a machine wrote it, so read it.',li:4,act:async()=>{await wait(1500)}}]},

/* 7 ─────────────────────────────────────────────────────────────────── */
{html:()=>HEAD('Check this first','The year')+`<div class="abs" style="left:100px;top:170px">${FLY()}</div>
 <div class="abs" style="left:300px;top:180px;width:440px">
  <div class="efg"><div class="efl">Event Date <u>*</u></div><div class="efi lit yr">2026-11-06</div>
  <div class="efl">Signup Dates</div><div class="efi lit yr2">November 6, 2026, 5:00 PM - Reading Aloud</div></div></div>
 <div class="abs" style="left:790px;top:148px;width:440px"><ul class="pts">
  <li>LDAH flyers often print <b>November 6</b> with <b>no year</b>.</li>
  <li>It fills in the <b>next time that date comes round</b>.</li>
  <li>For a flyer that has been sitting in your inbox, that can be <b>a year out</b>.</li>
  <li>A wrong year breaks reminders and attendance. <b>Read the year before you save.</b></li></ul></div>`,steps:[
 {say:'Now the one thing to check before anything else. The year.',li:0,act:async()=>{q('.noyr').classList.add('on');spot(q('.fly'),8);await wait(1400);spot(null)}},
 {say:'Our flyers almost always print the day and the month and leave the year off. So it has to work the year out.',li:0,act:async()=>{await wait(1200)}},
 {say:'The rule it follows is simple: it picks the next time that date comes round. For a flyer sent this week, that is right.',li:1,act:async()=>{spot(q('.yr'),6);await wait(1600);spot(null)}},
 {say:'But for a flyer that has been sitting in somebody’s inbox for months, the next time that date comes round can be a whole year away.',li:2,act:async()=>{await wait(1600)}},
 {say:'A wrong year is not cosmetic. Reminder emails never fire and attendance lands on the wrong event. Read the year, every single time.',li:3,act:async()=>{
   const s=add('<div class="stamp" style="left:150px;top:430px;font-size:27px">CHECK THE YEAR!</div>');
   await anim(s,[{opacity:0,transform:'rotate(-14deg) scale(3)'},{opacity:1,transform:'rotate(-14deg) scale(1)'}],450,'cubic-bezier(.5,0,.8,.6)');
   await wait(1600)}}]},

/* 8 ─────────────────────────────────────────────────────────────────── */
{html:()=>HEAD('Check this too','What a flyer cannot tell it')+`<div class="abs" style="left:80px;top:140px;width:1120px"><div class="wr">
 <div class="w i0"><b>Source</b><p>Event Zoom, Program Zoom, or Parent Talk Cafe. This picks which link goes in the confirmation and reminder emails.</p></div>
 <div class="w i1"><b>Grant / Program</b><p>Never printed on a flyer. Left off, the event is missing from the grant reports.</p></div>
 <div class="w i2"><b>Max capacity</b><p>Remote Signup events only. Blank means no limit, so a venue with 40 seats can oversell.</p></div>
 <div class="w i3"><b>Information flyer only</b><p>Tick it and there are no signups at all &mdash; it just shows in the Information section. Leave it unticked and the event takes registrations.</p></div>
</div></div>`,steps:[
 {say:'There are four things no flyer can tell it, and all four are on you.',act:async()=>{for(const c of document.querySelectorAll('.scene.on .w')){c.classList.add('on');await wait(200)}}},
 {say:'Source. Event Zoom, Program Zoom, or Parent Talk Cafe. That choice decides which link families get in their confirmation and reminder emails.',act:async()=>{spot(q('.i0'),6);await wait(2000)}},
 {say:'Grant or Program. A flyer never prints who funded the event, so if you leave it blank the event simply will not appear in the grant reports.',act:async()=>{spot(q('.i1'),6);await wait(2100)}},
 {say:'Max capacity, on a Remote Signup. Leave it empty and there is no limit, so a room with forty seats can take a hundred bookings.',act:async()=>{spot(q('.i2'),6);await wait(2000)}},
 {say:'And the information flyer only box. Ticked, it is an announcement with no signups. Unticked, it takes registrations. Get that one the wrong way round and families either cannot sign up, or sign up for something that was never a real event.',act:async()=>{spot(q('.i3'),6);await wait(2600);spot(null)}}]},

/* 9 ─────────────────────────────────────────────────────────────────── */
{html:()=>HEAD('Before you press Save','It goes on the public website')+`<div class="abs" style="left:58px;top:150px;width:470px">
 <div class="efg"><div class="efl">Start Showing <u>*</u></div><div class="efi lit amb st">2026-09-23</div>
 <div class="efl">Move to Past <u>*</u></div><div class="efi lit">2026-11-14</div>
 <div class="efl">Remove <u>*</u></div><div class="efi lit">2026-12-31</div></div>
 <div style="margin-top:18px"><span class="svb sv2">Save</span></div></div>
 <div class="abs bw" style="left:590px;top:140px;opacity:0"><div class="browser"><div class="bt3"><i></i><i></i><i></i><span style="margin-left:8px">ldahawaii.org/events</span></div>
 <div class="bc"><div class="pub"><div class="ph2"></div><div class="pt2">Learning Labs November: Reading Aloud at Home</div><div class="pd">November 6, 2026 &middot; 5:00 PM &middot; Zoom</div><div class="pg">Sign Up</div></div></div></div></div>`,steps:[
 {say:'Now the biggest thing in this whole training. Look at Start Showing.',act:async()=>{spot(q('.st'),7);await wait(1500)}},
 {say:'It filled that in with today’s date. And Start Showing means the day the event appears on the public Events page, where families can sign up.',act:async()=>{await wait(2000);spot(null)}},
 {say:'So the moment you press Save, this is live on ldahawaii dot org. Not a draft. Not a preview. Live.',act:async()=>{const b=q('.sv2');place(420,620,0);await move(b,850);await click(b);hideCursor();
   const w=q('.bw');await anim(w,[{opacity:0,transform:'translateY(30px) scale(.9)'},{opacity:1,transform:'none'}],550)}},
 {say:'Nobody is emailed by the save itself. But the page is out there, and the emails start the minute somebody signs up.',act:async()=>{
   const t=add('<div class="toast good" style="left:120px;top:600px">Event added.</div>');await pop(t);await wait(1400)}},
 {say:'So if you are not ready for families to see it, put a later date in Start Showing before you save. That is the safe way to park one.',act:async()=>{
   const s=add('<div class="stamp" style="left:150px;top:420px;font-size:25px">SAVE = PUBLISHED</div>');
   await anim(s,[{opacity:0,transform:'rotate(-14deg) scale(3)'},{opacity:1,transform:'rotate(-14deg) scale(1)'}],450,'cubic-bezier(.5,0,.8,.6)');
   spot(q('.st'),7);await wait(2200);spot(null)}}]},

/* 10 ────────────────────────────────────────────────────────────────── */
{html:()=>HEAD('When it does not work','Three things you will see')+`<div class="abs" style="left:58px;top:136px;width:1170px"><div class="f3">
 <div class="fc k0"><div class="w">Wrong file type</div><h4>A pop-up box</h4><p>You dropped a HEIC, a Word file, or something else.</p><q>Please use a JPG, PNG, WebP, or PDF flyer.</q></div>
 <div class="fc k1"><div class="w">Too big</div><h4>A pop-up box</h4><p>Over six megabytes. Shrink it, or re-save it as a JPG.</p><q>Please use a flyer under 6 MB.</q></div>
 <div class="fc k2"><div class="w">It could not read it</div><h4>An amber line</h4><p>Blurry, handwritten, or all picture and no text. It moves you on to step two anyway.</p><q>Couldn't read that flyer automatically &mdash; pick the type below (you can still upload the flyer in the editor).</q></div>
</div></div>`,steps:[
 {say:'Three things can go wrong, and none of them break anything.',act:async()=>{for(const s of ['.k0','.k1','.k2']){await anim(q(s),[{opacity:0,transform:'translateY(28px)'},{opacity:1,transform:'none'}],400)}}},
 {say:'Wrong file type gets you a pop-up box naming the four it will take. That is the HEIC one again.',act:async()=>{spot(q('.k0'),7);await wait(1900)}},
 {say:'Too big gets you a pop-up asking for something under six megabytes. Open it and re-save it smaller.',act:async()=>{spot(q('.k1'),7);await wait(1800)}},
 {say:'And if it simply cannot read the page, you get an amber line and it carries you on to step two anyway. You pick the type and fill the form in yourself. Nothing is lost.',act:async()=>{spot(q('.k2'),7);await wait(2600);spot(null)}},
 {say:'One more. If you drop a flyer anywhere other than the dashed box, it tells you where the flyer actually goes. It will never open the file and throw away your half-typed form.',act:async()=>{
   const t=add('<div class="toast warn" style="left:210px;top:580px;max-width:860px">To read a flyer, add a NEW one-time event and drop it on the upload box &mdash; or use the flyer step in the Events Funnel.</div>');
   await pop(t);await wait(2400)}}]},

/* 11 ────────────────────────────────────────────────────────────────── */
{html:()=>HEAD('Recap','Your flyer checklist')+`<div class="cl">${[
 'CMS &rarr; Content Management &rarr; <b>Events &amp; Programs</b> &rarr; <b>+ Add Event</b>',
 'Drop a <b>JPG, PNG, WebP or PDF under 6 MB</b> &mdash; an iPhone <b>HEIC will be refused</b>',
 'Wait the <b>5&ndash;8 seconds</b>, then the type cards appear',
 'The <b>AI guess</b> badge is a suggestion &mdash; <b>your click wins</b>',
 '<b>Read the year</b> on every date it filled in',
 'Set what the flyer cannot say: <b>Source, Grant, Max capacity, Information-flyer-only</b>',
 '<b>Save publishes it to ldahawaii.org</b> &mdash; push Start Showing out if you are not ready'
 ].map(t=>`<div class="ci"><div class="bx"><svg viewBox="0 0 26 26"><path d="M5 13 L11 19 L21 7"/></svg></div><span>${t}</span></div>`).join('')}</div>`,steps:[
 {say:'Let’s recap.',act:async()=>{for(const c of document.querySelectorAll('.scene.on .ci')){c.classList.add('on');await wait(140)}}},
 ...['Events and Programs, then plus Add Event.','JPG, PNG, WebP or PDF, under six megabytes. A HEIC will be refused.','Give it five to eight seconds, then the type cards come up.','The AI guess badge is only a suggestion. Your click wins.','Read the year on every date it filled in.','Set the four things the flyer cannot say: source, grant, capacity, and the information-flyer box.','And remember Save puts it straight on the public website.']
  .map((s,i)=>({say:s,act:async()=>{const cs=document.querySelectorAll('.scene.on .ci');cs.forEach((c,j)=>{c.classList.add('on');if(j<i)c.classList.add('done')});await wait(560);cs[i].classList.add('done')}}))]},

/* 12 ────────────────────────────────────────────────────────────────── */
{cls:'cover',html:()=>`<div class="brand">Reading a flyer with AI</div><div class="hello">All done</div><h1>Mahalo<span class="nmc"></span>!</h1><p class="sub">Drop it, wait, then check the year and press Save. Come back and watch it again any time.</p>
 <div class="abs" style="left:820px;top:160px;transform:rotate(-5deg);animation:bob 5s ease-in-out infinite">${FLY()}</div>
 <div class="abs" style="left:1000px;top:240px;transform:rotate(8deg);animation:bob 5s 1.2s ease-in-out infinite">${FLY()}</div>
 <div class="gate" style="top:460px"><button class="btn ghost" data-go="again">Watch again</button><button class="btn" data-go="close">Close</button></div>${WAVES}`,
 steps:[{say:'Mahalo {name}! Drop the flyer, wait for it, check the year, and press Save. The machine does the typing — you do the checking.',act:async()=>{await wait(400);confetti(640,300,140)}}]}
];
</script>
<script src="deck-engine.js"></script></body></html>
