<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your ASQ Job — Training</title>
<link rel="stylesheet" href="deck-base.css">
<style>
/* Real screenshots of LDAH-Int (2026-10-10). The images are NOT in this repo:
   they sit in private Storage (trainingPrivate/asq-coordinator/) and are
   handed out by the getTrainingImageUrls Cloud Function to signed-in LDAH
   staff only. This file is code and narration, nothing else. */
.shotbox{position:absolute;overflow:hidden;border-radius:14px;background:#fff;box-shadow:0 10px 34px rgba(15,23,42,.22);border:1px solid #E2E8F0}
.shotbox img{position:absolute;max-width:none;display:block}
.shotbox.wait::after{content:'Loading the picture…';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#64748B;font-size:22px;font-weight:700}
.big3{position:absolute;left:80px;top:170px;width:1120px;display:flex;gap:28px}
.big3 .p{flex:1;background:#fff;border-radius:18px;padding:30px 26px;box-shadow:0 8px 26px rgba(15,23,42,.12);border-top:8px solid var(--pink);opacity:0}
.big3 .p.on{animation:rise .5s ease-out both}
.big3 .n{font-size:64px;font-weight:900;color:var(--pink);line-height:1}
.big3 .t{font-size:30px;font-weight:800;color:var(--ink);margin-top:12px}
.big3 .d{font-size:21px;color:var(--soft);margin-top:10px;line-height:1.4}
.ext{position:absolute;left:140px;top:170px;width:1000px;background:#fff;border-radius:20px;padding:36px 40px;box-shadow:0 10px 30px rgba(15,23,42,.14)}
.ext .site{display:inline-block;background:#9D174D;color:#fff;font-size:26px;font-weight:800;border-radius:12px;padding:14px 26px}
.ext ol{margin:26px 0 0 0;padding-left:34px;font-size:27px;line-height:1.55;color:var(--ink)}
.ext ol li{opacity:.25;transition:opacity .4s}
.ext ol li.on{opacity:1}
.tip{position:absolute;background:#FEF3C7;border:2px solid #F59E0B;color:#78350F;border-radius:14px;padding:12px 18px;font-size:22px;font-weight:700;opacity:0}
.tip.on{animation:rise .45s ease-out both}
/* A bold red box on exactly what to press. */
#spot{border:5px solid #DC2626;box-shadow:0 0 0 3000px rgba(11,58,83,.45)}
#lockNote{position:absolute;left:140px;top:300px;width:1000px;background:#FEE2E2;border:2px solid #DC2626;color:#7F1D1D;border-radius:16px;padding:22px 28px;font-size:24px;font-weight:700;display:none;z-index:50}
</style>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head><body>
<div id="view"><div id="stage"><div id="nbar"><i></i></div>
<div id="scenes"></div>
<div id="spot"></div>
<div id="lockNote">These pictures only load for LDAH staff. Open this training from LDAH-Int (Training Videos) while you are signed in.</div>
<svg id="cursor" viewBox="0 0 28 32"><path d="M3 2 L3 26 L9.5 19.5 L14 29 L18.5 27 L14 17.5 L23 17.5 Z" fill="#fff" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/></svg>
</div></div>
<div id="cap" aria-live="polite"></div>
<div id="bar">
 <button id="prev">Back</button><button id="play">Start</button><button id="next">Next</button>
 <div id="dots"></div>
 <button id="capbtn" aria-pressed="false">Captions</button><button id="voice" aria-pressed="true">Voice on</button>
</div>
<script>
const DECK_ID='asq-coordinator-2026-10';

/* ---- private screenshots ---- */
const SHOT_W=1512, SHOT_H=791;           // every capture is 1512x791
const SHOTS={};                          // name -> signed URL
const FILES=['home','reports','report-list','family-card'];
function fillShots(){
  document.querySelectorAll('img[data-shot]').forEach(function(i){
    const u=SHOTS[i.dataset.shot+'.png'];
    if(u&&i.getAttribute('src')!==u){i.src=u;i.parentNode.classList.remove('wait')}
  });
}
(function waitForAuth(){
  if(!(window.firebase&&firebase.apps&&firebase.apps.length)){setTimeout(waitForAuth,150);return}
  firebase.auth().onAuthStateChanged(async function(u){
    if(!u||u.isAnonymous){document.getElementById('lockNote').style.display='block';return}
    try{
      const r=await fetch('https://us-central1-ldah-932d5.cloudfunctions.net/getTrainingImageUrls',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({idToken:await u.getIdToken(),deckId:'asq-coordinator'})});
      const d=await r.json();
      if(!r.ok)throw new Error(d.error||'');
      Object.assign(SHOTS,d.urls||{});fillShots();
      setInterval(fillShots,500);
    }catch(e){const n=document.getElementById('lockNote');n.textContent=(e&&e.message)||n.textContent;n.style.display='block'}
  });
})();

/* A window onto part of a screenshot. reg = [x0,y0,x1,y1] in screenshot
   pixels; box = [left,top,width,height] on the 1280x720 stage. The region is
   scaled to fit the box, so small buttons come out big. */
function SHOT(name,reg,box){
  const rw=reg[2]-reg[0], rh=reg[3]-reg[1];
  const k=Math.min(box[2]/rw,box[3]/rh);
  const w=Math.round(rw*k), h=Math.round(rh*k);
  const left=box[0]+Math.round((box[2]-w)/2), top=box[1]+Math.round((box[3]-h)/2);
  return `<div class="shotbox wait" style="left:${left}px;top:${top}px;width:${w}px;height:${h}px">`+
    `<img data-shot="${name}" data-w="${SHOT_W}" alt="" style="width:${Math.round(SHOT_W*k)}px;left:${-Math.round(reg[0]*k)}px;top:${-Math.round(reg[1]*k)}px"></div>`;
}
// A rectangle [x0,y0,x1,y1] in screenshot pixels, as a stage rectangle.
function R(name,b){return imgRect(q('img[data-shot="'+name+'"]'),[b[0],b[1],b[2]-b[0],b[3]-b[1]])}
async function point(name,b,pad){const r=R(name,b);spot(r,pad||8);await move(r,900)}
async function press(name,b){await point(name,b);await click(null)}
const TOP=[70,118,1140,590];   // the usual picture box

const SC=[
// 0 ---- COVER ----
{cls:'cover',html:()=>`<div class="brand">Leadership in Disabilities &amp; Achievement of Hawaiʻi</div><div class="hello">Aloha <span class="nm"></span></div>
 <h1>Your ASQ job, step by step</h1><p class="sub">Real pictures of the screens you use. About 6 minutes.</p>
 <div class="gate"><button class="btn" data-go="start">Start training</button><button class="btn ghost" data-go="skip">Skip for now</button><label><input type="checkbox" id="voiceChk" checked> Read it out loud to me</label></div>${WAVES}`,
 steps:[{say:'Aloha {name}! This training shows your ASQ job, one step at a time. Every picture is the real screen you will use.'}]},

// 1 ---- THREE PARTS ----
{html:()=>HEAD('Your job','Three parts')+`<div class="big3">
 <div class="p"><div class="n">1</div><div class="t">Enter the child</div><div class="d">Put each child into ASQ Online. Then press <b>Mark entered</b> here.</div></div>
 <div class="p"><div class="n">2</div><div class="t">Check every morning</div><div class="d">A task tells you to look in ASQ Online for new results.</div></div>
 <div class="p"><div class="n">3</div><div class="t">Upload the results</div><div class="d">Save each result PDF on the child's row.</div></div></div>`,
 steps:[
 {say:'Your job has three parts.',act:async()=>{}},
 {say:'Part one. Enter each child in ASQ Online, then press Mark entered here.',act:async()=>{document.querySelectorAll('.scene.on .p')[0].classList.add('on')}},
 {say:'Part two. Every weekday morning, check ASQ Online for new results.',act:async()=>{document.querySelectorAll('.scene.on .p')[1].classList.add('on')}},
 {say:'Part three. When a result comes in, upload it on the child’s row.',act:async()=>{document.querySelectorAll('.scene.on .p')[2].classList.add('on')}}]},

// 2 ---- OPEN REPORTS ----
{html:()=>HEAD('Part 1 · Enter the child','Open Reports')+SHOT('home',[0,0,760,400],TOP),
 steps:[
 {say:'This is your home page in LDAH Internal.',act:async()=>{spot(null)}},
 {say:'On the left, press Reports.',act:async()=>{await press('home',[9,319,178,351])}}]},

// 3 ---- ASQ CARD ----
{html:()=>HEAD('Part 1 · Enter the child','Press ASQ Management')+SHOT('reports',[0,0,760,400],TOP),
 steps:[
 {say:'You will see one card. It is called ASQ Management.',act:async()=>{await point('reports',[199,258,401,368])}},
 {say:'Press it to open your list.',act:async()=>{await click(null)}}]},

// 4 ---- THE LIST ----
{html:()=>HEAD('Part 1 · Enter the child','Your list of children')+SHOT('report-list',[200,338,1226,696],TOP),
 steps:[
 {say:'This is your list. Each row is one child.',act:async()=>{spot(null)}},
 {say:'The child’s name is on the left. The parent is next to it.',act:async()=>{await point('report-list',[205,365,460,412])}},
 {say:'A yellow label that says Not entered yet means this child still needs to go into ASQ Online.',act:async()=>{await point('report-list',[814,370,882,386],6)}}]},

// 5 ---- ASQ ONLINE ----
{html:()=>HEAD('Part 1 · Enter the child','Now go to ASQ Online')+`<div class="ext"><span class="site">asqonline.com</span><ol>
 <li>Sign in to ASQ Online.</li>
 <li>Add the child. Use the name and birthday from the row.</li>
 <li>Add the parent. Use the parent’s name and email from the row.</li>
 <li>Come back to LDAH Internal.</li></ol></div>`,
 steps:[
 {say:'Now open ASQ Online in another tab.',act:async()=>{spot(null);hideCursor()}},
 ...['Sign in to ASQ Online.','Add the child. Use the name and birthday from the row.','Add the parent. Use the parent’s name and email from the row.','Then come back to LDAH Internal.'].map((s,i)=>({say:s,act:async()=>{document.querySelectorAll('.scene.on .ext li')[i].classList.add('on')}}))]},

// 6 ---- MARK ENTERED ----
{html:()=>HEAD('Part 1 · Enter the child','Press Mark entered')+SHOT('report-list',[200,356,1000,420],[70,150,1140,300])+
 `<div class="tip" style="left:120px;top:500px">Most children get ASQ-3.</div>`,
 steps:[
 {say:'Back on your list, find the same child.',act:async()=>{spot(null)}},
 {say:'Pick the questionnaire you used. Most children get ASQ-3.',act:async()=>{await point('report-list',[814,386,898,408]);q('.tip').classList.add('on')}},
 {say:'Then press the green Mark entered button.',act:async()=>{await press('report-list',[897,386,957,407])}}]},

// 7 ---- AFTER ----
{html:()=>HEAD('Part 1 · Enter the child','Done. Here is what changes')+SHOT('report-list',[200,456,1000,542],[70,140,1140,330])+
 `<div class="tip" style="left:120px;top:500px">You do not call the family. Their case staff does.</div>`,
 steps:[
 {say:'Now the row turns green. It says Entered, and today’s date and your name.',act:async()=>{await point('report-list',[814,463,880,480],6)}},
 {say:'The family’s case staff gets a task to ask the family if they want the ASQ. You do not call the family.',act:async()=>{await point('report-list',[814,481,930,497],6);q('.tip').classList.add('on')}},
 {say:'That is part one done.',act:async()=>{spot(null);hideCursor()}}]},

// 8 ---- MORNING TASK ----
{html:()=>HEAD('Part 2 · Every morning','Your morning task')+SHOT('home',[205,316,720,475],TOP),
 steps:[
 {say:'Every weekday morning, your home page has this task. Check ASQ Online for new results.',act:async()=>{await point('home',[213,404,1213,467],4)}},
 {say:'Press Open ASQ Online.',act:async()=>{await press('home',[244,441,333,462])}},
 {say:'In ASQ Online, look for questionnaires the families have finished. Download each result as a PDF.',act:async()=>{spot(null);hideCursor()}},
 {say:'Then come back and press Open ASQ report.',act:async()=>{await press('home',[333,441,421,462])}}]},

// 9 ---- UPLOAD ----
{html:()=>HEAD('Part 3 · Upload the results','Press Upload results')+SHOT('report-list',[200,610,1000,700],[70,140,1140,340])+
 `<div class="tip" style="left:120px;top:520px">Pick the PDF you downloaded from ASQ Online.</div>`,
 steps:[
 {say:'Find the child on your list.',act:async()=>{spot(null)}},
 {say:'Press the pink Upload results button.',act:async()=>{await press('report-list',[814,653,878,674])}},
 {say:'A window opens. Pick the PDF you downloaded from ASQ Online.',act:async()=>{q('.tip').classList.add('on')}}]},

// 10 ---- VIEW ----
{html:()=>HEAD('Part 3 · Upload the results','It is saved')+SHOT('report-list',[200,456,1000,542],[70,140,1140,330]),
 steps:[
 {say:'Now the row has a blue View results button. That means it worked.',act:async()=>{await point('report-list',[814,497,870,517])}},
 {say:'Press View results any time to see it.',act:async()=>{await click(null)}}]},

// 11 ---- FAMILY CARD ----
{html:()=>HEAD('Part 3 · Upload the results','It shows on the family card too')+SHOT('family-card',[517,96,985,700],[340,112,600,598]),
 steps:[
 {say:'The result also shows on the family’s card, so the whole team can find it.',act:async()=>{await point('family-card',[537,419,678,449])}}]},

// 12 ---- TICK DONE ----
{html:()=>HEAD('Part 2 · Every morning','Tick the task done')+SHOT('home',[205,316,720,475],TOP),
 steps:[
 {say:'When you have checked ASQ Online and uploaded any results, tick the box on your morning task.',act:async()=>{await press('home',[221,427,238,444])}},
 {say:'If nothing came in today, that is fine. Still tick it. Tomorrow you get a new one.',act:async()=>{spot(null);hideCursor()}}]},

// 13 ---- SEND TASK ----
{html:()=>HEAD('Sometimes','A family wants the ASQ')+SHOT('home',[205,316,720,475],TOP),
 steps:[
 {say:'Sometimes a family says yes, they want the ASQ. Then you get this task.',act:async()=>{await point('home',[213,335,1213,398],4)}},
 {say:'Press Open ASQ Online, and send the questionnaire to that family from there.',act:async()=>{await press('home',[244,372,333,393])}},
 {say:'Then press Mark sent. That closes the task.',act:async()=>{await press('home',[333,372,386,393])}}]},

// 14 ---- RECAP ----
{html:()=>HEAD('Recap','Your checklist')+`<div class="cl">${['Reports, then ASQ Management','Enter the child in ASQ Online','Pick ASQ-3, press Mark entered','Every morning: open ASQ Online','Upload results on the child’s row','Tick the morning task done'].map(t=>`<div class="ci"><div class="bx"><svg viewBox="0 0 26 26"><path d="M5 13 L11 19 L21 7"/></svg></div><span>${t}</span></div>`).join('')}</div>`,steps:[
 {say:'Let’s go over it once more.',act:async()=>{for(const c of document.querySelectorAll('.scene.on .ci')){c.classList.add('on');await wait(160)}}},
 ...['Open Reports, then ASQ Management.','Enter the child in ASQ Online.','Pick ASQ-3, and press Mark entered.','Every morning, open ASQ Online and look for results.','Upload each result on the child’s row.','Tick your morning task done.'].map((s,i)=>({say:s,act:async()=>{const cs=document.querySelectorAll('.scene.on .ci');cs.forEach((c,j)=>{c.classList.add('on');if(j<i)c.classList.add('done')});await wait(700);cs[i].classList.add('done')}}))]},

// 15 ---- MAHALO ----
{cls:'cover',html:()=>`<div class="brand">Your ASQ job</div><div class="hello">All done</div><h1>Mahalo<span class="nmc"></span>!</h1><p class="sub">Come back and watch it again any time. It is in Training Videos.</p>
 <div class="gate" style="top:460px"><button class="btn ghost" data-go="again">Watch again</button><button class="btn" data-go="close">Close</button></div>${WAVES}`,
 steps:[{say:'Mahalo {name}! You can watch this again any time. It is in Training Videos.',act:async()=>{await wait(400);confetti(640,300,140)}}]}
];
</script>
<script src="deck-engine.js?v=3"></script><script src="deck-tracker.js"></script>
<script>
/* Captions on by default for this deck: reading along helps. */
(function(){const b=document.getElementById('capbtn');if(b&&b.getAttribute('aria-pressed')!=='true')b.click()})();
</script></body></html>
