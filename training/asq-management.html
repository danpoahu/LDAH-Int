/* ---- small helpers ---- */
const tap=async(s,ms=850)=>{const e=typeof s==='string'?q(s):s;await move(e,ms);await click(e);return e};
function all(s){return[...document.querySelectorAll('.scene.on '+s)]}
const show=(e,ms=500)=>anim(e,[{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],ms,'ease-out').then(()=>{e.style.opacity=1});
const PTS=(items,top=140)=>`<div class="abs" style="left:790px;top:${top}px;width:440px"><ul class="pts">${items.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
async function scrollTo(target,ms=800){const inr=q('.aq-in');const vp=inr.parentElement;const max=Math.max(0,inr.scrollHeight-vp.clientHeight);
 let y=target==='bottom'?max:target&&target.nodeType?(target.getBoundingClientRect().top-inr.getBoundingClientRect().top)/scale-10:(target||0);y=Math.max(0,Math.min(y,max));
 const from=+inr.dataset.y||0;await anim(inr,[{transform:`translateY(${-from}px)`},{transform:`translateY(${-y}px)`}],ms,'ease-in-out');inr.dataset.y=y}
async function cap(h){const c=q('.aq-cap2');c.innerHTML=h;await anim(c,[{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none'}],350,'ease-out');c.style.opacity=1}
function toast(t,x=640,y=520){const e=add(`<div class="aq-toast" style="left:${x}px;top:${y}px;transform:translateX(-50%)">${t}</div>`,stage);setTimeout(()=>e.remove(),D(2600));return e}
async function dropdown(anchor,items,pick){const p=pos(anchor);const dd=add(`<div class="aq-dd" style="left:${p.x}px;top:${p.y+p.h+2}px">${items.map(t=>`<div>${t}</div>`).join('')}</div>`);
 await pop(dd);await wait(650);if(pick!=null){const r=dd.children[pick];await move(r,550);r.classList.add('hi');await click(r);await wait(150)}dd.remove()}
const only=keys=>all('.aq-t tr.r').forEach(tr=>{const k=[...tr.classList].find(c=>c.startsWith('k-row-')).slice(6);tr.style.display=!keys||keys.includes(k)?'':'none'});

const HIST=r=>(r.hist||[]).length?r.hist.map(h=>`<div class="aq-hn"><div class="m">${h[0]} · ${h[1]}</div><div>${h[2]}</div></div>`).join(''):'<div class="aq-sub">Nothing recorded yet.</div>';
const DET=(r,n)=>`<tr class="aq-det k-det-${r.k}" style="${r.open?'':'display:none'}"><td colspan="${n}"><div class="aq-dg">
 <div><h6>Child</h6><div class="aq-kv k-dchild"><b>${r.child}</b><br><b>Birthdate</b> ${r.bd} (${r.age})<br><b>Grade</b> ${r.grade} · ${r.room}<br><b>Screening</b> ${r.src==='pv'?'Pali View':'Lions vision'} · ${r.date}</div>

const ROW=(r,cols)=>`<tr class="r k-row-${r.k}${r.status==='nn'?' closed':''}">${cols.map(c=>CELL[c](r)).join('')}</tr>`+DET(r,cols.length);
const TABLE=(keys,cols=ALLC)=>`<div class="aq-card" style="overflow:hidden"><table class="aq-t"><thead><tr>${cols.map(c=>`<th class="k-th-${c}${c==='status'?' on':''}">${COLS[c]}${SORTABLE[c]?(c==='status'?' ▲':' <span class="ar">⇅</span>'):''}</th>`).join('')}</tr></thead><tbody>${keys.map(k=>ROW(S[k],cols)).join('')}</tbody></table></div>`;
function redraw(k,cols=ALLC){const tr=q('.k-row-'+k),d=q('.k-det-'+k);const t=document.createElement('tbody');t.innerHTML=ROW(S[k],cols);const [nr,nd]=t.children;tr.replaceWith(nr);d.replaceWith(nd);return nr}
async function mark(k,status,o={}){const r=S[k],cols=o.cols||ALLC,who=o.who||'Kai Akana';
 if(status==='entered'){r.status='entered';r.type=o.type||'ASQ-3';r.ent='Oct 7';r.by=who;(r.hist=r.hist||[]).unshift([NOWT,who,'Entered in ASQ Online ('+r.type+')'])}

 else{r.status='todo';r.type='';r.ent='';r.by='';(r.hist=r.hist||[]).unshift([NOWT,who,'Undone (back to not entered)'])}
 const tr=redraw(k,cols);flash(tr);return tr}

/* ---- quiz: the standard ask()/QUIZ pair. Classes carry a qz- prefix.
   Each answer is reported to ldahTrack.quiz(sec,i,correct); the tracker scores the first answer to each. ---- */
window.QUIZ_TOTAL=3;
function ask(Q,i,sec){const w=q('.qz-wrap');
 w.innerHTML=`<div class="qz-card"><div class="qz-n">Question ${i+1} of 3</div><div class="qz-q">${Q.q}</div>${Q.o.map((o,j)=>`<button class="qz-o" data-j="${j}"><span class="qz-L">${'ABC'[j]}</span><span>${o}</span></button>`).join('')}<div class="qz-fb"></div></div>`;
 const card=w.firstChild,fb=card.querySelector('.qz-fb'),btns=[...card.querySelectorAll('.qz-o')];
 const finish=()=>{btns.forEach(b=>b.disabled=true);btns[Q.a].classList.add('qz-yes');const st=document.querySelectorAll('.scene.on .qz-stars i')[i];if(st)st.classList.add('on');fb.className='qz-fb good';fb.textContent='Yes! '+Q.y};
 if(FAST){finish();return Promise.resolve()}
 return new Promise(res=>{btns.forEach((b,j)=>b.onclick=async()=>{
  if(b.disabled)return;
  if(window.ldahTrack)ldahTrack.quiz(sec,i,j===Q.a);
  if(j===Q.a){finish();const p=pos(b);confetti(p.x+60,p.y+20,70);await speak('Yes! '+Q.y,run);await wait(700);res()}
  else{b.disabled=true;b.classList.add('qz-no');fb.className='qz-fb bad';fb.textContent='Not quite. '+Q.n+' Try again.';speak('Not quite. '+Q.n+' Try again.',run)}})})}
const QUIZ=(sec,qs)=>({cls:'quiz',html:()=>HEAD('Quick check','Your turn!')+`<div class="qz-stars">${qs.map(()=>'<i></i>').join('')}</div><div class="qz-wrap"><div class="qz-intro">Three quick questions.<small>Your first answer to each one counts. Click the answer you think is right.</small></div></div>`,
 steps:[{say:'Quick check. Three quick questions. Your first answer to each one counts.'},
  ...qs.map((Q,i)=>({say:`Question ${i+1}. ${Q.q}`,act:()=>ask(Q,i,sec)}))]});
