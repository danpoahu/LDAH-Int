<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cancel Dates — Training</title>
<link rel="stylesheet" href="deck-base.css">
<style>
/* small column caption above a mock */
.hd2{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#94A3B8;margin:0 0 7px}
.gap{height:18px}
/* the Cancel & Reschedule / confirm window (index.html .gr-modal) */
.grw{background:#fff;border-radius:10px;box-shadow:0 18px 44px rgba(15,23,42,.3);overflow:hidden;font-size:13px;color:#1F2933}
.grh{padding:14px 18px;border-bottom:1px solid #E4E7EB}
.grh h3{margin:0 0 4px;font-size:17px;font-weight:700}
.grh p{margin:0;font-size:12px;color:#52606D}
.grb{padding:14px 18px}
.in2{margin:0 0 10px;font-size:13px;line-height:1.45}
.grbulk{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #E4E7EB;margin-bottom:6px}
.gsel{border:1px solid #D1D5DB;border-radius:4px;padding:5px 26px 5px 8px;font-size:12px;background:#fff;position:relative;white-space:nowrap;color:#374151}
.gsel::after{content:"▾";position:absolute;right:8px;color:#52606D}
.gsel.w1{width:200px}.gsel.w2{width:236px;flex:none}
.gbtn{border:1px solid #D1D5DB;background:#fff;color:#374151;border-radius:6px;padding:6px 14px;font-size:12.5px;font-weight:600;white-space:nowrap}
.gbtn.dang{background:#DC2626;border-color:#DC2626;color:#fff}
.gbtn.off{opacity:.45}
.grow{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #F1F5F9;font-size:13px}
.grow:last-child{border-bottom:0}
.grow b{flex:1;font-weight:600}
.grf{display:flex;justify-content:flex-end;gap:10px;padding:12px 18px;border-top:1px solid #E4E7EB;background:#F9FAFB}
/* toast */
.toast{position:absolute;border-radius:9px;padding:10px 18px;color:#fff;font-weight:800;font-size:15px;box-shadow:0 12px 28px rgba(15,23,42,.28);opacity:0}
/* folded dashed box, opened */
.fbox{border:1px dashed #CBD5E1;border-radius:10px;background:#F8FAFC;overflow:hidden;margin-bottom:12px}
.fbox.rd{background:#FEF2F2;border-color:#FECACA}
.fhd{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:13.5px;color:#475569}
.fbox.rd .fhd{color:#991B1B}
.fhd .show{margin-left:auto;font-size:12px;font-weight:700;color:#0891B2}
.fbd{padding:2px 14px 10px 34px;display:none}
.fbd.on{display:block}
.fr{display:flex;align-items:center;gap:8px;font-size:13px;color:#475569;padding:5px 0}
.fcx{margin-left:auto;color:#B91C1C;font-weight:700;border:1px solid #FECACA;background:#fff;border-radius:6px;padding:3px 12px;font-size:11.5px}
.fcx.grn{color:#16A34A;border-color:#BBF7D0}
/* the failure banner */
.errb{background:#FEF2F2;border:1px solid #FECACA;border-left:6px solid #DC2626;border-radius:12px;padding:16px 20px;box-shadow:0 8px 24px rgba(15,23,42,.08)}
.errb b{display:block;font-size:22px;color:#991B1B;line-height:1.35;font-family:ui-monospace,Menlo,Consolas,monospace}
.errb span{display:block;margin-top:8px;font-size:16px;color:#7F1D1D}
.plain{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 20px;font-size:19px;line-height:1.45;color:var(--soft);box-shadow:0 6px 18px rgba(15,23,42,.06)}
.plain b{color:var(--ink)}
/* email mock */
.em{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(15,23,42,.1);overflow:hidden}
.em .eh{background:#F8FAFC;border-bottom:1px solid var(--line);padding:11px 16px}
.em .eh b{display:block;font-size:16px;color:#0F172A}
.em .eh span{font-size:12.5px;color:#64748B}
.em .eb{padding:15px 18px;font-size:15px;line-height:1.55;color:#334155}
.em .eb em{font-style:normal;background:#FEF3C7;border-radius:4px;padding:1px 5px;font-weight:800;color:#92400E}
/* two-up compare (as checking-signups.html) */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.cmp>div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:0 8px 24px rgba(15,23,42,.08);opacity:0}
.cmp h4{margin:0 0 4px;font-size:19px;color:var(--teal)}
.cmp .w{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#94A3B8;margin-bottom:10px}
.cmp ul{margin:0;padding-left:20px;font-size:14.5px;line-height:1.5;color:var(--soft)}
.cmp li{margin-bottom:6px}
.cmp b{color:var(--ink)}
</style></head><body>
<div id="view"><div id="stage"><div id="nbar"><i></i></div>
<div id="scenes"></div>
<div id="spot"></div>
<svg id="cursor" viewBox="0 0 28 32"><path d="M3 2 L3 26 L9.5 19.5 L14 29 L18.5 27 L14 17.5 L23 17.5 Z" fill="#fff" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/></svg>
</div></div>
<div id="cap" aria-live="polite"></div>
<div id="bar">
 <button id="prev">Back</button><button id="play">Start</button><button id="next">Next</button>
 <div id="dots"></div>
 <button id="capbtn" aria-pressed="false">Captions</button><button id="voice" aria-pressed="true">Voice on</button>
</div>
<script src="deck-mocks.js"></script>
<script>
const DECK_ID='cancel-dates-2026-09';

const ROWS=()=>[
 ldahSignupRow('Kalani Example','kalani@example.com','ok'),
 ldahSignupRow('Mele Sample','mele.sample@example.com','cons',{status:'Pending'}),
 ldahSignupRow('Noa Testperson','noa@example.org','su',{status:'New'})];

const WIN=(o)=>ldahSignupsWindow(Object.assign({blocks:[
 ldahSessionBlock({label:'Connect-Gen: For Thursday, 2026-10-01 — 11:00 AM - 1:00 PM @ Oahu',cls:'b0',rows:[]}),
 ldahSessionBlock({label:'Connect-Gen: For Monday, 2026-10-05 — 3:00 PM - 5:00 PM @ All Islands Virtual',cls:'b1',rows:ROWS()}),
]},o||{}));

// the small Cancel session? dialog — the empty-date path
const CDLG=`<div class="grw dlg" style="width:480px">
 <div class="grh"><h3>Cancel session?</h3><p>Thursday, October 1, 2026 · Oahu</p></div>
 <div class="grb"><p class="in2 bd">No signups are on this date. Cancelling only marks the date for future visibility.</p></div>
 <div class="grf"><span class="gbtn">Back</span><span class="gbtn dang yes">Yes, cancel</span></div></div>`;

// the full Cancel &amp; Reschedule window — the path that is under repair
const GRW=`<div class="grw" style="width:700px">
 <div class="grh"><h3>Cancel Session</h3><p>Connect-Gen — Monday, October 5, 2026 · All Islands Virtual · 3:00 PM - 5:00 PM</p></div>
 <div class="grb">
  <p class="in2 intro2">3 families are signed up. Choose what happens to each before you cancel. <b>No emails will send until you confirm.</b></p>
  <div class="grbulk"><span class="gsel w1">Move all to…</span><span class="gbtn">Apply</span><span class="gbtn" style="margin-left:auto">Cancel all (email)</span></div>
  <div class="grow r0"><b>Kalani family (2 kids)</b><span class="gsel w2">Choose…</span></div>
  <div class="grow r1"><b>Mele family (1 kid)</b><span class="gsel w2">Choose…</span></div>
  <div class="grow r2"><b>Noa family (1 kid)</b><span class="gsel w2">Choose…</span></div>
 </div>
 <div class="grf"><span class="gbtn">Back</span><span class="gbtn dang off cfm">Confirm — send 3 emails</span></div></div>`;

// turn a drawn session band from upcoming into cancelled (or back)
function setCanc(b,on){b.classList.toggle('canc',on);const l=b.querySelector('.cbl');if(l)l.textContent=on?'Restore':'Cancel'}
async function toast(txt,col,x,y){const t=add(`<div class="toast" style="left:${x}px;top:${y}px;background:${col}">${txt}</div>`);
 await anim(t,[{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],400);return t}

const SC=[
{cls:'cover',html:()=>`<div class="brand">Leadership in Disabilities &amp; Achievement of Hawaiʻi</div><div class="hello">Aloha <span class="nm"></span></div>
 <h1>Cancelling a date</h1><p class="sub">Calling off one session of a recurring programme — what works today, and what does not. About five minutes.</p>
 <div class="abs cvm" style="left:720px;top:130px;transform:scale(.58) rotate(3deg);transform-origin:top left;animation:bob 5s ease-in-out infinite">${WIN()}</div>
 <div class="spark" style="left:1190px;top:115px">${SPARK}</div><div class="spark" style="left:690px;top:470px;animation-delay:1s">${SPARK}</div>
 <div class="gate"><button class="btn" data-go="start">Start training</button><button class="btn ghost" data-go="skip">Skip for now</button><label><input type="checkbox" id="voiceChk" checked> Read it out loud to me</label></div>${WAVES}`,
 steps:[{say:'Aloha {name}! A programme runs week after week, and now and then one date has to come off. This is how you do that — and one part of it you must not use yet. About five minutes.'}]},

{html:()=>HEAD('Where it lives','The signups window, on the date band')+`<div class="abs" style="left:58px;top:126px;transform:scale(.93);transform-origin:top left">${WIN()}</div>
 <div class="abs" style="left:790px;top:148px;width:440px"><ul class="pts"><li>The blue banner says it plainly: <b>check the box next to a date to cancel that session</b>.</li><li>Every date band carries a small box with the word <b>Cancel</b> beside it.</li><li>That box is the <b>only</b> way to call a date off. There is no menu, no delete.</li></ul></div>`,steps:[
 {say:'Open the event the usual way — Events and Programs, then View Signups. The blue banner along the top tells you what to do.',li:0,act:async()=>{spot(q('.sban'),5);await wait(1800)}},
 {say:'Look at each date band. On the left there is a small box, and the word Cancel beside it.',li:1,act:async()=>{spot(q('.b0 .sbh'),4);await wait(900);spot(q('.b0 .cbx'),6);await wait(1500)}},
 {say:'That box is the only way to call a date off. There is no menu item, and nothing gets deleted. You are ticking a box.',li:2,act:async()=>{await wait(1200);spot(null)}}]},

{html:()=>HEAD('Not everywhere','Only a recurring programme has the box')+`<div class="abs" style="left:58px;top:136px;width:706px">
 <div class="hd2">A recurring programme — Connect-Gen</div>
 ${ldahSessionBlock({label:'Connect-Gen: For Thursday, 2026-10-01 — 11:00 AM - 1:00 PM @ Oahu',cls:'b0',rows:[]})}
 <div class="gap"></div>
 <div class="hd2">A one-time event</div>
 ${ldahSessionBlock({label:'Thursday, 2026-10-15 — 10:00 AM - 12:00 PM @ Oahu',cls:'b1',noBox:true,rows:[ldahSignupRow('Kalani Example','kalani@example.com','ok')]})}</div>
 <div class="abs" style="left:790px;top:148px;width:440px"><ul class="pts"><li>A <b>recurring programme</b> has many dates, so each one can be called off on its own.</li><li>A <b>one-time event</b> has a single date. There is <b>no box</b> at all.</li><li>If you cannot find the box, that is why. To call off a one-time event you <b>archive the event</b> instead.</li></ul></div>`,steps:[
 {say:'Before anything else — the box is not on every screen. A recurring programme has many dates, so each one can be called off by itself.',li:0,act:async()=>{spot(q('.b0 .cbx'),6);await wait(1600)}},
 {say:'A one-time event has only the one date. There is no box beside it, and there never was.',li:1,act:async()=>{spot(q('.b1 .sbh'),4);await wait(1700)}},
 {say:'So if you are hunting for the box and cannot see it, that is your answer. To call off a one-time event you archive the whole event instead.',li:2,act:async()=>{await wait(1200);spot(null)}}]},

{html:()=>HEAD('Reading the bands','Colour tells you the state')+`<div class="abs" style="left:58px;top:134px;width:706px">
 ${ldahSessionBlock({label:'Connect-Gen: For Monday, 2026-10-05 — 3:00 PM - 5:00 PM @ All Islands Virtual',cls:'b0',rows:ROWS().slice(0,1)})}
 ${ldahSessionBlock({label:'Connect-Gen: For Thursday, 2026-09-18 — 11:00 AM - 1:00 PM @ Oahu',cls:'b1',state:'past',rows:[ldahSignupRow('Mele Sample','mele.sample@example.com','ok')]})}
 ${ldahSessionBlock({label:'Connect-Gen: For Thursday, 2026-10-08 — 11:00 AM - 1:00 PM @ Oahu',cls:'b2',state:'cancelled',rows:[]})}</div>
 <div class="abs" style="left:790px;top:148px;width:440px"><ul class="pts"><li><b>Navy</b> — still to come. The box reads <b>Cancel</b>.</li><li><b>Amber with a PAST pill</b> — already happened. Ticking it cancels <b>instantly</b>, with no dialog.</li><li><b>Red and struck through</b> — cancelled. The word CANCELLED is never printed.</li><li>On a cancelled band the box is ticked and the label now reads <b>Restore</b>.</li></ul></div>`,steps:[
 {say:'Three colours, and they tell you everything. Navy is a date still to come, and its box reads Cancel.',li:0,act:async()=>{spot(q('.b0 .sbh'),4);await wait(1500)}},
 {say:'Amber, with a PAST pill, is a date that has already happened. You can still tick it, and when you do it cancels instantly — no dialog, no questions.',li:1,act:async()=>{spot(q('.b1 .sbh'),4);await wait(2100)}},
 {say:'Red, with a line through the date, means it is cancelled. The word cancelled is never printed anywhere — the red strikethrough is the whole signal.',li:2,act:async()=>{spot(q('.b2 .sbh'),4);await wait(2100)}},
 {say:'And on a cancelled band the box is already ticked, and the little label has changed to Restore.',li:3,act:async()=>{spot(q('.b2 .cbl'),6);await wait(1500);spot(null)}}]},

{html:()=>HEAD('The safe path','A date with nobody on it')+`<div class="abs" style="left:58px;top:150px;width:700px">
 ${ldahSessionBlock({label:'Connect-Gen: For Thursday, 2026-10-01 — 11:00 AM - 1:00 PM @ Oahu',cls:'b0',rows:[]})}
 ${ldahSessionBlock({label:'Connect-Gen: For Monday, 2026-10-05 — 3:00 PM - 5:00 PM @ All Islands Virtual',cls:'b1',rows:ROWS()})}</div>`,steps:[
 {say:'Start with the easy one. A date that nobody has signed up for yet — a holiday, or a week you know you will be away.',act:async()=>{spot(q('.b0'),5);await wait(1400);spot(null)}},
 {say:'Tick the box on that date.',act:async()=>{const c=q('.b0 .cbx');place(380,660,0);await move(c,900);await click(c);hideCursor();await wait(200);
   const d=add(`<div class="abs dlgw" style="left:330px;top:240px">${CDLG}</div>`);await anim(d,[{opacity:0,transform:'scale(.9) translateY(14px)'},{opacity:1,transform:'none'}],420)}},
 {say:'A small dialog asks you to confirm. Read it — it tells you exactly what is about to happen. No signups are on this date. Cancelling only marks the date for future visibility.',act:async()=>{spot(q('.bd'),6);await wait(2600);spot(null)}},
 {say:'Press the red Yes, cancel.',act:async()=>{const y=q('.yes');place(560,660,0);await move(y,800);await click(y);await wait(200);
   const d=q('.dlgw');await anim(d,[{opacity:1},{opacity:0,transform:'scale(.92)'}],300);d.remove();hideCursor();
   setCanc(q('.b0'),true);const t=await toast('Session cancelled.','#DC2626',430,120);await wait(1200);await anim(t,[{opacity:1},{opacity:0}],400)}},
 {say:'The band turns red and the date is struck through. That is it — that path works, and it is the one you will use most.',act:async()=>{spot(q('.b0 .sbh'),5);await wait(1600);spot(null)}}]},

{html:()=>HEAD('Easy to miss','Empty dates are folded away')+`<div class="abs" style="left:58px;top:140px;width:706px">
 <div class="fbox f0" style="opacity:0"><div class="fhd"><span>▸</span><b>4</b> upcoming dates with no signups yet<span class="show">show</span></div>
  <div class="fbd b0">
   <div class="fr">Thursday, 2026-10-22 · Oahu<span class="fcx">Cancel</span></div>
   <div class="fr">Monday, 2026-10-26 · All Islands Virtual<span class="fcx">Cancel</span></div>
   <div class="fr">Thursday, 2026-10-29 · Hilo<span class="fcx">Cancel</span></div>
   <div class="fr">Monday, 2026-11-02 · All Islands Virtual<span class="fcx">Cancel</span></div></div></div>
 <div class="fbox rd f1" style="opacity:0"><div class="fhd"><span>▸</span><b>2</b> cancelled dates with no signups<span class="show">show</span></div>
  <div class="fbd b1"><div class="fr">Thursday, 2026-10-08 · Oahu<span class="fcx grn">Restore</span></div>
   <div class="fr">Monday, 2026-10-12 · Hilo<span class="fcx grn">Restore</span></div></div></div></div>
 <div class="abs" style="left:790px;top:148px;width:440px"><ul class="pts"><li>A date with <b>nobody on it</b> gets no band of its own — it folds into a dashed bar.</li><li>That is exactly the date you most want to call off. Press <b>show</b>.</li><li>Each folded row carries its own <b>Cancel</b>, or <b>Restore</b> if it is already off.</li><li>This window only reaches about <b>30 days</b>. Further out, use <b>Future Dates</b> — same box, same behaviour.</li></ul></div>`,steps:[
 {say:'Now a trap. The date you most want to call off is usually the one nobody has signed up for — and those do not get a band of their own.',li:0,act:async()=>{await anim(q('.f0'),[{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],420);await anim(q('.f1'),[{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],420)}},
 {say:'They fold into these dashed bars instead. Press show, and they open up.',li:1,act:async()=>{const s=q('.f0 .show');spot(q('.f0'),5);place(400,650,0);await move(s,850);await click(s);q('.fbd.b0').classList.add('on');await wait(700);spot(null);hideCursor()}},
 {say:'Every folded row has its own Cancel button, and a cancelled one has Restore. They do exactly the same job as the box on the band.',li:2,act:async()=>{spot(q('.f0 .fcx'),6);await wait(1800);spot(null)}},
 {say:'And remember this window only reaches about thirty days ahead. Anything further out lives under Future Dates, which runs to the end of December and has the very same box.',li:3,act:async()=>{await wait(800)}}]},

{html:()=>HEAD('The other path','A date families are booked on')+`<div class="abs" style="left:58px;top:146px">${GRW}</div>
 <div class="abs" style="left:790px;top:148px;width:440px"><ul class="pts"><li>Tick a <b>future</b> date that has signups and you get this bigger window instead.</li><li>It opens with the count: <b>N families are signed up</b>, and promises <b>no emails send until you confirm</b>.</li><li>One row per family. Each gets a choice — <b>another future date</b>, or <b>Send cancellation email</b>.</li><li>The red <b>Confirm</b> button stays greyed out until every family has a choice.</li></ul></div>`,steps:[
 {say:'Now the harder case. Tick a future date that families are already booked on, and you do not get the small dialog. You get this — the Cancel and Reschedule window.',act:async()=>{spot(q('.grh'),5);await wait(2000)}},
 {say:'It opens by telling you how many families are affected, and it promises that nothing will be emailed until you confirm.',act:async()=>{spot(q('.intro2'),5);await wait(2000)}},
 {say:'Then one row per family. For each one you pick another future date to move them to, or Send cancellation email. Move all to, with Apply, does the lot in one go.',act:async()=>{spot(q('.grbulk'),5);await wait(1200);spot(q('.r0'),5);await wait(1600)}},
 {say:'And the red Confirm button is greyed out until every single family has a choice beside their name.',act:async()=>{spot(q('.cfm'),6);await wait(1700);spot(null)}}]},

{html:()=>HEAD('Stop','That window does not work yet')+`<div class="abs" style="left:58px;top:150px;width:1170px">
 <div class="errb e0" style="opacity:0"><b>Per-signup writes failed for: … Date not cancelled.</b><span>What you will see the moment you press Confirm.</span></div>
 <div class="plain e1" style="margin-top:20px;opacity:0">Nothing is saved. <b>No family is moved, no email goes out, and the date is still on.</b> It will look exactly as it did before you started.</div>
 <div class="plain e2" style="margin-top:14px;opacity:0">If a date with families on it has to come off — <b>bring it to Dan</b>. Do not press Confirm twice, and do not assume it worked.</div></div>`,steps:[
 {say:'And here is the part you must remember. That window is under repair. Today, pressing Confirm fails every time.',act:async()=>{await anim(q('.e0'),[{opacity:0,transform:'translateY(18px)'},{opacity:1,transform:'none'}],450);spot(q('.e0'),7);await wait(2200);spot(null)}},
 {say:'Per-signup writes failed. Date not cancelled.',act:async()=>{const s=add('<div class="stamp" style="left:466px;top:498px">UNDER REPAIR</div>');
   await anim(s,[{opacity:0,transform:'rotate(-14deg) scale(3)'},{opacity:1,transform:'rotate(-14deg) scale(1)'}],450,'cubic-bezier(.5,0,.8,.6)');await wait(1100)}},
 {say:'Nothing is saved. No family is moved, no email goes out, and the date is still on. The screen will look exactly as it did before you started.',act:async()=>{await anim(q('.e1'),[{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],420);await wait(1600)}},
 {say:'So if a date that families are booked on has to come off, bring it to Dan. Do not press Confirm twice, and do not walk away assuming it worked.',act:async()=>{await anim(q('.e2'),[{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],420);spot(q('.e2'),6);await wait(2200);spot(null)}}]},

{html:()=>HEAD('What families get','The cancellation email')+`<div class="abs" style="left:58px;top:146px;width:700px"><div class="em e0" style="opacity:0">
 <div class="eh"><b>Session cancelled on Oct 1, 2026 — Connect-Gen</b><span>to: kalani@example.com</span></div>
 <div class="eb">Aloha,<br><br>The Connect-Gen session on Thursday, October 1 has been cancelled <em>due to unforeseen circumstances</em>. We are sorry for the short notice and hope to see you at the next one.<br><br>Mahalo,<br>LDAH</div></div></div>
 <div class="abs" style="left:790px;top:148px;width:440px"><ul class="pts"><li>Ticking the box adds the date to a <b>cancelled list</b> on the event.</li><li>A background job watches that list and emails <b>everyone matched on that date</b>.</li><li>The screen never asks you <b>why</b>, so the reason always reads <b>due to unforeseen circumstances</b>.</li><li>On an empty date that is nobody — so nothing sends. That is why the empty path is the safe one.</li></ul></div>`,steps:[
 {say:'It is worth knowing what a cancellation sends, even though on an empty date it sends nothing.',li:0,act:async()=>{await anim(q('.e0'),[{opacity:0,transform:'translateY(20px)'},{opacity:1,transform:'none'}],450);await wait(900)}},
 {say:'Ticking the box adds the date to a cancelled list on the event, and a background job watches that list and emails everyone matched on that date.',li:1,act:async()=>{spot(q('.eh'),5);await wait(2200)}},
 {say:'The screen never asks you for a reason. So the wording is always the same — cancelled due to unforeseen circumstances. You cannot change it from here.',li:2,act:async()=>{spot(q('.eb em'),6);await wait(2400);spot(null)}},
 {say:'On a date with nobody on it, that list of people is empty, so no mail leaves at all. That is exactly why the empty path is the safe one.',li:3,act:async()=>{await wait(1000)}}]},

{html:()=>HEAD('Putting it back','Restore is instant, and silent')+`<div class="abs" style="left:58px;top:152px;width:700px">
 ${ldahSessionBlock({label:'Connect-Gen: For Thursday, 2026-10-01 — 11:00 AM - 1:00 PM @ Oahu',cls:'b0',state:'cancelled',rows:[]})}</div>
 <div class="abs" style="left:790px;top:148px;width:440px"><ul class="pts"><li>Untick the box and the date comes <b>straight back</b>. No dialog, no confirmation.</li><li><b>Nothing is emailed.</b> There is no "the session is back on" notice anywhere.</li><li>So if anybody was told it was off, <b>you have to tell them it is on again</b>.</li></ul></div>`,steps:[
 {say:'Changed your mind? A cancelled date goes back on just as easily. The box is already ticked, and the label reads Restore.',li:0,act:async()=>{spot(q('.b0 .cbl'),6);await wait(1700)}},
 {say:'Untick it, and the date comes straight back. No dialog, nothing to confirm.',li:0,act:async()=>{const c=q('.b0 .cbx');place(380,660,0);await move(c,900);await click(c);hideCursor();spot(null);
   setCanc(q('.b0'),false);const t=await toast('Session restored.','#16A34A',430,122);await wait(1300);await anim(t,[{opacity:1},{opacity:0}],400)}},
 {say:'But restoring is completely silent. Nothing is emailed, and there is no session is back on notice anywhere in the system.',li:1,act:async()=>{await wait(1600)}},
 {say:'So if you told families the date was off, it is on you to tell them it is on again. The system will not do it for you.',li:2,act:async()=>{await wait(1400)}}]},

 ${ldahSessionBlock({label:'Connect-Gen: For Thursday, 2026-10-15 — 11:00 AM - 1:00 PM @ Oahu',cls:'b1',rows:ROWS().slice(0,1)})}</div>
 <div class="abs" style="left:790px;top:148px;width:440px"><ul class="pts"><li>A cancellation is stored against the <b>date, the location and the venue</b> — not the date alone.</li><li>Two islands can run the <b>same Thursday</b>. Calling off one leaves the other on.</li><li>Same date, two bands. <b>Read the location</b> on the band before you tick.</li></ul></div>`,steps:[
 {say:'One last thing that catches people. Here is the same Thursday, twice — Hilo on one band, Oahu on the other.',li:0,act:async()=>{spot(q('.b0 .sbh'),4);await wait(1200);spot(q('.b1 .sbh'),4);await wait(1400);spot(null)}},
 {say:'A cancellation is stored against the date and the location and the venue together, never the date on its own.',li:0,act:async()=>{await wait(1200)}},
 {say:'So cancelling Hilo leaves Oahu running, exactly as you would want.',li:1,act:async()=>{const c=q('.b0 .cbx');place(380,660,0);await move(c,900);await click(c);hideCursor();await wait(150);setCanc(q('.b0'),true);await wait(600);spot(q('.b1 .sbh'),5);await wait(1500);spot(null)}},
