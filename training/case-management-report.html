<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Case Management Report — Training</title>
<link rel="stylesheet" href="deck-base.css">
<!-- Same Firebase build as the dashboard, so the deck shares its sign-in and records progress. -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
/* Every class here starts with cm- (report), md- (My Day) or qz- (quiz), so nothing collides with deck-base.css.
   Indigo theme as the live panel (#caseMgmtReportInGrid): head #4338CA, accent #6366F1, bg #EEF2FF, border #C7D2FE, line #E0E7FF. */
:root{--cmh:#4338CA;--cma:#6366F1;--cmb:#EEF2FF;--cmbr:#C7D2FE;--cml:#E0E7FF;--cmr:#F8F9FF}
/* ---------- the dashboard window ---------- */
.cm-win{position:absolute;left:58px;top:118px;width:712px;height:570px;background:#F4F6F9;border:1px solid #D5DEE8;border-radius:12px;overflow:hidden;box-shadow:0 14px 36px rgba(15,23,42,.16);z-index:4;color:#1E293B;font-size:12px}
.cm-win.wide{width:1170px;height:330px}
.cm-in{position:relative;padding:12px 14px}
.cm-card{background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(15,40,70,.08);padding:10px 12px;margin-bottom:9px}
.cm-hdr{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.cm-back{font-size:11px;font-weight:700;color:#475569;border:1px solid #CBD5E1;border-radius:6px;padding:4px 8px;background:#fff;white-space:nowrap}
.cm-hdr h3{margin:0;flex:1;font-size:19px;color:var(--cmh);font-weight:800;white-space:nowrap}
.cm-lab{font-size:10.5px;color:#64748B;display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.cm-chk{width:12px;height:12px;border:1.5px solid #94A3B8;border-radius:3px;background:#fff;display:inline-block;position:relative}
.cm-chk.on{background:var(--cmh);border-color:var(--cmh)}
.cm-chk.on::after{content:"";position:absolute;left:3px;top:0;width:3px;height:7px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.cm-sel{display:inline-block;font-size:10.5px;border:1px solid #CBD5E1;border-radius:5px;padding:3px 20px 3px 7px;background:#fff;position:relative;white-space:nowrap;color:#0F172A}
.cm-sel::after{content:"▾";position:absolute;right:6px;color:#475569}
.cm-solid{font-size:10.5px;font-weight:700;color:#fff;background:var(--cmh);border-radius:5px;padding:4px 10px;white-space:nowrap}
.cm-ghost{font-size:10.5px;font-weight:700;color:#475569;border:1px solid #CBD5E1;border-radius:5px;padding:3px 9px;background:#fff;white-space:nowrap}
.cm-split{font-size:11px;color:var(--cmh);white-space:nowrap}
.cm-gen{font-size:10px;color:#64748B;white-space:nowrap;transition:background .4s;border-radius:4px;padding:1px 3px}
.cm-gen.flash{background:#FEF3C7}
/* filters */
.cm-fil{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 10px}
.cm-fil label{display:flex;flex-direction:column;gap:3px;font-size:10px;color:#64748B;font-weight:600}
.cm-fil .cm-sel,.cm-fil .cm-inp{display:block;font-size:11px;padding:5px 20px 5px 8px}
.cm-inp{border:1px solid #CBD5E1;border-radius:5px;background:#fff;color:#94A3B8;white-space:nowrap}
/* KPIs */
.cm-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:9px}
.cm-kpi{background:#fff;border-radius:9px;box-shadow:0 1px 6px rgba(15,40,70,.08);padding:8px 10px;border-left:4px solid var(--cmh)}
.cm-kpi .n{font-size:22px;font-weight:800;color:var(--cmh);line-height:1.1}
.cm-kpi .l{font-size:10.5px;color:#64748B;margin-top:1px;line-height:1.25}
.cm-kpi.alert{border-left-color:#B45309}.cm-kpi.alert .n{color:#B45309}
.cm-kpi.good{border-left-color:#16A34A}.cm-kpi.good .n{color:#16A34A}
.cm-sech{font-size:10.5px;font-weight:800;color:var(--cmh);text-transform:uppercase;letter-spacing:.4px;margin:0 0 7px}
/* caseload strip */
.cm-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cm-st{border:1px solid var(--cml);border-radius:10px;padding:7px 10px;background:var(--cmr);transition:border-color .3s,background .3s}
.cm-st.on{border-color:var(--cma);background:var(--cmb);box-shadow:0 0 0 2px rgba(99,102,241,.25)}
.cm-st .sn{font-weight:700;font-size:12px}
.cm-st .cnt{font-size:17px;font-weight:800;color:var(--cmh);line-height:1.2;margin-top:2px}
.cm-st .cnt span{font-size:10px;font-weight:600;color:#64748B}
.cm-st .ct{font-size:10px;color:#64748B;margin-top:2px;line-height:1.45;min-height:15px}
.cm-bar{height:5px;border-radius:999px;background:#E2E8F0;margin-top:5px;overflow:hidden;display:flex}
.cm-bar span{display:block;height:100%;transition:width .5s}
.cm-hint{font-size:10px;color:#64748B;margin-top:7px}
/* needs attention: two columns with a thin divider, as .cmr-attn-rows */
.cm-g{margin-bottom:9px}.cm-g:last-child{margin-bottom:0}
.cm-g h5{margin:0 0 4px;font-size:11.5px;display:flex;align-items:center;gap:7px}
.cm-rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:22px;background:linear-gradient(#C7D2FE,#C7D2FE) center/1px 100% no-repeat}
.cm-ar{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed var(--cml);font-size:11px;transition:opacity .4s}
.cm-ar .who{flex:1;min-width:0}
.cm-ar .who small{display:block;color:#64748B;font-size:9.5px;line-height:1.3}
.cm-win.wide .cm-t td,.cm-win.wide .cm-t th{padding-left:5px;padding-right:5px}
.k-tight .cm-hint{display:none}.k-tight .md-task{padding:7px 10px}.k-tight .md-task .md-btn{margin-top:4px}
.cm-par{color:inherit;border-bottom:1px dotted var(--cma)}
.cm-sub{font-size:10px;color:#64748B}
.cm-mini{font-size:9.5px;padding:3px 8px;color:#fff;border-radius:5px;font-weight:700;white-space:nowrap}
.cm-asg{font-size:9.5px;padding:3px 18px 3px 6px;border-color:var(--cmbr)}
.cm-pill{display:inline-block;border-radius:999px;padding:1px 7px;font-size:9.5px;font-weight:700;white-space:nowrap;vertical-align:baseline}
/* dropdown list drawn over a select */
.cm-drop{position:absolute;z-index:26;background:#fff;border:1px solid #94A3B8;border-radius:6px;box-shadow:0 10px 26px rgba(15,23,42,.25);padding:3px 0;font-size:12px;min-width:150px}
.cm-drop div{padding:4px 12px;white-space:nowrap;color:#0F172A}
.cm-drop div.hi{background:#2563EB;color:#fff}
.cm-drop div.mut{color:#64748B}
/* table */
.cm-t{border-collapse:collapse;font-size:11px;width:100%}
.cm-t th{text-align:left;padding:6px 7px;color:var(--cmh);font-size:9.5px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;background:var(--cmb)}
.cm-t th.on{background:var(--cml)}
.cm-t th i{font-style:normal;opacity:.35}
.cm-t td{padding:6px 7px;vertical-align:top}
.cm-t tr.r{border-bottom:1px solid var(--cml)}
.cm-t .exp{color:var(--cmh);font-size:10px;margin-right:5px}
.cm-det{background:#FAFBFF}
.cm-det td{padding:2px 12px 10px 26px;border-bottom:1px solid var(--cml)}
.cm-dg{display:grid;grid-template-columns:1.35fr 1fr;gap:14px}
.cm-det h6{margin:6px 0 3px;font-size:9.5px;color:var(--cmh);text-transform:uppercase;letter-spacing:.4px}
.cm-kv{font-size:10.5px;line-height:1.65}
.cm-note{padding:5px 0;border-bottom:1px dashed #E3E7F8}
.cm-note .m{font-size:9.5px;color:var(--cmh);font-weight:700}
.cm-note .t{font-size:10px;color:#64748B;margin-top:1px;line-height:1.45}
.cm-call{position:absolute;left:58px;top:466px;width:1170px;min-height:120px;background:#fff;border:2px solid var(--cmbr);border-left:8px solid var(--cmh);border-radius:14px;padding:16px 22px;font-size:20px;line-height:1.45;color:#0F172A;box-shadow:0 10px 26px rgba(67,56,202,.12)}
.cm-call b{color:var(--cmh)}
.cm-call .k{font-size:13px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--pink);margin-bottom:4px}
/* reports grid */
.cm-side{position:absolute;left:0;top:0;bottom:0;width:132px;background:#fff;border-right:1px solid #E2E8F0;padding:14px 10px;font-size:12px}
.cm-side div{padding:6px 9px;border-radius:6px;color:#334155;margin-bottom:2px}
.cm-side div.act{background:#E0F2FE;color:#0E6E8C;font-weight:700}
.cm-rg{position:absolute;left:132px;right:0;top:0;bottom:0;padding:14px 16px}
.cm-rg h4{margin:0;font-size:19px;color:#0B3A53}
.cm-rg p{margin:2px 0 10px;font-size:11px;color:#64748B}
.cm-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cm-tile{background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(15,40,70,.08);padding:11px 13px;border:2px solid transparent;min-height:104px}
.cm-tile b{display:block;font-size:12.5px;margin-top:4px}
.cm-tile span{display:block;font-size:10px;color:#64748B;margin-top:3px;line-height:1.4}
.cm-tile .ic{width:22px;height:22px;border-radius:6px}
/* ---------- My Day ---------- */
.md-band{border-radius:10px;background:linear-gradient(90deg,#16395A,#1F6E8C);color:#fff;padding:12px 16px;margin-bottom:10px}
.md-band b{font-size:18px}.md-band p{margin:2px 0 0;font-size:11px;opacity:.85}
.md-h{font-size:13px;font-weight:800;color:#0F172A;margin:4px 0 7px;display:flex;align-items:center;gap:7px}
.md-h .md-cnt{background:#E2E8F0;color:#334155;border-radius:999px;padding:1px 8px;font-size:11px}
.md-task{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid #E2E8F0;border-left:4px solid var(--cmh);border-radius:10px;padding:10px 12px;margin-bottom:7px;box-shadow:0 1px 4px rgba(15,40,70,.06);transition:opacity .4s}
.md-task.red{border-left-color:#DC2626}
.md-task .ck{width:18px;height:18px;border-radius:50%;border:2px solid #94A3B8;flex:none;margin-top:1px;position:relative;transition:all .3s}
.md-task .ck.on{background:#16A34A;border-color:#16A34A}
.md-task .ck.on::after{content:"";position:absolute;left:5px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.md-task .meta{flex:1;min-width:0}
.md-task .ttl{font-size:13px;font-weight:800;color:#0F172A}
.md-task .sub{font-size:10.5px;color:#64748B;margin-top:2px}
.md-task .tags{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.md-btn{display:inline-block;font-size:10.5px;font-weight:700;color:#fff;border-radius:6px;padding:5px 11px;margin-top:7px;margin-right:5px;white-space:nowrap}
.md-task.done .ttl{text-decoration:line-through;color:#94A3B8}
.md-case{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid rgba(67,56,202,.2);border-left:4px solid var(--cmh);border-radius:10px;padding:10px 12px;margin-bottom:7px}
.md-case .ttl{font-size:13px;font-weight:800}
.md-case .sub{font-size:10.5px;color:#64748B;margin-top:2px}
.md-case .who{margin-left:auto;font-size:11px;font-weight:700;color:#3730A3;background:#E0E7FF;border-radius:999px;padding:3px 10px;white-space:nowrap}
.md-case .note{font-size:9.5px;color:#9A3412;margin-top:4px}
.cm-tag{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#3730A3;background:#E0E7FF;border:1px solid #C7D2FE;border-radius:20px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.md-ghost{opacity:.45;filter:grayscale(.6)}
.md-x{position:absolute;z-index:12;border:4px solid #DC2626;color:#DC2626;font-weight:900;font-size:22px;padding:4px 14px;border-radius:10px;transform:rotate(-10deg);background:rgba(255,255,255,.85)}
/* ---------- flow diagram (scene 2) ---------- */
.fl-box{position:absolute;background:#fff;border-radius:14px;padding:13px 16px;box-shadow:0 8px 22px rgba(15,23,42,.1);border:2px solid #E2E8F0;font-size:14px;line-height:1.4}
.fl-box b{display:block;font-size:17px;margin-bottom:3px}
.fl-box.lion{border-color:#0891B2}.fl-box.lion b{color:#0E7490}
.fl-box.mg{border-color:var(--cmh);background:var(--cmb)}.fl-box.mg b{color:var(--cmh)}
.fl-box.adv{border-color:#7C3AED;background:#F5F3FF}.fl-box.adv b{color:#6D28D9}
.fl-arr{position:absolute;font-size:30px;font-weight:900;color:#94A3B8;line-height:1}
/* ---------- referral slips (scene 4) ---------- */
.sl{position:absolute;width:260px;background:#fff;border:1px solid #CBD5E1;border-radius:8px;padding:10px 12px;box-shadow:0 8px 20px rgba(15,23,42,.14);font-size:12px;z-index:6}
.sl .h{font-size:10px;font-weight:800;letter-spacing:.08em;color:#64748B;text-transform:uppercase}
.sl b{display:block;font-size:14px;margin:3px 0}
/* ---------- timeline (first contact due) ---------- */
.tm{position:absolute;left:58px;width:712px;background:#fff;border-radius:14px;box-shadow:0 8px 22px rgba(15,23,42,.08);padding:12px 18px;border:1px solid #E2E8F0}
.tm h4{margin:0;font-size:15px;color:var(--cmh)}
.tm .ln{position:relative;height:74px;margin-top:6px}
.tm .bar{position:absolute;left:30px;right:30px;top:30px;height:8px;border-radius:4px;background:#E2E8F0;overflow:hidden}
.tm .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cma),var(--cmh));transition:width 1.4s cubic-bezier(.45,.05,.25,1)}
.tm .pt{position:absolute;top:22px;width:150px;margin-left:-75px;text-align:center;font-size:11.5px;color:#475569;opacity:0;transform:translateY(8px);transition:all .45s}
.tm .pt.on{opacity:1;transform:none}
.tm .pt::before{content:"";display:block;width:16px;height:16px;border-radius:50%;margin:0 auto 6px;background:#fff;border:4px solid var(--cmh)}
.tm .pt.due::before{border-color:var(--pink)}
.tm .pt b{display:block;font-size:14px;color:#0F172A}
.tm .lab{position:absolute;top:2px;left:0;right:0;text-align:center;font-weight:800;color:var(--cmh);font-size:13px;opacity:0;transition:opacity .4s}
.tm .lab.on{opacity:1}
.ex{display:flex;gap:10px;align-items:center;font-size:13px;margin-top:6px;opacity:0;transition:opacity .4s}.ex.on{opacity:1}
/* cover art */
.cv-a{position:absolute;left:800px;top:96px;width:400px;background:#fff;border-radius:14px;box-shadow:0 24px 50px rgba(0,0,0,.35);padding:12px 14px;color:#1E293B;transform:rotate(3deg);animation:bob 6s ease-in-out infinite;z-index:3}
.cv-b{position:absolute;left:850px;top:420px;width:340px;background:#fff;border-radius:12px;box-shadow:0 20px 40px rgba(0,0,0,.3);padding:12px 14px;color:#1E293B;transform:rotate(-4deg);animation:bob 5s 1s ease-in-out infinite;z-index:4}
.cv-a .cm-kpis{grid-template-columns:repeat(2,1fr);margin:0}
/* ---------- quiz (qz- prefix: no clash with deck-base.css or this deck) ---------- */
.scene.quiz{background:linear-gradient(135deg,#FFF1F8,#E0F7FA)}
.qz-wrap{position:absolute;left:0;top:0;right:0;bottom:0}
.qz-intro{position:absolute;left:120px;top:190px;width:1040px;text-align:center;font-size:30px;font-weight:800;color:#0B3A53;line-height:1.35;animation:rise .5s both}
.qz-intro small{display:block;font-size:20px;color:#475569;font-weight:700;margin-top:14px}
.qz-card{position:absolute;left:120px;top:138px;width:1040px;background:#fff;border-radius:20px;box-shadow:0 18px 40px rgba(15,23,42,.14);padding:22px 30px;animation:rise .5s both}
.qz-n{font-size:14px;font-weight:900;color:var(--pink);letter-spacing:.08em;text-transform:uppercase}
.qz-q{font-size:27px;font-weight:800;line-height:1.25;margin:6px 0 16px}
.qz-o{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;font-size:21px;font-weight:700;background:#F8FAFC;border:3px solid #E2E8F0;border-radius:14px;padding:11px 16px;margin-bottom:10px;cursor:pointer;transition:border-color .2s,background .2s;color:var(--ink)}
.qz-o:hover:not([disabled]){border-color:#0891B2;background:#F0F9FF}
.qz-o[disabled]{cursor:default}
.qz-o .qz-L{width:38px;height:38px;border-radius:50%;background:#0E7490;color:#fff;display:flex;align-items:center;justify-content:center;flex:none;font-weight:900}
.qz-o.qz-no{border-color:#DC2626;background:#FEF2F2;animation:qzshake .4s}.qz-o.qz-no .qz-L{background:#DC2626}
.qz-o.qz-yes{border-color:#16A34A;background:#F0FDF4}.qz-o.qz-yes .qz-L{background:#16A34A}
.qz-fb{min-height:30px;font-size:19px;font-weight:700;margin-top:4px}.qz-fb.good{color:#15803D}.qz-fb.bad{color:#B91C1C}
.qz-stars{position:absolute;right:60px;top:46px;display:flex;gap:8px}
.qz-stars i{width:36px;height:36px;background:#E2E8F0;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);transition:background .3s}
.qz-stars i.on{background:#F59E0B;animation:popn .6s}
@keyframes qzshake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
</style>
</head><body>
<div id="view"><div id="stage"><div id="nbar"><i></i></div>
<div id="scenes"></div>
<div id="spot"></div>
<svg id="cursor" viewBox="0 0 28 32"><path d="M3 2 L3 26 L9.5 19.5 L14 29 L18.5 27 L14 17.5 L23 17.5 Z" fill="#fff" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/></svg>
</div></div>
<div id="cap" aria-live="polite"></div>
<div id="bar">
 <button id="prev">Back</button><button id="play">Start</button><button id="next">Next</button>
 <div id="dots"></div>
 <button id="capbtn" aria-pressed="false">Captions</button><button id="voice" aria-pressed="true">Voice on</button>
</div>
<script>
const DECK_ID='case-management-report';

/* ================= helpers ================= */
const all=s=>[...document.querySelectorAll('.scene.on '+s)];
const tap=async(s,ms=850)=>{const e=typeof s==='string'?q(s):s;await move(e,ms);await click(e);return e};
const PTS=(items,top=140)=>`<div class="abs" style="left:790px;top:${top}px;width:440px"><ul class="pts">${items.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
const P=(t,bg,fg)=>`<span class="cm-pill" style="background:${bg};color:${fg}">${t}</span>`;
const AMB=['#FEF3C7','#92400E'],RED=['#FEE2E2','#991B1B'],GRN=['#DCFCE7','#166534'],GRY=['#F1F5F9','#475569'],ORG=['#FFEDD5','#9A3412'],BLU=['#DBEAFE','#1E40AF'];
const PA=(t,c)=>P(t,c[0],c[1]);
const VIS=d=>PA('VISION',['#E0E7FF','#3730A3'])+` <span class="cm-sub">${d}</span>`;
const HEA=d=>PA('HEARING',['#CCFBF1','#115E59'])+` <span class="cm-sub">${d}</span>`;
const LOGO=`<div style="position:absolute;left:70px;top:22px;background:#fff;border-radius:14px;padding:6px 10px;box-shadow:0 4px 14px rgba(0,0,0,.18);animation:rise .6s both"><img src="../logo_blue.png" alt="LDAH" style="height:80px;display:block"></div>`;
const STAFF5=['Kai Akana','Malia Santos','Leah Fong','Ben Ito','Rae Kim'];
/* A dropdown list drawn under a select. Returns the list; pick(i) highlights a row. */
function drop(anchor,items,cls){const p=pos(anchor);const d=add(`<div class="cm-drop ${cls||''}" style="left:${p.x}px;top:${p.y+p.h+2}px">${items.map((t,i)=>`<div class="${i===0?'mut':''}">${t}</div>`).join('')}</div>`);return d}
async function pickFrom(d,i,ms=700){const it=d.children[i];await move(it,ms,.4,.6);d.querySelectorAll('div').forEach(x=>x.classList.remove('hi'));it.classList.add('hi');await click(it);await wait(250);d.remove()}

/* ================= report pieces ================= */
const HDR=()=>`<div class="cm-hdr"><span class="cm-back k-back">← Back to Reports</span><h3>Case Management Report</h3>
 <span class="cm-lab k-closed"><span class="cm-chk"></span>Include closed</span><span class="cm-lab k-sort">Sort: <span class="cm-sel">By column (click a heading)</span></span></div>
 <div class="cm-hdr" style="margin-bottom:9px"><span class="cm-solid k-csv">Export CSV</span><span class="cm-ghost k-print">Print</span>

/* ---- quiz: the standard ask()/QUIZ pair from super-partner-workflow.html. Classes carry a qz- prefix.
   Each answer is reported to ldahTrack.quiz(sec,i,correct); the tracker scores the first answer to each. ---- */
window.QUIZ_TOTAL=3;
function ask(Q,i,sec){const w=q('.qz-wrap');
 w.innerHTML=`<div class="qz-card"><div class="qz-n">Question ${i+1} of 3</div><div class="qz-q">${Q.q}</div>${Q.o.map((o,j)=>`<button class="qz-o" data-j="${j}"><span class="qz-L">${'ABC'[j]}</span><span>${o}</span></button>`).join('')}<div class="qz-fb"></div></div>`;
 const card=w.firstChild,fb=card.querySelector('.qz-fb'),btns=[...card.querySelectorAll('.qz-o')];
 const finish=()=>{btns.forEach(b=>b.disabled=true);btns[Q.a].classList.add('qz-yes');const st=document.querySelectorAll('.scene.on .qz-stars i')[i];if(st)st.classList.add('on');fb.className='qz-fb good';fb.textContent='Yes! '+Q.y};
 if(FAST){finish();return Promise.resolve()}
 return new Promise(res=>{btns.forEach((b,j)=>b.onclick=async()=>{
  if(b.disabled)return;
  if(window.ldahTrack)ldahTrack.quiz(sec,i,j===Q.a);
  if(j===Q.a){finish();const p=pos(b);confetti(p.x+60,p.y+20,70);await speak('Yes! '+Q.y,run);await wait(700);res()}
  else{b.disabled=true;b.classList.add('qz-no');fb.className='qz-fb bad';fb.textContent='Not quite. '+Q.n+' Try again.';speak('Not quite. '+Q.n+' Try again.',run)}})})}

 steps:[{say:'Quick check. Three quick questions. Your first answer to each one counts.'},
