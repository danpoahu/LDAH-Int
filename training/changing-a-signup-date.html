<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Changing a Connect-Gen Signup Date — Training</title>
<link rel="stylesheet" href="deck-base.css">
<style>
.xb{border:1px solid #E2E8F0;border-radius:9px;background:#F8FAFC;padding:10px 12px;margin-bottom:8px}
.xb h6{margin:0 0 7px;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:#64748B;font-weight:800}
.xg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 12px}
.xg div{font-size:11.5px;color:#0F172A}
.xg label{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:#94A3B8;font-weight:700}
.sesh{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#64748B;font-weight:800;margin:9px 0 4px}
.sesrow{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #E2E8F0;border-radius:6px;padding:7px 10px;margin-top:5px;font-size:11.8px}
.cd{margin-left:auto;background:#FEF3C7;color:#92400E;font-weight:700;font-size:11px;border-radius:6px;padding:4px 11px;border:1px solid #FCD34D;transition:transform .15s}
.rs{margin-left:auto;background:#E0E7FF;color:#3730A3;font-weight:700;font-size:11px;border-radius:6px;padding:4px 11px;border:1px solid #A5B4FC}
.cchip{background:#FEE2E2;color:#DC2626;font-weight:800;font-size:9.5px;border-radius:999px;padding:2px 8px}
.strike{text-decoration:line-through;color:#DC2626}
/* reschedule dropdown */
.rdd{position:absolute;background:#fff;border:1px solid #CBD5E1;border-radius:10px;box-shadow:0 18px 44px rgba(15,23,42,.24);padding:8px;width:430px;z-index:30}
.rdd .hd{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#64748B;padding:4px 8px 8px}
.rdd div.op{padding:8px 10px;font-size:12.2px;color:#334155;border-radius:6px}
.rdd div.op.hi{background:#FEF3C7;color:#92400E;font-weight:700}
/* email preview */
.mail{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(15,23,42,.14);overflow:hidden;width:660px}
.mail .mt{background:#F1F5F9;border-bottom:1px solid #E2E8F0;padding:10px 14px;font-size:12px;color:#475569}
.mail .mt b{color:#0F172A;font-size:13.5px;display:block;margin-top:2px}
.mail .mbd{padding:16px 18px;font-size:13.5px;color:#334155;line-height:1.55}
.mail .mbd h3{margin:0 0 10px;font-size:17px;color:#0E7490}
/* compare cards */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.cmp>div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 17px;box-shadow:0 8px 24px rgba(15,23,42,.08);opacity:0}
.cmp h4{margin:0 0 3px;font-size:18px;color:var(--teal)}
.cmp .w{font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#94A3B8;margin-bottom:9px}
.cmp ul{margin:0;padding-left:19px;font-size:14px;line-height:1.5;color:var(--soft)}
.cmp li{margin-bottom:5px}
.cmp b{color:var(--ink)}
.cmp .bad{border-color:#FECACA;background:#FEF2F2}
/* clock / auto-move */
.tl2{display:flex;align-items:stretch;gap:0;margin-top:6px}
.tl2 .st2{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px;opacity:0;position:relative}
.tl2 .st2 b{display:block;font-size:15px;color:var(--deep);margin-bottom:4px}
.tl2 .st2 p{margin:0;font-size:13px;color:var(--soft);line-height:1.4}
.tl2 .ar{display:flex;align-items:center;color:#CBD5E1;font-size:22px;padding:0 9px}
</style></head><body>
<div id="view"><div id="stage"><div id="nbar"><i></i></div>
<div id="scenes"></div>
<div id="spot"></div>
<svg id="cursor" viewBox="0 0 28 32"><path d="M3 2 L3 26 L9.5 19.5 L14 29 L18.5 27 L14 17.5 L23 17.5 Z" fill="#fff" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/></svg>
</div></div>
<div id="cap" aria-live="polite"></div>
<div id="bar">
 <button id="prev">Back</button><button id="play">Start</button><button id="next">Next</button>
 <div id="dots"></div>
 <button id="capbtn" aria-pressed="false">Captions</button><button id="voice" aria-pressed="true">Voice on</button>
</div>
<script src="deck-mocks.js"></script>
<script>
const DECK_ID='changing-a-signup-date-2026-09';

const FAMILY=(o)=>{o=o||{};return `
 ${ldahSignupRow('Kalani Example','kalani@example.com','ok',{cls:'r0'})}
 <div style="margin-top:8px">
  <div class="xb"><h6>Student &amp; program</h6>
   <div class="xg"><div><label>Student</label>K. Example</div><div><label>Grade</label>5</div><div><label>School</label>Sample Elementary</div></div>
   <div class="sesh">Sessions</div>
   <div class="sesrow"><b class="${o.cancelled?'strike':''}">Mon 2026-10-05 — 3:00 PM - 5:00 PM @ All Islands Virtual</b>
    ${o.cancelled?'<span class="cchip">CANCELLED</span><span class="rs">Reschedule</span>':'<span class="cd">Change date</span>'}</div>
  </div></div>`};

const SC=[
{cls:'cover',html:()=>`<div class="brand">Leadership in Disabilities &amp; Achievement of Hawaiʻi</div><div class="hello">Aloha <span class="nm"></span></div>
 <h1>Moving a family to another date</h1><p class="sub">Connect-Gen signups — where the button hides, and who gets emailed. About five minutes.</p>
 <div class="abs cvm" style="left:760px;top:170px;width:600px;transform:scale(.8) rotate(3deg);transform-origin:top left;animation:bob 5s ease-in-out infinite">${FAMILY()}</div>
 <div class="spark" style="left:1190px;top:120px">${SPARK}</div><div class="spark" style="left:705px;top:470px;animation-delay:1s">${SPARK}</div>
 <div class="gate"><button class="btn" data-go="start">Start training</button><button class="btn ghost" data-go="skip">Skip for now</button><label><input type="checkbox" id="voiceChk" checked> Read it out loud to me</label></div>${WAVES}`,
 steps:[{say:'Aloha {name}! A family is booked on one Connect-Gen date and needs to be on another. It is a two-click job once you know where the button lives — but it does send the family an email, so it is worth five minutes.'}]},

{html:()=>HEAD('Getting there','Events &amp; Programs → Connect-Gen')+`<div class="abs" style="left:58px;top:130px;width:1170px">
 <div class="crumb">CMS → Content Management → <b>Events &amp; Programs</b> → <b>Connect-Gen</b> → View Signups</div>${ldahEventCards()}</div>`,steps:[
 {say:'Start where you always do. Content Management, Events and Programs, and filter to Connect-Gen.',act:async()=>{for(const c of document.querySelectorAll('.scene.on .evc')){await anim(c,[{opacity:0,transform:'translateY(40px)'},{opacity:1,transform:'none'}],420)}}},
 {say:'Then View Signups on the Connect-Gen card. There is a shortcut too — Today’s Connect-Gen on the home page opens the very same window.',act:async()=>{const v=q('.c0 .vs');spot(q('.c0'),6);place(700,650,0);await move(v,950);await click(v);await wait(400);spot(null);hideCursor()}}]},

{html:()=>HEAD('This is the bit people miss','The button is inside the family')+`<div class="abs fw" style="left:58px;top:140px;width:700px">${ldahSignupRow('Kalani Example','kalani@example.com','ok',{cls:'r0'})}</div>
 <div class="abs" style="left:790px;top:150px;width:440px"><ul class="pts"><li>The row on its own has <b>no date control</b>.</li><li>You have to <b>click the family open</b> first.</li><li>Then look in <b>Student &amp; program</b>, under <b>Sessions</b>.</li></ul></div>`,steps:[
 {say:'Here is the single most common complaint about this job: I cannot find where to change the date.',li:0,act:async()=>{spot(q('.r0'),6);await wait(1500)}},
 {say:'It is because the row on its own does not have one. You have to click the family open first.',li:1,act:async()=>{const r=q('.r0');place(380,640,0);await move(r,850);await click(r);hideCursor();
   const w=q('.fw');w.innerHTML=FAMILY();await anim(w.querySelector('.xb'),[{opacity:0,transform:'translateY(18px)'},{opacity:1,transform:'none'}],420)}},
 {say:'And then it is in the middle box, Student and program, under the heading Sessions. That amber button is the one.',li:2,act:async()=>{spot(q('.sesrow'),6);await wait(1000);spot(q('.cd'),6);await wait(1500);spot(null)}}]},

{html:()=>HEAD('Step 1','Change date, then pick the new one')+`<div class="abs fw" style="left:58px;top:136px;width:700px">${FAMILY()}</div>
 <div class="abs" style="left:790px;top:150px;width:440px"><ul class="pts"><li>Press <b>Change date</b>.</li><li>The list is headed <b>Reschedule to:</b></li><li>It shows the <b>next 90 days</b>, and never a cancelled date.</li><li>Each line is the full session — day, date, time, and <b>location</b>.</li></ul></div>`,steps:[
 {say:'Press Change date.',li:0,act:async()=>{const b=q('.cd');place(420,650,0);await move(b,900);await click(b);const p=pos(b);
   const m=add(`<div class="rdd" style="left:${p.x-250}px;top:${p.y+28}px"><div class="hd">Reschedule to:</div>
    <div class="op">Thursday, 2026-10-08 — 11:00 AM - 1:00 PM @ Oahu</div>
    <div class="op hi">Monday, 2026-10-12 — 3:00 PM - 5:00 PM @ All Islands Virtual</div>
    <div class="op">Thursday, 2026-10-15 — 11:00 AM - 1:00 PM @ Oahu</div>
    <div class="op">Thursday, 2026-10-15 — 9:00 AM - 11:00 AM @ Hilo</div></div>`);
   await anim(m,[{opacity:0,transform:'translateY(-12px) scale(.96)'},{opacity:1,transform:'none'}],400)}},
 {say:'The list is headed Reschedule to, and it only offers real sessions — the next ninety days, and never a date that has been cancelled.',li:2,act:async()=>{spot(q('.rdd'),6);await wait(2000)}},
 {say:'Read the whole line before you pick. Connect-Gen runs more than one session on some days, so the same date can appear twice with different times and different islands. The location is part of the choice.',li:3,act:async()=>{spot(q('.rdd .op:nth-child(4)'),4);await wait(1200);spot(q('.rdd .op:nth-child(5)'),4);await wait(2000);spot(null);hideCursor()}}]},

{html:()=>HEAD('Careful','This emails the family')+`<div class="abs" style="left:58px;top:140px"><div class="mail m0" style="opacity:0">
 <div class="mt">To: kalani@example.com<b>Your session dates have changed — Connect-Gen</b></div>
 <div class="mbd"><h3>Your session dates have changed</h3>
 <p>Aloha Kalani,</p><p>Your session for <b>Connect-Gen</b> has moved.</p>
 <p style="color:#64748B">Was: Monday, 2026-10-05 — 3:00 PM<br>Now: Monday, 2026-10-12 — 3:00 PM</p>
 <p>No action needed on your end — we just wanted to keep you in the loop.</p></div></div></div>
 <div class="abs" style="left:790px;top:150px;width:440px"><ul class="pts"><li>The moment you pick a date, <b>the family is emailed</b>.</li><li>Subject: <b>Your session dates have changed</b>.</li><li>Nothing on the screen warns you first. There is <b>no undo</b>.</li><li>So change the date <b>once</b>, when you already know the right one.</li></ul></div>`,steps:[
 {say:'Now the part that matters most, because nothing on the screen tells you.',li:0,act:async()=>{await anim(q('.m0'),[{opacity:0,transform:'translateY(26px) scale(.96)'},{opacity:1,transform:'none'}],520)}},
 {say:'The moment you pick a new date, the family gets an email. Subject: your session dates have changed.',li:1,act:async()=>{spot(q('.mt'),5);await wait(1900)}},
 {say:'There is no confirmation box, and there is no undo. Picking the wrong date and correcting it means the family gets two emails.',li:2,act:async()=>{const s=add('<div class="stamp" style="left:250px;top:250px;font-size:24px">NO UNDO</div>');await anim(s,[{opacity:0,transform:'rotate(-14deg) scale(3)'},{opacity:1,transform:'rotate(-14deg) scale(1)'}],450,'cubic-bezier(.5,0,.8,.6)');
   anim(document.querySelector('.scene.on'),[{transform:'none'},{transform:'translate(-6px,3px)'},{transform:'translate(5px,-2px)'},{transform:'none'}],260,'linear');await wait(1700)}},
 {say:'So decide the date first, then change it once. This is not a screen to experiment on.',li:3,act:async()=>{spot(null);await wait(400)}}]},

{html:()=>HEAD('Careful','Three buttons, only one is this job')+`<div class="abs" style="left:58px;top:142px;width:1170px"><div class="cmp" style="grid-template-columns:1fr 1fr 1fr">
 <div class="k0"><div class="w">The one you want</div><h4>Change date</h4><ul><li>Amber, inside the family</li><li>Under <b>Sessions</b></li><li>Moves them to another Connect-Gen date</li></ul></div>
 <div class="k1"><div class="w">Only after a cancellation</div><h4>Reschedule</h4><ul><li>Indigo, same place</li><li>Appears only when <b>their date was cancelled</b></li><li>Same list — it is the rescue version</li></ul></div>
 <div class="k2 bad"><div class="w">Not for Connect-Gen</div><h4>Change dates</h4><ul><li>In the row’s <b>…</b> menu</li><li>A tick-box window for <b>one-time events</b></li><li><b>Never appears</b> on Connect-Gen</li></ul></div></div></div>`,steps:[
 {say:'There are three similarly named buttons in this area, and only one of them is this job.',act:async()=>{for(const s of ['.k0','.k1','.k2']){await anim(q(s),[{opacity:0,transform:'translateY(30px)'},{opacity:1,transform:'none'}],420)}}},
 {say:'Change date, amber, inside the family under Sessions. That is the one you want.',act:async()=>{spot(q('.k0'),7);await wait(1600)}},
 {say:'Reschedule, indigo, in the same spot — but it only turns up when that family’s date has been cancelled. It opens the same list. Think of it as the rescue version.',act:async()=>{spot(q('.k1'),7);await wait(2200)}},
 {say:'And Change dates, plural, in the three-dots menu. That is a tick-box window for one-time events with several dates. It never appears on Connect-Gen, so if you are looking for it here, you are in the wrong place.',act:async()=>{spot(q('.k2'),7);await wait(2400);spot(null)}}]},

{html:()=>HEAD('Cancelled dates','When the date was called off')+`<div class="abs fw" style="left:58px;top:140px;width:700px">${FAMILY({cancelled:1})}</div>
 <div class="abs" style="left:790px;top:150px;width:440px"><ul class="pts"><li>Their session shows <b>struck through</b>, with a red <b>CANCELLED</b> chip.</li><li>The button becomes <b>Reschedule</b>.</li><li>Same list, same email. They are <b>not moved automatically</b>.</li></ul></div>`,steps:[
 {say:'If somebody cancels the date a family is booked on, their session row changes.',li:0,act:async()=>{spot(q('.sesrow'),6);await wait(1500)}},
 {say:'It goes struck through with a red CANCELLED chip, and the amber button becomes an indigo Reschedule.',li:1,act:async()=>{spot(q('.rs'),6);await wait(1600)}},
 {say:'It opens the same list and sends the same email. The important part: cancelling a date does not move anybody by itself. Somebody still has to rebook each family.',li:2,act:async()=>{await wait(1200);spot(null)}}]},

{html:()=>HEAD('Worth knowing','The system may move them for you')+`<div class="abs" style="left:58px;top:148px;width:1170px"><div class="tl2">
 <div class="st2 a0"><b>8:00 AM, session day</b><p>The system checks every family booked for today.</p></div><div class="ar">→</div>
 <div class="st2 a1"><b>Consent, documents, worksheet</b><p>All three in? They are left alone. Anything missing and they are not ready.</p></div><div class="ar">→</div>
 <div class="st2 a2"><b>Moved to a later date</b><p>Their own island only — never rolled onto a different programme. The family is emailed.</p></div><div class="ar">→</div>
 <div class="st2 a3"><b>After three moves</b><p>Their place is released with a “come back when you are ready” note.</p></div></div></div>
 <div class="abs" style="left:58px;top:400px;width:1170px"><div class="kn" style="position:relative;left:0;top:0;width:auto;opacity:0"><b>So before you move anyone:</b> check whether the system already has. There is no screen showing how many times a family has been moved — the Audit Log is the only trace.</div></div>`,steps:[
 {say:'One more thing, because it surprises people. Connect-Gen moves unprepared families by itself, and it is switched on right now.',act:async()=>{for(const s of ['.a0','.a1','.a2','.a3']){await anim(q(s),[{opacity:0,transform:'translateY(26px)'},{opacity:1,transform:'none'}],380)}}},
 {say:'At eight in the morning on the day, it looks at everyone booked. If consent, documents and worksheet are all in, they are left alone.',act:async()=>{spot(q('.a1'),6);await wait(1900)}},
 {say:'If something is missing, the family is moved to a later date on their own island — never rolled onto a different programme — and they are emailed about it.',act:async()=>{spot(q('.a2'),6);await wait(2100)}},
 {say:'After three moves their place is released, with a note saying come back when you are ready.',act:async()=>{spot(q('.a3'),6);await wait(1700);spot(null)}},
 {say:'So before you move somebody by hand, check whether the system already did. There is no screen showing that — the Audit Log is the only place it shows up.',act:async()=>{await anim(q('.kn'),[{opacity:0,transform:'translateY(18px)'},{opacity:1,transform:'none'}],480);await wait(900)}}]},

{html:()=>HEAD('Recap','Moving a family, start to finish')+`<div class="cl">${[
 'Events &amp; Programs → <b>Connect-Gen</b> → View Signups',
 '<b>Click the family open</b> — the row alone has no date control',
 'Student &amp; program → <b>Sessions</b> → amber <b>Change date</b>',
 'Read the whole line — same day can mean <b>a different island</b>',
 '🔴 Picking a date <b>emails the family</b>. No warning, no undo',
 '<b>Reschedule</b> (indigo) is the same job after their date was cancelled',
 'Check whether the <b>8 AM auto-move</b> already moved them'
 ].map(t=>`<div class="ci"><div class="bx"><svg viewBox="0 0 26 26"><path d="M5 13 L11 19 L21 7"/></svg></div><span>${t}</span></div>`).join('')}</div>`,steps:[
 {say:'Let’s recap.',act:async()=>{for(const c of document.querySelectorAll('.scene.on .ci')){c.classList.add('on');await wait(150)}}},
 ...['Connect-Gen, then View Signups.','Click the family open first.','Student and program, Sessions, Change date.','Read the whole line — the island matters.','Picking a date emails the family. No undo.','Reschedule is the same job after a cancellation.','And check the eight AM auto-move has not already done it.']
  .map((s,i)=>({say:s,act:async()=>{const cs=document.querySelectorAll('.scene.on .ci');cs.forEach((c,j)=>{c.classList.add('on');if(j<i)c.classList.add('done')});await wait(600);cs[i].classList.add('done')}}))]},

{cls:'cover',html:()=>`<div class="brand">Moving a family to another date</div><div class="hello">All done</div><h1>Mahalo<span class="nmc"></span>!</h1><p class="sub">Open the family, change the date once, and know they have been told. Questions? Ask Dan.</p>
 <div class="abs cvm" style="left:770px;top:180px;width:600px;transform:scale(.76) rotate(3deg);transform-origin:top left;animation:bob 5s ease-in-out infinite">${FAMILY()}</div>
 <div class="gate" style="top:460px"><button class="btn ghost" data-go="again">Watch again</button><button class="btn" data-go="close">Close</button></div>${WAVES}`,
 steps:[{say:'Mahalo {name}! Open the family, change the date once, and remember they have been told. You’ve got it.',act:async()=>{await wait(400);confetti(640,300,140)}}]}
];
</script>
<script src="deck-engine.js"></script></body></html>
