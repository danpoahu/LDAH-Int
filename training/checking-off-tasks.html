<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checking Off Tasks — Training</title>
<link rel="stylesheet" href="deck-base.css">
<!-- Same Firebase build as the dashboard, so the deck shares its sign-in and records progress. -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
/* ---------- PIP logo (same as pip-feedback-emails) ---------- */
.piplogo{position:absolute;left:760px;top:120px;width:450px;padding:22px 26px 16px;background:#fff;border-radius:26px;box-shadow:0 30px 70px rgba(0,0,0,.38);z-index:3;animation:pipin 1.1s .3s cubic-bezier(.3,1.5,.5,1) both,pipfloat 9s 1.4s ease-in-out infinite}
.piplogo img{display:block;width:100%;height:auto}
.pipglow{position:absolute;left:720px;top:90px;width:530px;height:360px;border-radius:50%;background:radial-gradient(closest-side,rgba(249,168,212,.55),rgba(125,211,252,.25) 60%,transparent);z-index:2;animation:pipglow 4.5s ease-in-out infinite}
.pipspk{position:absolute;width:30px;height:30px;z-index:4;animation:twinkle 2.6s ease-in-out infinite}
@keyframes pipin{from{opacity:0;transform:translateY(-220px) rotate(-18deg) scale(.4)}to{opacity:1;transform:none}}
@keyframes pipfloat{0%,100%{transform:translate(0,0) rotate(0)}20%{transform:translate(-26px,-18px) rotate(-3deg)}45%{transform:translate(14px,-30px) rotate(2.5deg)}70%{transform:translate(26px,8px) rotate(-1.5deg)}85%{transform:translate(-10px,16px) rotate(2deg)}}
@keyframes pipglow{0%,100%{opacity:.6;transform:scale(.94)}50%{opacity:1;transform:scale(1.06)}}
.pipbadge{position:absolute;right:48px;top:30px;width:150px;padding:8px 10px 6px;background:#fff;border-radius:14px;box-shadow:0 8px 22px rgba(15,23,42,.14)}
.pipbadge img{display:block;width:100%;height:auto}
/* ---------- the start gate on a light scene ---------- */
.gate.lite{left:800px;top:560px;width:420px}
.gate.lite label{color:var(--ink)}
/* ---------- My Day mock (drawn from .myday-hero / .todo in index.html) ---------- */
.md{position:absolute;left:58px;top:136px;width:716px;background:#fff;border-radius:16px;box-shadow:0 14px 34px rgba(15,23,42,.14);overflow:hidden}
.mdh{display:flex;align-items:center;gap:12px;padding:16px 18px;background:linear-gradient(120deg,#0e2f52 0%,#155e8c 55%,#0e9aac 130%);color:#fff}
.mdh .h{flex:1;min-width:0}.mdh h3{margin:0;font-size:21px}.mdh .hs{font-size:12.5px;opacity:.85;margin-top:2px}
.chips{display:flex;gap:6px}
.chip{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);border-radius:12px;padding:6px 8px;text-align:center;min-width:62px}
.chip .n{font-weight:800;font-size:20px;line-height:1.1}.chip .l{font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.chip.red .n{color:#FCA5A5}.chip.amb .n{color:#FCD9A5}.chip.grn .n{color:#A9F0CE}.chip.cas .n{color:#DDD6FE}
.chip.flash{animation:popn .6s}
.sect{display:flex;align-items:center;justify-content:space-between;padding:12px 18px 8px}
.sect h4{margin:0;font-size:16px;color:#0B3A53}.sect h4 .tcnt{display:inline-block;background:#E0F2FE;color:#0E7490;border-radius:999px;font-size:12px;padding:1px 9px;margin-left:6px;vertical-align:2px}
.sect .va{font-size:12px;color:#0E7490;font-weight:700}
.todos{padding:0 18px 16px;display:flex;flex-direction:column;gap:8px}
.todo{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:center;padding:10px 12px;background:#fff;border:1px solid rgba(8,145,178,.12);border-left:4px solid #94A3B8;border-radius:12px;transition:opacity .4s}
.todo:nth-child(even){background:rgba(8,145,178,.045)}
.todo.urgent{border-left-color:#DC2626;background:linear-gradient(90deg,rgba(220,38,38,.05),#fff 30%)}
.todo.done{opacity:.55;border-left-color:#16A34A}.todo.done .ttl{text-decoration:line-through}
.check{width:18px;height:18px;border:2px solid rgba(100,116,139,.45);border-radius:5px;background:#fff;display:grid;place-items:center;transition:background .2s}
.todo.done .check{background:#16A34A;border-color:#16A34A;color:#fff;font-size:12px;font-weight:800}
.todo.done .check::before{content:'✓'}
.check.press{transform:scale(.8)}
.meta{min-width:0}.ttl{font-weight:600;font-size:14px;color:#0F172A;line-height:1.3}
.todo .sub{color:#64748B;font-size:11.5px;margin-top:3px}
.tags{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:150px}
.pill{font-size:10.5px;padding:3px 8px;border-radius:999px;font-weight:700;background:rgba(249,115,22,.10);color:#EA580C;border:1px solid rgba(249,115,22,.18);white-space:nowrap}
.pill.overdue{background:#FECACA;color:#991B1B;border-color:#FCA5A5}
.pill.followup{background:#DBEAFE;color:#1E3A8A;border-color:#BFDBFE}
/* ---------- the event's attendance box ---------- */
.evm{position:absolute;left:150px;top:250px;width:520px;background:#fff;border-radius:14px;box-shadow:0 24px 60px rgba(15,23,42,.35);overflow:hidden;z-index:12;opacity:0}
.evh{background:#DB2777;color:#fff;font-weight:800;font-size:16px;padding:11px 16px}
.evb{padding:14px 16px}
.evb label{display:block;font-size:12.5px;font-weight:700;color:#475569;margin-bottom:5px}
.fi2{width:160px;border:1px solid #CBD5E1;border-radius:6px;padding:8px 10px;font-size:15px;min-height:36px;color:#0F172A}
.fi2.ph{color:#94A3B8}
.ynote{margin-top:10px;background:#FEF3C7;border:1px solid #F59E0B;border-left:4px solid #D97706;border-radius:6px;padding:8px 10px;font-size:12.5px;color:#78350F;line-height:1.4}
.evf{display:flex;justify-content:flex-end;gap:10px;padding:10px 16px;border-top:1px solid #F1F5F9}
.evf span{border-radius:7px;padding:7px 16px;font-weight:800;font-size:13px}
.evf .cx{border:1px solid #CBD5E1;color:#475569}.evf .sv{background:#0E7490;color:#fff}
.saved{position:absolute;left:250px;top:150px;background:#16A34A;color:#fff;font-weight:800;font-size:15px;padding:10px 16px;border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.2);z-index:14;opacity:0}
.still{position:absolute;left:360px;top:490px;opacity:0;z-index:31}
.big-note{position:absolute;background:#FEF3C7;border:3px solid #F59E0B;border-radius:16px;padding:12px 16px;font-size:18px;line-height:1.35;font-weight:700;color:#78350F;box-shadow:0 14px 30px rgba(180,83,9,.18);opacity:0;z-index:31}
.hov{position:absolute;background:#0F172A;color:#fff;font-size:12.5px;padding:6px 10px;border-radius:7px;white-space:nowrap;opacity:0;z-index:32}
/* ---------- wrap-up cover ---------- */
.wrapl{position:absolute;left:70px;top:280px;width:640px;margin:0;padding:0;list-style:none}
.wrapl li{font-size:21px;line-height:1.35;margin-bottom:10px;padding-left:34px;position:relative;animation:rise .6s both}
.wrapl li::before{content:"";position:absolute;left:0;top:5px;width:20px;height:20px;border-radius:6px;background:#F9A8D4}
.cover .sub.end{top:450px;font-size:19px}
</style></head><body>
<div id="view"><div id="stage"><div id="nbar"><i></i></div>
<div id="scenes"></div>
<div id="spot"></div>
<svg id="cursor" viewBox="0 0 28 32"><path d="M3 2 L3 26 L9.5 19.5 L14 29 L18.5 27 L14 17.5 L23 17.5 Z" fill="#fff" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/></svg>
</div></div>
<div id="cap" aria-live="polite"></div>
<div id="bar">
 <button id="prev">Back</button><button id="play">Start</button><button id="next">Next</button>
 <div id="dots"></div>
 <button id="capbtn" aria-pressed="false">Captions</button><button id="voice" aria-pressed="true">Voice on</button>
</div>
<script>
const DECK_ID='checking-off-tasks';

/* A one-minute tip for Pacific Island Partners staff: finishing the work does
   not close the task on My Day; ticking the box at the left of the row does.
   Drawn from the live code (Int v151.89): the .todo row markup and
   _renderMyDayTasks, the .myday-hero chips, and myDayToggleDone, which sets the
   interaction to status Closed. My Day listens for Open tasks only, so a ticked
   task drops off the list and the Overdue chip is recounted. Clicking anywhere
   else on the row calls viewInteraction (opens the full task). Every name and
   figure here is made up. */

const tap=async(s,ms=850)=>{const e=typeof s==='string'?q(s):s;await move(e,ms);await click(e);return e};
const show=(e,ms=500)=>anim(e,[{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],ms,'ease-out');

const TASKS=[
 {k:'t1',cls:'urgent',ttl:'TOTAL attendance is missing — Family Night (Sep 4). Please type how many people attended.',sub:'Open · Office · follow-up 2026-09-05',pills:'<span class="pill overdue">OVERDUE</span><span class="pill followup">Data review</span>'},
 {k:'t2',cls:'urgent',ttl:'Call back about Parent Circle — Pat Example',sub:'Open · Phone · follow-up 2026-09-29',pills:'<span class="pill overdue">OVERDUE</span><span class="pill followup">Follow-up</span>'},
 {k:'t3',cls:'',ttl:'Send the reminder for Parent Circle (Oct 8)',sub:'Open · Email · follow-up 2026-10-06',pills:'<span class="pill">THIS WEEK</span>'}
];
const MYDAY=()=>`<div class="md">
 <div class="mdh"><div class="h"><h3>My Day</h3><div class="hs k-hs">2 things need you today</div></div>
  <div class="chips"><div class="chip red k-od"><div class="n">2</div><div class="l">Overdue</div></div><div class="chip amb"><div class="n">0</div><div class="l">Today</div></div><div class="chip"><div class="n">1</div><div class="l">This wk</div></div><div class="chip grn"><div class="n">12</div><div class="l">Done</div></div><div class="chip cas"><div class="n">3</div><div class="l">My cases</div></div></div></div>
 <div class="sect"><h4>Things to do today <span class="tcnt k-cnt">3</span></h4><span class="va">View all my tasks →</span></div>
 <div class="todos">${TASKS.map(t=>`<div class="todo ${t.cls} k-${t.k}"><div class="check"></div><div class="meta"><div class="ttl">${t.ttl}</div><div class="sub">${t.sub}</div></div><div class="tags">${t.pills}</div></div>`).join('')}</div>
</div>`;
const BADGE='<div class="pipbadge"><img src="pip-logo.png" alt="Pacific Island Partners"></div>';

const SC=[
// ================= 1. DOING IT IS NOT TICKING IT =================
{html:()=>HEAD('Pacific Island Partners · My Day','Doing it is not the same as ticking it')+BADGE+MYDAY()+`
 <div class="evm"><div class="evh">Family Night · Sep 4</div><div class="evb"><label>How many people attended?</label><div class="fi2 ph k-in">e.g. 24</div>
  <div class="ynote"><b>This is the TOTAL attendance</b>, including the people you marked attended above.</div></div>
  <div class="evf"><span class="cx">Cancel</span><span class="sv">Save</span></div></div>
 <div class="saved">Saved</div><div class="anno still">Still here, still overdue</div>
 <div class="abs" style="left:800px;top:190px;width:420px"><ul class="pts"><li>A task on <b>Things to do today</b>.</li><li>You do the work: type the <b>TOTAL</b> on the event and save.</li><li>The task is <b>still there</b>. Doing the work does not close it.</li></ul></div>
 <div class="gate lite"><button class="btn" data-go="start">Start</button><label><input type="checkbox" id="voiceChk" checked> Read it out loud to me</label></div>`,
 steps:[{say:'Hi {name}. Here is a one minute tip about the tasks on your My Day.'},
 {say:'This task is under Things to do today. The total attendance is missing for Family Night, and it is overdue.',li:0,act:async()=>spot(q('.k-t1'),6)},
 {say:'So you open the event, type the total, thirty eight people, and save.',li:1,act:async()=>{spot(null);const m=q('.evm');await show(m);await tap('.k-in',800);await type(q('.k-in'),'38',120);await tap('.evf .sv',700);hideCursor();
   await anim(m,[{opacity:1},{opacity:0}],350,'ease-in');const s=q('.saved');await show(s,300);await wait(900);await anim(s,[{opacity:1},{opacity:0}],300,'ease-in')}},
 {say:'The work is done. But the task is still sitting there, still red, still overdue. Doing the work does not close the task.',li:2,act:async()=>{spot(q('.k-t1'),6);await wait(500);await show(q('.still'))}}]},

// ================= 2. TICK THE BOX =================
{html:()=>HEAD('Pacific Island Partners · My Day','Tick the circle')+BADGE+MYDAY()+`
 <div class="hov">Opens the full task</div>
 <div class="big-note" style="left:120px;top:420px;width:600px">Click the <b>box</b>, not the words. The words open the full task.</div>
 <div class="abs" style="left:800px;top:190px;width:420px"><ul class="pts"><li>The small box at the <b>left end</b> of the row. The tip on screen calls it the circle.</li><li>Click it once. It ticks green.</li><li>The task leaves the list. <b>Overdue</b> drops by one.</li><li>Box, not words.</li></ul></div>`,
 steps:[{say:'To close it, use the small box at the left end of the row. The tip on the screen calls it the circle.',li:0,act:async()=>spot(q('.k-t1 .check'),8)},
 {say:'Click it once. It ticks green and the task is crossed out.',li:1,act:async()=>{spot(null);await tap('.k-t1 .check',900);q('.k-t1').classList.add('done');hideCursor()}},
 {say:'Then it drops off the list, and the Overdue number goes down by one.',li:2,act:async()=>{const r=q('.k-t1');await wait(400);const h=r.offsetHeight;
   await anim(r,[{opacity:.55,height:h+'px',paddingTop:'10px',paddingBottom:'10px',marginBottom:'0px'},{opacity:0,height:'0px',paddingTop:'0px',paddingBottom:'0px',marginBottom:'-8px'}],600,'ease-in');r.remove();
   const od=q('.k-od');od.classList.add('flash');await countTo(od.querySelector('.n'),1,'',500);q('.k-cnt').textContent='2';q('.k-hs').textContent='1 thing needs you today';spot(od,6)}},
 {say:'Click the box, not the words. Clicking the words opens the full task instead.',li:3,act:async()=>{spot(null);const w=q('.k-t2 .ttl');await move(w,800);const p=pos(w),hv=q('.hov');hv.style.left=(p.x+300)+'px';hv.style.top=(p.y+30)+'px';await show(hv,300);await wait(700);hideCursor();await show(q('.big-note'))}}]},

// ================= 3. RECAP =================
{cls:'cover',html:()=>`<div class="brand">Pacific Island Partners · My Day</div><div class="hello">All done</div><h1 style="font-size:50px;white-space:nowrap">Thank you<span class="nmc"></span>!</h1>
 <ul class="wrapl"><li style="animation-delay:.3s">Do the work, <b>then tick the circle</b>. Every time.</li><li style="animation-delay:.45s">Already done? Just tick it now.</li><li style="animation-delay:.6s">Click the box, not the words.</li><li style="animation-delay:.75s">If it asks you a question first, answer it.</li></ul>
 <p class="sub end">Come back and watch it again any time in Training Videos.</p>
 <div class="pipglow"></div><div class="piplogo"><img src="pip-logo.png" alt="Pacific Island Partners"></div>
 ${[[740,110,0],[1190,150,.8],[1210,400,1.6],[760,420,.4]].map(p=>`<div class="pipspk" style="left:${p[0]}px;top:${p[1]}px;animation-delay:${p[2]}s">${SPARK}</div>`).join('')}
 <div class="gate" style="top:510px"><button class="btn ghost" data-go="again">Watch again</button></div>${WAVES}`,
 steps:[{say:'That’s it, {name}. Do the work, then tick the circle, every time. If a task is already done, just tick it now. A few tasks ask you a question first, so answer it. Come back and watch this again any time in Training Videos. Thank you!',act:async()=>{await wait(400);confetti(640,300,160)}}]}
];
</script>
<script src="deck-engine.js"></script>
<script src="deck-tracker.js"></script></body></html>
