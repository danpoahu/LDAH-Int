<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checking Signups — Training</title>
<link rel="stylesheet" href="deck-base.css">
<style>
/* expanded signup card: the three boxes */
.xb{border:1px solid #E2E8F0;border-radius:9px;background:#F8FAFC;padding:10px 12px;margin-bottom:8px}
.xb h6{margin:0 0 7px;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:#64748B;font-weight:800}
.xg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 12px}
.xg div{font-size:11.5px;color:#0F172A}
.xg label{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:#94A3B8;font-weight:700}
.sesrow{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #E2E8F0;border-radius:6px;padding:6px 9px;margin-top:5px;font-size:11.5px}
.sesrow .cd{margin-left:auto;background:#FEF3C7;color:#92400E;font-weight:700;font-size:10.5px;border-radius:6px;padding:3px 9px}
/* the ... menu */
.menu{position:absolute;background:#fff;border:1px solid #E2E8F0;border-radius:10px;box-shadow:0 16px 40px rgba(15,23,42,.22);padding:6px;width:238px;z-index:30}
.menu div{padding:7px 10px;font-size:12.5px;color:#334155;border-radius:6px}
.menu div.hi{background:#E0F2FE;color:#0E6E8C;font-weight:700}
/* badge legend */
.leg{display:flex;flex-direction:column;gap:12px}
.leg .it{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;opacity:0;transform:translateX(-22px);transition:all .45s ease}
.leg .it.on{opacity:1;transform:none}
.leg .it .sbg{margin-left:0;font-size:11px;padding:5px 12px;flex:none;width:150px;text-align:center}
.leg .it p{margin:0;font-size:15px;color:var(--soft);line-height:1.4}
/* two-up compare */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.cmp>div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:0 8px 24px rgba(15,23,42,.08);opacity:0}
.cmp h4{margin:0 0 4px;font-size:19px;color:var(--teal)}
.cmp .w{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#94A3B8;margin-bottom:10px}
.cmp ul{margin:0;padding-left:20px;font-size:14.5px;line-height:1.5;color:var(--soft)}
.cmp li{margin-bottom:6px}
.cmp b{color:var(--ink)}
</style></head><body>
<div id="view"><div id="stage"><div id="nbar"><i></i></div>
<div id="scenes"></div>
<div id="spot"></div>
<svg id="cursor" viewBox="0 0 28 32"><path d="M3 2 L3 26 L9.5 19.5 L14 29 L18.5 27 L14 17.5 L23 17.5 Z" fill="#fff" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/></svg>
</div></div>
<div id="cap" aria-live="polite"></div>
<div id="bar">
 <button id="prev">Back</button><button id="play">Start</button><button id="next">Next</button>
 <div id="dots"></div>
 <button id="capbtn" aria-pressed="false">Captions</button><button id="voice" aria-pressed="true">Voice on</button>
</div>
<script src="deck-mocks.js"></script>
<script>
const DECK_ID='checking-signups-2026-09';

const ROWS=()=>[
 ldahSignupRow('Kalani Example','kalani@example.com','ok'),
 ldahSignupRow('Mele Sample','mele.sample@example.com','cons',{status:'Pending'}),
 ldahSignupRow('Noa Testperson','noa@example.org','pend',{status:'New'})];

const WIN=(o)=>ldahSignupsWindow(Object.assign({blocks:[
 ldahSessionBlock({label:'Connect-Gen: For Thursday, 2026-10-01 — 11:00 AM - 1:00 PM @ Oahu',cls:'b0',rows:[]}),
 ldahSessionBlock({label:'Connect-Gen: For Monday, 2026-10-05 — 3:00 PM - 5:00 PM @ All Islands Virtual',cls:'b1',rows:ROWS()}),
]},o||{}));

const SC=[
{cls:'cover',html:()=>`<div class="brand">Leadership in Disabilities &amp; Achievement of Hawaiʻi</div><div class="hello">Aloha <span class="nm"></span></div>
 <h1>Checking signups</h1><p class="sub">Who registered, where they are up to, and how to get the list out. About five minutes.</p>
 <div class="abs cvm" style="left:720px;top:130px;transform:scale(.58) rotate(3deg);transform-origin:top left;animation:bob 5s ease-in-out infinite">${WIN()}</div>
 <div class="spark" style="left:1190px;top:115px">${SPARK}</div><div class="spark" style="left:690px;top:470px;animation-delay:1s">${SPARK}</div>
 <div class="gate"><button class="btn" data-go="start">Start training</button><button class="btn ghost" data-go="skip">Skip for now</button><label><input type="checkbox" id="voiceChk" checked> Read it out loud to me</label></div>${WAVES}`,
 steps:[{say:'Aloha {name}! This is the signups window — who registered for an event, where each family is up to, and how to get the list out for a session. About five minutes.'}]},

{html:()=>HEAD('Getting there','Events &amp; Programs → View Signups')+`<div class="abs" style="left:58px;top:130px;width:1170px">
 <div class="crumb">CMS → Content Management → <b>Events &amp; Programs</b></div>${ldahEventCards()}</div>`,steps:[
 {say:'Start on the CMS tab, in Content Management, then Events and Programs. Every event and every ongoing programme has a card.',act:async()=>{for(const c of document.querySelectorAll('.scene.on .evc')){await anim(c,[{opacity:0,transform:'translateY(40px)'},{opacity:1,transform:'none'}],420)}}},
 {say:'Find the one you want and press View Signups.',act:async()=>{const v=q('.c0 .vs');spot(q('.c0'),6);place(700,650,0);await move(v,1000);await click(v);await wait(300);spot(null)}},
 {say:'That opens the signups window.',act:async()=>{hideCursor();const m=add(`<div class="abs mw" style="left:270px;top:118px;transform:scale(.8);transform-origin:top left">${WIN()}</div>`);await anim(m,[{opacity:0,transform:'scale(.6)'},{opacity:1,transform:'scale(.8)'}],500)}}]},

{html:()=>HEAD('The window','What is along the top')+`<div class="abs" style="left:58px;top:126px;transform:scale(.93);transform-origin:top left">${WIN()}</div>
 <div class="abs" style="left:790px;top:148px;width:440px"><ul class="pts"><li>The title is just the <b>event name</b>. The small <b>i</b> beside it explains the screen.</li><li>Four buttons: <b>Take Attendance</b>, <b>Session Sheet</b>, <b>Export CSV</b>, <b>Summary</b>.</li><li>Under them, a strip that <b>summarises the whole event</b>.</li></ul></div>`,steps:[
 {say:'Here is the window. The title is simply the name of the event, and the little i beside it explains the whole screen if you ever forget.',li:0,act:async()=>{spot(q('.tt'),5);await wait(1500)}},
 {say:'Along the top there are four buttons. Take Attendance, Session Sheet, Export CSV, and Summary. We will come back to the middle two.',li:1,act:async()=>{spot(q('.bt2'),5);await wait(1800)}},
 {say:'And underneath them, a strip that summarises the event at a glance.',li:2,act:async()=>{spot(q('.strip'),5);await wait(1300);spot(null)}}]},

{html:()=>HEAD('Careful','The strip changes with the event')+`<div class="abs" style="left:58px;top:140px;width:700px">
 <div class="strip s1" style="border:1px solid #E2E8F0;border-radius:10px;overflow:hidden;opacity:0"><div><b>12</b><span>Families</span></div><div><b>3</b><span>Awaiting worksheet</span></div><div><b>9</b><span>Ready</span></div><div><b>Oct 5</b><span>Next session</span></div></div>
 <div class="strip s2" style="border:1px solid #E2E8F0;border-radius:10px;overflow:hidden;margin-top:16px;opacity:0"><div><b>8</b><span>Signups</span></div><div><b>19</b><span>People</span></div><div><b>2</b><span>Pending</span></div><div><b>19 / 25 seats</b><span>Capacity</span></div></div>
 <div class="strip s3" style="border:1px solid #E2E8F0;border-radius:10px;overflow:hidden;margin-top:16px;opacity:0"><div><b>17</b><span>Signed up</span></div><div><b>14</b><span>Confirmed</span></div><div><b>3</b><span>Pending</span></div><div><b>14</b><span>Attended</span></div></div></div>
 <div class="abs" style="left:790px;top:148px;width:440px"><ul class="pts"><li><b>Connect-Gen</b> counts families, and what they still owe.</li><li>A <b>Remote Signup</b> counts <b>people against seats</b>, not signups — one signup can be a whole family.</li><li>Everything else counts signed up, confirmed, pending, attended.</li></ul></div>`,steps:[
 {say:'That strip is not the same on every event, and this catches people out. On Connect-Gen it counts families, and how many still owe you their worksheet.',li:0,act:async()=>{await anim(q('.s1'),[{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],450);spot(q('.s1'),5);await wait(900);spot(null)}},
 {say:'On a Remote Signup it counts people against the venue capacity, not signups. One signup can bring a whole family, so those two numbers are different on purpose.',li:1,act:async()=>{await anim(q('.s2'),[{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],450);spot(q('.s2'),5);await wait(1900);spot(null)}},
 {say:'And on everything else it is the plain count: signed up, confirmed, pending, attended.',li:2,act:async()=>{await anim(q('.s3'),[{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],450);await wait(900)}}]},

{html:()=>HEAD('The list','One block per session date')+`<div class="abs" style="left:58px;top:132px;width:706px;transform:scale(.98);transform-origin:top left">
 ${ldahSessionBlock({label:'Connect-Gen: For Monday, 2026-10-05 — 3:00 PM - 5:00 PM @ All Islands Virtual',cls:'b0',rows:ROWS()})}
 ${ldahSessionBlock({label:'Connect-Gen: For Thursday, 2026-09-18 — 11:00 AM - 1:00 PM @ Oahu',cls:'b1',state:'past',rows:[ldahSignupRow('Kalani Example','kalani@example.com','ok')]})}
 ${ldahSessionBlock({label:'Connect-Gen: For Thursday, 2026-10-08 — 11:00 AM - 1:00 PM @ Oahu',cls:'b2',state:'cancelled',rows:[]})}</div>
 <div class="abs" style="left:790px;top:148px;width:440px"><ul class="pts"><li><b>Navy</b> — an upcoming date.</li><li><b>Amber with a PAST pill</b> — it has already happened.</li><li><b>Red and struck through</b> — the date was cancelled.</li><li>Each block says how many signed up, or <i>No signups for this date</i>.</li></ul></div>`,steps:[
 {say:'The list is one block per session date, newest schedule first. A navy band is a date still to come.',li:0,act:async()=>{spot(q('.b0 .sbh'),4);await wait(1300)}},
 {say:'Amber, with a PAST pill, means that date has already happened.',li:1,act:async()=>{spot(q('.b1 .sbh'),4);await wait(1300)}},
 {say:'And red with a line through it means somebody cancelled that date. The word cancelled is not printed — the red strikethrough is the signal.',li:2,act:async()=>{spot(q('.b2 .sbh'),4);await wait(1900)}},
 {say:'Each block tells you how many signed up, or says plainly, no signups for this date.',li:3,act:async()=>{spot(q('.b2 .snone'),4);await wait(1200);spot(null)}}]},

{html:()=>HEAD('Easy to miss','Empty dates are folded away')+`<div class="abs" style="left:58px;top:140px;width:706px">
 <div class="fold f0" style="opacity:0"><b>4 upcoming dates with no signups yet</b><span class="show">show</span></div>
 <div class="fold f1" style="opacity:0"><b>2 cancelled dates with no signups</b><span class="show">show</span></div></div>
 <div class="abs" style="left:790px;top:148px;width:440px"><ul class="pts"><li>A date with <b>nobody on it</b> does not get its own block.</li><li>It folds into one of these dashed bars.</li><li>Press <b>show</b> to open them up.</li><li>The window only covers about <b>the next 30 days</b> — later dates live under <b>Future Dates</b>.</li></ul></div>`,steps:[
 {say:'One thing that catches everybody out. A date with nobody signed up yet does not get its own block.',li:0,act:async()=>{await anim(q('.f0'),[{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],420);await anim(q('.f1'),[{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],420)}},
 {say:'It gets folded into one of these dashed bars instead. Press show, and they open up.',li:2,act:async()=>{const s=q('.f0 .show');spot(q('.f0'),5);place(400,640,0);await move(s,850);await click(s);await wait(600);spot(null);hideCursor()}},
 {say:'And remember this window only reaches about thirty days ahead. Anything further out lives on the Future Dates button instead.',li:3,act:async()=>{await wait(500)}}]},

{html:()=>HEAD('Status','What the badge on each row means')+`<div class="cl" style="left:110px;top:138px;width:1060px"><div class="leg">
 <div class="it i0"><span class="sbg ok">Confirmed</span><p>Registered <b>and</b> consent signed. Nothing outstanding.</p></div>
 <div class="it i1"><span class="sbg cons">Awaiting Consent</span><p>They registered, but the consent form is not signed yet.</p></div>
 <div class="it i2"><span class="sbg pend">Pending Registration</span><p>They started, but the registration itself is not finished.</p></div>
 <div class="it i3"><span class="sbg su">Signed Up</span><p>On the list, nothing else recorded yet. The default.</p></div>
</div></div>`,steps:[
 {say:'Every row carries a badge, and it tells you exactly how far along that family is. There are four.',act:async()=>{for(const c of document.querySelectorAll('.scene.on .it')){c.classList.add('on');await wait(180)}}},
 {say:'Green, Confirmed. They registered and their consent is signed. Nothing outstanding.',act:async()=>{spot(q('.i0'),5);await wait(1400)}},
 {say:'Blue, Awaiting Consent. They registered, but nobody has signed the consent form yet.',act:async()=>{spot(q('.i1'),5);await wait(1400)}},
 {say:'Amber, Pending Registration. They made a start, but the registration itself is not finished.',act:async()=>{spot(q('.i2'),5);await wait(1400)}},
 {say:'And grey, Signed Up. They are on the list and nothing else has been recorded. That is the default.',act:async()=>{spot(q('.i3'),5);await wait(1400);spot(null)}}]},

{html:()=>HEAD('Step 2','Click a row to open the family')+`<div class="abs" style="left:58px;top:130px;width:700px">
 ${ldahSignupRow('Kalani Example','kalani@example.com','ok',{cls:'r0'})}
 <div style="margin-top:8px">
  <div class="xb x0" style="opacity:0"><h6>Personal info</h6><div class="xg"><div><label>Email</label>kalani@example.com</div><div><label>Phone</label>(808) 555-0100</div><div><label>Preferred</label>Email</div><div><label>Island</label>Oahu</div><div><label>Reason for attending</label>IEP support</div><div><label>Accommodations</label>None</div></div></div>
  <div class="xb x1" style="opacity:0"><h6>Student &amp; program</h6><div class="xg"><div><label>Student</label>K. Example</div><div><label>Grade</label>5</div><div><label>School</label>Sample Elementary</div></div>
   <div class="sesrow"><b>Mon 2026-10-05 — 3:00 PM @ All Islands Virtual</b><span class="cd">Change date</span></div></div>
  <div class="xb x2" style="opacity:0"><h6>Internal</h6><div class="xg" style="grid-template-columns:1fr"><div><label>Admin notes</label>Called 9-20, sending worksheet again.</div></div></div>
 </div></div>
 <div class="abs" style="left:790px;top:148px;width:440px"><ul class="pts"><li><b>Personal info</b> — contact details and why they came.</li><li><b>Student &amp; program</b> — the child, and the <b>sessions they are booked on</b>.</li><li><b>Internal</b> — admin notes, only staff see these.</li></ul></div>`,steps:[
 {say:'Click any row and the family opens up underneath, in three boxes.',act:async()=>{const r=q('.r0');place(380,640,0);await move(r,850);await click(r);hideCursor();
   for(const s of ['.x0','.x1','.x2']){await anim(q(s),[{opacity:0,transform:'translateY(18px)'},{opacity:1,transform:'none'}],380)}}},
 {say:'Personal info: how to reach them, and the reason they gave for coming.',li:0,act:async()=>{spot(q('.x0'),5);await wait(1400)}},
 {say:'Student and program: the child, the school, and the session dates this family is booked on. That is where the Change date button lives if you ever need to move somebody.',li:1,act:async()=>{spot(q('.x1'),5);await wait(900);spot(q('.sesrow'),5);await wait(1700)}},
 {say:'And Internal, for admin notes. Families never see those.',li:2,act:async()=>{spot(q('.x2'),5);await wait(1300);spot(null)}}]},

{html:()=>HEAD('Step 3','The status box, and the three dots')+`<div class="abs" style="left:58px;top:150px;width:700px">
 ${ldahSignupRow('Kalani Example','kalani@example.com','ok',{cls:'r0'})}</div>
 <div class="abs" style="left:790px;top:148px;width:440px"><ul class="pts"><li>The small box sets the status: <b>New</b>, <b>Pending</b>, <b>Confirmed</b>, <b>Cancelled</b>.</li><li>The <b>…</b> holds everything else.</li><li>Registration detail, add a note, resend the confirmation, archive.</li></ul></div>`,steps:[
 {say:'On the right of each row there are two controls. The little box sets the status by hand: new, pending, confirmed, or cancelled.',li:0,act:async()=>{const s=q('.srs');spot(s,5);place(420,640,0);await move(s,850);await wait(1200)}},
 {say:'And the three dots hold everything else you might need.',li:1,act:async()=>{const d=q('.dots3');await move(d,700);await click(d);const p=pos(d);
   const m=add(`<div class="menu" style="left:${p.x-200}px;top:${p.y+30}px"><div>Registration detail</div><div>Add a note</div><div class="hi">Resend confirmation email</div><div>Archive this signup</div></div>`);
   await anim(m,[{opacity:0,transform:'translateY(-10px) scale(.95)'},{opacity:1,transform:'none'}],380);spot(null)}},
 {say:'Registration detail, add a note, resend the confirmation email, and archive the signup. Archive is the gentle one — it hides the row without destroying anything.',li:2,act:async()=>{await wait(1600);hideCursor()}}]},

{html:()=>HEAD('Getting it out','Export CSV or Session Sheet?')+`<div class="abs" style="left:58px;top:146px;width:1170px"><div class="cmp">
 <div class="k0"><div class="w">For the spreadsheet</div><h4>Export CSV</h4><ul>
  <li><b>The whole event</b> — every date at once</li>
  <li>Includes <b>archived, cancelled and past</b> signups</li>
  <li>About <b>50 columns</b>: contact, student, school, demographics, notes</li>
  <li>Downloads as <b>signups-&lt;event&gt;.csv</b></li></ul></div>
 <div class="k1"><div class="w">For the day itself</div><h4>Session Sheet</h4><ul>
  <li><b>One session date at a time</b>, grouped</li>
  <li><b>Cancelled dates are left out</b></li>
  <li>Tick box, Name, Phone, Type, Status, Mode, Notes</li>
  <li>Opens a <b>printable sheet</b> — nothing downloads</li></ul></div></div></div>`,steps:[
 {say:'Last, the two ways of getting the list out. They are not the same thing, and people reach for the wrong one.',act:async()=>{for(const s of ['.k0','.k1']){await anim(q(s),[{opacity:0,transform:'translateY(30px)'},{opacity:1,transform:'none'}],450)}}},
 {say:'Export CSV gives you the whole event in one file. Every date, and that includes archived, cancelled and past signups, with about fifty columns. Use it for the spreadsheet, for reporting.',act:async()=>{spot(q('.k0'),7);await wait(2200)}},
 {say:'Session Sheet is the one you print and carry. One session date at a time, with a tick box beside each name — and cancelled dates are left out. Nothing downloads, it just opens ready to print.',act:async()=>{spot(q('.k1'),7);await wait(2400);spot(null)}}]},

{html:()=>HEAD('Recap','Your signups checklist')+`<div class="cl">${[
 'CMS → Content Management → <b>Events &amp; Programs</b> → <b>View Signups</b>',
 'The <b>top strip</b> counts differently per event — Remote Signup counts <b>people against seats</b>',
 'Navy = upcoming · amber <b>PAST</b> = already happened · <b>red strikethrough</b> = cancelled',
 'Dates with <b>nobody on them are folded</b> into a dashed bar — press <b>show</b>',
 'The badge says how far along a family is: Confirmed, Awaiting Consent, Pending Registration, Signed Up',
 'Click a row for the family; the <b>…</b> holds notes, resend and archive',
 '<b>Export CSV</b> = whole event for the spreadsheet · <b>Session Sheet</b> = one date, to print'
 ].map(t=>`<div class="ci"><div class="bx"><svg viewBox="0 0 26 26"><path d="M5 13 L11 19 L21 7"/></svg></div><span>${t}</span></div>`).join('')}</div>`,steps:[
 {say:'Let’s recap.',act:async()=>{for(const c of document.querySelectorAll('.scene.on .ci')){c.classList.add('on');await wait(150)}}},
 ...['Events and Programs, then View Signups.','The top strip counts differently depending on the event.','Navy is upcoming, amber is past, red struck through is cancelled.','Empty dates are folded away — press show to find them.','The badge tells you how far along each family is.','Click a row for the detail, and the three dots for the rest.','Export CSV for the spreadsheet, Session Sheet to print.']
  .map((s,i)=>({say:s,act:async()=>{const cs=document.querySelectorAll('.scene.on .ci');cs.forEach((c,j)=>{c.classList.add('on');if(j<i)c.classList.add('done')});await wait(600);cs[i].classList.add('done')}}))]},

{cls:'cover',html:()=>`<div class="brand">Checking signups</div><div class="hello">All done</div><h1>Mahalo<span class="nmc"></span>!</h1><p class="sub">Open the event, read the badges, print the sheet. Questions? Ask Dan.</p>
 <div class="abs cvm" style="left:740px;top:150px;transform:scale(.56) rotate(3deg);transform-origin:top left;animation:bob 5s ease-in-out infinite">${WIN()}</div>
 <div class="gate" style="top:460px"><button class="btn ghost" data-go="again">Watch again</button><button class="btn" data-go="close">Close</button></div>${WAVES}`,
 steps:[{say:'Mahalo {name}! Open the event, read the badges, print the sheet. You’ve got it.',act:async()=>{await wait(400);confetti(640,300,140)}}]}
];
</script>
<script src="deck-engine.js"></script></body></html>
