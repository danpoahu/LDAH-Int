<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Completing the Event Summary — Training</title>
<link rel="stylesheet" href="deck-base.css">
<style>
/* ---- Event Summary modal ---- */
.esm{width:820px;background:#fff;border-radius:14px;box-shadow:0 20px 50px rgba(15,23,42,.3);overflow:hidden;font-size:13px}
.esh{display:flex;align-items:center;gap:10px;padding:13px 16px;background:linear-gradient(135deg,#0891B2,#06B6D4);color:#fff}
.esh .lg{width:26px;height:26px;border-radius:7px;background:rgba(255,255,255,.28);flex:none}
.esh b{font-weight:800;font-size:16px;margin-right:auto}
.esh .x{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.18);text-align:center;line-height:30px;font-size:19px}
.esb{padding:14px 18px}
.sdrow{display:flex;align-items:center;gap:8px}
.sdl{font-size:12.5px;font-weight:600;color:#475569}
.sdsel{border:1px solid #CBD5E1;border-radius:8px;padding:6px 30px 6px 12px;font-size:13px;background:#fff;position:relative;display:inline-block}
.sdsel::after{content:"▾";position:absolute;right:10px;color:#475569}
/* coloured bands */
.bb,.bg2,.bp{border-radius:10px;padding:4px 16px 16px;margin:14px 0}
.bb{background:#F0F9FF;border:1px solid #BAE6FD;border-left:4px solid #0EA5E9}
.bg2{background:#F0FDF4;border:1px solid #BBF7D0;border-left:4px solid #16A34A}
.bp{background:#FFF5F7;border:1px solid #FBCFE8;border-left:4px solid #DB2777}
.stt{font-weight:700;font-size:14.5px;padding:12px 0 6px;margin-bottom:12px;border-bottom:1px solid #BAE6FD}
.bb .stt{color:#075985}.bg2 .stt{color:#166534;border-bottom-color:#BBF7D0}.bp .stt{color:#9D174D;border-bottom-color:#FBCFE8}
.stt .nt{font-size:11.5px;font-weight:500;color:#64748B}
/* pink sheet table */
.pt{background:#FFF7FA;border:1px solid #FCE7F3;border-radius:8px;overflow:hidden}
.pt .r{display:flex;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid #FBCFE8}
.pt .r:last-child{border-bottom:0}
.pt .r.hl{background:#FFFBEB}
.pt .lb{width:54%;font-weight:600;color:#475569;font-size:12.5px}
.pt .lb small{display:block;font-weight:400;font-size:10.5px;color:#64748B;line-height:1.3;margin-top:1px}
.pt .lb i{font-style:normal;font-weight:400;color:#64748B;font-size:11.5px}
.nb{width:78px;padding:4px 8px;border:1px solid #CBD5E1;border-radius:6px;font-size:12.5px;text-align:right;background:#fff;transition:background .4s,border-color .4s}
.nb.chk{background:#FFFBEB;border-color:#F59E0B}
.tbx{padding:4px 8px;border:1px solid #CBD5E1;border-radius:6px;font-size:12px;background:#fff;color:#94A3B8}
.ah{font-size:10.5px;color:#64748B}
.ah.ov{color:#9A3412}
.rsb{font-size:10px;border:1px solid #FBCFE8;background:#fff;color:#9A3412;border-radius:6px;padding:2px 7px}
.ro{font-weight:700;color:#0f172a;font-size:15px}
/* walk-ins */
.wk{background:#fff;border:1px solid #BAE6FD;border-radius:8px;padding:12px 14px;margin-top:14px}
.wk h6{margin:0 0 4px;font-size:13.5px;color:#075985;font-weight:700}
.wk .hp{margin:0 0 9px;font-size:11px;color:#64748B;line-height:1.4}
.wrow{display:flex;gap:8px;align-items:center}
.wrow .tbx{flex:1}
.addb{background:#0EA5E9;color:#fff;border-radius:6px;padding:6px 18px;font-size:12.5px;font-weight:600}
.wlist{margin-top:9px;font-size:11.5px;color:#64748B;font-style:italic}
.wpill{display:flex;align-items:center;gap:8px;border:1px solid #FCE7F3;border-radius:6px;padding:6px 10px;background:#fff;font-style:normal}
.wpill b{font-size:12px;color:#0F172A}.wpill span{color:#64748B;font-size:11px;margin-right:auto}
.wpill .ok2{color:#166534;font-size:10.5px;font-weight:700}
/* pink staff */
.pbn{display:flex;gap:9px;background:#FCE7F3;border:1px solid #FBCFE8;border-radius:8px;padding:10px 12px;margin:14px 0 4px}
.pbn i{width:22px;height:22px;border-radius:50%;background:#DB2777;color:#fff;font-weight:800;font-size:12px;text-align:center;line-height:22px;flex:none;font-style:normal}
.pbn div{font-size:12px;color:#9D174D;line-height:1.45}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin-top:10px}
.fg2 label{display:block;font-size:11.5px;font-weight:600;color:#475569;margin-bottom:3px}
.fld{display:block;border:1px solid #CBD5E1;border-radius:8px;background:#fff;padding:7px 12px;font-size:12.5px;min-height:31px;position:relative}
.fld.sel::after{content:"▾";position:absolute;right:11px;top:7px;color:#475569}
.fh{font-size:10.5px;color:#64748B;margin-top:3px}
.wide{grid-column:1/-1}
/* materials */
.mt{width:100%;border-collapse:collapse;background:#fff;font-size:12px}
.mtw{border:1px solid #E2E8F0;border-radius:8px;overflow:hidden}
.mt th{background:#F1F5F9;color:#1a3c6e;font-weight:700;font-size:11px;padding:7px 10px;text-align:left}
.mt th.c,.mt td.c{text-align:center;width:104px}
.mt td{padding:5px 10px;border-top:1px solid #F1F5F9;color:#334155}
.mt tr:nth-child(even) td{background:#F8FAFC}
.mt .nb{width:56px;text-align:center}
.cap{font-size:11.5px;color:#64748B;margin:0 0 9px}
.txa{border:1px solid #CBD5E1;border-radius:8px;padding:10px 12px;font-size:12.5px;color:#94A3B8;background:#fff;min-height:88px;line-height:1.45}
.acts{display:flex;gap:10px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid #FBCFE8}
.savebtn{background:#059669;color:#fff;font-weight:800;border-radius:12px;padding:9px 18px;font-size:13.5px;transition:transform .15s}
.ghostb{background:#fff;border:1px solid rgba(8,145,178,.16);color:#0891B2;font-weight:800;border-radius:12px;padding:9px 14px;font-size:12px}
.savedby{font-size:11px;color:#64748B;margin-bottom:9px}
/* My Day todo */
.todo{display:grid;grid-template-columns:22px 1fr auto;gap:12px;padding:11px 13px;background:#fff;border:1px solid rgba(8,145,178,.10);border-radius:12px;border-left:4px solid #F97316;align-items:start;box-shadow:0 6px 20px rgba(2,132,199,.08)}
.todo .ck{width:18px;height:18px;border:2px solid rgba(100,116,139,.4);border-radius:5px;background:#fff;margin-top:2px}
.todo .ttl{font-weight:600;font-size:14px;color:#1E293B;line-height:1.35}
.todo .sub{font-size:11.5px;color:#64748B;margin-top:4px}
.oes{display:inline-block;background:#0891b2;color:#fff;font-size:11.5px;padding:5px 11px;border-radius:6px;font-weight:600;margin-top:8px;transition:transform .15s}
.tgs{display:flex;gap:6px}
.pill{font-size:10.5px;font-weight:800;border-radius:999px;padding:3px 9px;letter-spacing:.04em;white-space:nowrap;background:rgba(8,145,178,.12);color:#0891B2}
.pill.due{background:#FED7AA;color:#9A3412}
.pill.fu{background:#DBEAFE;color:#1E3A8A}
/* reports */
.fbar{background:#fff;border-radius:14px;box-shadow:0 6px 20px rgba(2,132,199,.08);padding:12px;display:grid;grid-template-columns:1.4fr .7fr 1.2fr .8fr .9fr .9fr;gap:10px;align-items:end}
.fbar label{display:block;font-size:9.5px;color:#64748B;font-weight:600;letter-spacing:.04em;margin-bottom:4px}
.fin{border:1px solid #CBD5E1;border-radius:6px;padding:6px 9px;font-size:11.5px;background:#fff;color:#94A3B8;position:relative}
.fin.sel::after{content:"▾";position:absolute;right:8px;color:#475569}
.eag{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
.ea{background:#fff;border-radius:14px;padding:12px 13px;box-shadow:0 6px 20px rgba(2,132,199,.08);border:1px solid rgba(8,145,178,.08)}
.chip{display:inline-block;font-size:10px;font-weight:600;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.ea .t{font-weight:800;font-size:15px;color:#1E293B;line-height:1.25}
.ea .s{font-size:11.5px;color:#64748B;margin-top:3px}
.pl{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.pl span{font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:999px;background:#F1F5F9;color:#1a3c6e;border:1px solid #E2E8F0}
.pl span.rch{background:#FEF3C7;color:#92400E;border-color:#FDE68A}
/* detail panel */
.tbar{display:flex;gap:8px;justify-content:flex-end;padding:4px 0 10px}
.pdfb{background:#E0E7FF;color:#3730A3;border:1px solid #A5B4FC;font-weight:800;border-radius:12px;padding:7px 13px;font-size:11.5px}
.editb{background:#FEF3C7;color:#92400E;border:1px solid #FCD34D;font-weight:800;border-radius:12px;padding:7px 13px;font-size:11.5px;transition:transform .15s}
.dsec{font-weight:700;font-size:13px;color:#1a3c6e;border-bottom:2px solid #1a3c6e;padding-bottom:4px;margin:13px 0 8px}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kv div{background:#F8FAFC;border-radius:8px;padding:8px 10px}
.kv label{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:#64748B;font-weight:700;margin-bottom:2px}
.kv b{font-size:12.5px;color:#0F172A;font-weight:600}
.dlist{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.dlist span{background:#F8FAFC;border:1px solid #E2E8F0;border-radius:7px;padding:6px 9px;font-size:11px;color:#475569}
/* numbered overview cards */
.ncs{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.nc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:0 8px 24px rgba(15,23,42,.08);opacity:0}
.nc i{display:block;width:34px;height:34px;border-radius:50%;background:var(--teal2);color:#fff;font-style:normal;font-weight:800;font-size:17px;text-align:center;line-height:34px;margin-bottom:11px}
.nc b{display:block;font-size:19px;color:var(--deep);margin-bottom:6px}
.nc p{margin:0;font-size:14px;color:var(--soft);line-height:1.45}
.kn{position:absolute;left:58px;top:560px;width:1170px;background:#FFFBEB;border:1px solid #FDE68A;border-radius:10px;padding:13px 18px;font-size:15px;color:#78350F;line-height:1.45;opacity:0}
</style></head><body>
<div id="view"><div id="stage"><div id="nbar"><i></i></div>
<div id="scenes"></div>
<div id="spot"></div>
<svg id="cursor" viewBox="0 0 28 32"><path d="M3 2 L3 26 L9.5 19.5 L14 29 L18.5 27 L14 17.5 L23 17.5 Z" fill="#fff" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/></svg>
</div></div>
<div id="cap" aria-live="polite"></div>
<div id="bar">
 <button id="prev">Back</button><button id="play">Start</button><button id="next">Next</button>
 <div id="dots"></div>
 <button id="capbtn" aria-pressed="false">Captions</button><button id="voice" aria-pressed="true">Voice on</button>
</div>
<script>
const DECK_ID='completing-the-event-summary-2026-09';

/* ---------- mock builders: the real screen, drawn in CSS ---------- */
const ESH=(t)=>`<div class="esh"><span class="lg"></span><b>Event Summary: ${t}</b><span class="x">×</span></div>`;
const SDROW=`<div class="sdrow"><span class="sdl">Session Date:</span><span class="sdsel sd">-- All Sessions (aggregate) --</span></div>`;

const ATT=(reg,att,ns,rt)=>`<div class="bb"><div class="stt">Attendance</div>
 <div class="stats"><div class="st b"><b>${reg}</b>Registered</div><div class="st g"><b class="att">${att}</b>Attended</div><div class="st r"><b class="ns">${ns}</b>No-Shows</div><div class="st p"><b class="rt">${rt}</b>Attendance Rate</div></div></div>`;

const TOT_ROWS=[
 {lb:'Dissemination Reach',hl:1,sub:'People reached, not attendees — e.g. Facebook views, booth traffic. Reported separately; never added to Attendance.',src:'source, e.g. FB views',v:'0'},
 {lb:'Attendance Total',v:'14',auto:'14'},
 {lb:'Evaluation Total',ro:'9'},
 {lb:'New Parent Total',v:'3',auto:'3',k:'np'},
 {lb:'Parent (returning)',v:'8',auto:'8'},
 {lb:'Youth with Disability',v:'0',auto:'0'},
 {lb:'Professional/Other',i:'(specify)',spec:'specify…',v:'0',auto:'0'},
 {lb:'Military Active Duty',v:'0',auto:'0'}];
const TOTALS=()=>`<div class="stt" style="color:#075985;border-bottom-color:#BAE6FD">Attendance Totals <span class="nt">(matches pink sheet)</span></div>
 <div class="pt">${TOT_ROWS.map((r,i)=>`<div class="r r${i}${r.hl?' hl':''}">
  <span class="lb">${r.lb}${r.i?` <i>${r.i}</i>`:''}${r.sub?`<small>${r.sub}</small>`:''}</span>
  ${r.src?`<span class="tbx" style="width:150px;white-space:nowrap">${r.src}</span>`:''}${r.spec?`<span class="tbx" style="width:120px">${r.spec}</span>`:''}
  ${r.ro?`<span class="ro">${r.ro}</span><span class="ah">auto</span>`:`<span class="nb${r.k?' k-'+r.k:''}">${r.v}</span>`}
  ${r.auto?`<span class="ah a${i}">Auto: ${r.auto}</span>`:''}</div>`).join('')}</div>`;

const WALK=(added)=>`<div class="wk"><h6>Walk-in / Manual Attendees</h6>
 <p class="hp">For attendees who did not sign up (e.g., Parent Talk Cafe). Each one counts toward the Attendance Total. If you enter a name and email, they are added to Contacts on save.</p>
 <div class="wrow"><span class="tbx nmi">Name</span><span class="tbx emi">Email (optional)</span><span class="addb">Add</span></div>
 <div class="wlist">${added?'<div class="wpill"><b>Kalani Example</b><span>kalani@example.com</span><span class="ok2">✓ contact</span><span style="color:#DC2626">×</span></div>':'No walk-ins added.'}</div></div>`;

const FB=(sent,pend,comp,rate)=>`<div class="bg2"><div class="stt">Feedback Summary</div>
 <div class="stats"><div class="st b"><b class="fs">${sent}</b>Sent</div><div class="st a"><b>${pend}</b>Reminders Pending</div><div class="st g"><b class="fc">${comp}</b>Complete</div><div class="st p"><b class="fr">${rate}</b>Response Rate</div></div></div>`;

const PINKBAN=`<div class="pbn"><i>!</i><div><b>Staff input needed — everything below is filled in by you.</b><br>These are the numbers our audit and grant reporting are built from. Nothing here can be worked out automatically, so if it is left blank, it is simply lost.</div></div>`;
const PINKFORM=`<div class="bp">${PINKBAN}<div class="stt">Staff Report (Pink Form)</div>
 <div class="fg2"><div class="wide"><label>Tier Model of Support</label><span class="fld sel tier">-- Select --</span></div>
 <div><label>Follow Up Support -- Parents</label><span class="fld fup">0</span><div class="fh">Auto from survey: 2</div></div>
 <div><label>Follow Up Support -- Professionals</label><span class="fld fupr">0</span><div class="fh">Auto from survey: 0</div></div></div></div>`;

const MATS=['Agency Brochure','Education &amp; Training Brochure','What is a Learning Disability Brochure','Understanding ADHD Brochure','Flyers'];
const MATTBL=()=>`<div class="stt" style="color:#9D174D;border-bottom-color:#FBCFE8">Training Materials &amp; Instructions</div>
 <p class="cap">Manual entry — materials counts aren’t captured in the feedback survey.</p>
 <div class="fg2"><div class="wide"><label>Presenter</label><span class="fld sel pres">-- Select --</span></div></div>
 <div class="mtw" style="margin-top:10px"><table class="mt"><thead><tr><th>Material name</th><th class="c"># Packed</th><th class="c"># Disseminated</th></tr></thead><tbody>
 ${MATS.map((m,i)=>`<tr><td>${m}</td><td class="c"><span class="nb">${[20,15,10,10,25][i]}</span></td><td class="c"><span class="nb d${i}">${[0,0,0,0,0][i]}</span></td></tr>`).join('')}
 <tr><td><span class="tbx othr" style="width:200px">Other (type a name)</span></td><td class="c"><span class="nb">0</span></td><td class="c"><span class="nb od">0</span></td></tr>
 </tbody></table></div>`;

const EACARDS=[['Parent Talk Cafe','#F97316','#fff','Parent Talk Cafe','2026-09-18 · Oahu',['Attended: 14','Reach: 120','Evals: 9','Tier 2']],
 ['Connect-Gen','#65A30D','#fff','Connect-Gen','2026-09-15 · All Islands Virtual',['Attended: 8','Evals: 6','Tier 1']],
 ['Learning Lab','#0891B2','#fff','Learning Labs','2026-09-11 · Oahu',['Attended: 22','Evals: 17','Tier 3']],
 ['One-Off','#DB2777','#fff','Community Resource Fair','2026-09-09 · Maui',['Attended: 0','Reach: 340','Tier —']],
 ['Screening','#7C3AED','#fff','Lions Vision Screening','2026-09-05 · Oahu',['Attended: 31','Evals: 12','Tier 1']],
 ['Outreach Booth','#92400E','#fff','Keiki Health Day Booth','2026-09-03 · Hawaii Island',['Attended: 0','Reach: 85','Tier —']]];

/* ---------- scenes ---------- */
const SC=[
{cls:'cover',html:()=>`<div class="brand">Leadership in Disabilities &amp; Achievement of Hawaiʻi</div><div class="hello">Aloha <span class="nm"></span></div>
 <h1>Completing the Event Summary</h1><p class="sub">Two ways in. One form. About six minutes.</p>
 <div class="abs cvm" style="left:735px;top:120px;transform:scale(.56) rotate(3deg);transform-origin:top left;animation:bob 5s ease-in-out infinite">
  <div class="esm">${ESH('Parent Talk Cafe')}<div class="esb">${SDROW}${ATT(17,14,3,'82%')}</div></div></div>
 <div class="spark" style="left:1185px;top:110px">${SPARK}</div><div class="spark" style="left:700px;top:455px;animation-delay:1s">${SPARK}</div>
 <div class="gate"><button class="btn" data-go="start">Start training</button><button class="btn ghost" data-go="skip">Skip for now</button><label><input type="checkbox" id="voiceChk" checked> Read it out loud to me</label></div>${WAVES}`,
 steps:[{say:'Aloha {name}! After a session there is one form left to finish: the Event Summary. Two ways in, one form. Most of it fills itself in, and I will show you the part that does not.'}]},

{html:()=>HEAD('Overview','Three steps, every time')+`<div class="abs" style="left:58px;top:150px;width:1170px"><div class="ncs">
 <div class="nc n0"><i>1</i><b>Open the summary</b><p>From your task list on the home page, or from Reports. Both land on the same form.</p></div>
 <div class="nc n1"><i>2</i><b>Fill in the pink</b><p>Tier of support, follow-ups, materials handed out, presenter notes. None of it can be calculated.</p></div>
 <div class="nc n2"><i>3</i><b>Save Summary</b><p>One green button at the bottom. Your name and the time are stamped on it.</p></div></div></div>
 <div class="kn"><b>Worth knowing:</b> the figures marked <b>Auto</b> come from signups and the feedback survey. Type over one if the real count was different — the system keeps both.</div>`,steps:[
 {say:'The form looks long. But most of it is already filled in before you get there.',act:async()=>{for(const n of document.querySelectorAll('.scene.on .nc')){await anim(n,[{opacity:0,transform:'translateY(40px)'},{opacity:1,transform:'none'}],420)}}},
 {say:'You open it, you fill in the pink, and you save. That is the whole job.',act:async()=>{const s=q('.n1');spot(s,8);await wait(1200);spot(null)}},
 {say:'One thing worth knowing up front. The figures marked Auto come from signups and from the feedback survey. If the real count was different, type over it. The system keeps both.',act:async()=>{await anim(q('.kn'),[{opacity:0,transform:'translateY(20px)'},{opacity:1,transform:'none'}],500)}}]},

{html:()=>HEAD('Way one','From your task list')+`<div class="abs" style="left:58px;top:132px;width:700px">
 <div class="band" style="position:relative;left:0;top:0;width:700px;height:86px;padding:16px 20px"><b>Things to do today</b><p>Wednesday, 23 September</p></div>
 <div style="margin-top:14px;display:flex;flex-direction:column;gap:10px">
  <div class="todo oth" style="border-left-color:#0891B2"><span class="ck"></span>
   <div><div class="ttl">Confirm the venue for the October session</div><div class="sub">Open · Phone · follow-up 2026-09-26</div></div>
   <div class="tgs"><span class="pill">THIS WEEK</span></div></div>
  <div class="todo tgt"><span class="ck"></span>
   <div><div class="ttl">Event Summary for: Parent Talk Cafe (Fri 2026-09-18 — Oahu) — attendance and dissemination still needed for the PTI board report</div>
   <div class="sub">Open · Event Wrap-Up · follow-up 2026-09-25</div><span class="oes">Open Event Summary →</span></div>
   <div class="tgs"><span class="pill due">TODAY</span><span class="pill fu">Event Summary</span></div></div>
  <div class="todo oth" style="border-left-color:#0891B2"><span class="ck"></span>
   <div><div class="ttl">Send the Connect-Gen prep materials</div><div class="sub">Open · Email · follow-up 2026-09-29</div></div>
   <div class="tgs"><span class="pill">THIS WEEK</span></div></div>
 </div></div>
 <div class="abs" style="left:800px;top:150px;width:430px"><ul class="pts"><li>Your own to-do list on the home page.</li><li>The task appears after the session, tagged <b>Event Wrap-Up</b>, with a follow-up date.</li><li><b>Open Event Summary</b> opens the form right there.</li></ul></div>`,steps:[
 {say:'The first way in is your own to-do list on the home page. Things to do today.',li:0,act:async()=>{spot(q('.band'),4);await wait(900);spot(null)}},
 {say:'After the session ends, a task appears on its own, in among the rest. It is tagged Event Wrap-Up, and it carries a follow-up date so it does not get forgotten.',li:1,act:async()=>{spot(q('.tgt'),5);await wait(800);spot(q('.tgt .sub'),5);await wait(1500);spot(null)}},
 {say:'Press Open Event Summary, and the form opens right there. You never leave the home page.',li:2,act:async()=>{const b=q('.oes');spot(b,6);place(400,660,0);await move(b,900);await click(b);await wait(500);spot(null);hideCursor()}}]},

{html:()=>HEAD('First thing','Check the session date')+`<div class="abs" style="left:58px;top:126px;transform:scale(.89);transform-origin:top left">
 <div class="esm">${ESH('Parent Talk Cafe')}<div class="esb">${SDROW}${ATT(17,14,3,'82%')}</div></div></div>
 <div class="abs" style="left:800px;top:150px;width:430px"><ul class="pts"><li>One event can run several times — different islands, different days.</li><li><b>Each session gets its own summary.</b></li><li>Check this before you type anything. Every number below it changes with your pick.</li></ul></div>`,steps:[
 {say:'Top of the form: the Session Date.',li:0,act:async()=>{spot(q('.sdrow'),6)}},
 {say:'Some events run more than once. Different islands, different days. Each session gets its own summary, so check this dropdown before you type anything — every number below it changes with what you pick.',li:2,act:async()=>{const s=q('.sd');await move(s,800);await click(s);await type(s,'2026-09-18  Oahu  10:00 AM',28);spot(null);hideCursor()}}]},

{html:()=>HEAD('Read-only','Attendance is already counted')+`<div class="abs" style="left:58px;top:126px;transform:scale(.89);transform-origin:top left">
 <div class="esm">${ESH('Parent Talk Cafe')}<div class="esb">${SDROW}${ATT(17,0,0,'0%')}</div></div></div>
 <div class="abs" style="left:800px;top:150px;width:430px"><ul class="pts"><li>Registered, Attended, No-Shows, and the rate.</li><li>All four read from signups and from who was checked in on the day.</li><li>Looks wrong? The fix is in the <b>signups list</b>, not here.</li></ul></div>`,steps:[
 {say:'Next, the Attendance panel. Registered, attended, no-shows, and the attendance rate.',li:0,act:async()=>{spot(q('.stats'),6);await countTo(q('.att'),14);await countTo(q('.ns'),3);await countTo(q('.rt'),82,'%')}},
 {say:'You do not type any of these. They come straight from signups and from who was ticked in on the day. If one looks wrong, the fix is in the signups list, not here.',li:2,act:async()=>{const s=add('<div class="stamp" style="left:250px;top:300px;font-size:26px">READ ONLY</div>');await anim(s,[{opacity:0,transform:'rotate(-14deg) scale(3)'},{opacity:1,transform:'rotate(-14deg) scale(1)'}],450,'cubic-bezier(.5,0,.8,.6)');await wait(1400);spot(null)}}]},

{html:()=>HEAD('Careful','Attendance Totals — the pink sheet, on screen')+`<div class="abs" style="left:58px;top:124px;width:720px;transform:scale(1.0);transform-origin:top left">
 <div class="bb" style="margin:0">${TOTALS()}</div></div>
 <div class="abs" style="left:800px;top:150px;width:430px"><ul class="pts"><li>Every row: a box you can edit, and the <b>Auto</b> figure beside it.</li><li>The first row is the trap. <b>Dissemination Reach</b> is people <i>reached</i>, not people who came.</li><li>It is reported on its own and <b>never added to attendance</b>.</li></ul></div>`,steps:[
 {say:'Now Attendance Totals. This is the pink paper sheet you already know, on screen.',li:0,act:async()=>{spot(q('.r1'),4);await wait(1100)}},
 {say:'Each row has a box you can type in, and beside it the word Auto with what the system counted. If it matches, leave it alone. If the real count was different, type over it.',li:0,act:async()=>{const b=q('.k-np');spot(b,6);place(420,640,0);await move(b,850);await click();b.classList.add('chk');await type(b,'5',150);const h=q('.a3');h.classList.add('ov');h.textContent='Auto: 3 (override)';const r=add(`<span class="rsb abs" style="left:${pos(h).x+96}px;top:${pos(h).y-2}px">↻ auto</span>`);await pop(r);await wait(700);spot(null);hideCursor()}},
 {say:'But the very first row is not like the others. Dissemination Reach.',li:1,act:async()=>{spot(q('.r0'),5);await wait(1300)}},
 {say:'That is people reached, not people who attended. Facebook views, booth traffic, that sort of thing. It is reported separately and never added to attendance.',li:2,act:async()=>{const s=add('<div class="stamp" style="left:150px;top:150px;font-size:26px">NOT ATTENDANCE!</div>');await anim(s,[{opacity:0,transform:'rotate(-14deg) scale(3)'},{opacity:1,transform:'rotate(-14deg) scale(1)'}],450,'cubic-bezier(.5,0,.8,.6)');
   anim(document.querySelector('.scene.on'),[{transform:'none'},{transform:'translate(-6px,3px)'},{transform:'translate(5px,-2px)'},{transform:'none'}],260,'linear');await wait(1600);spot(null)}}]},

{html:()=>HEAD('Step 2','Walk-ins go here')+`<div class="abs wkw" style="left:58px;top:136px;width:700px;transform:scale(1.04);transform-origin:top left">
 <div class="bb" style="margin:0;padding-top:14px">${WALK(0)}</div></div>
 <div class="abs" style="left:800px;top:150px;width:430px"><ul class="pts"><li>People who never signed up — someone who walked up to the table.</li><li>Each one counts toward the <b>Attendance Total</b>.</li><li>With a name and an email they are added to <b>Contacts</b> on save, so we can follow up.</li></ul></div>`,steps:[
 {say:'At the bottom of the same blue panel: walk-in and manual attendees. This is for people who never signed up — someone who wandered up to the table at Parent Talk Cafe, for example.',li:0,act:async()=>{spot(q('.wk'),6);await wait(1500);spot(null)}},
 {say:'Add a name, an email if you have one, and press Add. Each walk-in counts toward the attendance total, and on save they are added to Contacts so we can follow up later.',li:2,act:async()=>{place(360,640,0);const n=q('.nmi');await move(n,750);await click();await type(n,'Kalani Example',45);const e=q('.emi');await move(e,650);await click();await type(e,'kalani@example.com',30);
   const a=q('.addb');await move(a,650);await click(a);q('.wkw').querySelector('.bb').innerHTML=WALK(1);await pop(q('.wpill'));hideCursor()}}]},

{html:()=>HEAD('Read-only','Feedback Summary is a status report')+`<div class="abs" style="left:58px;top:146px;width:700px;transform:scale(1.04);transform-origin:top left">${FB(0,0,0,'0%')}</div>
 <div class="abs" style="left:800px;top:150px;width:430px"><ul class="pts"><li>Sent, reminders pending, complete, and the response rate.</li><li>It updates itself as people respond.</li><li>Nothing to edit here either.</li></ul></div>`,steps:[
 {say:'Keep scrolling and you reach the Feedback Summary. How many surveys went out, how many reminders are still pending, how many came back, and the response rate.',li:0,act:async()=>{spot(q('.stats'),6);await countTo(q('.fs'),17);await countTo(q('.fc'),9);await countTo(q('.fr'),53,'%')}},
 {say:'This one is a status report. It updates itself as people respond, so there is nothing for you to edit.',li:2,act:async()=>{await wait(700);spot(null)}}]},

{html:()=>HEAD('The important part','The pink form is yours')+`<div class="abs" style="left:58px;top:128px;width:700px;transform:scale(1.04);transform-origin:top left">${PINKFORM}</div>
 <div class="abs" style="left:800px;top:150px;width:430px"><ul class="pts"><li>The banner says it plainly: <b>everything below is filled in by you</b>.</li><li>Set the <b>Tier Model of Support</b> for the session.</li><li>Then the two follow-up counts — parents, and professionals.</li><li><b>Blank means lost.</b></li></ul></div>`,steps:[
 {say:'Now the part that matters most. The pink banner says it plainly: everything below is filled in by you.',li:0,act:async()=>{spot(q('.pbn'),6);await wait(1600);spot(null)}},
 {say:'Set the Tier Model of Support for this session.',li:1,act:async()=>{const t=q('.tier');place(400,640,0);await move(t,850);await click(t);await type(t,'Tier 2 — Targeted Support',36)}},
 {say:'Then the two follow-up counts. Parents, and professionals. Each one shows what the survey picked up underneath, but the real number is the one you know.',li:2,act:async()=>{const a=q('.fup');await move(a,700);await click();await type(a,'4',140);const b=q('.fupr');await move(b,650);await click();await type(b,'1',140);hideCursor()}},
 {say:'These are the numbers our audit and our grant reporting are built from, and nothing here can be worked out automatically. If this section is left blank, that information is simply lost.',li:3,act:async()=>{const s=add('<div class="stamp" style="left:430px;top:120px;font-size:24px">BLANK = LOST</div>');await anim(s,[{opacity:0,transform:'rotate(-14deg) scale(3)'},{opacity:1,transform:'rotate(-14deg) scale(1)'}],450,'cubic-bezier(.5,0,.8,.6)');await wait(1500)}}]},

{html:()=>HEAD('Step 4','Materials: packed, and handed out')+`<div class="abs" style="left:58px;top:124px;width:700px;transform:scale(1.04);transform-origin:top left">
 <div class="bp" style="margin:0">${MATTBL()}</div></div>
 <div class="abs" style="left:800px;top:150px;width:430px"><ul class="pts"><li>Confirm the <b>presenter</b> — it should already be right, but check it.</li><li>How many you <b>packed</b>, and how many you actually <b>handed out</b>.</li><li>The <b>disseminated</b> counts are the ones that report.</li><li>The last row is blank on purpose.</li></ul></div>`,steps:[
 {say:'Below that, Training Materials and Instructions. First, confirm the presenter in the dropdown. It should already be right, but check it.',li:0,act:async()=>{const p=q('.pres');spot(p,5);place(400,640,0);await move(p,850);await click(p);await type(p,'Mele Sample',40);spot(null)}},
 {say:'Then the materials table. How many of each item you packed, and how many you actually handed out.',li:1,act:async()=>{for(const [s,v] of [['.d0','12'],['.d1','9'],['.d4','20']]){const e=q(s);await move(e,520);await click();e.classList.add('chk');await type(e,v,110)}}},
 {say:'The counts that matter for reporting are the disseminated ones. And the last row is blank on purpose — type in anything you gave out that is not on the list.',li:3,act:async()=>{const o=q('.othr');await move(o,700);await click();await type(o,'SPIN resource packet',35);const d=q('.od');await move(d,550);await click();d.classList.add('chk');await type(d,'6',120);hideCursor()}}]},

{html:()=>HEAD('Step 5','Comments, then save')+`<div class="abs" style="left:58px;top:130px;width:700px;transform:scale(1.04);transform-origin:top left">
 <div class="bp" style="margin:0"><div class="stt">Presenter Comments / Concerns</div>
  <div class="txa cmt">Notes from the presenter about the session...</div>
  <div class="savedby">Last saved by <b>—</b></div>
  <div class="acts"><span class="savebtn sv">Save Summary</span><span class="ghostb">Send No-Show Re-invites</span><span class="ghostb">Export CSV</span></div></div></div>
 <div class="abs" style="left:800px;top:150px;width:430px"><ul class="pts"><li>Anything worth remembering about how it went.</li><li><b>Save Summary</b> — the green one.</li><li>The line above it records <b>who saved it and when</b>.</li><li><b>Export CSV</b> pulls the numbers into a spreadsheet.</li></ul></div>`,steps:[
 {say:'Last, the Presenter Comments box. Anything worth remembering about how the session went — turnout, questions that came up, a problem with the room.',li:0,act:async()=>{const c=q('.cmt');place(400,650,0);await move(c,850);await click();await type(c,'Strong turnout. Two families asked about IEP timelines — follow-up booked.',22)}},
 {say:'Then press Save Summary, the green one.',li:1,act:async()=>{const s=q('.sv');spot(s,6);await move(s,800);await click(s);s.textContent='Saved ✓';confetti(pos(s).x+70,pos(s).y,90);q('.savedby').innerHTML='Last saved by <b>you</b> on 23 Sep 2026, 9:14 AM';await anim(q('.savedby'),[{opacity:0},{opacity:1}],500);hideCursor();spot(null)}},
 {say:'The line just above it records who saved it and when, so we always know the summary is current. And Export CSV beside it pulls the numbers out if you need them in a spreadsheet.',li:3,act:async()=>{spot(q('.savedby'),5);await wait(1500);spot(null)}}]},

{html:()=>HEAD('Way two','Through Reports')+`<div class="abs" style="left:58px;top:120px;width:1170px">
 <div class="crumb">Left menu → <b>Reports</b> → <b>Event Attendance Report</b></div>
 <div class="fbar"><div><label>SEARCH</label><div class="fin">Title, presenter, topic</div></div>
  <div><label>YEAR</label><div class="fin sel">All</div></div>
  <div><label>PROGRAM</label><div class="fin sel">Programs &amp; Events</div></div>
  <div><label>TIER</label><div class="fin sel">All</div></div>
  <div><label>FROM</label><div class="fin">mm/dd/yyyy</div></div>
  <div><label>TO</label><div class="fin">mm/dd/yyyy</div></div></div>
 <div class="eag">${EACARDS.map(([ty,bg,fg,t,s,pills],i)=>`<div class="ea e${i}" style="border-left:4px solid ${bg}">
  <span class="chip" style="background:${bg};color:${fg}">${ty}</span><div class="t">${t}</div><div class="s">${s}</div>
  <div class="pl">${pills.map(p=>`<span class="${p.startsWith('Reach')?'rch':''}">${p}</span>`).join('')}</div></div>`).join('')}</div></div>`,steps:[
 {say:'That is the first way in. Here is the second, and it is the one to use when the task has already been ticked off, or when you are looking at an older event.',act:async()=>{spot(q('.crumb'),6);await wait(1400);spot(null)}},
 {say:'On the left menu, click Reports, then Event Attendance Report. Every event date we have run shows up as a card, colour-coded by programme.',act:async()=>{for(const c of document.querySelectorAll('.scene.on .ea')){await anim(c,[{opacity:0,transform:'translateY(36px)'},{opacity:1,transform:'none'}],400)}}},
 {say:'And the filters across the top let you narrow it down by year, by programme, by tier, or by date range.',act:async()=>{spot(q('.fbar'),6);await wait(1600);spot(null)}}]},

{html:()=>HEAD('Way two','Open the card, then Edit Summary')+`<div class="abs" style="left:150px;top:122px;transform:scale(.88);transform-origin:top left">
 <div class="esm"><div class="esh"><span class="lg"></span><b>Parent Talk Cafe — Fri 2026-09-18 (Oahu)</b><span class="x">×</span></div>
 <div class="esb"><div class="tbar"><span class="pdfb">Print / Save as PDF</span><span class="editb eb">Edit Summary</span></div>
  <div class="dsec">Event Details</div>
  <div class="kv"><div><label>Date</label><b>2026-09-18</b></div><div><label>Topic</label><b>Parent Talk Cafe</b></div><div><label>Presenter</label><b>Mele Sample</b></div><div><label>Location</label><b>Oahu</b></div></div>
  <div class="dsec">Attendance Totals</div>
  <div class="pt"><div class="r hl"><span class="lb">Dissemination Reach</span><span class="ro">120</span></div><div class="r"><span class="lb">Attendance Total</span><span class="ro">14</span></div><div class="r"><span class="lb">Evaluation Total</span><span class="ro">9</span></div></div>
  <div class="dsec">Follow Up Support</div><div class="dlist"><span>Parents — 4</span><span>Professionals — 1</span><span>Tier 2</span></div>
  <div class="dsec">Age of Children</div><div class="dlist"><span>0–5 — 2</span><span>6–12 — 7</span><span>13–18 — 5</span></div></div></div></div>`,steps:[
 {say:'Click the card for the event date you want. A detail panel opens — event details, the attendance totals, follow-up support, age of children. It is a read-only view of what has been recorded so far.',act:async()=>{const s=add('<div class="stamp" style="left:780px;top:300px;font-size:24px">READ ONLY</div>');await anim(s,[{opacity:0,transform:'rotate(-14deg) scale(3)'},{opacity:1,transform:'rotate(-14deg) scale(1)'}],450,'cubic-bezier(.5,0,.8,.6)');await wait(1600)}},
 {say:'To change anything, press Edit Summary in the top corner. That opens the very same form we just filled in. And Print or Save as PDF beside it gives you a clean copy for a binder or a funder.',act:async()=>{const b=q('.eb');spot(b,6);place(500,660,0);await move(b,900);await click(b);await wait(400);spot(q('.pdfb'),6);await wait(1300);spot(null);hideCursor()}}]},

{html:()=>HEAD('Recap','Your event summary checklist')+`<div class="cl">${[
 '<b>Two doors, one form</b> — your task list right after, or Reports any time',
 '<b>Session date first.</b> Every number below it changes with your pick',
 'Leave the <b>Auto</b> figures alone unless the real count was different',
 '<b>Dissemination Reach is not attendance</b> — it reports on its own',
 'Add <b>walk-ins</b> so they are counted, and kept in Contacts',
 'The <b>pink form is yours</b> — tier, follow-ups, materials, comments',
 '<b>Save Summary.</b> If you did not save it, it did not happen'].map(t=>`<div class="ci"><div class="bx"><svg viewBox="0 0 26 26"><path d="M5 13 L11 19 L21 7"/></svg></div><span>${t}</span></div>`).join('')}</div>`,steps:[
 {say:'Let’s recap.',act:async()=>{for(const c of document.querySelectorAll('.scene.on .ci')){c.classList.add('on');await wait(150)}}},
 ...['Two doors, one form.','Check the session date before anything else.','Leave the auto figures alone unless you know better.','Dissemination Reach is not attendance.','Add your walk-ins.','The pink section is the part only you can complete.','And save it. If you did not save it, it did not happen.']
  .map((s,i)=>({say:s,act:async()=>{const cs=document.querySelectorAll('.scene.on .ci');cs.forEach((c,j)=>{c.classList.add('on');if(j<i)c.classList.add('done')});await wait(620);cs[i].classList.add('done')}}))]},

{cls:'cover',html:()=>`<div class="brand">Completing the Event Summary</div><div class="hello">All done</div><h1>Mahalo<span class="nmc"></span>!</h1><p class="sub">Two doors, one form. Fill in the pink, and save it. Come back and watch it again any time.</p>
 <div class="abs cvm" style="left:760px;top:150px;transform:scale(.62) rotate(3deg);transform-origin:top left;animation:bob 5s ease-in-out infinite">
  <div class="esm" style="width:700px">${PINKFORM}</div></div>
 <div class="gate" style="top:460px"><button class="btn ghost" data-go="again">Watch again</button><button class="btn" data-go="close">Close</button></div>${WAVES}`,
 steps:[{say:'Mahalo {name}! Two doors, one form. Fill in the pink, and save it. You’ve got it.',act:async()=>{await wait(400);confetti(640,300,140)}}]}
];
