<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The DATA Cleanup Report — Training</title>
<link rel="stylesheet" href="deck-base.css">
<!-- Same Firebase build as the dashboard, so the deck shares its sign-in and records progress. -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
/* Every class here starts with dc- so nothing collides with deck-base.css. */
.dc-win{position:absolute;left:58px;top:118px;width:712px;height:570px;background:#F4F6F9;border:1px solid #D5DEE8;border-radius:12px;overflow:hidden;box-shadow:0 14px 36px rgba(15,23,42,.16);z-index:4;font-family:"Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:#1E293B}
.dc-in{position:relative;padding:10px 12px}
.dc-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.dc-back{font-size:11px;font-weight:700;color:#475569;border:1px solid #CBD5E1;border-radius:6px;padding:4px 8px;background:#fff;white-space:nowrap}
.dc-top h3{margin:0;flex:1;font-size:19px;color:#15803D;font-weight:800}
.dc-hint{font-size:10px;color:#64748B}
.dc-card{background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(15,40,70,.08)}
.dc-bar{padding:8px 10px;margin-bottom:8px}
.dc-row1{display:flex;gap:8px;align-items:center}
.dc-search{flex:1;font-size:10.5px;color:#94A3B8;border:1px solid #CBD5E1;border-radius:6px;padding:5px 8px;background:#fff}
.dc-seg{display:flex}
.dc-seg span{font-size:10px;font-weight:700;padding:4px 7px;border:1px solid #CBD5E1;margin-left:-1px;background:#fff;color:#334155;white-space:nowrap;transition:background .3s,color .3s}
.dc-seg span:first-child{border-radius:6px 0 0 6px;margin-left:0}.dc-seg span:last-child{border-radius:0 6px 6px 0}
.dc-seg span.on{background:#0F766E;border-color:#0F766E;color:#fff}
.dc-prog{font-size:10px;font-weight:700;border:1px solid #CBD5E1;border-radius:6px;padding:4px 16px 4px 7px;background:#fff;position:relative}
.dc-prog::after{content:"▾";position:absolute;right:5px;top:3px;color:#64748B}
.dc-pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.dc-pill{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:700;border:1px solid #E2E8F0;background:#F8FAFC;border-radius:999px;padding:3px 8px;color:#334155;transition:background .3s,color .3s}
.dc-pill i{width:7px;height:7px;border-radius:50%;display:inline-block}
.dc-pill small{font-weight:600;opacity:.7;font-size:9px}
.dc-grid{display:grid;grid-template-columns:1fr 238px;gap:8px}
.dc-list{height:432px;overflow:hidden;position:relative}
.dc-head{font-size:9.5px;color:#475569;margin:0 0 4px 2px;display:flex;justify-content:space-between}
.dc-head .dk{display:inline-block;width:13px;height:9px;border:1.5px dashed #15803D;border-radius:2px;vertical-align:middle;margin-right:3px}
.dc-r{display:grid;grid-template-columns:58px 1fr auto;gap:6px;align-items:center;background:#fff;border:2px solid transparent;border-radius:8px;padding:5px 7px;margin-bottom:4px;box-shadow:0 1px 2px rgba(15,23,42,.06);transition:border-color .3s,background .3s,opacity .3s}
.dc-r.sel{border-color:#0F766E;background:#F0FDFA}
.dc-d{font-size:9px;color:#64748B;font-weight:700}
.dc-t{font-size:11px;font-weight:800;line-height:1.2}
.dc-m{font-size:9px;color:#64748B;margin-top:1px}
.dc-ty{display:inline-block;color:#fff;border-radius:999px;padding:0 6px;font-size:8.5px;font-weight:800;margin-right:4px}
.dc-none{font-size:8.5px;color:#94A3B8;margin-top:1px}
.dc-chips{display:flex;gap:3px;margin-top:2px}
.dc-chip{background:#E0F2FE;color:#075985;border-radius:4px;padding:0 5px;font-size:8.5px;font-weight:800}
.dc-tb{display:flex;gap:2px}
.dc-tb span{min-width:22px;text-align:center;padding:3px 3px;border:1px solid #CBD5E1;border-radius:5px;font-size:9.5px;font-weight:800;color:#475569;background:#fff;transition:all .25s}
.dc-tb span.auto{border:1.5px dashed currentColor}
.dc-right{padding:9px 10px;height:418px;position:relative}
.dc-step{font-weight:800;color:#0F766E;font-size:10.5px;margin:8px 0 4px}
.dc-big{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.dc-big span{border:1px solid #CBD5E1;border-radius:6px;padding:4px 6px;font-size:10.5px;font-weight:800;color:#475569;background:#fff;transition:all .25s}
.dc-big span small{display:block;font-size:8px;font-weight:600;opacity:.85}
.dc-big span.auto{border:1.5px dashed currentColor}
.dc-ms{display:flex;flex-direction:column;gap:2px}
.dc-ms span{display:flex;align-items:center;gap:5px;border:1px solid #E2E8F0;border-radius:5px;padding:2px 6px;font-size:9px;color:#334155;background:#fff;transition:all .25s}
.dc-ms span b{min-width:24px;color:#0F172A}
.dc-ms span i{width:10px;height:10px;border:1.5px solid #94A3B8;border-radius:2px;flex:none;font-style:normal;font-size:8px;line-height:9px;text-align:center}
.dc-ms span.on{background:#0F766E;border-color:#0F766E;color:#fff}.dc-ms span.on b{color:#fff}.dc-ms span.on i{border-color:#fff}
.dc-ms span em{margin-left:auto;font-style:normal;font-weight:800}
.dc-nav{display:flex;justify-content:space-between;align-items:center;margin-top:7px}
.dc-nav span{font-size:9.5px;font-weight:700;border-radius:5px;padding:3px 8px}
.dc-prev{border:1px solid #CBD5E1;background:#fff;color:#334155}.dc-next{background:#0F766E;color:#fff}
.dc-ok{font-size:9.5px;font-weight:800;color:#15803D}
.dc-sel-h .dc-t{font-size:12px}
/* Reports grid */
.dc-side{position:absolute;left:0;top:0;bottom:0;width:150px;background:#fff;border-right:1px solid #E2E8F0;padding:14px 10px}
.dc-side div{font-size:12.5px;padding:6px 9px;border-radius:6px;color:#334155;margin-bottom:2px}
.dc-side div.act{background:#E0F2FE;color:#0E6E8C;font-weight:700}
.dc-rg{position:absolute;left:150px;right:0;top:0;bottom:0;padding:16px}
.dc-rg h4{margin:0 0 10px;font-size:19px}
.dc-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dc-tile{background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(15,40,70,.08);padding:12px;border:2px solid transparent;height:104px}
.dc-tile b{display:block;font-size:13px;margin-bottom:3px}
.dc-tile span{font-size:10.5px;color:#64748B;line-height:1.35;display:block}
.dc-tile i{display:block;width:22px;height:22px;border-radius:6px;background:#E0F2FE;margin-bottom:6px}
.dc-tile.me{border-color:#15803D}.dc-tile.me i{background:#DCFCE7}
.dc-note{position:absolute;background:#FEF3C7;border-left:6px solid #F59E0B;border-radius:12px;padding:11px 16px;font-size:17px;line-height:1.4;color:#0F172A;opacity:0}
.dc-note.gr{background:#ECFDF5;border-left-color:#16A34A}
.dc-cvw{position:absolute;left:800px;top:120px;width:400px;background:#fff;border-radius:14px;box-shadow:0 24px 50px rgba(0,0,0,.35);padding:12px 14px;color:#1E293B;transform:rotate(3deg);animation:bob 6s ease-in-out infinite;z-index:3}
.dc-cvs{position:absolute;left:880px;top:430px;width:280px;background:#fff;border-radius:12px;box-shadow:0 20px 40px rgba(0,0,0,.3);padding:12px 14px;color:#1E293B;transform:rotate(-4deg);animation:bob 5s 1s ease-in-out infinite;z-index:4}
/* ---------- quiz (qz- prefix) ---------- */
.scene.quiz{background:linear-gradient(135deg,#FFF1F8,#E0F7FA)}
.qz-wrap{position:absolute;left:0;top:0;right:0;bottom:0}
.qz-intro{position:absolute;left:120px;top:190px;width:1040px;text-align:center;font-size:30px;font-weight:800;color:#0B3A53;line-height:1.35;animation:rise .5s both}
.qz-intro small{display:block;font-size:20px;color:#475569;font-weight:700;margin-top:14px}
.qz-card{position:absolute;left:120px;top:138px;width:1040px;background:#fff;border-radius:20px;box-shadow:0 18px 40px rgba(15,23,42,.14);padding:22px 30px;animation:rise .5s both}
.qz-n{font-size:14px;font-weight:900;color:var(--pink);letter-spacing:.08em;text-transform:uppercase}
.qz-q{font-size:27px;font-weight:800;line-height:1.25;margin:6px 0 16px}
.qz-o{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;font-size:21px;font-weight:700;background:#F8FAFC;border:3px solid #E2E8F0;border-radius:14px;padding:11px 16px;margin-bottom:10px;cursor:pointer;transition:border-color .2s,background .2s;color:var(--ink)}
.qz-o:hover:not([disabled]){border-color:#0891B2;background:#F0F9FF}
.qz-o[disabled]{cursor:default}
.qz-o .qz-L{width:38px;height:38px;border-radius:50%;background:#0E7490;color:#fff;display:flex;align-items:center;justify-content:center;flex:none;font-weight:900}
.qz-o.qz-no{border-color:#DC2626;background:#FEF2F2;animation:qzshake .4s}.qz-o.qz-no .qz-L{background:#DC2626}
.qz-o.qz-yes{border-color:#16A34A;background:#F0FDF4}.qz-o.qz-yes .qz-L{background:#16A34A}
.qz-fb{min-height:30px;font-size:19px;font-weight:700;margin-top:4px}.qz-fb.good{color:#15803D}.qz-fb.bad{color:#B91C1C}
.qz-stars{position:absolute;right:60px;top:46px;display:flex;gap:8px}
.qz-stars i{width:36px;height:36px;background:#E2E8F0;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);transition:background .3s}
.qz-stars i.on{background:#F59E0B;animation:popn .6s}
@keyframes qzshake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
</style></head><body>
<div id="view"><div id="stage"><div id="nbar"><i></i></div>
<div id="scenes"></div>
<div id="spot"></div>
<svg id="cursor" viewBox="0 0 28 32"><path d="M3 2 L3 26 L9.5 19.5 L14 29 L18.5 27 L14 17.5 L23 17.5 Z" fill="#fff" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/></svg>
</div></div>
<div id="cap" aria-live="polite"></div>
<div id="bar">
 <button id="prev">Back</button><button id="play">Start</button><button id="next">Next</button>
 <div id="dots"></div>
 <button id="capbtn" aria-pressed="false">Captions</button><button id="voice" aria-pressed="true">Voice on</button>
</div>
<script>
const DECK_ID='data-cleanup-report';

/* Every screen below is drawn in HTML/CSS from DAN's DATA Cleanup Report
   (index.html v153.95, 2026-10-29). Every title, figure and name is made up. */

const tap=async(s,ms=850)=>{const e=typeof s==='string'?q(s):s;await move(e,ms);await click(e);return e};
function all(s){return[...document.querySelectorAll('.scene.on '+s)]}
const show=(e,ms=500)=>anim(e,[{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],ms,'ease-out').then(()=>{e.style.opacity=1});
const PTS=(items,top=140)=>`<div class="abs" style="left:790px;top:${top}px;width:440px"><ul class="pts">${items.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;

/* Type colours, the same as DAN's event cards. */
const TC={'Connect-Gen':'#16A34A','Learning Labs':'#0891B2','Parent Talk Cafe':'#F97316','Outreach Booth':'#92400E','One-off gathering':'#DB2777','Screening':'#7C3AED','Interaction':'#475569'};
const TIER={1:'#B45309',2:'#0891B2',3:'#7C3AED',4:'#15803D'};
const TN={1:'Individual Assistance',2:'Training Workspaces',3:'Workshops',4:'Outreach'};
const M524=[['1.a','Co-sponsored event'],['1.b','Co-presentation'],['1.c','Materials at a collaborative event'],['2.a','IDEA / IEP / rights workshop'],['2.b','Transition workshop'],['2.c','Workshop materials'],['3.a','Connect-Gen / Learning Lab / SMART'],['3.b','Parent Talk Cafe'],['3.c','Tips and Tools'],['6.a','Workshop for professionals'],['6.b','Rights information to professionals'],['Y1.a','Youth conference'],['Y1.b','Youth materials: college, career'],['Y2.a','Skillz Lab']];
/* rows: [date, title, type, place, tier saved, tier auto, measures] */
const ROWS=[
 ['Oct 22, 2026','Learning Labs: IEP Basics','Learning Labs','Virtual',0,2,[]],
 ['Oct 18, 2026','Keiki Fun Fair','Outreach Booth','Hilo',2,0,['1.b','2.c']],
 ['Oct 15, 2026','Connect-Gen','Connect-Gen','Kona',0,2,[]],
 ['Oct 14, 2026','Parent Talk Cafe: Siblings','Parent Talk Cafe','Facebook',2,0,['3.b']],
 ['Oct 9, 2026','Family Resource Night','One-off gathering','Kaneohe',0,0,[]],
 ['Oct 6, 2026','Sample Parent','Interaction','Booth visit, packet given',4,0,[]],
 ['Oct 2, 2026','Hearing Screening Day','Screening','Waianae',4,0,['1.a']],
 ['Sep 30, 2026','Connect-Gen','Connect-Gen','Oahu',2,0,['3.a']]];
const rowH=(r,i)=>{const sv=r[4],au=r[5],sh=sv||au;
 return `<div class="dc-r k-r${i}" style="border-left:5px solid ${TC[r[2]]}"><div class="dc-d">${r[0]}</div><div><div class="dc-t">${r[1]}</div><div class="dc-m"><span class="dc-ty" style="background:${TC[r[2]]}">${r[2]}</span>${r[3]}</div>${r[6].length?`<div class="dc-chips k-ch${i}">${r[6].map(m=>`<span class="dc-chip">${m}</span>`).join('')}</div>`:`<div class="dc-none k-ch${i}">No measure ticked</div>`}</div>
 <div class="dc-tb k-tb${i}">${[1,2,3,4].map(t=>`<span data-t="${t}"${sh===t?(sv?` style="background:${TIER[t]};border-color:${TIER[t]};color:#fff"`:` class="auto" style="color:${TIER[t]}"`):''}>T${t}</span>`).join('')}</div></div>`};
const BAR=(k)=>`<div class="dc-card dc-bar"><div class="dc-row1"><div class="dc-search">Search title, place or date</div><div class="dc-seg k-tseg"><span class="on">All tiers</span><span>T1</span><span>T2</span><span>T3</span><span>T4</span><span class="k-not">No tier (31)</span></div><span class="dc-prog">LDAH</span></div>
 <div class="dc-pills">${[['Everything',570,'#0F172A'],['One-off gathering',173],['Connect-Gen',58],['Flyer',22,'#F59E0B'],['Learning Labs',18],['Outreach Booth',9],['Parent Talk Cafe',6],['Tier 4 interactions',270,'#475569']].map(p=>{const c=p[2]||TC[p[0]];const on=(k||'Everything')===p[0];
  return `<span class="dc-pill k-p-${p[0].replace(/\W/g,'')}"${on?` style="background:${c};border-color:${c};color:#fff"`:''}>${p[0]==='Everything'?'':`<i style="background:${on?'#fff':c}"></i>`}${p[0]} <small>${p[1]}</small></span>`}).join('')}</div></div>`;
const RIGHT0=()=>`<div class="dc-card dc-right k-right"><div class="dc-step" style="margin-top:0">524B measures</div><div style="font-size:9px;color:#64748B;margin-bottom:5px;line-height:1.35">Click an entry on the left to change it here. Or click a measure to list only the entries ticked with it.</div>
 <div class="dc-ms">${M524.slice(0,10).map((m,i)=>`<span><b>${m[0]}</b>${m[1]}<em>${[0,1,0,1,0,1,1,3,0,1][i]}</em></span>`).join('')}<span class="k-nothing"><b>—</b>Nothing ticked yet<em>568</em></span></div></div>`;
const RIGHT1=(i)=>{const r=ROWS[i];const sh=r[4]||r[5];return `<div class="dc-card dc-right k-right"><div class="dc-sel-h"><div class="dc-d">${r[0]} <span class="dc-ty" style="background:${TC[r[2]]}">${r[2]}</span></div><div class="dc-t">${r[1]}</div><div class="dc-m">${r[3]}</div></div>
 <div class="dc-step">1. Tier</div><div class="dc-big k-big">${[1,2,3,4].map(t=>`<span data-t="${t}"${sh===t?(r[4]?` style="background:${TIER[t]};border-color:${TIER[t]};color:#fff"`:` class="auto" style="color:${TIER[t]}"`):''}>Tier ${t}<small>${TN[t]}</small></span>`).join('')}</div>
 <div class="dc-step">2. 524B measures <span style="font-weight:500;color:#64748B">click to tick</span></div>
 <div class="dc-ms k-ms">${M524.slice(0,11).map(m=>`<span data-m="${m[0]}"${r[6].includes(m[0])?' class="on"':''}><i>${r[6].includes(m[0])?'✓':''}</i><b>${m[0]}</b>${m[1]}</span>`).join('')}</div>
 <div class="dc-nav"><span class="dc-prev">← Previous</span><span class="dc-ok k-ok"></span><span class="dc-next k-next">Next →</span></div></div>`};
const WIN=(o={})=>`<div class="dc-win"><div class="dc-in"><div class="dc-top"><span class="dc-back">← Back to Reports</span><h3>DATA Cleanup Report</h3><span class="dc-hint">Every click saves straight away.</span></div>${BAR(o.k)}
 <div class="dc-grid"><div class="dc-list"><div class="dc-head"><span>${o.count||'570 of 570 entries'}</span><span><span class="dk"></span>dashed = not saved, from the type</span></div><div class="k-rows">${(o.rows||ROWS).map((r,i)=>rowH(r,o.idx?o.idx[i]:i)).join('')}</div></div>${o.sel!=null?RIGHT1(o.sel):RIGHT0()}</div></div></div>`;

/* set a tier on a drawn row (and the big buttons if that row is selected) */
function paintTier(box,t,saved){[...box.children].forEach(s=>{const n=+s.dataset.t;s.className='';s.removeAttribute('style');if(n===t){if(saved)s.style.cssText=`background:${TIER[n]};border-color:${TIER[n]};color:#fff`;else{s.className='auto';s.style.color=TIER[n]}}})}
function okMsg(t){const o=q('.k-ok');if(o){o.textContent=t;anim(o,[{opacity:0},{opacity:1}],300)}}

const TILES=[['Event Attendance','Every event, its signups and who came.'],['PTI Report','The reporting-period board document.'],['Screenings','Every screening and its results.'],['Participation','Who took part, by person.'],['Feedback','Every evaluation response.'],['DATA Cleanup Report','Every event and Tier 4 interaction. Fix the tier and tick the 524B measures.']];
const REPORTS=()=>`<div class="dc-win"><div class="dc-side"><div>Home</div><div>Interactions</div><div>Contacts</div><div class="act">Reports</div><div>Training Videos</div></div>
 <div class="dc-rg"><h4>Reports</h4><div class="dc-tiles">${TILES.map(t=>`<div class="dc-tile${t[0]==='DATA Cleanup Report'?' me k-tile':''}"><i></i><b>${t[0]}</b><span>${t[1]}</span></div>`).join('')}</div></div></div>`;

/* ---- quiz: the standard ask()/QUIZ pair. Each answer goes to ldahTrack.quiz(sec,i,correct). ---- */
window.QUIZ_TOTAL=3;
function ask(Q,i,sec){const w=q('.qz-wrap');
 w.innerHTML=`<div class="qz-card"><div class="qz-n">Question ${i+1} of 3</div><div class="qz-q">${Q.q}</div>${Q.o.map((o,j)=>`<button class="qz-o" data-j="${j}"><span class="qz-L">${'ABC'[j]}</span><span>${o}</span></button>`).join('')}<div class="qz-fb"></div></div>`;
 const card=w.firstChild,fb=card.querySelector('.qz-fb'),btns=[...card.querySelectorAll('.qz-o')];
 const finish=()=>{btns.forEach(b=>b.disabled=true);btns[Q.a].classList.add('qz-yes');const st=document.querySelectorAll('.scene.on .qz-stars i')[i];if(st)st.classList.add('on');fb.className='qz-fb good';fb.textContent='Yes! '+Q.y};
 if(FAST){finish();return Promise.resolve()}
 return new Promise(res=>{btns.forEach((b,j)=>b.onclick=async()=>{
  if(b.disabled)return;
  if(window.ldahTrack)ldahTrack.quiz(sec,i,j===Q.a);
  if(j===Q.a){finish();const p=pos(b);confetti(p.x+60,p.y+20,70);await speak('Yes! '+Q.y,run);await wait(700);res()}
  else{b.disabled=true;b.classList.add('qz-no');fb.className='qz-fb bad';fb.textContent='Not quite. '+Q.n+' Try again.';speak('Not quite. '+Q.n+' Try again.',run)}})})}
const QUIZ=(sec,qs)=>({cls:'quiz',html:()=>HEAD('Quick check','Your turn!')+`<div class="qz-stars">${qs.map(()=>'<i></i>').join('')}</div><div class="qz-wrap"><div class="qz-intro">Three quick questions.<small>Your first answer to each one counts. Click the answer you think is right.</small></div></div>`,
 steps:[{say:'Quick check. Three quick questions. Your first answer to each one counts.'},
  ...qs.map((Q,i)=>({say:`Question ${i+1}. ${Q.q}`,act:()=>ask(Q,i,sec)}))]});

const SC=[
// ================= COVER =================
{cls:'cover',html:()=>`<div class="ldah-logo" style="position:absolute;left:70px;top:22px;background:#fff;border-radius:14px;padding:6px 10px;box-shadow:0 4px 14px rgba(0,0,0,.18);animation:rise .6s both"><img src="../logo_blue.png" alt="LDAH" style="height:80px;display:block"></div><div class="brand">Leadership in Disabilities &amp; Achievement of Hawaiʻi · Reports</div><div class="hello">Aloha <span class="nm"></span></div>
 <h1>The DATA Cleanup Report</h1><p class="sub" style="top:390px">Put every event and Tier 4 interaction on the right tier, and tick its 524B measures. One click each. About four minutes.</p>
 <div class="dc-cvw">${rowH(ROWS[1],91)}${rowH(ROWS[0],92)}${rowH(ROWS[3],93)}</div>
 <div class="dc-cvs"><div class="dc-ms">${M524.slice(0,4).map((m,i)=>`<span${i===1?' class="on"':''}><i>${i===1?'✓':''}</i><b>${m[0]}</b>${m[1]}</span>`).join('')}</div></div>
