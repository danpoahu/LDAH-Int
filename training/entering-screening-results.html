<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entering Screening Results — Training</title>
<link rel="stylesheet" href="deck-base.css">
<!-- Same Firebase build as the dashboard, so the deck shares its sign-in and records progress. -->

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<style>
/* Every class here starts with ser- so nothing collides with deck-base.css. */
/* ---------- section cover + road map ---------- */
.sect .brand{left:290px;top:150px}
.sect h1{left:290px;top:185px;width:900px;font-size:58px}
.sect .sub{left:290px;top:330px;width:860px}
.ser-bign{position:absolute;left:80px;top:150px;width:170px;height:170px;border-radius:50%;background:#F9A8D4;color:#0B3A53;font-size:100px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:popn .9s .2s both}
.ser-road{position:absolute;left:80px;width:1120px;top:440px;display:flex;justify-content:space-between;animation:rise .6s .5s both}

.ser-stop.now{opacity:1}.ser-stop.now i{background:#F9A8D4;color:#0B3A53;border-color:#fff;animation:bnc 1.3s ease-in-out infinite}
/* ---------- the phone ---------- */
.ser-phone{position:absolute;width:356px;height:578px;background:#111827;border-radius:44px;padding:10px;box-shadow:0 24px 50px rgba(15,23,42,.35),inset 0 0 0 2px #374151;z-index:4}
.ser-scr{position:relative;width:100%;height:100%;border-radius:34px;overflow:hidden;background:#F4F7FA;color:#1E293B;font-family:"Source Sans 3","Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;line-height:1.35}

.ser-ics{display:flex;gap:4px;align-items:flex-end}

.ser-url>span{flex:1;height:28px;border-radius:14px;background:#F1F5F9;font-size:12px;color:#334155;display:flex;align-items:center;padding:0 11px;gap:7px;white-space:nowrap;overflow:hidden}
.ser-lk{width:8px;height:7px;background:#64748B;border-radius:1px;position:relative;flex:none;margin-top:4px}
.ser-lk::before{content:"";position:absolute;left:1px;top:-5px;width:3px;height:4px;border:1.5px solid #64748B;border-bottom:0;border-radius:3px 3px 0 0}
.ser-pg{position:absolute;left:0;right:0;top:62px;bottom:0;overflow:hidden}
.ser-view{position:absolute;inset:0;background:#F4F7FA}
.ser-ab{position:absolute;left:0;right:0;top:0;height:46px;background:#0891B2;color:#fff;display:flex;align-items:center;gap:10px;padding:0 12px;z-index:3;box-shadow:0 2px 8px rgba(8,145,178,.25)}
.ser-ab b{flex:1;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden}
.ser-so{background:rgba(255,255,255,.18);border-radius:7px;padding:5px 9px;font-size:11.5px;font-weight:700}
.ser-bk{width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:24px;line-height:1;padding-bottom:3px}
.ser-vp{position:absolute;left:0;right:0;top:46px;bottom:0;overflow:hidden}
.ser-vp.ser-hasbar{bottom:62px}
.ser-in{position:relative}
/* list view */
.ser-filt{display:flex;gap:6px;align-items:center;padding:9px 12px;background:#fff;border-bottom:1px solid #E7EDF3}
.ser-chip{padding:5px 13px;border-radius:18px;border:1.5px solid #E7EDF3;color:#64748B;font-weight:700;font-size:12.5px;background:#fff;transition:opacity .4s}
.ser-chip.on{background:#0891B2;border-color:#0891B2;color:#fff}
.ser-chip.dim{opacity:.45}
.ser-cnt{margin-left:auto;color:#64748B;font-size:11.5px;white-space:nowrap}
.ser-pick{display:flex;flex-wrap:wrap;gap:6px;padding:9px 12px 2px}
.ser-pick>div{flex:1 1 140px;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:10.5px;font-weight:700;color:#64748B}
.ser-sel{font-size:13px;font-weight:400;color:#1E293B;border:1.5px solid #E7EDF3;border-radius:9px;background:#fff;padding:6px 22px 6px 8px;position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:32px;transition:border-color .3s}

.ser-list{padding:8px 10px 14px}
.ser-empty{text-align:center;color:#94A3B8;padding:46px 16px;font-size:14px}
.ser-card{background:#fff;border-radius:14px;box-shadow:0 1px 8px rgba(15,40,70,.08);padding:11px 12px;margin-bottom:10px}
.ser-cn{font-weight:700;font-size:16px;line-height:1.2}
.ser-cp{color:#64748B;font-size:12.5px}
.ser-cw{color:#94A3B8;font-size:11px;margin-top:1px}
.ser-bdg{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0 10px}
.ser-bdg span{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:14px;white-space:nowrap}
.ser-b-cls{background:#EDE9FE;color:#5B21B6}.ser-b-ok{background:#DCFCE7;color:#16A34A}
.ser-b-pend{background:#FEF3C7;color:#B45309}.ser-b-done{background:#DCFCE7;color:#16A34A}
.ser-act{text-align:center;padding:9px;border-radius:10px;background:#0891B2;color:#fff;font-weight:700;font-size:13.5px}
.ser-act.ed{background:#fff;color:#0369A1;border:2px solid #0891B2;padding:7px}
/* sign-in view */
.ser-login{padding:26px 22px}
.ser-login img{display:block;width:62px;height:72px;margin:0 auto 10px;object-fit:contain}
.ser-login h3{text-align:center;color:#0891B2;font-size:21px;margin:0 0 2px}
.ser-login p{text-align:center;color:#64748B;font-size:13.5px;margin:0 0 18px}
.ser-login label{display:block;font-weight:700;font-size:13px;margin:0 0 4px}
.ser-tx{border:1.5px solid #CBD5E1;border-radius:11px;background:#fff;padding:9px 12px;font-size:14px;height:40px;margin-bottom:12px;white-space:nowrap;overflow:hidden;transition:border-color .3s,box-shadow .3s}
.ser-tx.ph{color:#94A3B8}
.ser-tx.typing::after,.ser-f.typing::after{content:"|";color:#0891B2;animation:blink .6s steps(1) infinite}
.ser-tx.foc,.ser-f.foc{border-color:#0891B2;box-shadow:0 0 0 3px rgba(8,145,178,.15)}
.ser-bp1{text-align:center;padding:12px;border-radius:11px;background:#0891B2;color:#fff;font-weight:700;font-size:15px;margin-top:6px}
/* results entry view */
.ser-form{padding:8px 12px 16px}
.ser-g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ser-l{display:block;font-weight:700;font-size:12px;margin:8px 0 3px}
.ser-f{border:1.5px solid #CBD5E1;border-radius:10px;background:#fff;padding:6px 9px;font-size:12.5px;height:32px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:border-color .3s,box-shadow .3s}
.ser-f.ph{color:#94A3B8}
.ser-f.ser-ta{height:48px;white-space:normal;line-height:1.3}
.ser-sec{font-weight:700;color:#0891B2;font-size:15px;margin:13px 0 2px;padding-bottom:3px;border-bottom:2px solid #E0F2FE}
.ser-row{display:grid;grid-template-columns:1fr 50px;gap:3px 8px;align-items:center;padding:5px 0 7px;border-bottom:1px solid #F1F5F9}
.ser-lab{grid-column:1/-1;font-size:12.5px;color:#475569;font-weight:700}
.ser-ears{display:grid;gap:5px;min-width:0}
.ser-ear{display:flex;align-items:center;gap:5px}
.ser-eh{font-size:10px;font-weight:800;color:#94A3B8;width:10px;flex:none;text-align:center}
.ser-seg{display:flex;gap:4px;flex:1;min-width:0}
.ser-b{flex:1 1 0;min-width:0;height:32px;border:1.5px solid #CBD5E1;border-radius:8px;background:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s,color .2s}
.ser-b.on.ser-tp{background:#16A34A;border-color:#16A34A;color:#fff}
.ser-b.on.ser-tf{background:#B91C1C;border-color:#B91C1C;color:#fff}
.ser-b.on.ser-to{background:#B45309;border-color:#B45309;color:#fff}
.ser-both{height:42px;border:1.5px dashed #0891B2;background:#F0F9FF;color:#0369A1;border-radius:8px;font-weight:800;font-size:10.5px;line-height:1.1;display:flex;align-items:center;justify-content:center;text-align:center}
.ser-photo{margin-top:10px;height:44px;border:2px dashed #0891B2;background:#F0F9FF;color:#0369A1;border-radius:11px;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
.ser-plist{display:flex;gap:8px;margin-top:8px}
.ser-pitem{border:1px solid #E7EDF3;border-radius:9px;padding:5px;background:#fff;font-size:11px;color:#64748B;text-align:center}

.ser-thumb .ser-paper{transform:scale(.42) rotate(-4deg);transform-origin:0 0;left:6px;top:4px}
.ser-pmsg{font-size:12px;margin-top:6px;color:#64748B;min-height:16px}
.ser-pmsg.good{color:#16A34A;font-weight:700}
.ser-pbar{height:5px;border-radius:3px;background:#E0F2FE;overflow:hidden;margin-top:4px}
.ser-pbar i{display:block;height:100%;width:0;background:#0891B2}
.ser-save{position:absolute;left:0;right:0;bottom:0;height:62px;background:#fff;border-top:1px solid #E7EDF3;display:flex;gap:8px;padding:10px 12px;z-index:3}
.ser-save span{flex:1;border-radius:11px;font-weight:700;font-size:13.5px;display:flex;align-items:center;justify-content:center;transition:opacity .3s}
.ser-sv{border:2px solid #0891B2;color:#0369A1;background:#fff}
.ser-se{background:#0891B2;color:#fff}
.ser-save span.dis{opacity:.5}
.ser-se.dis{background:#94A3B8}
/* Android pickers */
.ser-sh{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:20}
.ser-dlg{position:absolute;left:26px;right:26px;background:#fff;border-radius:12px;box-shadow:0 20px 40px rgba(0,0,0,.4);z-index:21;padding:8px 0;font-size:14px}

.ser-dlg .ser-o.on i{border-color:#0891B2;background:#0891B2;box-shadow:inset 0 0 0 3px #fff}
.ser-dlg .ser-o.hi{background:#E0F2FE}
.ser-cal{padding:0;overflow:hidden}
.ser-calh{background:#0891B2;color:#fff;padding:10px 18px 12px}
.ser-calh small{display:block;font-size:12px;opacity:.8}
.ser-calh b{font-size:22px}
.ser-calm{display:flex;align-items:center;justify-content:space-between;padding:8px 14px 2px;font-size:13.5px}
.ser-calm span{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:#475569}
.ser-calg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:4px 12px;text-align:center;font-size:12px}
.ser-calg i{font-style:normal;color:#94A3B8;font-weight:700;font-size:11px;padding:3px 0}
.ser-calg span{height:28px;line-height:28px;border-radius:50%;margin:0 2px}
.ser-calg span.on{background:#0891B2;color:#fff;font-weight:700}
.ser-calb{display:flex;justify-content:flex-end;gap:22px;padding:8px 20px 6px;color:#0891B2;font-weight:800;font-size:13px}
/* camera */
.ser-cam{position:absolute;inset:0;background:#000;z-index:30}
.ser-ctop{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;color:#fff;font-size:12px;font-weight:700}
.ser-vf{position:absolute;left:0;right:0;top:40px;height:390px;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#8B6B4A,#5B4330 70%,#3B2B1F)}
.ser-paper{position:absolute;left:92px;top:34px;width:152px;background:#FAFAF7;box-shadow:0 8px 18px rgba(0,0,0,.45);padding:10px 9px 16px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:9.3px;line-height:1.6;color:#1F2937;transform:rotate(-4deg)}
.ser-paper div{white-space:pre}
.ser-vf .ser-paper{top:84px}
.ser-paper hr{border:0;border-top:1px dashed #9CA3AF;margin:4px 0}
.ser-cnr i{position:absolute;width:28px;height:28px;border:3px solid #fff}
.ser-cnr i:nth-child(1){left:58px;top:20px;border-right:0;border-bottom:0}
.ser-cnr i:nth-child(2){right:58px;top:20px;border-left:0;border-bottom:0}
.ser-cnr i:nth-child(3){left:58px;bottom:20px;border-right:0;border-top:0}
.ser-cnr i:nth-child(4){right:58px;bottom:20px;border-left:0;border-top:0}
.ser-cbar{position:absolute;left:0;right:0;bottom:0;height:128px;display:flex;align-items:center;justify-content:space-around}

.ser-gal{width:38px;height:38px;border-radius:50%;background:#374151;border:2px solid #fff}
.ser-flip{width:38px;height:38px;border-radius:50%;background:#1F2937;border:2px solid #6B7280}

.ser-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5}
/* right-hand panels */
.ser-key{position:absolute;background:#fff;border-radius:14px;box-shadow:0 8px 22px rgba(15,23,42,.1);padding:12px 16px;font-size:16px;line-height:1.35;opacity:0}

.ser-kr{margin-bottom:7px}

.ser-note{position:absolute;background:#FEF3C7;border-left:6px solid #F59E0B;border-radius:12px;padding:12px 18px;font-size:18px;line-height:1.4;color:#0F172A;opacity:0}
.ser-note.pu{background:#F5F3FF;border-left-color:#7C3AED}
/* intro cards */
.ser-why{position:absolute;left:70px;top:132px;width:1140px;display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.ser-wc{background:#fff;border-radius:16px;box-shadow:0 10px 26px rgba(15,23,42,.1);padding:16px 18px;border-top:8px solid #0891B2;opacity:0;height:350px;position:relative;overflow:hidden}
.ser-wc.pu{border-top-color:#7C3AED}.ser-wc.gr{border-top-color:#16A34A}
.ser-wc h4{margin:0 0 4px;font-size:22px;color:#0B3A53}
.ser-wc .ser-when{font-size:13px;font-weight:800;color:#D63384;letter-spacing:.06em;text-transform:uppercase}

.ser-wc p b{color:#0F172A}
.ser-stack{position:relative;height:170px;margin-top:12px}

.ser-sheet b{display:block;color:#334155;font-size:12px}
.ser-sheet u{display:block;height:5px;background:#E2E8F0;border-radius:3px;margin-top:6px;text-decoration:none}
.ser-tab{position:absolute;right:-8px;top:10px;background:#EDE9FE;color:#5B21B6;font-weight:800;font-size:11px;border-radius:999px;padding:2px 9px}
.ser-mini{display:flex;gap:6px;margin-top:20px;justify-content:center}
.ser-mini span{width:52px;height:42px;border-radius:9px;color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center}
.ser-env{margin:18px auto 0;width:220px;height:130px;background:#F0F9FF;border:2px solid #0891B2;border-radius:10px;position:relative;overflow:hidden}

.ser-urlbar{position:absolute;left:70px;top:510px;width:1140px;background:#E0F2FE;border-radius:12px;padding:12px 18px;font-size:18px;color:#0B3A53;font-weight:700;opacity:0}
.ser-urlbar code{font-family:ui-monospace,Menlo,monospace;font-size:17px;background:#fff;border-radius:6px;padding:2px 8px}

.ser-cmp{position:absolute;left:540px;width:690px;display:grid;grid-template-columns:1fr 1fr;gap:14px}

.ser-cc .ser-pill{display:inline-block;margin-top:8px;font-size:12.5px;font-weight:800;padding:3px 10px;border-radius:14px;background:#DCFCE7;color:#16A34A}
/* contact card in the staff dashboard */
.ser-cwin{position:absolute;left:58px;top:118px;width:700px;height:568px;background:#fff;border-radius:14px;box-shadow:0 18px 44px rgba(15,23,42,.22);overflow:hidden;z-index:5}
.ser-chd{background:#0E7490;color:#fff;font-weight:800;font-size:17px;padding:12px 16px;display:flex;justify-content:space-between;position:relative;z-index:2}

.ser-cin{padding:8px 18px 30px}

.ser-fact a{color:#0E7490;text-decoration:underline}
.ser-acc{font-size:14px;font-weight:700;color:#059669;margin-top:12px}
.ser-acc small{font-weight:400;color:#94A3B8;font-size:13px}

.ser-acc.open .ser-ar{transform:rotate(90deg)}
.ser-pnl{display:none}
.ser-pnl.open{display:block}

function ask(Q,i,sec){const w=q('.qwrap');

 const card=w.firstChild,fb=card.querySelector('.qfb'),btns=[...card.querySelectorAll('.qo')];
 const finish=()=>{btns.forEach(b=>b.disabled=true);btns[Q.a].classList.add('yes');const st=all('.stars i')[i];if(st)st.classList.add('on');fb.className='qfb good';fb.textContent='Yes! '+Q.y};

function inner(sel){return q(sel||'.ser-in')}
