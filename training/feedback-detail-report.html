<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Feedback Detail Report — Training</title>
<link rel="stylesheet" href="deck-base.css">
<style>
/* ---- reports grid tile (Main → Reports), as index.html:7090-7140 draws it ---- */
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rt{background:#fff;border:2px solid #1a3c6e;border-radius:12px;box-shadow:0 6px 16px rgba(15,23,42,.08);padding:14px 15px;position:relative}
.rt .ic{font-size:19px;line-height:1;margin-bottom:6px}
.rt b{display:block;font-size:13.5px;color:#0F172A}
.rt p{margin:4px 0 0;font-size:11.4px;color:#64748B;line-height:1.35}
.rt.sm{padding:10px 11px}.rt.sm b{font-size:11.5px}.rt.sm p{font-size:9.4px}
.tip{position:absolute;background:#1E293B;color:#fff;font-size:11px;border-radius:6px;padding:6px 9px;max-width:230px;line-height:1.35;z-index:28;box-shadow:0 8px 20px rgba(15,23,42,.28)}
/* scope segmented control (v150.5) — lives ON the tile */
.seg{display:inline-flex;border:1px solid #CBD5E1;border-radius:6px;overflow:hidden;background:#fff;margin-top:10px}
.seg b{font-size:11px;font-weight:700;padding:5px 11px;color:#475569;background:#fff;transition:all .3s}
/* ---- browser chrome ---- */
.brw{background:#DCE3EB;border:1px solid #C3CEDA;border-radius:12px;overflow:hidden;box-shadow:0 14px 36px rgba(15,23,42,.2)}
.btabs{display:flex;gap:5px;padding:7px 9px 0}
.btab{background:#EEF2F6;border-radius:8px 8px 0 0;padding:6px 12px;font-size:11px;color:#64748B;white-space:nowrap;max-width:250px;overflow:hidden;transition:all .35s}
.btab.act{background:#fff;color:#0F172A;font-weight:700}
.btab.nw{opacity:0;transform:translateY(8px)}
.burl{background:#fff;padding:7px 10px;border-bottom:1px solid #E2E8F0;display:flex;gap:8px;align-items:center}
.burl i{width:9px;height:9px;border-radius:50%;background:#CBD5E1;flex:none;font-style:normal}
.burl span{flex:1;background:#F1F5F9;border-radius:999px;padding:4px 12px;font-size:10.5px;color:#64748B;white-space:nowrap;overflow:hidden}
.bbody{background:#fff;overflow:hidden}
/* ---- the generated report document ---- */
.rep{padding:13px 15px}
.rtool{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.rep h1{font-size:16.5px;margin:0 0 3px;color:#1a3c6e;font-weight:800}
.rep .gen{color:#64748b;font-size:10.6px;margin:0 0 13px}
.csvb{background:#16A34A;color:#fff;font-size:11px;font-weight:700;border-radius:8px;padding:6px 13px;white-space:nowrap;flex:none}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}
.kpix{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:10px 8px;text-align:center}
.kpix .kn{font-size:22px;font-weight:800;color:#1a3c6e;line-height:1.1}
.kpix .kl{font-size:9px;color:#64748b;text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
/* accordion */
.eb{border:1px solid #e2e8f0;border-radius:10px;overflow:hidden;margin-bottom:10px;background:#fff}
.ebh{background:#1a3c6e;color:#fff;padding:9px 13px;font-weight:700;font-size:12.6px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.cpill{background:#fff;color:#1a3c6e;padding:2px 10px;border-radius:12px;font-size:10.4px;font-weight:700;white-space:nowrap}
.sbk{border-top:1px solid #e2e8f0}
.sbkh{background:#f1f5f9;padding:7px 13px;font-weight:600;font-size:11.4px;color:#334155;display:flex;justify-content:space-between;gap:10px}
.sbkh .scnt{color:#64748b;font-weight:500;white-space:nowrap}
.rsp{border-top:1px solid #e5e7eb;padding:9px 13px;display:flex;justify-content:space-between;gap:12px;align-items:center;background:#fff;transition:background .35s}
.rsp.open{background:#eff6ff;border-bottom:1px solid #dbeafe}
.rsp .rnm{font-weight:700;color:#0f172a;font-size:12.2px;white-space:nowrap}
.rsp .rmeta{font-size:10.4px;color:#64748b;white-space:nowrap}
.bfl{font-size:9.4px;background:#fef3c7;color:#92400e;padding:1px 8px;border-radius:4px;margin-left:6px;font-weight:700}
/* answers */
.ansp{padding:11px 16px 13px;background:#fafbfc;border-top:1px solid #e5e7eb}
.qq{margin:0 0 5px}
.qlb{font-size:9.6px;color:#64748b;font-weight:700}
.qan{font-size:12.2px;color:#0f172a;margin-top:1px}
.qan.emp{color:#9ca3af;font-style:italic}
.longa{background:#fff;border-left:3px solid #1a3c6e;padding:6px 10px;margin-top:3px;border-radius:0 6px 6px 0;font-size:11.8px;line-height:1.35}
/* toast, as _showToast draws it (index.html:14139) */
.toast{position:absolute;left:50%;transform:translateX(-50%);color:#fff;padding:9px 22px;border-radius:24px;font-size:13px;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.18);white-space:nowrap;z-index:35}
/* name cards (scene 2) */
.nmc2{background:#fff;border:1px solid var(--line);border-left:6px solid var(--teal);border-radius:13px;padding:14px 18px;box-shadow:0 8px 24px rgba(15,23,42,.08);opacity:0}
.nmc2.bad{border-left-color:#DC2626}
.nmc2 .w{display:block;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#94A3B8;margin-bottom:5px}
.nmc2 b{font-size:27px;color:var(--deep)}
.nmc2.bad b{color:#DC2626;text-decoration:line-through}
.nmc2 p{margin:6px 0 0;font-size:14px;color:var(--soft)}
.dn{text-align:center;font-size:30px;color:#CBD5E1;line-height:1;margin:8px 0}
/* two-up compare cards */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.cmp>div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 17px;box-shadow:0 8px 24px rgba(15,23,42,.08);opacity:0}
.cmp h4{margin:0 0 3px;font-size:18px;color:var(--teal)}
.cmp .w{font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#94A3B8;margin-bottom:9px}
.cmp ul{margin:0;padding-left:19px;font-size:14px;line-height:1.5;color:var(--soft)}
.cmp li{margin-bottom:5px}
.cmp b{color:var(--ink)}
/* mini spreadsheet */
.sheet{border:1px solid #CBD5E1;border-radius:8px;overflow:hidden;background:#fff;font-size:10px}
.sheet .hr{display:flex;background:#E8F0E9;font-weight:800;color:#14532D}
.sheet .r2{display:flex;border-top:1px solid #E2E8F0;color:#334155}
.sheet .r2.alt{background:#F8FAFC}
.sheet div>span{padding:5px 7px;border-right:1px solid #E2E8F0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet .meta7 span{background:rgba(8,145,178,.1)}
.fnm{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:#F1F5F9;border:1px solid #CBD5E1;border-radius:7px;padding:6px 11px;display:inline-block;color:#0F172A}
</style></head><body>
<div id="view"><div id="stage"><div id="nbar"><i></i></div>
<div id="scenes"></div>
<div id="spot"></div>
<svg id="cursor" viewBox="0 0 28 32"><path d="M3 2 L3 26 L9.5 19.5 L14 29 L18.5 27 L14 17.5 L23 17.5 Z" fill="#fff" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/></svg>
</div></div>
<div id="cap" aria-live="polite"></div>
<div id="bar">
 <button id="prev">Back</button><button id="play">Start</button><button id="next">Next</button>
 <div id="dots"></div>
 <button id="capbtn" aria-pressed="false">Captions</button><button id="voice" aria-pressed="true">Voice on</button>
</div>
<script>
const DECK_ID='feedback-detail-report-2026-09';

/* ---- builders: the real screens, drawn in HTML/CSS. No screenshots. ---- */
const FBCAP='Every post-event feedback response, grouped by event &amp; session date. Click any respondent to expand all 13 answers.';

const RT=(o)=>`<div class="rt ${o.cls||''} ${o.sm?'sm':''}" style="border-color:${o.brd||'#1a3c6e'}">
 <div class="ic">${o.ic||''}</div><b>${o.t}</b><p>${o.c}</p>${o.seg||''}</div>`;

const SEG=(sel)=>`<span class="seg">${[['ldah','LDAH','#0891B2'],['pip','PIP','#7C3AED'],['both','Both','#475569']]
 .map(([v,l,c])=>`<b class="sg g_${v}" style="${sel===v?'background:'+c+';color:#fff':''}">${l}</b>`).join('')}</span>`;

const NEIGHBOURS=(sm)=>`<div class="rgrid">
 ${RT({sm,cls:'n0',ic:'📅',t:'Event Attendance',c:'Sign-up counts and attendance rates for community events and workshops.'})}
 ${RT({sm,cls:'n1 fbt',ic:'📝',t:'Feedback Detail Report',c:FBCAP})}
 ${RT({sm,cls:'n2',ic:'📈',t:'Staff Activity',c:'Follow-up interactions grouped by staff member, then by family.'})}
 ${RT({sm,cls:'n3',ic:'🌺',t:'Native Hawaiian Family Survey',c:'Cumulative results across all submissions.'})}</div>`;

const BRW=(o)=>{o=o||{};return `<div class="brw" style="width:${o.w||700}px">
 <div class="btabs">${(o.tabs||[['LDAH Internal',1]]).map(([t,a],i)=>`<div class="btab b${i} ${a?'act':''} ${o.nw===i?'nw':''}">${t}</div>`).join('')}</div>
 <div class="burl"><i></i><span>${o.url||'ldah-int.web.app'}</span></div>
 <div class="bbody" style="height:${o.h||330}px">${o.body||''}</div></div>`};

const KPI=(a,b,c)=>`<div class="kpis">
 <div class="kpix"><div class="kn k0">${a}</div><div class="kl">Total feedback responses</div></div>
 <div class="kpix"><div class="kn k1">${b}</div><div class="kl">Events with feedback</div></div>
 <div class="kpix"><div class="kn k2">${c}</div><div class="kl">Unique respondents</div></div></div>`;

const REPHEAD=(gen)=>`<div class="rtool"><div><h1>LDAH Feedback Detail Report</h1>
 <p class="gen">Generated ${gen||'2026-09-23 18:04:11'}Z &middot; live from Firestore &middot; click any respondent to expand all 13 answers.</p></div>
 <span class="csvb">Download CSV</span></div>`;

const RSP=(n,e,ts,o)=>{o=o||{};return `<div class="rsp ${o.cls||''}">
 <span class="rnm">${n}${o.bf?'<span class="bfl">backfilled</span>':''}</span>
 <span class="rmeta">${e}${ts?' &middot; '+ts:''}</span></div>`};

const SESB=(label,rows,cls)=>`<div class="sbk ${cls||''}">
 <div class="sbkh"><span>Session: ${label}</span><span class="scnt">${rows.length} response${rows.length===1?'':'s'}</span></div>${rows.join('')}</div>`;

const EVB=(title,n,inner,cls)=>`<div class="eb ${cls||''}">
 <div class="ebh"><span>${title}</span><span class="cpill">${n} response${n===1?'':'s'}</span></div>${inner}</div>`;

/* the 13 questions, verbatim and in order (index.html:48568-48583) */
const QA=[
 ['Q1. Participation mode','Virtual'],
 ['Q2. Presenter rating','Very Helpful'],
 ['Q3. Handouts rating','Helpful'],
 ['Q4. Did this session increase your knowledge?','Yes'],
 ['Q5. Relevant to your child?','Yes'],
 ['Q6. Useful to me?','To some extent'],
 ['Q7. Overall satisfaction','Yes'],
 ['Q8. (Prior-impact) Did this affect services received?','Yes'],
 ['Q9. (Prior-impact) Shared with others?','To some extent'],
 ['Q10. (Prior-impact) Affected school relationship?','Yes'],
 ['Q11. (Prior-impact) Helped resolve concerns?',''],
 ['Q12. What did you like best?','The checklist at the end — I could follow along and tick things off.','L'],
 ['Q13. What would you improve?','More time for questions.','L']];

const ANS=(list)=>`<div class="ansp">${list.map(([l,v,k],i)=>`<div class="qq a${i}">
 <div class="qlb">${l}</div>${v===''?'<div class="qan emp">(no answer)</div>'
 :k==='L'?`<div class="qan"><div class="longa">${v}</div></div>`:`<div class="qan">${v}</div>`}</div>`).join('')}</div>`;

const MINIREP=()=>`<div class="brw" style="width:640px"><div class="btabs"><div class="btab">LDAH Internal</div><div class="btab act">LDAH Feedback Report</div></div>
 <div class="burl"><i></i><span>blob:https://ldah-int.web.app/…</span></div>
 <div class="bbody" style="height:300px"><div class="rep">${REPHEAD()}${KPI(214,17,168)}
 ${EVB('Connect-Gen',42,SESB('2026-09-18',[RSP('Kalani Example','kalani@example.com','2026-09-18 21:04:02')]))}
 ${EVB('Diploma vs. Certificate',11,SESB('2026-09-04',[RSP('Mele Sample','mele.sample@example.com','2026-09-05 02:11:40')]))}</div></div></div>`;

const SC=[

/* ---------- 1. COVER ---------- */
{cls:'cover',html:()=>`<div class="brand">Leadership in Disabilities &amp; Achievement of Hawaiʻi</div><div class="hello">Aloha <span class="nm"></span></div>
 <h1>The Feedback<br>Detail Report</h1><p class="sub">Every answer a family gave after an event — one person at a time. About six minutes.</p>
 <div class="abs" style="left:690px;top:120px;transform:scale(.72) rotate(3deg);transform-origin:top left;animation:bob 5s ease-in-out infinite">${MINIREP()}</div>
 <div class="spark" style="left:1200px;top:110px">${SPARK}</div><div class="spark" style="left:650px;top:430px;animation-delay:1s">${SPARK}</div>
 <div class="gate"><button class="btn" data-go="start">Start training</button><button class="btn ghost" data-go="skip">Skip for now</button><label><input type="checkbox" id="voiceChk" checked> Read it out loud to me</label></div>${WAVES}`,
 steps:[{say:'Aloha {name}! This is the Feedback Detail Report — every answer a family gave on a post-event feedback form, read one person at a time. About six minutes.'}]},

/* ---------- 2. THE NAME ---------- */
{html:()=>HEAD('First thing','It is not called “Evaluations Report”')+`<div class="abs" style="left:58px;top:146px;width:700px">
 <div class="nmc2 bad c0"><span class="w">The old staff video says</span><b>Evaluations Reports</b></div>
 <div class="dn">↓</div>
 <div class="nmc2 c1"><span class="w">The tile is actually called</span><b>Feedback Detail Report</b><p>Main tab → Reports → tile number ten</p></div></div>
 <div class="abs" style="left:790px;top:154px;width:440px"><ul class="pts">
 <li>Nothing in the system is named <b>Evaluations Report</b>.</li>
 <li>Search for <b>Feedback</b>, not evaluations.</li>
 <li>It reads <b>post-event feedback forms</b> — the ones families fill in afterwards.</li></ul></div>`,steps:[
 {say:'Before anything else, the name. The training video you were sent is called Evaluations Reports.',li:0,act:async()=>{await anim(q('.c0'),[{opacity:0,transform:'translateY(18px)'},{opacity:1,transform:'none'}],450);await wait(500)}},
 {say:'There is no screen called that. If you go looking for an Evaluations Report you will never find it.',act:async()=>{spot(q('.c0'),6);const p=pos(q('.c0'));const s=add(`<div class="stamp" style="left:${p.x+330}px;top:${p.y+8}px">NO SUCH SCREEN</div>`);await pop(s);await wait(1400);spot(null)}},
 {say:'The tile you want is the Feedback Detail Report. Main tab, Reports, tenth tile down.',li:1,act:async()=>{await anim(q('.c1'),[{opacity:0,transform:'translateY(18px)'},{opacity:1,transform:'none'}],450);spot(q('.c1'),6);await wait(1300);spot(null)}},
 {say:'It reads the post-event feedback forms — the short survey a family fills in after a session.',li:2,act:async()=>{await wait(700)}}]},

/* ---------- 3. GETTING THERE ---------- */
{html:()=>HEAD('Getting there','Main → Reports')+`<div class="dash">
 <div class="side"><div class="tabs"><div class="mt act">Main</div><div class="ct">CMS</div></div>
  <div class="nav"><div>My Day</div><div>Contacts &amp; Interactions</div><div>Events</div><div class="rp">Reports</div><div>Members</div><div>Certification</div></div></div>
 <div class="main"><div class="sr-title">Reports <i>i</i></div>
  <div class="grid-host" style="opacity:0">${NEIGHBOURS(true)}</div></div></div>`,steps:[
 {say:'Getting there takes two clicks. Start on the Main tab — not CMS.',act:async()=>{const t=q('.mt');spot(t,5);place(560,660,0);await move(t,900);await click(t);await wait(400);spot(null)}},
 {say:'Then, down the left menu, press Reports.',act:async()=>{const r=q('.rp');await move(r,800);await click(r);r.classList.add('act');await wait(400)}},
 {say:'That fills the page with tiles — one per report. Yours is the tenth one down.',act:async()=>{hideCursor();const g=q('.grid-host');await anim(g,[{opacity:0,transform:'translateY(20px)'},{opacity:1,transform:'none'}],500);spot(q('.fbt'),5);await wait(1600);spot(null)}}]},

/* ---------- 4. THE TILE ---------- */
{html:()=>HEAD('The tile','Feedback Detail Report')+`<div class="abs" style="left:58px;top:132px;width:700px">${NEIGHBOURS(false)}</div>
 <div class="abs" style="left:790px;top:150px;width:440px"><ul class="pts">
 <li>Navy border, a <b>📝</b>, and the caption tells you exactly what it does.</li>
 <li>It is the <b>only tile with no tooltip</b> — hovering tells you nothing.</li>
 <li>Super Admins also get <b>LDAH / PIP / Both</b> <i>on the tile</i>, not in the report.</li>
 <li>Your pick is added to the report title. <b>Both</b> is the default.</li></ul></div>`,steps:[
 {say:'Here is the tile, sitting between Event Attendance and Staff Activity. Navy border, a notepad, and a caption that says exactly what it does.',li:0,act:async()=>{spot(q('.fbt'),5);await wait(1900)}},
 {say:'Every post-event feedback response, grouped by event and session date. Click any respondent to expand all thirteen answers. That is the whole report in one sentence.',act:async()=>{spot(q('.fbt p'),5);await wait(2400)}},
 {say:'One oddity: it is the only tile in the grid with no tooltip. Hover over its neighbours and you get a hint. Hover over this one and nothing happens.',li:1,act:async()=>{const n=q('.n0');spot(null);place(300,620,0);await move(n,850);const p=pos(n);const t=add(`<div class="tip" style="left:${p.x+70}px;top:${p.y+p.h-4}px">Signups and who actually turned up, for every event and workshop.</div>`);
   await anim(t,[{opacity:0},{opacity:1}],300);await wait(1500);await anim(t,[{opacity:1},{opacity:0}],250);t.remove();
   const f=q('.fbt');await move(f,800);await wait(1400);hideCursor()}},
 {say:'If you are a Super Admin there is one more thing here — a small LDAH, PIP, Both switch. It sits on the tile, because the report opens somewhere else.',li:2,act:async()=>{const f=q('.fbt');const s=add(SEG('both'),f);await anim(s,[{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],420);spot(s,5);await wait(1600)}},
 {say:'Whatever you pick gets added to the report title — PIP only, LDAH only, or LDAH plus PIP. Leave it on Both unless somebody asks you for one or the other.',li:3,act:async()=>{const g=q('.g_pip');g.style.background='#7C3AED';g.style.color='#fff';const b=q('.g_both');b.style.background='#fff';b.style.color='#475569';await wait(1900);spot(null)}}]},

/* ---------- 5. IT OPENS IN A NEW TAB ---------- */
{html:()=>HEAD('Watch out','It opens in a new browser tab')+`<div class="abs" style="left:58px;top:132px">
 ${BRW({w:700,h:250,tabs:[['LDAH Internal',1],['LDAH Feedback Report',0]],nw:1,body:`<div style="padding:16px">${RT({cls:'fbt',ic:'📝',t:'Feedback Detail Report',c:FBCAP})}</div>`})}</div>
 <div class="abs" style="left:790px;top:150px;width:440px"><ul class="pts">
 <li>The report is <b>built fresh</b> and handed to a <b>new tab</b>.</li>
 <li>Your Internal tab <b>stays exactly where it was</b>.</li>
 <li>Nothing happened? The browser <b>blocked the pop-up</b>.</li>
 <li>Allow pop-ups for this site, then press the tile again.</li></ul></div>`,steps:[
 {say:'Now press it. This is the part that catches everybody, so watch what happens.',li:0,act:async()=>{const f=q('.fbt');place(400,640,0);await move(f,900);await click(f);hideCursor();
   const t=add('<div class="toast" style="bottom:36px;background:#0891B2">Building feedback report…</div>');await anim(t,[{opacity:0,transform:'translate(-50%,14px)'},{opacity:1,transform:'translate(-50%,0)'}],380);await wait(1400);await anim(t,[{opacity:1},{opacity:0}],300);t.remove()}},
 {say:'It does not draw the report on the page. It builds a whole document and hands it to a brand new browser tab.',li:1,act:async()=>{const nt=q('.b1');nt.classList.remove('nw');await anim(nt,[{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],450);
   nt.classList.add('act');q('.b0').classList.remove('act');spot(nt,4);await wait(1200);spot(null);
   const t=add('<div class="toast" style="bottom:36px;background:#16A34A">Feedback report opened in a new tab (214 responses).</div>');await anim(t,[{opacity:0,transform:'translate(-50%,14px)'},{opacity:1,transform:'translate(-50%,0)'}],380);await wait(1800);await anim(t,[{opacity:1},{opacity:0}],300);t.remove()}},
 {say:'And here is the support call we get most. You press the tile, and nothing seems to happen at all. The report is not broken — your browser blocked the pop-up.',li:2,act:async()=>{
   const t=add('<div class="toast" style="bottom:36px;background:#DC2626">Pop-up blocked. Please allow pop-ups for this site and try again.</div>');await anim(t,[{opacity:0,transform:'translate(-50%,14px)'},{opacity:1,transform:'translate(-50%,0)'}],380);
   const s=add('<div class="stamp" style="left:150px;top:300px">POP-UP BLOCKED</div>');await pop(s);await wait(2000)}},
 {say:'The message says it plainly. Allow pop-ups for this site, then press the tile a second time. That is the whole fix.',li:3,act:async()=>{await wait(900)}}]},

/* ---------- 6. THE REPORT TAB ---------- */
{html:()=>HEAD('The report','What you get in the new tab')+`<div class="abs" style="left:58px;top:130px">
 ${BRW({w:700,h:300,tabs:[['LDAH Internal',0],['LDAH Feedback Report',1]],url:'blob:https://ldah-int.web.app/…',
  body:`<div class="rep">${REPHEAD()}${KPI(0,0,0)}<div class="pk" style="opacity:.25">${EVB('Connect-Gen',42,SESB('2026-09-18',[RSP('Kalani Example','kalani@example.com','2026-09-18 21:04:02')]))}</div></div>`})}</div>
 <div class="abs" style="left:790px;top:150px;width:440px"><ul class="pts">
 <li>The tab is called <b>LDAH Feedback Report</b>.</li>
 <li>The grey line tells you when it was built — it is <b>live</b>, every time.</li>
 <li>Three counts across the top, then the list.</li>
 <li>Green <b>Download CSV</b> up in the corner. We come back to that.</li></ul></div>`,steps:[
 {say:'This is the new tab. The tab itself is called LDAH Feedback Report, and the heading is LDAH Feedback Detail Report.',li:0,act:async()=>{spot(q('.b1'),4);await wait(1100);spot(q('.rep h1'),5);await wait(1400)}},
 {say:'Under it, a grey line with a timestamp. That is when this copy was built — it reads straight from the live data every time you press the tile.',li:1,act:async()=>{spot(q('.gen'),5);await wait(2000)}},
 {say:'Then three counts. Total feedback responses, events with feedback, and unique respondents.',li:2,act:async()=>{spot(q('.kpis'),6);await Promise.all([countTo(q('.k0'),214),countTo(q('.k1'),17),countTo(q('.k2'),168)]);await wait(900);spot(null)}},
 {say:'And one green button in the top corner — Download CSV. We will come back to it.',li:3,act:async()=>{spot(q('.csvb'),5);await wait(1400);spot(null)}}]},

/* ---------- 7. THE TWO BARS ---------- */
{html:()=>HEAD('The list','A navy bar, then a grey bar')+`<div class="abs" style="left:58px;top:132px;width:700px">
 ${EVB('Connect-Gen',42,SESB('2026-09-18',[RSP('Kalani Example','kalani@example.com','2026-09-18 21:04:02')])+SESB('2026-09-04',[RSP('Mele Sample','mele.sample@example.com','2026-09-04 23:50:17')]),'e0')}
 ${EVB('Diploma vs. Certificate',1,SESB('(no session date -- flat / single-date event)',[RSP('Noa Testperson','noa@example.org','2026-08-21 19:02:55')],'flat'),'e1')}</div>
 <div class="abs" style="left:790px;top:150px;width:440px"><ul class="pts">
 <li><b>Navy bar = the event.</b> The white pill counts its responses.</li>
 <li>Busiest events first — it is <b>sorted by response count</b>, not by date.</li>
 <li><b>Grey bar = one session date</b>, newest date first.</li>
 <li>An event with a single date says <b>no session date — flat</b>. That is normal.</li></ul></div>`,steps:[
 {say:'The list underneath is built in three layers. The navy bar is the event, and the white pill on the right counts how many responses it got.',li:0,act:async()=>{spot(q('.e0 .ebh'),4);await wait(1800)}},
 {say:'The busiest event is at the top. They are ordered by how many responses came in, not by date, so the order changes as feedback arrives.',li:1,act:async()=>{spot(q('.e1 .ebh'),4);await wait(2100)}},
 {say:'Inside each event, a grey bar for every session date, newest first, with its own count.',li:2,act:async()=>{spot(q('.e0 .sbkh'),4);await wait(1700)}},
 {say:'And if an event only ever had one date, the grey bar says: no session date, flat or single-date event. Nothing is wrong — that event simply never had sessions.',li:3,act:async()=>{spot(q('.flat .sbkh'),4);await wait(2400);spot(null)}}]},

/* ---------- 8. THE RESPONDENT ROW ---------- */
{html:()=>HEAD('Layer three','One row per respondent')+`<div class="abs" style="left:58px;top:132px;width:700px">

  RSP('Kalani Example','kalani@example.com','2026-09-18 21:04:02',{cls:'r0'}),
  RSP('Mele Sample','mele.sample@example.com','2026-09-18 20:12:44',{cls:'r1',bf:1}),

 <div class="abs" style="left:790px;top:150px;width:440px"><ul class="pts">

 {say:'Inside a session date, one row per person. The name on the left, their email and the exact moment they submitted on the right.',li:0,act:async()=>{spot(q('.r0'),4);await wait(2000)}},
 {say:'Newest at the top, so the most recent answers are always the first thing you read.',li:1,act:async()=>{await wait(1100)}},
 {say:'An amber backfilled badge means the session date was filled in afterwards, by a sweep — not by the family. The answers are still theirs.',li:2,act:async()=>{spot(q('.r1 .bfl'),5);await wait(2200)}},
 {say:'And unknown respondent means we could not find their signup record any more. The feedback is real; only the name is missing.',li:3,act:async()=>{spot(q('.r2 .rnm'),5);await wait(2100)}},
 {say:'Click a row and it turns pale blue, and every answer opens underneath it.',li:4,act:async()=>{spot(null);const r=q('.r0');place(360,650,0);await move(r,850);await click(r);r.classList.add('open');hideCursor();
   const a=add(ANS(QA.slice(0,3)),r.parentNode);a.style.opacity=0;r.after(a);await anim(a,[{opacity:0,transform:'translateY(-10px)'},{opacity:1,transform:'none'}],450);await wait(1200)}}]},

/* ---------- 9. THE 13 ANSWERS ---------- */
{html:()=>HEAD('The thirteen answers','One person, not a total')+`<div class="abs" style="left:58px;top:126px;width:700px">
 <div class="eb"><div class="rsp open"><span class="rnm">Kalani Example</span><span class="rmeta">kalani@example.com &middot; 2026-09-18 21:04:02</span></div>${ANS(QA)}</div></div>
 <div class="abs" style="left:790px;top:150px;width:440px"><ul class="pts">

 {say:'Open a respondent and you get all thirteen questions, always in the same order, with that one person’s answers beside them.',li:0,act:async()=>{spot(q('.ansp'),5);await wait(2000);spot(null)}},
 {say:'This is not a summary. There are no bars, no percentages and no totals anywhere in this report — it is one family at a time.',act:async()=>{const s=add('<div class="stamp" style="left:250px;top:250px">NOT A SUMMARY</div>');await pop(s);await wait(1900);await anim(s,[{opacity:1},{opacity:0}],400);s.remove()}},
 {say:'Questions two and three rate the presenter and the handouts: Very Helpful, Helpful, Not Helpful, or No Answer.',li:1,act:async()=>{spot(q('.a1'),4);await wait(1200);spot(q('.a2'),4);await wait(1500)}},
 {say:'Questions four through eleven are all the same three choices: Yes, To some extent, or No. Eight through eleven are the prior-impact ones — what changed since the last time.',li:2,act:async()=>{spot(q('.a7'),4);await wait(2500)}},
 {say:'The last two are free text. They sit in a white box with a navy edge, and they are never trimmed — you always see the whole comment.',li:3,act:async()=>{spot(q('.a11'),4);await wait(1400);spot(q('.a12'),4);await wait(1600)}},
 {say:'And anything they left blank simply reads, no answer, in grey italics. That is a skipped question, not an error.',li:4,act:async()=>{spot(q('.a10'),4);await wait(1900);spot(null)}}]},

 {say:'If you need this in a spreadsheet, there is one green button, top right. Download CSV.',li:0,act:async()=>{const b=q('.cb0');place(560,650,0);await move(b,850);await click(b);hideCursor();await anim(q('.s0'),[{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],450)}},

/* ---------- 11. TWO HONEST GOTCHAS ---------- */
{html:()=>HEAD('Two honest gotchas','Neither one is a fault')+`<div class="abs" style="left:58px;top:146px;width:1170px"><div class="cmp">
 <div class="k0"><div class="w">Gotcha one</div><h4>There are no filters</h4><ul>

 <div class="k1"><div class="w">Gotcha two</div><h4>There is no empty state</h4><ul>
  <li>With no feedback you get <b>three zeroes and a blank page</b>.</li>

  <li>It is not broken — there is simply nothing to show yet.</li></ul></div></div></div>`,steps:[
 {say:'Two things about this report are worth knowing before somebody tells you it is broken.',act:async()=>{for(const s of ['.k0','.k1']){await anim(q(s),[{opacity:0,transform:'translateY(30px)'},{opacity:1,transform:'none'}],450)}}},
 {say:'First, it has no filters at all. No dates, no event picker, not even a search box. It is always everything, all the way back to the beginning.',act:async()=>{spot(q('.k0'),7);await wait(2600)}},
 {say:'That means it keeps growing. If you are hunting for one family, use your browser’s find on the page, or take the CSV into a spreadsheet.',act:async()=>{await wait(1800);spot(null)}},
 {say:'Second, if there is no feedback yet, you get three zeroes and a blank white page underneath. No message at all.',act:async()=>{spot(q('.k1'),7);await wait(2000)}},
 {say:'That is not a fault and it is not a broken report. There is simply nothing to show yet. Do not raise a ticket for it.',act:async()=>{const s=add('<div class="stamp" style="left:700px;top:470px">NOT BROKEN</div>');await pop(s);await wait(2000);spot(null)}}]},
