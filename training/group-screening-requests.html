<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scheduling a Group Screening — Training</title>
<link rel="stylesheet" href="deck-base.css">
<!-- Same Firebase build as the dashboard, so the deck shares its sign-in and records progress. -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
/* LDAH staff deck (2026-11-13). Every screen drawn in CSS from live DAN v154.74 and
   ldahawaii.org. The organization and contact are made up. Classes start gs- or qz-. */
.gs-win{position:absolute;background:#fff;border:1px solid #D5DEE8;border-radius:14px;box-shadow:0 14px 36px rgba(15,23,42,.16);overflow:hidden;opacity:0;font-family:Arial,Helvetica,sans-serif}
.gs-win .hd{background:linear-gradient(135deg,#004E7C,#0066a1);color:#fff;font-weight:800;font-size:17px;padding:12px 16px;display:flex;justify-content:space-between}
.gs-win .hd.t{background:#0F766E}
.gs-win .hd small{display:block;font-weight:400;font-size:12px;opacity:.85}
.gs-win .bd{padding:12px 16px;font-size:13.5px;color:#334155}
.gs-lb{font-weight:700;font-size:12.5px;color:#1E293B;margin:8px 0 4px}
.gs-lb .r{color:#E53E3E}
.gs-in{border:1.5px solid #E2E8F0;border-radius:8px;padding:6px 10px;font-size:13px;color:#334155;background:#fff;min-height:16px}
.gs-in.ph{color:#94A3B8}
.gs-chips{display:flex;flex-wrap:wrap;gap:6px}
.gs-chips span{border:1.5px solid #E2E8F0;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600}
.gs-chips span.on{border-color:#004E7C;background:#EBF5FB;color:#004E7C}
.gs-row{display:grid;grid-template-columns:1.4fr 1fr;gap:8px}
.gs-choice{border:2px solid #E2E8F0;border-radius:12px;padding:11px 14px;margin-bottom:9px;transition:all .3s}
.gs-choice b{display:block;color:#004E7C;font-size:15px}
.gs-choice span{font-size:12.5px;color:#64748B}
.gs-choice.on{border-color:#004E7C;background:#EBF5FB}
.gs-site{position:absolute;background:#fff;border-radius:12px;box-shadow:0 10px 26px rgba(15,23,42,.1);padding:12px 16px;opacity:0;border-left:4px solid #004E7C;font-family:Arial,Helvetica,sans-serif}
.gs-site b{color:#0B5E8A;font-size:15px}.gs-site p{margin:3px 0 0;font-size:12.5px;color:#64748B}
.gs-task{position:absolute;background:#fff;border-radius:12px;border-left:5px solid #0F766E;box-shadow:0 10px 26px rgba(15,23,42,.1);padding:12px 16px;opacity:0;font-family:Arial,Helvetica,sans-serif}
.gs-task .s{font-weight:700;font-size:15px;color:#0F172A}.gs-task .m{font-size:12px;color:#64748B;margin:3px 0 8px}
.gs-btn{display:inline-block;border-radius:7px;padding:6px 12px;font-size:12.5px;font-weight:700;color:#fff;background:#0F766E;transition:transform .2s}
.gs-btn.o{background:#fff;color:#1a3c6e;border:1.5px solid #1a3c6e}.gs-btn.g{background:#15803D}.gs-btn.w{background:#fff;color:#334155;border:1.5px solid #CBD5E1}
.gs-card{position:absolute;background:linear-gradient(180deg,#E6F4F2,#fff 70px);border-radius:14px;border-left:5px solid #0F766E;box-shadow:0 10px 26px rgba(15,23,42,.1);padding:14px 16px;opacity:0;font-family:Arial,Helvetica,sans-serif}
.gs-card .o{font-weight:700;font-size:16px;color:#0F172A}.gs-card .c{font-size:12.5px;color:#64748B}
.gs-card .sc{font-size:12.5px;color:#0F766E;font-weight:700;margin-top:3px}.gs-card .cf{font-size:12.5px;color:#15803D;font-weight:800}
.gs-badge{position:absolute;right:14px;top:14px;font-size:11px;font-weight:800;color:#fff;background:#64748B;border-radius:999px;padding:2px 9px;text-transform:uppercase}
.gs-badge.cf{background:#0F766E}
.gs-sb{display:inline-block;font-size:11.5px;padding:3px 8px;border-radius:6px;background:#F1F5F9;color:#475569;margin-right:4px}
.gs-filt{position:absolute;display:flex;gap:6px;opacity:0}.gs-filt span{font-size:12.5px;font-weight:600;border:1.5px solid #CBD5E1;border-radius:7px;padding:4px 10px;background:#fff;color:#334155}
.gs-filt span.on{background:#0F766E;color:#fff;border-color:#0F766E}
.gs-q{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;padding:7px 0;border-bottom:1px dashed #E2E8F0;font-size:13px}
.gs-ynp{display:flex;gap:3px}.gs-ynp span{border:1px solid #CBD5E1;border-radius:5px;padding:2px 7px;font-size:11.5px;font-weight:700;color:#475569}
.gs-ynp span.on{background:#0F766E;border-color:#0F766E;color:#fff}
.gs-sec{font-weight:800;color:#0F766E;margin:10px 0 4px;font-size:13.5px;border-bottom:1px solid #E2E8F0;padding-bottom:3px}
.gs-dt{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}.gs-dt div{display:flex;flex-direction:column}
.gs-dt small{font-size:10.5px;color:#64748B;font-weight:700}
.gs-conf{border:2px solid #CBD5E1;border-radius:8px;padding:8px 10px;margin-top:8px;transition:all .4s}
.gs-conf.ok{border-color:#15803D;background:#F0FDF4}
.gs-hol{margin-top:3px;padding:2px 7px;border-radius:5px;background:#FEF3C7;border:1px solid #FCD34D;color:#92400E;font-size:11px;font-weight:800;opacity:0}
.gs-ck{display:flex;gap:7px;align-items:flex-start;font-size:13px;font-weight:600;margin:5px 0;color:#1E293B}
.gs-ck i{width:15px;height:15px;border:2px solid #0F766E;border-radius:3px;flex:none;position:relative;background:#fff;margin-top:1px}
.gs-ck.on i{background:#0F766E}.gs-ck.on i::after{content:"";position:absolute;left:3px;top:0;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.gs-pc{display:inline-block;background:#ECFDF5;border:1px solid #A7F3D0;color:#065F46;border-radius:6px;padding:2px 8px;font-weight:800;font-size:12px;margin:2px 0 0 22px}
.gs-off{opacity:.45}
.gs-ft{display:flex;gap:6px;justify-content:flex-end;padding:9px 14px;border-top:1px solid #E2E8F0}
.gs-box{position:absolute;background:#fff;border-radius:16px;box-shadow:0 10px 26px rgba(15,23,42,.1);padding:16px 20px;opacity:0}
.gs-box h4{margin:0 0 8px;font-size:21px;color:#0B3A53}
.gs-box p,.gs-box li{font-size:16.5px;color:#334155;line-height:1.42;margin:0 0 7px}
.gs-box ul{margin:0;padding-left:20px}
.gs-box.ok{border-left:8px solid #15803D}.gs-box.info{border-left:8px solid #0891B2}.gs-box.warn{border-left:8px solid #F59E0B}
.gs-flow{position:absolute;left:70px;top:146px;width:1140px;display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.gs-flow .st{background:#fff;border-radius:16px;box-shadow:0 10px 26px rgba(15,23,42,.1);padding:14px;min-height:300px;opacity:0;border-top:8px solid #0F766E;position:relative}
.gs-flow .st .n{font-size:12px;font-weight:900;color:#D63384;letter-spacing:.06em;text-transform:uppercase}
.gs-flow .st h4{margin:2px 0 8px;font-size:18px;color:#0B3A53}
.gs-flow .st p{font-size:14.5px;color:#475569;line-height:1.4;margin:0}
.gs-flow .st.w{border-top-color:#0891B2}.gs-flow .st.d{border-top-color:#15803D}
.gs-cal{position:absolute;background:#fff;border-radius:14px;box-shadow:0 10px 26px rgba(15,23,42,.1);padding:12px 14px;opacity:0;font-family:Arial,Helvetica,sans-serif}
.gs-cal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;font-size:11px;text-align:center;color:#475569}
.gs-cal .g b{font-size:10px;color:#94A3B8}
.gs-cal .g span{padding:5px 0;border-radius:50%}
.gs-cal .g span.ev{background:#FEE2E2;color:#B91C1C;font-weight:800}
.gs-cal .it{margin-top:8px;border-left:4px solid #DC2626;background:#FEF2F2;border-radius:6px;padding:6px 8px;font-size:12px;color:#7F1D1D;font-weight:700}
/* ---------- quiz (qz- prefix) ---------- */
.scene.quiz{background:linear-gradient(135deg,#F0FDF4,#E0F7FA)}
.qz-wrap{position:absolute;left:0;top:0;right:0;bottom:0}
.qz-intro{position:absolute;left:120px;top:190px;width:1040px;text-align:center;font-size:30px;font-weight:800;color:#0B3A53;line-height:1.35;animation:rise .5s both}
.qz-intro small{display:block;font-size:20px;color:#475569;font-weight:700;margin-top:14px}
.qz-card{position:absolute;left:120px;top:138px;width:1040px;background:#fff;border-radius:20px;box-shadow:0 18px 40px rgba(15,23,42,.14);padding:22px 30px;animation:rise .5s both}
.qz-n{font-size:14px;font-weight:900;color:var(--pink);letter-spacing:.08em;text-transform:uppercase}
.qz-q{font-size:27px;font-weight:800;line-height:1.25;margin:6px 0 16px}
.qz-o{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;font-size:21px;font-weight:700;background:#F8FAFC;border:3px solid #E2E8F0;border-radius:14px;padding:11px 16px;margin-bottom:10px;cursor:pointer;transition:border-color .2s,background .2s;color:var(--ink)}
.qz-o:hover:not([disabled]){border-color:#0891B2;background:#F0F9FF}
.qz-o[disabled]{cursor:default}
.qz-o .qz-L{width:38px;height:38px;border-radius:50%;background:#0E7490;color:#fff;display:flex;align-items:center;justify-content:center;flex:none;font-weight:900}
.qz-o.qz-no{border-color:#DC2626;background:#FEF2F2;animation:qzshake .4s}.qz-o.qz-no .qz-L{background:#DC2626}
.qz-o.qz-yes{border-color:#16A34A;background:#F0FDF4}.qz-o.qz-yes .qz-L{background:#16A34A}
.qz-fb{min-height:30px;font-size:19px;font-weight:700;margin-top:4px}.qz-fb.good{color:#15803D}.qz-fb.bad{color:#B91C1C}
.qz-stars{position:absolute;right:60px;top:46px;display:flex;gap:8px}
.qz-stars i{width:36px;height:36px;background:#E2E8F0;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);transition:background .3s}
.qz-stars i.on{background:#F59E0B;animation:popn .6s}
@keyframes qzshake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
</style></head><body>
<div id="view"><div id="stage"><div id="nbar"><i></i></div>
<div id="scenes"></div>
<div id="spot"></div>
<svg id="cursor" viewBox="0 0 28 32"><path d="M3 2 L3 26 L9.5 19.5 L14 29 L18.5 27 L14 17.5 L23 17.5 Z" fill="#fff" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/></svg>
</div></div>
<div id="cap" aria-live="polite"></div>
<div id="bar">
 <button id="prev">Back</button><button id="play">Start</button><button id="next">Next</button>
 <div id="dots"></div>
 <button id="capbtn" aria-pressed="false">Captions</button><button id="voice" aria-pressed="true">Voice on</button>
</div>
<script>
const DECK_ID='group-screening-requests';

const LOGO='../logo_blue.png';
const LOGOBOX=`<div style="position:absolute;left:70px;top:22px;background:#fff;border-radius:14px;padding:6px 10px;box-shadow:0 4px 14px rgba(0,0,0,.18);animation:rise .6s both"><img src="${LOGO}" alt="LDAH" style="height:80px;display:block"></div>`;
function all(s){return[...document.querySelectorAll('.scene.on '+s)]}
const show=(e,ms=500)=>anim(e,[{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],ms,'ease-out').then(()=>{e.style.opacity=1});
const PTS=(items,top=140)=>`<div class="abs" style="left:790px;top:${top}px;width:440px"><ul class="pts">${items.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
const tapEl=async(el,ms=700)=>{await move(el,ms);click()};
/* Made-up request used on every screen. */
const ORG='Sunshine Preschool', WHO='Alex Sample';
const YNP=(v)=>`<div class="gs-ynp">${['Yes','No','Pending'].map(o=>`<span class="${o===v?'on':''}">${o}</span>`).join('')}</div>`;
const CHK=(t,on,k='')=>`<label class="gs-ck${on?' on':''}"${k?` data-k="${k}"`:''}><i></i>${t}</label>`;

/* ---- quiz: the standard ask()/QUIZ pair. Each answer goes to ldahTrack.quiz(sec,i,correct). ---- */
window.QUIZ_TOTAL=3;
function ask(Q,i,sec){const w=q('.qz-wrap');
 w.innerHTML=`<div class="qz-card"><div class="qz-n">Question ${i+1} of 3</div><div class="qz-q">${Q.q}</div>${Q.o.map((o,j)=>`<button class="qz-o" data-j="${j}"><span class="qz-L">${'ABC'[j]}</span><span>${o}</span></button>`).join('')}<div class="qz-fb"></div></div>`;
 const card=w.firstChild,fb=card.querySelector('.qz-fb'),btns=[...card.querySelectorAll('.qz-o')];
 const finish=()=>{btns.forEach(b=>b.disabled=true);btns[Q.a].classList.add('qz-yes');const st=document.querySelectorAll('.scene.on .qz-stars i')[i];if(st)st.classList.add('on');fb.className='qz-fb good';fb.textContent='Yes! '+Q.y};
 if(FAST){finish();return Promise.resolve()}
 return new Promise(res=>{btns.forEach((b,j)=>b.onclick=async()=>{
  if(b.disabled)return;
  if(window.ldahTrack)ldahTrack.quiz(sec,i,j===Q.a);
  if(j===Q.a){finish();const p=pos(b);confetti(p.x+60,p.y+20,70);await speak('Yes! '+Q.y,run);await wait(700);res()}
  else{b.disabled=true;b.classList.add('qz-no');fb.className='qz-fb bad';fb.textContent='Not quite. '+Q.n+' Try again.';speak('Not quite. '+Q.n+' Try again.',run)}})})}
const QUIZ=(sec,qs)=>({cls:'quiz',html:()=>HEAD('Quick check','Your turn!')+`<div class="qz-stars">${qs.map(()=>'<i></i>').join('')}</div><div class="qz-wrap"><div class="qz-intro">Three quick questions.<small>Your first answer to each one counts. Click the answer you think is right.</small></div></div>`,
 steps:[{say:'Quick check. Three quick questions. Your first answer to each one counts.'},
  ...qs.map((Q,i)=>({say:`Question ${i+1}. ${Q.q}`,act:()=>ask(Q,i,sec)}))]});

const SC=[
// ================= 1. COVER =================
{cls:'cover',html:()=>`${LOGOBOX}<div class="brand">Leadership in Disabilities &amp; Achievement of Hawaiʻi · School Readiness</div><div class="hello">Aloha <span class="nm"></span></div>
 <h1>Scheduling a Group Screening</h1><p class="sub" style="top:356px">A school or program asks for a screening on the website or the app. You get a task, fill in the worksheet in DAN, email them, and confirm the date.</p>
 <div style="position:absolute;left:820px;top:96px;width:380px;transform:rotate(3deg);animation:bob 6s ease-in-out infinite;z-index:3"><div class="gs-win" style="position:relative;opacity:1"><div class="hd">Provider Screening Services Request</div><div class="bd">
  <div class="gs-lb">What kind of screening do you need?</div><div class="gs-choice"><b>Individual screening</b><span>One child.</span></div><div class="gs-choice on"><b>Group screening</b><span>A school, program, location or event.</span></div></div></div></div>
 <div class="spark" style="left:790px;top:86px">${SPARK}</div><div class="spark" style="left:1200px;top:560px;animation-delay:1s">${SPARK}</div>
 <div class="gate" style="top:500px"><button class="btn" data-go="start">Start training</button><button class="btn ghost" data-go="skip">Skip for now</button><label><input type="checkbox" id="voiceChk" checked> Read it out loud to me</label></div>${WAVES}`,
 steps:[{say:"Aloha {name}! This short training shows how a group screening gets scheduled. A school or program asks on the website or the app. You get a task, fill in the worksheet in DAN, email them, and confirm the date. You can pause, go back, or watch again any time."}]},

// ================= 2. HOW IT WORKS =================
{html:()=>HEAD('How it works','Five steps, start to finish')+`<div class="gs-flow">
 <div class="st w"><div class="n">1 · Website or app</div><h4>They ask</h4><p>A school or program fills in the <b>Provider Screening Services Request</b>: how many children, which screenings, the dates that work.</p></div>
 <div class="st"><div class="n">2 · My Day</div><h4>You get a task</h4><p><b>New screening request from</b> the school, with everything they answered.</p></div>
 <div class="st"><div class="n">3 · DAN</div><h4>Worksheet</h4><p>Website Data &rarr; Provider Requests. Fill in the <b>worksheet</b> and <b>email</b> them to settle a date.</p></div>
 <div class="st d"><div class="n">4 · DAN</div><h4>Confirm date</h4><p>Press <b>Confirm date</b>. It goes on the <b>staff calendar</b>, and you get the next task.</p></div>
 <div class="st d"><div class="n">5 · DAN</div><h4>Finish the checklist</h4><p>Confirmation email, Outlook event, Parent Consultants. Tick them off, and the task <b>closes itself</b>.</p></div></div>`,
 steps:[{say:"Here is how it works, in five steps.",act:async()=>{}},
 {say:"One. A school or program fills in the Provider Screening Services Request on the website or in the app.",act:async()=>{await show(all('.gs-flow .st')[0])}},
 {say:"Two. You get a task on My Day, with everything they answered.",act:async()=>{await show(all('.gs-flow .st')[1])}},
 {say:"Three. In DAN, under Website Data and Provider Requests, you fill in the worksheet and email them to settle a date.",act:async()=>{await show(all('.gs-flow .st')[2])}},
 {say:"Four. You press Confirm date. The screening goes on the staff calendar, and you get the next task.",act:async()=>{await show(all('.gs-flow .st')[3])}},
 {say:"Five. You finish the checklist: the confirmation email, the Outlook event, and the Parent Consultants. Tick them off, and the task closes itself.",act:async()=>{await show(all('.gs-flow .st')[4])}}]},

// ================= 3. WHAT THEY SEE: START =================
{html:()=>HEAD('What the school sees','The School Readiness page')+`
 <div class="gs-site k-s1" style="left:58px;top:130px;width:330px"><b>Vision Screening</b><p>Click to request a screening</p></div>
 <div class="gs-site k-s2" style="left:58px;top:206px;width:330px"><b>Hearing Screening</b><p>Click to request a screening</p></div>
 <div class="gs-site k-s3" style="left:58px;top:282px;width:330px"><b>Developmental Screening</b><p>Click to request a screening</p></div>
 <div class="gs-site k-s4" style="left:58px;top:370px;width:330px;border-left-color:#F0803C"><b>Contact Us Today</b><p>The orange Schedule a Screening banner</p></div>
 <div class="gs-site k-s5" style="left:58px;top:446px;width:330px"><b>Request Services</b><p>On the Provider Screening Services card</p></div>
 <div class="gs-win k-w" style="left:420px;top:130px;width:350px"><div class="hd">Provider Screening Services Request</div><div class="bd">
  <div class="gs-lb">What kind of screening do you need?</div>
  <div class="gs-choice k-ind"><b>Individual screening</b><span>One child. Book a free screening at our office.</span></div>
  <div class="gs-choice k-grp"><b>Group screening</b><span>A school, program, location or event with several children.</span></div></div></div>`+PTS([
 'Five places on the page open the request.',
 'First question: <b>Individual</b> or <b>Group</b>.',
 '<b>Individual</b> goes to booking at our office. No request is made.',
 '<b>Group</b> goes on to the request form.']),
 steps:[{say:"First, what the school sees. On the School Readiness page of the website, and in the app, five places open the request: the three screening cards, Contact Us Today in the orange banner, and Request Services.",li:0,act:async()=>{for(const k of ['.k-s1','.k-s2','.k-s3','.k-s4','.k-s5'])await show(q(k),300)}},
 {say:"The first question is: What kind of screening do you need? Individual, or group.",li:1,act:async()=>{await show(q('.k-w'))}},
 {say:"Individual is one child. That takes them to booking at our office, so no request comes to you.",li:2,act:async()=>{spot(q('.k-ind'),4)}},
 {say:"Group is a school, program, location or event. That goes on to the request form.",li:3,act:async()=>{spot(null);await tapEl(q('.k-grp'));q('.k-grp').classList.add('on')}}]},

// ================= 4. THE FORM =================
{html:()=>HEAD('What the school sees','The request form')+`<div class="gs-win k-f" style="left:58px;top:118px;width:712px"><div class="hd">Provider Screening Services Request</div><div class="bd" style="display:grid;grid-template-columns:1fr 1fr;gap:0 18px">
 <div><div class="gs-lb">Organization Name <span class="r">*</span></div><div class="gs-in">${ORG}</div>
  <div class="gs-lb">Point of Contact <span class="r">*</span></div><div class="gs-in">${WHO}</div>
  <div class="gs-lb">Who is the screening for?</div><div class="gs-chips"><span class="on">School</span><span>Person</span><span>Location</span><span>Event</span></div>
  <div class="gs-lb">More than one location?</div><div class="gs-chips"><span>Yes</span><span class="on">No</span></div>
  <div class="gs-lb">Site(s)</div><div class="gs-in">Sunshine Preschool, Honolulu</div></div>
 <div class="k-req"><div class="gs-lb">How many children? <span class="r">*</span></div><div class="gs-in">40</div>
  <div class="gs-lb">Children&rsquo;s ages</div><div class="gs-in">3 to 5 years old</div>
  <div class="gs-lb">Which screenings? <span class="r">*</span></div><div class="gs-chips"><span class="on">Hearing</span><span class="on">Vision</span><span>Developmental</span><span>Social Emotional</span></div>
  <div class="gs-lb">Island</div><div class="gs-in">Oʻahu</div>
  <div class="gs-lb k-dates">Days and times that work</div><div class="gs-row k-dates2"><div class="gs-in">1st: Mon, Dec 7</div><div class="gs-in">8:30 a.m.</div></div><div class="gs-row" style="margin-top:5px"><div class="gs-in">2nd: Wed, Dec 9</div><div class="gs-in">8:30 a.m.</div></div></div></div></div>`+PTS([
 'The questions are the first part of the paper worksheet.',
 '<b>Required</b>: how many children (or Not sure yet), and which screenings.',
 'Two dates with a start time. <b>Not required</b>.']),
 steps:[{say:"This is the request form. Its questions are the first part of our paper scheduling worksheet: who the screening is for, more than one location, the sites, how many children, their ages, which screenings, and the island.",li:0,act:async()=>{await show(q('.k-f'))}},
 {say:"Two answers are required: how many children, or Not sure yet, and which screenings.",li:1,act:async()=>{spot(q('.k-req'),4)}},
 {say:"They can also give two dates with a start time. Those are not required, so some requests come in with no dates.",li:2,act:async()=>{spot(null)}}]},

// ================= 5. MY DAY TASK =================
{html:()=>HEAD('Your task','It lands on My Day')+`<div class="gs-task k-t" style="left:58px;top:140px;width:712px"><div class="s">New screening request from ${ORG} (40 children)</div><div class="m">Open · Provider Onboarding · follow-up tomorrow</div>
 <div style="font-size:12.5px;color:#475569;line-height:1.5;white-space:pre-line;margin-bottom:8px">${WHO} -- alex@example.com
Screening for: School · Children: 40 · Ages: 3 to 5
Screenings: Hearing, Vision · Island: Oʻahu
1st choice: Dec 7 at 8:30 · 2nd choice: Dec 9 at 8:30</div><span class="gs-btn k-open">Open the request &rarr;</span></div>`+PTS([
 'Every new request makes <b>one task</b>, due the <b>next day</b>.',
 'The notes hold <b>everything they answered</b>.',
 '<b>Open the request</b> takes you straight to it in DAN.']),
 steps:[{say:"Every new request puts one task on your My Day, due the next day. New screening request from, then the school, and how many children.",li:0,act:async()=>{await show(q('.k-t'))}},
 {say:"The notes hold everything they answered: the contact, the children, the screenings, the island, and their dates.",li:1,act:async()=>{spot(q('.k-t'),4)}},
 {say:"Press Open the request. It takes you straight to it in DAN.",li:2,act:async()=>{spot(null);await tapEl(q('.k-open'))}}]},

// ================= 6. THE CARD =================
{html:()=>HEAD('In DAN','Website Data → Provider Requests')+`<div class="gs-filt k-fl" style="left:58px;top:126px"><span>All</span><span>New</span><span>Reviewed</span><span>Contacted</span><span class="on k-cf">Confirmed</span></div>
 <div class="gs-card k-c" style="left:58px;top:176px;width:520px"><span class="gs-badge">New</span><div class="o">${ORG}</div><div class="c">${WHO} · alex@example.com</div>
 <div class="sc">Screening · 40 children · Hearing, Vision · Oʻahu</div><div class="c">Asked for: Mon, Dec 7, 8:30 a.m. or Wed, Dec 9, 8:30 a.m.</div>
 <div style="margin-top:10px"><span class="gs-sb">New</span><span class="gs-sb">Reviewed</span><span class="gs-sb">Contacted</span> <span class="gs-btn k-ws">Worksheet</span> <span class="gs-btn o k-em">Email contact</span></div></div>`+PTS([
 'CMS &rarr; <b>Website Data</b> &rarr; <b>Provider Requests</b>.',
 'The card shows the children, screenings, island and their dates.',
 '<b>Worksheet</b> and <b>Email contact</b> are on the card.',
 'The <b>Confirmed</b> filter shows the ones with a date.']),
 steps:[{say:"The request lives in DAN under CMS, Website Data, Provider Requests.",li:0,act:async()=>{await show(q('.k-c'))}},
 {say:"The card shows the school, the contact, the number of children, the screenings, the island, and the dates they asked for.",li:1,act:async()=>{spot(q('.k-c'),4)}},
 {say:"Two buttons do the work: Worksheet, and Email contact.",li:2,act:async()=>{spot(null);spot(q('.k-ws').parentElement,4)}},
 {say:"Once a date is confirmed, the card turns teal, and the Confirmed filter shows them all.",li:3,act:async()=>{spot(null);await show(q('.k-fl'));spot(q('.k-cf'),4)}}]},

// ================= 7. WORKSHEET: BEFORE CONFIRMING =================
{html:()=>HEAD('The worksheet','Part 1: before confirming')+`<div class="gs-win k-w" style="left:58px;top:118px;width:712px"><div class="hd t">Screening worksheet<small>${ORG} · ${WHO}</small></div><div class="bd">
 <div style="background:#F8FAFC;border:1px solid #E2E8F0;border-radius:6px;padding:6px 10px;font-size:12.5px"><b>They asked for:</b> 1st choice: Mon, Dec 7, 8:30 a.m. · 2nd choice: Wed, Dec 9, 8:30 a.m.</div>
 <div class="gs-sec">Before confirming</div>
 <div class="gs-q"><div>Screening for a school, person, location or event?</div>${YNP('Yes')}</div>
 <div class="gs-q"><div>Screening at more than one location?</div>${YNP('No')}</div>
 <div class="gs-q"><div>Do you know how many children will be screened? <b>40</b> · ages 3 to 5</div>${YNP('Yes')}</div>
 <div class="gs-q"><div>Do you know what screening will be done? <b>Hearing, Vision</b></div>${YNP('Yes')}</div>
 <div class="gs-q k-q5"><div>Did you offer two dates with times starting at 8:30 a.m.?</div>${YNP('')}</div></div></div>`+PTS([
 '<b>Worksheet</b> opens the paper sheet on screen.',
 'Their answers are <b>filled in for you</b>.',
 'Mark each <b>Yes</b>, <b>No</b> or <b>Pending</b>.',
 'Change anything that turns out different.']),
 steps:[{say:"Press Worksheet. It is our paper scheduling worksheet, on screen.",li:0,act:async()=>{await show(q('.k-w'))}},
 {say:"The first time you open it, their answers are already filled in: who it is for, the locations, the children, and the screenings.",li:1,act:async()=>{spot(q('.k-w .bd'),2)}},
 {say:"Mark each question Yes, No or Pending, the same as the paper columns.",li:2,act:async()=>{spot(null);const b=q('.k-q5 .gs-ynp span');await tapEl(b);b.classList.add('on')}},
 {say:"If something turns out different when you talk to them, change it here.",li:3,act:async()=>{}}]},

// ================= 8. WORKSHEET: DATES =================
{html:()=>HEAD('The worksheet','Part 2: the dates')+`<div class="gs-win k-w" style="left:58px;top:118px;width:712px"><div class="hd t">Screening worksheet<small>${ORG} · ${WHO}</small></div><div class="bd">
 <div class="gs-sec">Dates</div>
 <div class="gs-dt"><div><small>Island</small><div class="gs-in">Oʻahu</div></div><div><small>Date offered (LDAH)</small><div class="gs-in">12/07/2026</div></div><div><small>Start</small><div class="gs-in">8:30 AM</div></div><div><small>2nd date offered</small><div class="gs-in">12/09/2026</div></div></div>
 <div class="gs-dt"><div><small>Alternate date</small><div class="gs-in k-alt">01/18/2027</div><div class="gs-hol k-hol">Office closed: Martin Luther King Jr. Day</div></div><div><small>Start</small><div class="gs-in">8:30 AM</div></div></div>
 <div class="gs-conf k-conf"><b>Confirmed date</b><div class="gs-dt"><div><small>Date</small><div class="gs-in">12/07/2026</div></div><div><small>Start</small><div class="gs-in">8:30 AM</div></div><div><small>End</small><div class="gs-in">11:30 AM</div></div><div style="flex:1"><small>Location</small><div class="gs-in">Sunshine Preschool, Honolulu</div></div></div></div>
 <p style="font-size:11.5px;color:#64748B;font-style:italic;margin:8px 0 0">Preschools need time to send consent forms to parents and get them back signed. One week from when the school receives the forms is the suggested time frame.</p></div></div>`+PTS([
 '<b>Dates offered</b>, and <b>alternate dates</b>.',
 'An office holiday shows <b>Office closed</b>, and Save asks first.',
 '<b>Confirmed date</b>: date, start, end and location.',
 'Leave time for the <b>consent forms</b>.']),
 steps:[{say:"Next, the dates. Enter the island and the dates you offered, with start times. Screenings can start at 8:30.",li:0,act:async()=>{await show(q('.k-w'))}},
 {say:"Add any alternate dates. If you pick an office holiday, a yellow Office closed note shows, and Save asks before it keeps it.",li:1,act:async()=>{spot(q('.k-alt').parentElement,4);await show(q('.k-hol'),400)}},
 {say:"When you and the school agree, fill in the confirmed date: the date, the start and end time, and the location.",li:2,act:async()=>{spot(null);spot(q('.k-conf'),4)}},
 {say:"Remember the note from the paper sheet. Preschools need time to send consent forms home and get them back signed. About one week after the school gets the forms.",li:3,act:async()=>{spot(null)}}]},

// ================= 9. EMAIL CONTACT =================
{html:()=>HEAD('Email contact','Write to them from DAN')+`<div class="gs-win k-em" style="left:58px;top:118px;width:712px"><div class="hd">Email ${WHO}<small>alex@example.com · from registration@, you are copied and replies come to you</small></div><div class="bd">
 <div class="gs-lb">Subject</div><div class="gs-in">Your screening request for ${ORG}</div>
 <div class="gs-lb">Message</div><div class="gs-in" style="white-space:pre-line;line-height:1.5;min-height:150px">Aloha Alex,

Mahalo for your screening request. We can offer Mon, Dec 7, 2026, 8:30 a.m. or Wed, Dec 9, 2026, 8:30 a.m. Please let me know which one works for you.

If you have any questions, just reply to this email.</div>
 <p style="font-size:11.5px;color:#64748B;font-style:italic;margin:6px 0 0">Your name and the School Readiness Project sign-off are added at the bottom.</p></div>
 <div class="gs-ft"><span class="gs-btn w">Cancel</span><span class="gs-btn k-send" style="background:#1a3c6e">Send email</span></div></div>`+PTS([
 '<b>Email contact</b> opens a ready-made draft.',
 'Before a date: it offers your <b>dates offered</b>.',
 'After: it confirms the <b>date, time and location</b>.',
 'Edit it, then <b>Send</b>. You are copied, replies come to you.']),
 steps:[{say:"Press Email contact to write to them from DAN. It opens a draft for you.",li:0,act:async()=>{await show(q('.k-em'))}},
 {say:"Before a date is confirmed, the draft offers the dates you put in the worksheet.",li:1,act:async()=>{}},
 {say:"After you confirm, the draft says the screening is confirmed, with the date, time and location.",li:2,act:async()=>{}},
 {say:"Change anything you like, then press Send email. It goes from registration at, with your name. You are copied, their reply comes to you, and it is saved in the Email Log. The request moves to Contacted.",li:3,act:async()=>{await tapEl(q('.k-send'))}}]},

// ================= 10. CONFIRM DATE =================
{html:()=>HEAD('Confirm date','One button does three things')+`
 <div class="gs-cal k-cal" style="left:70px;top:140px;width:340px"><b style="font-size:14px;color:#0B3A53">December 2026</b><div class="g" style="margin-top:6px">${['S','M','T','W','T','F','S'].map(d=>`<b>${d}</b>`).join('')}${'<span></span>'.repeat(2)}${Array.from({length:31},(_,i)=>`<span class="${i+1===7?'ev':''}">${i+1}</span>`).join('')}</div>
  <div class="it">Screening: ${ORG} (40 children)</div></div>
 <div class="gs-box ok k-b1" style="left:440px;top:140px;width:770px"><h4>1 · On the staff calendar</h4><p>A red entry on the <b>Dashboard</b> and <b>Events Dashboard</b> calendars. It is internal: the website and app never show it.</p></div>
 <div class="gs-box info k-b2" style="left:440px;top:290px;width:770px"><h4>2 · The new-request task closes</h4><p>The <b>New screening request</b> task on My Day closes by itself.</p></div>
 <div class="gs-box warn k-b3" style="left:440px;top:420px;width:770px"><h4>3 · You get the worksheet task</h4><p><b>Complete the screening worksheet</b>, with an <b>Open the worksheet</b> button. Changed the date later? Press <b>Update confirmed date</b>.</p></div>`,
 steps:[{say:"With the confirmed date filled in, press Confirm date. One button does three things.",act:async()=>{}},
 {say:"One. The screening goes on the staff calendar, in red, on the Dashboard and the Events Dashboard. It is internal, so the website and the app never show it.",act:async()=>{await show(q('.k-cal'));await show(q('.k-b1'))}},
 {say:"Two. The New screening request task on your My Day closes by itself.",act:async()=>{await show(q('.k-b2'))}},
 {say:"Three. You get the next task: Complete the screening worksheet, with an Open the worksheet button. If the date changes later, open the worksheet and press Update confirmed date.",act:async()=>{await show(q('.k-b3'));spot(q('.k-b3'),4)}}]},

// ================= 11. UPON CONFIRMATION =================
{html:()=>HEAD('The worksheet','Part 3: upon confirmation')+`<div class="gs-win k-w" style="left:58px;top:118px;width:712px"><div class="hd t">Screening worksheet<small>${ORG} · Confirmed: Mon, Dec 7, 8:30 a.m.</small></div><div class="bd">
 <div class="gs-sec">Upon confirmation</div>
 ${CHK('Confirmation email sent: date, time, location and the screening to be done',false,'em')}
 <div style="margin-left:22px;display:grid;grid-template-columns:1fr 1fr;gap:0 10px">${['(1) Parent Cover Letter','(2) Consent to Screen & Obtain and Release','(3) Flyer','(4) SRP Brochure','(5) Factsheet','(6) Informational Video'].map((t,i)=>CHK(t,false,'a'+i)).join('')}</div>
 ${CHK('Outlook event created from the Public Calendar template',false,'ol')}
 ${CHK('Parent Consultants assigned',false,'pc')}<span class="gs-pc k-pc">40 children: 3 PCs</span>
 <div class="gs-in" style="margin:6px 0 0 22px">Which PCs</div></div></div>`+PTS([
 'The bottom of the paper sheet, as tick boxes.',
 'The confirmation email and its <b>6 attachments</b>.',
 'The <b>Outlook event</b>, then the <b>Parent Consultants</b>.',
 'DAN works out <b>how many PCs</b> from the children.']),
 steps:[{say:"Once the date is confirmed, the last part of the worksheet opens: Upon confirmation. It is the bottom of the paper sheet, as tick boxes.",li:0,act:async()=>{await show(q('.k-w'))}},
 {say:"Send the confirmation email with the date, time, location and the screening. Tick it, and tick each of the six attachments you sent.",li:1,act:async()=>{const c=q('.gs-ck[data-k="em"]');await tapEl(c);c.classList.add('on');for(let i=0;i<6;i++){q(`.gs-ck[data-k="a${i}"]`).classList.add('on');await wait(120)}}},
 {say:"Then create the Outlook event from the Public Calendar template, and assign the Parent Consultants.",li:2,act:async()=>{const c=q('.gs-ck[data-k="ol"]');await tapEl(c);c.classList.add('on')}},
 {say:"DAN works out how many Parent Consultants you need from the number of children. Here, 40 children need 3.",li:3,act:async()=>{spot(q('.k-pc'),6)}}]},

// ================= 12. PC RULE + DONE =================
{html:()=>HEAD('Good to know','How many Parent Consultants, and finishing up')+`
 <div class="gs-box info k-r" style="left:70px;top:140px;width:540px"><h4>Parent Consultants by head count</h4>
  <ul><li><b>0 to 15</b> children: <b>1</b> PC</li><li><b>16 to 30</b>: <b>2</b> PCs</li><li><b>31 to 75</b>: <b>3</b> PCs</li><li><b>76 to 150</b>: <b>4</b> PCs</li><li>Over 150: plan more</li></ul></div>
 <div class="gs-box ok k-d" style="left:650px;top:140px;width:560px"><h4>Tick the last box, press Save</h4><p>When every box is ticked and saved, the <b>Complete the screening worksheet</b> task <b>closes itself</b>.</p><p>Notes go in the <b>Notes</b> box at the bottom of the worksheet.</p></div>
 <div class="gs-box warn k-x" style="left:70px;top:420px;width:1140px"><h4>The attachments</h4><p>The six attachments are tick boxes for now. Attach them to your confirmation email yourself, then tick each one.</p></div>`,
 steps:[{say:"Here is the Parent Consultant rule from the paper sheet. Up to 15 children, one PC. 16 to 30, two. 31 to 75, three. 76 to 150, four. Over 150, plan more.",act:async()=>{await show(q('.k-r'))}},
 {say:"When every box is ticked and you press Save, the Complete the screening worksheet task closes itself. Anything else goes in the Notes box.",act:async()=>{await show(q('.k-d'))}},
 {say:"One more thing. The six attachments are tick boxes for now. Attach them to your confirmation email yourself, then tick each one.",act:async()=>{await show(q('.k-x'));spot(q('.k-x'),4)}}]},

// ================= 13. QUIZ =================
QUIZ('Scheduling a group screening',[
 {q:'A parent picks Individual screening on the form. What happens?',o:['You get a New screening request task.','They go to booking a free screening at our office. No request comes to you.','The request goes to the Pacific partners.'],a:1,y:'Individual is one child, so it goes to office booking.',n:'Only Group screening makes a request.'},
 {q:'You and the school agree on Monday, December 7. What do you do in DAN?',o:['Fill in the Confirmed date and press Confirm date.','Add it to the Staff Calendar by hand.','Close the request task and wait.'],a:0,y:'Confirm date puts it on the calendar and gives you the worksheet task.',n:'One button does the calendar and the tasks for you.'},
 {q:'The school expects 60 children. How many Parent Consultants?',o:['1','2','3'],a:2,y:'31 to 75 children need 3 PCs.',n:'Check the head-count rule: 31 to 75.'}]),

{cls:'cover',html:()=>`${LOGOBOX}<div class="brand">Scheduling a Group Screening</div><div class="hello">All done</div><h1>Mahalo<span class="nmc"></span>!</h1><p class="sub">From request to confirmed date, all in DAN. Come back and watch it again any time.</p>
