<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>In-Office Help: Office Volunteer Days — Training</title>
<link rel="stylesheet" href="deck-base.css">
<!-- Same Firebase build as the dashboard, so the deck shares its sign-in and records progress. -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
/* Every class here starts with oh- or qz- so nothing collides with deck-base.css.
   The pictures are real screens from live DAN and ldahawaii.org (2026-11-12), filled with a
   made-up schedule. Every volunteer name, email and phone number in them is made up. */
.oh-fr{position:absolute;overflow:hidden;background:#fff;border:1px solid #D5DEE8;border-radius:14px;box-shadow:0 14px 36px rgba(15,23,42,.16);z-index:4;animation:rise .5s both}
.oh-fr img{position:absolute;left:0;top:0;transform-origin:0 0;display:block;max-width:none}
.oh-fr.web{background:#F8FAFC}
.oh-tag{position:absolute;z-index:5;font-size:13px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:#fff;border-radius:999px;padding:4px 12px;animation:rise .5s .1s both}
.oh-tag.dan{background:#15803D}.oh-tag.web{background:#0891B2}.oh-tag.pub{background:#7C3AED}
.oh-why{position:absolute;left:70px;top:132px;width:1140px;display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.oh-wc{background:#fff;border-radius:16px;box-shadow:0 10px 26px rgba(15,23,42,.1);padding:16px 18px;border-top:8px solid #15803D;opacity:0;height:330px;position:relative;overflow:hidden}
.oh-wc.t{border-top-color:#0891B2}.oh-wc.p{border-top-color:#7C3AED}
.oh-wc .when{font-size:13px;font-weight:800;color:#D63384;letter-spacing:.06em;text-transform:uppercase}
.oh-wc h4{margin:2px 0 10px;font-size:22px;color:#0B3A53}
.oh-wc p{font-size:16.5px;color:#475569;line-height:1.4;margin:0;position:absolute;left:18px;right:18px;bottom:16px}
.oh-wc p b{color:#0F172A}
.oh-art{height:160px;border-radius:10px;overflow:hidden;position:relative;background:#F1F5F9}
.oh-art img{position:absolute;left:0;top:0;transform-origin:0 0}
.oh-strip{position:absolute;left:70px;top:500px;width:1140px;display:flex;align-items:center;opacity:0}
.oh-strip div{flex:1;text-align:center;font-size:16px;font-weight:700;color:#0B3A53;position:relative;padding-top:30px}
.oh-strip div::before{content:"";position:absolute;left:50%;top:6px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#15803D;border:3px solid #fff;box-shadow:0 0 0 2px #15803D;z-index:1}
.oh-strip div::after{content:"";position:absolute;left:0;right:0;top:13px;height:3px;background:#BBF7D0}
.oh-strip div:first-child::after{left:50%}.oh-strip div:last-child::after{right:50%}
.oh-strip small{display:block;font-size:13px;color:#64748B;font-weight:600}
.oh-off{position:absolute;left:70px;top:140px;width:1140px;display:grid;grid-template-columns:1fr 1fr;gap:26px}
.oh-box{background:#fff;border-radius:16px;box-shadow:0 10px 26px rgba(15,23,42,.1);padding:20px 24px;opacity:0}
.oh-box h4{margin:0 0 10px;font-size:23px;color:#0B3A53}
.oh-box p,.oh-box li{font-size:18px;color:#334155;line-height:1.45;margin:0 0 8px}
.oh-box ul{margin:0;padding-left:22px}
.oh-box.warn{border-left:8px solid #F59E0B}.oh-box.ok{border-left:8px solid #15803D}.oh-box.info{border-left:8px solid #0891B2}
.oh-rep{position:absolute;left:70px;top:140px;width:640px;background:#fff;border-radius:16px;box-shadow:0 14px 36px rgba(15,23,42,.14);overflow:hidden;opacity:0;font-family:Arial,Helvetica,sans-serif}
.oh-rep .h{background:#0E7490;color:#fff;font-weight:800;font-size:18px;padding:12px 18px}
.oh-rep .s{padding:12px 18px;border-bottom:1px solid #E2E8F0}
.oh-rep .s b{display:block;font-size:14px;color:#0B3A53;margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
.oh-rep .r{font-size:15px;color:#334155;padding:3px 0;display:flex;gap:10px}
.oh-rep .r i{font-style:normal;font-size:12px;font-weight:800;border-radius:999px;padding:1px 8px;background:#ECFEFF;color:#0E7490;align-self:center}
.oh-rep .r i.n{background:#FEF3C7;color:#92400E}.oh-rep .r i.c{background:#FEF2F2;color:#B91C1C}
/* ---------- quiz (qz- prefix) ---------- */
.scene.quiz{background:linear-gradient(135deg,#F0FDF4,#E0F7FA)}
.qz-wrap{position:absolute;left:0;top:0;right:0;bottom:0}
.qz-intro{position:absolute;left:120px;top:190px;width:1040px;text-align:center;font-size:30px;font-weight:800;color:#0B3A53;line-height:1.35;animation:rise .5s both}
.qz-intro small{display:block;font-size:20px;color:#475569;font-weight:700;margin-top:14px}
.qz-card{position:absolute;left:120px;top:138px;width:1040px;background:#fff;border-radius:20px;box-shadow:0 18px 40px rgba(15,23,42,.14);padding:22px 30px;animation:rise .5s both}
.qz-n{font-size:14px;font-weight:900;color:var(--pink);letter-spacing:.08em;text-transform:uppercase}
.qz-q{font-size:27px;font-weight:800;line-height:1.25;margin:6px 0 16px}
.qz-o{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;font-size:21px;font-weight:700;background:#F8FAFC;border:3px solid #E2E8F0;border-radius:14px;padding:11px 16px;margin-bottom:10px;cursor:pointer;transition:border-color .2s,background .2s;color:var(--ink)}
.qz-o:hover:not([disabled]){border-color:#0891B2;background:#F0F9FF}
.qz-o[disabled]{cursor:default}
.qz-o .qz-L{width:38px;height:38px;border-radius:50%;background:#0E7490;color:#fff;display:flex;align-items:center;justify-content:center;flex:none;font-weight:900}
.qz-o.qz-no{border-color:#DC2626;background:#FEF2F2;animation:qzshake .4s}.qz-o.qz-no .qz-L{background:#DC2626}
.qz-o.qz-yes{border-color:#16A34A;background:#F0FDF4}.qz-o.qz-yes .qz-L{background:#16A34A}
.qz-fb{min-height:30px;font-size:19px;font-weight:700;margin-top:4px}.qz-fb.good{color:#15803D}.qz-fb.bad{color:#B91C1C}
.qz-stars{position:absolute;right:60px;top:46px;display:flex;gap:8px}
.qz-stars i{width:36px;height:36px;background:#E2E8F0;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);transition:background .3s}
.qz-stars i.on{background:#F59E0B;animation:popn .6s}
@keyframes qzshake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
</style></head><body>
<div id="view"><div id="stage"><div id="nbar"><i></i></div>
<div id="scenes"></div>
<div id="spot"></div>
<svg id="cursor" viewBox="0 0 28 32"><path d="M3 2 L3 26 L9.5 19.5 L14 29 L18.5 27 L14 17.5 L23 17.5 Z" fill="#fff" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/></svg>
</div></div>
<div id="cap" aria-live="polite"></div>
<div id="bar">
 <button id="prev">Back</button><button id="play">Start</button><button id="next">Next</button>
 <div id="dots"></div>
 <button id="capbtn" aria-pressed="false">Captions</button><button id="voice" aria-pressed="true">Voice on</button>
</div>
<script>
const DECK_ID='in-office-help';

const LOGO='../logo_blue.png';
const LOGOBOX=`<div style="position:absolute;left:70px;top:22px;background:#fff;border-radius:14px;padding:6px 10px;box-shadow:0 4px 14px rgba(0,0,0,.18);animation:rise .6s both"><img src="${LOGO}" alt="LDAH" style="height:80px;display:block"></div>`;
function all(s){return[...document.querySelectorAll('.scene.on '+s)]}
const show=(e,ms=500)=>anim(e,[{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],ms,'ease-out').then(()=>{e.style.opacity=1});
const PTS=(items,top=140)=>`<div class="abs" style="left:790px;top:${top}px;width:440px"><ul class="pts">${items.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;

/* ---- the pictures: [file, natural width, natural height] ---- */
const IMS={
 modal:['01-modal',1092,910], reqform:['02-request-form',567,1061], reqdone:['03-request-done',850,653],
 otop:['04-office-top',1244,819], owhen:['05-office-when',940,838], oabout:['06-office-about',940,671], odone:['07-office-done',940,446],
 menu:['08-dan-menu',379,606], tabs:['09-dan-tabs',1568,179], weekly:['10-dan-weekly',1568,602], special:['11-dan-special',1545,262],
 reqs:['12-dan-requests',1568,212], calw:['13-dan-calendar-week',1568,298], cald:['14-dan-calendar-day',1568,246],
 signups:['15-dan-signups',1480,628], fromreq:['16-dan-special-fromreq',1568,246]};
/* A framed picture. view() pans and zooms it to a region; R() turns a region of the
   picture into stage coordinates for spot() and move(). Never zoomed past KMAX, so it stays sharp. */
const KMAX=.85;
const FR=(key,o={})=>{const [f,w,h]=IMS[key];return `<div class="oh-fr${o.web?' web':''} k-fr-${key}" style="left:${o.l||58}px;top:${o.t||118}px;width:${o.w||712}px;height:${o.h||572}px;${o.st||''}" data-w="${w}" data-h="${h}"><img src="img/office-help/${f}.jpg" width="${w}" height="${h}" alt=""></div>`};
const TAG=(cls,txt,l=790,t=98)=>`<div class="oh-tag ${cls}" style="left:${l}px;top:${t}px">${txt}</div>`;
function view(key,r,ms=800){const fr=q('.k-fr-'+key);if(!fr)return Promise.resolve();const img=fr.firstChild,W=fr.clientWidth,H=fr.clientHeight;
 const [x,y,w,h]=r||[0,0,+fr.dataset.w,+fr.dataset.h];const k=Math.min(W/w,H/h,KMAX);const tx=-x*k+(W-w*k)/2,ty=-y*k+(H-h*k)/2;
 const nx=Math.min(0,Math.max(W-(+fr.dataset.w)*k,tx)),ny=Math.min(0,Math.max(H-(+fr.dataset.h)*k,ty));
 const fx=(+fr.dataset.w)*k<W?(W-(+fr.dataset.w)*k)/2:nx,fy=(+fr.dataset.h)*k<H?(H-(+fr.dataset.h)*k)/2:ny;
 fr._v={k,tx:fx,ty:fy};img.style.transition=(FAST||!ms)?'none':`transform ${ms}ms cubic-bezier(.45,.05,.25,1)`;img.style.transform=`translate(${fx}px,${fy}px) scale(${k})`;return wait(ms)}
function R(key,b){const fr=q('.k-fr-'+key);const p=pos(fr),v=fr._v;return{x:p.x+1+v.tx+b[0]*v.k,y:p.y+1+v.ty+b[1]*v.k,w:b[2]*v.k,h:b[3]*v.k}}
const sp=(key,b,pad=6)=>spot(R(key,b),pad);
const tapAt=async(key,b,ms=800)=>{await move(R(key,b),ms);await click()};
const ART=(key,w,x=0,y=0)=>{const [f]=IMS[key];return `<img src="img/office-help/${f}.jpg" alt="" style="width:${w}px;left:${-x}px;top:${-y}px">`};

/* ---- quiz: the standard ask()/QUIZ pair. Each answer goes to ldahTrack.quiz(sec,i,correct). ---- */
window.QUIZ_TOTAL=3;
function ask(Q,i,sec){const w=q('.qz-wrap');
 w.innerHTML=`<div class="qz-card"><div class="qz-n">Question ${i+1} of 3</div><div class="qz-q">${Q.q}</div>${Q.o.map((o,j)=>`<button class="qz-o" data-j="${j}"><span class="qz-L">${'ABC'[j]}</span><span>${o}</span></button>`).join('')}<div class="qz-fb"></div></div>`;
 const card=w.firstChild,fb=card.querySelector('.qz-fb'),btns=[...card.querySelectorAll('.qz-o')];
 const finish=()=>{btns.forEach(b=>b.disabled=true);btns[Q.a].classList.add('qz-yes');const st=document.querySelectorAll('.scene.on .qz-stars i')[i];if(st)st.classList.add('on');fb.className='qz-fb good';fb.textContent='Yes! '+Q.y};
 if(FAST){finish();return Promise.resolve()}
 return new Promise(res=>{btns.forEach((b,j)=>b.onclick=async()=>{
  if(b.disabled)return;
  if(window.ldahTrack)ldahTrack.quiz(sec,i,j===Q.a);
  if(j===Q.a){finish();const p=pos(b);confetti(p.x+60,p.y+20,70);await speak('Yes! '+Q.y,run);await wait(700);res()}
  else{b.disabled=true;b.classList.add('qz-no');fb.className='qz-fb bad';fb.textContent='Not quite. '+Q.n+' Try again.';speak('Not quite. '+Q.n+' Try again.',run)}})})}
const QUIZ=(sec,qs)=>({cls:'quiz',html:()=>HEAD('Quick check','Your turn!')+`<div class="qz-stars">${qs.map(()=>'<i></i>').join('')}</div><div class="qz-wrap"><div class="qz-intro">Three quick questions.<small>Your first answer to each one counts. Click the answer you think is right.</small></div></div>`,
 steps:[{say:'Quick check. Three quick questions. Your first answer to each one counts.'},
  ...qs.map((Q,i)=>({say:`Question ${i+1}. ${Q.q}`,act:()=>ask(Q,i,sec)}))]});

const SC=[
// ================= 1. COVER =================
{cls:'cover',html:()=>`${LOGOBOX}<div class="brand">Leadership in Disabilities &amp; Achievement of Hawaiʻi · Volunteers</div><div class="hello">Aloha <span class="nm"></span></div>
 <h1>In-Office Help: Office Volunteer Days</h1><p class="sub" style="top:330px">Set the days volunteers can help in the office. They sign up on the website or the app, and you see who is coming in DAN.</p>
 <div style="position:absolute;left:800px;top:90px;width:420px;border-radius:16px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.3);transform:rotate(3deg);animation:bob 6s ease-in-out infinite;z-index:3"><img src="img/office-help/01-modal.jpg" alt="" style="width:100%;display:block"></div>
 <div class="spark" style="left:770px;top:80px">${SPARK}</div><div class="spark" style="left:1200px;top:560px;animation-delay:1s">${SPARK}</div>
 <div class="gate" style="top:500px"><button class="btn" data-go="start">Start training</button><button class="btn ghost" data-go="skip">Skip for now</button><label><input type="checkbox" id="voiceChk" checked> Read it out loud to me</label></div>${WAVES}`,
 steps:[{say:'Aloha {name}! This short training shows In-Office Help in DAN. You set the days volunteers can come and help in the office. They sign up on the website or in the app, and you see who is coming. You can pause, go back, or watch again any time.'}]},

// ================= 2. HOW IT WORKS =================
{html:()=>HEAD('How it works','Three parts')+`<div class="oh-why">
 <div class="oh-wc"><div class="when">Step 1 · In DAN</div><h4>You set it up</h4><div class="oh-art">${ART('weekly',760,0,58)}</div><p>Pick the <b>weekdays</b>, the <b>hours</b>, how many at once, and any <b>special days</b>.</p></div>
 <div class="oh-wc t"><div class="when">Step 2 · Website and app</div><h4>Volunteers sign up</h4><div class="oh-art">${ART('modal',420,40,10)}</div><p>A <b>pop-up</b> on the volunteer page. They pick a <b>day</b> and a <b>time</b>.</p></div>
 <div class="oh-wc p"><div class="when">Step 3 · In DAN</div><h4>You see who’s coming</h4><div class="oh-art">${ART('cald',640,0,14)}</div><p>A <b>calendar</b> with names, every <b>sign-up</b>, and any <b>day requests</b>.</p></div></div>
 <div class="oh-strip"><div>Set up<small>Weekdays and hours</small></div><div>Turn it on<small>Tick and Save</small></div><div>Pop-up<small>Website and app</small></div><div>Sign-up<small>Day and time</small></div><div>Who’s coming<small>In DAN</small></div></div>`,
 steps:[{say:'Here is how it works.',act:async()=>{await show(q('.oh-strip'))}},
 {say:'First, in DAN, you set it up. You pick the weekdays the office takes volunteers, the hours, how many people can be in at once, and any special one-off days.',act:async()=>{const c=all('.oh-wc')[0];await show(c);spot(c,4)}},
 {say:'Second, volunteers sign up. A pop-up opens on the volunteer page of the website and the app. They pick a day and a time.',act:async()=>{const c=all('.oh-wc')[1];spot(null);await show(c);spot(c,4)}},
 {say:'Third, you see who is coming. A calendar with names, a list of every sign-up, and any requests for a different day.',act:async()=>{const c=all('.oh-wc')[2];spot(null);await show(c);spot(c,4)}}]},

// ================= 3. GETTING THERE =================
{html:()=>HEAD('Getting there','CMS, Volunteers, In-Office Help')+FR('menu',{l:58,t:118,w:300,h:480})+FR('tabs',{l:380,t:290,w:390,h:110})+PTS([
 'In the left menu, click <b>CMS</b> at the top.',
 'Then <b>Volunteers</b>.',
 'Click the green <b>In-Office Help</b> tab.',
 'For <b>Super Admin</b>, <b>Admin</b>, <b>Web Admin</b> and <b>App Admin</b>.']),
 init:()=>{view('menu',null,0);view('tabs',[0,0,880,90],0)},
 steps:[{say:'In DAN, look at the top of the left menu. Click CMS.',li:0,act:async()=>{await tapAt('menu',[246,10,105,46]);hideCursor();sp('menu',[246,10,105,46])}},
 {say:'Then click Volunteers.',li:1,act:async()=>{spot(null);await tapAt('menu',[22,492,335,60]);hideCursor();sp('menu',[22,492,335,60])}},
 {say:'Along the top of the Volunteers page there are tabs. Click the green one, In-Office Help.',li:2,act:async()=>{spot(null);await view('tabs',[440,0,460,90]);await tapAt('tabs',[670,42,175,42]);hideCursor();sp('tabs',[670,42,175,42])}},
 {say:'In-Office Help is for Super Admin, Admin, Web Admin and App Admin.',li:3,act:async()=>{spot(null)}}]},

// ================= 4. WEEKLY OFFICE DAYS =================
{html:()=>TAG('dan','In DAN')+HEAD('Set it up','Weekly office days')+FR('weekly')+PTS([
 '<b>Open days</b>: click each weekday the office takes volunteers. Green is on.',
 '<b>From</b> and <b>To</b>: the earliest start and the latest finish.',
 '<b>Volunteers at once</b>: the most people in the office at the same time.',
 '<b>Tasks volunteers see</b>: for reference. Volunteers don’t pick one.',
 '<b>Save office days</b> when you are done.']),
 init:()=>view('weekly',[0,110,840,500],0),
 steps:[{say:'This is the first card, Weekly office days. Open days: click each weekday the office takes volunteers. The green ones are on. Here, Tuesday, Wednesday and Thursday.',li:0,act:async()=>{await view('weekly',[0,110,840,500]);sp('weekly',[17,128,545,55])}},
 {say:'From and To are the earliest start and the latest finish. Here, 9 in the morning to 3 in the afternoon.',li:1,act:async()=>{sp('weekly',[17,198,215,58])}},
 {say:'Volunteers at once is the most people who can be in the office at the same time. When a time is full, the website shows it as Full.',li:2,act:async()=>{sp('weekly',[243,198,95,58])}},
 {say:'Tasks volunteers see. These are for reference only. Volunteers read them, but they don’t pick one. Change the words, press Remove, or add a task.',li:3,act:async()=>{spot(null);await view('weekly',[0,260,1568,342]);sp('weekly',[17,268,1525,270])}},
 {say:'When you are done, press Save office days.',li:4,act:async()=>{spot(null);await tapAt('weekly',[17,552,135,40]);hideCursor();sp('weekly',[17,552,135,40])}}]},

// ================= 5. TURN IT ON =================
{html:()=>TAG('dan','In DAN')+HEAD('Set it up','Turn it on, or off')+FR('weekly')+PTS([
 '<b>Take sign-ups for these weekdays on the website</b>. Ticked = open.',
 'The green <b>Open on the website</b> label shows it is on.',
 '<b>Let volunteers request a special day</b> adds a request form to the pop-up.',
 'Untick both and <b>Save</b> to close it. Nothing shows on the website.']),
 init:()=>view('weekly',[0,0,840,140],0),
 steps:[{say:'Two tick boxes at the top of the card turn it on and off.',act:async()=>{}},
 {say:'Take sign-ups for these weekdays on the website. When it is ticked and saved, volunteers can sign up for the open weekdays.',li:0,act:async()=>{sp('weekly',[17,33,360,22])}},
 {say:'When it is on, the green label next to the title says Open on the website.',li:1,act:async()=>{sp('weekly',[17,0,300,25])}},
 {say:'The second box, Let volunteers request a special day. It adds a Request a different day form to the pop-up, for when none of the days suit them.',li:2,act:async()=>{sp('weekly',[17,64,700,45])}},
 {say:'To close it, untick both boxes and press Save office days. With no open weekdays and no special days, nothing shows on the website or in the app.',li:3,act:async()=>{spot(null)}}]},

// ================= 6. SPECIAL DAYS =================
{html:()=>TAG('dan','In DAN')+HEAD('Set it up','Special volunteer days')+FR('special',{h:330})+PTS([
 'One-off dates, like <b>event prep</b> or a <b>big mailing</b>. Any day, even a Saturday.',
 'Fill in <b>Date</b>, <b>From</b>, <b>To</b>, <b>What it’s for</b> and <b>Volunteers needed</b>.',
 '<b>Add this day</b>. It is on the website straight away.',
 'Each day shows how many signed up. <b>Remove</b> takes it off.']),
 init:()=>view('special',[0,0,840,262],0),
 steps:[{say:'The next card is Special volunteer days. These are one-off dates, like event prep or a big mailing. They can be any day of the week, even a Saturday.',li:0,act:async()=>{sp('special',[17,0,820,55])}},
 {say:'Fill in the date, the from and to times, what it is for, and how many volunteers you need.',li:1,act:async()=>{sp('special',[17,62,820,68])}},
 {say:'Then press Add this day. It shows on the website straight away, in purple.',li:2,act:async()=>{spot(null);await view('special',[700,0,845,262]);await tapAt('special',[1432,87,110,40]);hideCursor();sp('special',[1432,87,110,40])}},
 {say:'Each special day shows how many have signed up. Remove takes it off. If people have signed up, DAN tells you how many will be cancelled, and you press Remove anyway to go ahead.',li:3,act:async()=>{spot(null);await view('special',[700,140,845,122]);sp('special',[1340,160,195,95])}}]},

// ================= 7. THE POP-UP =================
{html:()=>TAG('web','Website and app')+HEAD('What volunteers see','The pop-up on the volunteer page')+FR('modal',{web:1})+PTS([
