<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ke Ola Mamo Monthly Report — Training</title>
<style>
:root{--ink:#0F172A;--soft:#475569;--teal:#0E7490;--teal2:#0891B2;--pink:#D63384;--bg:#FFFBF2;--line:#E2E8F0;--deep:#0B3A53;--amber:#B45309}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--deep);font-family:"Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--ink);overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#view{position:absolute;inset:0 0 64px 0;display:flex;align-items:center;justify-content:center}
#stage{width:1280px;height:720px;position:relative;transform-origin:center center;flex:none;border-radius:14px;overflow:hidden;background:var(--bg)}
.scene{position:absolute;inset:0;padding:34px 48px 30px 58px;display:none}
.scene.on{display:block;animation:fade .5s ease both}
.scene::after{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:linear-gradient(var(--teal),var(--pink));z-index:1}
.kicker{font-size:15px;font-weight:800;color:var(--pink)}
h2{font-size:36px;line-height:1.1;margin:4px 0 0;color:var(--teal);font-weight:800}
.scene.on header{animation:rise .6s ease-out both}
.abs{position:absolute}
.pgno{position:absolute;right:26px;bottom:14px;font-size:13px;color:#94A3B8}
/* cover */
.cover{background:linear-gradient(135deg,#0B3A53,#0E7490 60%,#1a5f7a);color:#fff}
.cover .brand{position:absolute;left:70px;top:120px;font-size:16px;letter-spacing:.05em;opacity:.85;animation:rise .6s .05s both}
.cover .hello{position:absolute;left:70px;top:152px;font-size:30px;font-weight:700;animation:rise .6s .15s both}
.cover h1{position:absolute;left:70px;top:200px;width:640px;font-size:60px;line-height:1.02;margin:0;font-weight:800;animation:rise .6s .25s both}
.cover .sub{position:absolute;left:70px;top:348px;width:600px;font-size:21px;opacity:.92;margin:0;animation:rise .6s .4s both}
.gate{position:absolute;left:70px;top:440px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;width:620px;animation:rise .6s .7s both}
.btn{font:inherit;font-weight:800;font-size:22px;padding:14px 30px;border-radius:10px;border:0;background:var(--pink);color:#fff;cursor:pointer}
.gate .btn{flex:none;white-space:nowrap}
.btn.ghost{background:transparent;border:2px solid rgba(255,255,255,.55);font-size:18px;padding:12px 22px}
.gate label{font-size:17px;display:flex;gap:8px;align-items:center;width:100%;opacity:.9}
.gate label input{width:20px;height:20px}
.btn:focus-visible,#bar button:focus-visible{outline:3px solid #F9A8D4;outline-offset:3px}
.paper{position:absolute;width:250px;border-radius:4px;box-shadow:0 18px 40px rgba(0,0,0,.35);background:#fff}
.cv1{left:780px;top:130px;transform:rotate(-7deg);animation:bob 5s ease-in-out infinite}
.cv2{left:930px;top:190px;transform:rotate(6deg);animation:bob 5s 1.2s ease-in-out infinite}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -14px}}
.spark{position:absolute;width:34px;height:34px;animation:twinkle 2.2s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(.6) rotate(0);opacity:.4}50%{transform:scale(1.1) rotate(45deg);opacity:1}}
.waves{position:absolute;left:0;right:0;bottom:0;height:150px;pointer-events:none;opacity:.35}
.waves svg{position:absolute;bottom:0;width:200%;height:100%}
.waves .w1{animation:drift 18s linear infinite}.waves .w2{animation:drift 26s linear infinite reverse;opacity:.6}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}
/* mock dashboard */
.dash{position:absolute;left:58px;top:120px;width:1170px;height:560px;background:#F4F6F9;border:1px solid #D5DEE8;border-radius:12px;overflow:hidden;box-shadow:0 10px 30px rgba(15,23,42,.12)}
.side{position:absolute;left:0;top:0;bottom:0;width:220px;background:#fff;border-right:1px solid #E2E8F0;padding:14px 12px}
.tabs{display:flex;gap:4px;background:#EEF2F6;border-radius:8px;padding:3px;margin-bottom:12px}
.tabs div{flex:1;text-align:center;font-size:13px;font-weight:700;padding:6px 0;border-radius:6px;color:#475569}
.tabs div.act{background:#fff;color:var(--teal);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.nav div{font-size:13.5px;padding:6px 10px;border-radius:6px;color:#334155;transition:background .3s}
.nav div.act{background:#E0F2FE;color:#0E6E8C;font-weight:700}
.main{position:absolute;left:220px;right:0;top:0;bottom:0;padding:16px 22px}
.search{height:36px;border-radius:18px;background:#FFFBEB;border:1px solid #F1E3B5;font-size:13px;color:#94A3B8;padding:9px 16px}
.sr-title{font-size:24px;font-weight:800;color:#1E293B;margin:16px 0 10px;display:flex;align-items:center;gap:8px}
.sr-title i{display:inline-block;width:20px;height:20px;border-radius:50%;background:var(--teal2);color:#fff;font-size:12px;font-style:normal;text-align:center;line-height:20px}
.dz{position:relative;height:150px;border-radius:12px;background:#EFFAFE;border:2px dashed transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:all .35s}
.dz b{font-size:15px;color:#1E293B}.dz b span{font-weight:400;color:#64748B}
.dz small{font-size:12px;color:#64748B}
.dz.over{border-color:var(--pink);background:#FDF2F8;transform:scale(1.02);box-shadow:0 0 0 8px rgba(214,51,132,.12)}
.dz.over .dzt{display:none}.dz .drop{display:none;font-weight:800;color:var(--pink);font-size:20px}.dz.over .drop{display:block}
.wait h4{margin:22px 0 4px;color:#C2410C;font-size:17px}
.wait p{margin:0;font-size:12.5px;color:#475569;max-width:760px}
.wait .empty{margin-top:14px;font-size:13px;color:#94A3B8;text-align:center}
.hide{opacity:0}
.fadein{animation:fade .6s ease both}
/* folder window */
.win{position:absolute;left:70px;top:160px;width:430px;height:330px;background:#fff;border-radius:12px;box-shadow:0 16px 40px rgba(15,23,42,.25);overflow:hidden;transform-origin:30% 20%}
.win .tb{height:34px;background:#EEF2F6;display:flex;align-items:center;gap:7px;padding:0 12px;font-size:13px;color:#475569;font-weight:700}
.win .tb i{width:12px;height:12px;border-radius:50%;display:inline-block}
.files{display:flex;gap:30px;padding:26px 36px}
.file{width:150px;text-align:center;border-radius:10px;padding:10px;transition:background .25s}
.file img{width:118px;height:152px;object-fit:cover;object-position:top;border:1px solid #CBD5E1;border-radius:3px;background:#fff}
.file span{display:block;font-size:11.5px;margin-top:8px;color:#334155;word-break:break-all;border-radius:4px;padding:2px 4px}
.file.sel{background:#DBEAFE}.file.sel span{background:#2563EB;color:#fff}
.key{position:absolute;background:#fff;border:1px solid #94A3B8;border-bottom-width:4px;border-radius:8px;padding:8px 12px;font-weight:800;font-size:18px;color:#334155;box-shadow:0 6px 14px rgba(0,0,0,.15)}
.dragghost{position:absolute;left:0;top:0;width:120px;height:156px;pointer-events:none;z-index:40}
.dragghost img{position:absolute;width:110px;height:142px;object-fit:cover;object-position:top;border:1px solid #CBD5E1;background:#fff;border-radius:3px;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.dragghost .n{position:absolute;right:-8px;top:-10px;background:#EF4444;color:#fff;font-weight:800;font-size:14px;width:26px;height:26px;border-radius:50%;text-align:center;line-height:26px}
.mini{display:flex;gap:16px}
.mini div{position:relative;width:74px;height:96px;border:1px solid #CBD5E1;background:#fff;overflow:hidden;border-radius:3px}
.mini img{width:100%;height:100%;object-fit:cover;object-position:top}
.mini div::after{content:"";position:absolute;left:0;right:0;height:14px;top:-14px;background:linear-gradient(transparent,rgba(8,145,178,.55),transparent)}
.mini.scan div::after{animation:scan 1.1s linear infinite}
@keyframes scan{from{top:-14px}to{top:100%}}
.status{font-size:15px;font-weight:700;color:#0E6E8C;text-align:center;margin-top:12px;min-height:22px}
.ok{color:#166534}
/* draft card */
.dc{position:absolute;left:58px;width:1170px;background:#fff;border:1px solid #D5DEE8;border-left:5px solid #1B8FB3;border-radius:12px;padding:14px 18px;font-size:14px;box-shadow:0 8px 24px rgba(15,23,42,.08)}
.dc.hear{border-left-color:#7C3AED}
.top{display:flex;align-items:center;gap:12px}
.badge{background:#D9F3FB;color:#0E6E8C;font-weight:800;font-size:11px;letter-spacing:.08em;border-radius:14px;padding:5px 12px}
.hear .badge{background:#EDE9FE;color:#6D28D9}
.fname{font-size:12.5px;color:#475569}
.days{margin-left:auto;background:#E8F7EE;color:#166534;font-weight:700;font-size:12px;border-radius:12px;padding:4px 10px}
.consent{background:#E6FAF6;color:#0F766E;border:1px solid #BFEDE3;border-radius:6px;padding:8px 12px;margin:10px 0 12px;font-size:13px}
.fg{display:grid;grid-template-columns:92px 1fr 92px 1fr 92px 1fr 92px 1fr;gap:8px 10px;align-items:center}
.fl{font-size:10.5px;letter-spacing:.06em;color:#64748B;text-transform:uppercase;line-height:1.2}
.flag{color:var(--amber);font-weight:800;text-transform:none;letter-spacing:0;font-size:11px;display:inline-block;opacity:0;transform:scale(.4);transition:all .4s cubic-bezier(.3,1.6,.5,1)}
.flag.on{opacity:1;transform:none}
.fi{border:1px solid #CBD5E1;border-radius:5px;height:30px;padding:5px 9px;font-size:13.5px;background:#fff;white-space:nowrap;overflow:hidden;transition:background .4s,border-color .4s}
.fi.chk{background:#FFFBEB;border-color:#F59E0B}
.fi.typing::after{content:"|";color:var(--teal2);animation:blink .6s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.low>div{margin-top:10px}
.fam{background:#F8FAFC;border:1px solid #E2E8F0;border-radius:8px;padding:10px 12px}
.row{display:flex;gap:8px;align-items:center}
.inp{flex:1;border:1px solid #CBD5E1;border-radius:5px;height:30px;padding:5px 9px;font-size:13.5px;background:#fff;color:#0F172A}
.inp.ph{color:#94A3B8}
.find{background:#1E4E63;color:#fff;font-weight:800;font-size:12px;border-radius:5px;padding:7px 12px;transition:transform .15s}
.hint{font-size:12px;color:#475569;padding:2px 4px;border-radius:4px}
.sel2{display:inline-block;border:1px solid #94A3B8;border-radius:5px;padding:6px 30px 6px 10px;font-size:13.5px;position:relative;background:#fff}
.sel2::after{content:"▾";position:absolute;right:10px;color:#475569}
.from{background:#F8FAFC;border-radius:6px;padding:7px 10px;font-size:12.5px}
.intro{display:flex;gap:9px;align-items:center;background:#F8FAFC;border-radius:6px;padding:7px 10px;font-size:13px}
.cb{width:16px;height:16px;border-radius:3px;border:2px solid #2563EB;background:#2563EB;position:relative;flex:none;transition:all .2s}
.cb::after{content:"";position:absolute;left:3px;top:0;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.cb.off{background:#fff}.cb.off::after{display:none}
.mut{color:#64748B}
.dim .top,.dim .consent,.dim .fg{opacity:.5}
.btns{position:absolute;display:flex;gap:10px;align-items:center}
.save{background:#1B8FB3;color:#fff;font-weight:800;font-size:15px;border-radius:8px;padding:10px 22px;display:flex;align-items:center;gap:8px;transition:transform .15s}
.disc{border:1px solid #CBD5E1;background:#fff;color:#0E6E8C;font-weight:800;font-size:15px;border-radius:8px;padding:10px 18px}
.spin{width:16px;height:16px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.press{transform:scale(.93)!important}
/* bubbles & annotations */
.bub{position:absolute;background:#fff;border:2px solid var(--pink);border-radius:12px;padding:8px 10px 6px;box-shadow:0 12px 30px rgba(214,51,132,.2);z-index:20}
.bub img{display:block;max-width:100%;border-radius:4px}
.bub em{display:block;font-size:12px;color:var(--pink);font-weight:800;font-style:normal;margin-top:4px}
.anno{position:absolute;font-family:"Segoe Print","Bradley Hand","Chalkboard SE","Comic Sans MS",cursive;color:var(--pink);font-size:22px;font-weight:700;z-index:25;white-space:nowrap}
.stamp{position:absolute;border:5px solid #DC2626;color:#DC2626;font-weight:900;font-size:30px;letter-spacing:.04em;padding:6px 16px;border-radius:10px;transform:rotate(-14deg);background:rgba(255,255,255,.75);z-index:15}
/* pts */
ul.pts{margin:0;padding-left:22px;font-size:19px;line-height:1.45}
ul.pts li{margin-bottom:12px;opacity:.12;transform:translateX(16px);transition:opacity .4s,transform .4s}
ul.pts li.shown{opacity:1;transform:none}
ul.pts li.now::marker{color:var(--pink)}
/* spotlight + cursor */
#spot{position:absolute;z-index:30;border:3px solid var(--pink);border-radius:10px;pointer-events:none;opacity:0;box-shadow:0 0 0 3000px rgba(11,58,83,.32);transition:all .6s cubic-bezier(.45,.05,.25,1)}
#spot.on{opacity:1;animation:ring 1.6s ease-in-out infinite}
@keyframes ring{0%,100%{outline:0 solid rgba(214,51,132,.5);outline-offset:0}50%{outline:8px solid rgba(214,51,132,0);outline-offset:4px}}
#cursor{position:absolute;left:0;top:0;width:28px;height:32px;z-index:50;pointer-events:none;opacity:0;transition:opacity .3s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
#cursor.on{opacity:1}
.ripple{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:3px solid var(--pink);z-index:49;pointer-events:none;animation:rip .6s ease-out forwards}
@keyframes rip{from{transform:scale(.2);opacity:1}to{transform:scale(1.4);opacity:0}}
#nbar{position:absolute;left:10px;right:0;top:0;height:5px;z-index:60}
#nbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal2),var(--pink));transition:width .6s ease}
.conf{position:absolute;width:10px;height:14px;z-index:45;pointer-events:none;border-radius:2px}
/* my day */
.band{position:absolute;left:58px;top:130px;width:1170px;height:96px;border-radius:12px;background:linear-gradient(90deg,#16395A,#1F6E8C);color:#fff;padding:18px 24px}
.band b{font-size:24px}.band p{margin:4px 0 0;opacity:.85;font-size:14px}
.ctrs{position:absolute;right:18px;top:14px;display:flex;gap:10px}
.ctr{width:78px;height:66px;border-radius:10px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);text-align:center;padding-top:8px}
.ctr b{display:block;font-size:24px;line-height:1}.ctr span{font-size:10px;letter-spacing:.08em;opacity:.85}
.ctr.pop b{animation:popn .6s ease}
@keyframes popn{40%{transform:scale(1.6);color:#F9A8D4}}
.shot{position:absolute;border-radius:10px;background:#fff;border:1px solid var(--line);box-shadow:0 8px 24px rgba(15,23,42,.1)}
/* timeline */
.tl{position:absolute;left:140px;top:400px;width:1000px;height:10px;border-radius:5px;background:#E2E8F0;overflow:visible}
.tl .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:5px;background:linear-gradient(90deg,var(--teal2),var(--pink));transition:width 2s cubic-bezier(.45,.05,.25,1)}
.tick{position:absolute;top:-6px;width:2px;height:22px;background:#CBD5E1;transform:scaleY(0);transition:transform .3s}
.tick.on{transform:none}
.mk{position:absolute;bottom:-8px;width:160px;margin-left:-80px;text-align:center;opacity:0;transform:translateY(20px) scale(.8);transition:all .5s cubic-bezier(.3,1.6,.5,1)}
.mk.on{opacity:1;transform:none}
.mk .pin{width:18px;height:18px;border-radius:50%;margin:8px auto 0;background:var(--teal);border:4px solid #fff;box-shadow:0 0 0 2px var(--teal)}
.mk b{display:block;font-size:22px;color:var(--deep)}.mk span{font-size:15px;color:var(--soft)}
.mk.due .pin{background:var(--pink);box-shadow:0 0 0 2px var(--pink)}
.bounce{animation:bnc 1s ease infinite}
@keyframes bnc{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.count{position:absolute;left:140px;top:500px;width:1000px;display:flex;justify-content:center;gap:40px;font-size:22px;font-weight:800}
.count div{opacity:0;transition:opacity .5s}.count div.on{opacity:1}
.count .u{color:var(--teal)}.count .l{color:var(--pink)}
/* checklist */
.cl{position:absolute;left:120px;top:140px;width:1040px}
.ci{display:flex;align-items:center;gap:18px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 20px;margin-bottom:11px;font-size:20px;opacity:0;transform:translateX(-30px);transition:all .45s ease}
.ci.on{opacity:1;transform:none}
.ci .bx{width:30px;height:30px;border-radius:8px;border:3px solid var(--teal);flex:none;position:relative}
.ci.done .bx{background:var(--teal);animation:popn .5s}
.ci .bx svg{position:absolute;inset:2px;stroke:#fff;stroke-width:4;fill:none;stroke-dasharray:30;stroke-dashoffset:30;transition:stroke-dashoffset .45s .1s}
.ci.done .bx svg{stroke-dashoffset:0}
#bar{position:absolute;left:0;right:0;bottom:0;height:64px;background:#082B3E;display:flex;align-items:center;gap:10px;padding:0 16px;color:#E2E8F0}
#bar button{font:inherit;font-weight:700;font-size:15px;background:#12506B;color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;min-width:44px}
#bar button[disabled]{opacity:.35;cursor:default}
#dots{flex:1;display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
#dots button{width:12px;height:12px;min-width:0!important;padding:0!important;border-radius:50%!important;background:#2B6A86!important}
#dots button.on{background:var(--pink)!important;transform:scale(1.25)}
#dots button.seen{background:#7DD3FC!important}
#cap{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);max-width:min(900px,92vw);background:rgba(8,43,62,.93);color:#fff;font-size:16px;line-height:1.4;padding:9px 16px;border-radius:8px;display:none;z-index:70}
body.caps #cap.has{display:block}

.mt{width:1170px;border-collapse:collapse;background:#fff;font-size:13.5px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mt th{background:#F1F5F9;text-align:left;padding:8px 10px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#64748B}
.mt td{border-top:1px solid #EEF2F6;padding:7px 10px;vertical-align:middle}
.mt .m{font-weight:700;width:290px}
.mt th.c,.mt td.c{width:90px;text-align:center;font-weight:800;font-size:15px}
.mt .s{color:#475569;font-size:12.5px}
.mt tr[data-m]{opacity:.12;transition:opacity .4s,background .4s}
.mt tr[data-m].on{opacity:1}
.mt tr.hi{background:#FFFBEB}
.mt .box{display:inline-block;min-width:66px;height:26px;border:1px solid #CBD5E1;border-radius:4px;background:#fff;line-height:24px;font-size:14px}
.ms{display:flex;gap:7px}
.ms .mo{flex:1;border:1px solid #E2E8F0;border-radius:8px;padding:9px 4px;text-align:center;font-size:11.5px;background:#F8FAFC;transition:background .5s,border-color .5s,color .5s}
.ms .mo b{display:block;font-size:13px;color:#334155;margin-bottom:3px}
.ms .mo span{color:#94A3B8}
.ms .red{background:#FEF2F2;border-color:#FCA5A5}.ms .red b{color:#B91C1C}.ms .red span{color:#DC2626;font-weight:700}
.ms .ok{background:#ECFDF5;border-color:#6EE7B7}.ms .ok b{color:#047857}.ms .ok span{color:#059669;font-weight:700}
.chip{display:inline-block;border:2px solid #CBD5E1;border-radius:18px;padding:9px 20px;font-size:18px;font-weight:700;color:#475569;background:#fff;margin-right:10px;transition:all .3s}
.chip.on{background:#0E7490;border-color:#0E7490;color:#fff;transform:scale(1.06)}
.dy{transition:background .3s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
</style></head><body>
<div id="view"><div id="stage"><div id="nbar"><i></i></div>
<div id="scenes"></div>
<div id="spot"></div>
<svg id="cursor" viewBox="0 0 28 32"><path d="M3 2 L3 26 L9.5 19.5 L14 29 L18.5 27 L14 17.5 L23 17.5 Z" fill="#fff" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/></svg>
</div></div>
<div id="cap" aria-live="polite"></div>
<div id="bar">
 <button id="prev">Back</button><button id="play">Start</button><button id="next">Next</button>
 <div id="dots"></div>
 <button id="capbtn" aria-pressed="false">Captions</button><button id="voice" aria-pressed="true">Voice on</button>

const $=id=>document.getElementById(id);
const stage=$('stage');let scale=1;
function fit(){const v=$('view');scale=Math.min(v.clientWidth/1280,v.clientHeight/720);stage.style.transform='scale('+scale+')'}
addEventListener('resize',fit);fit();
let FAST=false;
const D=ms=>FAST?0:ms;
const wait=ms=>new Promise(r=>setTimeout(r,D(ms)));
function pos(el){const r=el.getBoundingClientRect(),s=stage.getBoundingClientRect();return{x:(r.left-s.left)/scale,y:(r.top-s.top)/scale,w:r.width/scale,h:r.height/scale}}
function q(s){return document.querySelector('.scene.on '+s)}
function imgRect(img,b){const p=pos(img),k=p.w/(+img.dataset.w);return{x:p.x+b[0]*k,y:p.y+b[1]*k,w:b[2]*k,h:b[3]*k}}
// cursor
const cur$=$('cursor');let cx=640,cy=760;
function place(x,y,ms){cx=x;cy=y;cur$.style.transition=`transform ${D(ms)}ms cubic-bezier(.45,.05,.25,1),opacity .3s`;cur$.style.transform=`translate(${x}px,${y}px)`}
async function move(t,ms=900,ox=.5,oy=.55){cur$.classList.add('on');const p=t.nodeType?pos(t):t;await wait(20);place(p.x+(p.w||0)*ox,p.y+(p.h||0)*oy,ms);await wait(ms)}
async function click(el){const r=document.createElement('div');r.className='ripple';r.style.left=cx+'px';r.style.top=cy+'px';stage.appendChild(r);setTimeout(()=>r.remove(),700);
 if(el){el.classList.add('press');await wait(150);el.classList.remove('press')}else await wait(150)}
function hideCursor(){cur$.classList.remove('on')}
// spotlight
function spot(t,pad=6){const s=$('spot');if(!t){s.classList.remove('on');return}const p=t.nodeType?pos(t):t;s.style.left=(p.x-pad)+'px';s.style.top=(p.y-pad)+'px';s.style.width=(p.w+pad*2)+'px';s.style.height=(p.h+pad*2)+'px';s.classList.add('on')}
async function type(el,text,ms=35){el.classList.remove('ph');el.textContent='';el.classList.add('typing');for(const c of text){el.textContent+=c;await wait(ms)}el.classList.remove('typing')}
function anim(el,kf,ms,ease='cubic-bezier(.3,1.3,.5,1)',delay=0){return el.animate(kf,{duration:D(ms)||1,delay:D(delay),easing:ease,fill:'forwards'}).finished}
function confetti(x,y,n=90){if(FAST)return;const cols=['#D63384','#0891B2','#F59E0B','#22C55E','#7C3AED','#F9A8D4','#7DD3FC'];
 for(let i=0;i<n;i++){const c=document.createElement('div');c.className='conf';c.style.background=cols[i%cols.length];c.style.left=x+'px';c.style.top=y+'px';stage.appendChild(c);
  const a=Math.random()*Math.PI*2,v=180+Math.random()*320,dx=Math.cos(a)*v,dy=Math.sin(a)*v-220;
  c.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${dx*.7}px,${dy*.7}px) rotate(${Math.random()*540}deg)`,opacity:1,offset:.5},{transform:`translate(${dx}px,${dy+420}px) rotate(${Math.random()*900}deg)`,opacity:0}],{duration:1800+Math.random()*900,easing:'cubic-bezier(.2,.6,.4,1)',fill:'forwards'}).finished.then(()=>c.remove())}}
function el(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstChild}
function add(html,parent){const e=el(html);(parent||document.querySelector('.scene.on')||stage).appendChild(e);return e}
const pop=e=>anim(e,[{opacity:0,transform:(e.dataset.rot||'')+' scale(.3)'},{opacity:1,transform:(e.dataset.rot||'')+' scale(1)'}],550);

const SPARK='<svg viewBox="0 0 34 34"><path d="M17 1 L20 14 L33 17 L20 20 L17 33 L14 20 L1 17 L14 14 Z" fill="#FDE68A"/></svg>';

// ---------------- ENGINE ----------------
const CFG={id:'ke-ola-mamo-monthly-2026-09'};
let cur=0,idx=0,run=0,playing=false,started=false,voiceOn='speechSynthesis' in window,name='',voiceObj=null;
const inFrame=window.parent!==window;
function post(type,extra){if(!inFrame)return;try{window.parent.postMessage(Object.assign({source:'ldah-training',id:CFG.id,type},extra||{}),'*')}catch(e){}}
function pickVoice(){const vs=speechSynthesis.getVoices();if(!vs.length)return null;
 const pref=[v=>v.name==='Google US English',v=>/Ava/.test(v.name)&&/(Premium|Enhanced)/.test(v.name),v=>/Microsoft (Aria|Jenny|Ava).*Natural/.test(v.name),v=>/Samantha/.test(v.name)&&/(Premium|Enhanced)/.test(v.name),v=>/^Ava/.test(v.name),v=>/Karen/.test(v.name),v=>/Samantha/.test(v.name),v=>v.lang==='en-US',v=>/^en/.test(v.lang)];
 for(const f of pref){const m=vs.find(f);if(m)return m}return null}
if('speechSynthesis' in window){voiceObj=pickVoice();speechSynthesis.onvoiceschanged=()=>{voiceObj=pickVoice()}}
const fillName=t=>t.replace(/\{name\}/g,name||'there');
function speak(text,token){return new Promise(res=>{const t=fillName(text);const c=$('cap');c.textContent=t;c.classList.add('has');
 const words=t.split(/\s+/).length;const t0=Date.now();const guard=setTimeout(done,words*520+4000);
 function done(){clearTimeout(guard);const min=words*280,e=Date.now()-t0;if(e<min)setTimeout(res,min-e);else res()}
 if(!voiceOn){clearTimeout(guard);setTimeout(res,words*330+900);return}
 const u=new SpeechSynthesisUtterance(t);if(voiceObj){u.voice=voiceObj;u.lang=voiceObj.lang}else u.lang='en-US';
 u.rate=(voiceObj&&/Google/.test(voiceObj.name))?0.98:1.0;u.onend=done;u.onerror=done;speechSynthesis.cancel();setTimeout(()=>{if(token===run)speechSynthesis.speak(u);else done()},60)})}
const host=$('scenes');
SC.forEach((s,i)=>{const d=document.createElement('section');d.className='scene '+(s.cls||'');d.dataset.i=i;host.appendChild(d);s.el=d});
function render(i){const s=SC[i];s.el.innerHTML=s.html()+(s.cls?'':`<div class="pgno">${i+1} / ${SC.length}</div>`);
 s.el.querySelectorAll('.nm').forEach(e=>e.textContent=name);if(started&&i===0){const g=s.el.querySelector('.gate');if(g)g.style.visibility='hidden'}s.el.querySelectorAll('.nmc').forEach(e=>e.textContent=name?', '+name:'');wire(s.el)}
function li(i){const s=SC[cur];const ls=s.el.querySelectorAll('.pts li');ls.forEach((l,j)=>{l.classList.toggle('shown',j<=i);l.classList.toggle('now',j===i)})}
function dots(){const d=$('dots');d.innerHTML='';SC.forEach((_,i)=>{const b=document.createElement('button');b.setAttribute('aria-label','Scene '+(i+1));if(i===cur)b.className='on';else if(i<cur)b.className='seen';b.onclick=()=>{if(started)enter(i,true)};d.appendChild(b)})}
function nbar(f){$('nbar').firstChild.style.width=(f*100)+'%'}
function stop(){run++;if('speechSynthesis' in window)speechSynthesis.cancel()}
function clean(){spot(null);hideCursor();document.querySelectorAll('.dragghost,.ripple,.conf').forEach(e=>e.remove());$('cap').classList.remove('has')}
async function enter(i,autoplay){stop();clean();SC[cur].el.classList.remove('on');cur=i;render(i);const s=SC[i];s.el.classList.add('on');if(s.init)s.init();
 idx=0;nbar(0);dots();$('prev').disabled=!started||i===0;$('next').disabled=!started||i===SC.length-1;post('progress',{scene:i+1,total:SC.length});if(i===SC.length-1)post('complete',{name});
 if(autoplay){playing=true;setPlay()}if(playing){const t=++run;await wait(450);if(t===run)playLoop(t)}}
async function playLoop(t){const s=SC[cur];for(;idx<s.steps.length;idx++){if(t!==run)return;const st=s.steps[idx];nbar((idx+1)/s.steps.length);if(st.li!=null)li(st.li);
  const a=st.act?Promise.resolve().then(()=>st.act()).catch(e=>console.warn(e)):Promise.resolve();await Promise.all([a,speak(st.say,t)]);if(t!==run)return;await wait(350)}
 if(t!==run)return;$('cap').classList.remove('has');if(cur<SC.length-1){await wait(900);if(t===run&&playing)enter(cur+1)}else{playing=false;setPlay()}}
async function resumeAt(k){// rebuild scene, fast-forward steps before k
 const t=++run;const s=SC[cur];clean();render(cur);s.el.classList.add('on');if(s.init)s.init();FAST=true;
 for(let j=0;j<k;j++){const st=s.steps[j];if(st.li!=null)li(st.li);try{if(st.act)await st.act()}catch(e){}}FAST=false;clean();if(t!==run)return;idx=k;playLoop(t)}
function setPlay(){$('play').textContent=!started?'Start':playing?'Pause':'Play'}
$('play').onclick=()=>{if(!started)return begin();playing=!playing;setPlay();if(playing)resumeAt(idx);else{stop()}};
$('next').onclick=()=>enter(Math.min(cur+1,SC.length-1),true);$('prev').onclick=()=>enter(Math.max(cur-1,0),true);
$('voice').onclick=()=>{voiceOn=!voiceOn&&('speechSynthesis' in window);$('voice').textContent=voiceOn?'Voice on':'Voice off';$('voice').setAttribute('aria-pressed',voiceOn);document.body.classList.toggle('caps',!voiceOn||$('capbtn').getAttribute('aria-pressed')==='true');if(!voiceOn&&'speechSynthesis' in window)speechSynthesis.cancel()};
$('capbtn').onclick=()=>{const on=$('capbtn').getAttribute('aria-pressed')!=='true';$('capbtn').setAttribute('aria-pressed',on);document.body.classList.toggle('caps',on||!voiceOn)};
addEventListener('keydown',e=>{if(!started){if(e.key==='Enter')begin();return}if(e.key==='ArrowRight')$('next').click();else if(e.key==='ArrowLeft')$('prev').click();else if(e.key===' '){e.preventDefault();$('play').click()}});
function setName(n){name=(n||'').trim().split(/\s+/)[0]||'';document.querySelectorAll('.nm').forEach(e=>e.textContent=name);document.querySelectorAll('.nmc').forEach(e=>e.textContent=name?', '+name:'')}
function begin(){if(started)return;const vc=$('voiceChk');if(vc)voiceOn=vc.checked&&('speechSynthesis' in window);$('voice').textContent=voiceOn?'Voice on':'Voice off';document.body.classList.toggle('caps',!voiceOn);
 if(voiceOn&&!voiceObj)voiceObj=pickVoice();started=true;playing=true;setPlay();post('started',{name});const g=SC[0].el.querySelector('.gate');if(g)g.style.visibility='hidden';$('next').disabled=false;dots();idx=0;const t=++run;playLoop(t)}
function wire(root){root.querySelectorAll('[data-go=start]').forEach(b=>b.onclick=begin);
 root.querySelectorAll('[data-go=skip]').forEach(b=>{if(!inFrame)b.style.display='none';b.onclick=()=>{stop();post('skip',{name})}});
 root.querySelectorAll('[data-go=again]').forEach(b=>b.onclick=()=>{started=true;enter(0,true)});
 root.querySelectorAll('[data-go=close]').forEach(b=>{if(!inFrame)b.style.display='none';b.onclick=()=>{stop();post('close',{name})}})}
const qp=new URLSearchParams(location.search).get('name');if(qp)setName(qp);
addEventListener('message',e=>{const d=e.data||{};if(d.type==='ldah-training:init'){if(d.name)setName(d.name);if(d.voice===false){voiceOn=false;const vc=$('voiceChk');if(vc)vc.checked=false;$('voice').textContent='Voice off'}}});
render(0);SC[0].el.classList.add('on');setName(name);$('prev').disabled=true;$('next').disabled=true;dots();setPlay();post('ready',{total:SC.length});
</script></body></html>
