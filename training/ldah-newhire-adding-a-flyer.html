<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adding a Flyer or Event — Training</title>
<link rel="stylesheet" href="deck-base.css">
<!-- Same Firebase build as the dashboard, so the deck shares its sign-in and records progress. -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
/* Every class here starts with naf- (new-hire adding a flyer) so nothing collides with deck-base.css. */
/* ---------- logo ---------- */
.naf-logo{position:absolute;left:70px;top:30px;width:78px;height:78px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(0,0,0,.25);animation:rise .6s both}
.naf-logo img{width:52px;height:57px;object-fit:contain}
.cover .brand{left:166px;top:58px;width:900px}
/* ---------- the flyer, drawn in CSS ---------- */
.naf-fly{width:196px;height:258px;background:#fff;border-radius:6px;box-shadow:0 18px 36px rgba(15,23,42,.32);overflow:hidden;position:relative;font-family:Georgia,"Times New Roman",serif;color:#0F172A;text-align:center}
.naf-fly .bnd{background:linear-gradient(90deg,#0E7490,#22A6C7);color:#fff;font:800 11px/1 "Nunito Sans",sans-serif;letter-spacing:.14em;padding:9px 0}
.naf-fly.swap .bnd{background:linear-gradient(90deg,#B45309,#F59E0B)}
.naf-fly h5{margin:12px 10px 3px;font-size:21px;line-height:1.05}
.naf-fly .tg{font-size:11.5px;font-style:italic;color:#475569;margin:0 10px}
.naf-fly .dt{margin:12px 8px 0;font:800 13px/1.25 "Nunito Sans",sans-serif;color:#B45309}
.naf-fly .tm{font:700 12px/1.3 "Nunito Sans",sans-serif;color:#334155;margin-top:3px}
.naf-fly .ft{position:absolute;left:0;right:0;bottom:0;background:#F1F5F9;font:700 10.5px/1.3 "Nunito Sans",sans-serif;color:#0E7490;padding:7px 4px}
.naf-fly .art{height:30px;margin:10px auto 0;width:120px;border-radius:6px;background:repeating-linear-gradient(90deg,#FDE68A 0 14px,#FBCFE8 14px 28px,#A5F3FC 28px 42px)}
.naf-fly .sw{position:absolute;left:0;right:0;height:34px;top:-36px;background:linear-gradient(transparent,rgba(8,145,178,.55),transparent)}
.naf-fly.scan .sw{animation:nafsweep 1.05s linear infinite}
@keyframes nafsweep{from{top:-36px}to{top:100%}}
.naf-noyr{position:absolute;right:4px;top:104px;background:#DC2626;color:#fff;font:800 10px/1 "Nunito Sans",sans-serif;border-radius:6px;padding:4px 7px;opacity:0;transform:scale(.4);transition:all .4s cubic-bezier(.3,1.6,.5,1)}
.naf-noyr.on{opacity:1;transform:none}
/* ---------- big idea cards ---------- */
.naf-two{position:absolute;left:70px;top:132px;width:1140px;display:grid;grid-template-columns:1fr 1fr;gap:26px}
.naf-k{background:#fff;border-radius:16px;box-shadow:0 10px 26px rgba(15,23,42,.1);padding:16px 22px;border-top:8px solid #F59E0B;opacity:0}
.naf-k.ev{border-top-color:#0891B2}
.naf-k h4{margin:0;font-size:26px;color:#0B3A53}
.naf-k .q{font-size:17px;font-weight:800;color:#B45309;margin:2px 0 10px}
.naf-k.ev .q{color:#0E7490}
.naf-k ul{margin:0;padding-left:22px;font-size:18px;line-height:1.55;color:#334155}
.naf-types{position:absolute;left:70px;top:400px;width:1140px;display:grid;grid-template-columns:1.45fr 1fr .62fr;gap:14px;opacity:0}
.naf-tg{background:#fff;border-radius:14px;padding:12px 16px;box-shadow:0 6px 16px rgba(15,23,42,.08)}
.naf-tg h6{margin:0 0 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#64748B}
.naf-tg p{margin:8px 0 0;font-size:14.5px;color:#475569;line-height:1.35}
.naf-pill{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:800;color:#0F172A;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:999px;padding:4px 11px;margin:0 6px 6px 0}
.naf-pill i{width:10px;height:10px;border-radius:50%;display:inline-block}
/* ---------- dashboard chrome ---------- */
.naf-dash{position:absolute;left:58px;top:122px;width:1172px;height:560px;background:#F4F7FA;border-radius:14px;box-shadow:0 14px 34px rgba(15,23,42,.16);overflow:hidden;display:flex}
.naf-side{width:220px;background:#0B3A53;color:#CFE8F1;padding:14px 0;font-size:14px;flex:none}
.naf-side .gh{padding:8px 18px;font-weight:800;color:#fff;letter-spacing:.02em}
.naf-side .it{padding:7px 18px 7px 30px;transition:background .3s}
.naf-side .it.on{background:#0891B2;color:#fff;font-weight:800}
.naf-side .gh.dim{color:#7FA6B8;font-weight:700}
.naf-main{flex:1;padding:18px 22px;position:relative}
.naf-main h3{margin:0 0 12px;font-size:24px;color:#0B3A53}
.naf-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.naf-chip{font-size:12.5px;font-weight:700;color:#475569;background:#fff;border:1px solid #E2E8F0;border-radius:8px;padding:6px 11px}
.naf-chip.act{background:#0891B2;color:#fff;border-color:#0891B2}
.naf-tbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.naf-add{background:#0891B2;color:#fff;font-weight:800;font-size:15px;border-radius:9px;padding:9px 18px;transition:transform .15s}
.naf-ghb{border:1px solid #CBD5E1;background:#fff;color:#0E6E8C;font-weight:700;font-size:12.5px;border-radius:8px;padding:7px 12px;margin-left:auto}
.naf-sec{font-size:13.5px;font-weight:800;color:#004E7C;display:flex;align-items:center;gap:8px;margin:4px 0 8px}
.naf-sec i{width:8px;height:8px;border-radius:50%;display:inline-block}
.naf-sec small{font-weight:400;color:#94A3B8;font-size:12px}
.naf-sec.gr{color:#64748B;border-top:2px solid #D1D5DB;padding-top:8px;margin-top:10px}
.naf-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.naf-cd{background:#fff;border:1px solid #E2E8F0;border-radius:11px;overflow:hidden;box-shadow:0 4px 12px rgba(15,23,42,.06);font-size:13px}
.naf-cd .im{height:40px}
.naf-cd b{display:block;padding:8px 10px 2px;font-size:13.5px;line-height:1.2}
.naf-cd .bd{display:inline-block;color:#fff;font-size:10.5px;font-weight:800;border-radius:10px;padding:2px 8px;margin:4px 10px 0}
.naf-cd .naf-lk{display:flex;gap:10px;padding:7px 10px 9px;font-size:11.5px;font-weight:700;color:#0E7490}
.naf-cd .naf-lk .ar{color:#DC2626}
.naf-cd.new{box-shadow:0 0 0 3px #67E8F9}
/* ---------- the Add-Event funnel (labels verbatim from index.html:9292-9340) ---------- */
.fn{width:640px;background:#fff;border-radius:14px;box-shadow:0 20px 50px rgba(15,23,42,.3);overflow:hidden;font-size:13px}
.fnh{display:flex;align-items:center;gap:9px;padding:11px 14px;background:linear-gradient(90deg,#0E7490,#22A6C7);color:#fff}
.fnh b{font-size:15.5px;margin-right:auto}
.fnb{padding:15px 20px 16px}
.stp{display:flex;gap:8px;justify-content:center;align-items:center;margin-bottom:14px}
.stp i{width:25px;height:25px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;font-style:normal;background:#E2E8F0;color:#64748B}
.stp i.on{background:#0891B2;color:#fff}.stp i.done{background:#67E8F9;color:#fff}
.stp s{width:22px;height:2px;background:#E2E8F0;display:block}
.fnt{text-align:center;font-size:15.5px;font-weight:800;color:#0891B2;margin-bottom:4px}
.fns{text-align:center;font-size:12.6px;color:#475569;margin-bottom:12px}
.skip{text-align:center;margin-top:10px;font-size:12.2px;color:#0891B2;font-weight:700}
.fbar{display:flex;justify-content:space-between;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid #E2E8F0}
.gb{border:1px solid #CBD5E1;background:#fff;color:#0E6E8C;font-weight:800;font-size:12.5px;border-radius:8px;padding:7px 14px}
.gb.inv{visibility:hidden}
.pb{background:#0891B2;color:#fff;font-weight:800;font-size:12.5px;border-radius:8px;padding:7px 14px;transition:transform .15s}
/* The live drop zone is a blue dashed box on pale cyan; dragging over it only deepens the cyan. */
.dz{border-color:#0891B2;background:#F0FDFF;height:132px}
.dz.over{border-color:#0891B2;background:#DBFAFF;transform:none;box-shadow:none}
.dz.over .dzt{display:block}
.dzt{text-align:center}
.dz b{color:#0891B2}
.dz small{display:block;margin-top:4px}
.dz b{display:block}
.naf-doc{width:30px;height:36px;margin:0 auto 6px;border:2px solid #0891B2;border-radius:4px;background:#fff;position:relative}
.naf-doc::before,.naf-doc::after{content:"";position:absolute;left:5px;right:5px;height:2px;background:#67E8F9;top:10px}
.naf-doc::after{top:18px;right:9px}
.tcs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tc{border:2px solid #E2E8F0;border-radius:12px;padding:8px 11px;background:#fff;position:relative;transition:all .4s}
.tc.gs{background:#F0FDFF}
.tc b{display:block;font-weight:800;color:#0F172A;font-size:13px}
.tc b em{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.tc small{display:block;font-size:10.7px;color:#64748B;margin-top:2px;line-height:1.3}
.aig{position:absolute;top:7px;right:8px;color:#fff;font-size:9.5px;font-weight:800;border-radius:10px;padding:2px 7px;opacity:0;transform:scale(.4);transition:all .4s cubic-bezier(.3,1.6,.5,1)}
.aig.on{opacity:1;transform:none}
.naf-s3{text-align:center;padding:4px 0}
.naf-s3 .t{font-weight:800;font-size:17px;color:#0F172A;margin-top:6px}
.naf-s3 .t em{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.naf-s3 .d{font-size:13px;color:#64748B;margin-top:4px}
.naf-s3 .fr{font-size:13px;color:#475569;margin-top:12px}
.naf-s3 .h{font-size:12px;color:#94A3B8;margin-top:14px}
/* ---------- the event editor (labels verbatim from index.html:9343-9500) ---------- */
.naf-ed{width:690px;background:#fff;border-radius:14px;box-shadow:0 20px 50px rgba(15,23,42,.25);overflow:hidden;font-size:12.5px}
.naf-edh{display:flex;align-items:center;gap:9px;padding:10px 14px;background:linear-gradient(90deg,#0E7490,#22A6C7);color:#fff}
.naf-edh b{font-size:15px;margin-right:auto}
.naf-edh .bdg{background:#fff;color:#0F172A;font-size:11px;font-weight:800;border-radius:10px;padding:2px 9px}
.naf-edh .bdg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.naf-edb{padding:10px 16px 6px}
.naf-fd{margin-bottom:7px}
.naf-fd label{display:block;font-size:11.5px;font-weight:800;color:#334155;margin-bottom:2px}
.naf-fd label u{color:#DC2626;text-decoration:none}
.naf-in{border:1px solid #CBD5E1;border-radius:6px;min-height:25px;padding:4px 9px;font-size:12.4px;background:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#0F172A;transition:box-shadow .4s}
.naf-in.ph{color:#94A3B8}
.naf-in.tall{min-height:36px;white-space:normal;line-height:1.3}
.naf-in.dd{position:relative;padding-right:22px}
.naf-in.dd::after{content:"▾";position:absolute;right:8px;top:4px;color:#64748B}
.naf-in.lit{box-shadow:inset 0 0 0 2px #67E8F9}
.naf-in.typing::after{content:"|";color:#0891B2;animation:blink .6s steps(1) infinite}
.naf-in.amb{background:#FFFBEB;border-color:#F59E0B}
.naf-in.bad{background:#FEF2F2;border-color:#DC2626}
.naf-g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.naf-g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.naf-img{display:flex;align-items:center;gap:9px;border:1px dashed #94A3B8;border-radius:6px;padding:4px 9px;min-height:28px;color:#64748B;transition:box-shadow .4s}
.naf-img .tn{width:20px;height:26px;border-radius:2px;background:linear-gradient(#22A6C7 0 30%,#fff 30%);border:1px solid #CBD5E1;flex:none;display:none}
.naf-img.has .tn{display:block}
.naf-img.lit{box-shadow:inset 0 0 0 2px #67E8F9}
.naf-info{display:flex;align-items:center;gap:8px;background:#FFFBEB;border:1px solid #FDE68A;border-radius:8px;padding:5px 10px;margin-bottom:7px;font-size:12px}
.naf-cb{width:15px;height:15px;border:2px solid #94A3B8;border-radius:3px;flex:none;background:#fff}
.naf-cb.on{background:#0891B2;border-color:#0891B2;box-shadow:inset 0 0 0 2px #fff}
.naf-sdl{display:flex;flex-direction:column;gap:4px;margin-bottom:5px}
.naf-sd{display:flex;justify-content:space-between;align-items:center;background:#F3F4F6;border-radius:6px;padding:3px 8px;font-size:12px;transition:box-shadow .4s}
.naf-sd.lit{box-shadow:inset 0 0 0 2px #67E8F9}
.naf-sd.ya{background:#ECFEFF;box-shadow:inset 0 0 0 1px #67E8F9}
.naf-sd .rm{color:#DC2626;font-size:11px;font-weight:700}
.naf-sd .yt{font-size:10.5px;color:#0E7490;font-weight:800}
.naf-sdi{display:flex;gap:6px}
.naf-sdi .naf-in{flex:1}
.naf-addb{background:#0891B2;color:#fff;font-weight:800;font-size:12px;border-radius:6px;padding:4px 12px;display:flex;align-items:center}
.naf-eda{display:flex;justify-content:flex-end;gap:8px;padding:8px 16px 12px;border-top:1px solid #E2E8F0}
.naf-eda span{font-weight:800;font-size:13px;border-radius:8px;padding:7px 18px;transition:transform .15s}
.naf-cancel{border:1px solid #CBD5E1;color:#0E6E8C;background:#fff}
.naf-save{background:#0891B2;color:#fff}
/* ---------- side panels ---------- */
.naf-note{position:absolute;background:#FEF3C7;border-left:6px solid #F59E0B;border-radius:12px;padding:12px 16px;font-size:17px;line-height:1.4;color:#0F172A;opacity:0}
.naf-note.tl{background:#E0F2FE;border-left-color:#0891B2}
.naf-note.rd{background:#FEF2F2;border-left-color:#DC2626}
.naf-wr{display:flex;flex-direction:column;gap:9px}
.naf-w{background:#fff;border:1px solid var(--line);border-left:5px solid #B45309;border-radius:12px;padding:9px 14px;opacity:0}
.naf-w>b{display:block;font-size:16px;color:#0F172A}
.naf-w p{margin:2px 0 0;font-size:14px;color:var(--soft);line-height:1.35}
/* ---------- toasts and a browser confirm box ---------- */
.toast{position:absolute;background:#0891B2;color:#fff;font-weight:700;font-size:14.5px;border-radius:9px;padding:11px 17px;box-shadow:0 14px 30px rgba(15,23,42,.3);z-index:35}
.toast.warn{background:#D97706}.toast.err{background:#DC2626}.toast.good{background:#16A34A}
.alrt{width:430px;background:#fff;border-radius:12px;box-shadow:0 22px 52px rgba(15,23,42,.35);overflow:hidden;z-index:30}
.alrt .at{background:#EEF2F6;padding:8px 14px;font-size:11.5px;font-weight:800;color:#475569;letter-spacing:.05em;text-transform:uppercase}
.alrt .ab{padding:14px 16px 4px;color:#0F172A;font-size:13.5px;line-height:1.45}
.alrt .ab p{margin:0 0 8px}
.alrt .af{padding:10px 16px 14px;text-align:right;display:flex;justify-content:flex-end;gap:8px}
.alrt .af span{font-weight:700;font-size:13px;border-radius:6px;padding:6px 18px;display:inline-block;transition:transform .15s}
.alrt .cx{border:1px solid #CBD5E1;color:#0F172A;background:#fff}
.alrt .okb{background:#2563EB;color:#fff}
/* ---------- showing-dates timeline ---------- */
.naf-tl{position:absolute;left:70px;top:178px;width:690px;height:270px}
.naf-tl .ln{position:absolute;left:10px;right:10px;top:118px;height:6px;border-radius:3px;background:#E2E8F0}
.naf-tl .seg{position:absolute;top:118px;height:6px;border-radius:3px;transform-origin:left;transform:scaleX(0)}
.naf-tl .mk{position:absolute;top:96px;width:150px;margin-left:-75px;text-align:center;opacity:0}
.naf-tl .mk i{display:block;width:20px;height:20px;border-radius:50%;margin:13px auto 6px;border:4px solid #fff;box-shadow:0 0 0 2px currentColor;background:currentColor}
.naf-tl .mk b{display:block;font-size:17px;color:#0F172A}
.naf-tl .mk small{display:block;font-size:14.5px;color:#64748B;font-weight:700}
.naf-tl .mk.ses{top:52px}
.naf-tl .mk.ses i{width:12px;height:12px;margin:6px auto 0;box-shadow:none;border:0}
.naf-tl .zn{position:absolute;top:196px;font-size:16px;font-weight:800;border-radius:10px;padding:8px 10px;text-align:center;opacity:0;line-height:1.3}
.naf-tl .zn small{display:block;font-weight:600;font-size:14px}
/* ---------- public website ---------- */
.naf-br{width:690px;border-radius:12px;overflow:hidden;box-shadow:0 18px 44px rgba(15,23,42,.28);background:#fff}
.naf-br .bt{height:30px;background:#EEF2F6;display:flex;align-items:center;gap:6px;padding:0 11px;font-size:11.5px;color:#64748B;font-weight:700}
.naf-br .bt i{width:9px;height:9px;border-radius:50%;background:#CBD5E1;display:inline-block}
.naf-br .bt span{margin-left:10px;background:#fff;border-radius:6px;padding:3px 10px}
.naf-br .bc{padding:16px 20px}
.naf-pub{width:250px;background:#fff;border:1px solid #E2E8F0;border-radius:12px;overflow:hidden;box-shadow:0 8px 20px rgba(15,23,42,.1)}
.naf-pub .ph{height:80px;background:linear-gradient(135deg,#0E7490,#22A6C7)}
.naf-pub .pt{padding:9px 12px 2px;font-weight:800;font-size:14px;color:#0F172A;line-height:1.2}
.naf-pub .pd{padding:0 12px 2px;font-size:12px;color:#64748B}
.naf-pub .pg{margin:8px 12px 12px;background:#0891B2;color:#fff;font-weight:800;font-size:12.5px;border-radius:8px;padding:7px 0;text-align:center}
.naf-wt{position:absolute;left:70px;top:132px;width:1140px;border-collapse:separate;border-spacing:0;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 10px 26px rgba(15,23,42,.1);font-size:18.5px}
.naf-wt th{background:#0B3A53;color:#fff;text-align:left;padding:11px 14px;font-size:15px}
.naf-wt td{padding:15px 16px;border-top:1px solid #E2E8F0;vertical-align:top;color:#334155;line-height:1.35;opacity:.18;transition:opacity .5s}
.naf-wt tr.on td{opacity:1}
.naf-wt td:first-child{font-weight:800;color:#0F172A;width:250px}
.naf-wt .y{color:#15803D;font-weight:800}.naf-wt .n{color:#B91C1C;font-weight:800}
.naf-wt small{display:block;color:#64748B;font-size:15px}
/* ---------- quiz (same as super-partner-workflow) ---------- */
.scene.quiz{background:linear-gradient(135deg,#FFF1F8,#E0F7FA)}
.qwrap{position:absolute;left:0;top:0;right:0;bottom:0}
.qintro{position:absolute;left:120px;top:190px;width:1040px;text-align:center;font-size:30px;font-weight:800;color:#0B3A53;line-height:1.35;animation:rise .5s both}
.qintro small{display:block;font-size:20px;color:#475569;font-weight:700;margin-top:14px}
.qcard{position:absolute;left:120px;top:138px;width:1040px;background:#fff;border-radius:20px;box-shadow:0 18px 40px rgba(15,23,42,.14);padding:22px 30px;animation:rise .5s both}
.qn{font-size:14px;font-weight:900;color:var(--pink);letter-spacing:.08em;text-transform:uppercase}
.qq{font-size:26px;font-weight:800;line-height:1.25;margin:6px 0 16px}
.qo{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;font-size:20px;font-weight:700;background:#F8FAFC;border:3px solid #E2E8F0;border-radius:14px;padding:11px 16px;margin-bottom:10px;cursor:pointer;transition:border-color .2s,background .2s;color:var(--ink)}
.qo:hover:not([disabled]){border-color:#0891B2;background:#F0F9FF}
.qo[disabled]{cursor:default}
.qo .L{width:38px;height:38px;border-radius:50%;background:#0E7490;color:#fff;display:flex;align-items:center;justify-content:center;flex:none;font-weight:900}
.qo.no{border-color:#DC2626;background:#FEF2F2;animation:shake .4s}.qo.no .L{background:#DC2626}
.qo.yes{border-color:#16A34A;background:#F0FDF4}.qo.yes .L{background:#16A34A}
.qfb{min-height:30px;font-size:19px;font-weight:700;margin-top:4px}.qfb.good{color:#15803D}.qfb.bad{color:#B91C1C}
.stars{position:absolute;right:60px;top:46px;display:flex;gap:8px}
.stars i{width:36px;height:36px;background:#E2E8F0;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);transition:background .3s}
.stars i.on{background:#F59E0B;animation:popn .6s}
.qhelp{position:absolute;left:120px;bottom:30px;font-size:16px;color:#475569;font-weight:700}

</style></head><body>
<div id="view"><div id="stage"><div id="nbar"><i></i></div>
<div id="scenes"></div>
<div id="spot"></div>
<svg id="cursor" viewBox="0 0 28 32"><path d="M3 2 L3 26 L9.5 19.5 L14 29 L18.5 27 L14 17.5 L23 17.5 Z" fill="#fff" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/></svg>
</div></div>
<div id="cap" aria-live="polite"></div>
<div id="bar">
 <button id="prev">Back</button><button id="play">Start</button><button id="next">Next</button>
 <div id="dots"></div>
 <button id="capbtn" aria-pressed="false">Captions</button><button id="voice" aria-pressed="true">Voice on</button>
</div>
<script>
const DECK_ID='ldah-newhire-adding-a-flyer';

/* Every screen below is drawn in HTML/CSS from the live dashboard (LDAH-Int index.html,
   2026-10-01): the Add-Event funnel (cmsOpenFunnel), the event editor (cmsOpenEventModal),
   cmsSaveEvent, ldahEventState, and the public site (LDAH_W2 index.html / events.html).
   Every event, person and email address here is made up. */
const LOGO='../logo_blue.png';
const LOGOBADGE=`<div class="naf-logo"><img src="${LOGO}" alt="LDAH logo"></div>`;

/* ---- small helpers (same as entering-screening-results) ---- */
const tap=async(s,ms=850)=>{const e=typeof s==='string'?q(s):s;await move(e,ms);await click(e);return e};
function all(s){return[...document.querySelectorAll('.scene.on '+s)]}
const show=(e,ms=500)=>anim(e,[{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],ms,'ease-out').then(()=>{e.style.opacity=1});
const PTS=(items,top=140,left=790,w=440)=>`<div class="abs" style="left:${left}px;top:${top}px;width:${w}px"><ul class="pts">${items.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
const stampIt=async(txt,x,y,size=26)=>{const s=add(`<div class="stamp" style="left:${x}px;top:${y}px;font-size:${size}px">${txt}</div>`);
 await anim(s,[{opacity:0,transform:'rotate(-14deg) scale(3)'},{opacity:1,transform:'rotate(-14deg) scale(1)'}],450,'cubic-bezier(.5,0,.8,.6)');return s};

/* ---- two made-up flyers ---- */
const FLYER=(k,cls)=>k==='swap'
 ?`<div class="naf-fly swap ${cls||''}"><div class="sw"></div><div class="bnd">COMMUNITY NEWS</div><h5>Keiki Book Swap</h5><div class="tg">Bring a book, take a book</div><div class="art"></div>
   <div class="dt">Saturday, November 14</div><div class="tm">9:00 AM – 12:00 PM<br>Community library lawn</div><div class="ft">Free · all ages · just drop by</div></div>`
 :`<div class="naf-fly ${cls||''}"><div class="sw"></div><div class="bnd">LEARNING LABS</div><h5>Reading Aloud at Home</h5><div class="tg">A two-part workshop for parents</div>
   <div class="dt">Thursdays<br>November 12 &amp; 19</div><div class="tm">5:00 – 6:30 PM<br>On Zoom · Free</div><span class="naf-noyr">no year</span><div class="ft">Sign up at ldahawaii.org</div></div>`;

/* ---- the 7 type cards: labels, colours and descriptions verbatim from _CMS_TYPE_META ---- */
const TYPES=[
 ['learning_labs','#0891B2','Learning Labs','Virtual workshop with signups &amp; Zoom.'],
 ['parent_talk_cafe','#F97316','Parent Talk Cafe','Casual Facebook-group chat; single confirmation, no Zoom reminders.'],
 ['connect_gen','#16A34A','Connect-Gen','Ongoing recurring program (weekly / monthly schedule).'],
 ['screening','#7C3AED','Screening','Booth with the full screening-consent QR form.'],
 ['remote_signup','#4F46E5','Remote Signup','Off-site in-person event that takes RSVPs / signups.'],
 ['outreach_booth','#92400E','Outreach Booth','Booth / table with a simple QR signup form.'],
 ['flyer','#F59E0B','Flyer','Announcement only — a flyer image, no signups.']];
const TCOL=Object.fromEntries(TYPES.map(t=>[t[0],t[1]]));
const PILL=k=>{const t=TYPES.find(x=>x[0]===k);return `<span class="naf-pill"><i style="background:${t[1]}"></i>${t[2]}</span>`};

/* ---- the Add-Event funnel ---- */
const DOTS=n=>`<div class="stp">${[1,2,3].map(i=>`<i class="${i===n?'on':(i<n?'done':'')}">${i}</i>`).join('<s></s>')}</div>`;
const FUNNEL=(n,body,foot)=>`<div class="fn"><div class="fnh"><b>Add Event</b><span>×</span></div><div class="fnb">${DOTS(n)}${body}${foot}</div></div>`;
const STEP1=()=>FUNNEL(1,`<div class="fnt">Start with the flyer</div>
 <div class="fns">Upload the event flyer — I’ll read it, fill in the details, and guess the event type.</div>
 <div class="dz"><div class="dzt"><div class="naf-doc"></div><b>Click to upload a flyer <span>— or drag &amp; drop</span></b><small>JPG, PNG, WebP, or PDF · max 6 MB</small></div></div>
 <div class="status"></div><div class="skip">No flyer — skip and pick the type →</div>`,
 `<div class="fbar"><span class="gb inv">← Back</span><span class="pb">No flyer — skip →</span></div>`);
const STEP2=()=>FUNNEL(2,`<div class="fnt" style="color:#0F172A">What kind of event is this?</div>
 <div class="fns">Pick a type — the right editor opens next, pre-filled.</div>
 <div class="tcs">${TYPES.map(([k,c,l,d])=>`<div class="tc t-${k}"><span class="aig a-${k}" style="background:${c}">AI guess</span><b><em style="background:${c}"></em>${l}</b><small>${d}</small></div>`).join('')}</div>`,
 `<div class="fbar"><span class="gb">← Back</span></div>`);
const STEP3=()=>FUNNEL(3,`<div class="naf-s3"><div class="t"><em style="background:#0891B2"></em>Learning Labs</div><div class="d">Virtual workshop with signups &amp; Zoom.</div>
 <div class="fr">From your flyer: <b>Reading Aloud at Home</b> · November 12, 2026 · Zoom</div>
 <div class="h">Click <b>Open editor</b> — the editor opens pre-filled; review, then Save there.</div></div>`,
 `<div class="fbar"><span class="gb">← Back</span><span class="pb k-open">Open editor →</span></div>`);

/* ---- the event editor ---- */
const LL={title:'Learning Labs November: Reading Aloud at Home',desc:'A two-part workshop on easy, fun reading routines you can use at home. Free, on Zoom.',
 date:'11/12/2026',time:'5:00 PM',loc:'Zoom',start:'10/01/2026',past:'11/20/2026',rem:'12/31/2026',
 sd:['November 12, 2026, 5:00 PM - Part 1','November 19, 2026, 5:00 PM - Part 2']};
const SWAP={title:'Keiki Book Swap',desc:'Bring a book, take a book. Free for all ages, just drop by.',date:'11/14/2026',time:'9:00 AM',loc:'Community library lawn',start:'10/01/2026',past:'11/15/2026',rem:'12/31/2026'};
/* o.v = filled values (else placeholders), o.flyer = Add Flyer mode, o.lit = glow the filled fields */
const IN=(cls,v,ph,x)=>`<div class="naf-in ${cls} ${x||''} ${v?'':'ph'}">${v||ph}</div>`;
const FD=(lab,inner,req)=>`<div class="naf-fd"><label>${lab}${req?' <u>*</u>':''}</label>${inner}</div>`;
const SDROWS=list=>list.map(s=>`<div class="naf-sd"><span>${s}</span><span class="rm">Remove</span></div>`).join('');
const EDITOR=(o={})=>{const v=o.v||{},fl=!!o.flyer;
 const badge='';
 return `<div class="naf-ed"><div class="naf-edh"><b>${fl?'Add Flyer':'Add Event'}</b>${badge}<span>×</span></div><div class="naf-edb">
 ${FD('Title',IN('f-title',v.title,'Event or program title'),1)}
 ${FD('Description',IN('f-desc',v.desc,'Describe the event or program (max 350 characters)...','tall'))}
 ${fl?'':FD('Source',IN('f-src','Event Zoom (default — Learning Labs, Short Film Contest, etc.)','','dd'))}
 ${FD('Grant / Program',IN('f-grant',v.grant,'Start typing…'))}
 ${FD('Image / Flyer',`<div class="naf-img f-img${v.title?' has':''}"><span class="tn"></span><span class="f-imgt">${v.title?'flyer.jpg':'Click to upload image or PDF'}</span></div>`)}
 ${fl?'':`<div class="naf-info"><span class="naf-cb k-info"></span>This is an information flyer only (shows in the Information section on the home page)</div>`}
 <div class="naf-g2">${FD('Event Date',IN('f-date',v.date,'mm/dd/yyyy'),1)}${FD('Time',IN('f-time',v.time,'e.g. 2:00 PM'))}</div>
 ${FD('Location',IN('f-loc',v.loc,'e.g. Hawai‘i Convention Center'))}
 <div class="naf-g3">${FD('Start Showing',IN('f-start',v.start,'mm/dd/yyyy'),1)}${FD('Move to Past',IN('f-past',v.past,'mm/dd/yyyy'),1)}${FD('Remove Date',IN('f-rem',v.rem,'mm/dd/yyyy'),1)}</div>
 ${fl?'':FD('Signup Date/Time Options',`<div class="naf-sdl f-sd">${SDROWS(v.sd||[])}</div><div class="naf-sdi">${IN('f-new','','e.g., July 8, 2026 - Reading Strategies - 3:00 PM')}<span class="naf-addb">Add</span></div>`)}
 </div><div class="naf-eda"><span class="naf-cancel">Cancel</span><span class="naf-save k-save">Save</span></div></div>`};
const EDWRAP=(o,sc=.9,top=118)=>`<div class="abs naf-edw" style="left:58px;top:${top}px;transform:scale(${sc});transform-origin:top left">${EDITOR(o)}</div>`;

/* ---- the Events & Programs page ---- */
const NAV=()=>`<div class="naf-side"><div class="gh dim">My Day</div><div class="gh dim">Contacts</div><div class="gh dim">Reports</div>
 <div class="gh">Content Management</div>${['Dashboard','Team &amp; Board','Galleries','Resources','FAQs','Events &amp; Programs','Home Rotation','Volunteers','Website Data'].map(t=>`<div class="it${t.startsWith('Events')?' k-evnav':''}">${t}</div>`).join('')}</div>`;
const CARD=(t,k,g,o={})=>`<div class="naf-cd${o.cls?' '+o.cls:''}"><div class="im" style="background:${g}"></div><b>${t}</b><span class="bd" style="background:${TCOL[k]}">${TYPES.find(x=>x[0]===k)[2]}</span>
 <div class="naf-lk"><span>Edit</span><span>View Signups</span><span class="ar k-arch">Archive</span></div></div>`;
const CHIPS=`<div class="naf-chips">${['All','Learning Labs','Parent Talk Cafe','Connect-Gen','Screening','Remote Signup','Outreach Booth','Flyer'].map((c,i)=>`<span class="naf-chip${i?'':' act'}">${c}</span>`).join('')}</div>`;
const EVPAGE=(o={})=>`<div class="naf-dash"${o.narrow?' style="width:715px"':''}>${o.narrow?'':NAV()}<div class="naf-main"><h3>Events &amp; Programs</h3>${CHIPS}
 <div class="naf-tbar"><span class="naf-add k-add">+ Add Event</span><span class="naf-ghb k-hid">Show expired &amp; archived</span></div>
 <div class="naf-sec"><i style="background:#10b981"></i>Active / Upcoming (3)</div>
 <div class="naf-cards">${CARD('Learning Labs November: Reading Aloud at Home','learning_labs','linear-gradient(135deg,#0E7490,#22A6C7)',{cls:o.newCard?'new k-new':''})}${CARD('Keiki Book Swap','flyer','linear-gradient(135deg,#B45309,#FDE68A)')}${CARD('Parent Talk Cafe: Homework Without Tears','parent_talk_cafe','linear-gradient(135deg,#C2410C,#FDBA74)')}</div>
 ${o.past?`<div class="naf-sec gr k-past"><i style="background:#f59e0b"></i>Past Events (1) <small>Event date passed, still visible on public sites</small></div>
 <div class="naf-cards">${CARD('Learning Labs October: Calm Mornings','learning_labs','linear-gradient(135deg,#155E75,#67E8F9)')}</div>`:''}
 <div class="k-hidden"></div></div></div>`;

/* ---- quiz (copied from super-partner-workflow.html; the intro line says how the score counts) ---- */
function ask(Q,i,sec){const w=q('.qwrap');
 w.innerHTML=`<div class="qcard"><div class="qn">Question ${i+1}</div><div class="qq">${Q.q}</div>${Q.o.map((o,j)=>`<button class="qo" data-j="${j}"><span class="L">${'ABC'[j]}</span><span>${o}</span></button>`).join('')}<div class="qfb"></div></div>`;
 const card=w.firstChild,fb=card.querySelector('.qfb'),btns=[...card.querySelectorAll('.qo')];
 const finish=()=>{btns.forEach(b=>b.disabled=true);btns[Q.a].classList.add('yes');const st=all('.stars i')[i];if(st)st.classList.add('on');fb.className='qfb good';fb.textContent='Yes! '+Q.y};
 if(FAST){finish();return Promise.resolve()}
 return new Promise(res=>{btns.forEach((b,j)=>b.onclick=async()=>{
  if(b.disabled)return;
  if(window.ldahTrack)ldahTrack.quiz(sec,i,j===Q.a);
  if(j===Q.a){finish();const p=pos(b);confetti(p.x+60,p.y+20,70);await speak('Yes! '+Q.y,run);await wait(700);res()}
  else{b.disabled=true;b.classList.add('no');fb.className='qfb bad';fb.textContent='Not quite. '+Q.n+' Try again.';speak('Not quite. '+Q.n+' Try again.',run)}})})}
/* The first quiz explains how the score works; the second just starts. */
const QUIZ=(sec,qs,first)=>({cls:'quiz',html:()=>HEAD('Quick check · '+sec,'Your turn!')+`<div class="stars">${qs.map(()=>'<i></i>').join('')}</div><div class="qwrap"><div class="qintro">${qs.length} quick question${qs.length>1?'s':''}.${first?'<small>Click the answer you think is right. Your FIRST answer to each question is your score. There are 5 questions in this training: get 4 right first time to pass. If you miss one, try again to carry on.</small>':''}</div></div>${first?'<div class="qhelp">Take your time. The next question waits for you.</div>':''}`,
 steps:[{say:first?`Quick check! ${qs.length} questions. Click the answer you think is right. Your first answer to each question is what counts. There are five questions in this training, and you need four right first time to pass. If you miss one, just try again to carry on.`:`Quick check. ${qs.length} question${qs.length>1?'s':''}. First answers count.`},
  ...qs.map((Q,i)=>({say:`Question ${i+1}. ${Q.q}`,act:()=>ask(Q,i,sec)}))]});

const SC=[
// ================= 1 COVER =================
{cls:'cover',html:()=>`${LOGOBADGE}<div class="brand">Leadership in Disabilities &amp; Achievement of Hawaiʻi · New staff training</div><div class="hello" style="top:150px">Aloha <span class="nm"></span></div>
 <h1>Adding a flyer or event</h1><p class="sub">Upload the flyer, let the AI fill in the form, then check it, set the dates and publish it. About eight minutes, with a five-question quiz.</p>
 <div class="abs" style="left:800px;top:130px;transform:rotate(-6deg);animation:bob 5s ease-in-out infinite">${FLYER('ll')}</div>
 <div class="abs" style="left:990px;top:220px;transform:rotate(7deg);animation:bob 5s 1.2s ease-in-out infinite">${FLYER('swap')}</div>
 <div class="spark" style="left:1190px;top:120px">${SPARK}</div><div class="spark" style="left:760px;top:440px;animation-delay:1s">${SPARK}</div>
 <div class="gate"><button class="btn" data-go="start">Start training</button><button class="btn ghost" data-go="skip">Skip for now</button><label><input type="checkbox" id="voiceChk" checked> Read it out loud to me</label></div>${WAVES}`,
 steps:[{say:'Aloha {name}, and welcome to LDAH! This training shows you how to put a flyer or an event on our website. The AI does the typing. You do the checking. About eight minutes, with a short quiz.'}]},

// ================= 2 THE BIG IDEA =================
{html:()=>HEAD('First, the big idea','Is there anything to sign up for?')+`<div class="naf-two">
 <div class="naf-k flc"><h4>No: it is a Flyer</h4><div class="q">An announcement. Nothing to sign up for.</div><ul>
  <li>One <b>Event Date</b>. No signup dates.</li><li>Home page, under <b>News and Information</b></li><li>On the website <b>calendar</b></li></ul></div>
 <div class="naf-k ev"><h4>Yes: it is an event</h4><div class="q">Families pick a date and sign up.</div><ul>
  <li><b>Signup Date/Time Options</b>, one per session</li><li>A card on the <b>Events page</b> with a <b>Sign Up</b> button</li><li>Confirmation and reminder emails</li></ul></div></div>
 <div class="naf-types"><div class="naf-tg"><h6>Take signups</h6>${PILL('learning_labs')}${PILL('parent_talk_cafe')}${PILL('connect_gen')}${PILL('remote_signup')}</div>
  <div class="naf-tg"><h6>A table, QR form on the day</h6>${PILL('screening')}${PILL('outreach_booth')}<p>An Outreach Booth is <b>someone else’s event</b>. We run a table.</p></div>
  <div class="naf-tg"><h6>No signups</h6>${PILL('flyer')}</div></div>`,
 steps:[{say:'Before you touch anything, ask one question about the flyer. Is there anything on it for a family to sign up for?'},
 {say:'If the answer is no, it is a Flyer. An announcement, like a book swap. One date, no signup dates. It shows on the home page under News and Information, and on the calendar.',act:async()=>{const c=q('.naf-k.flc');await show(c);spot(c,6)}},
 {say:'If the answer is yes, it is an event. It has signup dates, a card on the Events page with a Sign Up button, and confirmation and reminder emails.',act:async()=>{const c=q('.naf-k.ev');await show(c);spot(c,6)}},
 {say:'The type you pick decides which one you get. Learning Labs, Parent Talk Cafe, Connect-Gen and Remote Signup all take signups. Flyer never does.',act:async()=>{spot(null);const t=q('.naf-types');await show(t);spot(t.children[0],5);await wait(1600);spot(t.children[2],5)}},
 {say:'Screening and Outreach Booth are tables with a QR form on the day. And an Outreach Booth is somebody else’s event. We are a guest with a table.',act:async()=>spot(q('.naf-types').children[1],5)}]},

// ================= 3 GETTING THERE =================
{html:()=>HEAD('Getting there','Content Management → Events & Programs')+EVPAGE(),
 steps:[{say:'In the staff dashboard, open Content Management in the side menu, then click Events and Programs.',act:async()=>{const n=q('.k-evnav');place(640,700,0);await tap(n,950);n.classList.add('on');hideCursor();spot(n,3)}},
 {say:'This one list holds events, programs and flyers. The chips along the top filter it by type.',act:async()=>{spot(q('.naf-chips'),6);await wait(1800);spot(q('.naf-cards'),6)}},
 {say:'One button makes all of them: plus Add Event.',act:async()=>{spot(null);const b=q('.k-add');await move(b,850);spot(b,6)}},
 {say:'Click it. Three steps: the flyer, the type, then the form.',act:async()=>{const b=q('.k-add');spot(null);await click(b);hideCursor();
   const m=add(`<div class="abs" style="left:330px;top:130px;transform:scale(.88);transform-origin:top left;z-index:20">${STEP1()}</div>`);
   await anim(m,[{opacity:0,transform:'scale(.6)'},{opacity:1,transform:'scale(.88)'}],500);await wait(600);spot(m.querySelector('.stp'),8)}}]},

// ================= 4 STEP 1: UPLOAD =================
{html:()=>HEAD('Step 1 · The flyer','Drop it in, and let it read')+`<div class="abs" style="left:58px;top:128px">${STEP1()}</div>
 <div class="abs fw" style="left:470px;top:452px;transform:scale(.7);transform-origin:top left;z-index:10">${FLYER('ll')}</div>`+PTS([
 'Drag the flyer onto the dashed box, or <b>click</b> the box and pick the file.',
 '<b>JPG, PNG, WebP or PDF</b>, no bigger than <b>6 MB</b>.',
 'An iPhone photo is often a <b>HEIC</b>. It is refused, so save it as a JPG first.',
 'Let go, then wait: <b>Reading your flyer… (about 5–8 seconds)</b>',
 '<b>Nothing is saved yet.</b> No flyer? Use the <b>skip</b> link.']),
 steps:[{say:'Step one. Drag the flyer onto the dashed box, or click the box and pick the file.',li:0,act:async()=>{const z=q('.dz'),f=q('.fw'),zp=pos(z),fp=pos(f);
   const tx=zp.x+zp.w/2-fp.x-70,ty=zp.y+zp.h/2-fp.y-90;f.dataset.t=`translate(${tx}px,${ty}px) rotate(-6deg)`;
   await anim(f,[{transform:'scale(.7)'},{transform:f.dataset.t+' scale(.7)'}],1100,'cubic-bezier(.4,.1,.3,1)');z.classList.add('over')}},
 {say:'JPG, PNG, WebP or PDF, up to six megabytes.',li:1,act:async()=>spot(q('.dz small'),6)},
 {say:'An iPhone photo is often a HEIC file. That is refused, so save it as a JPG first.',li:2,act:async()=>{spot(null);await wait(400)}},
 {say:'Let go, and it says, Reading your flyer. Give it five to eight seconds.',li:3,act:async()=>{const z=q('.dz'),f=q('.fw');
   if(f.dataset.t)await anim(f,[{transform:f.dataset.t+' scale(.7)',opacity:1},{transform:f.dataset.t+' scale(.15)',opacity:0}],450);f.style.opacity=0;z.classList.remove('over');
   const s=q('.status');s.innerHTML='Reading your flyer… (about 5–8 seconds)';spot(s,7)}},
 {say:'Nothing is saved yet. And with no flyer at all, the skip link lets you fill in the form yourself.',li:4,act:async()=>spot(q('.skip'),6)}]},

// ================= 5 STEP 2 + 3: TYPE =================
{html:()=>HEAD('Step 2 · The type','The AI guesses. You decide.')+`<div class="abs k-fn" style="left:58px;top:124px;transform:scale(.93);transform-origin:top left">${STEP2()}</div>`+PTS([
 'Seven cards, one for each type.',
 'The <b>AI guess</b> badge marks its best guess. It is <b>only a suggestion</b>.',
 'Check it against the flyer. <b>Your click wins.</b>',
 'Step 3 shows what it read. Click <b>Open editor →</b>']),
 steps:[{say:'Step two. Seven cards, one per type.',li:0,act:async()=>{for(const c of all('.tc')){await anim(c,[{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],180)}}},
 {say:'The AI marks its best guess with a badge. Here it guessed Remote Signup.',li:1,act:async()=>{const c=q('.t-remote_signup');c.classList.add('gs');c.style.borderColor=TCOL.remote_signup;q('.a-remote_signup').classList.add('on');spot(c,5)}},
 {say:'But Remote Signup is for in-person events away from the office, and this flyer says Zoom. It is Learning Labs, so click Learning Labs. Your click wins.',li:2,act:async()=>{spot(null);const t=q('.t-learning_labs');await tap(t,900);t.classList.add('gs');t.style.borderColor=TCOL.learning_labs;hideCursor()}},
 {say:'Step three shows what it read. Click Open editor.',li:3,act:async()=>{const w=q('.k-fn');w.innerHTML=STEP3();await anim(w,[{opacity:.3},{opacity:1}],350,'ease-out');spot(q('.naf-s3 .fr'),5);await wait(1500);spot(null);await tap('.k-open',800);hideCursor()}}]},

// ================= 6 THE FORM FILLS ITSELF IN =================
{html:()=>HEAD('Step 3 · The form','It fills itself in')+EDWRAP({})+PTS([
 'Title, with the <b>month</b> added',
