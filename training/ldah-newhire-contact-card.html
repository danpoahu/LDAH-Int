<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Contact Card — Training</title>
<link rel="stylesheet" href="deck-base.css">
<!-- Same Firebase build as the dashboard, so the deck shares its sign-in and records progress. -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
/* Every class here starts with cc- so nothing collides with deck-base.css. */
/* ---------- logo ---------- */
.cc-logo{position:absolute;left:70px;top:22px;background:#fff;border-radius:14px;padding:6px 10px;box-shadow:0 4px 14px rgba(0,0,0,.18);animation:rise .6s both}
.cc-logo img{height:80px;display:block}
/* ---------- section cover + road map ---------- */
.sect .brand{left:290px;top:150px}
.sect h1{left:290px;top:185px;width:900px;font-size:58px}
.sect .sub{left:290px;top:330px;width:860px}
.cc-bign{position:absolute;left:80px;top:150px;width:170px;height:170px;border-radius:50%;background:#F9A8D4;color:#0B3A53;font-size:100px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 20px 50px rgba(0,0,0,.3);animation:popn .9s .2s both}
.cc-road{position:absolute;left:80px;width:1120px;top:440px;display:flex;justify-content:space-between;animation:rise .6s .5s both}
.cc-road::before{content:"";position:absolute;left:160px;right:160px;top:22px;height:4px;background:rgba(255,255,255,.3);border-radius:2px}
.cc-stop{position:relative;width:300px;text-align:center;font-size:17px;font-weight:700;opacity:.75}
.cc-stop i{display:block;width:48px;height:48px;border-radius:50%;margin:0 auto 8px;background:#0E7490;border:3px solid rgba(255,255,255,.55);font-style:normal;font-weight:900;line-height:42px;font-size:21px}
.cc-stop.done{opacity:1}.cc-stop.done i{background:#22C55E;border-color:#22C55E}
.cc-stop.now{opacity:1}.cc-stop.now i{background:#F9A8D4;color:#0B3A53;border-color:#fff;animation:bnc 1.3s ease-in-out infinite}
/* ---------- shared window chrome ---------- */
.cc-win{position:absolute;left:58px;top:118px;width:712px;height:568px;background:#F4F6F9;border:1px solid #D5DEE8;border-radius:12px;overflow:hidden;box-shadow:0 14px 36px rgba(15,23,42,.16);font-family:"Source Sans 3","Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:#1E293B;line-height:1.3}
.cc-top{height:42px;background:linear-gradient(90deg,#0E7490,#0891B2);display:flex;align-items:center;gap:10px;padding:0 12px;color:#fff}
.cc-brand{font-weight:800;font-size:14px;white-space:nowrap}
.cc-gs{flex:1;height:26px;border-radius:13px;background:rgba(255,255,255,.95);color:#94A3B8;font-size:11.5px;display:flex;align-items:center;padding:0 12px;white-space:nowrap;overflow:hidden}
.cc-ni{background:#fff;color:#0E7490;font-weight:800;font-size:11.5px;border-radius:8px;padding:5px 10px;white-space:nowrap}
.cc-nav{position:absolute;left:0;top:42px;bottom:0;width:128px;background:#fff;border-right:1px solid #E2E8F0;padding:12px 8px;font-size:12.5px}
.cc-nav .cc-ng{font-size:10px;font-weight:800;color:#94A3B8;text-transform:uppercase;letter-spacing:.06em;padding:0 8px 6px}
.cc-nav div:not(.cc-ng){padding:6px 9px;border-radius:6px;color:#334155;margin-bottom:2px;transition:background .3s}
.cc-nav div.act{background:#E0F2FE;color:#0E6E8C;font-weight:700}
.cc-main{position:absolute;left:128px;right:0;top:42px;bottom:0;padding:12px 14px}
.cc-main h3{margin:0 0 8px;font-size:19px;color:#0B3A53}
.cc-main h3 small{font-size:13px;color:#64748B;font-weight:600}
.cc-tb{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.cc-srch{flex:1;height:32px;border:1.5px solid #CBD5E1;border-radius:9px;background:#fff;font-size:12.5px;display:flex;align-items:center;padding:0 10px;white-space:nowrap;overflow:hidden;transition:border-color .3s,box-shadow .3s}
.cc-srch.ph{color:#94A3B8}
.cc-tick{font-size:11px;color:#475569;white-space:nowrap;display:flex;align-items:center;gap:4px}
.cc-tick::before{content:"";width:11px;height:11px;border:1.5px solid #94A3B8;border-radius:3px;background:#fff}
.cc-add{background:#0891B2;color:#fff;font-weight:800;font-size:12px;border-radius:8px;padding:8px 10px;white-space:nowrap}
.cc-az{display:flex;gap:4px;font-size:10.5px;font-weight:700;color:#0E7490;margin-bottom:8px;letter-spacing:.02em}
.cc-lh,.cc-row{display:grid;grid-template-columns:1.7fr 1fr .7fr .5fr;gap:8px;align-items:center}
.cc-lh{font-size:10px;font-weight:800;color:#64748B;text-transform:uppercase;letter-spacing:.05em;padding:6px 10px;background:#EEF2F6;border-radius:8px 8px 0 0}
.cc-rows{background:#fff;border:1px solid #E2E8F0;border-top:0;border-radius:0 0 8px 8px}
.cc-row{padding:7px 10px;border-top:1px solid #F1F5F9;font-size:12px;transition:background .3s}
.cc-row b{display:block;font-size:13px}
.cc-row small{display:block;color:#64748B;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-row.hi{background:#F0F9FF}
.cc-tp{display:inline-block;font-size:10px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.cc-tp.par{background:#EDE9FE;color:#7C3AED}.cc-tp.pro{background:#CCFBF1;color:#0D9488}.cc-tp.org{background:#FEF3C7;color:#B45309}
.cc-ok{color:#16A34A;font-weight:900}
.cc-none{padding:22px;text-align:center;color:#94A3B8;font-size:13px}
.typing::after{content:"|";color:#0891B2;animation:blink .6s steps(1) infinite}
.foc{border-color:#0891B2!important;box-shadow:0 0 0 3px rgba(8,145,178,.15)}
/* ---------- the contact card ---------- */
.cc-card{position:absolute;left:58px;top:118px;width:712px;height:568px;background:#fff;border-radius:14px;box-shadow:0 18px 44px rgba(15,23,42,.22);overflow:hidden;z-index:5;font-family:"Source Sans 3","Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:#1E293B;line-height:1.3}
.cc-ch{height:46px;background:#0E7490;color:#fff;display:flex;align-items:center;gap:8px;padding:0 16px}
.cc-ch b{font-size:17px;margin-right:4px}
.cc-pl{font-size:11px;font-weight:700;border-radius:999px;padding:3px 10px;color:#fff}
.cc-x{margin-left:auto;font-size:22px}
.cc-cb{position:absolute;top:46px;bottom:48px;left:0;right:0;display:grid;grid-template-columns:232px 1fr}
.cc-rail{background:#F3F9FB;border-right:1.5px solid #DCEFF4;overflow:hidden;position:relative}
.cc-mc{overflow:hidden;position:relative}
.cc-in{padding:12px 14px 30px}
.cc-f{margin-bottom:7px}
.cc-f label{display:block;font-size:9.5px;font-weight:800;color:#64748B;text-transform:uppercase;letter-spacing:.05em}
.cc-f div{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-f a{color:#0E7490;text-decoration:underline}
.cc-acc{font-size:12.5px;font-weight:700;color:#0369A1;margin-top:9px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc-acc small{font-weight:400;color:#94A3B8}
.cc-acc .cc-ar{display:inline-block;width:12px;font-size:9px}
.cc-acc.gr{color:#059669}
.cc-pnl{display:none;margin-top:6px}
.cc-pnl.open{display:block}
.cc-dsec{background:#fff;border:1px solid #E2E8F0;border-radius:8px;padding:6px 9px;margin-bottom:6px;font-size:11.5px}
.cc-dsec b{display:block;font-size:10px;color:#0369A1;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.cc-upl{display:inline-block;font-size:11px;font-weight:700;color:#065F46;background:#ECFDF5;border:1px solid #A7F3D0;border-radius:999px;padding:4px 11px}
.cc-scp{background:#fff;border:1px solid #A7F3D0;border-radius:8px;padding:8px 10px;font-size:11px;line-height:1.45}
.cc-scp i{display:block;color:#64748B;margin-bottom:5px}
.cc-scp .rs{margin-top:6px;padding-top:5px;border-top:2px solid #A7F3D0}
.cc-scp .rs h6{margin:0 0 2px;font-size:11.5px;color:#166534}
.cc-sl{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#0369A1;margin:2px 0 5px}
.cc-child{border:2px solid #BAE6FD;background:linear-gradient(180deg,#F0F9FF,#fff);border-radius:11px;padding:9px 12px;margin-bottom:10px}
.cc-child .t{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.cc-child .t b{font-size:15px}
.cc-child .t span{font-size:11px;color:#0369A1;font-weight:700;background:#E0F2FE;border-radius:999px;padding:1px 8px}
.cc-child .t em{font-style:normal;font-size:11px;color:#64748B}
.cc-child .g{display:flex;gap:20px;margin-top:5px;font-size:12px}
.cc-child .g label{display:block;font-size:9.5px;font-weight:800;color:#64748B;text-transform:uppercase}
.cc-cpill{display:inline-block;margin-top:6px;font-size:10.5px;font-weight:700;color:#7C3AED;background:#F5F3FF;border:1px solid #DDD6FE;border-radius:999px;padding:2px 9px}
.cc-note{background:#FFFBEB;border:1px solid #FDE68A;border-left:4px solid #F59E0B;border-radius:0 10px 10px 0;padding:7px 11px;margin-bottom:10px;font-size:12px}
.cc-note small{display:block;color:#92400E;font-size:10.5px;margin-top:3px}
.cc-tl{font-size:12.5px;font-weight:800;color:#0B3A53;margin:4px 0 6px}
.cc-ix{border:1px solid #E2E8F0;border-radius:10px;padding:7px 10px;margin-bottom:7px;background:#fff;font-size:11.5px}
.cc-ix .t{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-bottom:3px}
.cc-ix .t span{font-size:10px;font-weight:700;border-radius:999px;padding:1px 7px;background:#F1F5F9;color:#475569;white-space:nowrap}
.cc-ix .t .d{background:none;padding:0;color:#64748B}
.cc-ix .t .op{background:#FEF3C7;color:#D97706}.cc-ix .t .cd{background:#D1FAE5;color:#059669}
.cc-ix .t .su{background:#E0F2FE;color:#0369A1}.cc-ix .t .at{background:#DCFCE7;color:#15803D}
.cc-ix .s{font-weight:700;font-size:12.5px}
.cc-ix .o{color:#94A3B8;font-size:10.5px;margin-top:2px}
.cc-ix.new{border-color:#0891B2;box-shadow:0 0 0 3px rgba(8,145,178,.15)}
.cc-em{margin-top:10px;padding-top:8px;border-top:1px solid #E2E8F0;font-weight:700;color:#0891B2;font-size:12.5px}
.cc-em small{font-weight:400;color:#64748B;margin-left:6px}
.cc-cf{position:absolute;left:0;right:0;bottom:0;height:48px;border-top:1px solid #E2E8F0;background:#fff;display:flex;justify-content:flex-end;gap:8px;padding:8px 14px}
.cc-cf span{border-radius:8px;font-size:12.5px;font-weight:700;padding:7px 14px}
.cc-cf .c{border:1.5px solid #CBD5E1;color:#334155}
.cc-cf .e{background:#0891B2;color:#fff}
/* ---------- New Interaction modal ---------- */
.cc-bar{position:absolute;left:58px;top:118px;width:712px;height:42px;border-radius:12px;background:linear-gradient(90deg,#0E7490,#0891B2);display:flex;align-items:center;gap:10px;padding:0 12px;color:#fff;font-family:"Source Sans 3","Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.cc-mod{position:absolute;left:58px;top:170px;width:712px;height:516px;background:#fff;border-radius:14px;box-shadow:0 20px 50px rgba(15,23,42,.28);overflow:hidden;font-family:"Source Sans 3","Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:#1E293B;line-height:1.3;opacity:0}
.cc-mh{height:42px;display:flex;align-items:center;gap:8px;padding:0 14px;background:linear-gradient(90deg,#0E7490,#22A6C7);color:#fff;font-weight:800;font-size:15px}
.cc-mh .cc-x{font-size:20px}
.cc-mb{padding:8px 16px}
.cc-fl{display:block;font-size:11px;font-weight:800;color:#334155;margin:6px 0 3px}
.cc-chips{display:flex;flex-wrap:wrap;gap:5px}
.cc-chip{font-size:11px;font-weight:700;border:1.5px solid #CBD5E1;border-radius:999px;padding:3px 10px;color:#475569;background:#fff;white-space:nowrap;transition:background .2s,color .2s,border-color .2s}
.cc-chip.on{background:#0891B2;border-color:#0891B2;color:#fff}
.cc-in2{height:28px;border:1.5px solid #CBD5E1;border-radius:8px;background:#fff;font-size:12px;display:flex;align-items:center;padding:0 9px;white-space:nowrap;overflow:hidden;transition:border-color .3s,box-shadow .3s}
.cc-in2.ph{color:#94A3B8}
.cc-in2.ta{height:42px;align-items:flex-start;padding-top:5px;white-space:normal;line-height:1.3}
.cc-cw{display:flex;gap:6px;position:relative}
.cc-cw .cc-in2{flex:1}
.cc-plus{width:28px;height:28px;border-radius:8px;background:#0891B2;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center}
.cc-dd{position:absolute;left:0;right:34px;top:30px;background:#fff;border:1px solid #CBD5E1;border-radius:8px;box-shadow:0 10px 24px rgba(15,23,42,.18);z-index:4;font-size:12px}
.cc-dd div{padding:6px 10px}
.cc-dd div small{color:#64748B;margin-left:6px}
.cc-dd div.hi{background:#E0F2FE}
.cc-trio{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:12px}
.cc-req{color:#DC2626}
.cc-ma{position:absolute;left:0;right:0;bottom:0;height:50px;border-top:1px solid #E2E8F0;display:flex;justify-content:flex-end;align-items:center;padding:0 16px}
.cc-sv{background:#0891B2;color:#fff;font-weight:800;font-size:13px;border-radius:9px;padding:8px 18px}
/* ---------- Add Contact form ---------- */
.cc-form{position:absolute;left:58px;top:118px;width:712px;height:568px;background:#fff;border-radius:14px;box-shadow:0 20px 50px rgba(15,23,42,.26);overflow:hidden;z-index:6;font-family:"Source Sans 3","Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:#1E293B;line-height:1.3}
.cc-fb{padding:6px 18px}
.cc-g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cc-hint{font-size:10.5px;color:#64748B;margin-top:2px}
.cc-radio{display:flex;gap:14px;font-size:12px}
.cc-radio span{display:flex;align-items:center;gap:5px}
.cc-radio span::before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid #94A3B8;box-sizing:border-box}
.cc-radio span.on::before{border-color:#0891B2;background:#0891B2;box-shadow:inset 0 0 0 2px #fff}
.cc-fold{margin-top:8px;font-size:12px;font-weight:700;color:#0369A1;border-top:1px dashed #E2E8F0;padding-top:6px}
.cc-dem{margin-top:8px;font-size:10.5px;font-weight:800;color:#0369A1;letter-spacing:.08em;border-bottom:2px solid #E0F2FE;padding-bottom:3px}
.cc-toast{position:absolute;left:18px;right:18px;bottom:58px;border-radius:10px;color:#fff;font-size:13px;font-weight:600;line-height:1.4;padding:10px 14px;box-shadow:0 10px 24px rgba(15,23,42,.25);z-index:8}
.cc-toast.red{background:#DC2626}.cc-toast.amb{background:#B45309}.cc-toast.blu{background:#0891B2}
/* duplicate dialog */
.cc-dov{position:absolute;inset:0;background:rgba(15,23,42,.5);z-index:9}
.cc-dg{position:absolute;left:66px;right:66px;top:70px;background:#fff;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.35);overflow:hidden;font-size:12.5px}
.cc-dgh{display:flex;gap:10px;align-items:center;padding:12px 16px;background:#FFFBEB;border-bottom:1px solid #FDE68A}
.cc-dgh .ic{width:30px;height:30px;border-radius:50%;background:#F59E0B;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none}
.cc-dgh b{display:block;font-size:15px;color:#0F172A}
.cc-dgh span{color:#92400E;font-size:12px}
.cc-dgb{padding:10px 16px}
.cc-dgb p{margin:0 0 8px;color:#475569}
.cc-dgr{display:flex;align-items:center;gap:10px;border:1px solid #E2E8F0;border-radius:10px;padding:7px 10px}
.cc-dgr .av{width:30px;height:30px;border-radius:50%;background:#E0F2FE;color:#0369A1;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:11px}
.cc-dgr .nm{flex:1}.cc-dgr .nm b{display:block}.cc-dgr .nm span{font-size:11px;color:#64748B}
.cc-dgr .tg{font-size:10.5px;font-weight:800;color:#B45309;background:#FEF3C7;border-radius:999px;padding:2px 9px}
.cc-dga{display:flex;flex-direction:column;gap:6px;padding:4px 16px 14px}
.cc-dga span{border-radius:9px;padding:8px 12px;font-weight:700;text-align:center}
.cc-dga .u{background:#0891B2;color:#fff}.cc-dga .n{background:#fff;color:#DC2626;border:1.5px solid #FCA5A5}.cc-dga .x{color:#475569;border:1.5px solid #CBD5E1}
/* ---------- intro + don't cards ---------- */
.cc-why{position:absolute;left:70px;top:132px;width:1140px;display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.cc-wc{background:#fff;border-radius:16px;box-shadow:0 10px 26px rgba(15,23,42,.1);padding:16px 18px;border-top:8px solid #0891B2;opacity:0;height:380px;position:relative;overflow:hidden}
.cc-wc.pu{border-top-color:#7C3AED}.cc-wc.gr{border-top-color:#16A34A}
.cc-wc h4{margin:0 0 4px;font-size:23px;color:#0B3A53}
.cc-wc p{font-size:17px;color:#475569;line-height:1.4;margin:0;position:absolute;left:18px;right:18px;bottom:16px}
.cc-wc p b{color:#0F172A}
.cc-art{position:relative;height:170px;margin-top:14px}
.cc-mini{position:absolute;width:150px;height:96px;background:#fff;border:1px solid #CBD5E1;border-radius:8px;box-shadow:0 4px 10px rgba(15,23,42,.12);padding:8px 10px;font-size:11px;color:#64748B}
.cc-mini b{display:block;color:#0B3A53;font-size:13px}
.cc-mini u{display:block;height:5px;background:#E2E8F0;border-radius:3px;margin-top:6px;text-decoration:none}
.cc-x2{position:absolute;font-size:64px;font-weight:900;color:#DC2626;line-height:1}
.cc-tlx{position:absolute;left:30px;top:0;bottom:0;width:4px;background:#BAE6FD;border-radius:2px}
.cc-tli{position:absolute;left:18px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:#334155}
.cc-tli i{width:28px;height:28px;border-radius:50%;background:#0891B2;border:3px solid #fff;box-shadow:0 0 0 2px #BAE6FD}
.cc-reach{display:flex;gap:16px;justify-content:center;margin-top:24px}
.cc-reach div{width:100px;height:100px;border-radius:20px;background:#F0FDF4;border:2px solid #86EFAC;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;color:#15803D;font-size:14px;gap:6px}
.cc-reach div b{font-size:30px;line-height:1}
.cc-dont{position:absolute;left:70px;top:128px;width:1140px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.cc-dc{background:#fff;border-radius:14px;box-shadow:0 8px 22px rgba(15,23,42,.1);padding:12px 16px;border-left:7px solid #DC2626;opacity:0;height:178px;position:relative}
.cc-dc h4{margin:0 0 6px;font-size:19px;color:#0B3A53}
.cc-dc .bad{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;color:#B91C1C;background:#FEF2F2;border-radius:6px;padding:4px 8px;display:inline-block;text-decoration:line-through;text-decoration-thickness:2px}
.cc-dc .ins{position:absolute;left:16px;right:16px;bottom:12px;font-size:15.5px;color:#334155;line-height:1.35}
.cc-dc .ins b{color:#15803D}
.cc-dnote{position:absolute;left:70px;top:536px;width:1140px;background:#FEF3C7;border-left:6px solid #F59E0B;border-radius:12px;padding:12px 18px;font-size:18px;line-height:1.4;color:#0F172A;opacity:0}
/* ---------- quiz (same as entering-screening-results) ---------- */
.scene.quiz{background:linear-gradient(135deg,#FFF1F8,#E0F7FA)}
.qwrap{position:absolute;left:0;top:0;right:0;bottom:0}
.qintro{position:absolute;left:120px;top:190px;width:1040px;text-align:center;font-size:30px;font-weight:800;color:#0B3A53;line-height:1.35;animation:rise .5s both}

<script>
const DECK_ID='ldah-newhire-contact-card';
/* Five questions across the two QUIZ scenes. deck-tracker.js counts them itself;

window.QUIZ_TOTAL=5;

/* Every screen below is drawn in HTML/CSS from LDAH Internal index.html (v151.79,
   2026-10-01): the Contacts list, the contact card (.ctd2 rail + main), New Interaction,

   example.org and phones the 555-01xx range. */
const LOGO='../logo_blue.png';
const LOGOBOX=`<div class="cc-logo"><img src="${LOGO}" alt="LDAH"></div>`;

/* ---- small helpers ---- */
const tap=async(s,ms=850)=>{const e=typeof s==='string'?q(s):s;await move(e,ms);await click(e);return e};
function all(s){return[...document.querySelectorAll('.scene.on '+s)]}
const show=(e,ms=500)=>anim(e,[{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],ms,'ease-out').then(()=>{e.style.opacity=1});
const PTS=(items,top=140,left=790,w=440)=>`<div class="abs" style="left:${left}px;top:${top}px;width:${w}px"><ul class="pts">${items.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
async function scrollTo(sel,y,ms=600){const e=q(sel);const from=+e.dataset.y||0;await anim(e,[{transform:`translateY(${-from}px)`},{transform:`translateY(${-y}px)`}],ms,'ease-in-out');e.dataset.y=y}
function setY(sel,y){const e=q(sel);e.style.transform=`translateY(${-y}px)`;e.dataset.y=y}
async function typeIn(sel,text,ms=45){const e=q(sel);await tap(e,600);e.classList.add('foc');await type(e,text,ms);e.classList.remove('foc');return e}
function toast(cls,html,host){const old=q('.cc-toast');if(old)old.remove();const t=add(`<div class="cc-toast ${cls}">${html}</div>`,host||q('.cc-form'));return anim(t,[{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],350,'ease-out').then(()=>t)}

/* ---- section cover + road map ---- */
const STOPS=['Find and read a card','Log an interaction','Add a contact the right way'];
const ROAD=n=>`<div class="cc-road">${STOPS.map((s,i)=>`<div class="cc-stop ${i+1<n?'done':i+1===n?'now':''}"><i>${i+1<n?'✓':i+1}</i>${s}</div>`).join('')}</div>`;

/* ---- quiz (same pattern as super-partner-workflow / entering-screening-results) ---- */
function ask(Q,i,sec){const w=q('.qwrap');
 w.innerHTML=`<div class="qcard"><div class="qn">Question ${i+1}</div><div class="qq">${Q.q}</div>${Q.o.map((o,j)=>`<button class="qo" data-j="${j}"><span class="L">${'ABC'[j]}</span><span>${o}</span></button>`).join('')}<div class="qfb"></div></div>`;
 const card=w.firstChild,fb=card.querySelector('.qfb'),btns=[...card.querySelectorAll('.qo')];
 const finish=()=>{btns.forEach(b=>b.disabled=true);btns[Q.a].classList.add('yes');const st=all('.stars i')[i];if(st)st.classList.add('on');fb.className='qfb good';fb.textContent='Yes! '+Q.y};
 if(FAST){finish();return Promise.resolve()}
 return new Promise(res=>{btns.forEach((b,j)=>b.onclick=async()=>{
  if(b.disabled)return;
  if(window.ldahTrack)ldahTrack.quiz(sec,i,j===Q.a);
  if(j===Q.a){finish();const p=pos(b);confetti(p.x+60,p.y+20,70);await speak('Yes! '+Q.y,run);await wait(700);res()}
  else{b.disabled=true;b.classList.add('no');fb.className='qfb bad';fb.textContent='Not quite. '+Q.n+' Try again.';speak('Not quite. '+Q.n+' Try again.',run)}})})}
/* sec is what the tracker records (its digits name the section); label is what the header shows.
   This quiz is scored: the FIRST answer to each question counts, 70% to pass. */
const QUIZ=(sec,qs,first,label)=>({cls:'quiz',html:()=>HEAD('Quick check · '+(label||sec),'Your turn!')+`<div class="stars">${qs.map(()=>'<i></i>').join('')}</div><div class="qwrap"><div class="qintro">${qs.length} quick question${qs.length>1?'s':''}.${first?'<small>Your first answer to each question counts, and you need 70% across both quick checks to pass. Missed one? Try again to see the right answer.</small>':''}</div></div>${first?'<div class="qhelp">Take your time. The next question waits for you.</div>':''}`,
 steps:[{say:first?`Quick check! ${qs.length} question${qs.length>1?'s':''}. Your first answer to each one counts, and you need seventy percent across both quick checks to pass. If you miss, try again to see the right answer.`:`Quick check. ${qs.length} question${qs.length>1?'s':''}. Remember, your first answer counts.`},
  ...qs.map((Q,i)=>({say:`Question ${i+1}. ${Q.q}`,act:()=>ask(Q,i,sec)}))]});

/* ================= THE CONTACTS LIST ================= */

 ['Dana Ching','dana.ching@example.org','par','Parent/Guardian','Oahu',1],['Ewa Family Center','office@ewa-fc.example.org','org','Organization/Agency','Oahu',1],['Faith Lopes','faith.lopes@example.org','par','Parent/Guardian','Hawaii',1],
 ['Gabe Ono','gabe.ono@example.org','pro','Professional','Oahu',0],['Hana Aiwohi','hana.aiwohi@example.org','par','Parent/Guardian','Molokai',1]];

 <div class="cc-cf k-cf"><span class="c">Close</span><span class="e">Edit Contact</span></div></div>`;
/* The rail accordion, the way _ctAccToggle works: one panel at a time, but never close a
   panel that CONTAINS the one being opened (the screening rows sit inside Screening). */
async function accTap(key){const h=q(`.cc-acc[data-p="${key}"]`),p=q(`.cc-pnl[data-id="${key}"]`);await tap(h,700);const rail=q('.cc-rail');
 const opening=!p.classList.contains('open');
 rail.querySelectorAll('.cc-pnl').forEach(x=>{if(x===p||!x.contains(p))x.classList.remove('open')});
 rail.querySelectorAll('.cc-ar').forEach(a=>a.textContent='▶');
 rail.querySelectorAll('.cc-pnl').forEach(x=>{if(x!==p&&x.contains(p)){const a=x.previousElementSibling.querySelector('.cc-ar');if(a)a.textContent='▼'}});
 if(opening){p.classList.add('open');h.querySelector('.cc-ar').textContent='▼';await anim(p,[{opacity:0,transform:'translateY(-6px)'},{opacity:1,transform:'none'}],320,'ease-out')}}

const TYPES=['Tier 1: Individual Assistance','Tier 2: Training','Tier 3: Workshops','Tier 4: Outreach'];
const IXM=()=>`<div class="cc-bar"><span class="cc-brand">LDAH Internal</span><div class="cc-gs">Search signups, interactions, clients, grants…</div><span class="cc-ni k-ni">+ New Interaction</span></div>

 <span class="cc-fl">Interaction type</span><div class="cc-chips k-type">${TYPES.map(c=>`<span class="cc-chip" data-v="${c}">${c}</span>`).join('')}</div>
 <span class="cc-fl">Client / Entity</span><div class="cc-cw"><div class="cc-in2 ph k-cli">Search or type a name</div><span class="cc-plus">+</span></div>

  <div><span class="cc-fl">Phone</span><div class="cc-in2${o.ph?'':' ph'} k-ph">${o.ph||' '}</div></div></div>

 <div class="cc-dem">DEMOGRAPHICS</div>
 <div class="cc-g2"><div><span class="cc-fl">Zip Code</span><div class="cc-in2${o.zip?'':' ph'} k-zip">${o.zip||' '}</div></div><div><span class="cc-fl">Island <span class="cc-req">*</span></span><div class="cc-in2${o.zip?'':' ph'} k-isl">${o.zip?'Oahu':'Choose…'}</div></div></div>

const SC=[

{cls:'cover',html:()=>`${LOGOBOX}<div class="brand">Leadership in Disabilities &amp; Achievement of Hawaiʻi · New staff</div><div class="hello">Aloha <span class="nm"></span></div>

{html:()=>HEAD('Why the card matters','One person, one card, and a way to reach them')+`<div class="cc-why">

 steps:[{say:'First, why the card matters.'},
 {say:'One person, one card. A second card splits their history in two.',act:async()=>{const c=all('.cc-wc')[0];await show(c);spot(c,6)}},
 {say:'Everything we do with a family lands on their card. Calls, signups, screenings and emails.',act:async()=>{const c=all('.cc-wc')[1];await show(c);spot(c,6)}},

// ================= PART 1 =================
SECT(1,'Find and read a card','Search, open the card, and know what every part of it tells you.','Part one. Find and read a card.'),

{html:()=>HEAD('Part 1 · Find the family','Search first, every time')+DASH()+PTS([
 'Left menu: <b>Contacts</b>.',
 'Search by <b>name, email or phone</b>. A few letters is enough.',
 'Each row: name and email, type, location, and the <b>Opted In</b> tick.',
 '<b>Click the row</b> to open the card.',
 'The <b>top search bar</b> finds contacts too.']),
 steps:[{say:'In the left menu, click Contacts.',li:0,act:async()=>{const n=await tap('.k-nav',800);n.classList.add('act');hideCursor()}},
 {say:'The search box looks at name, email, phone, type and organization, all at once.',li:1,act:async()=>spot(q('.k-srch'),4)},
 {say:'A mom named Malia Kahale calls. Type a few letters of her name. The list narrows as you type.',li:1,act:async()=>{spot(null);await typeIn('.k-srch','kahale',90);q('.k-rows').innerHTML=ROWSK.map(ROW).join('');hideCursor();spot(q('.k-rows'),4)}},
 {say:'Each row shows the name and email, the type, the location, and a green tick if they get our event announcements.',li:2,act:async()=>spot(q('.cc-row'),4)},
 {say:'Two rows match. The email tells you which one is Malia. Click anywhere on her row, and her card opens.',li:3,act:async()=>{spot(null);const r=q('.cc-row');r.classList.add('hi');await tap(r,800);hideCursor()}},
 {say:'The search bar at the very top finds contacts too, and opens the same card.',li:4,act:async()=>spot(q('.k-gs'),4)}]},

{html:()=>HEAD('Part 1 · The card at a glance','Facts on the left, history on the right')+CARD({})+PTS([
 'Top: the <b>name</b>, and pills that flag feedback, case advocacy or membership.',
 'Left rail: <b>who they are</b> and how to reach them.',
 'Right: <b>what has happened</b>.',
 'Bottom: <b>Close</b>, and <b>Edit Contact</b> if your role can edit.',
 'Reading a card <b>never changes anything</b>.']),
 steps:[{say:'This is Malia’s card. Pills beside her name flag things like feedback, an open case advocacy, or a membership.',li:0,act:async()=>spot(q('.cc-ch'),3)},
 {say:'The narrow column on the left is the rail. Who she is, and how to reach her.',li:1,act:async()=>spot(q('.k-facts'),4)},
 {say:'The wide column on the right is what has happened.',li:2,act:async()=>spot(q('.cc-mc'),2)},
 {say:'At the bottom, Close, and Edit Contact if your role can edit.',li:3,act:async()=>spot(q('.k-cf'),2)},
 {say:'Opening and reading a card never changes anything, so open them freely.',li:4,act:async()=>spot(null)}]},

{html:()=>HEAD('Part 1 · The rail panels','Click to unfold, one at a time')+CARD({})+PTS([
 '<b>▶</b> folded, <b>▼</b> open. Click the title.',
 'One panel at a time: opening one <b>folds the others</b>.',
 '<b>Screening</b> is on every card: upload a consent form, open each child’s screening.',
 '<b>Membership</b> and <b>Materials received</b> show only when there is something to show.']),
 steps:[{say:'Under the facts are folded panels. Click Demographics and address.',li:0,act:async()=>{await accTap('demo');hideCursor()}},
 {say:'Mailing address, military status, training and outreach, and accommodations.',li:0,act:async()=>spot(q('.cc-pnl[data-id="demo"]'),4)},
 {say:'The rail opens one panel at a time. Click Screening, and Demographics folds itself away.',li:1,act:async()=>{spot(null);await accTap('scr');hideCursor();spot(q('.cc-pnl[data-id="scr"]'),4)}},
 {say:'Screening is on every card: a button to upload a consent form, and a row for each child’s screening. Click Keoni’s row.',li:2,act:async()=>{spot(null);await scrollTo('.k-rin',190,600);await accTap('det');hideCursor()}},
 {say:'It opens inside the Screening panel, with his consent and his results.',li:2,act:async()=>spot(q('.cc-pnl[data-id="det"]'),4)},
 {say:'Membership and Materials received appear only when a family has them.',li:3,act:async()=>spot(null)}]},

{html:()=>HEAD('Part 1 · The right side','Child, latest note, and the timeline')+CARD({})+PTS([
 '<b>Child</b> cards: age, school, gender, ethnicity, disability.',
 '<b>Latest note</b>: read it before you call back.',
 '<b>Activity Timeline</b>: interactions, with an <b>Open</b> or <b>Closed</b> pill.',
 '…and event <b>signups</b>, with attendance.',
 '<b>Emails</b>: every system email they were sent.']),
 steps:[{say:'On the right, the child. Age range, school, gender, ethnicity and disability. Each child gets their own card.',li:0,act:async()=>spot(q('.k-child'),4)},
 {say:'The latest note. Read it before you call a family back, so they do not tell their story twice.',li:1,act:async()=>spot(q('.k-note'),4)},
 {say:'The Activity Timeline, newest first. An interaction shows the channel, the type, and an Open or Closed pill. Click it to read it all.',li:2,act:async()=>spot(q('.k-ix'),4)},
 {say:'A signup shows the event, the child, and whether they attended.',li:3,act:async()=>spot(q('.k-su'),4)},
 {say:'And Emails lists every email the system has sent them.',li:4,act:async()=>spot(q('.k-em'),4)}]},

// ================= PART 2 =================
SECT(2,'Log an interaction','Every call, email or meeting with a family goes on their card.','Part two. Log an interaction.'),

{html:()=>HEAD('Part 2 · New Interaction','Attach it to the family, and it lands on their card')+IXM()+PTS([
 'Click <b>+ New Interaction</b> at the top.',
 'Pick the <b>Channel</b> and the <b>Interaction type</b>.',
 '<b>Client / Entity</b>: search the family and pick their name.',
 '<b>Summary</b> is required. <b>Notes</b> hold the full story.',
 'Left <b>Open</b>? It needs a <b>Follow-up date</b>.']),
 steps:[{say:'Malia calls back. To log it, click New Interaction at the top of the dashboard. The family’s name links it to her card.',li:0,act:async()=>{await tap('.k-ni',800);hideCursor();await show(q('.k-mod'),450)}},
 {say:'Pick the channel. She called us, so Inbound Phone.',li:1,act:async()=>chip('.k-chan','Inbound Phone')},
 {say:'Interaction type. Helping one family is Tier 1, Individual Assistance. It decides how it counts in grant reports.',li:1,act:async()=>{await chip('.k-type','Tier 1: Individual Assistance');hideCursor()}},
 {say:'Client or Entity. Type the name and pick it from the list. This puts it on Malia’s card.',li:2,act:async()=>{await typeIn('.k-cli','Malia Kah',80);const d=add('<div class="cc-dd"><div class="hi">Malia Kahale<small>malia.kahale@example.org</small></div></div>',q('.cc-cw'));
  await pop(d);await wait(300);await tap(d.firstChild,600);d.remove();q('.k-cli').textContent='Malia Kahale';hideCursor()}},
 {say:'Grant or Program: pick the one this work counts under.',li:2,act:async()=>spot(q('.k-gr'),3)},
 {say:'A one-line summary is required. The notes tell the full story, for a colleague who has never met them.',li:3,act:async()=>{spot(null);await typeIn('.k-sum','Asked how to get ready for Keoni’s IEP meeting',35);await typeIn('.k-nts','Mom wants a checklist before the IEP meeting on the 15th. Sent the Parent Rights booklet.',22);hideCursor()}},
 {say:'Leave it Open if there is more to do. Then it needs a follow-up date, which puts it on your My Day list.',li:4,act:async()=>{const f=q('.k-fu');await tap(f,700);f.classList.remove('ph');f.textContent='10/08/2026';hideCursor();spot(f.parentElement,4)}},
 {say:'Click Save interaction.',li:4,act:async()=>{spot(null);await tap('.k-save',800);hideCursor();const m=q('.k-mod');await anim(m,[{opacity:1},{opacity:0}],350,'ease-in');m.style.opacity=0}}]},

{html:()=>HEAD('Part 2 · Where it lands','On the family’s card')+CARD({newix:true})+PTS([
 'Top of the <b>Activity Timeline</b>, with its status pill.',
 'Its notes become the <b>Latest note</b>.',
 'Work finished? It should be set to <b>Closed</b>.',
 'No match for the name? A yellow banner offers <b>Create contact</b>. <b>Search again first.</b>']),
 steps:[{say:'On Malia’s card, the call is now at the top of the timeline.',li:0,act:async()=>spot(q('.k-ixnew'),4)},
 {say:'And its notes are the latest note.',li:1,act:async()=>spot(q('.k-note'),4)},
 {say:'When the work is finished, it should be set to Closed.',li:2,act:async()=>spot(q('.k-ixnew .op'),6)},
 {say:'Name not found? A yellow banner offers Create contact. Search again first, by spelling, email or phone.',li:3,act:async()=>spot(null)}]},

QUIZ('Part 2',[
 {q:'A family calls. How do you find their card?',o:['Contacts, then search their name, email or phone, and click their row','Click + Add Contact and type their name','Scroll the whole list until you see them'],a:0,y:'Search first, then click the row.',n:'Adding a card for someone who already has one makes a duplicate.'},
 {q:'You log a phone call and pick the family in Client / Entity. Where does it show up?',o:['Only on the Interactions page','In the Emails section of their card','On their card, in the Activity Timeline and the Latest note'],a:2,y:'Picking the family’s name puts it on their card.',n:'Think about what the family’s name connects it to.'}],true,'Parts 1 and 2'),

// ================= PART 3 =================
SECT(3,'Add a contact the right way','Search first. A real phone or email. One card per person.','Part three. Add a contact the right way.'),

{html:()=>HEAD('Part 3 · Search first, then Add Contact','Only when the search finds nobody')+DASH({act:true})+PTS([
 '<b>Search first</b>: the name, then the email, then the phone.',
 'Nobody? Click <b>+ Add Contact</b>.',
 'First Name, Last Name and Type have a <b>star</b>: required.',
 'Type a Hawaiʻi <b>zip code</b> and the Island fills in.',
 'Then <b>Save Contact</b>.']),
 steps:[{say:'A new parent, Kalani Mahoe, asks for help. Search first. Type the name.',li:0,act:async()=>{await typeIn('.k-srch','mahoe',90);q('.k-rows').innerHTML='<div class="cc-none">No contacts match your search.</div>';hideCursor();spot(q('.k-rows'),4)}},
 {say:'No match. Try the email and phone too. Still nobody? Click Add Contact.',li:1,act:async()=>{spot(null);await tap('.k-add',800);hideCursor();const f=add(FORM());await anim(f,[{opacity:0,transform:'scale(.96)'},{opacity:1,transform:'none'}],400,'ease-out')}},
 {say:'First name and last name. A star means required.',li:2,act:async()=>{await typeIn('.k-fn','Kalani',70);await typeIn('.k-ln','Mahoe',70);hideCursor()}},
 {say:'Type is Parent or Guardian unless you change it.',li:2,act:async()=>spot(q('.k-type'),4)},
 {say:'Then the email and phone Kalani gives you.',li:2,act:async()=>{spot(null);await typeIn('.k-em','kalani.mahoe@example.org',40);await typeIn('.k-ph','(808) 555-0187',50);hideCursor()}},
 {say:'A Hawaiʻi zip code fills in the island, which is required.',li:3,act:async()=>{await typeIn('.k-zip','96744',90);const i=q('.k-isl');i.classList.remove('ph');i.textContent='Oahu';hideCursor();spot(i.parentElement.parentElement,4)}},
 {say:'Then click Save Contact.',li:4,act:async()=>{spot(null);await tap('.k-save',800);hideCursor()}}]},

{html:()=>HEAD('Part 3 · A real phone or email','A card nobody can reach is no use')+FORM({fn:'Kalani',ln:'Mahoe',zip:'96744'})+PTS([
 'No phone <b>and</b> no email: <b>not saved</b>.',
 'Fake values count as missing: <b>123456789</b>, <b>none@none.com</b>.',
 'Phone only: it saves, with an <b>amber reminder</b> to get an email.',
 'Best: a real <b>email and phone</b>.']),
 steps:[{say:'The key rule: every card needs a real phone or email. Both boxes are empty here. Click Save Contact.',li:0,act:async()=>{await tap('.k-save',800);hideCursor();await toast('red',T_RED)}},
 {say:'Not saved. Without a phone or email, nobody can reach this family.',li:0,act:async()=>spot(q('.cc-toast'),4)},
 {say:'What if you type one two three four five six seven eight nine, to get past it?',li:1,act:async()=>{spot(null);q('.cc-toast').remove();await typeIn('.k-ph','123456789',90);await tap('.k-save',700);hideCursor();await toast('red',T_RED)}},
 {say:'Still not saved. Fake numbers and filler emails, like none at none dot com, count as missing.',li:1,act:async()=>spot(q('.k-ph'),4)},
 {say:'Now the real number Kalani gave you. Click Save.',li:2,act:async()=>{spot(null);q('.cc-toast').remove();const p=q('.k-ph');p.textContent='';await typeIn('.k-ph','(808) 555-0187',60);await tap('.k-save',700);hideCursor();await toast('amb',T_AMB)}},
 {say:'It saves, with an amber reminder to get an email, so they get event reminders. Ask for one every time.',li:3,act:async()=>spot(q('.cc-toast'),4)}]},

{html:()=>HEAD('Part 3 · No duplicates','Same person? Use the card that is already there')+FORM({fn:'Malia',ln:'Kahale',em:'malia.k@example.org',zip:'96744'})+PTS([
 'Same or similar name: <b>This contact may already exist</b>.',
 'A truly different person: the red button. <b>It is recorded.</b>',
 'Not sure? <b>Cancel, let me check the spelling</b>.',
 'Same person: <b>Use the existing contact</b>.',
 'Same family? <b>One card.</b> The other parent goes under <b>Second parent / guardian</b>.']),
 steps:[{say:'Now someone adds Malia Kahale without searching first.',li:0,act:async()=>{await tap('.k-save',800);hideCursor();const d=add(DUP(),q('.cc-form'));await anim(d.firstChild,[{opacity:0,transform:'scale(.9)'},{opacity:1,transform:'none'}],400,'ease-out')}},
 {say:'A window opens. This contact may already exist.',li:0,act:async()=>spot(q('.cc-dgh'),3)},
 {say:'The tag says same name, or similar when the spelling is close.',li:0,act:async()=>spot(q('.k-dgr'),4)},
 {say:'The red button is only for a truly different person, and it is recorded. Not sure? Cancel and check.',li:2,act:async()=>spot(q('.k-new'),4)},
 {say:'This is the same Malia, so click Use the existing contact.',li:3,act:async()=>{spot(null);await tap('.k-use',800);hideCursor();q('.k-dov').remove();await toast('blu','Using the existing contact: Malia Kahale')}},
 {say:'One family, one card. Malia’s husband goes on her card under Second parent or guardian, with his own email or just his name.',li:4,act:async()=>{q('.cc-toast').remove();spot(q('.cc-fold'),4)}}]},

{html:()=>HEAD('Part 3 · What not to do','And what to do instead')+`<div class="cc-dont">${[
 ['Fake phone numbers','123456789','<b>Instead:</b> ask for the real number. No phone? Get an email.'],
 ['Filler emails','none@none.com','<b>Instead:</b> a real email, or leave it blank and use a real phone.'],
 ['A staff email on a family card','you@ldahawaii.org','<b>Instead:</b> the family’s own email. Staff already have their own card.'],
 ['Two people, one email','same email on 2 cards','<b>Instead:</b> each person has their own. A second parent can be a name only.'],
 ['A second card for the same person','Malia Kahale ×2','<b>Instead:</b> search first, and use the existing contact.'],
 ['Guessing details','a guessed age or ethnicity','<b>Instead:</b> leave it blank and ask next time. A blank is better than a guess.']
 ].map(d=>`<div class="cc-dc"><h4>${d[0]}</h4><span class="bad">${d[1]}</span><div class="ins">${d[2]}</div></div>`).join('')}</div>
 <div class="cc-dnote">The <b>Missing Phone &amp; Email</b> report, in Reports, lists every card with no real phone or email, and says why. If one of them is yours, fix it.</div>`,
 steps:[{say:'A few things never to do.'},
 ...['No fake phone numbers.',
   'No filler emails.',
   'No staff email on a family’s card.',
   'No sharing one email between two people.',
   'No second card for the same person.',
   'And no guessing. A blank is better than a guess.'].map((s,i)=>({say:s,act:async()=>{const c=all('.cc-dc')[i];await show(c,400);spot(c,5)}})),
 {say:'The Missing Phone and Email report lists cards with no real phone or email. If one is yours, fix it.',act:async()=>{spot(null);const n=q('.cc-dnote');await show(n);spot(n,4)}}]},

QUIZ('Part 3',[

 {q:'A family gives you a phone number, but no email. What happens when you save?',o:['It is refused','It saves and emails the family','It saves, with an amber reminder to get an email too'],a:2,y:'A real phone is enough to save. Then ask for an email.',n:'A phone is one of the two things a card needs.'}],false,'Part 3'),
