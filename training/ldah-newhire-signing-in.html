<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Signing In to LDAH Internal — Training</title>
<link rel="stylesheet" href="deck-base.css">
<!-- Same Firebase build as the dashboard, so the deck shares its sign-in and records progress. -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
/* Every deck-only class starts with nsi- (new-hire sign-in) so nothing collides with deck-base.css. */
/* ---------- cover: LDAH logo card ---------- */
.nsi-logo{position:absolute;left:820px;top:110px;width:300px;padding:26px 30px;background:#fff;border-radius:28px;box-shadow:0 30px 70px rgba(0,0,0,.38);z-index:3;animation:nsiin 1.1s .3s cubic-bezier(.3,1.5,.5,1) both,nsifloat 9s 1.4s ease-in-out infinite}
.nsi-logo img{display:block;width:100%;height:auto}
.nsi-glow{position:absolute;left:760px;top:70px;width:440px;height:440px;border-radius:50%;background:radial-gradient(closest-side,rgba(125,211,252,.5),rgba(249,168,212,.22) 60%,transparent);z-index:2;animation:nsiglow 4.5s ease-in-out infinite}
.nsi-logo.sm{left:900px;top:150px;width:220px;padding:18px 22px}
@keyframes nsiin{from{opacity:0;transform:translateY(-200px) rotate(-14deg) scale(.4)}to{opacity:1;transform:none}}
@keyframes nsifloat{0%,100%{transform:translate(0,0) rotate(0)}30%{transform:translate(-14px,-16px) rotate(-2deg)}65%{transform:translate(12px,8px) rotate(1.5deg)}}
@keyframes nsiglow{0%,100%{opacity:.6;transform:scale(.94)}50%{opacity:1;transform:scale(1.06)}}
/* ---------- sign-in details card ---------- */
.nsi-key{position:absolute;left:58px;top:130px;width:700px;background:#fff;border-radius:18px;box-shadow:0 14px 40px rgba(15,23,42,.14);padding:22px 30px;border-top:6px solid #004E7C}
.nsi-key .kr{display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid #E2E8F0}
.nsi-key .kr:last-of-type{border-bottom:0}
.nsi-key .kl{font-size:15px;font-weight:800;color:#475569;text-transform:uppercase;letter-spacing:.05em}
.nsi-key .kv{font-size:24px;font-weight:800;color:#0F172A;word-break:break-all}
.nsi-key a.kv{color:#004E7C;text-decoration:underline;text-underline-offset:4px}
.nsi-key .tmp{display:block;font-size:14px;font-weight:700;color:#B45309;margin-top:4px}
.nsi-open{display:inline-block;margin-top:12px;background:#004E7C;color:#fff;font-weight:800;font-size:19px;padding:14px 26px;border-radius:12px;text-decoration:none;box-shadow:0 10px 24px rgba(0,78,124,.3)}
/* ---------- browser window ---------- */
.nsi-brw{position:absolute;left:58px;top:122px;width:716px;height:560px;background:#fff;border-radius:14px;box-shadow:0 16px 44px rgba(15,23,42,.2);overflow:hidden}
.nsi-brw .wbt{height:44px;background:#EEF2F6;border-bottom:1px solid #D7DEE6;display:flex;align-items:center;gap:8px;padding:0 12px}
.nsi-brw .wbt i{width:12px;height:12px;border-radius:50%;background:#F87171;display:inline-block}.nsi-brw .wbt i:nth-child(2){background:#FBBF24}.nsi-brw .wbt i:nth-child(3){background:#34D399}
.nsi-brw .url{flex:1;margin-left:10px;height:28px;border-radius:8px;background:#fff;border:1px solid #D7DEE6;font-size:14px;color:#334155;display:flex;align-items:center;padding:0 12px;white-space:nowrap;overflow:hidden}
.nsi-brw .url .ulk{width:9px;height:8px;border:2px solid #16A34A;border-radius:2px;margin-right:8px;position:relative;top:2px;flex:none}
.nsi-brw .url .ulk::before{content:"";position:absolute;left:0;top:-7px;width:5px;height:6px;border:2px solid #16A34A;border-bottom:0;border-radius:4px 4px 0 0}
.nsi-brw .pg{position:absolute;left:0;right:0;top:44px;bottom:0}
/* ---------- the real sign-in screen (index.html #loginScreen) ---------- */
.nsi-lgs{position:absolute;inset:0;background:linear-gradient(135deg,#004E7C 0%,#0066a1 100%);display:flex;align-items:center;justify-content:center}
.nsi-lgb{background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:350px;padding:24px 30px;text-align:center;position:relative}
.nsi-lgb img{width:58px;display:block;margin:0 auto 8px}
.nsi-lgb h3{margin:0;color:#004E7C;font-size:26px;font-weight:800}
.nsi-lgb .ls{color:#64748B;font-size:14px;margin:4px 0 14px}
.nsi-lgb .err{display:none;background:#FEE2E2;color:#DC2626;padding:9px 12px;border-radius:10px;margin-bottom:12px;font-weight:600;font-size:14px;text-align:left}
.nsi-lgb .err.on{display:block}
.nsi-lgb .lfg{text-align:left;margin-bottom:12px}
.nsi-lgb label{display:block;font-size:13px;font-weight:700;color:#1E293B;margin-bottom:5px}
.nsi-lgb .lin{height:40px;border:2px solid #E2E8F0;border-radius:10px;font-size:15px;padding:0 12px;display:flex;align-items:center;color:#0F172A;background:#fff;white-space:nowrap;overflow:hidden}
.nsi-lgb .lin.ph{color:#94A3B8}
.nsi-lgb .lin.focus{border-color:#004E7C}
.nsi-lgb .lsb{height:44px;border-radius:12px;background:#004E7C;color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center}
.nsi-lgb .fp{display:inline-block;margin-top:11px;color:#004E7C;font-size:13.5px}
.nsi-lgb .den{display:none}
.nsi-lgb.denied .frm,.nsi-lgb.denied .err{display:none}
.nsi-lgb.denied .den{display:block}
.nsi-lgb .den p{margin:14px 0 6px;color:#DC2626;font-weight:800;font-size:20px}
.nsi-lgb .den small{display:block;color:#666;font-size:13.5px;margin-bottom:14px}
.nsi-lgb .den .lsb{background:#DC2626}
.press{filter:brightness(.85);transform:scale(.97)}
/* browser alert box */
.nsi-alrt{position:absolute;left:50%;top:26px;transform:translateX(-50%);width:420px;background:#fff;border-radius:12px;box-shadow:0 18px 50px rgba(15,23,42,.35);padding:16px 18px;font-size:15px;z-index:20}
.nsi-alrt small{display:block;font-size:12px;color:#64748B;margin-bottom:6px}
.nsi-alrt .aok{float:right;margin-top:12px;background:#2563EB;color:#fff;font-weight:700;border-radius:8px;padding:6px 18px;font-size:14px}
/* ---------- dashboard ---------- */
.nsi-db{position:absolute;inset:0;background:#FEFDFB;display:flex}
.nsi-db .sd{width:156px;border-right:1px solid #EEF2F6;padding:10px 8px;font-size:12px}
.nsi-db .sd .wb{font-weight:800;font-size:13px;color:#0F172A;padding:2px 4px}.nsi-db .sd .wb small{display:block;font-weight:400;color:#64748B;font-size:10.5px;margin-top:2px}
.nsi-db .sd .dtb{display:flex;background:#F1F5F9;border-radius:8px;margin:10px 0;font-weight:700;font-size:11.5px}.nsi-db .sd .dtb span{flex:1;text-align:center;padding:5px}.nsi-db .sd .dtb span:first-child{background:#fff;border-radius:7px;color:#0E7490}
.nsi-db .sd .ni{padding:6px 8px;font-weight:600;color:#1E293B}.nsi-db .sd .ni.on{background:#E0F2FE;border-radius:8px;color:#0E7490}
.nsi-db .mn{flex:1;padding:10px 12px;position:relative}
.nsi-db .tp{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.nsi-db .tb{height:30px;border-radius:8px;border:1px solid #E2E8F0;background:#fff;font-size:11.5px;font-weight:800;color:#334155;display:flex;align-items:center;padding:0 10px}
.nsi-db .tb.pri{background:#0E7490;color:#fff;border-color:#0E7490}
.nsi-db .av{width:34px;height:34px;border-radius:50%;background:#F1F5F9;border:1px solid #E2E8F0;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;color:#0F172A}
.nsi-db .hr{margin-top:12px;background:linear-gradient(120deg,#0e2f52 0%,#155e8c 55%,#0e9aac 130%);color:#fff;border-radius:12px;padding:14px 16px;font-weight:800;font-size:20px}
.nsi-db .hr small{display:block;font-weight:400;font-size:12px;opacity:.9;margin-top:2px}
.nsi-db .chips{display:flex;gap:6px;margin-top:10px}
.nsi-db .chips div{flex:1;background:rgba(255,255,255,.14);border-radius:8px;padding:6px 4px;text-align:center;font-size:9.5px;font-weight:700;text-transform:uppercase}
.nsi-db .chips b{display:block;font-size:17px}
.nsi-db .tsk{margin-top:12px;background:#fff;border:1px solid #E2E8F0;border-radius:10px;padding:10px 12px;font-size:12px;color:#475569}
.nsi-db .tsk b{display:block;color:#0F172A;font-size:13px;margin-bottom:6px}
.nsi-db .tsk i{display:block;height:9px;border-radius:5px;background:#F1F5F9;margin:7px 0}
.nsi-db .mnu{position:absolute;right:10px;top:48px;background:#fff;border:1px solid #E2E8F0;border-radius:12px;box-shadow:0 14px 34px rgba(15,23,42,.2);width:150px;font-size:14px;font-weight:700;z-index:5;overflow:hidden}
.nsi-db .mnu div{padding:11px 14px;border-bottom:1px solid #F1F5F9}.nsi-db .mnu div.lo{color:#DC2626;border:0}
/* new-hire training window over the dashboard */
.nsi-pop{position:absolute;left:190px;top:250px;width:470px;background:#fff;border-radius:14px;box-shadow:0 20px 50px rgba(15,23,42,.35);overflow:hidden;z-index:6;opacity:0}
.nsi-pop .ph{background:#0E7490;color:#fff;font-weight:800;font-size:14px;padding:10px 14px}
.nsi-pop .ph span{float:right;background:#FEF3C7;color:#92400E;border-radius:999px;padding:1px 9px;font-size:11px}
.nsi-pop .pb{height:150px;background:linear-gradient(135deg,#0B3A53,#0E7490 60%,#1a5f7a);color:#fff;padding:22px;font-size:22px;font-weight:800}
.nsi-pop .pb small{display:block;font-size:13px;font-weight:600;opacity:.85;margin-top:6px}
/* ---------- email ---------- */
.nsi-mail{position:absolute;inset:0;background:#fff;display:flex}
.nsi-mail .ml{width:220px;border-right:1px solid #E2E8F0;font-size:12.5px}
.nsi-mail .mbh{padding:10px 12px;font-weight:800;color:#475569;border-bottom:1px solid #E2E8F0}
.nsi-mail .mi{padding:9px 12px;border-bottom:1px solid #F1F5F9;color:#64748B}
.nsi-mail .mi b{display:block;color:#0F172A;font-size:13px}
.nsi-mail .mi.new{background:#EFF6FF;border-left:3px solid #2563EB}
.nsi-mail .mv{flex:1;padding:16px 20px;font-size:14px;color:#1E293B;line-height:1.55}
.nsi-mail .mv h4{margin:0 0 4px;font-size:17px}
.nsi-mail .mv .fr{font-size:12.5px;color:#64748B;margin-bottom:14px}
.nsi-mail .mv a{color:#1A73E8;word-break:break-all;text-decoration:underline}
/* ---------- reset-password page ---------- */
.nsi-fbp{position:absolute;inset:0;background:#F5F5F5;display:flex;align-items:flex-start;justify-content:center;padding-top:60px}
.nsi-fbc{width:360px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);padding:24px;font-family:Roboto,Arial,sans-serif}
.nsi-fbc h3{margin:0 0 4px;font-size:21px;font-weight:500;color:#212121}
.nsi-fbc .fe{color:#757575;font-size:14px;margin-bottom:22px}
.nsi-fbc label{font-size:12px;color:#1A73E8}
.nsi-fbc .fbi{border-bottom:2px solid #1A73E8;height:32px;font-size:16px;display:flex;align-items:center;letter-spacing:.18em}
.nsi-fbc .sv{float:right;margin-top:22px;background:#1A73E8;color:#fff;font-weight:500;font-size:14px;padding:9px 18px;border-radius:2px;letter-spacing:.04em}
/* ---------- tip boxes beside a mock ---------- */
.nsi-big{position:absolute;left:800px;top:540px;width:430px;background:#FFFBEB;border:1px solid #FDE68A;color:#92400E;border-radius:12px;padding:12px 16px;font-size:16px;font-weight:700;opacity:0}
.nsi-big.red{background:#FEF2F2;border-color:#FECACA;color:#991B1B}
/* ---------- two-card compare (staying signed in) ---------- */
.nsi-two{position:absolute;left:58px;top:140px;width:700px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.nsi-cd{background:#fff;border-radius:16px;box-shadow:0 10px 28px rgba(15,23,42,.12);padding:18px 18px 16px;opacity:0;border-top:6px solid #16A34A;min-height:400px}
.nsi-cd.nsi-sh{border-top-color:#DC2626}
.nsi-cd h4{margin:0 0 10px;font-size:21px;color:#0F172A}
.nsi-cd p{margin:10px 0 0;font-size:16.5px;line-height:1.45;color:#334155}
.nsi-pc{height:120px;border-radius:10px;background:#0B3A53;position:relative;margin:4px 0 24px}
.nsi-pc::after{content:"";position:absolute;left:50%;bottom:-14px;width:60px;height:14px;margin-left:-30px;background:#94A3B8;border-radius:0 0 6px 6px}
.nsi-pc span{position:absolute;left:14px;right:14px;top:14px;bottom:14px;border-radius:6px;background:linear-gradient(135deg,#004E7C,#0066a1);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px}
.nsi-tag{display:inline-block;margin-top:14px;font-size:14px;font-weight:800;padding:5px 12px;border-radius:999px;background:#DCFCE7;color:#166534}
.nsi-cd.nsi-sh .nsi-tag{background:#FEE2E2;color:#991B1B}
/* ---------- quiz (same as super-partner-workflow) ---------- */
.scene.quiz{background:linear-gradient(135deg,#FFF1F8,#E0F7FA)}
.qwrap{position:absolute;left:0;top:0;right:0;bottom:0}
.qintro{position:absolute;left:120px;top:190px;width:1040px;text-align:center;font-size:30px;font-weight:800;color:#0B3A53;line-height:1.35;animation:rise .5s both}
.qintro small{display:block;font-size:20px;color:#475569;font-weight:700;margin-top:14px}
.qcard{position:absolute;left:120px;top:138px;width:1040px;background:#fff;border-radius:20px;box-shadow:0 18px 40px rgba(15,23,42,.14);padding:22px 30px;animation:rise .5s both}
.qn{font-size:14px;font-weight:900;color:var(--pink);letter-spacing:.08em;text-transform:uppercase}
.qq{font-size:27px;font-weight:800;line-height:1.25;margin:6px 0 16px}
.qo{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;font-size:21px;font-weight:700;background:#F8FAFC;border:3px solid #E2E8F0;border-radius:14px;padding:11px 16px;margin-bottom:10px;cursor:pointer;transition:border-color .2s,background .2s;color:var(--ink)}
.qo:hover:not([disabled]){border-color:#0891B2;background:#F0F9FF}
.qo[disabled]{cursor:default}
.qo .L{width:38px;height:38px;border-radius:50%;background:#0E7490;color:#fff;display:flex;align-items:center;justify-content:center;flex:none;font-weight:900}
.qo.no{border-color:#DC2626;background:#FEF2F2;animation:shake .4s}.qo.no .L{background:#DC2626}
.qo.yes{border-color:#16A34A;background:#F0FDF4}.qo.yes .L{background:#16A34A}
.qfb{min-height:30px;font-size:19px;font-weight:700;margin-top:4px}.qfb.good{color:#15803D}.qfb.bad{color:#B91C1C}
.stars{position:absolute;right:60px;top:46px;display:flex;gap:8px}
.stars i{width:36px;height:36px;background:#E2E8F0;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);transition:background .3s}
.stars i.on{background:#F59E0B;animation:popn .6s}
.qhelp{position:absolute;left:120px;bottom:30px;font-size:16px;color:#475569;font-weight:700}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
</style></head><body>
<div id="view"><div id="stage"><div id="nbar"><i></i></div>
<div id="scenes"></div>
<div id="spot"></div>
<svg id="cursor" viewBox="0 0 28 32"><path d="M3 2 L3 26 L9.5 19.5 L14 29 L18.5 27 L14 17.5 L23 17.5 Z" fill="#fff" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/></svg>
</div></div>
<div id="cap" aria-live="polite"></div>
<div id="bar">
 <button id="prev">Back</button><button id="play">Start</button><button id="next">Next</button>
 <div id="dots"></div>
 <button id="capbtn" aria-pressed="false">Captions</button><button id="voice" aria-pressed="true">Voice on</button>
</div>
<script>
const DECK_ID='ldah-newhire-signing-in';
/* Five quiz questions in two quiz scenes. deck-tracker.js counts them from the QUIZ
   scenes too; this just pins the total. */
window.QUIZ_TOTAL=5;

/* Every screen below is drawn in HTML/CSS from LDAH Internal index.html (v151.79, 2026-10-01):
   #loginScreen, the login + Forgot Password handlers, the user menu (Profile / Log off),
   the Access Denied box. The reset email and reset page are Firebase's standard ones.
   The email address is made up (example.org) and no real password appears anywhere. */
const URL_INT='https://danpoahu.github.io/LDAH-Int/';
const EMAIL='kai.palama@example.org';
const NM=()=>(typeof name!=='undefined'&&name)||'Kai';
const INI=()=>NM().charAt(0).toUpperCase();
const LOGO='../logo_blue.png', LOGIN_LOGO='../logo_transparent.png';

/* ---- small helpers ---- */
function all(s){return[...document.querySelectorAll('.scene.on '+s)]}
const show=(e,ms=500)=>anim(e,[{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],ms,'ease-out').then(()=>{e.style.opacity=1});
const PTS=(items,top=150)=>`<div class="abs" style="left:800px;top:${top}px;width:430px"><ul class="pts">${items.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
async function typeIn(sel,text,ms=45){const e=q(sel);e.classList.add('focus');await type(e,text,ms);e.classList.remove('focus')}
const CHECK='<div class="bx"><svg viewBox="0 0 26 26"><path d="M5 13 L11 19 L21 7"/></svg></div>';

/* ---- screens ---- */
const BRW=(url,page)=>`<div class="nsi-brw"><div class="wbt"><i></i><i></i><i></i><div class="url"><span class="ulk"></span><span class="u">${url}</span></div></div><div class="pg">${page}</div></div>`;
const LOGIN=()=>`<div class="nsi-lgs"><div class="nsi-lgb"><img src="${LOGIN_LOGO}" alt="LDAH">
 <h3>LDAH Internal</h3><div class="ls">Sign in to continue</div><div class="err">Invalid email or password.</div>
 <div class="frm"><div class="lfg"><label>Email</label><div class="lin em ph">you@ldah.org</div></div>
 <div class="lfg"><label>Password</label><div class="lin pw ph">Enter password</div></div>
 <div class="lsb">Sign In</div><a class="fp">Forgot Password?</a></div>
 <div class="den"><p>Access Denied</p><small>Your account does not have access to this application.</small><div class="lsb">Sign Out</div></div></div></div>`;
const DASH=()=>`<div class="nsi-db"><div class="sd"><div class="wb">Welcome back, ${NM()}<small>Thursday, October 1</small></div><div class="dtb"><span>Main</span><span>CMS</span></div>
 ${['Home','Interactions','Downloads','Contacts','Change Requests','Reports','Training Videos'].map((n,i)=>`<div class="ni ${i?'':'on'}">${n}</div>`).join('')}</div>
 <div class="mn"><div class="tp"><div class="tb">Alerts</div><div class="tb pri">+ New Interaction</div><div class="av">${INI()}</div></div>
 <div class="hr">Aloha ${NM()}<small>Your day at a glance</small><div class="chips"><div><b>0</b>Overdue</div><div><b>0</b>Today</div><div><b>0</b>This wk</div><div><b>0</b>Done</div></div></div>
 <div class="tsk"><b>Things to do today</b><i style="width:90%"></i><i style="width:70%"></i><i style="width:80%"></i></div></div></div>`;

/* ---- quiz (copied from super-partner-workflow.html) ---- */
function ask(Q,i,sec){const w=q('.qwrap');
 w.innerHTML=`<div class="qcard"><div class="qn">Question ${i+1}</div><div class="qq">${Q.q}</div>${Q.o.map((o,j)=>`<button class="qo" data-j="${j}"><span class="L">${'ABC'[j]}</span><span>${o}</span></button>`).join('')}<div class="qfb"></div></div>`;
 const card=w.firstChild,fb=card.querySelector('.qfb'),btns=[...card.querySelectorAll('.qo')];
 const finish=()=>{btns.forEach(b=>b.disabled=true);btns[Q.a].classList.add('yes');const st=all('.stars i')[i];if(st)st.classList.add('on');fb.className='qfb good';fb.textContent='Yes! '+Q.y};
 if(FAST){finish();return Promise.resolve()}
 return new Promise(res=>{btns.forEach((b,j)=>b.onclick=async()=>{
  if(b.disabled)return;
  if(window.ldahTrack)ldahTrack.quiz(sec,i,j===Q.a);
  if(j===Q.a){finish();const p=pos(b);confetti(p.x+60,p.y+20,70);await speak('Yes! '+Q.y,run);await wait(700);res()}
  else{b.disabled=true;b.classList.add('no');fb.className='qfb bad';fb.textContent='Not quite. '+Q.n+' Try again.';speak('Not quite. '+Q.n+' Try again.',run)}})})}
/* The first quiz explains how quizzes work; later ones just start.
   Wording changed from the original: this quiz IS scored (first answers, 70% to pass). */
const QUIZ=(sec,qs,first)=>({cls:'quiz',html:()=>HEAD('Quick check · '+sec,'Your turn!')+`<div class="stars">${qs.map(()=>'<i></i>').join('')}</div><div class="qwrap"><div class="qintro">${qs.length} quick question${qs.length>1?'s':''}.${first?'<small>Click the answer you think is right. If you miss, you can try again. Your first answer to each question is the one that counts: get 4 of the 5 right to pass.</small>':''}</div></div>${first?'<div class="qhelp">Take your time. The next question waits for you.</div>':''}`,
 steps:[{say:first?`Quick check! ${qs.length} question${qs.length>1?'s':''}. Click the answer you think is right. If you miss, you can try again, but your first answer is the one that counts. Get 4 of the 5 right to pass.`:`Quick check. ${qs.length} question${qs.length>1?'s':''}.`},
  ...qs.map((Q,i)=>({say:`Question ${i+1}. ${Q.q}`,act:()=>ask(Q,i,sec)}))]});
