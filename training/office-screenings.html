<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Office Screenings — Training</title>
<link rel="stylesheet" href="deck-base.css">
<!-- Same Firebase build as the dashboard, so the deck shares its sign-in and records progress. -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
/* Every class here starts with sc- or os- so nothing collides with deck-base.css.
   Purple #7C3AED = DAN's Screening type colour. Website = site teal #0891B2 + coral CTA. */
.sc-win{position:absolute;left:58px;top:118px;width:712px;height:570px;background:#F4F6F9;border:1px solid #D5DEE8;border-radius:12px;overflow:hidden;box-shadow:0 14px 36px rgba(15,23,42,.16);z-index:4;font-family:"Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:#1E293B}
.sc-pad{position:relative;padding:14px 16px}
.sc-side{position:absolute;left:0;top:0;bottom:0;width:200px;background:#fff;border-right:1px solid #E2E8F0;padding:12px 10px}
.sc-side .lg{display:flex;align-items:center;gap:8px;margin:0 0 10px 4px;font-weight:800;color:#0E7490;font-size:15px}
.sc-side .lg img{height:30px}
.sc-gh{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#64748B;padding:9px 8px 4px;border-radius:6px;display:flex;justify-content:space-between}
.sc-gh i{font-style:normal;transition:transform .3s}.sc-gh.open i{transform:rotate(90deg)}
.sc-side a{display:block;font-size:12.5px;padding:5px 9px;border-radius:6px;color:#334155;transition:background .3s}
.sc-side a.act{background:#E0F2FE;color:#0E6E8C;font-weight:700}
.sc-side a.pu.act{background:#F5F3FF;color:#6D28D9}
.sc-agrp{max-height:0;overflow:hidden;transition:max-height .5s ease}.sc-agrp.open{max-height:260px}
.sc-home{position:absolute;left:200px;right:0;top:0;bottom:0;padding:16px 18px}
.sc-home h3{margin:0 0 10px;font-size:19px;color:#0B3A53}
.sc-ghost{background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(15,40,70,.08);height:84px;margin-bottom:10px;padding:12px}
.sc-ghost u{display:block;height:8px;border-radius:4px;background:#E2E8F0;margin-bottom:8px;text-decoration:none}
/* the Office Screenings page */
.os-hd{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.os-hd h3{margin:0;font-size:21px;color:#5B21B6;font-weight:800}
.os-hd p{margin:3px 0 0;font-size:11.5px;color:#475569;line-height:1.4;max-width:470px}
.os-add{margin-left:auto;flex:none;background:#7C3AED;color:#fff;font-weight:800;font-size:12px;border-radius:8px;padding:7px 13px;transition:transform .15s}
.os-day{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid #E9E5F5;border-left:5px solid #7C3AED;border-radius:12px;padding:11px 14px;margin-bottom:10px;box-shadow:0 1px 6px rgba(76,29,149,.07)}
.os-day.unp{border-left-color:#CBD5E1}
.os-dl{flex:1;min-width:0}
.os-dl b{font-size:15px;color:#1E1B4B}
.os-pill{display:inline-block;margin-left:8px;font-size:10px;font-weight:800;color:#475569;background:#E2E8F0;border-radius:999px;padding:2px 9px;vertical-align:2px}
.os-dm{font-size:11.5px;color:#475569;margin-top:2px}
.os-bar{height:8px;background:#EDE9FE;border-radius:5px;margin-top:8px;overflow:hidden}
.os-bar i{display:block;height:100%;background:#7C3AED;border-radius:5px;transition:width .6s}
.os-cnt{font-size:11px;font-weight:800;color:#6D28D9;margin-top:4px}
.os-db{display:flex;flex-direction:column;gap:6px;flex:none;align-items:stretch}
.os-btn{background:#7C3AED;color:#fff;font-weight:800;font-size:11px;border-radius:7px;padding:5px 12px;text-align:center;transition:transform .15s}
.os-btn.ghost{background:#fff;color:#6D28D9;border:1px solid #C4B5FD}
.os-btn.grey{background:#fff;color:#334155;border:1px solid #CBD5E1}
.os-past{font-size:11.5px;font-weight:700;color:#6D28D9;text-decoration:underline;display:inline-block;margin-top:2px}
/* modals */
.sc-dim{position:absolute;left:58px;top:118px;width:712px;height:570px;background:rgba(15,23,42,.45);border-radius:12px;z-index:13}
.sc-mh{display:flex;align-items:center;gap:8px;padding:9px 14px;background:linear-gradient(90deg,#6D28D9,#7C3AED);color:#fff;font-weight:800;font-size:15px}
.sc-mh img{height:24px}
.sc-mh .x{margin-left:auto;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.22);text-align:center;line-height:23px;font-size:17px;flex:none}
.sc-mh.teal{background:linear-gradient(90deg,#0E7490,#0891B2)}
.os-form{position:absolute;left:90px;top:128px;width:640px;background:#fff;border-radius:14px;box-shadow:0 26px 60px rgba(15,23,42,.35);z-index:14;overflow:hidden;font-size:12px;font-family:"Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:#1E293B}
.os-fb{padding:10px 18px 14px}
.sc-l{display:block;font-size:10.5px;font-weight:700;color:#334155;margin:9px 0 3px}
.sc-i{border:1px solid #CBD5E1;border-radius:7px;padding:0 9px;height:28px;line-height:27px;font-size:12px;background:#fff;white-space:nowrap;overflow:hidden;color:#0F172A;position:relative;transition:border-color .3s,box-shadow .3s}
.sc-i.ph{color:#94A3B8}
.sc-i.sel{padding-right:22px}.sc-i.sel::after{content:"▾";position:absolute;right:8px;color:#64748B}
.sc-i.foc{border-color:#7C3AED;box-shadow:0 0 0 3px rgba(124,58,237,.16)}
.sc-i.typing::after{content:"|";color:#7C3AED;animation:blink .6s steps(1) infinite}
.sc-r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.sc-r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sc-hint{font-size:10px;color:#64748B;margin-top:3px;line-height:1.35}
.os-fixed{height:28px;line-height:28px;font-size:12px;font-weight:700;color:#5B21B6;background:#F5F3FF;border-radius:7px;padding:0 10px}
.os-tchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px;min-height:28px}
.os-tc{border:2px solid #7C3AED;background:#7C3AED;color:#fff;border-radius:999px;padding:3px 11px;font-size:11px;font-weight:800;transition:background .25s,color .25s,border-color .25s}
.os-tc.off{background:#fff;border-color:#CBD5E1;color:#94A3B8;text-decoration:line-through}
.os-tc.bk{background:#4C1D95;border-color:#4C1D95}
.os-tc.bk::after{content:" · booked";font-weight:700;opacity:.8}
.os-warn{font-size:11px;color:#B91C1C;background:#FEF2F2;border-radius:7px;padding:6px 10px;margin-top:6px;opacity:0}
.sc-tick{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:#334155;margin-top:12px}
.sc-cbx{width:16px;height:16px;border:2px solid #94A3B8;border-radius:3px;background:#fff;position:relative;flex:none;transition:all .2s}
.sc-cbx.on{background:#7C3AED;border-color:#7C3AED}.sc-cbx.on::after{content:"";position:absolute;left:4px;top:0;width:4px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.sc-ffoot2{display:flex;gap:7px;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid #e2e8f0}
.sc-cancel{border:1px solid #CBD5E1;background:#fff;color:#334155;border-radius:7px;padding:6px 14px;font-weight:700;font-size:11.5px}
.sc-save{background:#7C3AED;color:#fff;border-radius:7px;padding:6px 20px;font-weight:800;font-size:11.5px;transition:transform .15s}
.sc-dd{position:absolute;left:0;background:#fff;border:1px solid #CBD5E1;border-radius:7px;box-shadow:0 12px 26px rgba(15,23,42,.2);z-index:20;font-size:11.5px;padding:3px 0;opacity:0;white-space:nowrap}
.sc-dd div{padding:5px 12px;transition:background .2s,color .2s}.sc-dd div.hi{background:#7C3AED;color:#fff}
@keyframes osshake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.os-shake{animation:osshake .4s}
/* Events Dashboard (small) */
.os-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:#E2E8F0;border:1px solid #E2E8F0;border-radius:8px;overflow:hidden}
.os-dow{background:#F8FAFC;font-size:9px;font-weight:800;color:#64748B;text-align:center;padding:3px 0}
.os-cell{background:#fff;height:88px;padding:3px 4px;overflow:hidden;position:relative;transition:background .3s}
.os-cell.out{background:#FAFBFC}.os-cell.out .os-dn{color:#CBD5E1}
.os-cell.hov{background:#F8FAFC}
.os-dn{display:flex;justify-content:space-between;align-items:center;font-size:9.5px;font-weight:700;color:#334155;margin-bottom:2px;height:15px}
.os-plus{opacity:0;width:16px;height:15px;border-radius:4px;background:#EDE9FE;color:#6D28D9;font-size:12px;line-height:14px;text-align:center;transition:opacity .25s}
.os-cell.hov .os-plus{opacity:1}
.os-ev{border-left:3px solid #94A3B8;background:#F8FAFC;border-radius:0 5px 5px 0;padding:2px 4px;margin-bottom:3px}
.os-et{font-size:8.6px;font-weight:700;color:#1E293B;line-height:1.2}
.os-em{font-size:7.8px;color:#64748B;margin-top:1px;line-height:1.25}
.os-ev.off{border-left-color:#7C3AED;background:#F5F3FF}.os-ev.off .os-et{color:#5B21B6}
.os-leg{display:flex;gap:10px;font-size:9px;color:#64748B;margin:0 0 6px;flex-wrap:wrap}
.os-leg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.os-edh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.os-edh h3{margin:0;font-size:18px;color:#004E7C;font-weight:800}
.os-edh span{font-weight:800;font-size:12px;color:#004E7C}
.sc-fun{position:absolute;left:110px;top:150px;width:600px;background:#fff;border-radius:14px;box-shadow:0 26px 60px rgba(15,23,42,.35);z-index:14;overflow:hidden;font-size:12px;font-family:"Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:#1E293B}
.sc-fb{padding:0 18px 16px}
.sc-fttl{text-align:center;font-size:14px;font-weight:700;color:#0f172a;margin-top:14px}
.sc-fsub{text-align:center;font-size:11px;color:#64748B;margin:2px 0 12px}
.sc-tc{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.sc-tcard{border:2px solid #e2e8f0;border-radius:11px;padding:10px 11px;background:#fff;transition:transform .15s}
.sc-tcard b{display:block;font-size:12.5px;color:#0f172a;margin-top:5px}
.sc-tcard b i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.sc-tcard small{display:block;font-size:10px;color:#64748b;margin-top:2px;line-height:1.35}
.sc-tcard .ic{display:block;width:22px;height:22px;border-radius:6px}
.sc-tcard.pu{border-color:#7C3AED;background:#F5F3FF}
/* My Day */
.sc-md{position:absolute;left:58px;top:126px;width:712px;background:#fff;border-radius:16px;box-shadow:0 14px 34px rgba(15,23,42,.14);overflow:hidden;font-family:"Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:#1E293B}
.sc-mdh{display:flex;align-items:center;gap:12px;padding:15px 18px;background:linear-gradient(120deg,#0e2f52 0%,#155e8c 55%,#0e9aac 130%);color:#fff}
.sc-mdh h3{margin:0;font-size:21px}.sc-mdh .hs{font-size:12px;opacity:.85;margin-top:2px}
.sc-who{margin-left:auto;font-size:12px;font-weight:700;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:5px 12px}
.sc-sect{padding:12px 18px 8px}.sc-sect h4{margin:0;font-size:15px;color:#0B3A53}
.sc-todos{padding:0 18px 16px;display:flex;flex-direction:column;gap:8px}
.sc-todo{display:grid;grid-template-columns:20px 1fr;gap:11px;align-items:start;padding:10px 12px;background:#fff;border:1px solid rgba(8,145,178,.14);border-left:4px solid #7C3AED;border-radius:12px}
.sc-todo.plain{border-left-color:#94A3B8;opacity:.75}
.sc-todo.cm{border-left-color:#0891B2}
.sc-chk{width:18px;height:18px;border:2px solid rgba(100,116,139,.45);border-radius:5px;background:#fff;margin-top:1px}
.sc-ttl{font-weight:700;font-size:13.5px;color:#0F172A;line-height:1.3}
.sc-tnote{font-size:11.5px;color:#334155;background:#F8FAFC;border-radius:8px;padding:7px 10px;margin-top:7px;line-height:1.55}
.sc-open{display:inline-block;margin-top:8px;background:#7C3AED;color:#fff;font-weight:800;font-size:11.5px;border-radius:7px;padding:6px 12px;transition:transform .15s}
.sc-open.teal{background:#0891B2}
/* the website */
.os-web{position:absolute;left:58px;top:118px;width:712px;height:570px;background:#fff;border:1px solid #D5DEE8;border-radius:12px;overflow:hidden;box-shadow:0 14px 36px rgba(15,23,42,.16);z-index:4;font-family:"Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:#1E293B}
.os-wbar{height:34px;background:#E2E8F0;display:flex;align-items:center;gap:6px;padding:0 10px}
.os-wbar i{width:9px;height:9px;border-radius:50%;background:#CBD5E1}
.os-wbar span{flex:1;margin-left:8px;background:#fff;border-radius:10px;font-size:10.5px;color:#475569;padding:3px 10px}
.os-wvp{position:absolute;top:34px;left:0;right:0;bottom:0;overflow:hidden;background:#F0F9FF}
.os-win{padding:14px 18px 20px;transition:transform .7s cubic-bezier(.45,.05,.25,1)}
.os-crumb{font-size:10px;color:#0891B2;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.os-bk{background:#fff;border-radius:14px;box-shadow:0 6px 20px rgba(8,145,178,.14);border-top:5px solid #0891B2;padding:14px 16px;margin-top:8px}
.os-bk h4{margin:0;font-size:19px;color:#0E5A70}
.os-bks{font-size:11.5px;color:#475569;margin:3px 0 12px}
.os-sl{font-size:10.5px;font-weight:800;color:#0E5A70;margin:0 0 5px;text-transform:uppercase;letter-spacing:.05em}
.os-dayb{display:flex;gap:9px;margin-bottom:12px}
.os-dbtn{border:2px solid #BAE6FD;border-radius:10px;padding:6px 16px;text-align:center;background:#fff;color:#0E5A70;font-size:11px;font-weight:700;line-height:1.25;transition:background .25s,color .25s}
.os-dbtn b{display:block;font-size:14px}
.os-dbtn small{display:block;color:#0891B2;font-weight:800}
.os-dbtn.on{background:#0891B2;border-color:#0891B2;color:#fff}.os-dbtn.on small{color:#CFFAFE}
.os-tg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.os-t{border:2px solid #BAE6FD;border-radius:9px;padding:8px 0;text-align:center;font-weight:800;font-size:13px;color:#0E5A70;background:#fff;transition:background .25s,color .25s,border-color .25s}
.os-t.tk{background:#F1F5F9;border-color:#E2E8F0;color:#CBD5E1;text-decoration:line-through}
.os-t.on{background:linear-gradient(90deg,#F97316,#FB923C);border-color:#F97316;color:#fff}
.os-hold{margin-top:12px;background:#FFF7ED;border:1px solid #FED7AA;border-radius:10px;padding:9px 12px;font-size:12px;color:#9A3412;display:flex;gap:12px;align-items:center;line-height:1.4}
.os-hold .cd{margin-left:auto;font-size:18px;font-weight:900;color:#EA580C;font-variant-numeric:tabular-nums}
.os-hold.gone{background:#F1F5F9;border-color:#E2E8F0;color:#475569}.os-hold.gone .cd{color:#94A3B8}
.os-cta{display:block;text-align:center;background:linear-gradient(90deg,#F97316,#FB923C);color:#fff;font-weight:800;border-radius:999px;padding:10px 14px;font-size:13.5px;margin-top:14px;transition:transform .15s}
.os-cta.sm{display:inline-block;padding:8px 16px;font-size:12px;margin:0}
.os-cta.gh{background:#fff;color:#0E7490;border:2px solid #0891B2}
/* the consent */
.os-cs{background:#fff;border-radius:14px;box-shadow:0 6px 20px rgba(8,145,178,.14);overflow:hidden;margin-top:10px}
.os-csh{background:linear-gradient(90deg,#0E7490,#0891B2);color:#fff;font-weight:800;font-size:15px;padding:9px 16px}
.os-csb{padding:6px 16px 16px}
.os-cs .sc-i.foc{border-color:#0891B2;box-shadow:0 0 0 3px rgba(8,145,178,.18)}
.os-cs .sc-i.typing::after{color:#0891B2}
.os-wb{background:#ECFDF5;border:1px solid #A7F3D0;color:#065F46;font-weight:700;font-size:12px;border-radius:9px;padding:8px 12px;margin-top:10px;opacity:0}
.os-mask{font-size:12px;color:#334155;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:8px;padding:7px 10px;margin-top:8px}
.os-mask a{color:#0891B2;font-weight:700;text-decoration:underline;margin-left:6px}
.os-kids{display:flex;gap:7px;margin-top:3px}
.os-kc{border:2px solid #BAE6FD;border-radius:999px;padding:4px 14px;font-weight:800;font-size:12px;color:#0E5A70;background:#fff;transition:background .25s,color .25s}
.os-kc.on{background:#0891B2;border-color:#0891B2;color:#fff}
.os-q{display:flex;align-items:center;gap:10px;font-size:12px;color:#1E293B;padding:7px 0;border-bottom:1px solid #F1F5F9}
.os-q>span:first-child{flex:1}
.os-yn{border:2px solid #CBD5E1;border-radius:7px;padding:3px 12px;font-weight:800;font-size:11px;color:#334155;background:#fff;transition:all .2s}
.os-yn.on{background:#0891B2;border-color:#0891B2;color:#fff}
.os-stmt{background:#F8FAFC;border:1px solid #E2E8F0;border-radius:9px;padding:9px 12px;margin-top:10px}
.os-stmt b{font-size:11px;color:#0E5A70;text-transform:uppercase;letter-spacing:.05em}
.os-stmt u{display:block;height:7px;border-radius:4px;background:#E2E8F0;margin-top:7px;text-decoration:none}
.os-sign{margin-top:8px;border:2px dashed #0891B2;border-radius:10px;height:54px;display:flex;align-items:center;justify-content:center;color:#0891B2;font-weight:800;font-size:13px;background:#F0FDFF;transition:background .3s}
.os-sign.done{border-style:solid;background:#fff;color:#0F172A;font-family:"Segoe Script","Bradley Hand","Snell Roundhand","Brush Script MT",cursive;font-size:26px;font-weight:400}
.os-hint2{font-size:10px;color:#64748B;margin-top:3px}
/* booked screen */
.os-ok{background:#fff;border-radius:16px;box-shadow:0 6px 20px rgba(8,145,178,.14);padding:18px 20px;margin-top:10px;text-align:center}
.os-okic{width:54px;height:54px;border-radius:50%;background:#10B981;margin:0 auto 8px;position:relative}
.os-okic::after{content:"";position:absolute;left:19px;top:11px;width:13px;height:24px;border:solid #fff;border-width:0 5px 5px 0;transform:rotate(45deg)}
.os-ok h4{margin:0;font-size:20px;color:#0E5A70}
.os-when{display:flex;gap:14px;align-items:center;text-align:left;border:2px solid #BAE6FD;border-radius:12px;padding:10px 14px;margin:12px auto 10px;width:440px;background:#F0F9FF}
.os-cal{width:52px;border-radius:8px;overflow:hidden;text-align:center;background:#fff;border:1px solid #BAE6FD;flex:none}
.os-cal i{display:block;background:#F97316;color:#fff;font-style:normal;font-size:10px;font-weight:800;padding:2px 0}
.os-cal b{display:block;font-size:22px;color:#0E5A70;line-height:1.3}
.os-when div b{font-size:15px;color:#0F172A}.os-when div small{display:block;font-size:11.5px;color:#475569;margin-top:2px}
.os-bring{font-size:12.5px;color:#334155;line-height:1.55;text-align:left;width:440px;margin:0 auto}
.os-bring ul{margin:3px 0 0;padding-left:18px}
.os-okb{display:flex;gap:8px;justify-content:center;margin-top:14px}
.os-clear{font-size:10.5px;color:#64748B;margin-top:10px}
/* See bookings */
.os-bw{position:absolute;left:58px;top:118px;width:1172px;background:#fff;border-radius:14px;box-shadow:0 18px 44px rgba(15,23,42,.18);overflow:hidden;z-index:4;font-family:"Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:#1E293B;font-size:12.5px}
.os-bwb{padding:10px 16px 12px}
.os-bwtop{display:flex;align-items:center;gap:10px;margin-bottom:8px}

 const p=field.parentElement;p.style.position='relative';dd.style.top=(field.offsetTop+field.offsetHeight+2)+'px';dd.style.minWidth=field.offsetWidth+'px';p.appendChild(dd);
 await anim(dd,[{opacity:0,transform:'translateY(-6px)'},{opacity:1,transform:'none'}],250,'ease-out');dd.style.opacity=1;
 const it=[...dd.children][opts.indexOf(pick)];await move(it,600);it.classList.add('hi');await click();await wait(250);field.textContent=pick;field.classList.remove('ph','foc');dd.remove()}

/* ---- quiz: the standard ask()/QUIZ pair. Each answer goes to ldahTrack.quiz(sec,i,correct). ---- */
window.QUIZ_TOTAL=3;
function ask(Q,i,sec){const w=q('.qz-wrap');
 w.innerHTML=`<div class="qz-card"><div class="qz-n">Question ${i+1} of 3</div><div class="qz-q">${Q.q}</div>${Q.o.map((o,j)=>`<button class="qz-o" data-j="${j}"><span class="qz-L">${'ABC'[j]}</span><span>${o}</span></button>`).join('')}<div class="qz-fb"></div></div>`;
 const card=w.firstChild,fb=card.querySelector('.qz-fb'),btns=[...card.querySelectorAll('.qz-o')];
 const finish=()=>{btns.forEach(b=>b.disabled=true);btns[Q.a].classList.add('qz-yes');const st=document.querySelectorAll('.scene.on .qz-stars i')[i];if(st)st.classList.add('on');fb.className='qz-fb good';fb.textContent='Yes! '+Q.y};
 if(FAST){finish();return Promise.resolve()}
 return new Promise(res=>{btns.forEach((b,j)=>b.onclick=async()=>{
  if(b.disabled)return;
  if(window.ldahTrack)ldahTrack.quiz(sec,i,j===Q.a);
  if(j===Q.a){finish();const p=pos(b);confetti(p.x+60,p.y+20,70);await speak('Yes! '+Q.y,run);await wait(700);res()}
  else{b.disabled=true;b.classList.add('qz-no');fb.className='qz-fb bad';fb.textContent='Not quite. '+Q.n+' Try again.';speak('Not quite. '+Q.n+' Try again.',run)}})})}
const QUIZ=(sec,qs)=>({cls:'quiz',html:()=>HEAD('Quick check','Your turn!')+`<div class="qz-stars">${qs.map(()=>'<i></i>').join('')}</div><div class="qz-wrap"><div class="qz-intro">Three quick questions.<small>Your first answer to each one counts. Click the answer you think is right.</small></div></div>`,
 steps:[{say:'Quick check. Three quick questions. Your first answer to each one counts.'},
  ...qs.map((Q,i)=>({say:`Question ${i+1}. ${Q.q}`,act:()=>ask(Q,i,sec)}))]});
