<style>

.big-note{position:absolute;background:#FEF3C7;border:3px solid #F59E0B;border-radius:16px;padding:14px 18px;font-size:19px;line-height:1.35;font-weight:700;color:#78350F;box-shadow:0 14px 30px rgba(180,83,9,.18)}
.big-note.red{background:#FEF2F2;border-color:#DC2626;color:#7F1D1D}
.big-note.green{background:#F0FDF4;border-color:#16A34A;color:#14532D}

/* ---------- the public website (ldahawaii.org/pacific.html) ---------- */
.brw{position:absolute;left:58px;top:116px;width:716px;height:584px;background:#fff;border-radius:14px;box-shadow:0 18px 44px rgba(15,23,42,.22);overflow:hidden}
.brw .bar{height:38px;background:#E2E8F0;display:flex;align-items:center;gap:7px;padding:0 12px}
.brw .bar i{width:11px;height:11px;border-radius:50%;background:#F87171;display:block}.brw .bar i:nth-child(2){background:#FBBF24}.brw .bar i:nth-child(3){background:#34D399}
.brw .url{flex:1;margin-left:10px;background:#fff;border-radius:7px;font-size:13px;padding:5px 10px;color:#334155}
.brw .rf{font-size:16px;color:#475569;font-weight:900;padding:0 4px}
.phero{height:118px;background:linear-gradient(135deg,#0B4F6C,#0891B2);color:#fff;text-align:center;padding-top:26px}
.phero b{display:block;font-size:24px}.phero span{font-size:13px;opacity:.9}
.icards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px 18px}

.pmod{position:absolute;left:96px;top:150px;width:640px;height:530px;background:#fff;border-radius:14px;box-shadow:0 24px 60px rgba(15,23,42,.4);overflow:hidden;z-index:6}

.pmod .mb{padding:10px 18px;font-size:13px;color:#334155;line-height:1.45}
.pmod h4{margin:10px 0 5px;font-size:16px;color:#0B3A53}

.scard{background:#F0F9FF;border-radius:9px;padding:7px 10px;font-size:12px;line-height:1.4}.scard b.h{display:block;color:#0066cc;font-size:13px}

/* ---------- DAN menu ---------- */
.nav{position:absolute;left:58px;top:120px;width:250px;background:#1E293B;border-radius:14px;padding:10px 0;color:rgba(255,255,255,.75);font-size:14px;box-shadow:0 14px 34px rgba(15,23,42,.25)}

/* ---------- the Page Editor (WYSIWYG) ---------- */
.edw{position:absolute;left:58px;top:116px;width:716px;height:584px;background:#F8FAFC;border-radius:14px;box-shadow:0 18px 44px rgba(15,23,42,.22);overflow:hidden}
.edw .ttl{height:40px;display:flex;align-items:center;padding:0 14px;font-weight:800;font-size:17px;color:#0B3A53;background:#fff;border-bottom:1px solid #E2E8F0}

.pvin{padding:12px 18px}
.hcards{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:420px;margin:0 auto 10px}
.hc{border:1px solid rgba(8,145,178,.15);border-radius:9px;padding:7px;text-align:center;font-size:11px;color:#64748B}

/* side panel */

.hint{font-size:12px;color:#64748B;line-height:1.4;margin-bottom:9px}
.tbar{display:flex;flex-wrap:wrap;gap:4px;padding:7px 8px;background:#FDF8F0;border:1px solid rgba(8,145,178,.2);border-bottom:none;border-radius:9px 9px 0 0}
.tbar span{background:#fff;border:1px solid rgba(8,145,178,.2);border-radius:5px;padding:2px 7px;font-size:12px}

.pe-rt p{margin:0 0 4px}
.sel{background:#BFDBFE}
.caret{display:inline-block;width:2px;height:15px;background:#0F172A;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.prm{position:absolute;left:120px;top:200px;width:420px;background:#fff;border-radius:12px;box-shadow:0 24px 60px rgba(15,23,42,.45);padding:16px 18px;z-index:12;font-size:14px}
.prm .in3{border:2px solid #0891B2;border-radius:7px;padding:7px 10px;margin:8px 0 12px;min-height:36px;font-size:14px}
.prm .bt{display:flex;justify-content:flex-end;gap:8px}.prm .bt span{border-radius:7px;padding:6px 16px;font-weight:700;border:1px solid #CBD5E1}.prm .bt span.ok{background:#1D4ED8;color:#fff;border-color:#1D4ED8}
.stoast{position:absolute;right:20px;bottom:18px;background:#166534;color:#fff;font-weight:800;font-size:14px;padding:9px 22px;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.2);z-index:14}
.chip2{display:inline-block;background:#0B4F6C;color:#fff;font-weight:800;font-size:11px;border-radius:7px;padding:2px 8px}

/* ---------- quiz ---------- */
.scene.quiz{background:linear-gradient(135deg,#FFF1F8,#E0F7FA)}
.qwrap{position:absolute;left:0;top:0;right:0;bottom:0}
.qintro{position:absolute;left:120px;top:190px;width:1040px;text-align:center;font-size:30px;font-weight:800;color:#0B3A53;line-height:1.35;animation:rise .5s both}
.qintro small{display:block;font-size:20px;color:#475569;font-weight:700;margin-top:14px}
.qcard{position:absolute;left:120px;top:138px;width:1040px;background:#fff;border-radius:20px;box-shadow:0 18px 40px rgba(15,23,42,.14);padding:22px 30px;animation:rise .5s both}
.qn{font-size:14px;font-weight:900;color:var(--pink);letter-spacing:.08em;text-transform:uppercase}
.qq{font-size:27px;font-weight:800;line-height:1.25;margin:6px 0 16px}
.qo{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;font-size:21px;font-weight:700;background:#F8FAFC;border:3px solid #E2E8F0;border-radius:14px;padding:11px 16px;margin-bottom:10px;cursor:pointer;transition:border-color .2s,background .2s;color:var(--ink)}
.qo:hover:not([disabled]){border-color:#0891B2;background:#F0F9FF}
.qo[disabled]{cursor:default}
.qo .L{width:38px;height:38px;border-radius:50%;background:#0E7490;color:#fff;display:flex;align-items:center;justify-content:center;flex:none;font-weight:900}
.qo.no{border-color:#DC2626;background:#FEF2F2;animation:shake .4s}.qo.no .L{background:#DC2626}
.qo.yes{border-color:#16A34A;background:#F0FDF4}.qo.yes .L{background:#16A34A}
.qfb{min-height:30px;font-size:19px;font-weight:700;margin-top:4px}.qfb.good{color:#15803D}.qfb.bad{color:#B91C1C}
.stars{position:absolute;right:60px;top:46px;display:flex;gap:8px}
.stars i{width:36px;height:36px;background:#E2E8F0;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);transition:background .3s}
.stars i.on{background:#F59E0B;animation:popn .6s}
.qhelp{position:absolute;left:120px;bottom:30px;font-size:16px;color:#475569;font-weight:700}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
</style></head><body>
<div id="view"><div id="stage"><div id="nbar"><i></i></div>
<div id="scenes"></div>
<div id="spot"></div>
<svg id="cursor" viewBox="0 0 28 32"><path d="M3 2 L3 26 L9.5 19.5 L14 29 L18.5 27 L14 17.5 L23 17.5 Z" fill="#fff" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/></svg>
</div></div>
<div id="cap" aria-live="polite"></div>
<div id="bar">
 <button id="prev">Back</button><button id="play">Start</button><button id="next">Next</button>
 <div id="dots"></div>
 <button id="capbtn" aria-pressed="false">Captions</button><button id="voice" aria-pressed="true">Voice on</button>
</div>
<script>
const DECK_ID='page-editor-pip-fsm';

/* Drawn in HTML/CSS from the live Page Editor (WYSIWYG) in DAN (v154.87, section cmsPageEditor2,
   pe2* code) and the live ldahawaii.org/pacific.html FSM window. Every contact person is MADE UP. */

/* ---- small helpers ---- */
const tap=async(s,ms=850)=>{const e=typeof s==='string'?q(s):s;await move(e,ms);await click(e);return e};
function all(s){return[...document.querySelectorAll('.scene.on '+s)]}
const show=(e,ms=500)=>anim(e,[{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],ms,'ease-out').then(()=>{e.style.opacity=1});
const PTS=(items,top=140)=>`<div class="abs" style="left:800px;top:${top}px;width:430px"><ul class="pts">${items.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
async function typeAt(span,text,ms=40){span.textContent='';for(const c of text){span.textContent+=c;await wait(ms)}}

/* ---- the words (About is LDAH's real page text; every person is made up) ---- */
const ABOUT='LDAH works across all <b>four states of FSM – Chuuk, Kosrae, Pohnpei, and Yap</b> – to support families and children with disabilities through training, resources, and advocacy support.';
const ADD=' Call or email your state contact below.';
const C_YAP='<b>Yap</b><br><b>Maria Sample</b><br><a>maria@example.com</a><br>P.O. Box 100, Colonia, Yap';
const C_CHK_OLD='<b>Chuuk</b><br><b>Kino Example</b><br>SPED Coordinator<br><a>kino@example.com</a><br>(691) 555-0101';
const C_CHK_NEW='<b>Chuuk</b><br><b>Rose Example</b><br>SPED Coordinator<br><a>rose@example.com</a><br>(691) 555-0101';
const C_POH='<b>Pohnpei</b><br><b>Lisa Sample</b>, SPED Director<br><a>lisa@example.com</a>';
const C_KOS='<b>Kosrae</b><br><b>Ben Example</b><br><a>ben@example.com</a><br>(691) 555-0102';

/* ---- the public website ---- */
const scH=c=>c.replace(/^<b>([^<]+)<\/b><br>/,'<b class="h">$1</b>');
const ISL=[['American Samoa',''],['Northern Mariana Islands',''],['Federated States of Micronesia','fsm'],['Guam',''],['Marshall Islands',''],['Palau','']];
const SITE=()=>`<div class="brw"><div class="bar"><i></i><i></i><i></i><span class="rf k-rf">↻</span><span class="url">ldahawaii.org/pacific.html</span></div>
 <div class="phero"><b>Pacific Islands Partnership</b><span>Supporting families across the Pacific Islands</span></div>
 <div class="icards">${ISL.map(i=>`<div class="icard ${i[1]}"><div class="im"></div><div class="tx"><b>${i[0]}</b><small>Learn more →</small></div></div>`).join('')}</div></div>`;
const PMOD=(o={})=>`<div class="pmw"><div class="pdim"></div><div class="pmod"><div class="mh"><span>Federated States of Micronesia<small>Partner States: Chuuk, Kosrae, Pohnpei &amp; Yap</small></span><span>×</span></div><div class="mb">
 <h4>About Our Partnership</h4><div class="k-pabout">${ABOUT}${o.added?ADD:''}</div>
 <h4>State Contacts</h4><div class="sgrid"><div class="scard">${scH(C_YAP)}</div><div class="scard k-pchk">${scH(o.newChuuk?C_CHK_NEW:C_CHK_OLD)}</div><div class="scard">${scH(C_POH)}</div><div class="scard">${scH(C_KOS)}</div></div>
 <h4>Photo Gallery</h4></div></div></div>`;

/* ---- the Page Editor (WYSIWYG), as a FSM partner sees it ---- */
const EDW=(o={})=>`<div class="edw${o.bar?' hasbar':''}"><div class="ttl">Page Editor (WYSIWYG)</div>
 <div class="pbar${o.bar?' on':''}"><span class="t k-pbt">${o.bar||'You have unpublished changes'}</span><span class="ds">Discard</span><span class="pb k-pub">Publish to Website</span></div>
 <div class="edb"><div class="sbar"><div class="h">Pages</div><div class="tb k-fsm">FSM</div></div>
 <div class="pvw"><div class="pvin">
  <div class="hcards k-photos"><div class="hc"><div class="ph"></div>Hero Photo</div><div class="hc"><div class="ph fl"></div>Flag / Logo</div></div>
  <div class="sec"><span class="badge2">About Our Partner</span></div>
  <div class="ecard k-about"><span class="eb">Edit</span><div class="k-abtx">${ABOUT}${o.added?ADD:''}</div></div>
  <div class="sec" style="margin-top:12px"><span class="badge2">Contacts</span></div>
  <div class="cgrid k-cgrid"><div class="ecard ct"><span class="eb">Edit</span>${C_YAP}</div><div class="ecard ct k-chk"><span class="eb">Edit</span><div class="k-chtx">${o.newChuuk?C_CHK_NEW:C_CHK_OLD}</div></div><div class="ecard ct"><span class="eb">Edit</span>${C_POH}</div><div class="ecard ct"><span class="eb">Edit</span>${C_KOS}</div></div>
  <div class="sec" style="margin-top:12px"><span class="badge2">Gallery</span></div>
  <div class="ggrid k-gal">${'<i></i>'.repeat(5)}</div>
 </div></div></div></div>`;
const TOOLS=['<b>B</b>','<i>I</i>','<u>U</u>','List','1.','Link','Unlink','Clear','Color','Size ▾'];
const PANEL=(title,body)=>`<div class="pwrap"><div class="pdrop"></div><div class="ppan"><div class="ph2"><span>${title}</span><span class="x k-px">×</span></div><div class="pb2">
 <div class="hint">Format text using the toolbar. Your changes will appear in the preview but won’t go live until you click Publish.</div>
 <div class="tbar">${TOOLS.map((t,i)=>`<span class="k-t${i}">${t}</span>`).join('')}</div><div class="pe-rt k-rt">${body}</div></div></div></div>`;
async function openPanel(title,body){add(PANEL(title,body),q('.edw'));await anim(q('.ppan'),[{transform:'translateX(100%)'},{transform:'none'}],400,'ease-out');return q('.ppan')}
async function closePanel(){await tap('.k-px',700);hideCursor();await anim(q('.ppan'),[{transform:'none'},{transform:'translateX(100%)'}],300,'ease-in');q('.pwrap').remove()}
async function hover(sel){const e=q(sel);await move(e,800);e.classList.add('hov');return e}
function setBar(t){const e=q('.edw');e.classList.add('hasbar');q('.pbar').classList.add('on');q('.k-pbt').textContent=t}

/* ---- quiz (same pattern as the other Pacific Island Partners decks) ---- */
function ask(Q,i,sec){const w=q('.qwrap');
 w.innerHTML=`<div class="qcard"><div class="qn">Question ${i+1}</div><div class="qq">${Q.q}</div>${Q.o.map((o,j)=>`<button class="qo" data-j="${j}"><span class="L">${'ABC'[j]}</span><span>${o}</span></button>`).join('')}<div class="qfb"></div></div>`;
 const card=w.firstChild,fb=card.querySelector('.qfb'),btns=[...card.querySelectorAll('.qo')];
 const finish=()=>{btns.forEach(b=>b.disabled=true);btns[Q.a].classList.add('yes');const st=all('.stars i')[i];if(st)st.classList.add('on');fb.className='qfb good';fb.textContent='Yes! '+Q.y};
 if(FAST){finish();return Promise.resolve()}
 return new Promise(res=>{btns.forEach((b,j)=>b.onclick=async()=>{
  if(b.disabled)return;
  if(window.ldahTrack)ldahTrack.quiz(sec,i,j===Q.a);
  if(j===Q.a){finish();const p=pos(b);confetti(p.x+60,p.y+20,70);await speak('Yes! '+Q.y,run);await wait(700);res()}
  else{b.disabled=true;b.classList.add('no');fb.className='qfb bad';fb.textContent='Not quite. '+Q.n+' Try again.';speak('Not quite. '+Q.n+' Try again.',run)}})})}
