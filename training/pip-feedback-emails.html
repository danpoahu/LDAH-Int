<div id="view"><div id="stage"><div id="nbar"><i></i></div>
<div id="scenes"></div>
<div id="spot"></div>
<svg id="cursor" viewBox="0 0 28 32"><path d="M3 2 L3 26 L9.5 19.5 L14 29 L18.5 27 L14 17.5 L23 17.5 Z" fill="#fff" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/></svg>
</div></div>
<div id="cap" aria-live="polite"></div>
<div id="bar">
 <button id="prev">Back</button><button id="play">Start</button><button id="next">Next</button>
 <div id="dots"></div>

<script>
const DECK_ID='pip-feedback-emails';

/* Every screen below is drawn in HTML/CSS from the live dashboard (v151.69) and
   the live Pacific Island Partners feedback email. All names are made up. */

/* ---- small helpers ---- */
const tap=async(s,ms=850)=>{const e=typeof s==='string'?q(s):s;await move(e,ms);await click(e);return e};
function toast(msg){const t=add(`<div class="toast">${msg}</div>`);pop(t);if(!FAST)setTimeout(()=>t.remove(),3200);else t.remove();return t}
function all(s){return[...document.querySelectorAll('.scene.on '+s)]}
const show=(e,ms=500)=>anim(e,[{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],ms,'ease-out');
async function pickFrom(target,opts,choice){const p=pos(target);const d=add(`<div class="dd" style="left:${p.x}px;top:${p.y+p.h+2}px;width:${p.w}px">${opts.map(o=>`<div>${o}</div>`).join('')}</div>`);
 await wait(350);const row=[...d.children].find(x=>x.textContent===choice);await move(row,600);row.classList.add('hi');await click(row);await wait(200);d.remove();
 target.textContent=choice;target.classList.remove('ph');target.classList.add('flash');setTimeout(()=>target.classList.remove('flash'),700)}
const TICK='<svg viewBox="0 0 16 16"><path d="M3 8.5 L6.5 12 L13 4.5"/></svg>';
const ISL=['American Samoa','Guam','CNMI','Micronesia','Marshall Islands','Palau'];

/* ---- the one-off form, as a partner sees it (TOTAL box with the pink tick box beside it) ---- */
const MATS=['Agency Brochure','Education &amp; Training Brochure','What is a Learning Disability Brochure','Understanding ADHD Brochure','Understanding Dyslexia Brochure','Understanding Autism','Flyers','Newsletters'];

function ask(Q,i,sec){const w=q('.qwrap');
 w.innerHTML=`<div class="qcard"><div class="qn">Question ${i+1}</div><div class="qq">${Q.q}</div>${Q.o.map((o,j)=>`<button class="qo" data-j="${j}"><span class="L">${'ABC'[j]}</span><span>${o}</span></button>`).join('')}<div class="qfb"></div></div>`;
 const card=w.firstChild,fb=card.querySelector('.qfb'),btns=[...card.querySelectorAll('.qo')];
 const finish=()=>{btns.forEach(b=>b.disabled=true);btns[Q.a].classList.add('yes');const st=all('.stars i')[i];if(st)st.classList.add('on');fb.className='qfb good';fb.textContent='Yes! '+Q.y};
 if(FAST){finish();return Promise.resolve()}
 return new Promise(res=>{btns.forEach((b,j)=>b.onclick=async()=>{
  if(b.disabled)return;
  if(window.ldahTrack)ldahTrack.quiz(sec,i,j===Q.a);
  if(j===Q.a){finish();const p=pos(b);confetti(p.x+60,p.y+20,70);await speak('Yes! '+Q.y,run);await wait(700);res()}
  else{b.disabled=true;b.classList.add('no');fb.className='qfb bad';fb.textContent='Not quite. '+Q.n+' Try again.';speak('Not quite. '+Q.n+' Try again.',run)}})})}
const QUIZ=(sec,qs,first)=>({cls:'quiz',html:()=>HEAD('Quick check','Your turn!')+`<div class="stars">${qs.map(()=>'<i></i>').join('')}</div><div class="qwrap"><div class="qintro">${qs.length} quick question${qs.length>1?'s':''}.${first?'<small>Click the answer you think is right. If you miss, you can try again. No one sees your score.</small>':''}</div></div>${first?'<div class="qhelp">Take your time. The next question waits for you.</div>':''}`,
 steps:[{say:first?`Quick check! ${qs.length} questions. Click the answer you think is right. If you miss, just try again. Nobody sees your score.`:`Quick check. ${qs.length} questions.`},
  ...qs.map((Q,i)=>({say:`Question ${i+1}. ${Q.q}`,act:()=>ask(Q,i,sec)}))]});
