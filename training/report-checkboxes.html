<style>
/* For LDAH staff AND Pacific partners (Daniel 2026-11-13): no Aloha/Mahalo, no staff names.
   Every screen is drawn in CSS from live DAN v154.74. Every class starts with rb- or qz-. */
.rb-pink{position:absolute;background:#FDF2F8;border:2px solid #F9A8D4;border-radius:16px;box-shadow:0 14px 36px rgba(15,23,42,.14);padding:16px 20px;opacity:0;font-family:Arial,Helvetica,sans-serif}
.rb-pink .t{font-size:13px;font-weight:900;color:#BE185D;letter-spacing:.06em;text-transform:uppercase}
.rb-pink h4{margin:4px 0 2px;font-size:20px;color:#0B3A53}
.rb-pink .hlp{font-size:13.5px;color:#64748B;margin:0 0 10px;line-height:1.35}
.rb-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.rb-c{display:flex;align-items:center;gap:8px;font-size:14px;color:#1E293B;background:#fff;border:1.5px solid #FBCFE8;border-radius:8px;padding:5px 8px;transition:all .3s}
.rb-c i{width:18px;height:18px;border:2px solid #BE185D;border-radius:4px;flex:none;position:relative;background:#fff}
.rb-c.on i{background:#BE185D}.rb-c.on i::after{content:"";position:absolute;left:4px;top:0;width:5px;height:10px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg)}
.rb-c.on{border-color:#BE185D;background:#FFF1F7}
.rb-c b{color:#BE185D;min-width:34px}
.rb-c.dim{opacity:.35}
.rb-field{background:#fff;border:1.5px solid #E2E8F0;border-radius:8px;padding:6px 10px;font-size:14px;color:#334155;margin-bottom:8px}
.rb-field small{display:block;font-size:11px;font-weight:800;color:#64748B;text-transform:uppercase;letter-spacing:.04em}
.rb-card{position:absolute;background:#fff;border-radius:16px;box-shadow:0 10px 26px rgba(15,23,42,.1);padding:16px 20px;opacity:0}
.rb-card h4{margin:0 0 8px;font-size:21px;color:#0B3A53}
.rb-card p,.rb-card li{font-size:16.5px;color:#334155;line-height:1.42;margin:0 0 7px}
.rb-card ul{margin:0;padding-left:20px}
.rb-card .code{display:inline-block;font-weight:900;color:#fff;background:#BE185D;border-radius:6px;padding:0 7px;margin-right:6px;font-size:14px}
.rb-card.y .code{background:#7C3AED}.rb-card.p .code{background:#0E7490}
.rb-card.warn{border-left:8px solid #F59E0B}.rb-card.ok{border-left:8px solid #15803D}.rb-card.info{border-left:8px solid #0891B2}
.rb-ev{position:absolute;background:#fff;border-radius:14px;box-shadow:0 10px 26px rgba(15,23,42,.1);padding:14px 18px;opacity:0;width:350px}
.rb-ev .k{font-size:12px;font-weight:900;color:#D63384;letter-spacing:.06em;text-transform:uppercase}
.rb-ev h5{margin:3px 0 8px;font-size:19px;color:#0B3A53;line-height:1.25}
.rb-ev .tick{display:inline-block;font-size:14px;font-weight:800;color:#BE185D;background:#FFF1F7;border:1.5px solid #F9A8D4;border-radius:999px;padding:2px 10px;margin:0 6px 6px 0;opacity:0}
.rb-ev .tick.none{color:#475569;background:#F1F5F9;border-color:#CBD5E1}
.rb-ev p{font-size:14.5px;color:#475569;margin:6px 0 0;line-height:1.35}
.rb-flow{position:absolute;left:70px;top:150px;width:1140px;display:grid;grid-template-columns:1fr 60px 1fr 60px 1fr;align-items:center}
.rb-flow .st{background:#fff;border-radius:16px;box-shadow:0 10px 26px rgba(15,23,42,.1);padding:18px;min-height:250px;opacity:0;border-top:8px solid #BE185D}
.rb-flow .st.b{border-top-color:#0E7490}.rb-flow .st.c{border-top-color:#15803D}
.rb-flow .st h4{margin:0 0 8px;font-size:21px;color:#0B3A53}
.rb-flow .st p{font-size:16.5px;color:#475569;line-height:1.42;margin:0}
.rb-flow .ar{font-size:40px;color:#94A3B8;text-align:center;opacity:0}
.rb-mt{position:absolute;background:#fff;border:1.5px solid #CBD5E1;border-radius:16px;box-shadow:0 14px 36px rgba(15,23,42,.14);padding:16px 20px;opacity:0;font-family:Arial,Helvetica,sans-serif}
.rb-mt h4{margin:0 0 10px;font-size:19px;color:#0B3A53}
.rb-pills{display:flex;flex-wrap:wrap;gap:7px}
.rb-pill{font-size:14px;font-weight:700;color:#334155;border:1.5px solid #CBD5E1;border-radius:999px;padding:5px 12px;background:#fff;transition:all .3s}
.rb-pill.on{background:#0E7490;border-color:#0E7490;color:#fff}
.rb-sel{display:flex;gap:8px;align-items:center;margin-bottom:12px;font-size:14px}
.rb-sel span{font-weight:800;color:#64748B;text-transform:uppercase;font-size:11px;letter-spacing:.04em}
.rb-sel b{border:1.5px solid #0E7490;border-radius:8px;padding:5px 10px;color:#0E7490;background:#ECFEFF}
/* ---------- quiz (qz- prefix) ---------- */
.scene.quiz{background:linear-gradient(135deg,#FDF2F8,#E0F7FA)}
.qz-wrap{position:absolute;left:0;top:0;right:0;bottom:0}
.qz-intro{position:absolute;left:120px;top:190px;width:1040px;text-align:center;font-size:30px;font-weight:800;color:#0B3A53;line-height:1.35;animation:rise .5s both}
.qz-intro small{display:block;font-size:20px;color:#475569;font-weight:700;margin-top:14px}
.qz-card{position:absolute;left:120px;top:138px;width:1040px;background:#fff;border-radius:20px;box-shadow:0 18px 40px rgba(15,23,42,.14);padding:22px 30px;animation:rise .5s both}
.qz-n{font-size:14px;font-weight:900;color:var(--pink);letter-spacing:.08em;text-transform:uppercase}
.qz-q{font-size:27px;font-weight:800;line-height:1.25;margin:6px 0 16px}
.qz-o{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;font-size:21px;font-weight:700;background:#F8FAFC;border:3px solid #E2E8F0;border-radius:14px;padding:11px 16px;margin-bottom:10px;cursor:pointer;transition:border-color .2s,background .2s;color:var(--ink)}
.qz-o:hover:not([disabled]){border-color:#0891B2;background:#F0F9FF}
.qz-o[disabled]{cursor:default}
.qz-o .qz-L{width:38px;height:38px;border-radius:50%;background:#0E7490;color:#fff;display:flex;align-items:center;justify-content:center;flex:none;font-weight:900}
.qz-o.qz-no{border-color:#DC2626;background:#FEF2F2;animation:qzshake .4s}.qz-o.qz-no .qz-L{background:#DC2626}
.qz-o.qz-yes{border-color:#16A34A;background:#F0FDF4}.qz-o.qz-yes .qz-L{background:#16A34A}
.qz-fb{min-height:30px;font-size:19px;font-weight:700;margin-top:4px}.qz-fb.good{color:#15803D}.qz-fb.bad{color:#B91C1C}
.qz-stars{position:absolute;right:60px;top:46px;display:flex;gap:8px}
.qz-stars i{width:36px;height:36px;background:#E2E8F0;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);transition:background .3s}
.qz-stars i.on{background:#F59E0B;animation:popn .6s}
@keyframes qzshake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
</style></head><body>
<div id="view"><div id="stage"><div id="nbar"><i></i></div>
<div id="scenes"></div>
<div id="spot"></div>
<svg id="cursor" viewBox="0 0 28 32"><path d="M3 2 L3 26 L9.5 19.5 L14 29 L18.5 27 L14 17.5 L23 17.5 Z" fill="#fff" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/></svg>
</div></div>
<div id="cap" aria-live="polite"></div>
<div id="bar">
 <button id="prev">Back</button><button id="play">Start</button><button id="next">Next</button>
 <div id="dots"></div>
 <button id="capbtn" aria-pressed="false">Captions</button><button id="voice" aria-pressed="true">Voice on</button>
</div>
<script>
const DECK_ID='report-checkboxes';

const LOGO='../logo_blue.png';
const LOGOBOX=`<div style="position:absolute;left:70px;top:22px;background:#fff;border-radius:14px;padding:6px 10px;box-shadow:0 4px 14px rgba(0,0,0,.18);animation:rise .6s both"><img src="${LOGO}" alt="LDAH" style="height:80px;display:block"></div>`;
function all(s){return[...document.querySelectorAll('.scene.on '+s)]}
const show=(e,ms=500)=>anim(e,[{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],ms,'ease-out').then(()=>{e.style.opacity=1});
const PTS=(items,top=140)=>`<div class="abs" style="left:790px;top:${top}px;width:440px"><ul class="pts">${items.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;

/* The 16 boxes, exactly as DAN shows them (window._ES_M524). */
const M=[['1.a','Co-sponsored event'],['1.b','Co-presentation'],['1.c','Materials at a collaborative event'],
 ['2.a','IDEA / IEP / rights workshop'],['2.b','Transition workshop'],['2.c','Workshop materials'],
 ['3.a','Connect-Gen / Learning Lab / SMART'],['3.b','Parent Talk Cafe'],['3.c','Tips and Tools'],
 ['6.a','Workshop for professionals'],['6.b','Rights information to professionals'],
 ['Y1.a','Youth conference'],['Y1.b','Youth materials: college, career, transition'],['Y2.a','Skillz Lab'],
 ['Y2.b','Youth materials: IEP, ADR, literacy, SEL'],['Y3.a','Youth Synergy']];
const BOXES=(on=[])=>`<div class="rb-grid">${M.map(([c,l])=>`<div class="rb-c${on.includes(c)?' on':''}" data-c="${c}"><i></i><b>${c}</b><span>${l}</span></div>`).join('')}</div>`;
const PINK=(l,t,w,extra='')=>`<div class="rb-pink k-pink" style="left:${l}px;top:${t}px;width:${w}px">${extra}<div class="t">Staff report</div><h4>524B measures</h4><p class="hlp">Tick what this counts toward on the 524B Status Chart. With none ticked, the chart decides from the title and tier.</p>${BOXES()}</div>`;
const box=c=>q(`.rb-c[data-c="${c}"]`);
const tick=async c=>{const b=box(c);await move(b,700);click();b.classList.add('on');await wait(250)};
const MT=[['iep','IFSP / IEP / 504 meeting'],['tiep','Transition IEP meeting'],['fiep','Facilitated IEP meeting'],['dp','Due process hearing'],
 ['mdr','Manifestation determination hearing'],['med','Mediation'],['res','Resolution session'],['susp','Suspension / expulsion hearing'],['slep','Student-led IEP meeting']];

/* ---- quiz: the standard ask()/QUIZ pair. Each answer goes to ldahTrack.quiz(sec,i,correct). ---- */
window.QUIZ_TOTAL=3;
function ask(Q,i,sec){const w=q('.qz-wrap');
 w.innerHTML=`<div class="qz-card"><div class="qz-n">Question ${i+1} of 3</div><div class="qz-q">${Q.q}</div>${Q.o.map((o,j)=>`<button class="qz-o" data-j="${j}"><span class="qz-L">${'ABC'[j]}</span><span>${o}</span></button>`).join('')}<div class="qz-fb"></div></div>`;
 const card=w.firstChild,fb=card.querySelector('.qz-fb'),btns=[...card.querySelectorAll('.qz-o')];
 const finish=()=>{btns.forEach(b=>b.disabled=true);btns[Q.a].classList.add('qz-yes');const st=document.querySelectorAll('.scene.on .qz-stars i')[i];if(st)st.classList.add('on');fb.className='qz-fb good';fb.textContent='Yes! '+Q.y};
 if(FAST){finish();return Promise.resolve()}
 return new Promise(res=>{btns.forEach((b,j)=>b.onclick=async()=>{
  if(b.disabled)return;
  if(window.ldahTrack)ldahTrack.quiz(sec,i,j===Q.a);
  if(j===Q.a){finish();const p=pos(b);confetti(p.x+60,p.y+20,70);await speak('Yes! '+Q.y,run);await wait(700);res()}
  else{b.disabled=true;b.classList.add('qz-no');fb.className='qz-fb bad';fb.textContent='Not quite. '+Q.n+' Try again.';speak('Not quite. '+Q.n+' Try again.',run)}})})}
const QUIZ=(sec,qs)=>({cls:'quiz',html:()=>HEAD('Quick check','Your turn!')+`<div class="qz-stars">${qs.map(()=>'<i></i>').join('')}</div><div class="qz-wrap"><div class="qz-intro">Three quick questions.<small>Your first answer to each one counts. Click the answer you think is right.</small></div></div>`,
 steps:[{say:'Quick check. Three quick questions. Your first answer to each one counts.'},
  ...qs.map((Q,i)=>({say:`Question ${i+1}. ${Q.q}`,act:()=>ask(Q,i,sec)}))]});

const SC=[
// ================= 1. COVER =================
{cls:'cover',html:()=>`${LOGOBOX}<div class="brand">Leadership in Disabilities &amp; Achievement of Hawaiʻi · LDAH and Pacific partners</div><div class="hello">Hi <span class="nm"></span></div>
 <h1>524B Measures and Meeting Types</h1><p class="sub" style="top:356px">The tick boxes on the Event Summary and the One-Off Event form, and the meeting question on an out of office meeting. What they mean and when to tick them.</p>
 <div style="position:absolute;left:820px;top:110px;width:390px;transform:rotate(3deg);animation:bob 6s ease-in-out infinite;z-index:3"><div class="rb-pink" style="position:relative;opacity:1;padding:12px 14px"><div class="t">Staff report</div><h4 style="font-size:17px">524B measures</h4>
  <div class="rb-grid" style="grid-template-columns:1fr">${M.slice(0,6).map(([c,l],i)=>`<div class="rb-c${i===3?' on':''}" style="font-size:12.5px"><i></i><b>${c}</b><span>${l}</span></div>`).join('')}</div></div></div>
 <div class="spark" style="left:790px;top:90px">${SPARK}</div><div class="spark" style="left:1200px;top:560px;animation-delay:1s">${SPARK}</div>
 <div class="gate" style="top:500px"><button class="btn" data-go="start">Start training</button><button class="btn ghost" data-go="skip">Skip for now</button><label><input type="checkbox" id="voiceChk" checked> Read it out loud to me</label></div>${WAVES}`,
 steps:[{say:"Hi {name}! This short training is for LDAH staff and our Pacific partners. It explains the 524B measures tick boxes on the Event Summary and the One-Off Event form, and the What kind of meeting question on an out of office meeting. You can pause, go back, or watch again any time."}]},

// ================= 2. WHY =================
{html:()=>HEAD('Why they are there','The federal report counts what we do')+`<div class="rb-flow">
 <div class="st k-s1"><h4>You tick a box</h4><p>On the <b>Event Summary</b> or the <b>One-Off Event</b> form, you tick what the event was: a workshop, a youth event, materials, and so on.</p></div><div class="ar k-a1">&rarr;</div>
 <div class="st b k-s2"><h4>The report reads it</h4><p>The <b>524B Status Chart</b> in the PTI Report is what we send the U.S. Department of Education each year. It counts each ticked event toward <b>exactly</b> those measures.</p></div><div class="ar k-a2">&rarr;</div>
 <div class="st c k-s3"><h4>Our numbers are right</h4><p>With no box ticked, the chart has to <b>guess</b> from the event title and tier. A tick turns a guess into a fact.</p></div></div>`,
 steps:[{say:"Why are these boxes here? Our parent center grant reports to the U.S. Department of Education on a form called the 524B Status Chart. It counts what we did, measure by measure.",act:async()=>{await show(q('.k-s1'))}},
 {say:"When you tick a box, the 524B Status Chart in the PTI Report counts that event toward exactly the measures you ticked, and nothing else.",act:async()=>{await show(q('.k-a1'),300);await show(q('.k-s2'))}},
 {say:"With no box ticked, the chart has to guess from the event title and its tier. So a tick turns a guess into a fact, and our numbers come out right.",act:async()=>{await show(q('.k-a2'),300);await show(q('.k-s3'));spot(q('.k-s3'),4)}}]},

// ================= 3. WHERE: EVENT SUMMARY =================
{html:()=>HEAD('Where you see them','On the Event Summary')+PINK(58,118,712,`<div class="rb-field"><small>Tier Model of Support</small>Tier 2: Training Workspaces</div><div class="rb-field"><small>Follow Up Support</small>Asked for follow up</div>`)+PTS([
 'Open the event, then press <b>Summary</b>. Or <b>Edit Summary</b> from the Event Attendance Report.',
 'They are in the pink <b>Staff report</b> part, under <b>Tier</b> and <b>Follow Up Support</b>.',
 'A repeating event? <b>Pick the session date first</b>. Each session keeps its own ticks.']),
 steps:[{say:"Where are they? First, on the Event Summary. Open the event and press Summary, or press Edit Summary from the Event Attendance Report.",li:0,act:async()=>{await show(q('.k-pink'))}},
 {say:"The boxes are in the pink Staff report part of the form, under Tier Model of Support and Follow Up Support. The heading says 524B measures.",li:1,act:async()=>{spot(q('.k-pink .rb-grid'),6)}},
 {say:"If the event repeats, like a monthly series, pick the session date first. Each session keeps its own ticks.",li:2,act:async()=>{spot(null)}}]},

// ================= 4. WHERE: ONE-OFF =================
{html:()=>HEAD('Where you see them','On the One-Off Event form')+`<div class="rb-pink k-pink" style="left:58px;top:118px;width:712px"><div class="t">Add One-Off Event</div>
 <div class="rb-field"><small>Event name</small>Back to school resource fair</div><div class="rb-field"><small>Grant / Program</small>HI PTI</div>
 <h4>524B measures</h4><p class="hlp">Tick what this counts toward on the 524B Status Chart. With none ticked, the chart decides from the title and tier.</p>${BOXES()}</div>`+PTS([
 'Reports &rarr; <b>Event Attendance Report</b> &rarr; <b>+ Add One-Off Event</b>.',
 'Same 16 boxes, under <b>Grant / Program</b>.',
 '<b>Pacific partners</b>: this is where you will see them most. Most partner activity is entered here.']),
 steps:[{say:"Second, on the One-Off Event form. Go to Reports, then the Event Attendance Report, then Add One-Off Event. Editing a one-off event opens the same form.",li:0,act:async()=>{await show(q('.k-pink'))}},
 {say:"It has the same 16 boxes, under Grant and Program.",li:1,act:async()=>{spot(q('.k-pink .rb-grid'),6)}},
 {say:"Pacific partners, this is where you will see them most, because most partner activity is entered as a one-off event. The boxes and their meanings are the same for everyone. Your ticks count on your own Pacific chart.",li:2,act:async()=>{spot(null)}}]},

// ================= 5. HOW TO TICK =================
{html:()=>HEAD('How to tick','Three simple rules')+`<div class="rb-card ok k-r1" style="left:70px;top:140px;width:360px;height:330px"><h4>Tick all that fit</h4><p>An event can count for more than one measure. A transition workshop you ran <b>with</b> a partner school is <b>2.b</b> and <b>1.a</b>.</p></div>
 <div class="rb-card info k-r2" style="left:460px;top:140px;width:360px;height:330px"><h4>None fit? Leave them empty</h4><p>The boxes are <b>never required</b>. Empty is fine: the chart then decides from the title and tier, like before.</p></div>
 <div class="rb-card warn k-r3" style="left:850px;top:140px;width:360px;height:330px"><h4>Don&rsquo;t tick to be safe</h4><p>A ticked event counts toward <b>only</b> what is ticked. A wrong tick moves it to the wrong measure. If you are not sure, leave it empty.</p></div>`,
 steps:[{say:"Three simple rules. One: tick all that fit. An event can count for more than one measure. A transition workshop you ran with a partner school is both [2.b|2 B] and [1.a|1 A].",act:async()=>{await show(q('.k-r1'))}},
 {say:"Two: if none fit, leave them all empty. The boxes are never required, and the chart then decides from the title and tier, like before.",act:async()=>{await show(q('.k-r2'))}},
 {say:"Three: don’t tick just to be safe. A ticked event counts toward only what is ticked, so a wrong tick moves it to the wrong measure. If you are not sure, leave it empty.",act:async()=>{await show(q('.k-r3'));spot(q('.k-r3'),4)}}]},

// ================= 6. GROUP 1 =================
{html:()=>HEAD('The boxes, group by group','1 · Working with other organizations')+`
 <div class="rb-card k-g1" style="left:70px;top:140px;width:1140px"><p><span class="code">1.a</span><b>Co-sponsored event.</b> We <b>hosted it together</b> with another organization: a school, an agency, another nonprofit. Both names are on it.</p></div>
 <div class="rb-card k-g2" style="left:70px;top:262px;width:1140px"><p><span class="code">1.b</span><b>Co-presentation.</b> We <b>presented together</b> with someone from another organization, or we presented at <b>their</b> event. The chart counts the sessions.</p></div>
 <div class="rb-card k-g3" style="left:70px;top:384px;width:1140px"><p><span class="code">1.c</span><b>Materials at a collaborative event.</b> We <b>handed out our materials</b> at an event run with or by others, like a <b>booth</b> at a resource fair.</p></div>
 <div class="rb-card info k-g4" style="left:70px;top:520px;width:1140px"><p>The chart only counts <b>1.a</b> and <b>1.b</b> when they are <b>ticked</b>. It can&rsquo;t tell from a title that an event was shared.</p></div>`,
 steps:[{say:"Now the boxes, group by group. Group 1 is about working with other organizations.",act:async()=>{}},
 {say:"[1.a|1 A], Co-sponsored event. We hosted it together with another organization, like a school, an agency, or another nonprofit.",act:async()=>{await show(q('.k-g1'))}},
 {say:"[1.b|1 B], Co-presentation. We presented together with someone from another organization, or we presented at their event.",act:async()=>{await show(q('.k-g2'))}},
 {say:"[1.c|1 C], Materials at a collaborative event. We handed out our materials at an event run with or by others, like a booth at a resource fair.",act:async()=>{await show(q('.k-g3'))}},
 {say:"Important: the chart only counts [1.a|1 A] and [1.b|1 B] when they are ticked. It can’t tell from a title that an event was shared, so these two are the ones to remember.",act:async()=>{await show(q('.k-g4'));spot(q('.k-g4'),4)}}]},

// ================= 7. GROUPS 2 + 3 =================
{html:()=>HEAD('The boxes, group by group','2 · Parent workshops, 3 · Parent programs')+`
 <div class="rb-card k-a" style="left:70px;top:140px;width:550px;height:420px"><h4>2 · Workshops for parents</h4>
  <p><span class="code">2.a</span><b>IDEA / IEP / rights workshop.</b> Teaches parents their rights: IDEA, the IEP, 504, how to disagree.</p>
  <p><span class="code">2.b</span><b>Transition workshop.</b> Life after high school: transition planning, adult services, work, college.</p>
  <p><span class="code">2.c</span><b>Workshop materials.</b> Handouts and packets from these workshops. The chart counts how many went out.</p></div>
 <div class="rb-card k-b" style="left:660px;top:140px;width:550px;height:420px"><h4>3 · Our parent programs</h4>

// ================= 13. MEETING TYPES EXPLAINED =================
{html:()=>HEAD('What kind of meeting?','The nine choices')+`
 <div class="rb-card p k-m1" style="left:70px;top:132px;width:550px;height:470px">
  <p><b>IFSP / IEP / 504 meeting</b>: a plan meeting. Only the <b>IFSP</b> is for birth to age 3. An <b>IEP</b> or <b>504</b> meeting is not limited to that age.</p>
  <p><b>Transition IEP meeting</b>: an IEP meeting about life after high school.</p>
  <p><b>Facilitated IEP meeting</b>: an IEP meeting run by a neutral facilitator.</p>
  <p><b>Student-led IEP meeting</b>: the student runs their own IEP meeting.</p>
  <p><b>Suspension / expulsion hearing</b>: the school wants to remove the student.</p></div>
 <div class="rb-card warn k-m2" style="left:660px;top:132px;width:550px;height:470px"><h4>Formal disputes</h4>
  <p><b>Manifestation determination hearing</b>: decides whether a behavior was caused by the child&rsquo;s disability, before a long suspension.</p>
  <p><b>Mediation</b>: the family and school meet with a neutral mediator to settle a disagreement.</p>
  <p><b>Resolution session</b>: the meeting the school must hold after a family files for due process.</p>
  <p><b>Due process hearing</b>: a formal hearing before a hearing officer.</p></div>`,
 steps:[{say:"Here is what the nine choices mean. An IFSP, IEP or 504 meeting is a plan meeting. Only the IFSP is for birth to age 3. An IEP or 504 meeting is not limited to that age. A transition IEP is about life after high school. A facilitated IEP is run by a neutral facilitator. A student-led IEP is run by the student. And a suspension or expulsion hearing is when the school wants to remove the student.",act:async()=>{await show(q('.k-m1'));spot(q('.k-m1'),4)}},
 {say:"The other four are formal disputes. A manifestation determination hearing decides whether a behavior was caused by the child’s disability. Mediation is a meeting with a neutral mediator. A resolution session is the meeting the school must hold after a family files for due process. And a due process hearing is the formal hearing itself.",act:async()=>{spot(null);await show(q('.k-m2'));spot(q('.k-m2'),4)}}]},
