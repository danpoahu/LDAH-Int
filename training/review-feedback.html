<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reviewing Feedback — Training</title>
<link rel="stylesheet" href="deck-base.css">
<style>
/* ---- Event Summary modal chrome (same builder approach as completing-the-event-summary.html) ---- */
.esm{width:700px;background:#fff;border-radius:14px;box-shadow:0 20px 50px rgba(15,23,42,.3);overflow:hidden;font-size:13px}
.esh{display:flex;align-items:center;gap:10px;padding:13px 16px;background:linear-gradient(135deg,#0891B2,#06B6D4);color:#fff}
.esh .lg{width:26px;height:26px;border-radius:7px;background:rgba(255,255,255,.28);flex:none}
.esh b{font-weight:800;font-size:16px;margin-right:auto}
.esh .x{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.18);text-align:center;line-height:30px;font-size:19px}
.esb{padding:14px 18px}
/* ---- the GREEN Feedback band ---- */
.bg2{background:#F0FDF4;border:1px solid #BBF7D0;border-left:4px solid #16A34A;border-radius:10px;padding:4px 16px 16px;margin:0}
.stt{font-weight:700;font-size:14.5px;padding:12px 0 6px;margin-bottom:12px;border-bottom:1px solid #BBF7D0;color:#166534}
.stt .nt{font-size:11.5px;font-weight:500;color:#64748B}
/* per-question cards */
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.fgrid.three{grid-template-columns:repeat(3,1fr)}
.fgrid.two{grid-template-columns:repeat(2,1fr)}
.fcard{background:#fff;border:1px solid #BBF7D0;border-radius:9px;padding:9px 11px;opacity:0}
.fcard h4{margin:0 0 6px;font-size:12.5px;color:#166534;font-weight:800;line-height:1.25}
.frw{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:#475569;padding:2px 0}
.frw b{color:#0F172A}
.fgrid.big .fcard{padding:14px 16px}
.fgrid.big .fcard h4{font-size:16px;margin-bottom:9px}
.fgrid.big .frw{font-size:14px;padding:4px 0}
.sechd{font-weight:700;font-size:14px;color:#92400E;margin:0 0 8px}
.cmt{background:#F8FAFC;border-left:3px solid #86EFAC;border-radius:0 6px 6px 0;padding:6px 10px;font-size:11.5px;color:#334155;margin-bottom:5px;line-height:1.4}
.more{font-size:11px;color:#64748B;text-align:center;margin-top:4px}
.fnone{font-size:12.5px;color:#64748B;font-style:italic}
.emptyb{background:#F8FAFC;border:1px solid #E2E8F0;border-radius:8px;padding:12px;font-size:13px;color:#64748B;font-style:italic;opacity:0}
/* ---- Follow-Up Support Requested ---- */
.fuh{font-weight:700;font-size:16px;color:#9A3412;margin:0 0 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fchip{background:#FED7AA;color:#9A3412;padding:3px 12px;border-radius:12px;font-size:13px;font-weight:700}
.fsplit{font-size:13px;font-weight:500;color:#64748B}
.fubox{background:#FFF7ED;border:1px solid #FED7AA;border-radius:10px;padding:11px 13px}
.fue{background:#fff;border-left:3px solid #FDBA74;border-radius:0 7px 7px 0;padding:9px 12px;margin-bottom:8px;font-size:12.5px}
.fue:last-child{margin-bottom:0}
.fue b{font-size:13.5px;color:#0F172A}
.ftag{display:inline-block;background:#DBEAFE;color:#1E40AF;padding:1px 9px;border-radius:9px;font-size:10.5px;font-weight:800;margin-left:7px;vertical-align:1px}
.ftag.pro{background:#E0E7FF;color:#3730A3}
.fdet{margin-top:5px;color:#334155;line-height:1.4}
.fdet.no{color:#64748B;font-style:italic}
/* ---- rose staff inputs (the pink band) ---- */
.bp{background:#FFF5F7;border:1px solid #FBCFE8;border-left:4px solid #DB2777;border-radius:10px;padding:4px 16px 16px}
.bp .stt{color:#9D174D;border-bottom-color:#FBCFE8}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.fg2 label{display:block;font-size:12px;font-weight:600;color:#475569;margin-bottom:4px}
.fld{display:block;border:1px solid #CBD5E1;border-radius:8px;background:#fff;padding:7px 12px;font-size:13px;min-height:31px}
.fh{font-size:11px;color:#64748B;margin-top:4px}
.fh.ov{color:#9A3412;font-weight:700}
/* ---- the auto-made interaction, as it lands in My Day ---- */
.itc{background:#fff;border:1px solid rgba(8,145,178,.12);border-left:4px solid #F97316;border-radius:12px;padding:14px 18px;box-shadow:0 8px 24px rgba(2,132,199,.12);opacity:0}
.itc .ttl{font-weight:700;font-size:16px;color:#1E293B;line-height:1.35}
.itc .nt2{font-size:13px;color:#475569;margin-top:7px;font-style:italic}
.tg3{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.tg3 span{font-size:11px;font-weight:800;border-radius:999px;padding:4px 11px;background:#F1F5F9;color:#334155;letter-spacing:.03em}
.tg3 span.ch{background:#DBEAFE;color:#1E3A8A}
.tg3 span.op{background:#DCFCE7;color:#166534}
.tg3 span.due{background:#FED7AA;color:#9A3412}
/* ---- contact card + per-contact feedback modal ---- */
.cth{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 20px;box-shadow:0 8px 24px rgba(15,23,42,.08)}
.cth b{font-size:20px;color:var(--deep)}
.cth small{font-size:13px;color:#64748B}
.cpill{background:#16A34A;color:#fff;font-size:13px;font-weight:700;border-radius:999px;padding:5px 15px;margin-left:auto}
.cfm{width:690px;background:#fff;border-radius:14px;box-shadow:0 20px 50px rgba(15,23,42,.3);overflow:hidden}
.cfh{background:linear-gradient(135deg,#0891B2,#06B6D4);color:#fff;padding:12px 16px;font-weight:800;font-size:16px;display:flex;align-items:center}
.cfh .x{margin-left:auto;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.2);text-align:center;line-height:28px;font-size:18px;font-weight:400}
.cfb{padding:12px 16px}
.cfb .cnt{font-size:11.5px;color:#64748B;margin-bottom:10px}
.evh{background:#1a3c6e;color:#fff;padding:9px 13px;border-radius:9px 9px 0 0}
.evh b{font-size:13.5px}.evh small{display:block;font-size:11px;color:#CBD5E1;margin-top:2px}
.qal{border:1px solid #E2E8F0;border-top:0;border-radius:0 0 9px 9px;background:#FAFBFC;padding:11px 13px;display:grid;grid-template-columns:1fr 1fr;gap:8px 18px}
.qa label{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:#64748B;font-weight:700}
.qa span{font-size:12px;color:#0F172A}
.qa span.na{color:#9CA3AF;font-style:italic}
.qa.w{grid-column:1/-1}
.qa.w span{display:block;background:#fff;border-left:3px solid #1a3c6e;border-radius:0 6px 6px 0;padding:5px 9px;margin-top:3px}
/* ---- the two rating vocabularies ---- */
.voc{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.voc>div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 24px;box-shadow:0 8px 24px rgba(15,23,42,.08);opacity:0}
.voc h4{margin:0 0 3px;font-size:22px;color:var(--teal)}
.voc .w{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#94A3B8;margin-bottom:13px}
.voc .opt{display:flex;align-items:center;gap:12px;font-size:18px;color:var(--soft);padding:8px 0}
.voc .opt i{width:12px;height:12px;border-radius:50%;background:var(--teal2);flex:none;font-style:normal}
.voc .opt.mut{color:#94A3B8}.voc .opt.mut i{background:#CBD5E1}
/* ---- reminder schedule preview ---- */
.rsch{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 20px;box-shadow:0 8px 24px rgba(15,23,42,.08)}
.rsch h3{margin:0;font-size:17px;color:#0F172A}
.rsch p{margin:5px 0 10px;font-size:12.5px;color:#64748B;line-height:1.4}
.rrow{display:flex;align-items:center;gap:10px;border-top:1px solid #F1F5F9;padding:9px 0;font-size:13px;color:#334155}
.rrow .w8{margin-left:auto;background:#FEF3C7;color:#92400E;font-weight:700;font-size:11.5px;border-radius:8px;padding:3px 11px}
.nosend{background:#fff;border:2px dashed #CBD5E1;border-radius:12px;padding:16px 20px;text-align:center;font-size:15px;color:#94A3B8;font-style:italic}
/* ---- the blocking alert ---- */
.alrt{width:440px;background:#F8FAFC;border:1px solid #CBD5E1;border-radius:12px;box-shadow:0 24px 60px rgba(15,23,42,.38);padding:17px 20px;font-size:13.5px;color:#0F172A;line-height:1.55;opacity:0}
.alrt b{display:block;font-size:15px;margin-bottom:8px}
.alrt .okb{display:block;margin:14px auto 0;width:118px;text-align:center;background:#2563EB;color:#fff;font-weight:700;border-radius:8px;padding:8px 0;font-size:13px}
/* ---- numbered name cards ---- */
.ncs{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.nc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:0 8px 24px rgba(15,23,42,.08);opacity:0}
.nc i{display:block;width:34px;height:34px;border-radius:50%;background:var(--teal2);color:#fff;font-style:normal;font-weight:800;font-size:17px;text-align:center;line-height:34px;margin-bottom:11px}
.nc b{display:block;font-size:19px;color:var(--deep);margin-bottom:5px}
.nc em{display:block;font-style:normal;font-size:12.5px;color:#9D174D;font-weight:800;letter-spacing:.03em;margin-bottom:9px}
.nc p{margin:0;font-size:14px;color:var(--soft);line-height:1.45}
.kn{position:absolute;left:58px;top:556px;width:1170px;background:#FFFBEB;border:1px solid #FDE68A;border-radius:10px;padding:13px 18px;font-size:15px;color:#78350F;line-height:1.45;opacity:0}
</style></head><body>
<div id="view"><div id="stage"><div id="nbar"><i></i></div>
<div id="scenes"></div>
<div id="spot"></div>
<svg id="cursor" viewBox="0 0 28 32"><path d="M3 2 L3 26 L9.5 19.5 L14 29 L18.5 27 L14 17.5 L23 17.5 Z" fill="#fff" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/></svg>
</div></div>
<div id="cap" aria-live="polite"></div>
<div id="bar">
 <button id="prev">Back</button><button id="play">Start</button><button id="next">Next</button>
 <div id="dots"></div>
 <button id="capbtn" aria-pressed="false">Captions</button><button id="voice" aria-pressed="true">Voice on</button>
</div>
<script src="deck-mocks.js"></script>
<script>
const DECK_ID='review-feedback-2026-09';

/* ---------- mock builders: the real screens, drawn in CSS ---------- */
const ESH=(t)=>`<div class="esh"><span class="lg"></span><b>Event Summary: ${t}</b><span class="x">&times;</span></div>`;

/* the four stat tiles of the green band */
const FBAND=(sent,pend,comp,rate)=>`<div class="bg2"><div class="stt">Feedback Summary</div>
 <div class="stats"><div class="st b"><b class="fs">${sent}</b>Sent</div><div class="st a"><b class="fp">${pend}</b>Reminders Pending</div><div class="st g"><b class="fc">${comp}</b>Complete</div><div class="st p"><b class="fr">${rate}</b>Response Rate</div></div></div>`;

const CARD=(title,rows,cls)=>`<div class="fcard ${cls||''}"><h4>${title}</h4>${rows.map(([l,n])=>`<div class="frw"><span>${l}</span><b>${n}</b></div>`).join('')}</div>`;

const HELPFUL=[['Very Helpful',7],['Helpful',2],['No Answer',0]];
const YESNO=(a,b,c)=>[['Yes',a],['To some extent',b],['No',c]];

const Q7=()=>`<div class="fgrid big">
 ${CARD('Participation',[['Virtual',5],['In Person',4]],'k0')}
 ${CARD('Presenter',HELPFUL,'k1')}
 ${CARD('Handouts',[['Very Helpful',6],['Helpful',3],['No Answer',0]],'k2')}
 ${CARD('Increased My Knowledge',YESNO(8,1,0),'k3')}
 ${CARD('Relevant to Child&rsquo;s Needs',YESNO(7,2,0),'k4')}
 ${CARD('Useful to Me',YESNO(9,0,0),'k5')}
 ${CARD('Overall Satisfied',YESNO(9,0,0),'k6')}</div>`;

const PRIOR=()=>`<div class="sechd">Prior-Attendee Impact</div><div class="fgrid two">
 ${CARD('Child received more appropriate services',YESNO(4,2,1),'p0')}
 ${CARD('Shared info with other families',YESNO(6,1,0),'p1')}
 ${CARD('Worked with child&rsquo;s school on critical need',YESNO(3,3,1),'p2')}
 ${CARD('Resolved disagreement with school',YESNO(2,2,3),'p3')}</div>`;

const OPEN=()=>`<div class="sechd" style="color:#166534;margin-top:14px">Open-Ended Responses</div><div class="fgrid two">
 <div class="fcard o0" style="opacity:1"><h4>Liked Best</h4>
  <div class="cmt">The break-out time with other parents.</div>
  <div class="cmt">Plain language. No jargon.</div>
  <div class="cmt">Having the handouts to take home.</div>
  <div class="cmt">It started and finished on time.</div>
  <div class="cmt">Somebody finally explained the timelines.</div>
  <div class="more">+ 3 more</div></div>
 <div class="fcard o1" style="opacity:1"><h4>Improvement Suggestions</h4>
  <div class="cmt">A little longer for questions.</div>
  <div class="cmt">Please repeat this one on a weekend.</div>
  <div class="cmt">The room was hard to find.</div>
  <div class="more">+ 1 more</div></div></div>`;

const FUBLOCK=(empty)=>`<div class="fuh">Follow-Up Support Requested <span class="fchip">2 of 9</span>${empty?'':'<span class="fsplit">(2 parents, 0 professionals)</span>'}</div>
 ${empty?'<div class="fnone">No follow-up support requested.</div>':`<div class="fubox">
 <div class="fue e0"><b>Kalani Example</b><span class="ftag">Parent</span><div class="fdet">Needs help preparing for the IEP meeting next month.</div></div>
 <div class="fue e1"><b>Mele Sample</b><span class="ftag">Parent</span><div class="fdet no">(no detail provided)</div></div></div>`}`;

const ROSE=()=>`<div class="bp"><div class="stt">Staff Report (Pink Form)</div>
 <div class="fg2">
  <div><label>Follow Up Support -- Parents</label><span class="fld fup">2</span><div class="fh hp">Auto from survey: 2</div></div>
  <div><label>Follow Up Support -- Professionals</label><span class="fld fupr">0</span><div class="fh">Auto from survey: 0</div></div>
 </div></div>`;

const QROWS=[['Participation mode','In Person'],['Presenter rating','Very Helpful'],['Handouts rating','Helpful'],
 ['Did this session increase your knowledge?','Yes'],['Relevant to your child?','Yes'],['Useful to me?','Yes'],
 ['Overall satisfaction','Yes'],['Prior-impact: services received','To some extent'],['Prior-impact: shared with others','Yes'],
 ['Prior-impact: school relationship','Yes'],['Prior-impact: helped resolve concerns','']];

const CFMODAL=()=>`<div class="cfm"><div class="cfh">Feedback from Kalani Example<span class="x">&times;</span></div>
 <div class="cfb"><div class="cnt">3 responses, newest first.</div>
  <div class="evh"><b>Parent Talk Cafe</b><small>Session: 2026-09-18 &middot; submitted Sep 19, 2026 8:12 AM</small></div>
  <div class="qal">${QROWS.map(([l,v],i)=>`<div class="qa q${i}"><label>${l}</label>${v?`<span>${v}</span>`:'<span class="na">(no answer)</span>'}</div>`).join('')}
   <div class="qa w q11"><label>What did you like best?</label><span>The break-out time with other parents.</span></div>
   <div class="qa w q12"><label>What would you improve?</label><span class="na">(no answer)</span></div></div></div></div>`;

const WIN=()=>ldahSignupsWindow({title:'Parent Talk Cafe',sub:'Workshop &middot; 2 session dates',
 summary:[['17','Signed up'],['14','Confirmed'],['3','Pending'],['14','Attended']],banner:null,
 blocks:[ldahSessionBlock({label:'For Friday, 2026-09-18 — 10:00 AM - 12:00 PM @ Oahu',cls:'b0',state:'past',rows:[
  ldahSignupRow('Kalani Example','kalani@example.com','ok'),
  ldahSignupRow('Mele Sample','mele.sample@example.com','ok'),
  ldahSignupRow('Noa Testperson','noa@example.org','ok')]})]});

const STAMP=async(txt,left,top,size)=>{const s=add(`<div class="stamp" style="left:${left}px;top:${top}px;font-size:${size||26}px">${txt}</div>`);
 await anim(s,[{opacity:0,transform:'rotate(-14deg) scale(3)'},{opacity:1,transform:'rotate(-14deg) scale(1)'}],450,'cubic-bezier(.5,0,.8,.6)');return s};

/* ---------- scenes ---------- */
const SC=[
{cls:'cover',html:()=>`<div class="brand">Leadership in Disabilities &amp; Achievement of Hawai&#699;i</div><div class="hello">Aloha <span class="nm"></span></div>
 <h1>Reviewing feedback</h1><p class="sub">What families told us after a session, where to read it, and the one thing you must not do twice. About six minutes.</p>
 <div class="abs cvm" style="left:735px;top:135px;transform:scale(.62) rotate(3deg);transform-origin:top left;animation:bob 5s ease-in-out infinite">
  <div class="esm">${ESH('Parent Talk Cafe')}<div class="esb">${FBAND(14,5,9,'64%')}</div></div></div>
 <div class="spark" style="left:1190px;top:112px">${SPARK}</div><div class="spark" style="left:700px;top:462px;animation-delay:1s">${SPARK}</div>
 <div class="gate"><button class="btn" data-go="start">Start training</button><button class="btn ghost" data-go="skip">Skip for now</button><label><input type="checkbox" id="voiceChk" checked> Read it out loud to me</label></div>${WAVES}`,
 steps:[{say:'Aloha {name}! After every session, families tell us what they thought. This is where that lands, how to read it, and the one thing you must not do twice.'}]},

{html:()=>HEAD('First','There is no button called Review Feedback')+`<div class="abs" style="left:58px;top:148px;width:1170px"><div class="ncs">
 <div class="nc n0"><i>1</i><em>FEEDBACK SUMMARY</em><b>The green band</b><p>Inside the Event Summary. The numbers, added up for one session date.</p></div>
 <div class="nc n1"><i>2</i><em>FEEDBACK DETAIL REPORT</em><b>A Reports tile</b><p>Every response we have ever had, grouped by event and session date.</p></div>
 <div class="nc n2"><i>3</i><em>FEEDBACK FROM &lt;NAME&gt;</em><b>One family</b><p>A window on the contact card. Everything that person has ever told us.</p></div></div></div>
 <div class="kn"><b>This is why you cannot find it.</b> The training video calls this <b>Review Feedback</b>. Nothing in the dashboard is labelled that, so searching for it turns up nothing.</div>`,steps:[
 {say:'Before anything else, the names. Feedback lives in three places, and each one has its own name.',act:async()=>{for(const n of document.querySelectorAll('.scene.on .nc')){await anim(n,[{opacity:0,transform:'translateY(40px)'},{opacity:1,transform:'none'}],400)}}},
 {say:'Feedback Summary. That is the green band inside the Event Summary — the numbers added up for one session date.',act:async()=>{spot(q('.n0'),8);await wait(1500)}},
 {say:'Feedback Detail Report. A tile on the Reports page, holding every response we have ever had.',act:async()=>{spot(q('.n1'),8);await wait(1500)}},
 {say:'And Feedback from, then a person’s name. That is a window on their contact card, for one family at a time.',act:async()=>{spot(q('.n2'),8);await wait(1600);spot(null)}},
 {say:'The old training video calls all of this Review Feedback. Nothing in the dashboard is labelled that. Search for it and you will find nothing — so learn these three names instead.',act:async()=>{await anim(q('.kn'),[{opacity:0,transform:'translateY(20px)'},{opacity:1,transform:'none'}],500);await STAMP('NO SUCH BUTTON',430,250,28);await wait(1500)}}]},

{html:()=>HEAD('Route one','Events &amp; Programs &rarr; View Signups &rarr; Summary')+`<div class="abs" style="left:58px;top:128px;width:1170px">
 <div class="crumb">CMS &rarr; Content Management &rarr; <b>Events &amp; Programs</b></div>
 ${ldahEventCards([['Parent Talk Cafe','linear-gradient(135deg,#C2410C,#FB923C)'],['Connect-Gen','linear-gradient(135deg,#166534,#4ADE80)'],['Diploma vs. Certificate','linear-gradient(135deg,#1D4ED8,#F59E0B)']])}</div>`,steps:[
 {say:'The first route starts where you already go. The CMS tab, Content Management, Events and Programs.',act:async()=>{spot(q('.crumb'),6);for(const c of document.querySelectorAll('.scene.on .evc')){await anim(c,[{opacity:0,transform:'translateY(40px)'},{opacity:1,transform:'none'}],400)}spot(null)}},
 {say:'Find the event, and press View Signups.',act:async()=>{const v=q('.c0 .vs');spot(q('.c0'),6);place(700,650,0);await move(v,950);await click(v);await wait(300);spot(null)}},
 {say:'The signups window opens. Along the top of it are four buttons, and the last one is the one you want.',act:async()=>{hideCursor();const m=add(`<div class="abs mw" style="left:265px;top:126px;transform:scale(.78);transform-origin:top left">${WIN()}</div>`);await anim(m,[{opacity:0,transform:'scale(.6)'},{opacity:1,transform:'scale(.78)'}],500);spot(q('.sum'),5);await wait(1400)}},
 {say:'Summary. That opens the Event Summary, and the feedback is in the green band partway down it.',act:async()=>{const s=q('.sum');place(560,660,0);await move(s,850);await click(s);await wait(400);spot(null);hideCursor()}}]},

{html:()=>HEAD('The green band','Feedback Summary &mdash; four tiles')+`<div class="abs" style="left:58px;top:150px">
 <div class="esm">${ESH('Parent Talk Cafe')}<div class="esb">${FBAND(0,0,0,'0%')}</div></div></div>
 <div class="abs" style="left:790px;top:158px;width:440px"><ul class="pts"><li>Four tiles: <b>Sent</b>, <b>Reminders Pending</b>, <b>Complete</b>, <b>Response Rate</b>.</li><li><b>Sent</b> is really the <b>attendee count</b> — only attendees are ever emailed.</li><li><b>Reminders Pending</b> is just <b>attended minus complete</b>.</li><li>They are arithmetic. <b>Nothing is queued up.</b></li></ul></div>`,steps:[
 {say:'Here is the green band. Feedback Summary, with four tiles across the top.',li:0,act:async()=>{spot(q('.stats'),6);await wait(900)}},
 {say:'Sent, reminders pending, complete, and the response rate.',li:0,act:async()=>{await countTo(q('.fs'),14);await countTo(q('.fp'),5);await countTo(q('.fc'),9);await countTo(q('.fr'),64,'%')}},
 {say:'Sent is not a count of emails that went out. It is simply how many people attended, because only attendees are ever emailed.',li:1,act:async()=>{spot(q('.fs').parentElement,5);await wait(2000)}},
 {say:'And Reminders Pending is not a queue. It is attended minus complete — a subtraction, worked out fresh every time you open the form. Five pending does not mean five reminders are waiting to go.',li:3,act:async()=>{spot(q('.fp').parentElement,5);await wait(800);await STAMP('ARITHMETIC, NOT A QUEUE',270,330,24);await wait(1700);spot(null)}}]},

{html:()=>HEAD('Below the tiles','One card per question, always this order')+`<div class="abs" style="left:58px;top:140px;width:1170px">${Q7()}</div>`,steps:[
 {say:'Underneath the tiles you get one card per question. Seven of them, and they always come in the same order.',act:async()=>{for(const c of document.querySelectorAll('.scene.on .fcard')){await anim(c,[{opacity:0,transform:'translateY(26px)'},{opacity:1,transform:'none'}],280)}}},
 {say:'Participation is not a rating at all. It only says how they joined — virtual, or in person.',act:async()=>{spot(q('.k0'),6);await wait(1600)}},
 {say:'Presenter and Handouts ask how helpful it was.',act:async()=>{spot(q('.k1'),6);await wait(1100);spot(q('.k2'),6);await wait(1100)}},
 {say:'And the last four are the ones our grants are built on. Increased my knowledge, relevant to my child’s needs, useful to me, overall satisfied.',act:async()=>{for(const s of ['.k3','.k4','.k5','.k6']){spot(q(s),6);await wait(900)}spot(null)}}]},

{html:()=>HEAD('Careful','There is no one-to-five scale')+`<div class="abs" style="left:58px;top:150px;width:1170px"><div class="voc">
 <div class="v0"><div class="w">Presenter &amp; Handouts only</div><h4>How helpful was it?</h4>
  <div class="opt"><i></i>Very Helpful</div><div class="opt"><i></i>Helpful</div><div class="opt mut"><i></i>No Answer</div></div>
 <div class="v1"><div class="w">Every other rated question</div><h4>Did it do the job?</h4>
  <div class="opt"><i></i>Yes</div><div class="opt"><i></i>To some extent</div><div class="opt"><i></i>No</div></div></div></div>`,steps:[
 {say:'Now, the wording. There are only two vocabularies on this survey, and neither one is a number.',act:async()=>{for(const s of ['.v0','.v1']){await anim(q(s),[{opacity:0,transform:'translateY(30px)'},{opacity:1,transform:'none'}],450)}}},
 {say:'Presenter and Handouts are the only two rated for helpfulness. Very Helpful, Helpful, or No Answer.',act:async()=>{spot(q('.v0'),8);await wait(2000)}},
 {say:'Everything else is answered Yes, To some extent, or No. That is the whole vocabulary.',act:async()=>{spot(q('.v1'),8);await wait(1900);spot(null)}},
 {say:'So do not go looking for stars, or a score out of five, or the words Strongly Agree. They are not on this form, and a report that quotes them is not quoting us.',act:async()=>{await STAMP('NO 1&ndash;5 SCALE',450,300,28);await wait(1700)}}]},

{html:()=>HEAD('Further down','Prior impact, then what they wrote')+`<div class="abs" style="left:58px;top:136px;width:706px">${PRIOR()}${OPEN()}</div>
 <div class="abs" style="left:790px;top:158px;width:440px"><ul class="pts"><li><b>Prior-Attendee Impact</b> — four questions, only shown if somebody answered them.</li><li><b>Open-Ended Responses</b> — Liked Best, and Improvement Suggestions.</li><li>Only the <b>5 most recent</b> show. The rest hide behind <b>+ N more</b>.</li><li>Comments are <b>anonymous here</b> — no name is printed beside them.</li><li>No responses at all reads <b>No feedback responses yet.</b></li></ul></div>`,steps:[
 {say:'Keep going and you reach a second group, headed Prior-Attendee Impact.',li:0,act:async()=>{spot(q('.sechd'),5);await wait(1100);for(const s of ['.p0','.p1','.p2','.p3']){await anim(q(s),[{opacity:0,transform:'translateY(22px)'},{opacity:1,transform:'none'}],260)}spot(null)}},
 {say:'Four questions, asked only of people who had been to us before. Did the child get better services, did they share what they learned, did they work with the school, did a disagreement get resolved. This whole group disappears if nobody answered it.',li:0,act:async()=>{await wait(1200)}},
 {say:'Then Open-Ended Responses. What they liked best, and what they would improve, in their own words.',li:1,act:async()=>{spot(q('.o0'),6);await wait(1300);spot(q('.o1'),6);await wait(1300);spot(null)}},
 {say:'Only the five most recent comments are printed. If there are more, you get a plus-N-more line instead — and to read those you need the Feedback Detail Report.',li:2,act:async()=>{spot(q('.o0 .more'),6);await wait(1800);spot(null)}},
 {say:'And note the comments here carry no names. On this band they are anonymous. If nothing has come back at all, the whole section is replaced by one line: no feedback responses yet.',li:4,act:async()=>{const e=add('<div class="emptyb abs" style="left:58px;top:600px;width:706px">No feedback responses yet.</div>');await anim(e,[{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],420);await wait(1300)}}]},

{html:()=>HEAD('The part you act on','Follow-Up Support Requested')+`<div class="abs fuw" style="left:58px;top:146px;width:706px">${FUBLOCK(0)}</div>
 <div class="abs" style="left:790px;top:158px;width:440px"><ul class="pts"><li>Its heading is <b>rust-coloured</b>, so it stands out from the green.</li><li>The amber chip reads <b>&lt;n&gt; of &lt;m&gt;</b> — asked, out of replied.</li><li>Then the split: <b>parents</b> and <b>professionals</b>.</li><li>One row per person: <b>name</b>, a <b>role tag</b>, and what they asked for.</li><li>Nothing asked? <b>No follow-up support requested.</b></li></ul></div>`,steps:[
 {say:'Below the comments comes the one block you actually act on. Follow-Up Support Requested.',li:0,act:async()=>{spot(q('.fuh'),6);await wait(1400)}},
 {say:'The amber chip is two numbers. Two of nine — two people asked for follow-up, out of the nine who replied at all.',li:1,act:async()=>{spot(q('.fchip'),5);await wait(1800)}},
 {say:'Beside it, how those split between parents and professionals. That split is what fills the staff boxes further down the form.',li:2,act:async()=>{spot(q('.fsplit'),5);await wait(1700)}},
 {say:'Then one row per person. Their name, a tag saying whether they are a parent or a professional, and underneath, what they asked for in their own words.',li:3,act:async()=>{spot(q('.e0'),5);await wait(1900)}},
 {say:'If they ticked the box but wrote nothing, it says so plainly: no detail provided. And if nobody asked for anything, the block is one grey line.',li:4,act:async()=>{spot(q('.e1 .fdet'),5);await wait(1400);spot(null);q('.fuw').innerHTML=FUBLOCK(1);await anim(q('.fuw'),[{opacity:0},{opacity:1}],450);await wait(1100)}}]},

{html:()=>HEAD('Stop','That follow-up is already somebody&rsquo;s job')+`<div class="abs" style="left:58px;top:136px;width:706px">
 <div class="itc"><div class="ttl">Follow-up support requested after Parent Talk Cafe (2026-09-18)</div>
  <div class="nt2">Needs help preparing for the IEP meeting next month.</div>
  <div class="tg3"><span class="ch">Event Feedback</span><span>Follow-up</span><span class="op">Open</span><span class="due">Due in 2 days</span><span>Owner: the presenter</span></div></div>
 <div class="rose2" style="margin-top:18px;opacity:0">${ROSE()}</div></div>
 <div class="abs" style="left:790px;top:158px;width:440px"><ul class="pts"><li>The survey arriving <b>makes the task by itself</b>.</li><li>Channel <b>Event Feedback</b> &middot; type <b>Follow-up</b> &middot; status <b>Open</b> &middot; due <b>2 days out</b>.</li><li>It is owned by the <b>session&rsquo;s presenter</b>.</li><li>The block upstairs is <b>evidence, not a to-do list</b>.</li><li>The two rose boxes are <b>prefilled from the survey</b>, and you can override them.</li></ul></div>`,steps:[
 {say:'Here is the thing almost everybody gets wrong. The moment that survey came in, the system made a task all by itself.',li:0,act:async()=>{await anim(q('.itc'),[{opacity:0,transform:'translateY(26px) scale(.96)'},{opacity:1,transform:'none'}],500);spot(q('.itc'),6);await wait(1400)}},
 {say:'Channel Event Feedback, type Follow-up, status Open, with a follow-up date two days out — and it belongs to whoever presented that session. It is already sitting in their My Day.',li:1,act:async()=>{spot(q('.tg3'),5);await wait(2400);spot(null)}},
 {say:'So do not log it again. If you read that block and raise your own interaction, that family now has two people chasing them for the same thing.',li:3,act:async()=>{await STAMP('DO NOT RE-LOG',360,240,28);await wait(1800)}},
 {say:'One gap to know about. The task carries no link back to the feedback, so you match them up by name and date. And if no presenter was set on the session, it goes to the resource coordinator instead of the person who ran it.',li:2,act:async()=>{await wait(1500)}},
 {say:'Last, the two rose boxes near the bottom of the form. Follow Up Support, parents and professionals, already filled in from the survey. Type over one if you know better — the hint turns orange and keeps the survey figure beside it.',li:4,act:async()=>{const r=q('.rose2');await anim(r,[{opacity:0,transform:'translateY(20px)'},{opacity:1,transform:'none'}],450);
   const f=q('.fup');place(320,660,0);await move(f,800);await click();await type(f,'3',150);const h=q('.hp');h.classList.add('ov');h.textContent='Survey: 2 (manual override)';await pop(h);hideCursor();await wait(900)}}]},

{html:()=>HEAD('Route three','One family, on their contact card')+`<div class="abs" style="left:58px;top:138px;width:706px">
 <div class="cth"><div><b>Kalani Example</b><br><small>Parent &middot; Oahu &middot; kalani@example.com</small></div><span class="cpill pl3">3 Feedback</span></div>
 <div class="cfw" style="margin-top:16px;opacity:0;transform:scale(.82);transform-origin:top left"></div></div>
 <div class="abs" style="left:790px;top:158px;width:440px"><ul class="pts"><li>Open the contact. A <b>green pill</b> sits in the header.</li><li>It reads <b>&lt;n&gt; Feedback</b> — nothing at all if they have never replied.</li><li>Click it for <b>Feedback from &lt;name&gt;</b>.</li><li>All <b>13 answers</b> are there inline. No extra clicks.</li><li>Anything they skipped reads <b>(no answer)</b>.</li></ul></div>`,steps:[
 {say:'The third route is for when you are already looking at one family. Open their contact.',li:0,act:async()=>{spot(q('.cth'),6);await wait(1200)}},
 {say:'If they have ever sent us feedback, a green pill appears in the header. Three Feedback. If they never have, there is no pill at all.',li:1,act:async()=>{spot(q('.pl3'),6);await wait(1900)}},
 {say:'Click it, and a window opens titled Feedback from, then their name.',li:2,act:async()=>{const p=q('.pl3');place(540,660,0);await move(p,850);await click(p);hideCursor();spot(null);
   const w=q('.cfw');w.innerHTML=CFMODAL();await anim(w,[{opacity:0,transform:'scale(.68)'},{opacity:1,transform:'scale(.82)'}],500)}},
 {say:'One card per response, newest first, and every one of the thirteen answers is printed right there. You do not click anything to expand it.',li:3,act:async()=>{spot(q('.qal'),5);await wait(2100)}},
 {say:'Anything they left blank reads, in brackets, no answer. That is a skipped question, not a no.',li:4,act:async()=>{spot(q('.q10'),5);await wait(1500);spot(q('.q12'),5);await wait(1600);spot(null)}}]},

{html:()=>HEAD('Chasing it','How the emails actually go out')+`<div class="abs" style="left:58px;top:140px;width:706px">
 <div class="nosend ns">No Send Feedback Emails button exists &mdash; anywhere</div>
 <div class="rsch" style="margin-top:16px"><h3>Admin &rarr; Reminder Schedule</h3>
  <p>Preview of the reminder emails still to go out. Past sends are in Email Log.</p>
  <div class="rrow"><b>Feedback Follow-ups</b><span class="w8">daily 8:00 AM HST</span></div>
  <div class="rrow">Kalani Example &mdash; Parent Talk Cafe (2026-09-18)<span class="w8">due 2026-09-25</span></div>
  <div class="rrow">Noa Testperson &mdash; Parent Talk Cafe (2026-09-18)<span class="w8">due 2026-09-25</span></div></div>
 <div class="alrt abs" style="left:150px;top:210px"><b>This session has not finished yet.</b>
  Attendance can be saved from Sep 18, 6:00 PM &mdash; an hour after it starts.<br><br>
  Nothing has been saved. Marking people present early also sends them the feedback email, which asks what they thought of a session they have not been to.
  <span class="okb">OK</span></div></div>
 <div class="abs" style="left:790px;top:158px;width:440px"><ul class="pts"><li>No manual send. No resend. <b>No button.</b></li><li>The first email is a <b>side effect of saving attendance</b>.</li><li>Exactly <b>one</b> reminder, ever &mdash; then it stops for good.</li><li><b>8 AM HST</b>, to attendees <b>5&ndash;14 days</b> after the session who have not replied.</li><li>Reminder Schedule is a <b>preview</b>. To push again, use <b>Email Log</b>.</li></ul></div>`,steps:[
 {say:'So how do these emails go out? Start with what does not exist. There is no Send Feedback Emails button anywhere in the dashboard. No manual send, no resend, nothing to press.',li:0,act:async()=>{spot(q('.ns'),6);await wait(1800)}},
 {say:'The first email is a side effect of saving attendance. You tick people present, you press save, and the email goes.',li:1,act:async()=>{spot(null);await wait(1400)}},
 {say:'Which means marking people present early emails them early — asking what they thought of a talk they have not been to yet. That has happened, to nine people at once.',li:1,act:async()=>{await STAMP('EARLY = EMAILED EARLY',150,562,23);await wait(1900)}},
 {say:'So there is now a hard block. Attendance simply cannot be saved until an hour after the session starts, and this is what you get if you try.',li:1,act:async()=>{const a=q('.alrt');await anim(a,[{opacity:0,transform:'scale(.85)'},{opacity:1,transform:'scale(1)'}],450);await wait(2400)}},
 {say:'After that, exactly one reminder. Ever. It goes at eight in the morning, Hawaii time, to attendees five to fourteen days past the session who got the first email and have not replied. Then it stops, permanently.',li:3,act:async()=>{await anim(q('.alrt'),[{opacity:1},{opacity:0}],350);spot(q('.rsch'),6);await wait(2200)}},
 {say:'You can see them queued under Admin, Reminder Schedule, in the Feedback Follow-ups section. That is a preview only — there is no send button there either. The one way to push an email again is the generic resend on Email Log.',li:4,act:async()=>{spot(q('.rrow'),5);await wait(2400);spot(null)}}]},

{html:()=>HEAD('Recap','Your feedback checklist')+`<div class="cl">${[
 'Three names, not one: <b>Feedback Summary</b> &middot; <b>Feedback Detail Report</b> &middot; <b>Feedback from &lt;name&gt;</b>',
 'Green band: <b>View Signups &rarr; Summary</b>. The four tiles are <b>arithmetic, not a queue</b>',
 'Only two vocabularies &mdash; <b>Very Helpful / Helpful</b>, and <b>Yes / To some extent / No</b>',
 'Comments show the <b>5 most recent</b>, anonymously, with <b>+ N more</b>',
 '<b>Follow-Up Support Requested is already a task</b> &mdash; open, due in 2 days, on the presenter. <b>Do not re-log it</b>',
 'The rose boxes are <b>prefilled from the survey</b> &mdash; override them if you know better',
 '<b>No send button exists.</b> Saving attendance sends it; one reminder at 8 AM, then never again'
 ].map(t=>`<div class="ci"><div class="bx"><svg viewBox="0 0 26 26"><path d="M5 13 L11 19 L21 7"/></svg></div><span>${t}</span></div>`).join('')}</div>`,steps:[
 {say:'Let’s recap.',act:async()=>{for(const c of document.querySelectorAll('.scene.on .ci')){c.classList.add('on');await wait(150)}}},
 ...['Three names, not one. Learn them and you will find it every time.',
  'View Signups, then Summary. And the four tiles are sums, not a queue.',
  'Two vocabularies only. No stars, no score out of five.',
  'You see the five most recent comments, without names.',
  'A requested follow-up is already a task on the presenter. Never log it twice.',
  'The rose boxes come from the survey. Override them if you know better.',
  'Nothing sends feedback by hand. Saving attendance does it, and one reminder follows.']
  .map((s,i)=>({say:s,act:async()=>{const cs=document.querySelectorAll('.scene.on .ci');cs.forEach((c,j)=>{c.classList.add('on');if(j<i)c.classList.add('done')});await wait(620);cs[i].classList.add('done')}}))]},

{cls:'cover',html:()=>`<div class="brand">Reviewing feedback</div><div class="hello">All done</div><h1>Mahalo<span class="nmc"></span>!</h1><p class="sub">Read the band, read the comments, and leave the follow-up to whoever already owns it. Questions? Ask Dan.</p>
 <div class="abs cvm" style="left:745px;top:150px;transform:scale(.6) rotate(3deg);transform-origin:top left;animation:bob 5s ease-in-out infinite">
  <div class="esm">${ESH('Parent Talk Cafe')}<div class="esb">${FBAND(14,5,9,'64%')}</div></div></div>
 <div class="gate" style="top:460px"><button class="btn ghost" data-go="again">Watch again</button><button class="btn" data-go="close">Close</button></div>${WAVES}`,
 steps:[{say:'Mahalo {name}! Read the band, read the comments, and leave the follow-up to whoever already owns it. You’ve got it.',act:async()=>{await wait(400);confetti(640,300,140)}}]}
];
</script>
