<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Screening Results: Hearing PDFs, Families and the School — Training</title>
<link rel="stylesheet" href="deck-base.css">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
/* Every class here starts with sx- so nothing collides with deck-base.css. */
.sx-win{position:absolute;left:58px;top:118px;width:712px;height:570px;background:#F4F6F9;border:1px solid #D5DEE8;border-radius:12px;overflow:hidden;box-shadow:0 14px 36px rgba(15,23,42,.16);z-index:4;font-family:"Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:#1E293B}
.sx-in{position:relative;padding:12px 14px}
.sx-top{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.sx-back{font-size:11px;font-weight:700;color:#475569;border:1px solid #CBD5E1;border-radius:6px;padding:4px 8px;background:#fff;white-space:nowrap}
.sx-top h3{margin:0;flex:1;font-size:20px;color:#0E7490;font-weight:800}
.sx-picks{display:flex;gap:10px;margin-bottom:9px}
.sx-pick{font-size:10px;font-weight:700;color:#475569}
.sx-sel{display:block;margin-top:2px;font-size:12px;font-weight:600;color:#1E293B;background:#fff;border:1px solid #CBD5E1;border-radius:7px;padding:5px 24px 5px 8px;min-width:150px;position:relative}
.sx-sel::after{content:"▾";position:absolute;right:7px;top:4px;color:#64748B}
.sx-chips{display:flex;gap:6px;align-items:center;margin-bottom:9px;flex-wrap:nowrap}
.sx-chip{font-size:10px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.sx-btn{font-size:10.5px;font-weight:700;color:#fff;border-radius:7px;padding:6px 10px;white-space:nowrap}
.sx-card{background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(15,40,70,.08);overflow:hidden}
.sx-tbl{width:100%;border-collapse:collapse;font-size:11.5px;table-layout:fixed}
.sx-tbl th{text-align:left;padding:7px 8px;color:#475569;font-size:9px;text-transform:uppercase;letter-spacing:.4px;background:#F8FAFC;border-bottom:2px solid #E2E8F0}
.sx-tbl td{padding:8px;vertical-align:top;border-bottom:1px solid #F1F5F9}
.sx-tbl tr.fail td{background:#FEF2F2}
.sx-fail{display:inline-block;font-size:8.5px;font-weight:800;color:#fff;background:#DC2626;border-radius:999px;padding:1px 7px;margin-top:2px}
.sx-p{color:#15803D;font-weight:700}.sx-f{color:#B91C1C;font-weight:800}
.sx-rel{color:#5B21B6;font-weight:700}
.sx-sent{font-size:10px;line-height:1.5}.sx-sent i{font-style:normal;color:#94A3B8}.sx-sent b{color:#1D4ED8}.sx-sent b.s{color:#6D28D9}
.sx-up{display:inline-block;font-size:9.5px;font-weight:700;color:#fff;background:#DC2626;border-radius:6px;padding:3px 7px;white-space:nowrap}
.sx-file{display:inline-block;font-size:9.5px;font-weight:700;color:#5B21B6;background:#F5F3FF;border:1px solid #DDD6FE;border-radius:6px;padding:2px 7px;white-space:nowrap}
.sx-flash{animation:sxflash 1.4s ease-out}
@keyframes sxflash{0%{background:#FDE68A}100%{background:transparent}}
/* the file picker and the send windows */
.sx-modal{position:absolute;background:#fff;border-radius:14px;box-shadow:0 24px 50px rgba(15,23,42,.35);padding:14px 16px;z-index:20;font-size:12px;opacity:0}
.sx-modal h4{margin:0 0 4px;font-size:15px}
.sx-row{display:flex;align-items:center;gap:8px;padding:5px 2px;border-bottom:1px solid #F1F5F9;font-size:11.5px}
.sx-box{width:12px;height:12px;border-radius:3px;background:#6D28D9;box-shadow:inset 0 0 0 2px #fff;border:1.5px solid #6D28D9;flex:none}
.sx-inp{border:1px solid #CBD5E1;border-radius:7px;padding:6px 8px;font-size:12px;min-height:16px;background:#fff}
.sx-lbl{font-size:9.5px;font-weight:700;color:#475569;margin-bottom:2px}
.sx-ok{position:absolute;right:14px;bottom:14px;background:#0F172A;color:#fff;font-size:11.5px;border-radius:8px;padding:8px 12px;box-shadow:0 8px 20px rgba(0,0,0,.25);opacity:0;z-index:25}
.sx-fd{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-size:12px}
.sx-fd.hi{background:#DBEAFE}
.sx-pdfi{width:18px;height:22px;border-radius:3px;background:#FEE2E2;border:1px solid #FCA5A5;font-size:7px;font-weight:800;color:#B91C1C;display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px;box-sizing:border-box}
/* Reports grid */
.sx-side{position:absolute;left:0;top:0;bottom:0;width:150px;background:#fff;border-right:1px solid #E2E8F0;padding:14px 10px}
.sx-side div{font-size:12.5px;padding:6px 9px;border-radius:6px;color:#334155;margin-bottom:2px}
.sx-side div.act{background:#E0F2FE;color:#0E6E8C;font-weight:700}
.sx-grid{position:absolute;left:150px;right:0;top:0;bottom:0;padding:16px}
.sx-grid h4{margin:0 0 10px;font-size:19px}
.sx-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sx-tile{background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(15,40,70,.08);padding:12px;border:2px solid transparent;height:120px;box-sizing:border-box}
.sx-tile b{display:block;font-size:13px;margin-bottom:3px}.sx-tile span{font-size:10.5px;color:#64748B;line-height:1.35;display:block}
.sx-tile i{display:block;width:22px;height:22px;border-radius:6px;background:#E0F2FE;margin-bottom:6px}
.sx-cv{position:absolute;left:790px;top:150px;width:420px;background:#fff;border-radius:14px;box-shadow:0 24px 50px rgba(0,0,0,.35);padding:12px 14px;color:#1E293B;transform:rotate(3deg);animation:bob 6s ease-in-out infinite;z-index:3;font-family:"Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
</style></head><body>
<div id="view"><div id="stage"><div id="nbar"><i></i></div>
<div id="scenes"></div>
<div id="spot"></div>
<svg id="cursor" viewBox="0 0 28 32"><path d="M3 2 L3 26 L9.5 19.5 L14 29 L18.5 27 L14 17.5 L23 17.5 Z" fill="#fff" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/></svg>
</div></div>
<div id="cap" aria-live="polite"></div>
<div id="bar">
 <button id="prev">Back</button><button id="play">Start</button><button id="next">Next</button>
 <div id="dots"></div>
 <button id="capbtn" aria-pressed="false">Captions</button><button id="voice" aria-pressed="true">Voice on</button>
</div>
<script>
const DECK_ID='screening-results-to-school';

/* Short walkthrough for the School Readiness screenings (Int v153.30): Reports → Screenings →
   pick the school and class, upload the hearing machine's PDF on a hearing failure, then email
   results to families and to the school. The mocks redraw _srRenderSchool. Every child, family
   and school contact here is MADE UP. */
const tap=async(s,ms=850)=>{const e=typeof s==='string'?q(s):s;await move(e,ms);await click(e);return e};
function all(s){return[...document.querySelectorAll('.scene.on '+s)]}
const show=(e,ms=450)=>anim(e,[{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],ms,'ease-out').then(()=>{e.style.opacity=1});
const hide=(e,ms=300)=>anim(e,[{opacity:1},{opacity:0}],ms,'ease-in').then(()=>{e.style.opacity=0});
const PTS=(items,top=140)=>`<div class="abs" style="left:790px;top:${top}px;width:440px"><ul class="pts">${items.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
const LOGO=`<div class="ldah-logo" style="position:absolute;left:70px;top:22px;background:#fff;border-radius:14px;padding:6px 10px;box-shadow:0 4px 14px rgba(0,0,0,.18);animation:rise .6s both"><img src="../logo_blue.png" alt="LDAH" style="height:80px;display:block"></div>`;
async function toast(t){const e=q('.sx-ok');e.textContent=t;await show(e,300);await wait(1500);await hide(e)}

/* ---- the children: fictional ---- */
const KIDS=[
 {k:'a',child:'Keola Nakamura',fam:'Pua Nakamura',cls:'Honu',v:['Pass','Pass'],h:['Pass','Fail'],fail:true},
 {k:'b',child:'Malia Kahale',fam:'Kekoa Kahale',cls:'Honu',v:['Pass','Pass'],h:['Pass','Pass']},
 {k:'c',child:'Ikaika Torres',fam:'Lani Torres',cls:'Honu',v:['Pass','Fail'],h:['Pass','Pass']},
 {k:'d',child:'Noa Fujimoto',fam:'Ana Fujimoto',cls:'Honu',v:['Pass','Pass'],h:['Pass','Pass']}];
const RC=p=>`R <span class="${p[0]==='Fail'?'sx-f':'sx-p'}">${p[0]}</span> · L <span class="${p[1]==='Fail'?'sx-f':'sx-p'}">${p[1]}</span>`;
const ROW=r=>`<tr class="k-row-${r.k}${r.fail?' fail':''}">
 <td><b>${r.child}</b>${r.fail?'<div><span class="sx-fail">HEARING FAIL</span></div>':''}</td>
 <td style="color:#0E7490;font-weight:600">${r.fam}</td>
 <td>${RC(r.v)}</td><td>${RC(r.h)}</td>
 <td><span class="sx-rel">Signed ✓</span></td>
 <td class="sx-sent k-sent-${r.k}">Family: <i>not sent</i><br>School: <i>not sent</i></td>
 <td class="k-files-${r.k}">${r.fail?`<span class="sx-up k-up-${r.k}">+ Hearing PDF</span>`:''}</td></tr>`;
const TABLE=()=>`<div class="sx-card"><table class="sx-tbl"><colgroup><col style="width:112px"><col style="width:96px"><col style="width:96px"><col style="width:96px"><col style="width:64px"><col style="width:96px"><col></colgroup>
 <thead><tr><th>Child</th><th>Family</th><th>Vision</th><th>Hearing (OAE)</th><th>Release</th><th>Sent</th><th>Files</th></tr></thead>
 <tbody>${KIDS.map(ROW).join('')}</tbody></table></div>`;
const REPORT=()=>`<div class="sx-win"><div class="sx-in">
 <div class="sx-top"><span class="sx-back">← Back to Reports</span><h3>Screenings</h3></div>
 <div class="sx-picks"><div class="sx-pick">School<span class="sx-sel k-school">Sunny Hill Preschool</span></div><div class="sx-pick">Classroom<span class="sx-sel k-class">Honu</span></div></div>
 <div class="sx-chips"><span class="sx-chip" style="background:#FEE2E2;color:#B91C1C">1 hearing fail</span><span class="sx-chip" style="background:#F5F3FF;color:#5B21B6">4 signed release</span>
  <span style="flex:1"></span><span class="sx-btn k-fam" style="background:#0369A1">Email results to families</span><span class="sx-btn k-sch" style="background:#6D28D9">Email results to school</span></div>
 ${TABLE()}</div><div class="sx-ok"></div></div>`;
const TILES=[['Case Management','One row per family after a screening referral.',''],['ASQ Management','Every screened child, entered in ASQ Online or not yet.',''],['Screenings','Vision and hearing results by school and class.','#0891B2']];
const REPORTS=()=>`<div class="sx-win"><div class="sx-side"><div>Home</div><div>My Day</div><div>Contacts</div><div>Events</div><div class="act">Reports</div></div>
 <div class="sx-grid"><h4>Reports</h4><div class="sx-tiles">${TILES.map(t=>`<div class="sx-tile${t[0]==='Screenings'?' k-tile':''}"${t[2]?` style="border-color:${t[2]}"`:''}><i></i><b>${t[0]}</b><span>${t[1]}</span></div>`).join('')}</div></div></div>`;

const SC=[
// ================= COVER =================
{cls:'cover',html:()=>LOGO+`<div class="brand">Leadership in Disabilities &amp; Achievement of Hawaiʻi · School Readiness</div><div class="hello">Aloha <span class="nm"></span></div>
 <h1>Screening results: hearing PDFs, families and the school</h1><p class="sub" style="top:380px">Four quick steps after a screening day.</p>
 <div class="sx-cv"><table class="sx-tbl"><colgroup><col style="width:150px"><col></colgroup><thead><tr><th>Child</th><th>Hearing</th></tr></thead>
  <tbody><tr class="fail"><td><b>Keola Nakamura</b><div><span class="sx-fail">HEARING FAIL</span></div></td><td>${RC(['Pass','Fail'])}</td></tr><tr><td><b>Malia Kahale</b></td><td>${RC(['Pass','Pass'])}</td></tr></tbody></table></div>
 <div class="spark" style="left:1200px;top:90px">${SPARK}</div>
 <div class="gate" style="top:470px"><button class="btn" data-go="start">Play</button><label><input type="checkbox" id="voiceChk" checked> Read it out loud to me</label></div>${WAVES}`,
 steps:[{say:'Aloha {name}! Here is how to finish a screening day in four quick steps.'}]},

// ================= 1. THE REPORT =================
{html:()=>HEAD('Step 1','Open the report and pick the class')+REPORTS()+PTS([
 'Go to <b>Reports</b> and click <b>Screenings</b>.',
 'Pick the <b>School</b>, then the <b>Classroom</b>.',
 'Each child shows <b>vision</b>, <b>hearing</b>, the <b>release</b> and what has been <b>sent</b>.']),
 steps:[{say:'Go to Reports and click Screenings.',li:0,act:async()=>{spot(q('.k-tile'),5);await wait(500);await tap('.k-tile',900);hideCursor();spot(null)}},
 {say:'Pick the school, then the classroom.',li:1,act:async()=>{const w=q('.sx-win');w.outerHTML=REPORT();await wait(300);await tap('.k-school',800);await wait(300);await tap('.k-class',700);hideCursor()}},
 {say:'Each child shows their vision and hearing results, the signed release, and what has already been sent.',li:2,act:async()=>{spot(q('.sx-tbl'),3);await wait(1600);spot(null)}}]},

// ================= 2. HEARING PDF =================
{html:()=>HEAD('Step 2','Upload the hearing PDF')+REPORT()+PTS([
 'A hearing failure is <b>red</b>, with a <b>HEARING FAIL</b> tag, at the top.',
 'Click <b>+ Hearing PDF</b> and pick the machine’s PDF from your laptop.',
 'Up to <b>two</b> PDFs per child. They live on the <b>contact card</b>.']),
 steps:[{say:'A hearing failure shows in red, with a Hearing Fail tag, at the top of the list.',li:0,act:async()=>{spot(q('.k-row-a'),3);await wait(1400)}},
 {say:'Click Plus Hearing PDF, and pick the machine’s PDF from your laptop.',li:1,act:async()=>{spot(null);await tap('.k-up-a',900);
  const w=q('.sx-win');const m=add(`<div class="sx-modal k-pick" style="left:170px;top:150px;width:360px"><h4>Choose a file</h4><div style="font-size:10.5px;color:#64748B;margin-bottom:8px">Downloads</div>
   <div class="sx-fd k-f1"><span class="sx-pdfi">PDF</span>OAE_Nakamura_K_2026-10-15.pdf</div><div class="sx-fd"><span class="sx-pdfi">PDF</span>OAE_Kahale_M_2026-10-15.pdf</div>
   <div style="text-align:right;margin-top:10px"><span class="sx-btn k-open" style="background:#2563EB">Open</span></div></div>`,w);
  await show(m);await tap('.k-f1',700);q('.k-f1').classList.add('hi');await wait(300);await tap('.k-open',600);await hide(m);m.remove();hideCursor();
  const f=q('.k-files-a');f.innerHTML='<span class="sx-file">Hearing PDF 1</span> <span class="sx-up">+ Hearing PDF</span>';f.classList.add('sx-flash');await toast('Hearing PDF saved to this child.')}},
 {say:'You can add up to two PDFs for each child, and they stay on the child’s contact card.',li:2,act:async()=>{spot(q('.k-files-a'),5);await wait(1500);spot(null)}}]},

// ================= 3. FAMILIES =================
{html:()=>HEAD('Step 3','Email results to the families')+REPORT()+PTS([
 'Click <b>Email results to families</b>. The school and class are already picked.',
 'Press <b>Check</b>, then <b>Send</b>. Each family gets a <b>private link</b>.',
 'The child’s row now says <b>Family: sent</b>. Lost email? <b>Resend results</b> on the contact card.']),
 steps:[{say:'Click Email results to families. The school and class are already picked for you.',li:0,act:async()=>{await tap('.k-fam',900);
  const w=q('.sx-win');const m=add(`<div class="sx-modal k-fm" style="left:150px;top:110px;width:400px"><h4 style="color:#0369A1">Send results to families</h4><div style="font-size:10.5px;color:#64748B;margin-bottom:8px">Sunny Hill Preschool · Honu</div>
   <div class="k-ready" style="opacity:0"><div style="font-size:10.5px;font-weight:700;color:#166534;margin-bottom:3px">Ready to send · 4</div>${KIDS.map(r=>`<div class="sx-row"><span class="sx-box" style="background:#0369A1;border-color:#0369A1"></span>${r.child}<span style="color:#64748B;margin-left:auto">${r.fam.split(' ')[0].toLowerCase()}@example.com</span></div>`).join('')}</div>
   <div style="text-align:right;margin-top:10px;display:flex;gap:6px;justify-content:flex-end"><span class="sx-btn k-check" style="background:#64748B">Check</span><span class="sx-btn k-send" style="background:#0369A1">Send to 4 families</span></div></div>`,w);
  await show(m);hideCursor()}},
 {say:'Press Check, then Send. Each family gets a private link to their child’s results.',li:1,act:async()=>{await tap('.k-check',700);await show(q('.k-ready'));await wait(500);await tap('.k-send',700);const m=q('.k-fm');await hide(m);m.remove();hideCursor();
  KIDS.forEach(r=>{const c=q('.k-sent-'+r.k);c.innerHTML='Family: <b>Oct 16</b><br>School: <i>not sent</i>';c.classList.add('sx-flash')});await toast('Sent to 4 families.')}},
 {say:'Each row now shows the family date. If a family loses the email, use Resend results on their contact card.',li:2,act:async()=>{spot(q('.k-sent-a'),5);await wait(1500);spot(null)}}]},

// ================= 4. SCHOOL =================
{html:()=>HEAD('Step 4','Email results to the school')+REPORT()+PTS([
 'Click <b>Email results to school</b>. Only children with a <b>signed release</b> are listed.',
 'Type the school contact’s <b>name</b> and <b>email</b>. Press <b>Preview PDF</b> to check it.',
 'Press <b>Send to school</b>. They get one PDF, and each row says <b>School: sent</b>.']),
 steps:[{say:'Click Email results to school. Only children whose parent signed the release are listed.',li:0,act:async()=>{await tap('.k-sch',900);
  const w=q('.sx-win');const m=add(`<div class="sx-modal k-sm" style="left:120px;top:96px;width:460px"><h4 style="color:#5B21B6">Email results to the school</h4><div style="font-size:10.5px;color:#64748B;margin-bottom:8px">Only children with a signed Consent to Release. One PDF is attached.</div>
   <div style="display:grid;grid-template-columns:1fr 1.3fr;gap:8px;margin-bottom:8px"><div><div class="sx-lbl">School contact name</div><div class="sx-inp k-nm"></div></div><div><div class="sx-lbl">School contact email</div><div class="sx-inp k-em"></div></div></div>
   ${KIDS.map(r=>`<div class="sx-row"><span class="sx-box"></span><b>${r.child}</b>${r.fail?' <span class="sx-fail" style="margin:0">HEARING FAIL</span>':''}</div>`).join('')}
   <div style="text-align:right;margin-top:10px;display:flex;gap:6px;justify-content:flex-end"><span class="sx-btn k-prev" style="background:#F5F3FF;color:#5B21B6;border:1px solid #DDD6FE">Preview PDF</span><span class="sx-btn k-ss" style="background:#6D28D9">Send to school</span></div></div>`,w);
  await show(m);hideCursor()}},
 {say:'Type the school contact’s name and email, and press Preview PDF to check it first.',li:1,act:async()=>{await tap('.k-nm',700);await type(q('.k-nm'),'Director Kim');await tap('.k-em',600);await type(q('.k-em'),'director@sunnyhill.example');await tap('.k-prev',700);hideCursor();spot(q('.k-prev'),5);await wait(900);spot(null)}},
 {say:'Press Send to school. They get one PDF with every released child, and each row now shows the school date.',li:2,act:async()=>{await tap('.k-ss',700);const m=q('.k-sm');await hide(m);m.remove();hideCursor();
  KIDS.forEach(r=>{const c=q('.k-sent-'+r.k);c.innerHTML='Family: <b>Oct 16</b><br>School: <b class="s">Oct 16</b>';c.classList.add('sx-flash')});await toast('Sent to director@sunnyhill.example: 4 children.')}}]},

// ================= RECAP =================
{html:()=>HEAD('Recap','After a screening day')+`<div class="cl" style="top:150px">${[
 '<b>Reports → Screenings</b>. Pick the <b>school</b> and <b>class</b>.',
 'Red <b>HEARING FAIL</b>: click <b>+ Hearing PDF</b> and upload the machine’s PDF.',
 '<b>Email results to families</b>: Check, then Send.',
 '<b>Email results to school</b>: type the contact, Preview PDF, then Send.'].map(t=>`<div class="ci"><div class="bx"><svg viewBox="0 0 24 24"><path d="M5 12 L10 17 L19 7"/></svg></div><div>${t}</div></div>`).join('')}</div>`,
 steps:[{say:'Let’s recap.',act:async()=>{for(const c of all('.ci')){c.classList.add('on');await wait(160)}}},
 ...['Open Reports, then Screenings, and pick the school and class.','For a red hearing fail, click Plus Hearing PDF and upload the machine’s PDF.','Email results to families: Check, then Send.','Email results to the school: type the contact, preview the PDF, then send.']
  .map((s,i)=>({say:s,act:async()=>{const c=all('.ci')[i];c.classList.add('done');spot(c,4)}}))]},

// ================= MAHALO =================
{cls:'cover',html:()=>`${LOGO}<div class="brand">Screening results</div><div class="hello">All done</div><h1>Mahalo<span class="nmc"></span>!</h1><p class="sub">Report, hearing PDFs, families, school. Come back and watch it again any time.</p>
 <div class="gate" style="top:460px"><button class="btn ghost" data-go="again">Watch again</button><button class="btn" data-go="close">Close</button></div>${WAVES}`,
 steps:[{say:'Mahalo {name}! That is the whole screening day wrap-up. Come back and watch it again any time.',act:async()=>{await wait(400);confetti(640,300,160)}}]}
];
</script>
<script src="deck-engine.js?v=3"></script>
<script src="deck-tracker.js"></script></body></html>
