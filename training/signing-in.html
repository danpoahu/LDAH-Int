<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Signing In to LDAH Internal — Training</title>
<link rel="stylesheet" href="deck-base.css">
<style>
/* ---------- cover: PIP logo, as on the partner decks ---------- */
.piplogo{position:absolute;left:760px;top:120px;width:450px;padding:22px 26px 16px;background:#fff;border-radius:26px;box-shadow:0 30px 70px rgba(0,0,0,.38);z-index:3;animation:pipin 1.1s .3s cubic-bezier(.3,1.5,.5,1) both,pipfloat 9s 1.4s ease-in-out infinite}
.piplogo img{display:block;width:100%;height:auto}
.pipglow{position:absolute;left:720px;top:90px;width:530px;height:360px;border-radius:50%;background:radial-gradient(closest-side,rgba(249,168,212,.55),rgba(125,211,252,.25) 60%,transparent);z-index:2;animation:pipglow 4.5s ease-in-out infinite}
.pipspk{position:absolute;width:30px;height:30px;z-index:4;animation:twinkle 2.6s ease-in-out infinite}
@keyframes pipin{from{opacity:0;transform:translateY(-220px) rotate(-18deg) scale(.4)}to{opacity:1;transform:none}}
@keyframes pipfloat{0%,100%{transform:translate(0,0) rotate(0)}20%{transform:translate(-26px,-18px) rotate(-3deg)}45%{transform:translate(14px,-30px) rotate(2.5deg)}70%{transform:translate(26px,8px) rotate(-1.5deg)}85%{transform:translate(-10px,16px) rotate(2deg)}}
@keyframes pipglow{0%,100%{opacity:.6;transform:scale(.94)}50%{opacity:1;transform:scale(1.06)}}
/* ---------- sign-in details card ---------- */
.keycard{position:absolute;left:58px;top:130px;width:700px;background:#fff;border-radius:18px;box-shadow:0 14px 40px rgba(15,23,42,.14);padding:26px 30px;border-top:6px solid #004E7C}
.keycard .kr{display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid #E2E8F0}
.keycard .kr:last-child{border-bottom:0}
.keycard .kl{font-size:15px;font-weight:800;color:#475569;text-transform:uppercase;letter-spacing:.05em}
.keycard .kv{font-size:24px;font-weight:800;color:#0F172A;word-break:break-all}
.keycard a.kv{color:#004E7C;text-decoration:underline;text-underline-offset:4px}
.keycard .pw{font-family:ui-monospace,Menlo,monospace;letter-spacing:.12em;background:#FEF3C7;border:1px dashed #F59E0B;border-radius:8px;padding:2px 12px;display:inline-block}
.keycard .tmp{display:block;font-size:13px;font-weight:700;color:#B45309;letter-spacing:0;margin-top:4px}
.openbtn{display:inline-block;margin-top:18px;background:#004E7C;color:#fff;font-weight:800;font-size:19px;padding:14px 26px;border-radius:12px;text-decoration:none;box-shadow:0 10px 24px rgba(0,78,124,.3)}
/* ---------- browser window ---------- */
.brw{position:absolute;left:58px;top:122px;width:716px;height:560px;background:#fff;border-radius:14px;box-shadow:0 16px 44px rgba(15,23,42,.2);overflow:hidden}
.brw .wbt{height:44px;background:#EEF2F6;border-bottom:1px solid #D7DEE6;display:flex;align-items:center;gap:8px;padding:0 12px}
.brw .wbt i{width:12px;height:12px;border-radius:50%;background:#F87171;display:inline-block}.brw .wbt i:nth-child(2){background:#FBBF24}.brw .wbt i:nth-child(3){background:#34D399}
.brw .url{flex:1;margin-left:10px;height:28px;border-radius:8px;background:#fff;border:1px solid #D7DEE6;font-size:14px;color:#334155;display:flex;align-items:center;padding:0 12px;white-space:nowrap;overflow:hidden}
.brw .url .ulk{color:#16A34A;margin-right:6px;font-size:12px}
.brw .pg{position:absolute;left:0;right:0;top:44px;bottom:0}
/* ---------- the real sign-in screen ---------- */
.lgs{position:absolute;inset:0;background:linear-gradient(135deg,#004E7C 0%,#0066a1 100%);display:flex;align-items:center;justify-content:center}
.lgb{background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:350px;padding:26px 30px;text-align:center}
.lgb img{width:62px;display:block;margin:0 auto 8px}
.lgb h3{margin:0;color:#004E7C;font-size:26px;font-weight:800}
.lgb .ls{color:#64748B;font-size:14px;margin:4px 0 16px}
.lgb .lfg{text-align:left;margin-bottom:13px}
.lgb label{display:block;font-size:13px;font-weight:700;color:#1E293B;margin-bottom:5px}
.lgb .lin{height:40px;border:2px solid #E2E8F0;border-radius:10px;font-size:15px;padding:0 12px;display:flex;align-items:center;color:#0F172A;background:#fff}
.lgb .lin.ph{color:#94A3B8}
.lgb .lin.focus{border-color:#004E7C}
.lgb .lsb{height:44px;border-radius:12px;background:#004E7C;color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center}
.lgb .fp{display:inline-block;margin-top:11px;color:#004E7C;font-size:13.5px}
.press{filter:brightness(.85);transform:scale(.97)}
/* browser alert */
.alrt{position:absolute;left:50%;top:26px;transform:translateX(-50%);width:420px;background:#fff;border-radius:12px;box-shadow:0 18px 50px rgba(15,23,42,.35);padding:16px 18px;font-size:15px;z-index:20}
.alrt small{display:block;font-size:12px;color:#64748B;margin-bottom:6px}
.alrt .aok{float:right;margin-top:12px;background:#2563EB;color:#fff;font-weight:700;border-radius:8px;padding:6px 18px;font-size:14px}
.alrt.bad b{color:#B91C1C}
/* ---------- dashboard ---------- */
.db{position:absolute;inset:0;background:#FEFDFB;display:flex}
.db .sd{width:150px;border-right:1px solid #EEF2F6;padding:10px 8px;font-size:12px}
.db .sd .wb{text-align:center;font-weight:700;font-size:13px}.db .sd .wb small{display:block;font-weight:400;color:#64748B;font-size:10.5px}
.db .sd .dtb{display:flex;background:#F1F5F9;border-radius:8px;margin:10px 0;font-weight:700;font-size:11.5px}.db .sd .dtb span{flex:1;text-align:center;padding:5px}.db .sd .dtb span:first-child{background:#fff;border-radius:7px;color:#0E7490}
.db .sd .ni{padding:6px 8px;font-weight:600;color:#1E293B}.db .sd .ni.on{background:#E0F2FE;border-radius:8px;color:#0E7490}
.db .mn{flex:1;padding:10px 12px;position:relative}
.db .tp{display:flex;align-items:center;gap:8px}
.db .tp img{width:38px}
.db .dsr{flex:1;height:28px;border-radius:14px;background:#FFFBEB;border:1px solid #FDE68A;font-size:11px;color:#94A3B8;display:flex;align-items:center;padding:0 10px}
.db .av{width:32px;height:32px;border-radius:50%;background:#F1F5F9;border:1px solid #E2E8F0;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;color:#0F172A}
.db .kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.db .kp div{background:#fff;border-radius:10px;box-shadow:0 4px 12px rgba(2,132,199,.08);padding:8px;font-size:10.5px;font-weight:700;border-left:3px solid #22C55E}
.db .kp div:nth-child(2){border-color:#0891B2}.db .kp div:nth-child(3){border-color:#F97316}
.db .kp b{display:block;font-size:20px;color:#0F766E}
.db .hr{background:linear-gradient(120deg,#0e2f52 0%,#155e8c 55%,#0e9aac 130%);color:#fff;border-radius:12px;padding:12px 14px;font-weight:800;font-size:18px}
.db .hr small{display:block;font-weight:400;font-size:11.5px;opacity:.9}
.db .mnu{position:absolute;right:10px;top:46px;background:#fff;border:1px solid #E2E8F0;border-radius:12px;box-shadow:0 14px 34px rgba(15,23,42,.2);width:150px;font-size:14px;font-weight:700;z-index:5;overflow:hidden}
.db .mnu div{padding:11px 14px;border-bottom:1px solid #F1F5F9}.db .mnu div.lo{color:#DC2626;border:0}
/* ---------- email ---------- */
.mail{position:absolute;inset:0;background:#fff;display:flex}
.mail .ml{width:220px;border-right:1px solid #E2E8F0;font-size:12.5px}
.mail .mbh{padding:10px 12px;font-weight:800;color:#475569;border-bottom:1px solid #E2E8F0}
.mail .mi{padding:9px 12px;border-bottom:1px solid #F1F5F9;color:#64748B}
.mail .mi b{display:block;color:#0F172A;font-size:13px}
.mail .mi.new{background:#EFF6FF;border-left:3px solid #2563EB}
.mail .mv{flex:1;padding:16px 20px;font-size:14px;color:#1E293B;line-height:1.55}
.mail .mv h4{margin:0 0 4px;font-size:17px}
.mail .mv .fr{font-size:12.5px;color:#64748B;margin-bottom:14px}
.mail .mv a{color:#1A73E8;word-break:break-all}
/* ---------- Firebase reset page ---------- */
.fbp{position:absolute;inset:0;background:#F5F5F5;display:flex;align-items:flex-start;justify-content:center;padding-top:60px}
.fbc{width:360px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);padding:24px;font-family:Roboto,Arial,sans-serif}
.fbc h3{margin:0 0 4px;font-size:21px;font-weight:500;color:#212121}
.fbc .fe{color:#757575;font-size:14px;margin-bottom:22px}
.fbc label{font-size:12px;color:#1A73E8}
.fbc .fbi{border-bottom:2px solid #1A73E8;height:32px;font-size:16px;display:flex;align-items:center;letter-spacing:.18em}
.fbc .sv{float:right;margin-top:22px;background:#1A73E8;color:#fff;font-weight:500;font-size:14px;padding:9px 18px;border-radius:2px;letter-spacing:.04em}
.fbc.fdone h3{color:#212121}
.big{position:absolute;left:790px;top:560px;width:440px;background:#FFFBEB;border:1px solid #FDE68A;color:#92400E;border-radius:12px;padding:12px 16px;font-size:16px;font-weight:700}
.big.red{background:#FEF2F2;border-color:#FECACA;color:#991B1B}
</style><!-- Same Firebase build as the dashboard, so the deck shares its sign-in and records progress. -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head><body>
<div id="view"><div id="stage"><div id="nbar"><i></i></div>
<div id="scenes"></div>
<div id="spot"></div>
<svg id="cursor" viewBox="0 0 28 32"><path d="M3 2 L3 26 L9.5 19.5 L14 29 L18.5 27 L14 17.5 L23 17.5 Z" fill="#fff" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/></svg>
</div></div>
<div id="cap" aria-live="polite"></div>
<div id="bar">
 <button id="prev">Back</button><button id="play">Start</button><button id="next">Next</button>
 <div id="dots"></div>
 <button id="capbtn" aria-pressed="false">Captions</button><button id="voice" aria-pressed="true">Voice on</button>
</div>
<script>
const DECK_ID='signing-in-2026-09';
const URL_INT='https://danpoahu.github.io/LDAH-Int/';
const EMAIL='you@example.org';   /* never a real person: this page is public */
/* The viewer's own name: ?name= on the link, or the dashboard sign-in via deck-tracker. */
const NM=()=>(typeof name!=='undefined'&&name)||'there';
const INI=()=>((typeof name!=='undefined'&&name)||'?').charAt(0).toUpperCase();   /* first name only here, so one letter */
const LOGO='../logo_transparent.png', PIPLOGO='pip-logo.png';

const BRW=(url,page)=>`<div class="brw"><div class="wbt"><i></i><i></i><i></i><div class="url"><span class="ulk">&#128274;</span><span class="u">${url}</span></div></div><div class="pg">${page}</div></div>`;
const LOGIN=(email,pw)=>`<div class="lgs"><div class="lgb"><img src="${LOGO}" alt="LDAH">
 <h3>LDAH Internal</h3><div class="ls">Sign in to continue</div>
 <div class="lfg"><label>Email</label><div class="lin em ${email?'':'ph'}">${email||'you@ldah.org'}</div></div>
 <div class="lfg"><label>Password</label><div class="lin pw ${pw?'':'ph'}">${pw||'Enter password'}</div></div>
 <div class="lsb">Sign In</div><a class="fp">Forgot Password?</a></div></div>`;
const DASH=()=>`<div class="db"><div class="sd"><div class="wb">Welcome back, ${NM()}<small>Partner dashboard</small></div><div class="dtb"><span>Main</span><span>CMS</span></div>
 ${['Home','Interactions','Downloads','Contacts','Change Requests','Reports','Training Videos'].map((n,i)=>`<div class="ni ${i?'':'on'}">${n}</div>`).join('')}</div>
 <div class="mn"><div class="tp"><img src="${LOGO}" alt=""><div class="dsr">Search signups, interactions, clients...</div><div class="av">${INI()}</div></div>
 <div class="kp"><div>Active Events<b>0</b></div><div>Interactions logged<b>0</b></div><div>Follow-ups due<b>0</b></div></div>
 <div class="hr">Aloha ${NM()}<small>You're all caught up.</small></div></div></div>`;
const PTS=(items,top=150)=>`<div class="abs" style="left:800px;top:${top}px;width:430px"><ul class="pts">${items.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
async function typeIn(sel,text,ms=45){const e=q(sel);e.classList.add('focus');await type(e,text,ms);e.classList.remove('focus')}

const SC=[
// ================= COVER =================
{cls:'cover',html:()=>`<div class="brand">Leadership in Disabilities &amp; Achievement of Hawaiʻi · Pacific Island Partners</div><div class="hello">Aloha <span class="nm"></span></div>
 <h1>Signing in to LDAH Internal</h1><p class="sub">How to sign in the first time, and how to make your own password. About four minutes. Pause any time.</p>
 <div class="pipglow"></div><div class="piplogo"><img src="${PIPLOGO}" alt="Pacific Island Partners"></div>
 ${[[740,110,0],[1190,150,.8],[1210,400,1.6],[760,420,.4],[980,80,1.2]].map(p=>`<div class="pipspk" style="left:${p[0]}px;top:${p[1]}px;animation-delay:${p[2]}s">${SPARK}</div>`).join('')}
 <div class="gate"><button class="btn" data-go="start">Start training</button><button class="btn ghost" data-go="skip">Skip for now</button><label><input type="checkbox" id="voiceChk" checked> Read it out loud to me</label></div>${WAVES}`,
 steps:[{say:'Aloha {name}! Welcome to LDAH Internal. This short training shows you how to sign in, and then how to change your password to one only you know. We will go one small step at a time.'}]},

// ================= YOUR DETAILS =================
{html:()=>HEAD('Step 1','Your sign-in details')+`<div class="keycard">
 <div class="kr"><div class="kl">Website</div><a class="kv lnk" href="${URL_INT}" target="_blank" rel="noopener">danpoahu.github.io/LDAH-Int</a></div>
 <div class="kr"><div class="kl">Your email</div><div class="kv em">${EMAIL}</div></div>
 <div class="kr"><div class="kl">Password</div><div class="kv" style="font-size:20px">The temporary password in Dan’s email<span class="tmp">Temporary. You will change it in a few minutes.</span></div></div>
 <a class="openbtn" href="${URL_INT}" target="_blank" rel="noopener">Open LDAH Internal &rarr;</a></div>
 ${PTS(['Click the link, or the blue button, to open the sign-in page.','Your email is your work email.','Your first password is the temporary one in Dan’s email.','Save the page as a bookmark so it is easy to find next time.'])}`,
 steps:[
 {say:'Here is everything you need to sign in. First, the website. You can click the link, or the big blue button, and it opens the sign-in page.',li:0,act:async()=>{spot(q('.keycard .kr'),8);await wait(300);await move(q('.openbtn'),900);await click(q('.openbtn'));hideCursor()}},
 {say:'Your email is your work email, the one Dan sent the invitation to.',li:1,act:async()=>{spot(q('.keycard .kr:nth-child(2)'),8)}},
 {say:'Your first password is the temporary one in Dan’s email. It is only a starting password. In a few minutes we will change it.',li:2,act:async()=>{spot(q('.keycard .kr:nth-child(3)'),8)}},
 {say:'Tip: once the page is open, save it as a bookmark, so it is always one click away.',li:3,act:async()=>{spot(null)}}]},

// ================= OPEN THE PAGE =================
{html:()=>HEAD('Step 2','Open the sign-in page')+BRW('',`<div class="lgs" style="opacity:0"></div>`)+PTS(['The address is <b>danpoahu.github.io/LDAH-Int</b>.','You will see the blue <b>LDAH Internal</b> sign-in box.','It works on a computer, a tablet or a phone.']),
 steps:[
 {say:'When you click the link, your web browser opens this page. The address at the top says danpoahu dot github dot I O, slash LDAH dash Int.',li:0,act:async()=>{const u=q('.brw .u');spot(q('.brw .url'),6);await type(u,URL_INT,28)}},
 {say:'The page shows the blue LDAH Internal sign-in box.',li:1,act:async()=>{spot(null);const pg=q('.brw .pg');pg.innerHTML=LOGIN('','');await anim(pg.firstChild,[{opacity:0},{opacity:1}],600);spot(q('.lgb'),8)}},
 {say:'It works the same on a computer, a tablet or a phone.',li:2,act:async()=>{spot(null)}}]},

// ================= SIGN IN =================
{html:()=>HEAD('Step 3','Sign in')+BRW(URL_INT,LOGIN('',''))+PTS(['Click in <b>Email</b> and type your work email.','Click in <b>Password</b> and type the temporary password.','Click the dark blue <b>Sign In</b> button.','Your dashboard opens and says <b>Aloha</b> with your name.']),
 steps:[
 {say:'Click in the Email box, and type your work email.',li:0,act:async()=>{const e=q('.lin.em');await move(e,900);await click(e);hideCursor();await typeIn('.lin.em',EMAIL,55)}},
 {say:'Then click in the Password box, and type the temporary password from Dan’s email. The dots hide what you type. That is normal.',li:1,act:async()=>{const e=q('.lin.pw');await move(e,800);await click(e);hideCursor();await typeIn('.lin.pw','••••••',160)}},
 {say:'Now click the dark blue Sign In button.',li:2,act:async()=>{const b=q('.lsb');await move(b,800);spot(b,6);await click(b);hideCursor();spot(null)}},
 {say:'And you are in! Your dashboard opens and says Aloha, with your name. Well done.',li:3,act:async()=>{const pg=q('.brw .pg');pg.innerHTML=DASH();await anim(pg.firstChild,[{opacity:0},{opacity:1}],600);spot(q('.db .hr'),6);await wait(600);confetti(420,380,70)}}]},

// ================= WHY CHANGE =================
{html:()=>HEAD('Make it yours','Change your password next')+`<div class="abs" style="left:58px;top:140px;width:700px;font-size:24px;line-height:1.5;color:#1E293B">
 <p style="margin:0 0 18px">Everyone starts with the <b>same temporary password</b>, so please change it to one only you know.</p>
 <p style="margin:0">It takes three short steps:</p></div>
 <div class="cl" style="left:58px;top:330px;width:700px">${['<b>Log off</b> from your initials menu','Click <b>Forgot Password?</b>','Open the email and choose a <b>new password</b>'].map((t,i)=>`<div class="ci"><div class="bx"><svg viewBox="0 0 26 26"><path d="M5 13 L11 19 L21 7"/></svg></div><span><b>${i+1}.</b> ${t}</span></div>`).join('')}</div>
 ${PTS(['Do it today, the first time you sign in.','It only takes a couple of minutes.','You will get an email to help you.'])}`,
 steps:[
 {say:'Now let us make the password your own. Everyone starts with the same temporary password, so please change it the first time you sign in.',li:0},
 {say:'It takes three short steps. Log off. Click Forgot Password. Then open the email and choose a new password.',li:1,act:async()=>{for(const c of document.querySelectorAll('.scene.on .ci')){c.classList.add('on');await wait(350)}}},
 {say:'The email does the hard part for you.',li:2}]},

// ================= LOG OFF =================
{html:()=>HEAD('Change password · 1 of 3','Log off')+BRW(URL_INT,DASH())+PTS(['Click the round badge with <b>your initials</b>, top right.','A small menu opens: <b>Profile</b> and <b>Log off</b>.','Click the red <b>Log off</b>.','You are back at the sign-in box.']),
 steps:[
 {say:'On your dashboard, look at the top right corner. Click the round badge with your initials.',li:0,act:async()=>{const a=q('.db .av');await move(a,900);spot(a,8);await click(a);spot(null)}},
 {say:'A small menu opens, with Profile, and Log off.',li:1,act:async()=>{const m=add('<div class="mnu"><div>Profile</div><div class="lo">Log off</div></div>',q('.db .mn'));await anim(m,[{opacity:0,transform:'translateY(-8px)'},{opacity:1,transform:'none'}],350);spot(m,6)}},
 {say:'Click the red Log off.',li:2,act:async()=>{const l=q('.mnu .lo');await move(l,700);spot(l,4);await click(l);hideCursor();spot(null)}},
 {say:'You are back at the sign-in box. Good. Now we ask for a new password.',li:3,act:async()=>{const pg=q('.brw .pg');pg.innerHTML=LOGIN('','');await anim(pg.firstChild,[{opacity:0},{opacity:1}],500)}}]},

// ================= FORGOT PASSWORD =================
{html:()=>HEAD('Change password · 2 of 3','Forgot Password?')+BRW(URL_INT,LOGIN('',''))+PTS(['<b>First</b>, type your email in the Email box.','Leave Password empty.','Click <b>Forgot Password?</b> under the button.','A message says the email was sent. Click <b>OK</b>.'])+`<div class="big red" style="opacity:0">Email box empty? You will see "Enter your email address first." Type your email, then click again.</div>`,
 steps:[
 {say:'This part is important. First, type your email in the Email box. The page needs to know where to send the email.',li:0,act:async()=>{const e=q('.lin.em');await move(e,900);await click(e);hideCursor();await typeIn('.lin.em',EMAIL,55)}},
 {say:'Leave the Password box empty.',li:1,act:async()=>{spot(q('.lin.pw'),6);await wait(900);spot(null)}},
 {say:'Now click Forgot Password, the small blue words under the Sign In button.',li:2,act:async()=>{const f=q('.fp');await move(f,900);spot(f,8);await click(f);hideCursor();spot(null)}},
 {say:'A message pops up: Password reset email sent. Check your inbox. Click OK.',li:3,act:async()=>{const a=add('<div class="alrt"><small>danpoahu.github.io says</small>Password reset email sent. Check your inbox.<div class="aok">OK</div></div>',q('.brw .pg'));await pop(a);await wait(500);const o=q('.alrt .aok');await move(o,700);await click(o);hideCursor();a.remove()}},
 {say:'One tip. If you forget to type your email first, you will see Enter your email address first. No problem. Type your email, and click Forgot Password again.',act:async()=>{const b=q('.big');await anim(b,[{opacity:0},{opacity:1}],400)}}]},

// ================= THE EMAIL =================
{html:()=>HEAD('Change password · 3 of 3','Open the email')+BRW('Your email inbox',`<div class="mail"><div class="ml"><div class="mbh">Inbox</div>
 <div class="mi new">noreply<b>Reset your password for LDAH</b>just now</div><div class="mi">Team<b>Weekly update</b>Mon</div><div class="mi">Calendar<b>Meeting reminder</b>Fri</div></div>
 <div class="mv" style="opacity:0"><h4>Reset your password for LDAH</h4><div class="fr">From: noreply@ldah-932d5.firebaseapp.com</div>
