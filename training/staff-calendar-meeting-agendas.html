<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Staff Calendar: Meeting Agendas — Training</title>
<link rel="stylesheet" href="deck-base.css">
<!-- Same Firebase build as the dashboard, so the deck shares its sign-in and records progress. -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
/* Every class here starts with sc- so nothing collides with deck-base.css. */
.sc-win{position:absolute;left:58px;top:118px;width:712px;height:570px;background:#F4F6F9;border:1px solid #D5DEE8;border-radius:12px;overflow:hidden;box-shadow:0 14px 36px rgba(15,23,42,.16);z-index:4;font-family:"Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:#1E293B}
.sc-pad{position:relative;padding:12px 14px}
/* left menu (the Admin group) */
.sc-side{position:absolute;left:0;top:0;bottom:0;width:200px;background:#fff;border-right:1px solid #E2E8F0;padding:12px 10px}
.sc-side .lg{display:flex;align-items:center;gap:8px;margin:0 0 10px 4px;font-weight:800;color:#0E7490;font-size:15px}
.sc-side .lg img{height:30px}
.sc-gh{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#64748B;padding:9px 8px 4px;border-radius:6px;display:flex;justify-content:space-between;transition:background .3s}
.sc-gh i{font-style:normal;transition:transform .3s}.sc-gh.open i{transform:rotate(90deg)}
.sc-side a{display:block;font-size:12.5px;padding:5px 9px;border-radius:6px;color:#334155;transition:background .3s}
.sc-side a.act{background:#E0F2FE;color:#0E6E8C;font-weight:700}
.sc-agrp{max-height:0;overflow:hidden;transition:max-height .5s ease}.sc-agrp.open{max-height:260px}
.sc-home{position:absolute;left:200px;right:0;top:0;bottom:0;padding:16px 18px}
.sc-home h3{margin:0 0 10px;font-size:19px;color:#0B3A53}
.sc-ghost{background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(15,40,70,.08);height:84px;margin-bottom:10px;padding:12px}
.sc-ghost u{display:block;height:8px;border-radius:4px;background:#E2E8F0;margin-bottom:8px;text-decoration:none}
/* Events Dashboard */
.sc-edh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px}
.sc-edh h3{margin:0;font-size:18px;color:#004E7C;font-weight:800}
.sc-edsub{font-size:9.5px;color:#64748B;margin-top:2px;max-width:230px;line-height:1.3}
.sc-nav{display:flex;align-items:center;gap:5px}
.sc-views{display:inline-flex;border:1px solid #CBD5E1;border-radius:7px;overflow:hidden}
.sc-views span{padding:4px 8px;font-size:10.5px;font-weight:700;color:#475569;background:#fff;transition:background .3s,color .3s}
.sc-views span+span{border-left:1px solid #CBD5E1}
.sc-views span.on{background:#0F766E;color:#fff}
.sc-arr{width:24px;height:24px;border:1px solid #CBD5E1;border-radius:6px;background:#fff;text-align:center;line-height:21px;font-size:15px;color:#334155}
.sc-mon{min-width:128px;text-align:center;font-weight:800;font-size:11.5px;color:#004E7C}
.sc-today{border:1px solid #CBD5E1;background:#fff;border-radius:6px;padding:4px 8px;font-size:10.5px;font-weight:700;color:#334155}
.sc-leg{display:flex;gap:10px;font-size:9px;color:#64748B;margin:0 0 6px;flex-wrap:wrap}
.sc-leg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.sc-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:#E2E8F0;border:1px solid #E2E8F0;border-radius:8px;overflow:hidden}
.sc-dow{background:#F8FAFC;font-size:9px;font-weight:800;color:#64748B;text-align:center;padding:3px 0}
.sc-cell{background:#fff;height:87px;padding:3px 4px;overflow:hidden;position:relative;transition:background .3s}
.sc-grid.wk .sc-cell{height:430px;padding:5px 5px}
.sc-cell.out{background:#FAFBFC}.sc-cell.out .sc-dn{color:#CBD5E1}
.sc-cell.today{background:#F0F9FF}.sc-cell.today .sc-dn{color:#0369A1}
.sc-cell.hov{background:#F8FAFC}
.sc-dn{display:flex;justify-content:space-between;align-items:center;font-size:9.5px;font-weight:700;color:#334155;margin-bottom:2px;height:15px}
.sc-plus{opacity:0;width:16px;height:15px;border-radius:4px;background:#E0F2FE;color:#0369A1;font-size:12px;line-height:14px;text-align:center;transition:opacity .25s}
.sc-cell.hov .sc-plus{opacity:1}
.sc-ev{border-left:3px solid #94A3B8;background:#F8FAFC;border-radius:0 5px 5px 0;padding:2px 4px;margin-bottom:3px}
.sc-et{font-size:8.6px;font-weight:700;color:#1E293B;line-height:1.2}
.sc-em{font-size:7.8px;color:#64748B;margin-top:1px}
.sc-ev.staff{border-left-color:#DC2626;background:#FEF2F2}
.sc-agb{display:inline-block;margin-top:2px;border:1px solid #FCA5A5;background:#fff;color:#B91C1C;border-radius:4px;padding:0 4px;font-size:7.6px;font-weight:800;white-space:nowrap;transition:transform .15s}
.sc-grid.wk .sc-ev{padding:4px 6px;margin-bottom:5px}
.sc-grid.wk .sc-et{font-size:10px}.sc-grid.wk .sc-em{font-size:8.8px}.sc-grid.wk .sc-agb{font-size:8.8px;padding:1px 6px;margin-top:4px}
.sc-day{background:#fff;border:1px solid #E2E8F0;border-radius:8px;padding:14px 16px;height:452px}
.sc-dayh{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sc-dbn{font-size:42px;font-weight:800;color:#0F766E;line-height:1}
.sc-dbw b{display:block;font-size:17px;color:#1E293B}.sc-dbw small{font-size:11px;color:#64748B;font-weight:600}
.sc-dayadd{margin-left:auto;border:1px solid #99F6E4;background:#F0FDFA;color:#0F766E;font-weight:800;font-size:11.5px;padding:6px 13px;border-radius:7px;transition:transform .15s}
.sc-dempty{color:#94A3B8;font-size:12px;padding:20px 0}
.sc-ev.big{border:1px solid #FECACA;border-left:5px solid #DC2626;border-radius:10px;padding:10px 12px;width:300px}
.sc-ev.big .sc-et{font-size:14px}.sc-ev.big .sc-em{font-size:11px;margin-top:3px}.sc-ev.big .sc-agb{font-size:10.5px;padding:4px 10px;margin-top:8px}
.sc-type{display:inline-block;font-size:9.5px;font-weight:800;border-radius:999px;padding:2px 8px;margin-bottom:5px;color:#DC2626;background:rgba(220,38,38,.1)}
/* modals */
.sc-dim{position:absolute;left:58px;top:118px;width:712px;height:570px;background:rgba(15,23,42,.45);border-radius:12px;z-index:13}
.sc-mh{display:flex;align-items:center;gap:8px;padding:9px 14px;background:linear-gradient(90deg,#0E7490,#0891B2);color:#fff;font-weight:800;font-size:15px}
.sc-mh img{height:24px}
.sc-mh .x{margin-left:auto;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.22);text-align:center;line-height:23px;font-size:17px;flex:none}
.sc-mh.red{background:#DC2626}
.sc-fun{position:absolute;left:110px;top:150px;width:600px;background:#fff;border-radius:14px;box-shadow:0 26px 60px rgba(15,23,42,.35);z-index:14;overflow:hidden;font-size:12px;font-family:"Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:#1E293B}
.sc-fdots{display:flex;gap:6px;justify-content:center;align-items:center;margin:12px 0}
.sc-fdots span{width:20px;height:20px;border-radius:50%;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;background:#e2e8f0;color:#64748b}
.sc-fdots span.on{background:#0891B2;color:#fff}.sc-fdots span.dn{background:#67E8F9;color:#fff}
.sc-fdots i{width:18px;height:2px;background:#e2e8f0}
.sc-fb{padding:0 18px 14px}
.sc-fttl{text-align:center;font-size:14px;font-weight:700;color:#0f172a}
.sc-fttl.bl{color:#0891B2}
.sc-fsub{text-align:center;font-size:11px;color:#64748B;margin:2px 0 12px}
.sc-zone{border:2px dashed #0891B2;background:#F0FDFF;border-radius:12px;padding:26px;text-align:center;color:#0891B2;font-weight:700;font-size:12.5px}
.sc-zone small{display:block;font-weight:400;color:#64748B;font-size:10.5px;margin-top:4px}
.sc-ffoot{display:flex;justify-content:flex-end;padding:10px 18px;border-top:1px solid #E2E8F0}
.sc-fbtn{border-radius:8px;padding:7px 14px;font-weight:800;font-size:12px;background:#0891B2;color:#fff;transition:transform .15s}
.sc-tc{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.sc-tcard{border:2px solid #e2e8f0;border-radius:11px;padding:10px 11px;background:#fff;transition:transform .15s}
.sc-tcard b{display:block;font-size:12.5px;color:#0f172a;margin-top:5px}
.sc-tcard b i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.sc-tcard small{display:block;font-size:10px;color:#64748b;margin-top:2px;line-height:1.35}
.sc-tcard .ic{display:block;width:22px;height:22px;border-radius:6px}
.sc-tcard.staff{border-color:#DC2626;background:#FEF2F2}
/* the staff calendar form */
.sc-form{position:absolute;left:90px;top:120px;width:620px;background:#fff;border-radius:14px;box-shadow:0 26px 60px rgba(15,23,42,.35);z-index:14;overflow:hidden;font-size:12px;font-family:"Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:#1E293B}
.sc-fvp{height:520px;overflow:hidden;position:relative}
.sc-fin{padding:12px 16px 14px;transition:transform .6s cubic-bezier(.45,.05,.25,1)}
.sc-note{font-size:11px;color:#991B1B;background:#FEF2F2;border-radius:8px;padding:7px 10px}
.sc-l{display:block;font-size:10.5px;font-weight:700;color:#334155;margin:8px 0 3px}
.sc-i{border:1px solid #CBD5E1;border-radius:7px;padding:0 9px;height:28px;line-height:27px;font-size:12px;background:#fff;white-space:nowrap;overflow:hidden;color:#0F172A;position:relative;transition:border-color .3s,box-shadow .3s}
.sc-i.ph{color:#94A3B8}
.sc-i.sel{padding-right:22px}.sc-i.sel::after{content:"▾";position:absolute;right:8px;color:#64748B}
.sc-i.foc,.sc-agta.foc,.sc-notes.foc{border-color:#DC2626;box-shadow:0 0 0 3px rgba(220,38,38,.15)}
.sc-i.typing::after,.sc-agta.typing::after,.sc-notes.typing::after{content:"|";color:#DC2626;animation:blink .6s steps(1) infinite}
.sc-r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.sc-r2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.sc-hint{font-size:9.5px;color:#64748B;margin-top:3px}
.sc-ta{border:1px solid #CBD5E1;border-radius:7px;padding:6px 9px;font-size:12px;height:46px;background:#fff}
.sc-agbox{margin-top:10px;border:1px solid #FECACA;border-radius:10px;padding:9px 11px;background:#FFFBFB}
.sc-tick{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:#334155}
.sc-cbx{width:15px;height:15px;border:2px solid #94A3B8;border-radius:3px;background:#fff;position:relative;flex:none;transition:all .2s}
.sc-cbx.on{background:#2563EB;border-color:#2563EB}.sc-cbx.on::after{content:"";position:absolute;left:3px;top:0;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.sc-agw{display:none}.sc-agw.on{display:block}
.sc-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.sc-chip{border:1px solid #CBD5E1;background:#fff;color:#334155;border-radius:999px;padding:3px 9px;font-size:10.5px;font-weight:700;transition:background .2s,color .2s,border-color .2s}
.sc-chip.on{background:#DC2626;border-color:#DC2626;color:#fff}
.sc-series{font-size:10.5px;color:#991B1B;background:#FEF2F2;border-radius:8px;padding:6px 10px;margin-top:10px}
.sc-ffoot2{display:flex;gap:7px;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid #e2e8f0}
.sc-del{background:#fff;color:#DC2626;border:1px solid #FCA5A5;border-radius:7px;padding:6px 10px;font-weight:700;font-size:11px;transition:background .2s,color .2s,transform .15s}
.sc-del.armed{background:#DC2626;color:#fff;border-color:#DC2626}
.sc-cancel{border:1px solid #CBD5E1;background:#fff;color:#334155;border-radius:7px;padding:6px 14px;font-weight:700;font-size:11.5px}
.sc-save{background:#DC2626;color:#fff;border-radius:7px;padding:6px 18px;font-weight:800;font-size:11.5px;transition:transform .15s}
.sc-dd{position:absolute;left:0;background:#fff;border:1px solid #CBD5E1;border-radius:7px;box-shadow:0 12px 26px rgba(15,23,42,.2);z-index:20;font-size:11.5px;padding:3px 0;opacity:0;white-space:nowrap}
.sc-dd div{padding:5px 12px;transition:background .2s,color .2s}.sc-dd div.hi{background:#DC2626;color:#fff}
/* My Day */
.sc-md{position:absolute;left:58px;top:126px;width:712px;background:#fff;border-radius:16px;box-shadow:0 14px 34px rgba(15,23,42,.14);overflow:hidden;font-family:"Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:#1E293B}
.sc-mdh{display:flex;align-items:center;gap:12px;padding:15px 18px;background:linear-gradient(120deg,#0e2f52 0%,#155e8c 55%,#0e9aac 130%);color:#fff}
.sc-mdh h3{margin:0;font-size:21px}.sc-mdh .hs{font-size:12px;opacity:.85;margin-top:2px}
.sc-who{margin-left:auto;font-size:12px;font-weight:700;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:5px 12px}
.sc-sect{padding:12px 18px 8px}.sc-sect h4{margin:0;font-size:15px;color:#0B3A53}
.sc-todos{padding:0 18px 16px;display:flex;flex-direction:column;gap:8px}
.sc-todo{display:grid;grid-template-columns:20px 1fr;gap:11px;align-items:start;padding:10px 12px;background:#fff;border:1px solid rgba(8,145,178,.14);border-left:4px solid #DC2626;border-radius:12px;transition:opacity .4s}
.sc-todo.plain{border-left-color:#94A3B8;opacity:.75}
.sc-todo.done{opacity:.55;border-left-color:#16A34A}.sc-todo.done .sc-ttl{text-decoration:line-through}
.sc-chk{width:18px;height:18px;border:2px solid rgba(100,116,139,.45);border-radius:5px;background:#fff;display:grid;place-items:center;margin-top:1px}
.sc-todo.done .sc-chk{background:#16A34A;border-color:#16A34A}.sc-todo.done .sc-chk::before{content:"✓";color:#fff;font-size:12px;font-weight:800}
.sc-ttl{font-weight:700;font-size:13.5px;color:#0F172A;line-height:1.3}
.sc-tnote{font-size:11.5px;color:#334155;background:#F8FAFC;border-radius:8px;padding:7px 10px;margin-top:7px;line-height:1.55}
.sc-open{display:inline-block;margin-top:8px;background:#DC2626;color:#fff;font-weight:800;font-size:11.5px;border-radius:7px;padding:6px 12px;transition:transform .15s}
/* agenda window */
.sc-ag{position:absolute;left:80px;top:124px;width:650px;background:#fff;border-radius:14px;box-shadow:0 26px 60px rgba(15,23,42,.35);z-index:14;overflow:hidden;font-size:12px;font-family:"Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:#1E293B}
.sc-agbd{padding:12px 16px 14px}
.sc-h4{margin:12px 0 5px;font-size:11px;color:#991B1B;text-transform:uppercase;letter-spacing:.05em;font-weight:800}
.sc-row{display:flex;align-items:flex-start;gap:7px;padding:6px 9px;border:1px solid #E2E8F0;border-radius:7px;margin-bottom:5px;background:#fff;font-size:12px}
.sc-row .n{font-weight:800;color:#DC2626;min-width:14px}
.sc-row .t{flex:1}
.sc-row .by{font-size:10px;color:#64748B;white-space:nowrap}
.sc-row a{flex:1;font-weight:700;color:#0F766E;text-decoration:underline}
.sc-x{color:#94A3B8;font-size:14px;line-height:1;padding:0 3px}
.sc-add{display:flex;gap:7px;margin-top:5px}
.sc-agta{flex:1;border:1px solid #CBD5E1;border-radius:7px;padding:7px 9px;font-size:12px;min-height:36px;color:#0F172A;background:#fff;transition:border-color .3s,box-shadow .3s}
.sc-agta.ph,.sc-notes.ph{color:#94A3B8}
.sc-btn{display:inline-block;background:#DC2626;color:#fff;border-radius:7px;padding:7px 13px;font-weight:800;font-size:11.5px;white-space:nowrap;align-self:flex-start;transition:transform .15s}
.sc-btn.ghost{background:#fff;color:#B91C1C;border:1px solid #FCA5A5}
.sc-muted{font-size:11px;color:#94A3B8}
.sc-sent{font-size:11px;color:#166534;background:#F0FDF4;border-radius:7px;padding:6px 10px;margin-bottom:8px}
.sc-notes{border:1px solid #CBD5E1;border-radius:7px;padding:7px 9px;font-size:12px;height:72px;background:#fff;line-height:1.45;white-space:pre-line;transition:border-color .3s,box-shadow .3s}
/* file picker + new tab */
.sc-pick{position:absolute;left:300px;top:300px;width:380px;background:#fff;border-radius:12px;box-shadow:0 26px 60px rgba(15,23,42,.4);z-index:18;overflow:hidden;font-size:12px;opacity:0;font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.sc-pkh{background:#F1F5F9;padding:8px 12px;font-weight:700;color:#334155;border-bottom:1px solid #E2E8F0}
.sc-pkr{display:flex;align-items:center;gap:9px;padding:8px 12px;border-bottom:1px solid #F1F5F9;transition:background .2s}
.sc-pkr.hi{background:#DBEAFE}
.sc-fi{background:#DC2626;color:#fff;font-size:9px;font-weight:900;border-radius:3px;padding:3px 5px}
.sc-fi.doc{background:#2563EB}
.sc-pkf{display:flex;justify-content:flex-end;gap:8px;padding:9px 12px}
.sc-tabw{position:absolute;left:100px;top:150px;width:620px;height:520px;background:#fff;border-radius:12px;box-shadow:0 30px 70px rgba(15,23,42,.45);z-index:20;overflow:hidden;opacity:0;font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.sc-tabs2{display:flex;gap:4px;background:#E2E8F0;padding:7px 10px 0}
.sc-tb{font-size:11px;padding:6px 14px;border-radius:8px 8px 0 0;color:#475569;background:#CBD5E1}
.sc-tb.on{background:#fff;color:#0F172A;font-weight:700}
.sc-url{font-size:11px;color:#475569;background:#fff;padding:7px 12px;border-bottom:1px solid #E2E8F0}
.sc-url span{display:block;background:#F1F5F9;border-radius:12px;padding:4px 12px}
.sc-pdf{position:absolute;left:0;right:0;top:66px;bottom:0;background:#525659;display:flex;justify-content:center;padding-top:18px}
.sc-page{width:330px;height:430px;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.4);padding:26px 28px;font-family:Georgia,"Times New Roman",serif;color:#0F172A}
.sc-page h5{margin:0;font-size:19px}.sc-page small{display:block;color:#475569;font-size:11px;margin:4px 0 14px}
.sc-page ol{margin:0;padding-left:18px;font-size:13px;line-height:2}
.sc-page hr{border:0;border-top:1px solid #CBD5E1;margin:14px 0}
.sc-page p{font-size:11px;color:#475569;margin:0}
/* right-hand panels and intro cards */
.sc-pn{position:absolute;background:#fff;border-radius:14px;box-shadow:0 8px 22px rgba(15,23,42,.1);padding:12px 16px;font-size:16px;line-height:1.4;opacity:0;font-family:"Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.sc-pn h4{margin:0 0 8px;font-size:13px;color:#0B3A53;text-transform:uppercase;letter-spacing:.05em}
.sc-pn.y{background:#FEF3C7;border-left:6px solid #F59E0B;box-shadow:none}
.sc-pn.g{background:#ECFDF5;border-left:6px solid #16A34A;box-shadow:none}
.sc-why{position:absolute;left:70px;top:132px;width:1140px;display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.sc-wc{background:#fff;border-radius:16px;box-shadow:0 10px 26px rgba(15,23,42,.1);padding:16px 18px;border-top:8px solid #DC2626;opacity:0;height:330px;position:relative;overflow:hidden}
.sc-wc.t{border-top-color:#0891B2}.sc-wc.g{border-top-color:#16A34A}
.sc-wc .when{font-size:13px;font-weight:800;color:#D63384;letter-spacing:.06em;text-transform:uppercase}
.sc-wc h4{margin:2px 0 10px;font-size:22px;color:#0B3A53}
.sc-wc p{font-size:17px;color:#475569;line-height:1.4;margin:0;position:absolute;left:18px;right:18px;bottom:16px}
.sc-wc p b{color:#0F172A}
.sc-art{position:relative;height:150px}

.sc-cv2{position:absolute;left:860px;top:420px;width:330px;background:#fff;border-radius:12px;box-shadow:0 20px 40px rgba(0,0,0,.3);padding:12px 14px;color:#1E293B;transform:rotate(-4deg);animation:bob 5s 1s ease-in-out infinite;z-index:4;font-family:"Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}

.qz-stars i.on{background:#F59E0B;animation:popn .6s}

<div id="view"><div id="stage"><div id="nbar"><i></i></div>
<div id="scenes"></div>
<div id="spot"></div>

</div></div>

</div>
<script>
const DECK_ID='staff-calendar-meeting-agendas';

/* Every screen below is drawn in HTML/CSS from DAN's Events Dashboard, the Add Event
   picker, the Staff Calendar only form and the meeting agenda window
   (STAGE index.html v154.30-v154.35, 2026-11-06). Every person here is made up. */
const LOGO='../logo_blue.png';
const LOGO_T='../logo_transparent.png';
const PEOPLE=['Malia Kahale','Kai Akana','Leah Nakoa','Ben Ito','Pua Medeiros','Jordan Lee','Keoni Silva'];
const LEAD=['Malia Kahale','Kai Akana','Leah Nakoa','Ben Ito'];
const ITEMS2=[['Budget for December','Malia Kahale'],['Holiday office hours','Kai Akana']];
const ITEMS3=ITEMS2.concat([['Volunteer fair booth staffing','Leah Nakoa']]);
const FILE=['Leadership Agenda Nov 11.pdf','Malia Kahale'];

const tap=async(s,ms=850)=>{const e=typeof s==='string'?q(s):s;await move(e,ms);await click(e);return e};
function all(s){return[...document.querySelectorAll('.scene.on '+s)]}
const show=(e,ms=500)=>anim(e,[{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],ms,'ease-out').then(()=>{e.style.opacity=1});
const PTS=(items,top=140)=>`<div class="abs" style="left:790px;top:${top}px;width:440px"><ul class="pts">${items.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
const LOGOBOX=`<div style="position:absolute;left:70px;top:22px;background:#fff;border-radius:14px;padding:6px 10px;box-shadow:0 4px 14px rgba(0,0,0,.18);animation:rise .6s both"><img src="${LOGO}" alt="LDAH" style="height:80px;display:block"></div>`;
/* a rectangle around several elements, for spot() */
function around(els){const r=els.map(pos);const x=Math.min(...r.map(p=>p.x)),y=Math.min(...r.map(p=>p.y));return{x,y,w:Math.max(...r.map(p=>p.x+p.w))-x,h:Math.max(...r.map(p=>p.y+p.h))-y}}
/* scroll a modal's inner page to its end (or by px) */
async function scrollIn(px){const f=q('.sc-fin'),vp=q('.sc-fvp');if(!f||!vp)return;const d=px==null?Math.max(0,f.scrollHeight-vp.clientHeight):px;f.style.transform=`translateY(${-d}px)`;await wait(650)}
/* open a drawn select, pick an option */
async function choose(field,opts,pick){await tap(field,800);field.classList.add('foc');const dd=document.createElement('div');dd.className='sc-dd';dd.innerHTML=opts.map(o=>`<div>${o}</div>`).join('');
 const p=field.parentElement;p.style.position='relative';dd.style.top=(field.offsetTop+field.offsetHeight+2)+'px';dd.style.minWidth=field.offsetWidth+'px';p.appendChild(dd);
 await anim(dd,[{opacity:0,transform:'translateY(-6px)'},{opacity:1,transform:'none'}],250,'ease-out');dd.style.opacity=1;
 const it=[...dd.children][opts.indexOf(pick)];await move(it,600);it.classList.add('hi');await click();await wait(250);field.textContent=pick;field.classList.remove('ph','foc');dd.remove()}

/* ================= THE EVENTS DASHBOARD ================= */
const OTHER={5:['Connect-Gen','#16A34A','11:00 AM · Oahu'],12:['Learning Labs: IEP Basics','#0891B2','6:00 PM · Virtual'],14:['Keiki Fun Fair','#92400E','Hilo'],19:['Parent Talk Cafe','#F97316','7:00 PM · Facebook'],21:['Hearing Screening','#7C3AED','Waianae']};
const agTxt=n=>`Agenda · ${n} item${n===1?'':'s'}`;
function EV(d,o){let h='';
 if(OTHER[d]){const e=OTHER[d];h+=`<div class="sc-ev k-o${d}" style="border-left-color:${e[1]}"><div class="sc-et">${e[0]}</div><div class="sc-em">${e[2]}</div></div>`}
 if(o.meet&&d>=11&&d<=30&&d%7===4){const n=(o.n&&o.n[d])||0;h+=`<div class="sc-ev staff k-m${d}"><div class="sc-et">Leadership Meeting</div><div class="sc-em">9:00 AM – 10:00 AM</div><span class="sc-agb k-ag${d}">${agTxt(n)}</span></div>`}
 if(d===26)h+=`<div class="sc-ev staff k-closed"><div class="sc-et">Office closed</div><div class="sc-em">All day</div></div>`;
 return h}
function MONTH(o){let h='<div class="sc-grid">'+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(n=>`<div class="sc-dow">${n}</div>`).join('');
 for(let d=1;d<=35;d++){const out=d>30,dn=out?d-30:d;h+=`<div class="sc-cell${out?' out':''}${d===6?' today':''} k-c${out?'x'+dn:d}"><div class="sc-dn"><span>${dn}</span>${out?'':'<b class="sc-plus k-plus'+d+'">+</b>'}</div>${out?'':EV(d,o)}</div>`}
 return h+'</div>'}
function WEEK(o){const L=['Sun, Nov 8','Mon, Nov 9','Tue, Nov 10','Wed, Nov 11','Thu, Nov 12','Fri, Nov 13','Sat, Nov 14'];let h='<div class="sc-grid wk">'+L.map(n=>`<div class="sc-dow">${n}</div>`).join('');
 for(let d=8;d<=14;d++)h+=`<div class="sc-cell k-c${d}"><div class="sc-dn"><span>${d}</span><b class="sc-plus">+</b></div>${EV(d,o)}</div>`;return h+'</div>'}
function DAY(o){return `<div class="sc-day"><div class="sc-dayh"><span class="sc-dbn">11</span><span class="sc-dbw"><b>Wednesday</b><small>November 2026</small></span><span class="sc-dayadd k-dayadd">+ Add</span></div>
 <div class="k-dcards">${o.meet?`<div class="sc-ev staff big k-m11"><span class="sc-type">Staff Calendar only</span><div class="sc-et">Leadership Meeting</div><div class="sc-em">9:00 AM – 10:00 AM</div><span class="sc-agb k-ag11">${agTxt(0)}</span></div>`:'<div class="sc-dempty">Nothing on this day.</div>'}</div></div>`}
const LABEL={month:'November 2026',week:'Nov 8 – Nov 14, 2026',day:'Wednesday, November 11, 2026'};
const LEG=[['Connect-Gen','#16A34A'],['Learning Labs','#0891B2'],['Parent Talk Cafe','#F97316'],['Outreach Booth','#92400E'],['Screening','#7C3AED'],['Staff Calendar only','#DC2626']];
function CAL(o={}){const v=o.view||'month';return `<div class="sc-win k-cal"><div class="sc-pad"><div class="sc-edh"><div><h3>Events Dashboard</h3><div class="sc-edsub">Who is presenting what. Pick a presenter on any session to assign or change it.</div></div>
 <div class="sc-nav"><div class="sc-views k-views">${['Day','Week','Month'].map(x=>`<span class="k-v${x}${x.toLowerCase()===v?' on':''}">${x}</span>`).join('')}</div><span class="sc-arr k-prev">‹</span><span class="sc-mon k-mon">${LABEL[v]}</span><span class="sc-arr k-next">›</span><span class="sc-today k-today">Today</span><span class="sc-today k-print">Print</span></div></div>
 <div class="sc-leg">${LEG.map(l=>`<span><i style="background:${l[1]}"></i>${l[0]}</span>`).join('')}</div>${v==='month'?MONTH(o):v==='week'?WEEK(o):DAY(o)}</div></div>`}
/* DAN's left menu, before the calendar opens */
const MENU=()=>`<div class="sc-win k-menu"><div class="sc-side"><div class="lg"><img src="${LOGO}" alt="LDAH">DAN</div>
 <div class="sc-gh open">Dashboard <i>›</i></div><a class="act">Home</a><a>Interactions</a><a>Contacts</a><a>Reports</a><a>Training Videos</a>
 <div class="sc-gh k-admh">Admin <i>›</i></div><div class="sc-agrp k-agrp"><a class="k-edlink">Events Dashboard</a><a>Emergency Contacts</a><a>User Roles</a><a>List Management</a><a>Email Log</a></div></div>
 <div class="sc-home"><h3>Home</h3><div class="sc-ghost"><u style="width:40%"></u><u style="width:70%"></u><u style="width:55%"></u></div><div class="sc-ghost"><u style="width:30%"></u><u style="width:62%"></u></div><div class="sc-ghost"><u style="width:48%"></u><u style="width:66%"></u></div></div></div>`;

/* ================= ADD EVENT (the type picker) ================= */
const DOTS=n=>`<div class="sc-fdots">${[1,2,3].map(i=>`<span class="${i===n?'on':i<n?'dn':''}">${i}</span>`).join('<i></i>')}</div>`;
const FUN1=()=>`<div class="sc-dim"></div><div class="sc-fun k-fun"><div class="sc-mh"><img src="${LOGO_T}" alt="LDAH"><span>Add Event</span><span class="x">×</span></div>${DOTS(1)}
 <div class="sc-fb"><div class="sc-fttl bl">Start with the flyer</div><div class="sc-fsub">Upload the event flyer. DAN reads it, fills in the details, and guesses the event type.</div>
 <div class="sc-zone">Click to upload a flyer, or drag and drop<small>JPG, PNG, WebP, or PDF · max 6 MB</small></div></div>
 <div class="sc-ffoot"><span class="sc-fbtn k-skip">No flyer — skip →</span></div></div>`;
const ICON=c=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>`;
const DOT=c=>`<span class="ic" style="background:${c}22;border:2px solid ${c}"></span>`;
const FUN2=()=>`<div class="sc-dim"></div><div class="sc-fun k-fun"><div class="sc-mh"><img src="${LOGO_T}" alt="LDAH"><span>Add Event</span><span class="x">×</span></div>${DOTS(2)}
 <div class="sc-fb"><div class="sc-fttl">What kind of event is this?</div><div class="sc-fsub">Pick a type. The right editor opens next, pre-filled.</div><div class="sc-tc">
 <div class="sc-tcard">${DOT('#7C3AED')}<b><i style="background:#7C3AED"></i>Screening</b><small>Booth with the full screening-consent QR form.</small></div>
 <div class="sc-tcard">${DOT('#4F46E5')}<b><i style="background:#4F46E5"></i>Remote Signup</b><small>Off-site in-person event that takes RSVPs or signups.</small></div>
 <div class="sc-tcard">${DOT('#92400E')}<b><i style="background:#92400E"></i>Outreach Booth</b><small>Booth or table with a simple QR signup form.</small></div>
 <div class="sc-tcard staff k-staff">${ICON('#DC2626')}<b><i style="background:#DC2626"></i>Staff Calendar only</b><small>Shows on the DAN calendars only. Never on the website or the app. No signups.</small></div>
 </div></div></div>`;

/* ================= THE STAFF CALENDAR FORM ================= */
const FORM=(o={})=>{const v=o.v||{};const rep=v.rep||'Does not repeat';const on=rep!=='Does not repeat';const picked=o.picked||LEAD;
 return `<div class="sc-dim"></div><div class="sc-form k-form"><div class="sc-mh red"><img src="${LOGO_T}" alt="LDAH"><span>${o.edit?'Staff Calendar only entry':'Add to the staff calendar'}</span><span class="x">×</span></div>
 <div class="sc-fvp"><div class="sc-fin">
 <div class="sc-note k-note">Shows on the DAN calendars only. It never appears on the website or the app, and nobody is emailed.</div>
 <div><span class="sc-l">Title *</span><div class="sc-i k-title${v.title?'':' ph'}">${v.title||' '}</div></div>
 <div class="sc-r3"><div><span class="sc-l">Date *</span><div class="sc-i k-date${v.date?'':' ph'}">${v.date||'mm/dd/yyyy'}</div></div><div><span class="sc-l">Start time</span><div class="sc-i k-start${v.start?'':' ph'}">${v.start||'--:-- --'}</div></div><div><span class="sc-l">End time</span><div class="sc-i k-end${v.end?'':' ph'}">${v.end||'--:-- --'}</div></div></div>
 <div class="sc-r2"><div><span class="sc-l">Repeats</span><div class="sc-i sel k-rep">${rep}</div></div><div class="k-untilw" style="visibility:${on?'visible':'hidden'}"><span class="sc-l">Until</span><div class="sc-i ph k-until">mm/dd/yyyy</div><div class="sc-hint">Leave blank to keep going.</div></div></div>
 <div class="sc-hint k-reptext" style="min-height:13px;font-weight:700;color:#991B1B">${on?'Every Wednesday':''}</div>
 <div><span class="sc-l">Place</span><div class="sc-i ph k-place"> </div></div>
 <div class="sc-agbox k-agbox"><div class="sc-tick"><span class="sc-cbx${o.ag?' on':''} k-cb"></span><span class="k-ticktxt">Meeting with an agenda: people add items each week</span></div>
  <div class="sc-agw${o.ag?' on':''} k-agw"><span class="sc-l">Participants</span><div class="sc-chips k-chips">${PEOPLE.map(p=>`<span class="sc-chip${picked.includes(p)?' on':''}" data-p="${p}">${p}</span>`).join('')}</div><div class="sc-hint k-phint">Each gets a task on Monday morning to add their items.</div>
  <div style="width:260px"><span class="sc-l">Finished agenda goes to</span><div class="sc-i sel k-to">${o.to||'Kai Akana'}</div></div><div class="sc-hint k-thint">As a task at 3pm the day before the meeting.</div></div></div>
 <div><span class="sc-l">Notes</span><div class="sc-ta k-notes"></div></div>
 ${o.edit?'<div class="sc-series k-series">This entry repeats. Saving changes every date. The date above is the first one.</div>':''}
 <div class="sc-ffoot2">${o.edit?'<span class="k-dels" style="display:flex;gap:7px"><span class="sc-del k-delone">Delete Wed, Nov 18 only</span><span class="sc-del k-delall">Delete every date</span></span>':''}<span style="flex:1"></span><span class="sc-cancel">Cancel</span><span class="sc-save k-save">Save</span></div>
 </div></div></div>`};
const FILLED={title:'Leadership Meeting',date:'11/11/2026',start:'09:00 AM',end:'10:00 AM',rep:'Every week'};

/* ================= MY DAY ================= */
const MD=(who,when,tasks)=>`<div class="sc-md k-md"><div class="sc-mdh"><div><h3>My Day</h3><div class="hs">${when}</div></div><div class="sc-who">${who}</div></div><div class="sc-sect"><h4>Things to do today</h4></div><div class="sc-todos">${tasks}</div></div>`;
const T_MON=(done)=>`<div class="sc-todo k-tmon${done?' done':''}"><span class="sc-chk"></span><div><div class="sc-ttl k-tttl">Add your agenda items for Leadership Meeting (Wednesday, November 11)</div>
 <div class="sc-tnote"><span class="k-steps">1. Press Open agenda.<br>2. Type each thing you want to talk about and press Add.<br>3. Tick this task done.</span><br><span class="k-goes">The agenda goes to Malia Kahale at 3pm on Tuesday, November 10.</span></div><span class="sc-open k-open">Open agenda →</span></div></div>`;
const T_FILL=t=>`<div class="sc-todo plain"><span class="sc-chk"></span><div><div class="sc-ttl">${t}</div></div></div>`;
const T_SENT=()=>`<div class="sc-todo k-tsent"><span class="sc-chk"></span><div><div class="sc-ttl k-tttl">Agenda for Leadership Meeting (Wednesday, November 11): 3 items</div>
 <div class="sc-tnote k-tlist">3 items are on the agenda. Press Open agenda to read them, build the master agenda, upload it there for everyone in the meeting, and take meeting notes.</div><span class="sc-open k-open">Open agenda →</span></div></div>`;

/* ================= THE AGENDA WINDOW ================= */
const IROW=(it,i,me)=>`<div class="sc-row k-it${i}"><span class="n">${i+1}.</span><span class="t">${it[0]}</span><span class="by">${it[1]}</span>${it[1]===me?'<span class="sc-x k-x">×</span>':''}</div>`;
const FROW=(f,me)=>`<div class="sc-row k-file"><a class="k-fname">${f[0]}</a><span class="by">${f[1]}</span>${f[1]===me?'<span class="sc-x">×</span>':''}</div>`;
const AG=(o={})=>{const items=o.items||[],files=o.files||[],me=o.me||'';
 return `${o.nodim?'':'<div class="sc-dim"></div>'}<div class="sc-ag k-agwin"><div class="sc-mh red k-agh"><img src="${LOGO_T}" alt="LDAH"><span>Leadership Meeting — Wed, Nov 11</span><span class="x">×</span></div><div class="sc-agbd">
 ${o.sent?'<div class="sc-sent k-sent">Sent to Malia Kahale. Items added now still show here.</div>':''}
 <div class="k-base"><div class="sc-h4" style="margin-top:0">Base agenda</div><div class="k-files">${files.length?files.map(f=>FROW(f,me)).join(''):'<div class="sc-muted">No base agenda uploaded for this date yet.</div>'}</div>
 <div style="margin-top:6px"><span class="sc-btn ghost k-up">Upload base agenda</span></div></div>
 <div class="k-itemsec"><div class="sc-h4 k-ih">Items (${items.length})</div><div class="k-items">${items.length?items.map((it,i)=>IROW(it,i,me)).join(''):'<div class="sc-muted">Nobody has added an item yet.</div>'}</div></div>
 <div class="sc-add"><div class="sc-agta ph k-new">Something you want to talk about</div><span class="sc-btn k-add">Add</span></div>
 <div class="k-notesec"><div class="sc-h4">Meeting notes</div><div class="sc-notes${o.notes?'':' ph'} k-notes">${o.notes||'Notes from the meeting'}</div>
 <div style="display:flex;align-items:center;gap:10px;margin-top:6px"><span class="sc-btn k-savenotes">Save notes</span><span class="sc-muted k-nmsg">${o.notesBy?'Last saved by '+o.notesBy:''}</span></div></div>
 </div></div>`};
const PICK=()=>`<div class="sc-pick k-pick"><div class="sc-pkh">Choose a file</div><div class="sc-pkr k-pf1"><span class="sc-fi">PDF</span>Leadership Agenda Nov 11.pdf</div><div class="sc-pkr"><span class="sc-fi doc">DOC</span>Leadership Agenda Nov 4.docx</div><div class="sc-pkr"><span class="sc-fi doc">DOC</span>Budget notes.docx</div><div class="sc-pkf"><span class="sc-cancel">Cancel</span><span class="sc-fbtn k-pkopen">Open</span></div></div>`;
const TAB=()=>`<div class="sc-tabw k-tabw"><div class="sc-tabs2"><span class="sc-tb">DAN</span><span class="sc-tb on">Leadership Agenda Nov 11.pdf</span></div><div class="sc-url"><span>Leadership Agenda Nov 11.pdf</span></div>
 <div class="sc-pdf"><div class="sc-page"><h5>Leadership Meeting</h5><small>Wednesday, November 11 · 9:00 AM – 10:00 AM</small><ol>${ITEMS3.map(i=>`<li>${i[0]}</li>`).join('')}<li>Updates from each program</li></ol><hr><p>Next meeting: Wednesday, November 18</p></div></div></div>`;

/* ---- quiz: the standard ask()/QUIZ pair. Each answer goes to ldahTrack.quiz(sec,i,correct). ---- */
window.QUIZ_TOTAL=3;
function ask(Q,i,sec){const w=q('.qz-wrap');
 w.innerHTML=`<div class="qz-card"><div class="qz-n">Question ${i+1} of 3</div><div class="qz-q">${Q.q}</div>${Q.o.map((o,j)=>`<button class="qz-o" data-j="${j}"><span class="qz-L">${'ABC'[j]}</span><span>${o}</span></button>`).join('')}<div class="qz-fb"></div></div>`;
 const card=w.firstChild,fb=card.querySelector('.qz-fb'),btns=[...card.querySelectorAll('.qz-o')];
 const finish=()=>{btns.forEach(b=>b.disabled=true);btns[Q.a].classList.add('qz-yes');const st=document.querySelectorAll('.scene.on .qz-stars i')[i];if(st)st.classList.add('on');fb.className='qz-fb good';fb.textContent='Yes! '+Q.y};
 if(FAST){finish();return Promise.resolve()}
 return new Promise(res=>{btns.forEach((b,j)=>b.onclick=async()=>{
  if(b.disabled)return;
  if(window.ldahTrack)ldahTrack.quiz(sec,i,j===Q.a);
  if(j===Q.a){finish();const p=pos(b);confetti(p.x+60,p.y+20,70);await speak('Yes! '+Q.y,run);await wait(700);res()}
  else{b.disabled=true;b.classList.add('qz-no');fb.className='qz-fb bad';fb.textContent='Not quite. '+Q.n+' Try again.';speak('Not quite. '+Q.n+' Try again.',run)}})})}
const QUIZ=(sec,qs)=>({cls:'quiz',html:()=>HEAD('Quick check','Your turn!')+`<div class="qz-stars">${qs.map(()=>'<i></i>').join('')}</div><div class="qz-wrap"><div class="qz-intro">Three quick questions.<small>Your first answer to each one counts. Click the answer you think is right.</small></div></div>`,
 steps:[{say:'Quick check. Three quick questions. Your first answer to each one counts.'},
  ...qs.map((Q,i)=>({say:`Question ${i+1}. ${Q.q}`,act:()=>ask(Q,i,sec)}))]});
