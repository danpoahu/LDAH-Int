.pp2 .tag{position:absolute;left:-10px;top:40px;z-index:2;background:#fff;border:2px solid #DB2777;color:#DB2777;font-size:10px;font-weight:900;border-radius:6px;padding:0 4px;white-space:nowrap}
.eq{position:absolute;left:790px;top:170px;font-size:44px;font-weight:900;color:#0B3A53;line-height:1.35}

.dy{left:80px;background:#FDF2F8;border:3px solid #DB2777}.dn{left:680px;background:#F1F5F9;border:3px solid #94A3B8}
.dy h5,.dn h5{margin:0 0 8px;font-size:23px}.dy h5{color:#DB2777}.dn h5{color:#475569}
.ex{background:#fff;border-radius:10px;padding:7px 12px;margin-top:8px;font-size:16.5px;box-shadow:0 4px 10px rgba(15,23,42,.08);opacity:0}
.arr{position:absolute;font-size:44px;font-weight:900;opacity:0}
/* quick add */
.qa{position:absolute;left:58px;top:118px;width:620px;background:#fff;border-radius:14px;box-shadow:0 18px 44px rgba(15,23,42,.2);padding:14px 16px}
.qa h5{margin:0 0 8px;font-size:15px}.qa .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}

.ccd{display:flex;gap:14px;align-items:center;background:#fff;border-radius:14px;padding:14px 18px;box-shadow:0 8px 22px rgba(15,23,42,.08);border-left:6px solid #7C3AED;font-size:19px;opacity:0;transform:scale(.9);transition:all .45s}
.ccd.on{opacity:1;transform:none}
.ccd i{flex:none;width:40px;height:40px;border-radius:50%;background:#7C3AED;color:#fff;font-style:normal;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:20px}
.ccd.no{border-left-color:#94A3B8}.ccd.no i{background:#94A3B8}
.ccd b{display:block}.ccd small{display:block;font-size:15px;color:#475569}
/* filter fan-out */
.fan{position:absolute;left:70px;top:140px;width:1140px;height:520px}
.fcenter{position:absolute;left:440px;top:190px;width:260px;padding:18px;border-radius:999px;background:#7C3AED;color:#fff;font-weight:900;font-size:24px;text-align:center;box-shadow:0 14px 34px rgba(124,58,237,.35)}

/* ---------- quiz ---------- */
.scene.quiz{background:linear-gradient(135deg,#FFF1F8,#E0F7FA)}
.qwrap{position:absolute;left:0;top:0;right:0;bottom:0}

.qintro small{display:block;font-size:20px;color:#475569;font-weight:700;margin-top:14px}
.qcard{position:absolute;left:120px;top:138px;width:1040px;background:#fff;border-radius:20px;box-shadow:0 18px 40px rgba(15,23,42,.14);padding:22px 30px;animation:rise .5s both}
.qn{font-size:14px;font-weight:900;color:var(--pink);letter-spacing:.08em;text-transform:uppercase}

.qo:hover:not([disabled]){border-color:#0891B2;background:#F0F9FF}

.qo .L{width:38px;height:38px;border-radius:50%;background:#0E7490;color:#fff;display:flex;align-items:center;justify-content:center;flex:none;font-weight:900}
.qo.no{border-color:#DC2626;background:#FEF2F2;animation:shake .4s}.qo.no .L{background:#DC2626}
.qo.yes{border-color:#16A34A;background:#F0FDF4}.qo.yes .L{background:#16A34A}
.qfb{min-height:30px;font-size:19px;font-weight:700;margin-top:4px}.qfb.good{color:#15803D}.qfb.bad{color:#B91C1C}
.stars{position:absolute;right:60px;top:46px;display:flex;gap:8px}

.stars i.on{background:#F59E0B;animation:popn .6s}

@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
</style></head><body>
<div id="view"><div id="stage"><div id="nbar"><i></i></div>
<div id="scenes"></div>
<div id="spot"></div>
<svg id="cursor" viewBox="0 0 28 32"><path d="M3 2 L3 26 L9.5 19.5 L14 29 L18.5 27 L14 17.5 L23 17.5 Z" fill="#fff" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/></svg>
</div></div>
<div id="cap" aria-live="polite"></div>
<div id="bar">
 <button id="prev">Back</button><button id="play">Start</button><button id="next">Next</button>
 <div id="dots"></div>
 <button id="capbtn" aria-pressed="false">Captions</button><button id="voice" aria-pressed="true">Voice on</button>
</div>
<script>
const DECK_ID='super-partner-workflow-2026-09';

/* Every screen below is drawn in HTML/CSS from the live dashboard (v151.35).
   Families are made-up names; nobody real appears. */
const ISL=['American Samoa','Guam','CNMI','Micronesia','Marshall Islands','Palau'];
const ALL='All PIP islands';
const TK=[
 {s:'Follow up to request current IEP',f:'Rosa Sample',o:'Veronica A.',i:'Guam',ch:'Chat',d:'2026-09-18',b:'ov'},
 {s:'IEP meeting prep',f:'Lani Example',o:'Sandy S.',i:'American Samoa',ch:'Office',d:'2026-09-24',b:'ov'},
 {s:'School meeting notes',f:'Mako Demo',o:'Francesca M.',i:'Palau',ch:'Outbound Phone',d:'2026-09-26',b:'to'},
 {s:'Hearing aids, AT help',f:'Ana Example',o:'Veronica A.',i:'Guam',ch:'Inbound Phone',d:'2026-09-28',b:'wk'},
 {s:'Send the evaluation letter',f:'Sione Sample',o:'Sandy S.',i:'American Samoa',ch:'Email',d:'2026-09-30',b:'wk'}];
const BKL={ov:'OVERDUE',to:'TODAY',wk:'THIS WEEK'};
const CASES=[{f:'Ana Example',i:'Guam',o:'Veronica A.',d:4,fu:'2026-12-18'}];

/* ---- small helpers ---- */
const tap=async(s,ms=850)=>{const e=typeof s==='string'?q(s):s;await move(e,ms);await click(e);return e};
function toast(msg,bad){const t=add(`<div class="toast${bad?' bad':''}">${msg}</div>`);pop(t);if(!FAST)setTimeout(()=>t.remove(),3200);else t.remove();return t}
function all(s){return[...document.querySelectorAll('.scene.on '+s)]}
async function pickFrom(target,opts,choice){const p=pos(target);const d=add(`<div class="dd" style="left:${p.x}px;top:${p.y+p.h+2}px;width:${p.w}px">${opts.map(o=>`<div>${o}</div>`).join('')}</div>`);
 await wait(350);const row=[...d.children].find(x=>x.textContent===choice);await move(row,600);row.classList.add('hi');await click(row);await wait(200);d.remove();
 target.textContent=choice;target.classList.remove('ph');target.classList.add('flash');setTimeout(()=>target.classList.remove('flash'),700)}
async function reveal(sel,cls='on',gap=320){for(const e of all(sel)){e.classList.add(cls);await wait(gap)}}
const show=(e,ms=500)=>anim(e,[{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],ms,'ease-out');

/* ---- section cover + road map ---- */
const STOPS=['See every partner’s tasks','Upcoming vs. past events','The TOTAL attendance box','Island buttons on interactions','PIP case advocacy'];
const ROAD=n=>`<div class="road">${STOPS.map((s,i)=>`<div class="stop ${i+1<n?'done':i+1===n?'now':''}"><i>${i+1<n?'✓':i+1}</i>${s}</div>`).join('')}</div>`;
const SECT=(n,title,sub,say)=>({cls:'cover sect',html:()=>`<div class="bign">${n}</div><div class="brand">Section ${n} of 5</div><h1>${title}</h1><p class="sub">${sub}</p>${ROAD(n)}${WAVES}`,steps:[{say}]});

/* ---- quiz ---- */
function ask(Q,i){const w=q('.qwrap');
 w.innerHTML=`<div class="qcard"><div class="qn">Question ${i+1}</div><div class="qq">${Q.q}</div>${Q.o.map((o,j)=>`<button class="qo" data-j="${j}"><span class="L">${'ABC'[j]}</span><span>${o}</span></button>`).join('')}<div class="qfb"></div></div>`;
 const card=w.firstChild,fb=card.querySelector('.qfb'),btns=[...card.querySelectorAll('.qo')];
 const finish=()=>{btns.forEach(b=>b.disabled=true);btns[Q.a].classList.add('yes');const st=all('.stars i')[i];if(st)st.classList.add('on');fb.className='qfb good';fb.textContent='Yes! '+Q.y};
 if(FAST){finish();return Promise.resolve()}
 return new Promise(res=>{btns.forEach((b,j)=>b.onclick=async()=>{
  if(b.disabled)return;
  if(j===Q.a){finish();const p=pos(b);confetti(p.x+60,p.y+20,70);await speak('Yes! '+Q.y,run);await wait(700);res()}
  else{b.disabled=true;b.classList.add('no');fb.className='qfb bad';fb.textContent='Not quite. '+Q.n+' Try again.';speak('Not quite. '+Q.n+' Try again.',run)}})})}
/* The first quiz explains how quizzes work; later ones just start. */
const QUIZ=(sec,qs,first)=>({cls:'quiz',html:()=>HEAD('Quick check · '+sec,'Your turn!')+`<div class="stars">${qs.map(()=>'<i></i>').join('')}</div><div class="qwrap"><div class="qintro">${qs.length} quick question${qs.length>1?'s':''}.${first?'<small>Click the answer you think is right. If you miss, you can try again. No one sees your score.</small>':''}</div></div>${first?'<div class="qhelp">Take your time. The next question waits for you.</div>':''}`,
 steps:[{say:first?`Quick check! ${qs.length} question${qs.length>1?'s':''}. Click the answer you think is right. If you miss, just try again. Nobody sees your score.`:`Quick check. ${qs.length} question${qs.length>1?'s':''}.`},
  ...qs.map((Q,i)=>({say:`Question ${i+1}. ${Q.q}`,act:()=>ask(Q,i)}))]});

/* ---- My Day ---- */
const taskRow=t=>`<div class="tk ${t.b==='ov'?'ov':t.b==='to'?'to':''}" data-i="${t.i}"><span class="cc"></span><div class="tx">${t.s}${t.f?` — <a>${t.f}</a>`:''}<small><b>${t.o}</b> · Open · ${t.ch} · follow-up ${t.d}</small>${t.al?'<span class="alb">Add location</span>':''}</div><span class="bk ${t.b}">${BKL[t.b]}</span><span class="tp">${t.al?'Data review':'Tier 1: Individual Assistance: Advocacy'}</span></div>`;
const caseRow=c=>`<div class="case"><div><b>${c.f}</b><small>open ${c.d} days · follow-up ${c.fu}</small><em>Do not close until case advocacy is DONE</em></div><span class="adv">${c.o}</span></div>`;
const PILLS=(sel,cls='ip')=>`<div class="ipb">${[ALL,...ISL].map(i=>`<span class="${cls}${i===sel?' on':''}" data-i="${i}">${i}</span>`).join('')}</div>`;
const MYDAY=(sel,tasks,cases)=>`<div class="md">${PILLS(sel)}
 <div class="hero"><div><div class="al">Aloha <span class="nm"></span></div><small class="hsub">5 things need you today</small></div>
 <div class="hcs"><div class="hc ov"><b class="c-ov">0</b><span>OVERDUE</span></div><div class="hc td"><b class="c-to">0</b><span>TODAY</span></div><div class="hc"><b class="c-wk">0</b><span>THIS WK</span></div><div class="hc dn"><b>—</b><span>DONE</span></div><div class="hc mc"><b class="c-mc">0</b><span>MY CASES</span></div></div></div>
 <div class="sech"><span>Things to do today<i class="c-n">0</i></span><a>View all my tasks →</a></div><div class="tks"></div>
 <div class="sech"><span>Open PIP cases<i class="c-cn">0</i></span><a>View all interactions →</a></div><div class="cases"></div></div>`;
function drawMyDay(sel,tasks,cases){tasks=tasks||TK;cases=cases||[];
 const ok=x=>sel===ALL||x.i===sel;const ts=tasks.filter(ok),cs=cases.filter(ok);
 all('.ip').forEach(p=>p.classList.toggle('on',p.dataset.i===sel));
 q('.tks').innerHTML=ts.length?ts.map(taskRow).join(''):'<div class="empty2">No interactions assigned to you yet.</div>';
 const cb=q('.cases');if(cb)cb.innerHTML=cs.length?cs.map(caseRow).join(''):'<div class="empty2">No advocacy cases for this island.</div>';
 const n=b=>ts.filter(t=>t.b===b).length;
 q('.c-ov').textContent=n('ov');q('.c-to').textContent=n('to');q('.c-wk').textContent=n('wk');q('.c-mc').textContent=cs.length;q('.c-n').textContent=ts.length;const cn=q('.c-cn');if(cn)cn.textContent=cs.length;
 q('.hsub').textContent=ts.length?ts.length+(ts.length===1?' thing needs':' things need')+' you today':'You’re all caught up — nice.';
 all('.hc b').forEach(b=>{b.parentElement.classList.remove('pop');void b.offsetWidth;b.parentElement.classList.add('pop')})}
const pill=i=>all('.ip').find(p=>p.dataset.i===i);

/* ---- Event Attendance ---- */
const CARD=c=>`<div class="eac${c.up?' up':''}"><span class="chip">${c.up?'Upcoming':'One-Off'}</span><b class="t">${c.t}</b><small>${c.d} · ${c.p}</small><small>${c.l}</small><div class="pl"><span>Attended: <i class="att" style="font-style:normal">${c.a}</i></span><span>Evals: 0</span><span>${c.tier}</span></div>${c.up?'<span class="qrb">QR flyer</span>':''}</div>`;
const EVS=[
 {up:1,t:'Family Resource Night',d:'Sat, Oct 10, 2026',p:'Sandy S.',l:'Pago Pago',a:0,tier:'Tier 3'},
 {t:'Parent Support Circle',d:'Tue, Sep 22, 2026',p:'Sandy S.',l:'Tafuna',a:12,tier:'Tier 2'},
 {t:'Autism Workshop',d:'Wed, Sep 23, 2026',p:'Sandy S.',l:'Tafuna',a:40,tier:'Tier 3'},
 {t:'Champions Club',d:'Mon, Sep 21, 2026',p:'Sandy S.',l:'AS',a:8,tier:'Tier 2'},
 {t:'Mothers’ Support Group',d:'Mon, Sep 21, 2026',p:'Sandy S.',l:'AS',a:3,tier:'Tier 2'},
 {t:'IEP Basics',d:'Thu, Sep 17, 2026',p:'Veronica A.',l:'Tamuning',a:9,tier:'Tier 3'}];
const EAR=(cards)=>`<div class="ear"><div class="earh"><span class="bk2">← Back to Reports</span><h3>Event Attendance Report</h3><span class="bpink">+ Add One-Off Event</span><span class="bteal">+ Add Upcoming Event</span></div>
 <div class="fbar"><div><label>Search</label><div class="fx" style="color:#94A3B8">Title, presenter…</div></div><div><label>Program</label><div class="fx">All (incl. One-Offs)</div></div><div><label>Tier</label><div class="fx">All</div></div><div><label>Attendance</label><div class="fx">☑ Show 0-attendance</div></div><div><label>PIP only · Island</label><div class="fx pur">All six islands</div></div></div>
 <div class="cgrid">${cards.map(CARD).join('')}</div></div>`;

/* one-off form; opt: {title, name, date, pres, loc, tier, isl, attendees[], total} */
const MATS=['Agency Brochure','Education &amp; Training Brochure','What is a Learning Disability Brochure','Understanding ADHD Brochure','Understanding Dyslexia Brochure','Understanding Autism','Flyers','Newsletters'];
const aRow=a=>`<div class="arow"><span><b>${a[0]}</b><small>${a[1]}</small></span><span><span class="u">Update</span><span class="x">×</span></span></div>`;
const val=(v,ph,cls='')=>`<div class="in2 ${cls}${v?'':' ph'}">${v||ph}</div>`;
const FORM=o=>`<div class="oo${o.up?' up':''}"><div class="ooh"><span>${o.title}</span><span>×</span></div><div class="oovp"><div class="ooin" data-y="0">
 <div class="f"><label>Event name *</label>${val(o.name,'e.g. Resource Fair Pop-Up','k-name')}</div>
 <div class="f f2"><div><label>Date *</label>${val(o.date,'mm/dd/yyyy','k-date')}</div><div><label>Presenter</label>${val(o.pres,'First and last name','k-pres')}</div></div>
 <div class="f f2"><div><label>Location / Zoom *</label>${val(o.loc,'Place name, or Zoom','k-loc')}</div><div><label>Tier level</label>${val(o.tier,'— Select tier —','sel k-tier')}</div></div>
 <div class="f"><label>Which island is this for? *</label>${val(o.isl,'Choose an island','sel k-isl')}<div class="help">Pick an island when the event belongs to one of the six Pacific Basin partner organizations, including one you are entering on their behalf. Where it happened does not decide this.</div></div>
 <div class="f"><label>Description</label>${val(o.desc,'What was this gathering about?','ta')}</div>
 <div class="f"><label>Distribution of Materials</label><table class="mt"><tr><th>MATERIAL</th><th># PACKED</th><th># DISSEMINATED</th></tr>${MATS.map(m=>`<tr><td>${m}</td><td class="n"><span>0</span></td><td class="n"><span>0</span></td></tr>`).join('')}</table></div>
 <div class="f"><label>Presenter Comments / Concerns</label>${val('','Notes from the presenter about the session...','ta')}</div>
 <div class="atth"><b>Attendees (<span class="an">${(o.att||[]).length}</span>) · all marked attended</b><span class="nc">+ New contact</span></div>
 <div class="srch">Search contacts by name…</div><div class="alist">${(o.att||[]).length?(o.att||[]).map(aRow).join(''):'<div class="empty2" style="text-align:left;padding:4px 0">No attendees added yet.</div>'}</div>
 <div class="f" style="margin-top:8px"><label>How many people attended?</label><div class="numb${o.total?'':' ph'}">${o.total||'e.g. 24'}</div>
 <div class="ynote"><b>This is the TOTAL attendance</b>, including the people you marked attended above.<br>Example: 2 named above and 36 more with no names → enter 38.</div></div>
 <div style="height:30px"></div></div></div><div class="oof"><span class="cn">Cancel</span><span class="sv">Save</span></div></div>`;
async function scrollForm(to){const inr=q('.ooin');let y;if(to==='bottom'){y=inr.scrollHeight-q('.oovp').clientHeight}else y=to;y=Math.max(0,y);const from=+inr.dataset.y;
 await anim(inr,[{transform:`translateY(${-from}px)`},{transform:`translateY(${-y}px)`}],1100,'ease-in-out');inr.dataset.y=y}

/* detail window */
const DETAIL=(t,d,total,lbl,loc)=>`<div class="dw"><div class="dwh"><span>${t} — ${d}</span><span>×</span></div><div class="dwt"><span class="pp">Print / Save as PDF</span><span class="es">Edit Summary</span></div>
 <div class="dws">Event Details</div><div class="dtl"><div><small>DATE</small>${d}</div><div><small>TOPIC</small>${t}</div><div><small>PRESENTER</small>Sandy S.</div><div><small>LOCATION</small>${loc||'Pago Pago'}</div></div>
 <div class="dws">Attendance Totals</div><div class="atr"><div class="atot">Attendance Total<span><b class="tv">${total}</b><i class="tl3">${lbl}</i></span></div><div>Evaluation Total<span><b>0</b><i>auto</i></span></div><div>New Parent Total<span class="bx2">2</span></div><div>Parent (returning)<span class="bx2">1</span></div><div>Youth with Disability<span class="bx2">0</span></div></div>

/* QR pattern: fixed, so every run draws the same code */
function QR(){let s=7,h='';const r=()=>{s=(s*9301+49297)%233280;return s/233280};
 const fin=(x,y)=>{for(const[a,b]of[[0,0],[14,0],[0,14]]){const dx=x-a,dy=y-b;if(dx>=0&&dx<7&&dy>=0&&dy<7)return(dx===0||dx===6||dy===0||dy===6||(dx>1&&dx<5&&dy>1&&dy<5))?1:0}return -1};
 for(let y=0;y<21;y++)for(let x=0;x<21;x++){const f=fin(x,y);h+=`<i class="${(f===1||(f===-1&&r()>.52))?'k':''}"></i>`}return h}

 steps:[{say:'Now the other kind. The Parent Support Circle happened last Tuesday, and it was never set up. So this time I click the pink button, Add One-Off Event. Look at the title. Add One-Off Event. And this form is pink, just like the button and the card.',li:0,act:async()=>spot(q('.ooh'),4)},
 {say:'It is the very same form. Name, date, place, and island.',li:1,act:async()=>{spot(null);const e=q('.k-name');await tap(e,600);await type(e,'Parent Support Circle',45);const d=q('.k-date');await tap(d,500);await type(d,'09/22/2026',45);const l=q('.k-loc');await tap(l,500);await type(l,'Tafuna',60);const s=q('.k-isl');await tap(s,600);await pickFrom(s,['Choose an island',...ISL],'American Samoa')}},
 {say:'Scroll down. Add the people you have names and phone numbers or emails for. Here there are two.',li:2,act:async()=>{await scrollForm('bottom');const a=q('.alist');a.innerHTML='';for(const p of[['Lani Example','lani@example.com'],['Tavita Example','tavita@example.com']]){a.appendChild(el(aRow(p)));q('.an').textContent=a.children.length;await wait(500)}await scrollForm('bottom')}},
 {say:'Twelve people came in total. So type twelve in the TOTAL box, and click Save.',li:3,act:async()=>{const n=q('.numb');await tap(n,600);n.classList.remove('ph');await type(n,'12',160);await tap(q('.sv'));hideCursor();toast('One-off event added.')}},
 {say:'The new card is pink, and it says ONE-OFF. Because it already happened.',li:3,act:async()=>{const c=add(`<div class="abs" style="left:800px;top:470px;width:250px">${CARD(EVS[1])}</div>`);await pop(c);spot(c.querySelector('.eac'),6)}}]},

{html:()=>HEAD('Section 2 · Side by side','Teal before. Pink after.')+`<table class="cmp"><tr><th></th><th style="background:#0D9488">+ Add Upcoming Event</th><th style="background:#DB2777">+ Add One-Off Event</th></tr>
 ${[['When?','<b>Before</b> it happens','<b>After</b> it happened'],['The card says','UPCOMING (teal)','ONE-OFF (pink)'],['The form','<b>Teal</b> form','<b>Pink</b> form'],['QR flyer?','Yes, print it for the table','No'],['Attendance','Fill it in <b>after</b> the event, with <b>Edit Summary</b>','Fill it in <b>right away</b>'],['The TOTAL box','Everyone who came','Everyone who came']].map(r=>`<tr class="r"><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</table>`,
 steps:[{say:'Let’s put them side by side, one row at a time.'},
 ...[['When do you use it? The teal one, before it happens. The pink one, after it happened.'],['What does the card say? Teal says UPCOMING. Pink says ONE-OFF.'],['The form itself matches. The upcoming form is teal. The one-off form is pink.'],['QR flyer? Only the teal one has it.'],['When do you fill in attendance? For teal, after the event, using Edit Summary on the same card. For pink, right away, because it already happened.'],['And the TOTAL box is the same on both. It is always everyone who came.']].map((s,i)=>({say:s[0],act:async()=>{all('.cmp tr.r')[i].classList.add('on')}}))]},

QUIZ('Section 2',[
 {q:'Next Saturday you are holding a workshop. Which button do you use?',o:['+ Add One-Off Event (pink)','+ Add Upcoming Event (teal)'],a:1,y:'It hasn’t happened yet, so it is an Upcoming Event.',n:'Next Saturday is in the future.'},
 {q:'Last Tuesday you held a meeting that nobody put on the calendar. Which button?',o:['+ Add One-Off Event (pink)','+ Add Upcoming Event (teal)'],a:0,y:'It already happened, so it is a One-Off Event.',n:'Last Tuesday is in the past.'},
 {q:'Your upcoming workshop is over. Where do you enter who came?',o:['Make a brand new one-off event','Open the same teal card and click Edit Summary','Start a New Interaction'],a:1,y:'Same card, Edit Summary. Never make a second event.',n:'You already have a card for this event.'}]),

// ================= SECTION 3 =================
SECT(3,'The TOTAL attendance box','One box, one rule: it is the whole room. Plus when and why we add people by name.','Section three. The TOTAL attendance box. This is the most important part of the whole training, so let’s take our time.'),

{html:()=>HEAD('Section 3 · The box','How many people attended?')+FORM({title:'Edit One-Off Event',name:'Autism Workshop',date:'09/23/2026',pres:'Sandy S.',loc:'Tafuna',tier:'Tier 3: Workshops',isl:'American Samoa',att:[['Lani Example','lani@example.com'],['Tavita Example','tavita@example.com']]})+`<div class="big-note" style="left:650px;top:170px;width:560px">The TOTAL box is <u>everyone</u> who came.<br><br>The people <b>with names</b><br>+ the people <b>without names</b><br>= <b>the TOTAL</b>.</div>`,
 init:()=>{const n=q('.big-note');n.style.opacity=0},
 steps:[{say:'Here is the box, at the bottom of every event form. It asks, How many people attended?',act:async()=>{await scrollForm('bottom');spot(q('.numb'),8)}},
 {say:'Right under it, the yellow note says: This is the TOTAL attendance, including the people you marked attended above.',act:async()=>spot(q('.ynote'),5)},
 {say:'So the TOTAL box is everyone who came. The people with names, plus the people without names. All of them, together.',act:async()=>{spot(null);const n=q('.big-note');await anim(n,[{opacity:0,transform:'scale(.8)'},{opacity:1,transform:'none'}],600)}}]},

{html:()=>HEAD('Section 3 · The math','2 named + 36 no names = 38')+`<div class="ppl">${Array.from({length:38},(_,i)=>`<div class="pp2${i<2?' nm2':''}">${i<2?`<span class="tag">${['Lani','Tavita'][i]}</span>`:''}</div>`).join('')}</div>
 <div class="eq"><div><span class="a">2</span> with names</div><div><span class="b">+ 36</span> no names</div><div style="border-top:5px solid #0B3A53;margin-top:6px">= <span class="c">38</span></div></div>
 <div class="big-note" style="left:790px;top:470px;width:420px;opacity:0">Type <b style="font-size:30px">38</b> in the box.<br>Not 36. Not 2.</div>`,
 steps:[{say:'Let’s count a real room full of people.',act:async()=>{}},
 {say:'Two people gave us their names. Lani and Tavita. They are in pink.',act:async()=>{const p=all('.pp2');for(const i of[0,1])await pop(p[i]),p[i].style.opacity=1;await show(all('.eq div')[0])}},
 {say:'Thirty six more people came, but we don’t have their names. They are grey.',act:async()=>{const p=all('.pp2');for(let i=2;i<38;i++){p[i].style.opacity=1;anim(p[i],[{opacity:0,transform:'scale(.3)'},{opacity:1,transform:'none'}],300);await wait(45)}await show(all('.eq div')[1])}},
 {say:'Two plus thirty six equals thirty eight. So you type thirty eight in the box. Everyone in the room.',act:async()=>{await show(all('.eq div')[2]);confetti(900,330,70)}},
 {say:'Not thirty six. Not two. Thirty eight. The TOTAL is always everybody.',act:async()=>{const b=q('.big-note');await anim(b,[{opacity:0,transform:'scale(.8)'},{opacity:1,transform:'none'}],500)}}]},

{html:()=>HEAD('Section 3 · What the report shows','“entered” or “auto”')+DETAIL('Autism Workshop','Wed, Sep 23, 2026',2,'auto','Tafuna')+`<div class="abs" style="left:800px;top:150px;width:420px"><ul class="pts">
 <li>Before you type a total, the report counts only the names: <b>2</b>, “auto”.</li><li>After you type 38, it shows <b>38</b>, “entered”.</li><li>A smaller total never makes the named count go down.</li></ul></div>`,
 steps:[{say:'Here is what the report shows. Before you type a total, it only counts the people with names. Two. And the little grey word says auto.',li:0,act:async()=>spot(q('.atot'),4)},
 {say:'After you type thirty eight in the box, the report shows thirty eight. And the little word changes to entered. That means, you typed it.',li:1,act:async()=>{const v=q('.tv');await countTo(v,38,'',1200);q('.tl3').textContent='entered';q('.tl3').style.color='#DB2777'}},
 {say:'And one safety rule. If you ever type a number that is smaller than the people you named, the report keeps the named count. It never goes down.',li:2,act:async()=>spot(null)}]},

{html:()=>HEAD('Section 3 · Why names matter','A name gives the report much more')+`<div class="twoc"><div><h4 style="color:#DB2777">Added by name</h4><div class="chips">${['Phone or email','Child’s age','Ethnicity','Disability','New or returning parent','Island'].map(c=>`<span>${c}</span>`).join('')}</div>
 <p>Counted in the <b>Contact Demographics</b> and <b>PTI</b> reports, and we can <b>follow up</b> with them.</p></div>
 <div class="g"><h4 style="color:#475569">Only in the TOTAL</h4><p style="font-size:24px;margin-top:0"><b>Counts as 1 person.</b></p><p>That’s all. No age, no ethnicity, no disability. We can’t call them back.</p></div></div>
 <div class="tipbar">Both count. But a <b>name</b> tells our grant reports <b>who</b> we helped.</div>`,
 steps:[{say:'So why do we add people by name at all, if the total counts everyone? Let’s see.',act:async()=>{}},
 {say:'A person added by name brings a lot with them. Their phone or email. Their child’s age. Ethnicity. Disability. Whether they are a new parent. Their island.',act:async()=>{const b=all('.twoc>div')[0];await show(b);for(const c of b.querySelectorAll('.chips span')){await pop(c);c.style.opacity=1;await wait(120)}}},
 {say:'All of that goes into the Contact Demographics report and the PTI report. And we can follow up with them later.',act:async()=>spot(all('.twoc>div')[0].querySelector('p'),6)},
 {say:'A person who is only in the total counts as one. That’s all. No age, no ethnicity, no disability. And we can’t call them back.',act:async()=>{spot(null);await show(all('.twoc>div')[1])}},
 {say:'Both kinds count. But the name tells our grant reports who we helped.',act:async()=>spot(q('.tipbar'),6)}]},

{html:()=>HEAD('Section 3 · When to add a name','One question decides it')+`<div class="dq">Did they give you their name <u>and</u> a phone or an email?</div>
 <div class="arr" style="left:300px;top:228px;color:#DB2777">↙ YES</div><div class="arr" style="left:870px;top:228px;color:#64748B">NO ↘</div>
 <div class="dy"><h5>Add them by name</h5>Search for them first. Not there? Click <b>+ New contact</b>.
 ${['A sign-in sheet with phone numbers','Families who scanned the QR flyer (already added for you)','A parent you talked with who gave an email'].map(e=>`<div class="ex">${e}</div>`).join('')}</div>
 <div class="dn"><h5>Count them in the TOTAL only</h5>No name to add. They are still counted.
 ${['A big crowd at a booth, no sign-in sheet','A parent who did not want to share a phone or email','Kids and extra family members'].map(e=>`<div class="ex">${e}</div>`).join('')}</div>`,
 steps:[{say:'So when do you add someone by name? Ask yourself one question. Did they give me their name, and a phone number or an email?',act:async()=>spot(q('.dq'),6)},
 {say:'If yes, add them by name. Search for them first, because they may already be in the system. If they are not there, click New contact.',act:async()=>{spot(null);await show(all('.arr')[0]);await show(q('.dy'))}},
 {say:'For example. A sign-in sheet with phone numbers. The families who scanned your QR flyer, they are already added for you. Or a parent who gave you an email.',act:async()=>{for(const e of all('.dy .ex'))await show(e)}},
 {say:'If no, they only go in the TOTAL. They still count!',act:async()=>{await show(all('.arr')[1]);await show(q('.dn'))}},
 {say:'For example. A big crowd at a booth with no sign-in sheet. A parent who did not want to share a phone or email. Kids and extra family members.',act:async()=>{for(const e of all('.dn .ex'))await show(e)}}]},

{html:()=>HEAD('Section 3 · New contact','Adding someone new, right from the event')+`<div class="qa"><h5>+ New contact</h5><div class="g2"><div class="in2 ph k-fn">Full name</div><div class="in2 sel">Parent/Guardian</div><div class="in2 ph k-ph">Phone</div><div class="in2 ph k-em">Email</div></div>
 <div class="am">A phone or an email is required — we can’t follow up with someone we can’t reach.</div>
 <div class="hd">DETAILS FOR REPORTS</div><div class="g2"><div class="in2 sel ph k-eth">— Ethnicity —</div><div class="in2 sel ph k-age">— Child age range —</div><div class="in2 sel ph">— Child gender —</div><div class="in2 sel">American Samoa</div></div>
 <span class="cr">Create &amp; add</span></div>
 <div class="abs" style="left:720px;top:150px;width:510px"><ul class="pts"><li>Click <b>+ New contact</b> in the Attendees part of the form.</li><li>Name, plus a <b>phone or an email</b>.</li><li>Fill in the <b>details for reports</b> you know.</li><li>Click <b>Create &amp; add</b>. They join the list.</li></ul></div>`,
 steps:[{say:'Here is how to add someone new. In the Attendees part of the form, click the blue New contact button. This small box opens.',li:0,act:async()=>spot(q('.qa h5'),6)},
 {say:'Type their name, and a phone number or an email. One of those two is required. We can’t follow up with someone we can’t reach.',li:1,act:async()=>{spot(null);const n=q('.k-fn');await tap(n,700);await type(n,'Mele Sample',60);const p=q('.k-ph');await tap(p,600);await type(p,'(684) 555-0142',50)}},
 {say:'Below that are the details for reports. Fill in what you know. Ethnicity. The child’s age range. These are the numbers our reports count.',li:2,act:async()=>{const e=q('.k-eth');await tap(e,600);await pickFrom(e,['— Ethnicity —','Samoan','Chamorro','Palauan','Other'],'Samoan');const a=q('.k-age');await tap(a,600);await pickFrom(a,['— Child age range —','Birth-2','3-5','6-12','13-18'],'6-12')}},
 {say:'Click Create and add. They are added to the attendee list. Great job!',li:3,act:async()=>{await tap(q('.cr'));hideCursor();const r=add(`<div class="abs" style="left:58px;top:520px;width:620px"><div class="atth" style="border:0"><b>Attendees (3) · all marked attended</b></div>${aRow(['Mele Sample','(684) 555-0142'])}</div>`);await pop(r);spot(r,6)}}]},

{html:()=>HEAD('Section 3 · Details, one person at a time','Edit Summary, then Update')+`<div class="oo" style="height:auto;min-height:0"><div class="ooh"><span>Edit One-Off Event</span><span>×</span></div><div style="padding:12px 16px">
 <div class="atth" style="border:0;padding-top:0"><b>Attendees (2) · all marked attended</b><span class="nc">+ New contact</span></div>
 <div class="srch">Search contacts by name…</div>
 ${aRow(['Lani Example','lani@example.com'])}
 <div class="upd"><b>Lani Example</b><div class="g3"><div class="in2">(684) 555-0118</div><div class="in2">lani@example.com</div></div><div class="nt">Phone and email are optional here — add them if you have them.</div>
 <div class="g3"><div class="in2 sel ph k-eth2">— Ethnicity —</div><div class="in2 sel ph k-age2">— Child age range —</div><div class="in2 sel ph">— Child gender —</div><div class="in2 sel ph">— Military status —</div></div>
 <div style="font-weight:700;color:#475569;margin-top:4px">Child’s disability categories</div><div class="dchk">${['ADD-ADHD','Autism Spectrum (ASD)','Speech or Language','Specific Learning Disability','Deaf/Hard of Hearing','Other Health Disability'].map(d=>`<span><i data-d="${d}"></i>${d}</span>`).join('')}</div>
 <div class="upb"><span class="s2">Save to contact</span><span class="c2">Cancel</span></div></div>
 ${aRow(['Tavita Example','tavita@example.com'])}</div></div>
 <div class="abs" style="left:650px;top:150px;width:580px"><ul class="pts"><li>For someone you <b>added by name</b>.</li><li>Open <b>Edit Summary</b>. Click <b>Update</b> on their row.</li><li>Pick their ethnicity, child’s age, and tick the disabilities.</li><li>Click <b>Save to contact</b>. It is saved on their contact card too.</li></ul></div>`,
 steps:[{say:'There are two ways to put in the details our reports need. The first way is for one person at a time, someone you added by name.',li:0,act:async()=>spot(all('.arow')[0],5)},
 {say:'Open the event, click Edit Summary, and on that person’s row, click Update.',li:1,act:async()=>{spot(null);const u=all('.arow')[0].querySelector('.u');await tap(u);await show(q('.upd'));hideCursor()}},
 {say:'A small box opens under their name. Pick their ethnicity, and their child’s age range.',li:2,act:async()=>{const e=q('.k-eth2');await tap(e,600);await pickFrom(e,['— Ethnicity —','African American','Asian','Caucasian','Filipino','Hispanic','Hawaiian/Part Hawaiian','Pacific Islander','Other/2 or more'],'Pacific Islander');const a=q('.k-age2');await tap(a,600);await pickFrom(a,['— Child age range —','Birth-2','3-5','6-12','13-18'],'6-12')}},
 {say:'Tick the child’s disability. You can tick more than one.',li:2,act:async()=>{for(const d of['Autism Spectrum (ASD)','Speech or Language']){const b=all('.dchk i').find(x=>x.dataset.d===d);await tap(b,600);b.classList.add('on')}}},
 {say:'Click Save to contact. It is saved on the event, and on their contact card too, so you never type it again.',li:3,act:async()=>{await tap(q('.s2'));hideCursor();toast('Lani Example updated.')}}]},

{html:()=>HEAD('Section 3 · Details for many people at once','Type the numbers on the event card')+`<div class="dw"><div class="dwh"><span>Autism Workshop — Wed, Sep 23, 2026</span><span>×</span></div><div class="dwt"><span class="pp">Print / Save as PDF</span><span class="es">Edit Summary</span></div>
 <div class="dws">Age of Children</div><table class="dmt dm-age">${[['Birth-2',0],['3-5',0],['6-12',2],['13-18',0],['Beyond H.S.',0]].map(r=>`<tr><td>${r[0]}</td><td class="v"><span class="bxn" data-k="${r[0]}">${r[1]}</span><span class="ah">Auto: ${r[1]}</span></td></tr>`).join('')}</table>
 <div class="dws">Primary Ethnicity</div><table class="dmt dm-eth">${[['Filipino',0],['Hawaiian/Part Hawaiian',0],['Pacific Islander',2],['Other / 2 or more',0]].map(r=>`<tr><td>${r[0]}</td><td class="v"><span class="bxn" data-k="${r[0]}">${r[1]}</span><span class="ah">Auto: ${r[1]}</span></td></tr>`).join('')}</table>
 <div class="dws" style="opacity:.5">Federal Disability Categories …</div></div>
 <div class="abs" style="left:800px;top:150px;width:420px"><ul class="pts"><li>For the people <b>without names</b>.</li><li>Click the event’s card. Scroll to <b>Age of Children</b>.</li><li>“Auto” is the count from the named people.</li><li>Type the <b>real number for everyone</b>. It saves when you click away.</li><li>Clear a box to go back to Auto.</li></ul></div>`,
 steps:[{say:'The second way is new. It is for many people at once, the people without names. On the Event Attendance report, click the event’s card. This window opens. Scroll down to Age of Children.',li:0,act:async()=>spot(q('.dm-age'),5)},
 {say:'Each row has a box. The little word Auto shows the count from the people you named. Auto two, for six to twelve, means two named children are six to twelve.',li:2,act:async()=>spot(all('.dm-age tr')[2],4)},
 {say:'At this workshop you counted twelve children aged six to twelve. So type twelve. The real number for everyone, not only the extra ones.',li:3,act:async()=>{spot(null);const b=all('.dm-age .bxn')[2];await tap(b,700);await type(b,'12',180)}},
 {say:'Click anywhere outside the box and it saves by itself. A green message says Saved. And the hint now says entered, so you know you typed it.',li:3,act:async()=>{await tap(q('.dws'),600);hideCursor();toast('Saved.');const h=all('.dm-age .ah')[2];h.textContent='Auto: 2 (entered)';h.classList.add('ent');spot(all('.dm-age tr')[2],4)}},
 {say:'Same for ethnicity. Almost everyone at this workshop was Pacific Islander. Thirty eight. Type thirty eight, and click away.',li:3,act:async()=>{spot(null);const b=all('.dm-eth .bxn')[2];await tap(b,700);await type(b,'38',180);await tap(q('.dwt'),600);hideCursor();toast('Saved.');const h=all('.dm-eth .ah')[2];h.textContent='Auto: 2 (entered)';h.classList.add('ent')}},
 {say:'Typed the wrong number? Clear the box and click away. It goes back to the automatic count. And don’t worry about counting anyone twice. The reports already know the named people are inside your number.',li:4,act:async()=>{}}]},

{html:()=>HEAD('Section 3 · Which way?','One person, or many people')+`<div class="twoc"><div><h4 style="color:#DB2777">One person with a name</h4><p style="margin-top:0"><b>Edit Summary</b> → <b>Update</b> on their row.</p><p>Their ethnicity, child’s age and disabilities. Saved on their contact card too.</p></div>
 <div class="g" style="border-top-color:#0891B2"><h4 style="color:#0E7490">Many people without names</h4><p style="margin-top:0">Click the <b>event card</b> → type the numbers.</p><p>Age of Children, Primary Ethnicity, Federal Disability Categories. Type the real number for everyone.</p></div></div>`,
 steps:[{say:'So which way do you use? For one person you added by name, use Edit Summary, then Update on their row.',act:async()=>show(all('.twoc>div')[0])},
 {say:'For many people without names, click the event card and type the numbers. Both ways go straight into the reports.',act:async()=>show(all('.twoc>div')[1])}]},

QUIZ('Section 3',[
 {q:'5 people signed in with their names. 20 more came with no names. What number goes in the TOTAL box?',o:['20','5','25'],a:2,y:'5 plus 20 is 25. The TOTAL is everyone in the room.',n:'The TOTAL includes the people with names too.'},
 {q:'Why do we add people by name when we can?',o:['So the reports know their child’s age, ethnicity and disability, and we can follow up','It makes the total bigger','Every single person must have a name'],a:0,y:'Names give our reports the details, and let us follow up.',n:'The total already counts everyone.'},
 {q:'12 children aged 6 to 12 came. Only 2 of them have names. Where do you put that?',o:['Update on each child, one by one','On the event card, type 12 in the 6-12 box','Nowhere, the report counts it'],a:1,y:'On the event card, the real number for everyone: 12.',n:'Most of them have no name, so there is no one to click Update on.'}]),

// ================= SECTION 4 =================
SECT(4,'Island buttons on interactions','Every new interaction now asks which island it is for, and an open one needs a follow-up date.','Section four. The island buttons on a new interaction.'),

{html:()=>HEAD('Section 4 · New Interaction','Which island is this for?')+IX('American Samoa')+`<div class="abs" style="left:800px;top:150px;width:420px"><ul class="pts">
 <li>Click <b>+ New Interaction</b> at the top of any page.</li><li>The first row asks: <b>Which island is this for?</b></li><li>Your island is already picked. Change it if the family is from another island.</li><li>Pick the island of the <b>family</b>, not where you are sitting.</li></ul></div>`,
 steps:[{say:'Click the New Interaction button at the top of any page. This form opens.',li:0,act:async()=>spot(q('.ixh'),4)},
 {say:'Look at the very first row. Which island is this for? There is a button for each of the six islands.',li:1,act:async()=>spot(q('.ixisl'),5)},
 {say:'Your own island is already picked for you. It is purple. American Samoa.',li:2,act:async()=>spot(ixPill('American Samoa'),5)},
 {say:'But this call is about a family in Guam. So click Guam. Now Guam is purple.',li:2,act:async()=>{spot(null);await pickIsl('Guam');spot(ixPill('Guam'),5)}},
 {say:'Always pick the island of the family, or the partner the work is for. Not the island where you are sitting.',li:3,act:async()=>{spot(null);hideCursor()}}]},

{html:()=>HEAD('Section 4 · New Interaction','Open needs a follow-up date')+IX('Guam')+`<div class="abs" style="left:800px;top:150px;width:420px"><ul class="pts">
 <li>Fill in the client, and a short summary.</li><li>Status <b>Open</b>? Then a <b>follow-up date</b> is required.</li><li>Pick the date. Then <b>Save interaction</b>.</li><li>Why: without a date, it never shows up in Follow-ups due. It gets lost.</li></ul></div>`,
 steps:[{say:'Now fill in the rest. The client name, and a short summary.',li:0,act:async()=>{const c=q('.k-cl');await tap(c,700);await type(c,'Rosa Sample',55);const s=q('.k-sum');await tap(s,600);await type(s,'Asked how to request her son’s IEP',40)}},
 {say:'The status says Open. That means there is more to do. Watch what happens if I click Save without a follow-up date.',li:1,act:async()=>{spot(q('.st'),5);await wait(900);spot(null);await tap(q('.k-save'));toast('Add a follow-up date. An interaction left Open needs one — or set it to Closed.',true);spot(q('.k-fu'),5)}},
 {say:'A red message. Add a follow-up date. An interaction left Open needs one, or set it to Closed. So, pick a date.',li:2,act:async()=>{await wait(600);spot(null);const f=q('.k-fu');await tap(f,700);await type(f,'10/03/2026',70)}},
 {say:'Now click Save interaction. It saves.',li:2,act:async()=>{await tap(q('.k-save'));hideCursor();await anim(q('.ix'),[{opacity:1,transform:'none'},{opacity:0,transform:'scale(.92)'}],500)}},
 {say:'Why do we need the date? Without one, an open interaction never shows up in Follow-ups due. Nobody is reminded. It gets lost. The date keeps the family from falling through the cracks.',li:3,act:async()=>{}}]},

{html:()=>HEAD('Section 4 · Why the island matters','The island is a label on the record')+`<div class="abs" style="left:90px;top:150px;width:520px"><div class="tk" style="font-size:16px;padding:14px"><span class="cc"></span><div class="tx" style="font-size:16px">Asked how to request her son’s IEP — <a>Rosa Sample</a><small><b>Sandy S.</b> · Open · Chat · follow-up 2026-10-03</small></div></div>
 <div class="istamp" style="left:330px;top:-30px">GUAM</div></div>
 <div class="ccs" style="top:330px">${[['Shows under the Guam button','on the Home page'],['Counts for Guam','in the PIP reports'],['The Guam partner can see it','and help the family'],['Wrong island?','the right partner may never see it']].map((c,i)=>`<div class="ccd${i===3?' no':''}"><i>${i===3?'!':'✓'}</i><div><b>${c[0]}</b><small>${c[1]}</small></div></div>`).join('')}</div>`,
 steps:[{say:'When you save, the island you picked is stamped on the record, like a label.',act:async()=>{const s=q('.istamp');await anim(s,[{opacity:0,transform:'rotate(-10deg) scale(2.2)'},{opacity:1,transform:'rotate(-10deg) scale(1)'}],450,'cubic-bezier(.5,0,.8,.3)')}},
 {say:'That label is why it shows up when you click the Guam button on your Home page.',act:async()=>all('.ccd')[0].classList.add('on')},
 {say:'It is how it counts for Guam in the PIP reports.',act:async()=>all('.ccd')[1].classList.add('on')},
 {say:'And it is how the Guam partner can see it and help the family.',act:async()=>all('.ccd')[2].classList.add('on')},
 {say:'If you pick the wrong island, the right partner may never see it. So take one second, and check the purple button before you save.',act:async()=>all('.ccd')[3].classList.add('on')}]},

 {q:'You are logging a phone call with a family who lives in Palau. Which island button do you pick?',o:['American Samoa, my own island','Palau','It doesn’t matter'],a:1,y:'Pick the family’s island. Palau.',n:'Pick the island of the family, not your own.'},

SECT(5,'PIP case advocacy','Tick one button and the family becomes your case. Our example is a real kind of case from Guam.','Section five, the last one. PIP case advocacy. We will use a case from Guam as our example.'),

{html:()=>HEAD('Section 5 · Starting a case','Tick “Case advocacy”')+IX('Guam')+`<div class="abs" style="left:800px;top:150px;width:420px"><ul class="pts">
 <li>Start a <b>New Interaction</b> for the family. Pick <b>Guam</b>.</li><li>Under <b>Also record</b>, click <b>Case advocacy</b>.</li><li>The top turns <b>purple</b>. That means it is a case.</li><li>Add a follow-up date and <b>Save</b>.</li></ul></div>`,
 steps:[{say:'A family in Guam needs help with hearing aids and their child’s IEP. Start a New Interaction, and pick Guam.',li:0,act:async()=>{spot(ixPill('Guam'),5);await wait(600);spot(null);const c=q('.k-cl');await tap(c,700);await type(c,'Ana Example',55);const s=q('.k-sum');await tap(s,600);await type(s,'Hearing aids, AT help, IEP',40)}},
 {say:'At the bottom right, under Also record, there is a button called Case advocacy. When you point at it, it says: Tick to put this family in your own open cases.',li:1,act:async()=>{const b=q('.k-ca');await move(b,800);const p=pos(b);const t=add(`<div class="ttip" style="left:${p.x-60}px;top:${p.y-34}px">Tick to put this family in your own open cases.</div>`);await pop(t);await wait(1400);t.remove()}},
 {say:'Click it. See how the top of the form turns purple? That means this is now a case.',li:2,act:async()=>{const b=q('.k-ca');await click(b);b.classList.add('on');q('.ix').classList.add('cad');spot(q('.ixh'),4)}},
 {say:'Add a follow-up date, and click Save interaction.',li:3,act:async()=>{spot(null);const f=q('.k-fu');await tap(f,700);await type(f,'10/01/2026',70);await tap(q('.k-save'));hideCursor();toast('Case advocacy is on — Ana Example is now in your open cases.')}},
 {say:'A green message. Case advocacy is on. Ana Example is now in your open cases.',li:3,act:async()=>confetti(900,80,60)}]},

{html:()=>HEAD('Section 5 · What happens by itself','You don’t have to do any of this')+`<div class="ccs">${[['You are the case advocate','the case is yours right away'],['Stamped with the family’s island','this one says Guam'],['A follow-up date is set','three months out'],['Already an open case?','this interaction joins it, no second case'],['No waiting for LDAH','no one in Hawaiʻi has to assign it',1],['No consent letter is emailed','not for PIP families right now',1]].map(c=>`<div class="ccd${c[2]?' no':''}"><i>${c[2]?'✕':'✓'}</i><div><b>${c[0]}</b><small>${c[1]}</small></div></div>`).join('')}</div>`,
 steps:[{say:'When you save, a lot happens by itself. You don’t have to do any of it.',act:async()=>{}},
 {say:'You become the case advocate. The case is yours right away.',act:async()=>all('.ccd')[0].classList.add('on')},
 {say:'The case is stamped with the family’s island. This one says Guam.',act:async()=>all('.ccd')[1].classList.add('on')},
 {say:'A follow-up date is set for you, three months out.',act:async()=>all('.ccd')[2].classList.add('on')},
 {say:'If the family already has an open case, your interaction simply joins it. You will never get two cases for one family.',act:async()=>all('.ccd')[3].classList.add('on')},
 {say:'There is no waiting for LDAH in Hawaii to assign it.',act:async()=>all('.ccd')[4].classList.add('on')},
 {say:'And no consent letter is emailed to PIP families at this time.',act:async()=>all('.ccd')[5].classList.add('on')}]},

{html:()=>HEAD('Section 5 · Finding the case','Your Home page: Open PIP cases')+MYDAY(ALL)+`<div class="abs" style="left:800px;top:150px;width:420px"><ul class="pts">
 <li>Cases live in <b>Open PIP cases</b> on your Home page.</li><li>The purple name on the right is the <b>case advocate</b>.</li><li>Click <b>Guam</b>: the case stays. Click <b>Palau</b>: it hides.</li><li><b>Do not close</b> until the advocacy is done.</li></ul></div>`,
 init:()=>drawMyDay(ALL,TK,CASES),
 steps:[{say:'Now go to your Home page. Below the task list is a section called Open PIP cases. Here is the Guam case.',li:0,act:async()=>spot(q('.case'),5)},
 {say:'On the right, in purple, is the case advocate. For this Guam family it is Veronica, our Guam partner. As a Super Partner, you can see her cases too, and help.',li:1,act:async()=>spot(q('.adv'),6)},
 {say:'Click the Guam button. The Guam case stays, with the Guam tasks.',li:2,act:async()=>{spot(null);await tap(pill('Guam'));drawMyDay('Guam',TK,CASES);spot(q('.case'),5)}},
 {say:'Click Palau. There are no Palau cases, so the case hides. It is not gone. It is just not Palau.',li:2,act:async()=>{spot(null);await tap(pill('Palau'));drawMyDay('Palau',TK,CASES)}},
 {say:'Click All PIP islands, and it is back.',li:2,act:async()=>{await tap(pill(ALL));drawMyDay(ALL,TK,CASES);hideCursor()}},
 {say:'Read the red line on the case. Do not close until case advocacy is DONE. Every call or meeting with this family is a new interaction for the same family, and it joins this case. Close it only when the work is finished.',li:3,act:async()=>spot(q('.case em'),5)}]},

QUIZ('Section 5',[
 {q:'You tick Case advocacy and save. Who becomes the case advocate?',o:['Someone at LDAH in Hawaiʻi, later','You do, right away','Nobody until it is assigned'],a:1,y:'You become the case advocate the moment you save.',n:'There is no waiting for anyone to assign it.'},
 {q:'Where do you find the Guam case?',o:['Home page, Open PIP cases','The Event Attendance report','Training Videos'],a:0,y:'Home page, Open PIP cases. Use All PIP islands or Guam.',n:'Cases live on your Home page.'},

{html:()=>HEAD('Recap','Your checklist')+`<div class="cl" style="top:125px">${['<b>All PIP islands</b> shows every partner’s tasks. The bold name is the owner.','Teal <b>+ Add Upcoming Event</b> before. Pink <b>+ Add One-Off Event</b> after.','After an upcoming event: same card, <b>Edit Summary</b>. Never a new event.','The <b>TOTAL</b> box is everyone: named + no names.','Add a <b>name</b> when you have a phone or an email.','Pick the family’s <b>island</b> on every new interaction.','<b>Open</b> needs a follow-up date.','<b>Case advocacy</b> makes the family your case. Keep it open until done.'].map(t=>`<div class="ci" style="font-size:18px;padding:9px 18px;margin-bottom:8px"><div class="bx"><svg viewBox="0 0 26 26"><path d="M5 13 L11 19 L21 7"/></svg></div><span>${t}</span></div>`).join('')}</div>`,
 steps:[{say:'Let’s recap everything.',act:async()=>{for(const c of all('.ci')){c.classList.add('on');await wait(160)}}},
 ...['All PIP islands shows every partner’s tasks. The bold name is the owner.','Teal Add Upcoming Event before it happens. Pink Add One-Off Event after it happened.','After an upcoming event, open the same card and click Edit Summary. Never make a new event.','The TOTAL box is everyone. The people with names, plus the people without.','Add someone by name when you have a phone or an email.','Pick the family’s island on every new interaction.','An Open interaction needs a follow-up date.','Case advocacy makes the family your case. Keep it open until the work is done.'].map((s,i)=>({say:s,act:async()=>{const cs=all('.ci');cs.forEach((c,j)=>{c.classList.add('on');if(j<i)c.classList.add('done')});await wait(700);cs[i].classList.add('done')}}))]},
