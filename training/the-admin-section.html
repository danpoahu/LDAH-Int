<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Admin Section — Training</title>
<link rel="stylesheet" href="deck-base.css">
<style>
/* ── sidebar group header, and the standalone sidebar used on the covers ── */
.navh{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:#94A3B8;font-weight:800;padding:9px 10px 5px}
.sidecard{width:246px;background:#fff;border:1px solid #D5DEE8;border-radius:12px;padding:14px 12px;box-shadow:0 18px 44px rgba(0,0,0,.32)}
/* ── a panel drawn in the .main area, or on its own beside the bullets ── */
.pane{background:#fff;border:1px solid #E2E8F0;border-radius:11px;padding:13px 15px;box-shadow:0 8px 22px rgba(15,23,42,.08)}
.ptitle{font-size:20px;font-weight:800;color:#1E293B;margin:0 0 3px;display:flex;align-items:center;gap:8px}
.ptitle i{display:inline-block;width:19px;height:19px;border-radius:50%;background:var(--teal2);color:#fff;font-size:11px;font-style:normal;text-align:center;line-height:19px;font-weight:800;flex:none}
.psub{font-size:12.5px;color:#64748B;margin:0 0 11px;line-height:1.45;max-width:64ch}
/* ── simple row-grid "tables" ── */
.hd{display:grid;gap:9px;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:#94A3B8;font-weight:800;padding:0 10px 6px}
.rw{display:grid;gap:9px;align-items:center;font-size:12px;color:#0F172A;background:#fff;border:1px solid #E2E8F0;border-radius:7px;padding:8px 10px;margin-bottom:5px}
.rw small{color:#64748B;font-size:11px}
.rw.gh{background:#F8FAFC}
/* ── pills & buttons ── */
.pill2{font-size:9.6px;font-weight:800;border-radius:999px;padding:3px 9px;white-space:nowrap;text-align:center}
.pill2.g{background:#DCFCE7;color:#15803D}.pill2.b{background:#DBEAFE;color:#1E40AF}
.pill2.a{background:#FEF3C7;color:#92400E}.pill2.s{background:#F1F5F9;color:#475569}
.pill2.r{background:#FEE2E2;color:#B91C1C}.pill2.v{background:#EDE9FE;color:#6D28D9}
.gbtn{border:1px solid #BFDBFE;background:#EFF6FF;color:#004E7C;font-weight:700;font-size:11.5px;border-radius:7px;padding:6px 13px;display:inline-block}
.rbtn{background:#DC2626;color:#fff;font-weight:800;font-size:11.5px;border-radius:9px;padding:7px 15px;display:inline-block}
.lock{font-size:9.4px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;background:#EEF4F8;color:#475569;border-radius:999px;padding:3px 9px;white-space:nowrap}
.note{margin-top:9px;padding:8px 11px;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:7px;font-size:11px;color:#475569;line-height:1.45}
/* ── List Management: group heads + cards ── */
.lmg{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;color:#1E293B;margin:12px 0 7px}
.lmg .dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.lmg .n{background:#EEF2F6;color:#475569;font-size:10px;font-weight:800;border-radius:999px;padding:2px 8px}
.lmg .gn{font-weight:400;color:#64748B;font-size:11px}
.lmr{display:flex;gap:9px;flex-wrap:wrap}
.lmc{background:#fff;border:1px solid #E2E8F0;border-left:4px solid var(--c);border-radius:9px;padding:8px 13px;font-size:12px;font-weight:700;color:#334155;box-shadow:0 3px 9px rgba(15,23,42,.05)}
.lmc.warn{border-color:#FDE68A;border-left-color:#D97706;background:#FFFBEB}
.lmc.lk{border-color:#FECACA;border-left-color:#DC2626;background:#FEF2F2;color:#991B1B}
/* ── the red system banner ── */
.sysb{display:flex;align-items:flex-start;gap:13px;background:#DC2626;color:#fff;padding:12px 18px;border-radius:9px 9px 0 0;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.sysb .bg2{font-size:1.3rem;line-height:1.1}
.sysb b{display:block;font-weight:800;font-size:15px}
.sysb p{margin:3px 0 0;font-size:12.5px;opacity:.95}
.sysb .dz2{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.55);color:#fff;border-radius:8px;padding:6px 15px;font-weight:700;font-size:12.5px;margin-left:auto;flex:none;white-space:nowrap}
.tabmini{background:#F4F6F9;border:1px solid #D5DEE8;border-top:0;border-radius:0 0 9px 9px;height:86px;padding:11px 16px;font-size:12px;color:#94A3B8}
.tabmini .lbl{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:#64748B}
/* ── month grid for the Events Dashboard mock ── */
.edg{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.edc{background:#fff;border:1px solid #E2E8F0;border-radius:7px;min-height:72px;padding:5px 6px;font-size:10px;color:#94A3B8}
.edc .dn{font-weight:800;color:#64748B;font-size:10.5px}
.edp{margin-top:4px;border:1px solid #CBD5E1;border-radius:5px;background:#fff;font-size:9.6px;color:#334155;padding:3px 16px 3px 6px;position:relative;white-space:nowrap;overflow:hidden}
.edp::after{content:"\25BE";position:absolute;right:5px;top:2px;color:#64748B}
.edp.un{border-color:#F59E0B;background:#FFFBEB;color:#92400E;font-weight:700}
.edt{background:#E0F2FE;color:#0E6E8C;border-radius:4px;font-size:9.4px;font-weight:700;padding:2px 5px;margin-bottom:3px}
/* ── two-up compare ── */
.cmp2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.cmp2>div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 18px;box-shadow:0 8px 24px rgba(15,23,42,.08);opacity:0}
.cmp2 h4{margin:0 0 4px;font-size:19px;color:var(--teal)}
.cmp2 .w{font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#94A3B8;margin-bottom:9px}
.cmp2 ul{margin:0;padding-left:19px;font-size:14px;line-height:1.5;color:var(--soft)}
.cmp2 li{margin-bottom:6px}.cmp2 b{color:var(--ink)}
/* ── the sidebar reveal used on scene 2 ── */
.nav div.pk{background:#FDF2F8;color:#9D174D;font-weight:700}
.grid11{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.tile{background:#fff;border:1px solid #E2E8F0;border-radius:10px;padding:9px 11px;box-shadow:0 4px 12px rgba(15,23,42,.06);opacity:0;transform:translateY(16px)}
.tile b{display:block;font-size:12.5px;color:#0F172A}
.tile span{display:block;font-size:10.5px;color:#64748B;line-height:1.35;margin-top:2px}
.tile.on{opacity:1;transform:none;transition:all .4s ease}
.tile.sa{border-color:#DDD6FE;background:#F5F3FF}
</style></head><body>
<div id="view"><div id="stage"><div id="nbar"><i></i></div>
<div id="scenes"></div>
<div id="spot"></div>
<svg id="cursor" viewBox="0 0 28 32"><path d="M3 2 L3 26 L9.5 19.5 L14 29 L18.5 27 L14 17.5 L23 17.5 Z" fill="#fff" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/></svg>
</div></div>
<div id="cap" aria-live="polite"></div>
<div id="bar">
 <button id="prev">Back</button><button id="play">Start</button><button id="next">Next</button>
 <div id="dots"></div>
 <button id="capbtn" aria-pressed="false">Captions</button><button id="voice" aria-pressed="true">Voice on</button>
</div>
<script>
const DECK_ID='the-admin-section-2026-09';

/* The eleven items in the Admin tab, in the order the sidebar draws them
   (index.html:5398-5407). n0..n10 are just handles for the animation. */
const ITEMS=['Events Dashboard','Emergency Contacts','Chat Logs','User Roles','List Management',
 'Audit Log','Email Log','Reminder Schedule','Recordings Archive','Zoom Platform Recordings','Screening Referrals'];

const NAV=(act,extra)=>`<div class="navh">Admin</div><div class="nav">${ITEMS.map((t,i)=>
 `<div class="n${i}${t===act?' act':''}${(extra||[]).indexOf(t)>=0?' pk':''}">${t}</div>`).join('')}</div>`;

const TABS=(on)=>`<div class="tabs"><div class="t-main${on==='main'?' act':''}">Main</div><div class="t-admin${on==='admin'?' act':''}">Admin</div><div class="t-cms">CMS</div></div>`;

/* full-width mock dashboard: sidebar on the Admin tab + whatever panel you pass */
const DASH=(act,main,tabOn)=>`<div class="dash"><div class="side">${TABS(tabOn||'admin')}${NAV(act)}</div>
 <div class="main"><div class="search">Search signups, interactions, clients, grants&hellip;</div>${main||''}</div></div>`;

/* the sidebar on its own, for the two covers */
const MENU=()=>`<div class="sidecard">${TABS('admin')}${NAV('List Management')}</div>`;

const PANE=(t,sub,body)=>`<div class="pane"><div class="ptitle">${t} <i>i</i></div>${sub?`<p class="psub">${sub}</p>`:''}${body||''}</div>`;

const SC=[

/* ── 1 ─────────────────────────────────────────────────────────────────── */
{cls:'cover',html:()=>`<div class="brand">Leadership in Disabilities &amp; Achievement of Hawai&#699;i</div><div class="hello">Aloha <span class="nm"></span></div>
 <h1>The Admin section</h1><p class="sub">A tour of all eleven tools behind the Admin tab &mdash; what each one is for, and which ones to leave alone. About eight minutes.</p>
 <div class="abs" style="left:830px;top:120px;transform:scale(.92) rotate(3deg);transform-origin:top left;animation:bob 5s ease-in-out infinite">${MENU()}</div>
 <div class="spark" style="left:790px;top:150px">${SPARK}</div><div class="spark" style="left:1200px;top:500px;animation-delay:1s">${SPARK}</div>
 <div class="gate"><button class="btn" data-go="start">Start training</button><button class="btn ghost" data-go="skip">Skip for now</button><label><input type="checkbox" id="voiceChk" checked> Read it out loud to me</label></div>${WAVES}`,
 steps:[{say:'Aloha {name}! This is the Admin tab. Eleven tools sit behind it, and this is a tour of all of them — what each one is for, when you would reach for it, and the handful you should never touch on your own. About eight minutes.'}]},

/* ── 2 ─────────────────────────────────────────────────────────────────── */
{html:()=>HEAD('Finding it','The second tab in the sidebar')+
 `<div class="dash"><div class="side">${TABS('main')}
  <div class="navh n-mh">Dashboard</div><div class="nav n-main">${['Home','My Day','Interactions','Contacts','Events','Reports','Downloads','Training Videos'].map(t=>`<div>${t}</div>`).join('')}</div>
  <div class="n-adm" style="display:none">${NAV(null)}</div></div>
  <div class="main"><div class="search">Search signups, interactions, clients, grants&hellip;</div></div></div>`,steps:[
 {say:'Your sidebar has three tabs. Main is your everyday work. CMS edits the public website. The middle one is Admin.',act:async()=>{place(660,560,0);await wait(300);spot(q('.tabs'),5);await wait(1200);spot(null)}},
 {say:'Click Admin, and the whole menu underneath changes.',act:async()=>{const t=q('.t-admin');await move(t,900);await click(t);q('.t-main').classList.remove('act');t.classList.add('act');
   q('.n-main').style.display='none';q('.n-mh').style.display='none';const n=q('.n-adm');n.style.display='block';n.classList.add('fadein');hideCursor();await wait(600)}},
 {say:'Eleven items. Everything here is a back-office tool — settings, records and logs. Nothing on this tab is something a family ever sees.',act:async()=>{spot(q('.nav'),6);await wait(2400);spot(null)}},
 {say:'Not everyone sees the same list. If you are an Admin you see ten of them. User Roles is Super Admin only, so for most staff it simply is not there.',act:async()=>{const i=q('.n3');spot(i,4);i.classList.add('pk');await wait(2600);spot(null)}},
 {say:'And one item is the exception to the rule — Email Log is open to every staff role, right down to partners. We will get to why.',act:async()=>{const i=q('.n6');spot(i,4);i.classList.add('pk');await wait(2400);spot(null)}}]},

/* ── 3 ─────────────────────────────────────────────────────────────────── */
{html:()=>HEAD('One and two','Events Dashboard, and Emergency Contacts')+DASH('Events Dashboard',
 `<div class="pane" style="margin-top:12px"><div class="ptitle" style="font-size:18px">Events Dashboard</div>
  <p class="psub">Who is presenting what. Pick a presenter on any session to assign or change it.</p>
  <div class="edg">
   <div class="edc"><div class="dn">Mon 5</div></div>
   <div class="edc"><div class="dn">Tue 6</div><div class="edt">Learning Lab</div><div class="edp e1">Kalani Example</div></div>
   <div class="edc"><div class="dn">Wed 7</div></div>
   <div class="edc"><div class="dn">Thu 8</div><div class="edt">Connect-Gen</div><div class="edp un e2">Unassigned</div></div>
   <div class="edc"><div class="dn">Fri 9</div></div>
  </div></div>
  <div class="ec-swap" style="opacity:0;position:absolute;left:22px;right:22px;top:64px">
   ${PANE('Emergency Contacts','',`<div class="hd" style="grid-template-columns:1.2fr 1.2fr .9fr .6fr">
     <span>Staff Member</span><span>Emergency Contact</span><span>Phone</span><span style="text-align:right">Actions</span></div>
    ${[['Kalani Example','Mele Sample','(808) 555-0142'],['Noa Testperson','Kalani Example','(808) 555-0178']].map(r=>
     `<div class="rw" style="grid-template-columns:1.2fr 1.2fr .9fr .6fr"><span>${r[0]}</span><span>${r[1]}</span><span>${r[2]}</span><span style="text-align:right"><span class="gbtn">Edit</span></span></div>`).join('')}`)}
  </div>`),steps:[
 {say:'First on the list, the Events Dashboard. A month at a time, showing who is presenting what.',act:async()=>{const i=q('.n0');place(360,470,0);await move(i,850);await click(i);hideCursor();spot(q('.pane'),6);await wait(1600);spot(null)}},
 {say:'Every session carries a presenter box. Amber and unassigned means nobody has been put against it yet. Pick a name and it saves straight away.',act:async()=>{spot(q('.e2'),5);await wait(2600);spot(null)}},
 {say:'One catch worth knowing. The presenter name has to match that person’s staff account exactly, or the tasks for their session never reach them.',act:async()=>{spot(q('.e1'),5);await wait(2800);spot(null)}},
 {say:'Second item, Emergency Contacts. That is all it is — each staff member’s emergency contact name and phone number, in one short list.',act:async()=>{
   const old=q('.pane');anim(old,[{opacity:1},{opacity:0}],320);const s=q('.ec-swap');await anim(s,[{opacity:0,transform:'translateY(18px)'},{opacity:1,transform:'none'}],450);const i=q('.n1');q('.n0').classList.remove('act');i.classList.add('act')}},
 {say:'You will barely open it. But when somebody is travelling to a neighbour island for a session, this is the page you want.',act:async()=>{spot(q('.ec-swap'),6);await wait(2200);spot(null)}}]},

/* ── 4 ─────────────────────────────────────────────────────────────────── */
{html:()=>HEAD('Super Admin only','User Roles')+`<div class="abs" style="left:58px;top:132px;width:706px">
 ${PANE('User Roles Management','',`<div class="rw gh" style="grid-template-columns:1fr;margin-bottom:9px"><b style="font-size:12.5px">Create New User</b></div>
  <div class="hd" style="grid-template-columns:1fr 1fr"><span>Display Name</span><span>Email</span></div>
  <div class="rw" style="grid-template-columns:1fr 1fr;margin-bottom:8px"><span>Mele Sample</span><span>mele.sample@example.org</span></div>
  <div class="hd" style="grid-template-columns:1fr 1fr"><span>Location / Island</span><span>Role</span></div>
  <div class="rw" style="grid-template-columns:1fr 1fr;margin-bottom:10px"><span>Oahu</span><span class="sel2" style="font-size:11.5px;padding:4px 26px 4px 8px">Daily User</span></div>
  <div class="rw cu" style="grid-template-columns:1fr;background:#0E7490;border-color:#0E7490;color:#fff;font-weight:800;text-align:center">Create User</div>
  <div class="hd" style="grid-template-columns:.7fr 1.1fr .9fr .8fr;margin-top:12px"><span>Status</span><span>Name</span><span>Role</span><span style="text-align:right">Actions</span></div>
  <div class="rw ur1" style="grid-template-columns:.7fr 1.1fr .9fr .8fr"><span class="pill2 g">Online</span><span>Kalani Example</span><span>Admin</span><span style="text-align:right"><span class="gbtn">Archive</span></span></div>
  <div class="rw" style="grid-template-columns:.7fr 1.1fr .9fr .8fr"><span class="pill2 s">Offline</span><span>Noa Testperson</span><span>Partner</span><span style="text-align:right"><span class="gbtn">Archive</span></span></div>`)}</div>
 <div class="abs" style="left:790px;top:148px;width:440px"><ul class="pts">
 <li>Adds a <b>real login</b> and sets what that person can see.</li>
 <li>Seven roles, from <b>Daily User</b> up to <b>Super Admin</b>.</li>
 <li>The temporary password is shown <b>once</b> &mdash; nothing is emailed.</li>
 <li><b>Archive</b>, never delete. Archiving keeps their history readable.</li>
 <li>The tick-box columns are that person&rsquo;s <b>alert subscriptions</b>.</li></ul></div>`,steps:[
 {say:'Third stop, User Roles. This is the Super Admin page, and it is the one with real consequences, so we will take it slowly.',li:0,act:async()=>{spot(q('.pane'),6);await wait(1800);spot(null)}},
 {say:'The top half creates a staff login. Name, email, island, and a role. There are seven roles, from Daily User at the bottom to Super Admin at the top.',li:1,act:async()=>{spot(q('.cu'),5);await wait(2600)}},
 {say:'Here is the part people miss. Pressing Create User makes a live account there and then, and shows you a temporary password on screen. Once. Nothing is emailed to them, so if you close the page without copying it, that account cannot be used.',li:2,act:async()=>{spot(null);const s=add('<div class="stamp" style="left:190px;top:300px">SHOWN ONCE</div>');
   await anim(s,[{opacity:0,transform:'rotate(-14deg) scale(3)'},{opacity:1,transform:'rotate(-14deg) scale(1)'}],450,'cubic-bezier(.5,0,.8,.6)');
   anim(document.querySelector('.scene.on'),[{transform:'none'},{transform:'translate(-6px,3px)'},{transform:'translate(5px,-2px)'},{transform:'none'}],260,'linear');await wait(1800)}},
 {say:'When somebody leaves, use Archive, not delete. Archiving takes their access away but keeps everything they recorded readable.',li:3,act:async()=>{spot(q('.ur1'),5);await wait(2400);spot(null)}},
 {say:'And the row of tick boxes across the table is that person’s alert subscriptions — which signups and requests they get told about. Super Admins are subscribed to everything and cannot opt out.',li:4,act:async()=>{await wait(2600)}}]},

/* ── 5 ─────────────────────────────────────────────────────────────────── */
{html:()=>HEAD('The big one','List Management')+DASH('List Management',
 `<div class="pane" style="margin-top:12px"><div class="ptitle" style="font-size:18px">List Management</div>
  <p class="psub">The options behind the dropdowns, plus the settings and recipient lists the dashboard runs on. Changes apply immediately, for everyone.</p>
  <div class="g0" style="opacity:0"><div class="lmg" style="--c:#0891B2"><span class="dot"></span>Interaction form options <span class="n">5</span><span class="gn">the dropdowns staff pick from when logging an interaction</span></div>
   <div class="lmr" style="--c:#0891B2"><div class="lmc lk">Channels</div><div class="lmc lk">Interaction Types</div><div class="lmc">Workshops / Presentations</div><div class="lmc">Grants / Programs</div><div class="lmc">Titles / Positions</div><div class="lmc">Departments</div></div></div>
  <div class="g1" style="opacity:0"><div class="lmg" style="--c:#16A34A"><span class="dot"></span>Resources &amp; materials <span class="n">2</span></div>
   <div class="lmr" style="--c:#16A34A"><div class="lmc">Resource Types</div><div class="lmc">Materials</div></div></div>
  <div class="g2" style="opacity:0"><div class="lmg" style="--c:#7C3AED"><span class="dot"></span>People &amp; recipients <span class="n">3</span><span class="gn">who gets what</span></div>
   <div class="lmr" style="--c:#7C3AED"><div class="lmc">Presenters</div><div class="lmc warn">Daily Report Recipients</div><div class="lmc warn">Team Personas</div></div></div>
  <div class="g3" style="opacity:0"><div class="lmg" style="--c:#D97706"><span class="dot"></span>Meeting links <span class="n">2</span><span class="gn">defaults used when sending Zoom details</span></div>
   <div class="lmr" style="--c:#D97706"><div class="lmc warn">Program Zoom</div><div class="lmc warn">Event Zoom</div></div></div>
  <div class="g4" style="opacity:0"><div class="lmg" style="--c:#64748B"><span class="dot"></span>Dashboard &amp; website content <span class="n">3</span></div>
   <div class="lmr" style="--c:#64748B"><div class="lmc">Sidebar Tips</div><div class="lmc warn">Donate Block &mdash; Universal</div><div class="lmc warn">Donate Block &mdash; Feedback Follow-ups</div></div></div>
 </div>`),steps:[
 {say:'Now the biggest screen on the tab — List Management. Everything the dashboard offers you in a dropdown is defined here.',act:async()=>{const i=q('.n4');place(360,470,0);await move(i,850);await click(i);hideCursor();spot(q('.psub'),5);await wait(1600);spot(null)}},
 {say:'It is sorted into five groups. First, the interaction form options — the dropdowns you pick from every time you log an interaction.',act:async()=>{await anim(q('.g0'),[{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],420);spot(q('.g0'),4);await wait(2000);spot(null)}},
 {say:'Then resources and materials, which feed the Downloads page.',act:async()=>{await anim(q('.g1'),[{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],420)}},
 {say:'People and recipients — the presenter names, and who gets which automated email.',act:async()=>{await anim(q('.g2'),[{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],420)}},
 {say:'Meeting links, which are the Zoom details that go out in confirmations and reminders.',act:async()=>{await anim(q('.g3'),[{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],420)}},
 {say:'And dashboard and website content, including the donate link. There is a search box above all of it, so you never have to remember which list an option lives in.',act:async()=>{await anim(q('.g4'),[{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],420);await wait(1600)}},
 {say:'Read the line under the heading, because it is the whole warning in one sentence. Changes apply immediately, for everyone.',act:async()=>{spot(q('.psub'),5);await wait(2800);spot(null)}}]},

/* ── 6 ─────────────────────────────────────────────────────────────────── */
{html:()=>HEAD('Locked','Two lists nobody else can edit')+`<div class="abs" style="left:58px;top:136px;width:706px">
 ${PANE('Channels','',`<div class="rw lk1" style="grid-template-columns:1fr auto"><span>Phone</span><span class="lock">Dan only</span></div>
  <div class="rw" style="grid-template-columns:1fr auto"><span>Email</span><span class="lock">Dan only</span></div>
  <div class="rw" style="grid-template-columns:1fr auto"><span>In Person</span><span class="lock">Dan only</span></div>
  <div class="note nt1">This list drives every interaction record, so it is changed by Dan only. Ask him and he will edit it.</div>`)}
 <div style="height:12px"></div>
