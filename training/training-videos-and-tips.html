<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Training Videos &amp; Sidebar Tips — Training</title>
<link rel="stylesheet" href="deck-base.css">
<style>
/* ---- sidebar chrome the mock dashboard needs ---- */
/* The real nav-group headers are display:none !important (index.html:464) —
   in the DOM for JS, never on screen. So this mock draws no group heading. */
.swel{padding:2px 4px 8px;border-bottom:1px solid #E2E8F0;margin-bottom:10px}
.swel b{display:block;font-size:13px;color:#1E293B;font-weight:800}
.swel span{display:block;font-size:10.5px;color:#94A3B8;margin-top:1px}
.pclk{margin-bottom:10px}
.pclk .lb{font-size:9px;letter-spacing:.07em;text-transform:uppercase;color:#94A3B8;font-weight:800;margin-bottom:3px}
.pclk .rw{display:flex;gap:7px;font-size:9.5px;color:#475569}
.pclk .rw b{display:block;color:#0F172A;font-weight:800;font-size:10px}
.nav div .pl2{background:#0891B2;color:#fff;font-size:9px;font-weight:800;border-radius:999px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.sfoot{position:absolute;left:12px;right:12px;bottom:12px;font-size:11.5px;color:#0E7490;font-weight:700;display:flex;gap:6px;align-items:center;border-top:1px solid #E2E8F0;padding-top:10px}
/* ---- the browser's own tooltip ---- */
.tip{position:absolute;background:#FFFFE1;border:1px solid #8A8A70;border-radius:3px;padding:5px 8px;font-size:11.5px;color:#111;box-shadow:0 3px 8px rgba(0,0,0,.28);max-width:300px;z-index:35;line-height:1.35}
/* ---- the teal i bubble and its white pop ---- */
.ib{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:#0891B2;color:#fff;font-size:11px;font-weight:900;font-style:italic;margin-left:8px;vertical-align:middle;flex:none}
.ibp{position:absolute;background:#fff;border-radius:10px;padding:14px 16px;width:360px;box-shadow:0 6px 24px rgba(0,0,0,.2);font-size:13px;line-height:1.6;color:#334155;z-index:36}
.ibp b{color:#0891B2}
.ibp::after{content:"";position:absolute;bottom:-6px;left:20px;width:12px;height:12px;background:#fff;transform:rotate(45deg);box-shadow:3px 3px 4px rgba(0,0,0,.06)}
/* ---- the dotted-underline hint and its dark pop ---- */
.dh{text-decoration:underline dotted rgba(100,116,139,.75);text-underline-offset:4px;text-decoration-thickness:1px}
.hp{position:absolute;background:#0F172A;color:#E2E8F0;border-radius:10px;padding:13px 16px;width:390px;font-size:12.5px;line-height:1.6;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:36}
.hp b{color:#7DD3FC}
.hp::after{content:"";position:absolute;top:-5px;left:24px;width:11px;height:11px;background:#0F172A;transform:rotate(45deg)}
/* ---- Training Videos screen ---- */
.tvtop{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.tvsearch{flex:1;border:1px solid #CBD5E1;border-radius:7px;background:#fff;padding:6px 10px;font-size:12px;color:#94A3B8}
.tvbtn{background:#0E7490;color:#fff;font-weight:800;font-size:11.5px;border-radius:7px;padding:6px 12px;white-space:nowrap}
.tvbtn.gh{background:#fff;border:1px solid #CBD5E1;color:#475569}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid #CBD5E1;border-radius:999px;padding:4px 11px;font-size:11.5px;color:#475569;background:#fff;opacity:0;transform:scale(.7);transition:all .3s cubic-bezier(.3,1.5,.5,1);white-space:nowrap}
.chip.on{opacity:1;transform:none}
.chip .n{color:#94A3B8;font-weight:800;margin-left:5px}
.chip.sel{background:#0891B2;border-color:#0891B2;color:#fff}.chip.sel .n{color:rgba(255,255,255,.8)}
.tvg{border-left:3px solid var(--c);padding-left:11px;margin-bottom:13px;opacity:0}
.tvh{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800;color:#334155;margin-bottom:6px}
.tvh .dt{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.tvh .ct{color:#94A3B8;font-weight:700}
.tvr{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #E2E8F0;border-radius:8px;padding:8px 11px;margin-bottom:5px}
.tvr .pl{width:26px;height:26px;border-radius:7px;background:#E0F2FE;flex:none;display:flex;align-items:center;justify-content:center}
.tvr .tx{min-width:0;flex:1}
.tvr .nm2{font-size:12.5px;font-weight:700;color:#0F172A}
.tvr .ds{font-size:11px;color:#64748B;margin-top:1px}
.tvr .dur{font-size:11.5px;color:#475569;font-weight:800;flex:none}
.tvr .dur.nil{color:#CBD5E1}
.tvr .wb{background:#0E7490;color:#fff;font-weight:800;font-size:11px;border-radius:7px;padding:5px 13px;flex:none}
.tvr .ob{background:#fff;border:1px solid #BAE6FD;color:#0E6E8C;font-weight:800;font-size:11px;border-radius:7px;padding:4px 12px;flex:none}
.lkt{background:#F1F5F9;color:#64748B;font-size:9px;font-weight:800;border-radius:4px;padding:2px 6px;letter-spacing:.05em;flex:none}
/* ---- the Drive player ---- */
.pvw{width:600px;background:#fff;border-radius:12px;box-shadow:0 22px 55px rgba(15,23,42,.35);overflow:hidden}
.pvw .pvh{display:flex;align-items:center;gap:9px;padding:11px 15px;background:#0F172A;color:#fff;font-size:13.5px;font-weight:700}
.pvw .pvh .xc{margin-left:auto;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.18);text-align:center;line-height:24px;font-size:15px}
.pvw .fr{height:280px;background:#111827;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.pvw .fr span{font-size:11.5px;color:#64748B;letter-spacing:.06em}
.pvw .fb{padding:10px 15px;font-size:11.5px;color:#0E6E8C;font-weight:800;border-top:1px solid #E2E8F0}
/* ---- top bar ---- */
.tb2{position:absolute;background:#fff;border:1px solid #D5DEE8;border-radius:12px;box-shadow:0 12px 32px rgba(15,23,42,.13);padding:0 14px 12px}
.tb2 .vst{position:absolute;top:5px;right:10px;font-size:10px;color:rgba(100,116,139,.6);font-weight:800}
.prow{display:flex;align-items:center;gap:6px;padding:12px 0 9px}
.av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;color:#fff;position:relative;flex:none}
.av i{position:absolute;right:-1px;bottom:-1px;width:9px;height:9px;border-radius:50%;border:2px solid #fff}
.crow{display:flex;align-items:center;gap:9px}
.gs{flex:1;max-width:330px;display:flex;align-items:center;gap:7px;height:34px;border-radius:17px;background:#FFFBEB;border:1px solid #F1E3B5;font-size:12.5px;color:#94A3B8;padding:0 14px}
.tbb{display:flex;align-items:center;gap:6px;border:1px solid #CBD5E1;background:#fff;border-radius:8px;padding:6px 11px;font-size:12px;font-weight:800;color:#334155;white-space:nowrap}
.tbb.pri{background:#0E7490;border-color:#0E7490;color:#fff}
.tbb .pl2{background:#DC2626;color:#fff;font-size:9.5px;border-radius:999px;padding:1px 6px}
</style></head><body>
<div id="view"><div id="stage"><div id="nbar"><i></i></div>
<div id="scenes"></div>
<div id="spot"></div>
<svg id="cursor" viewBox="0 0 28 32"><path d="M3 2 L3 26 L9.5 19.5 L14 29 L18.5 27 L14 17.5 L23 17.5 Z" fill="#fff" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/></svg>
</div></div>
<div id="cap" aria-live="polite"></div>
<div id="bar">
 <button id="prev">Back</button><button id="play">Start</button><button id="next">Next</button>
 <div id="dots"></div>
 <button id="capbtn" aria-pressed="false">Captions</button><button id="voice" aria-pressed="true">Voice on</button>
</div>
<script>
const DECK_ID='training-videos-and-tips-2026-09';

/* ---------- small drawn icons (no images anywhere in this deck) ---------- */
const I_PLAY='<svg width="12" height="12" viewBox="0 0 12 12"><path d="M3 2 L10 6 L3 10 Z" fill="#0E7490"/></svg>';
const I_DOC='<svg width="13" height="13" viewBox="0 0 14 14"><rect x="2" y="1" width="10" height="12" rx="1.5" fill="#CBD5E1"/><path d="M4.5 4.5h5M4.5 7h5M4.5 9.5h3" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/></svg>';
const I_MAG='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B08A2E" stroke-width="2.4"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M19 19l-3.6-3.6"/></svg>';
const I_BELL='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 4 1.5 5.5 1.5 5.5h-15S6 13 6 9Z"/><path d="M10 18a2 2 0 0 0 4 0"/></svg>';
const I_BOOK='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#0E7490" stroke-width="2" stroke-linejoin="round"><path d="M3 4h6a3 3 0 0 1 3 3v13a2.5 2.5 0 0 0-2.5-2H3Z"/><path d="M21 4h-6a3 3 0 0 0-3 3v13a2.5 2.5 0 0 1 2.5-2H21Z"/></svg>';
const I_PLUS='<svg width="12" height="12" viewBox="0 0 12 12"><path d="M6 1v10M1 6h10" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>';
const I_BIGPLAY='<svg width="54" height="54" viewBox="0 0 54 54"><circle cx="27" cy="27" r="25" fill="none" stroke="#475569" stroke-width="3"/><path d="M22 17 L38 27 L22 37 Z" fill="#475569"/></svg>';

/* ---------- the sidebar, label for label as the dashboard draws it ---------- */
const MAIN_ITEMS=[
 ['n-home','Home','<span class="pl2">Today</span>'],
 ['n-anal','Web/App Analytics',''],
 ['n-int','Interactions',''],
 ['n-dl','Downloads',''],
 ['n-con','Contacts',''],
 ['n-cr','Change Requests','<span class="pl2">0</span>'],
 ['n-rep','Reports',''],
 ['n-tv','Training Videos','']];
const ADMIN_ITEMS=['Events Dashboard','Emergency Contacts','Chat Logs','User Roles','List Management','Audit Log','Email Log','Reminder Schedule','Recordings Archive','Zoom Platform Recordings','Screening Referrals'];
const CMS_ITEMS=['Dashboard','Team &amp; Board','Galleries','Resources','FAQs','Events &amp; Programs','Home Rotation','Volunteers','Website Data','Page Editor (WYSIWYG)'];

function navMain(){return MAIN_ITEMS.map(m=>`<div class="${m[0]}">${m[1]}${m[2]}</div>`).join('')}
function navList(a){return a.map(t=>`<div>${t}</div>`).join('')}

function SIDE(o){o=o||{};return `<div class="side">
 <div class="swel s-wel"><b>Welcome back</b><span>Tuesday, 23 September · 9:14 AM</span></div>
 <div class="pclk s-clk"><div class="lb">Partner Local Times</div><div class="rw"><div><b>7:14 AM</b>Majuro</div><div><b>8:14 AM</b>Pohnpei</div><div><b>9:14 AM</b>Honolulu</div></div></div>
 <div class="tabs"><div class="t-main${o.tab==='admin'||o.tab==='cms'?'':' act'}">Main</div><div class="t-admin${o.tab==='admin'?' act':''}">Admin</div><div class="t-cms${o.tab==='cms'?' act':''}">CMS</div></div>
 <div class="g-main" style="display:${o.tab&&o.tab!=='main'?'none':'block'}"><div class="nav n-main">${navMain()}</div></div>
 <div class="g-admin" style="display:${o.tab==='admin'?'block':'none'}"><div class="nav n-admin">${navList(ADMIN_ITEMS)}</div></div>
 <div class="g-cms" style="display:${o.tab==='cms'?'block':'none'}"><div class="nav n-cms">${navList(CMS_ITEMS)}</div></div>
 <div class="sfoot">${I_BOOK}<span>Learn more — User Guide</span></div></div>`}

function DASH(o){o=o||{};return `<div class="dash">${SIDE(o)}<div class="main">${o.main||'<div class="search">Search signups, interactions, clients, grants…</div>'}</div></div>`}

/* ---------- Training Videos screen ---------- */
const CATS=[['Getting Started','#7C3AED',5],['Interaction Logging','#0891B2',2],['CMS &amp; Website','#004E7C',4],['Events &amp; Programs','#16A34A',3],['Reports &amp; Data','#D97706',2],['Contacts &amp; Resources','#DC2626',1],['Pacific Island Partners','#DB2777',1],['General','#64748B',1]];

function tvRow(o){return `<div class="tvr ${o.cls||''}">
 <div class="pl">${o.link?I_DOC:I_PLAY}</div>
 <div class="tx"><div class="nm2">${o.t}</div>${o.d?`<div class="ds">${o.d}</div>`:''}</div>
 ${o.link?'<span class="lkt">LINK</span>':''}
 <span class="dur${o.dur?'':' nil'}">${o.dur||'—'}</span>
 <span class="${o.link?'ob':'wb'}">${o.link?'Open':'Watch'}</span></div>`}

function tvGroup(name,col,cls,rows){return `<div class="tvg ${cls}" style="--c:${col}">
 <div class="tvh"><span class="dt"></span>${name}<span class="ct">${rows.length}</span></div>${rows.join('')}</div>`}

const TVSCREEN=`<div class="tvtop"><div class="tvsearch">Search by title or what it covers…</div><span class="tvbtn gh">Show Archived</span><span class="tvbtn">Add Video</span></div>
<div class="chips">${CATS.map((c,i)=>`<span class="chip c${i}">${c[0]}<span class="n">${c[2]}</span></span>`).join('')}</div>`;

const SC=[

/* 1 — cover */
{cls:'cover',html:()=>`<div class="brand">Leadership in Disabilities &amp; Achievement of Hawaiʻi</div><div class="hello">Aloha <span class="nm"></span></div>
 <h1>Training videos &amp; sidebar tips</h1><p class="sub">Your first look around the dashboard — the menu, the little helpers, and where the how-to videos live. About five minutes.</p>
 <div class="abs" style="left:700px;top:150px;transform:scale(.52) rotate(3deg);transform-origin:top left;animation:bob 5s ease-in-out infinite;filter:drop-shadow(0 18px 40px rgba(0,0,0,.4))">${DASH()}</div>
 <div class="spark" style="left:1190px;top:120px">${SPARK}</div><div class="spark" style="left:680px;top:480px;animation-delay:1s">${SPARK}</div>
 <div class="gate"><button class="btn" data-go="start">Start training</button><button class="btn ghost" data-go="skip">Skip for now</button><label><input type="checkbox" id="voiceChk" checked> Read it out loud to me</label></div>${WAVES}`,
 steps:[{say:'Aloha {name}, and welcome. This is the very first video to watch. In about five minutes you will know your way around the menu, you will know where the dashboard keeps its little helpers, and you will know where to find every other training video. Nothing to memorise. Just watch.'}]},

/* 2 — the three tabs */
{html:()=>HEAD('The sidebar','Three tabs across the top')+DASH(),steps:[
 {say:'Everything starts on the left. This strip is the sidebar, and it is where you go from one screen to another.',act:async()=>{hideCursor();spot(q('.side'),4);await wait(1600);spot(null)}},
 {say:'Right at the top it says welcome back, with today’s date and the time on this computer. Underneath, the local time on each Pacific partner island — so you know before you pick up the phone.',act:async()=>{spot(q('.s-wel'),4);await wait(1500);spot(q('.s-clk'),4);await wait(2200);spot(null)}},
 {say:'Below that, three small tabs. Main, Admin, and C M S. They do not open anything on their own — they just swap the menu underneath.',act:async()=>{spot(q('.tabs'),5);await wait(2200);spot(null)}},
 {say:'Main is the one you will live in. Your home page, interactions, contacts, reports. It is already selected when you sign in.',act:async()=>{place(620,560,0);const t=q('.t-main');await move(t,800);spot(q('.g-main'),4);await wait(1400);spot(null)}},
 {say:'Admin holds the behind-the-scenes screens — logs, reminders, who has an account. If you do not see this tab at all, it simply is not part of your role, and that is fine.',act:async()=>{const t=q('.t-admin');await move(t,750);await click(t);q('.t-main').classList.remove('act');t.classList.add('act');q('.g-main').style.display='none';const g=q('.g-admin');g.style.display='block';g.classList.add('fadein');await wait(1500)}},
 {say:'And C M S is the tab that edits the public website — the pages and events families actually see.',act:async()=>{const t=q('.t-cms');await move(t,750);await click(t);q('.t-admin').classList.remove('act');t.classList.add('act');q('.g-admin').style.display='none';const g=q('.g-cms');g.style.display='block';g.classList.add('fadein');await wait(1600)}},
 {say:'Let us go back to Main, because that is where we are headed.',act:async()=>{const t=q('.t-main');await move(t,700);await click(t);q('.t-cms').classList.remove('act');t.classList.add('act');q('.g-cms').style.display='none';const g=q('.g-main');g.style.display='block';g.classList.add('fadein');hideCursor()}}]},

/* 3 — the Main menu item by item */
{html:()=>HEAD('The Main tab','Eight screens, top to bottom')+DASH(),steps:[
 {say:'Under the Main tab there are eight screens, always in this order. Let us walk down them.',act:async()=>{hideCursor();spot(q('.n-main'),4);await wait(1600);spot(null);place(140,560,0)}},
 {say:'Home is your day at a glance — your tasks, your open cases, and what has changed since you were last here. The pill that says Today is not a number, it is just a label.',act:async()=>{const e=q('.n-home');await move(e,700);e.classList.add('act');await wait(1800)}},
 {say:'Web slash App Analytics, then Interactions — every logged contact with a family.',act:async()=>{const a=q('.n-anal');await move(a,450);q('.n-home').classList.remove('act');a.classList.add('act');await wait(900);const i=q('.n-int');await move(i,400);a.classList.remove('act');i.classList.add('act');await wait(1400)}},
 {say:'Downloads is shared staff files. Contacts is everybody LDAH works with. Change Requests carries a number when edits are waiting for an admin to approve them.',act:async()=>{for(const s of ['.n-dl','.n-con','.n-cr']){const e=q(s);await move(e,420);document.querySelectorAll('.scene.on .nav div').forEach(d=>d.classList.remove('act'));e.classList.add('act');await wait(900)}await wait(700)}},
 {say:'Reports is the ready-made reports. And right at the bottom — Training Videos. That is the one we are opening in a moment.',act:async()=>{const r=q('.n-rep');await move(r,450);q('.n-cr').classList.remove('act');r.classList.add('act');await wait(1100);const t=q('.n-tv');await move(t,420);r.classList.remove('act');t.classList.add('act');spot(t,5);await wait(1800);spot(null)}},
 {say:'And tucked underneath everything, a link to the written guide. Same dashboard, in words, if you would rather read than watch.',act:async()=>{const f=q('.sfoot');await move(f,650);spot(f,5);await wait(1700);spot(null);hideCursor()}}]},

/* 4 — hover for a tooltip */
{html:()=>HEAD('Tip one','Rest on anything and it explains itself')+DASH(),steps:[
 {say:'Here is the first thing worth knowing. Every single item in that menu will tell you what it does, if you just rest the pointer on it for a second.',act:async()=>{place(140,560,0);await wait(400)}},
 {say:'Hover Reports, and up comes: the ready-made reports you can build on screen, print or export.',act:async()=>{const r=q('.n-rep');await move(r,800);r.classList.add('act');const p=pos(r);const t=add(`<div class="tip t1" style="left:${p.x+70}px;top:${p.y+26}px">The ready-made reports you can build on screen, print or export</div>`);await anim(t,[{opacity:0},{opacity:1}],250);await wait(2000)}},
 {say:'Hover Interactions, and it tells you it is every logged contact with a family, with filters by date, status, channel and staff member.',act:async()=>{q('.t1').remove();const r=q('.n-rep');r.classList.remove('act');const i=q('.n-int');await move(i,600);i.classList.add('act');const p=pos(i);const t=add(`<div class="tip t2" style="left:${p.x+80}px;top:${p.y+26}px">Every logged contact with a family, with filters by date, status, channel and staff member</div>`);await anim(t,[{opacity:0},{opacity:1}],250);await wait(2400)}},
 {say:'And Training Videos says, plainly: short how-to videos showing staff how to use this dashboard.',act:async()=>{q('.t2').remove();q('.n-int').classList.remove('act');const v=q('.n-tv');await move(v,650);v.classList.add('act');const p=pos(v);const t=add(`<div class="tip t3" style="left:${p.x+95}px;top:${p.y+26}px">Short how-to videos showing staff how to use this dashboard</div>`);await anim(t,[{opacity:0},{opacity:1}],250);await wait(2200)}},
 {say:'So you never have to guess what a menu item is for. Hover it. The tabs at the top do it too, and so do most buttons.',act:async()=>{q('.t3').remove();q('.n-tv').classList.remove('act');const t=q('.t-admin');await move(t,700);const p=pos(t);const b=add(`<div class="tip" style="left:${p.x-20}px;top:${p.y+30}px">Switches the menu below to admin-only screens such as user roles, logs and reminders</div>`);await anim(b,[{opacity:0},{opacity:1}],250);await wait(2600);hideCursor()}}]},

/* 5 — the two kinds of in-page help */
{html:()=>HEAD('Tip two','The little helpers inside a screen')+`<div class="abs" style="left:58px;top:136px;width:700px">
 <div class="abs" style="left:0;top:0;width:700px;background:#fff;border:1px solid #E2E8F0;border-radius:11px;padding:14px 18px;box-shadow:0 8px 22px rgba(15,23,42,.08)">
  <div class="h-a" style="font-size:21px;font-weight:800;color:#1E293B;display:flex;align-items:center">Email Log<span class="ib b-a">i</span></div></div>
 <div class="abs" style="left:0;top:96px;width:700px;background:#fff;border:1px solid #E2E8F0;border-radius:11px;padding:14px 18px;box-shadow:0 8px 22px rgba(15,23,42,.08)">
  <div style="font-size:21px;font-weight:800;color:#1E293B;display:flex;align-items:center">Audit Log<span class="ib b-b">i</span></div></div>
 <div class="abs" style="left:0;top:192px;width:700px;background:#fff;border:1px solid #E2E8F0;border-radius:11px;padding:14px 18px;box-shadow:0 8px 22px rgba(15,23,42,.08)">
  <div style="font-size:21px;font-weight:800;color:#1E293B"><span class="dh h-c">Training Videos</span></div></div></div>
 <div class="abs" style="left:790px;top:148px;width:440px"><ul class="pts"><li>A small <b>teal circle with an i</b> sits beside a heading. <b>Click</b> it.</li><li>A white card opens with the plain-English explanation.</li><li>The <b>Training Videos</b> heading has a <b>dotted underline</b> instead — same idea, on <b>hover</b>, in a dark card.</li><li>Click anywhere else and it closes. Nothing is saved, nothing breaks.</li></ul></div>`,steps:[
 {say:'The second helper lives inside the screens themselves. Look beside a heading and you will often find a small teal circle with a letter i in it.',li:0,act:async()=>{spot(q('.b-a'),7);await wait(2000);spot(null)}},
 {say:'Click it, and a white card opens with the explanation. This is the one on Email Log.',li:1,act:async()=>{const b=q('.b-a');place(300,600,0);await move(b,850);await click(b);const p=pos(b);
   const c=add(`<div class="ibp p-a" style="left:${p.x-14}px;top:${p.y+34}px">Every email the system sends is recorded here. Click a row to see the full message exactly as the family received it. Use the <b>Resend</b> button to send the same message again.</div>`);
   await anim(c,[{opacity:0,transform:'translateY(-12px) scale(.94)'},{opacity:1,transform:'none'}],400);await wait(2600)}},
 {say:'They are all written like that — a sentence or two, no jargon. The Audit Log one tells you it keeps the most recent one thousand administrative changes.',li:1,act:async()=>{q('.p-a').remove();const b=q('.b-b');await move(b,600);await click(b);const p=pos(b);
   const c=add(`<div class="ibp p-b" style="left:${p.x-14}px;top:${p.y+34}px">A record of the administrative changes the system tracks, including who made the change and when. Shows the most recent 1,000 entries.</div>`);
   await anim(c,[{opacity:0,transform:'translateY(-12px) scale(.94)'},{opacity:1,transform:'none'}],400);await wait(2600)}},
 {say:'There are around seventy-five of these scattered through the dashboard. Whenever a screen puzzles you, look for the i first.',li:1,act:async()=>{q('.p-b').remove();hideCursor();await wait(600)}},
 {say:'There is one heading that does it slightly differently — the Training Videos heading, which we are about to open. A faint dotted line under the words, and it opens on hover rather than a click. Same idea, dark card.',li:2,act:async()=>{const h=q('.h-c');await move(h,700);const p=pos(h);
   const c=add(`<div class="hp p-c" style="left:${p.x-20}px;top:${p.y+30}px">Training videos help staff learn how to use the dashboard, log interactions, manage events, and more.<br><br><b>To add a video:</b><br>1. Upload your video to Google Drive<br>2. In Google Drive, right-click the file, choose <b>Share</b>, and set it to "Anyone with the link". Copy the link.<br>3. Back here, click Add Video and paste the link</div>`);
   await anim(c,[{opacity:0,transform:'translateY(-10px)'},{opacity:1,transform:'none'}],380);await wait(3000)}},
 {say:'Either kind closes the moment you click somewhere else. You cannot break anything by opening one, so open them freely.',li:3,act:async()=>{const c=q('.p-c');place(480,600,300);await click(null);await anim(c,[{opacity:1},{opacity:0}],300);c.remove();hideCursor();await wait(400)}}]},

/* 6 — getting to Training Videos */
{html:()=>HEAD('Getting there','Main → Dashboard → Training Videos')+DASH(),steps:[
 {say:'Now the videos. They are not hidden away in a special place — they are the last item on the Main tab.',act:async()=>{place(140,560,0);const v=q('.n-tv');await move(v,900);spot(v,5);await wait(1800)}},
 {say:'Click Training Videos.',act:async()=>{const v=q('.n-tv');await click(v);v.classList.add('act');spot(null);hideCursor();await wait(300)}},
 {say:'And the whole screen fills with them. Every video LDAH has made for staff, in one list.',act:async()=>{const m=q('.main');m.innerHTML=`<div style="font-size:21px;font-weight:800;color:#1E293B;display:flex;align-items:center;margin-bottom:12px">Training Videos<span class="ib">i</span></div>${TVSCREEN}`+
   tvGroup('Getting Started','#7C3AED','gg',[tvRow({t:'Training Videos and Side Bar Tips',d:'Finding your way around the menu and the little helpers',dur:'1:16'}),tvRow({t:'Logging Your First Interaction',d:'From the New Interaction button to a saved record',dur:'4:02'})]);
   m.classList.add('fadein');q('.gg').style.opacity=1;document.querySelectorAll('.scene.on .chip').forEach(c=>c.classList.add('on'));await wait(1600)}},
 {say:'One thing worth saying out loud: everybody can get here. This is the one screen in the menu that is not limited by role, so it is always there for you.',act:async()=>{await wait(1400)}}]},

/* 7 — the screen: search and chips */
{html:()=>HEAD('The screen','Search first, then the categories')+`<div class="abs" style="left:58px;top:132px;width:700px">
 <div style="font-size:22px;font-weight:800;color:#1E293B;display:flex;align-items:center;margin-bottom:12px">Training Videos<span class="ib b-h">i</span></div>${TVSCREEN}</div>
 <div class="abs" style="left:790px;top:148px;width:440px"><ul class="pts"><li>The box searches <b>the title and the description</b> — what a video covers, not just what it is called.</li><li>Press <b>/</b> anywhere on the page to jump into it.</li><li>The chips are the <b>eight categories</b>. The number is how many are in each.</li><li>Click a chip to see only that category. Click it again to clear it.</li><li><b>Add Video</b> and <b>Show Archived</b> only appear for admins.</li></ul></div>`,steps:[
 {say:'The screen is built search-first, because there are a lot of videos and scrolling is slow.',li:0,act:async()=>{hideCursor();spot(q('.tvsearch'),5);await wait(1700)}},
 {say:'Type into that box and it narrows the list by the title and by the description — so searching for the word signup finds videos that only mention signups in their summary.',li:0,act:async()=>{await wait(2200)}},
 {say:'A small shortcut: press the forward slash key anywhere on this screen and the cursor jumps straight into the search box.',li:1,act:async()=>{spot(null);await wait(1800)}},
 {say:'Underneath are the category chips. There are eight categories, and you cannot add a new one from here — they are fixed.',li:2,act:async()=>{for(const c of document.querySelectorAll('.scene.on .chip')){c.classList.add('on');await wait(120)}spot(q('.chips'),6);await wait(1900);spot(null)}},
 {say:'Getting Started. Interaction Logging. C M S and Website. Events and Programs. Reports and Data. Contacts and Resources. Pacific Island Partners. And General.',act:async()=>{for(const c of document.querySelectorAll('.scene.on .chip')){spot(c,4);await wait(700)}spot(null)}},
 {say:'The number beside each name is how many videos are in it. Click one and the list shows only that category; click the same one again and you are back to everything.',li:3,act:async()=>{const c=q('.c0');place(300,600,0);await move(c,800);await click(c);c.classList.add('sel');await wait(1700)}},
 {say:'Those last two buttons, Add Video and Show Archived, only appear if you are an admin. If you cannot see them, nothing is wrong.',li:4,act:async()=>{q('.c0').classList.remove('sel');const b=q('.tvbtn');await move(b,650);spot(q('.tvtop'),5);await wait(2200);spot(null);hideCursor()}}]},

/* 8 — the list itself */
{html:()=>HEAD('The list','Grouped by category, newest thinking first')+`<div class="abs" style="left:58px;top:132px;width:700px">
 ${tvGroup('Getting Started','#7C3AED','g0',[
   tvRow({t:'Training Videos and Side Bar Tips',d:'Finding your way around the menu and the little helpers',dur:'1:16'}),
   tvRow({t:'Logging Your First Interaction',d:'From the New Interaction button to a saved record',dur:'4:02'})])}
 ${tvGroup('Events &amp; Programs','#16A34A','g1',[
   tvRow({t:'Checking Signups',d:'Who registered, and how far along each family is',dur:'5:30'}),
   tvRow({t:'Taking Attendance',d:'',dur:''})])}
 ${tvGroup('Reports &amp; Data','#D97706','g2',[
   tvRow({t:'Interaction Tiers — one page handout',d:'A printable flowchart, not a video',link:true})])}</div>
 <div class="abs" style="left:790px;top:148px;width:440px"><ul class="pts"><li>One block per category, with a <b>coloured bar</b> down the side.</li><li>Each row: <b>title</b>, a one-line summary, and how long it runs.</li><li>The running time is <b>typed in by hand</b> — a dash means nobody filled it in.</li><li>A row tagged <b>LINK</b> is not a video. It opens in a new tab.</li></ul></div>`,steps:[
 {say:'The list groups itself by category, each block with a coloured bar down its left edge so you can see where one ends and the next begins.',li:0,act:async()=>{hideCursor();for(const s of ['.g0','.g1','.g2']){await anim(q(s),[{opacity:0,transform:'translateY(22px)'},{opacity:1,transform:'none'}],420)}await wait(600)}},
 {say:'Every row shows three things: the title, a one-line summary of what it covers, and how long it runs.',li:1,act:async()=>{spot(q('.g0 .tvr'),5);await wait(2100)}},
 {say:'A word about that running time. It is not measured — somebody typed it in when they added the video. So if you see a dash instead of a number, it only means nobody filled that box in. The video is perfectly fine.',li:2,act:async()=>{const r=document.querySelectorAll('.scene.on .g1 .tvr')[1];spot(r,5);await wait(3000)}},
 {say:'And now and then you will see a row tagged LINK, with an Open button instead of Watch. That is not a video at all — today those are the printable handouts. It opens in a new tab.',li:3,act:async()=>{spot(q('.g2 .tvr'),5);await wait(2800);spot(null)}}]},

/* 9 — watching one */
{html:()=>HEAD('Watching one','Press Watch and it plays right here')+`<div class="abs" style="left:58px;top:140px;width:700px">
 ${tvGroup('Getting Started','#7C3AED','g0',[tvRow({t:'Training Videos and Side Bar Tips',d:'Finding your way around the menu and the little helpers',dur:'1:16',cls:'rw'})])}</div>
 <div class="abs" style="left:790px;top:148px;width:440px"><ul class="pts"><li><b>Watch</b> opens a player over the top of the list.</li><li>The video streams from <b>LDAH&rsquo;s Google Drive</b> — nothing downloads.</li><li>If it will not play, <b>Open in Google Drive</b> is underneath.</li><li>Close it and you are back exactly where you were.</li><li><b>Nobody is counting.</b> Watching is not recorded against your name.</li></ul></div>`,steps:[
 {say:'To watch one, press the Watch button on its row.',li:0,act:async()=>{const b=q('.rw .wb');place(420,620,0);await move(b,900);await click(b);hideCursor()}},
 {say:'A player opens on top of the list, and the video starts. It is streaming from LDAH’s Google Drive — nothing is downloading to your computer.',li:1,act:async()=>{const m=add(`<div class="abs pw" style="left:90px;top:150px"><div class="pvw"><div class="pvh"><span>Training Videos and Side Bar Tips</span><span class="xc">&times;</span></div><div class="fr">${I_BIGPLAY}<span>PLAYING FROM GOOGLE DRIVE</span></div><div class="fb">Open in Google Drive</div></div></div>`);
   await anim(m,[{opacity:0,transform:'scale(.82)'},{opacity:1,transform:'none'}],480);await wait(1800)}},
 {say:'Now and then a video will not start — usually a browser blocking it. Underneath the player there is a link that says Open in Google Drive, and that always works.',li:2,act:async()=>{spot(q('.fb'),5);await wait(2600);spot(null)}},
 {say:'Close the player with the cross, and you are back on the list exactly where you left off.',li:3,act:async()=>{const x=q('.xc');await move(x,750);await click(x);const w=q('.pw');await anim(w,[{opacity:1,transform:'none'},{opacity:0,transform:'scale(.85)'}],350);w.remove();hideCursor()}},
 {say:'And one last reassurance, because people always ask. Nothing records that you watched it. There is no tick, no score, no report of who has watched what. Watch the same one five times if it helps.',li:4,act:async()=>{await wait(2600)}}]},

/* 10 — the top bar */
{html:()=>HEAD('While you are here','Four things along the top')+`<div class="tb2 abs" style="left:58px;top:140px;width:700px">
 <span class="vst v-x">v150.38</span>
 <div class="prow p-row"><div class="av" style="background:#0E7490">KE<i style="background:#22C55E"></i></div><div class="av" style="background:#7C3AED">MS<i style="background:#F59E0B"></i></div><div class="av" style="background:#64748B">NT<i style="background:#EF4444"></i></div></div>
 <div class="crow"><div class="gs g-s">${I_MAG}<span>Search signups, interactions, clients, grants…</span></div>
  <span class="tbb b-l">${I_BELL} Alerts <span class="pl2">3</span></span>
  <span class="tbb pri">${I_PLUS} New Interaction</span>
  <div class="av" style="background:#0E7490;margin-left:auto">JD</div></div></div>
 <div class="abs" style="left:790px;top:148px;width:440px"><ul class="pts"><li>The <b>row of faces</b> is who else is signed in. Green online, yellow idle, red signed off recently.</li><li>The <b>search box</b> reaches the whole system — a name, an email or a phone number.</li><li><b>Alerts</b> counts website items waiting <b>plus your own open follow-ups</b>.</li><li>The tiny grey <b>version number, top right</b>. Quote it if you report a problem.</li></ul></div>`,steps:[
 {say:'Before we finish, four things along the top of every screen that a new person usually walks straight past.',act:async()=>{hideCursor();await wait(900)}},
 {say:'That little row of coloured circles is the presence strip. It is who else is signed in right now. Green means online, yellow means idle, and red means they signed off recently.',li:0,act:async()=>{spot(q('.p-row'),6);await wait(3000)}},
 {say:'The search box beside it is not just for this screen. Type a name, an email or a phone number and it looks across signups, interactions, clients and resources all at once.',li:1,act:async()=>{spot(q('.g-s'),5);await wait(2900)}},
 {say:'Alerts is your bell. The number on it counts website items waiting for somebody, plus your own open follow-ups. If it has a number on it, it is worth a click.',li:2,act:async()=>{spot(q('.b-l'),6);await wait(2800)}},
 {say:'And the faint grey version number in the corner. You will never need it day to day — but if something ever looks wrong and you tell Dan, read him that number first. It saves a lot of guessing.',li:3,act:async()=>{spot(q('.v-x'),7);await wait(3000);spot(null)}}]},

/* 11 — recap */
{html:()=>HEAD('Recap','Your first-day checklist')+`<div class="cl">${[
 'Sidebar tabs: <b>Main</b> · <b>Admin</b> · <b>CMS</b> — they swap the menu, they open nothing',
 '<b>Hover any menu item</b> and it tells you what the screen is for',
 'A teal <b>i</b> beside a heading — <b>click</b> it for the plain-English explanation',
 'The <b>Training Videos</b> heading uses a <b>dotted underline</b> instead — <b>hover</b> it',
 '<b>Main → Training Videos</b> is the last item, and everybody can see it',
 'Search the box by <b>title or what it covers</b>, or press <b>/</b> to jump into it',
 'Eight fixed categories · a <b>dash</b> for a running time just means nobody typed it in',
 '<b>Watch</b> plays it here · a <b>LINK</b> row opens a handout instead · <b>nothing is recorded</b>'
 ].map(t=>`<div class="ci"><div class="bx"><svg viewBox="0 0 26 26"><path d="M5 13 L11 19 L21 7"/></svg></div><span>${t}</span></div>`).join('')}</div>`,steps:[
 {say:'Let us go over it once.',act:async()=>{for(const c of document.querySelectorAll('.scene.on .ci')){c.classList.add('on');await wait(140)}}},
 ...['Three tabs at the top of the sidebar. They only swap the menu.',
     'Hover a menu item and it tells you what the screen is for.',
     'A teal i beside a heading — click it.',
     'The Training Videos heading has a dotted underline — hover that one instead.',
     'Training Videos is the last item on the Main tab, and everyone can see it.',
     'Search by title or by what a video covers. Forward slash jumps you into the box.',
     'Eight categories. A dash instead of a time just means nobody typed one in.',
     'Watch plays it right here, and nothing records that you did.']
  .map((s,i)=>({say:s,act:async()=>{const cs=document.querySelectorAll('.scene.on .ci');cs.forEach((c,j)=>{c.classList.add('on');if(j<i)c.classList.add('done')});await wait(550);cs[i].classList.add('done')}}))]},

/* 12 — mahalo */
{cls:'cover',html:()=>`<div class="brand">Training videos &amp; sidebar tips</div><div class="hello">That is the tour</div><h1>Mahalo<span class="nmc"></span>!</h1>
 <p class="sub">When a screen puzzles you, look for the little i. When you want to be shown, go to Training Videos. Questions? Ask Dan.</p>
 <div class="abs" style="left:720px;top:160px;transform:scale(.5) rotate(3deg);transform-origin:top left;animation:bob 5s ease-in-out infinite;filter:drop-shadow(0 18px 40px rgba(0,0,0,.4))">${DASH()}</div>
 <div class="gate" style="top:470px"><button class="btn ghost" data-go="again">Watch again</button><button class="btn" data-go="close">Close</button></div>${WAVES}`,
 steps:[{say:'Mahalo {name}! Look for the little i when a screen puzzles you, and head to Training Videos whenever you would rather be shown than told. Welcome to the team.',act:async()=>{await wait(400);confetti(640,300,140)}}]}
];
