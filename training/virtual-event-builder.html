</div></div>

<script>
const DECK_ID='virtual-event-builder';

/* Every screen below is drawn in HTML/CSS from DAN STAGE (veb.js, veb-flyers.js, the Announce
   window) and the website's partner page strip, 2026-11-06. The flyers are small CSS redraws of
   the January design. Every person here is made up. */
const LOGO='../logo_blue.png';
const PIP='pip-logo.png';

const tap=async(s,ms=850)=>{const e=typeof s==='string'?q(s):s;await move(e,ms);await click(e);return e};
function all(s){return[...document.querySelectorAll('.scene.on '+s)]}
const SCN=()=>document.querySelector('.scene.on');
const show=(e,ms=500)=>anim(e,[{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],ms,'ease-out').then(()=>{e.style.opacity=1});
const fadeIn=(e,ms=400)=>anim(e,[{opacity:0},{opacity:1}],ms,'ease-out').then(()=>{e.style.opacity=1});
const PTS=(items,top=140)=>`<div class="abs" style="left:790px;top:${top}px;width:440px"><ul class="pts">${items.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
const LOGOBOX=`<div style="position:absolute;left:70px;top:22px;background:#fff;border-radius:14px;padding:6px 10px;box-shadow:0 4px 14px rgba(0,0,0,.18);animation:rise .6s both"><img src="${LOGO}" alt="LDAH" style="height:80px;display:block"></div>`;
function around(els){const r=els.map(pos);const x=Math.min(...r.map(p=>p.x)),y=Math.min(...r.map(p=>p.y));return{x,y,w:Math.max(...r.map(p=>p.x+p.w))-x,h:Math.max(...r.map(p=>p.y+p.h))-y}}
async function choose(field,opts,pick){await tap(field,800);field.classList.add('foc');const dd=document.createElement('div');dd.className='sc-dd';dd.innerHTML=opts.map(o=>`<div>${o}</div>`).join('');
 const p=field.parentElement;p.style.position='relative';dd.style.top=(field.offsetTop+field.offsetHeight+2)+'px';dd.style.minWidth=field.offsetWidth+'px';p.appendChild(dd);
 await anim(dd,[{opacity:0,transform:'translateY(-6px)'},{opacity:1,transform:'none'}],250,'ease-out');dd.style.opacity=1;
 const it=[...dd.children][opts.indexOf(pick)];await move(it,600);it.classList.add('hi');await click();await wait(250);field.textContent=pick;field.classList.remove('ph','foc');dd.remove()}
const popIn=async(sel)=>{const e=q(sel);await anim(e,[{opacity:0,transform:'scale(.94)'},{opacity:1,transform:'none'}],350);return e};
const closeModal=async(sel)=>{const f=q(sel);if(!f)return;await anim(f,[{opacity:1},{opacity:0,transform:'scale(.95)'}],300);f.remove();const d=q('.sc-dim');if(d)d.remove()};
async function hideToast(){const t=q('.k-toast');if(t&&t.style.opacity==='1'){await anim(t,[{opacity:1},{opacity:0}],300);t.style.opacity=0}}
async function toast(msg,bg){const t=q('.k-toast');if(!t)return;t.textContent=msg;if(bg)t.style.background=bg;await fadeIn(t,300)}
/* scroll a page's inner pane so an element sits near the top */
function scrollTo_(inSel,vpSel,sel,animate=true,pad=8){const inr=q(inSel),vp=q(vpSel),e=q(sel);if(!inr||!vp||!e)return Promise.resolve();
 inr.style.transition='none';const cur=inr.style.transform;inr.style.transform='none';
 const max=Math.max(0,inr.offsetHeight+20-vp.clientHeight);const d=Math.max(0,Math.min(pos(e).y-pos(inr).y-pad,max));inr.style.transform=cur;
 if(animate){void inr.offsetHeight;inr.style.transition='';}
 inr.style.transform=`translateY(${-d}px)`;return animate?wait(750):Promise.resolve()}
const vto=(sel,a=true)=>scrollTo_('.k-in','.vb-vp',sel,a);
const ato=(sel,a=true)=>scrollTo_('.k-ain','.an-vp',sel,a);

/* ================= THE FLYERS (small CSS redraws of the January design) ================= */
const SESS=[{dd:'Wed., Jan 13',lesson:'IDEA/Chapter 60',bl:'Know the laws'},{dd:'Wed., Jan 27',lesson:'Understanding Evaluations',bl:'What testing shows'}];
const ZONES=[['American Samoa','Wed 1/13 &amp; 1/27','4–5 PM'],['Hawaiʻi','Wed 1/13 &amp; 1/27','5–6 PM',1],['Palau','Thu 1/14 &amp; 1/28','12–1 PM'],['Guam &amp; CNMI','Thu 1/14 &amp; 1/28','1–2 PM'],['Yap &amp; Chuuk','Thu 1/14 &amp; 1/28','1–2 PM'],['Pohnpei &amp; Kosrae','Thu 1/14 &amp; 1/28','2–3 PM'],['Marshall Islands','Thu 1/14 &amp; 1/28','3–4 PM']];
const STARS=(sq,fw)=>[[30,3],[52,16],[76,24],[70,6],[44,25],[94,48],[12,52]].map(([x,y])=>`<i class="st" style="left:${x}cqw;top:${sq?y*.8:y}cqw"></i>`).join('')+(fw?'<i class="fw" style="left:86cqw;top:17cqw;width:10cqw;height:10cqw"></i>':'');
function FLY(o={}){const p=!!o.p,sq=!!o.sq,w=o.w||200;
 const logo=p?`<div class="lg pip"><img src="${PIP}" alt=""></div>`:`<div class="lg"><img src="${LOGO}" alt=""></div>`;
 const head=STARS(sq,!p&&!sq)+logo+`<div class="kk">${p?'FOR FAMILIES ACROSS THE PACIFIC':'PARENT TRAINING &amp; INFORMATION CENTER'}</div><div class="tt">Learning <span>Labs</span></div>`;
 const foot=`<div class="wv" style="bottom:${sq?8:15}cqw"></div><div class="ft"><div class="rg"><b>REGISTER at <span>LDAHawaii.org</span></b>Get your Zoom link, scan the QR code, or call ${p?'+1 808-536-9684':'808-536-9684'}</div><i class="qr"></i><div class="bd"><span>IDEAs that Work</span><span>${p?'Pacific Island Partners':'Zoom'}</span></div></div>`;
 let body;
 if(!p){const T=sq?[[52,17,42,3],[44,50,48,-3]]:[[50,28,44,3],[38,62,54,-3]];
  body=`<div class="hp" style="${sq?'top:18cqw;font-size:4.6cqw':''}">Happy New Year!</div><div class="yr" style="${sq?'top:24cqw;font-size:15cqw':''}">20<i>27</i></div><div class="mo" style="${sq?'top:46cqw':''}">JANUARY · FOR PARENTS</div>`
   +SESS.map((s,i)=>`<div class="tk" style="left:${T[i][0]}cqw;top:${T[i][1]}cqw;width:${T[i][2]}cqw;transform:rotate(${T[i][3]}deg);box-sizing:border-box"><div class="tb">TICKET ${i+1}</div><div class="dd">${s.dd}</div><div class="tm">5:00–6:00 PM HST</div><div class="ti">${s.lesson}</div>${sq?'':`<div class="bl"><b style="color:#ff6f9c">•</b> ${s.bl}</div>`}</div>`).join('')
   +(sq?'':'<div class="tg">New year, new skills. Building Leaders in Parents creates a community of voices.</div>')}
 else{const L=sq?[[4,32,43],[53,32.5,43]]:[[6,38,42],[52,39,42]];
  const C=sq?[[6,52],[29,53.5],[52,52],[75,53.5],[17.5,68],[40.5,69.5],[63.5,68]]:[[6,69],[29.5,70.5],[53,69],[76.5,70.5],[17.75,86],[41.5,87.5],[65.25,86]];
  body=`<div class="hp" style="${sq?'top:16cqw;font-size:4.6cqw':'top:21cqw;font-size:5cqw'}">Happy New Year!</div><div class="yr" style="${sq?'left:62cqw;top:12cqw;font-size:12cqw':'left:58cqw;top:17cqw;font-size:14cqw'}">20<i>27</i></div><div class="mo" style="top:${sq?25:31}cqw">JANUARY · ON ZOOM</div>`
   +SESS.map((s,i)=>`<div class="lt" style="left:${L[i][0]}cqw;top:${L[i][1]}cqw;width:${L[i][2]}cqw;box-sizing:border-box"><div class="n">LESSON ${i+1}</div><div class="ti">${s.lesson}</div>${sq?'':`<div class="bl">${s.bl}</div>`}</div>`).join('')
   +`<div class="ch" style="top:${sq?45:58}cqw;${sq?'font-size:3.4cqw':''}">What time is it where you are?</div>`+(sq?'':'<div class="cs" style="top:64cqw">BOTH LESSONS · YOUR LOCAL TIME</div>')
   +ZONES.map((z,i)=>`<div class="ck${z[3]?' h':''}" style="left:${C[i][0]}cqw;top:${C[i][1]}cqw;${sq?'width:14cqw;height:14cqw':''}"><div class="i">${z[0]}</div><div class="d">${z[1]}</div><div class="t">${z[2]}</div></div>`).join('')}
 return `<div class="vf${sq?' sq':''}${p?' p':''}" style="width:${w}px">${head}${body}${foot}</div>`}

/* ================= DAN: MENU ================= */
const MENU=()=>`<div class="sc-win k-menu"><div class="sc-side"><div class="lg"><img src="${LOGO}" alt="LDAH">DAN</div>
 <div class="sc-gh open">Dashboard <i>›</i></div><a class="act">Home</a><a>Interactions</a><a>Contacts</a><a>Reports</a><a>Training Videos</a>
 <div class="sc-gh k-admh">Admin <i>›</i></div><div class="sc-agrp k-agrp"><a>Events Dashboard</a><a>User Roles</a><a>Audit Log</a><a>Recordings Archive</a><a class="k-veblink">Virtual Event Builder</a><a>Office Screenings</a></div></div>
 <div class="sc-home"><h3>Home</h3><div class="sc-ghost"><u style="width:40%"></u><u style="width:70%"></u><u style="width:55%"></u></div><div class="sc-ghost"><u style="width:30%"></u><u style="width:62%"></u></div><div class="sc-ghost"><u style="width:48%"></u><u style="width:66%"></u></div></div></div>`;

/* ================= DAN: THE BUILDER PAGE ================= */
const V0={series:'Learning Labs',month:'January',year:'2027',s:[{date:'01/13/2027',start:'05:00 PM',end:'06:00 PM',lesson:'',desc:''},{date:'01/27/2027',start:'05:00 PM',end:'06:00 PM',lesson:'',desc:''}],presenter:'',grant:'',spons:['IDEAs that Work'],partner:true};
const V1=Object.assign({},V0,{s:[{date:'01/13/2027',start:'05:00 PM',end:'06:00 PM',lesson:'IDEA/Chapter 60',desc:'Know the laws'},{date:'01/27/2027',start:'05:00 PM',end:'06:00 PM',lesson:'Understanding Evaluations',desc:'What testing shows'}],presenter:'Malia Kahale',grant:'HI-PTI'});
const FLD=(label,cls,val,ph,sel)=>`<div><span class="sc-l">${label}</span><div class="sc-i${sel?' sel':''}${val?'':' ph'} ${cls}">${val||ph}</div></div>`;

 <div class="sc-r3 k-when${i}">${FLD('Date (HST) *','k-d'+i,s.date,'mm/dd/yyyy')}${FLD('Start (HST) *','k-st'+i,s.start,'--:-- --')}${FLD('End (HST) *','k-en'+i,s.end,'--:-- --')}</div>
 ${FLD('Lesson *','k-les'+i,s.lesson,'Pick last year’s lesson or type a new one')}${FLD('One short line for the flyer','k-desc'+i,s.desc,'For example: Know the laws')}</div>`;
const VARIANTS=[['Hawaiʻi flyer (letter)',{}],['Partner flyer (letter)',{p:1}],['Hawaiʻi square (Facebook / Instagram)',{sq:1}],['Partner square (Facebook / Instagram)',{p:1,sq:1}]];
const FLCARDS=()=>VARIANTS.map((v,i)=>`<div class="vb-fl k-fl${i}"><div class="vb-flh">${v[0]}</div>${FLY(Object.assign({w:138},v[1]))}<div class="vb-ok">Layout check passed</div><span class="vb-dl k-dl${i}">Download</span></div>`).join('');
const LISTROW=st=>st?`<table class="vb-list"><tr><th>Event</th><th>First session</th><th>Status</th><th></th></tr><tr class="k-lrow"><td>Learning Labs — January 2027</td><td>2027-01-13</td><td><span class="vb-pill${st==='live'?' live':''} k-lpill">${st==='live'?'On the website':'Hidden draft'}</span></td><td><a>Edit</a> · <a>Flyer</a> · <a class="k-oep">Open in Events &amp; Programs</a></td></tr></table>`:'None yet.';
function PAGE(o={}){const v=o.v||V0;
 return `<div class="sc-win k-vb"><div class="vb-top"><h3>Virtual Event Builder <i>i</i></h3></div><div class="vb-vp"><div class="vb-in k-in">
 <div class="k-editw">${o.editing?EDITBAR(o.editing):''}</div>
 <div class="sc-r3 k-row1">${FLD('Series *','k-series',v.series,'',1)}${FLD('Month *','k-month',v.month,'',1)}${FLD('Year *','k-year',v.year,'')}</div>
 <div class="vb-theme k-theme">Flyer theme: <b>New Year (midnight sky, fireworks)</b></div>
 <div class="k-sessions">${v.s.map(SESSROW).join('')}</div>
 <div class="sc-r2 k-pg">${FLD('Presenter','k-pres',v.presenter,'')}${FLD('Grant / Program','k-grant',v.grant,'For example: HI-PTI')}</div>
 <div class="vb-lbl">Sponsor logos on the flyer</div><div class="k-spons"><span class="vb-chk"><span class="sc-cbx on"></span> IDEAs that Work</span><span class="vb-chk"><span class="sc-cbx k-kom"></span> Ke Ola Mamo</span></div>
 <div class="vb-chk k-ptick" style="margin-top:8px"><span class="sc-cbx${v.partner?' on':''}"></span> Also list it on the six partner island pages</div>
 <div class="vb-btns k-btns"><span class="vb-btn k-make">Make flyers</span><span class="vb-btn gh k-save">Save as hidden draft</span><span class="vb-btn gh k-pub">${o.editing==='live'?'Hide from website':'Publish to website…'}</span></div>
 <p class="vb-mut k-savenote">Saving keeps the event hidden from ldahawaii.org. Publish puts it on the website straight away.</p>
 <div class="vb-lbl k-flh" style="margin-top:12px">Flyers</div><p class="vb-mut k-flnote">${o.flyers?'All four flyers passed the layout check.':'Click Make flyers to draw all four.'}</p><div class="vb-fls k-fls">${o.flyers?FLCARDS():''}</div>
 <div class="vb-lbl k-listh" style="margin-top:14px">Events made with the builder</div><div class="vb-mut k-list">${LISTROW(o.list)}</div>
 </div></div><div class="vb-toast k-toast"></div></div>`}
const EDITBAR=st=>`<div class="vb-edit k-edit">Editing: Learning Labs — January 2027 <span class="vb-pill${st==='live'?' live':''}">${st==='live'?'On the website':'Hidden draft'}</span> <a>Start a new event</a></div>`;
const TZ=()=>`<table class="vb-tz k-tz"><tr><th>Where</th><th>Local day and time</th></tr>${ZONES.map((z,i)=>`<tr class="${z[3]?'home ':''}k-z${i}"><td>${z[0]}</td><td>${z[1]} · ${z[2]}</td></tr>`).join('')}</table>`;

/* ================= THE WEBSITE + THE PARTNER PAGE ================= */
const WEBEV=()=>`<div class="vw k-web" style="left:58px"><div class="vw-bar"><i></i><i></i><i></i><span>ldahawaii.org · Events</span></div><div class="vw-b"><div class="vw-crumb">Events</div><div class="vw-h">Upcoming events</div>
 <div class="vw-ev k-wev">${FLY({w:130})}<div><h4>Learning Labs — January 2027</h4><div class="vw-m">Virtual (Zoom)<br>January 13, 2027, 5:00 PM - 6:00 PM - IDEA/Chapter 60<br>January 27, 2027, 5:00 PM - 6:00 PM - Understanding Evaluations<br>Presented by Malia Kahale.</div><span class="vw-reg k-wreg">Register</span></div></div>
 <div class="vw-rest"><u style="width:70%"></u><u style="width:50%"></u><u style="width:62%"></u></div></div></div>`;

/* ---- quiz: the standard ask()/QUIZ pair. Each answer goes to ldahTrack.quiz(sec,i,correct). ---- */
window.QUIZ_TOTAL=3;
function ask(Q,i,sec){const w=q('.qz-wrap');
 w.innerHTML=`<div class="qz-card"><div class="qz-n">Question ${i+1} of 3</div><div class="qz-q">${Q.q}</div>${Q.o.map((o,j)=>`<button class="qz-o" data-j="${j}"><span class="qz-L">${'ABC'[j]}</span><span>${o}</span></button>`).join('')}<div class="qz-fb"></div></div>`;
 const card=w.firstChild,fb=card.querySelector('.qz-fb'),btns=[...card.querySelectorAll('.qz-o')];
 const finish=()=>{btns.forEach(b=>b.disabled=true);btns[Q.a].classList.add('qz-yes');const st=document.querySelectorAll('.scene.on .qz-stars i')[i];if(st)st.classList.add('on');fb.className='qz-fb good';fb.textContent='Yes! '+Q.y};
 if(FAST){finish();return Promise.resolve()}
 return new Promise(res=>{btns.forEach((b,j)=>b.onclick=async()=>{
  if(b.disabled)return;
  if(window.ldahTrack)ldahTrack.quiz(sec,i,j===Q.a);
  if(j===Q.a){finish();const p=pos(b);confetti(p.x+60,p.y+20,70);await speak('Yes! '+Q.y,run);await wait(700);res()}
  else{b.disabled=true;b.classList.add('qz-no');fb.className='qz-fb bad';fb.textContent='Not quite. '+Q.n+' Try again.';speak('Not quite. '+Q.n+' Try again.',run)}})})}
const QUIZ=(sec,qs)=>({cls:'quiz',html:()=>HEAD('Quick check','Your turn!')+`<div class="qz-stars">${qs.map(()=>'<i></i>').join('')}</div><div class="qz-wrap"><div class="qz-intro">Three quick questions.<small>Your first answer to each one counts. Click the answer you think is right.</small></div></div>`,
 steps:[{say:'Quick check. Three quick questions. Your first answer to each one counts.'},
  ...qs.map((Q,i)=>({say:`Question ${i+1}. ${Q.q}`,act:()=>ask(Q,i,sec)}))]});
