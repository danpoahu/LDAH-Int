<title>Volunteer Applications and Roster — Training</title>
<link rel="stylesheet" href="deck-base.css">
<!-- Same Firebase build as the dashboard, so the deck shares its sign-in and records progress. -->

<style>
/* Every class here starts with v so nothing collides with deck-base.css. */
.vfont{font-family:"Outfit","Source Sans 3","Nunito Sans",-apple-system,"Segoe UI",Arial,sans-serif}
/* ---------- road map (scene 2) ---------- */
.vmap{position:absolute;left:70px;top:140px;width:1140px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.vmc{background:#fff;border-radius:16px;box-shadow:0 10px 26px rgba(15,23,42,.1);padding:14px 16px;border-top:7px solid #0891B2;opacity:0;height:236px;position:relative}

.vmc.web .n{background:#D63384}.vmc.ros .n{background:#16A34A}.vmc.fix .n{background:#F59E0B}
.vmc h4{margin:10px 0 4px;font-size:21px;color:#0B3A53;line-height:1.15}

.vmc .w{position:absolute;left:16px;bottom:12px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#94A3B8}
/* ---------- dashboard window ---------- */

.vw-vp{position:absolute;top:40px;left:0;right:0;bottom:0;overflow:hidden}
.vw-in{position:relative;padding:10px 16px 40px}
.vh2{font-size:21px;font-weight:800;color:#0B3A53;margin:0 0 6px}
.vtabs{display:flex;gap:2px;border-bottom:2px solid #E2E8F0;margin-bottom:9px}
.vtabs span{font-size:13px;font-weight:700;color:#64748B;padding:6px 11px;border-bottom:3px solid transparent;margin-bottom:-2px}

.vtool{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}

.vchip.rc.on{background:#0B3A53;border-color:#0B3A53}
.vsrch{flex:1;min-width:180px;border:1px solid #CBD5E1;background:#fff;border-radius:999px;padding:5px 12px;font-size:12px;color:#94A3B8}
.vgh{display:flex;align-items:center;gap:8px;margin:10px 0 6px;font-weight:800;font-size:14px;color:#0B3A53}
.vgh i{font-style:normal;background:#E2E8F0;color:#475569;font-size:11px;border-radius:999px;padding:1px 8px}

.vb-new{background:#EEF2FF;color:#4338CA}.vb-contacted{background:#E0F2FE;color:#0369A1}.vb-interviewing{background:#F3E8FF;color:#7C3AED}.vb-accepted{background:#DCFCE7;color:#15803D}.vb-declined{background:#FEE2E2;color:#B91C1C}

.vname{font-weight:800;font-size:13.5px;color:#0F172A;line-height:1.15;white-space:nowrap}
.vopp{display:inline-block;font-size:10.5px;font-weight:700;color:#0E7490;background:#ECFEFF;border-radius:6px;padding:1px 6px;margin-top:2px;white-space:nowrap}
.vmeta{color:#64748B;font-size:11px;line-height:1.4}

.vftag{display:inline-block;margin-top:5px;font-size:10px;font-weight:700;border-radius:999px;padding:1px 8px;border:1px solid #E2E8F0;background:#F1F5F9;color:#64748B}

.vacts{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;align-items:center}

.vtag.none{background:#F1F5F9;color:#64748B;border-color:#E2E8F0}

.vtag.ok{background:#F0FDF4;color:#15803D;border-color:#BBF7D0}
.vtag.hrs{background:#ECFEFF;color:#0E7490;border-color:#A5F3FC}
.vhelp{color:#15803D;font-size:10.5px;font-weight:700;margin-top:2px}

.vmvp{position:absolute;top:46px;bottom:46px;left:0;right:0;overflow:hidden}
.vmin{padding:12px 18px 24px;font-size:12.5px}
.vmf{position:absolute;left:0;right:0;bottom:0;height:46px;border-top:1px solid #E2E8F0;display:flex;align-items:center;justify-content:flex-end;padding:0 14px;gap:10px;background:#fff}
.vbtn{font-size:12px;font-weight:700;border:1px solid #CBD5E1;background:#fff;color:#0E6E8C;border-radius:8px;padding:6px 13px;white-space:nowrap;display:inline-block}
.vbtn.pri{background:#0E7490;border-color:#0E7490;color:#fff}
.vbtn.dis{opacity:.6}
.vac-head{display:flex;gap:10px;align-items:center}
.vac-head .vav{width:40px;height:40px;font-size:15px}
.vac-name{font-size:17px;font-weight:800;color:#0F172A}
.vac-sub{font-size:12px;color:#0E7490}
.vac-badge{margin-left:auto;font-size:11px;font-weight:800;border-radius:999px;padding:3px 10px;text-transform:capitalize}
.vline{margin-top:8px;font-size:12px;color:#64748B}
.vline b{color:#334155}
.vdet{margin-top:8px;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:9px;padding:8px 11px}
.vdet .l{font-size:10px;font-weight:800;color:#64748B;text-transform:uppercase;letter-spacing:.05em}
.vdet .v{font-size:12.5px;color:#1E293B;margin-bottom:5px}
.vfa{margin-top:10px;border:1px solid #BAE6FD;border-radius:10px;background:#fff;overflow:hidden}
.vfa-s{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#F0F9FF}

.vfa-dl{display:grid;grid-template-columns:42% 1fr;gap:2px 10px;font-size:11.5px}
.vfa-dl span:nth-child(odd){color:#64748B}

.vstep{display:inline-flex;border:1px solid #E2E8F0;border-radius:999px;overflow:hidden;margin-top:5px}

.vstep span:last-child{border-right:0}
.vstep span.on.s-new{background:#4338CA;color:#fff}.vstep span.on.s-contacted{background:#0369A1;color:#fff}.vstep span.on.s-interviewing{background:#7C3AED;color:#fff}.vstep span.on.s-accepted{background:#15803D;color:#fff}.vstep span.on.s-declined{background:#B91C1C;color:#fff}
.vfoot{margin-top:8px}
.varch{font-size:11.5px;font-weight:700;color:#F97316;border:1px solid #FED7AA;background:#FFF7ED;border-radius:8px;padding:5px 12px;display:inline-block}
.vonr{font-size:11.5px;font-weight:700;color:#15803D}
.vta{border:1px solid #CBD5E1;border-radius:8px;padding:7px 9px;font-size:12px;min-height:46px;margin-top:4px;color:#94A3B8;white-space:pre-wrap}
.vta.typed,.vin.typed{color:#1E293B}
.vta.typing::after,.vin.typing::after,.wf.typing::after,.pf.typing::after{content:"|";color:#0891B2;animation:blink .6s steps(1) infinite}
.vnote{margin-top:6px}
/* documents panel */
.vds{background:#F8FAFC;border:1px solid #E2E8F0;border-radius:10px;padding:9px 11px;margin-top:5px}
.vds-l{font-size:11.5px;color:#475569}
.vds-row{display:flex;align-items:center;gap:8px;margin-top:7px;flex-wrap:wrap}
.vds-row label{font-size:11px;font-weight:700;color:#334155}
.vin{border:1px solid #CBD5E1;border-radius:7px;background:#fff;padding:5px 9px;font-size:12px;min-width:150px;height:28px;white-space:nowrap}
.vdr{display:flex;align-items:center;gap:8px;border-bottom:1px solid #F1F5F9;padding:7px 2px}
.vdr .t{font-weight:700;font-size:12.5px;color:#1E293B;flex:1}
.vdp{font-size:10.5px;font-weight:800;border-radius:999px;padding:2px 9px}
.vdp.no{background:#F1F5F9;color:#64748B}.vdp.ok{background:#F0FDF4;color:#15803D}.vdp.hrs{background:#ECFEFF;color:#0E7490}
.vlink{font-size:11px;font-weight:700;color:#0E7490;text-decoration:underline}
.vdsub{font-size:11px;color:#64748B;padding:0 2px 6px}
.vdsub i{font-family:"Brush Script MT","Segoe Script",cursive;font-size:15px;color:#0F172A;font-style:normal}
.vec{font-size:11.5px;padding:3px 2px;color:#334155}
.vec span{color:#64748B}.vec a{color:#0E7490}
.vsplit{display:flex;gap:12px;font-size:11px;color:#64748B;padding:4px 2px}
.vsplit b{color:#0F172A}
.vlog{width:100%;border-collapse:collapse;font-size:10.5px;margin-top:4px}

/* toast + confirm */
.vtoast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:#16A34A;color:#fff;font-weight:700;font-size:13px;border-radius:10px;padding:9px 16px;z-index:20;white-space:nowrap;box-shadow:0 8px 20px rgba(0,0,0,.2)}

.vcsh{position:absolute;inset:0;background:rgba(15,23,42,.25);z-index:21}
/* ---------- website window ---------- */
.wb{position:absolute;left:58px;top:118px;width:712px;height:568px;background:#E6F4F8;border-radius:14px;box-shadow:0 18px 44px rgba(15,23,42,.22);overflow:hidden;z-index:4;color:#1E293B}

.wsh{position:absolute;inset:0;background:rgba(15,23,42,.45)}

.wf.ph{color:#94A3B8}.wf.ta{height:44px;white-space:normal}

<script>
const DECK_ID='volunteer-applications-and-roster';
window.QUIZ_TOTAL=5;

/* Every screen below is drawn in HTML/CSS from the live code (2026-10-02):
   Int v152.3 CMS -> Volunteers (cmsRenderApplications, cmsVolAppRenderModal, cmsRenderRoster,
   cmsRosterDetails, cmsRenderVolDocs, cmsVolDocsTag) and website v63.0 (volunteer.html Step 2,
   volunteer-documents.html). Every person here is made up; emails use example.org. */
const LOGO='../logo_blue.png';

/* ---- small helpers ---- */
const tap=async(s,ms=850)=>{const e=typeof s==='string'?q(s):s;await move(e,ms);await click(e);return e};
function all(s){return[...document.querySelectorAll('.scene.on '+s)]}
const show=(e,ms=500)=>anim(e,[{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],ms,'ease-out').then(()=>{e.style.opacity=1});
const PTS=(items,top=140)=>`<div class="abs" style="left:790px;top:${top}px;width:440px"><ul class="pts">${items.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
const NOTE=(html,top,cls='')=>`<div class="vnt ${cls}" style="left:790px;top:${top}px;width:440px;font-size:16px">${html}</div>`;
/* Scroll an inner box so `target` sits `off` px below the top of its viewport. */
async function scrollTo(inner,target,off=8,ms=700){const box=typeof inner==='string'?q(inner):inner;if(!box)return;
 let y=0;if(typeof target==='number')y=target;else{const t=typeof target==='string'?q(target):target;if(!t)return;y=Math.max(0,pos(t).y-pos(box).y-off)}
 box.style.transition=`transform ${D(ms)}ms cubic-bezier(.45,.05,.25,1)`;box.style.transform=`translateY(${-y}px)`;await wait(ms+60)}
function toast(msg){const w=q('.vw')||q('.wb');const t=add(`<div class="vtoast">${msg}</div>`,w);pop(t);if(!FAST)setTimeout(()=>t.remove(),2600);else t.remove();return t}
async function confirmBox(title,lines){const w=q('.vw');const sh=add('<div class="vcsh"></div>',w);
 const c=add(`<div class="vconf"><h5>${title}</h5>${lines.map(l=>`<p>${l}</p>`).join('')}<div class="r"><span class="no">Cancel</span><span class="ok">OK</span></div></div>`,w);
 await pop(c);await wait(900);await tap(c.querySelector('.ok'),700);c.remove();sh.remove()}
const typeIn=async(s,text,ms=45)=>{const e=typeof s==='string'?q(s):s;await move(e,600);await click(e);e.classList.add('typed');await type(e,text,ms);return e};

/* ---- the people (all made up) ---- */

 mk:{n:'Malia Kahale',ini:'MK',c:'#0891B2',opp:'Event Helper',em:'malia.k@example.org',ph:'(808) 555-0117',d:'Oct 2, 2026',snip:'My son has dyslexia. I want to help other families.',full:true},
 rs:{n:'Ryan Silva',ini:'RS',c:'#F97316',opp:'Office Support',em:'ryan.s@example.org',ph:'(808) 555-0163',d:'Sep 29, 2026',snip:'Retired teacher, free weekday mornings.',full:false,sent:'Link sent Sep 30'},
 jl:{n:'Jenna Lum',ini:'JL',c:'#65A30D',opp:'Family Outreach',em:'jenna.l@example.org',ph:'(808) 555-0148',d:'Sep 24, 2026',snip:'Studying special education at UH.',full:true},
 kd:{n:'Kai Domingo',ini:'KD',c:'#7C3AED',opp:'Event Helper',em:'kai.d@example.org',ph:'(808) 555-0190',d:'Sep 18, 2026',snip:'Happy to set up and greet at events.',full:true},
 tf:{n:'Tess Ferreira',ini:'TF',c:'#E31C79',opp:'Office Support',em:'tess.f@example.org',ph:'(808) 555-0102',d:'Sep 3, 2026',snip:'Looking for weekend hours only.',full:false},
 la:{n:'Lani Akana',ini:'LA',c:'#0E7490',opp:'Event Helper',em:'lani.a@example.org',ph:'(808) 555-0125',since:'Jun 2026',help:'Helped 4 times'},
 br:{n:'Ben Ramos',ini:'BR',c:'#B45309',opp:'Office Support',em:'ben.r@example.org',ph:'(808) 555-0171',since:'Aug 2026'}
};
const SUP='Pua Medeiros', STAFF='Kehau Lee';

/* ================= DASHBOARD ================= */

const TABS=t=>`<div class="vh2">Volunteers</div><div class="vtabs"><span class="${t==='r'?'on':''} k-trost">Roster<b>3</b></span><span class="${t==='a'?'on':''} k-tapps">Applications</span><span>Help Requests</span><span>Opportunities</span></div>`;
/* One Applications card. o: {st, sentNow} */
const ACARD=(k,st,o={})=>{const p=P[k];const sent=o.sentNow?'Link sent today':p.sent;
 return `<div class="vcard k-c-${k}"><span class="vpill vb-${st}">${st}</span><div class="vhead"><div class="vav" style="background:${p.c}">${p.ini}</div><div style="min-width:0"><div class="vname">${p.n}</div><span class="vopp">${p.opp}</span></div></div>
 <div class="vmeta">Applied ${p.d}</div><div class="vsnip">${p.snip}</div>
 <span class="vftag${p.full?' on':''} k-ft-${k}">${p.full?'Full application':'Short form only'}</span>
 <div class="vacts k-acts-${k}"><span class="vact k-view-${k}">View application</span><span class="vact k-send-${k}${o.sentNow?' sent':''}">${o.sentNow?'Resent ✓ just now':'Resend application link'}</span>${sent?`<span class="vsent k-sl-${k}">${sent}</span>`:''}</div></div>`};
/* o.st: status overrides, o.hide: keys left out, o.sentNow: key just sent */
const APPS=(o={})=>{const st=Object.assign({mk:'new',rs:'new',jl:'contacted',kd:'interviewing',tf:'declined'},o.st||{});const hide=o.hide||[];
 const G=[['new','New'],['contacted','Contacted'],['interviewing','Interviewing'],['declined','Declined']];
 const keys=['mk','rs','jl','kd','tf'].filter(k=>!hide.includes(k)&&st[k]!=='accepted');
 return TABS('a')+`<div class="vtool k-chips"><span class="vchip on">All</span><span class="vchip">New</span><span class="vchip">Contacted</span><span class="vchip">Interviewing</span><span class="vchip">Declined</span><span class="vchip" style="margin-left:auto">Export CSV</span></div>`+
 G.map(([g,t])=>{const ks=keys.filter(k=>st[k]===g);return `<div class="vgh k-g-${g}">${t}<i>${ks.length}</i></div>`+(ks.length?`<div class="vgrid">${ks.map(k=>ACARD(k,g,{sentNow:o.sentNow===k})).join('')}</div>`:'<div class="vmeta" style="padding:4px 2px">No applications here.</div>')}).join('')};
/* One Roster card. tags: html for the docs tags */
const RCARD=(k,tags)=>{const p=P[k];return `<div class="vcard k-r-${k}"><span class="vchk"></span><div class="vhead"><div class="vav" style="background:${p.c}">${p.ini}</div><div style="min-width:0"><div class="vname">${p.n}</div><span class="vopp">${p.opp}</span></div></div>
 <div class="vmeta"><a>${p.em}</a><br>${p.ph}<br><span style="color:#94A3B8">Volunteer since ${p.since||'Oct 2026'}</span></div>${p.help?`<div class="vhelp">✓ ${p.help}</div>`:''}

const TAG={none:'<span class="vtag none">Docs not sent</span>',one:'<span class="vtag part">Docs 1/3</span>',two:'<span class="vtag part">Docs 2/3</span>',done:'<span class="vtag ok">Docs 3/3</span><span class="vtag hrs">6.5 h logged</span>'};
const ROSTER=(mk='none')=>TABS('r')+`<div class="vtool"><span class="vsrch">Search approved volunteers by name or email…</span><span class="vchip rc on">All 3</span><span class="vchip rc">Event Helper 2</span><span class="vchip rc">Office Support 1</span></div>
 <div class="vgrid" style="margin-top:10px">${RCARD('mk',TAG[mk])}${RCARD('la','<span class="vtag ok">Docs 3/3</span><span class="vtag hrs">12 h logged</span>')}${RCARD('br',TAG.one)}</div>`;

/* The application popup (Applications tab). o: {st, notes, open} */
const STEPS=[['new','New'],['contacted','Contacted'],['interviewing','Interviewing'],['accepted','Accepted'],['declined','Declined']];
const FULLAPP=(open)=>`<div class="vfa k-fa"><div class="vfa-s"><b>Full application</b><span class="vfa-st">Signed Oct 2, 2026</span><span class="chev">${open?'▲':'▼'}</span></div>${open?`<div class="vfa-b">
 <div class="vfa-act"><span class="vbtn k-print">Print / Save PDF</span></div>
 <div class="vfa-h k-s1">Applicant</div><div class="vfa-dl"><span>Name (last, first, middle)</span><span>Kahale, Malia Kēhau</span><span>City, state, ZIP</span><span>Kāneʻohe, HI 96744</span><span>Date of birth</span><span>Mar 14, 1988</span><span>Physical limitations</span><span>none</span></div>
 <div class="vfa-h">Volunteer experience and availability</div><div class="vfa-dl"><span>Volunteered before?</span><span>Yes</span><span>Hours</span><span>4 per week</span></div>
 <div class="vfa-h">In case of emergency, notify</div><div class="vfa-dl"><span>Contact 1</span><span>Leilani Kahale (Mother) · (808) 555-0142</span></div>
 <div class="vfa-h k-s2">Driving information</div><div class="vfa-dl"><span>Able to use own car?</span><span>Yes</span><span>Driver’s license #</span><span>H00-000-000</span><span>Insurance carrier</span><span>Example Mutual</span></div>
 <div class="vfa-h">Criminal history</div><div class="vfa-dl"><span>Conviction or pending charges?</span><span>No</span></div>
 <div class="vfa-h">Certification and signature</div><div class="vfa-dl"><span>Signature (typed)</span><span>Malia Kahale</span><span>Signed</span><span>Oct 2, 2026, 9:14 AM HST</span></div></div>`:''}</div>`;
const APPMOD=(o={})=>{const p=P.mk,st=o.st||'new';return `<div class="vsh"></div><div class="vmod k-mod"><div class="vmh"><img src="${LOGO}" alt="">${p.n}<span class="x">×</span></div><div class="vmvp"><div class="vmin k-min">

 <div class="vline">Opportunity: <b>${p.opp}</b> · Applied Fri, Oct 2, 2026</div>
 <div class="vdet"><div class="l">Why are you interested?</div><div class="v">${p.snip}</div><div class="l">Additional notes</div><div class="v" style="margin:0">Free most weekends and evenings.</div></div>

const DOCS=(s)=>{const done=s==='done',sent=s!=='none';
 return `<div class="vds k-dsend"><div class="vds-l k-sline">${sent?`Sent Oct 2, 2026 by ${STAFF}`:'Not sent yet. The volunteer gets one personal link to all four documents.'}</div>

/* ---- quiz (same as entering-screening-results) ---- */
function ask(Q,i,sec){const w=q('.qwrap');
 w.innerHTML=`<div class="qcard"><div class="qn">Question ${i+1}</div><div class="qq">${Q.q}</div>${Q.o.map((o,j)=>`<button class="qo" data-j="${j}"><span class="L">${'ABC'[j]}</span><span>${o}</span></button>`).join('')}<div class="qfb"></div></div>`;
 const card=w.firstChild,fb=card.querySelector('.qfb'),btns=[...card.querySelectorAll('.qo')];
 const finish=()=>{btns.forEach(b=>b.disabled=true);btns[Q.a].classList.add('yes');const st=all('.stars i')[i];if(st)st.classList.add('on');fb.className='qfb good';fb.textContent='Yes! '+Q.y};
 if(FAST){finish();return Promise.resolve()}
 return new Promise(res=>{btns.forEach((b,j)=>b.onclick=async()=>{
  if(b.disabled)return;
  if(window.ldahTrack)ldahTrack.quiz(sec,i,j===Q.a);
  if(j===Q.a){finish();const p=pos(b);confetti(p.x+60,p.y+20,70);await speak('Yes! '+Q.y,run);await wait(700);res()}
  else{b.disabled=true;b.classList.add('no');fb.className='qfb bad';fb.textContent='Not quite. '+Q.n+' Try again.';speak('Not quite. '+Q.n+' Try again.',run)}})})}
/* The first quiz explains how quizzes work; later ones just start. */

 steps:[{say:first?`Quick check! ${qs.length} questions. Click the answer you think is right. If you miss, just try again. Your first answer to each question counts.`:`Quick check. ${qs.length} questions.`},
  ...qs.map((Q,i)=>({say:`Question ${i+1}. ${Q.q}`,act:()=>ask(Q,i,sec)}))]});
