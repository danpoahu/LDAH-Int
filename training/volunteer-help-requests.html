<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Volunteer Help Requests — Training</title>
<link rel="stylesheet" href="deck-base.css">
<!-- Same Firebase build as the dashboard, so the deck shares its sign-in and records progress. -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
/* Every class here starts with vr- so nothing collides with deck-base.css. */
.vr-f{font-family:"Outfit","Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
/* ---------- DAN window ---------- */
.vr-win{position:absolute;left:58px;top:118px;width:712px;height:568px;background:#F4F7FA;border-radius:14px;box-shadow:0 18px 44px rgba(15,23,42,.22);overflow:hidden;color:#1E293B;z-index:4;font-family:"Outfit","Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.vr-top{height:40px;background:#0B3A53;color:#fff;display:flex;align-items:center;gap:10px;padding:0 14px;font-size:13px;font-weight:700}
.vr-top img{height:26px;background:#fff;border-radius:5px;padding:2px 4px}
.vr-top span{opacity:.75;font-weight:600}
.vr-vp{position:absolute;top:40px;left:0;right:0;bottom:0;overflow:hidden}
.vr-in{position:relative;padding:12px 16px 40px}
.vr-h2{font-size:21px;font-weight:800;color:#0B3A53;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.vr-ib{display:inline-block;width:18px;height:18px;border-radius:50%;background:#0891B2;color:#fff;font-size:11px;font-style:normal;text-align:center;line-height:18px}
.vr-tabs{display:flex;gap:3px;margin-bottom:11px;flex-wrap:nowrap}
.vr-tab{padding:6px 11px;border-radius:12px;font-weight:700;font-size:12px;color:#64748B;white-space:nowrap;transition:background .3s,color .3s}
.vr-tab.on{background:#0891B2;color:#fff}
.vr-tab b{background:#0891B2;color:#fff;font-size:10px;border-radius:999px;padding:1px 7px;margin-left:5px}
.vr-tab b.or{background:#F97316}
.vr-tab.on b{box-shadow:0 0 0 1px rgba(255,255,255,.6)}
/* left menu */
.vr-side{position:absolute;left:0;top:40px;bottom:0;width:196px;background:#fff;border-right:1px solid #E2E8F0;padding:10px 10px}
.vr-gh{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#64748B;padding:8px 8px 4px;border-radius:6px;display:flex;justify-content:space-between}
.vr-gh i{font-style:normal;transition:transform .3s}.vr-gh.open i{transform:rotate(90deg)}
.vr-side a{display:block;font-size:12.5px;padding:4px 9px;border-radius:6px;color:#334155;transition:background .3s}
.vr-side a.act{background:#E0F2FE;color:#0E6E8C;font-weight:700}
.vr-grp{max-height:0;overflow:hidden;transition:max-height .5s ease}.vr-grp.open{max-height:300px}
.vr-home{position:absolute;left:196px;right:0;top:40px;bottom:0;padding:16px 18px}
.vr-home h3{margin:0 0 10px;font-size:19px;color:#0B3A53}
.vr-ghost{background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(15,40,70,.08);height:84px;margin-bottom:10px;padding:12px}
.vr-ghost u{display:block;height:8px;border-radius:4px;background:#E2E8F0;margin-bottom:8px;text-decoration:none}
.vr-empty{background:#fff;border:1px dashed #CBD5E1;border-radius:12px;padding:26px 20px;text-align:center;color:#64748B;font-size:13px;line-height:1.5}
/* roster */
.vr-tool{display:flex;gap:6px;align-items:center;margin-bottom:7px;flex-wrap:wrap}
.vr-srch{flex:1;min-width:200px;border:1px solid #CBD5E1;background:#fff;border-radius:999px;padding:6px 12px;font-size:11.5px;color:#94A3B8;white-space:nowrap;overflow:hidden}
.vr-gbtn{font-size:11px;font-weight:700;border:1px solid #CBD5E1;background:#fff;color:#0E6E8C;border-radius:8px;padding:5px 10px;white-space:nowrap;transition:transform .15s}
.vr-chip{border:1px solid #E7ECF1;background:#fff;border-radius:999px;padding:4px 11px;font-size:11px;font-weight:600;color:#64748B}
.vr-chip.on{background:#0891B2;color:#fff;border-color:#0891B2}
.vr-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.vr-card{position:relative;background:#fff;border:1px solid #E7ECF1;border-radius:12px;padding:11px;font-size:11.5px;box-shadow:0 6px 20px rgba(2,132,199,.06);transition:box-shadow .25s,border-color .25s;min-width:0}
.vr-card.sel{border-color:#0891B2;box-shadow:0 0 0 2px rgba(8,145,178,.28),0 10px 26px rgba(8,145,178,.12)}
.vr-chk{position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:7px;border:2px solid #CBD5E1;background:#fff;transition:all .2s}
.vr-card.sel .vr-chk{background:#0891B2;border-color:#0891B2}
.vr-card.sel .vr-chk::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.vr-hd{display:flex;gap:8px;align-items:center;padding-right:24px;margin-bottom:6px}
.vr-av{width:32px;height:32px;border-radius:50%;color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
.vr-nm{font-weight:800;font-size:13px;color:#0F172A;white-space:nowrap}
.vr-opp{display:inline-block;font-size:10px;font-weight:700;padding:1px 8px;border-radius:999px;background:#E0F2FE;color:#0369A1;margin-top:2px;white-space:nowrap}
.vr-meta{color:#64748B;font-size:10.5px;line-height:1.45}
.vr-meta a{color:#0891B2}
.vr-more{font-size:10.5px;font-weight:700;color:#0891B2;text-decoration:underline;margin-top:5px;display:inline-block}
.vr-bar{position:absolute;left:34px;right:34px;bottom:16px;background:linear-gradient(135deg,#0E7490,#0891B2);color:#fff;border-radius:999px;padding:9px 12px 9px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 12px 30px rgba(8,145,178,.35);opacity:0;z-index:5;font-size:13px}
.vr-bar.on{opacity:1}
.vr-bar b{font-size:16px}
.vr-clear{background:rgba(255,255,255,.18);border-radius:8px;padding:6px 12px;font-weight:700;font-size:12px}
.vr-coral{background:linear-gradient(135deg,#F97316,#FB923C);color:#fff;border-radius:8px;padding:6px 14px;font-weight:800;font-size:12.5px;transition:transform .15s}
/* modals inside the window */
.vr-sh{position:absolute;inset:40px 0 0 0;background:rgba(15,23,42,.45);z-index:8}
.vr-sh.hi{z-index:10}
.vr-mod{position:absolute;left:30px;width:652px;top:50px;height:510px;background:#fff;border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.35);z-index:9;overflow:hidden;font-size:12px}
.vr-mh{height:46px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid #E2E8F0;font-weight:800;font-size:15px;color:#0B3A53}
.vr-mh img{height:28px}
.vr-mh .x{margin-left:auto;font-size:22px;color:#94A3B8;font-weight:400}
.vr-mh.gr{background:linear-gradient(135deg,#166534,#16A34A);color:#fff;border:0;height:52px}
.vr-mh.cy{background:linear-gradient(135deg,#0E7490,#0891B2);color:#fff;border:0;height:52px}
.vr-mh.gr .x,.vr-mh.cy .x{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;font-size:17px;text-align:center;line-height:25px}
.vr-mh small{display:block;font-size:11px;opacity:.9;font-weight:600}
.vr-mvp{position:absolute;top:46px;bottom:48px;left:0;right:0;overflow:hidden}
.vr-mh.gr+.vr-mvp,.vr-mh.cy+.vr-mvp{top:52px}
.vr-min{padding:12px 18px 20px;transition:transform .7s cubic-bezier(.45,.05,.25,1)}
.vr-mf{position:absolute;left:0;right:0;bottom:0;height:48px;border-top:1px solid #E2E8F0;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:0 14px;background:#fff}
.vr-mf .msg{margin-right:auto;font-size:11px;color:#64748B}
.vr-btn{font-size:12px;font-weight:700;border:1px solid #CBD5E1;background:#fff;color:#0E6E8C;border-radius:8px;padding:6px 13px;white-space:nowrap;display:inline-block;transition:transform .15s,opacity .3s}
.vr-btn.pri{background:#0891B2;border-color:#0891B2;color:#fff}
.vr-btn.sm{font-size:10.5px;padding:4px 9px}
.vr-btn.red{color:#B91C1C}
.vr-cnt{background:#ECFEFF;border:1px solid #CFE9F0;border-radius:10px;padding:8px 12px;font-size:12px;color:#0E6E9C;margin-bottom:6px}
.vr-l{display:block;font-size:11px;font-weight:700;color:#334155;margin:8px 0 3px}
.vr-l span{color:#94A3B8;font-weight:400;font-size:10.5px}
.vr-i{border:1px solid #CBD5E1;border-radius:8px;padding:0 9px;height:29px;line-height:28px;font-size:12px;background:#fff;white-space:nowrap;overflow:hidden;color:#0F172A;transition:border-color .3s,box-shadow .3s}
.vr-i.ph,.vr-ta.ph{color:#94A3B8}
.vr-ta{border:1px solid #CBD5E1;border-radius:8px;padding:6px 9px;font-size:12px;background:#fff;color:#0F172A;min-height:44px;white-space:pre-wrap;line-height:1.4;transition:border-color .3s,box-shadow .3s}
.vr-i.foc,.vr-ta.foc{border-color:#0891B2;box-shadow:0 0 0 3px rgba(8,145,178,.18)}
.vr-i.typing::after,.vr-ta.typing::after{content:"|";color:#0891B2;animation:blink .6s steps(1) infinite}
.vr-r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vr-fine{font-size:10.5px;color:#64748B;margin-top:8px;line-height:1.4}
/* toast + browser confirm */
.vr-toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:#16A34A;color:#fff;font-weight:700;font-size:13px;border-radius:10px;padding:9px 16px;z-index:24;white-space:nowrap;box-shadow:0 8px 20px rgba(0,0,0,.2)}
.vr-csh{position:absolute;inset:0;background:rgba(15,23,42,.25);z-index:21}
.vr-conf{position:absolute;left:146px;top:58px;width:420px;background:#fff;border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.45);z-index:22;padding:14px 16px;font-size:13px;color:#1E293B}
.vr-conf h5{margin:0 0 6px;font-size:12px;color:#64748B;font-weight:700}
.vr-conf p{margin:0 0 6px;line-height:1.4}
.vr-conf .r{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
.vr-conf .ok{background:#0891B2;color:#fff;border-radius:8px;padding:6px 18px;font-weight:700}
.vr-conf .no{border:1px solid #CBD5E1;border-radius:8px;padding:6px 14px;font-weight:700;color:#475569}
/* help request cards */
.vr-rq{background:#fff;border:1px solid #E7ECF1;border-radius:14px;padding:12px 15px;margin-bottom:11px;box-shadow:0 6px 20px rgba(2,132,199,.06)}
.vr-rq.done{background:#F8FAFC}
.vr-rqt{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.vr-rqn{font-weight:800;font-size:15.5px;color:#0F172A}
.vr-rq.done .vr-rqn{color:#64748B}
.vr-sub{color:#64748B;font-size:11.5px;margin-top:2px}
.vr-sub b{color:#334155}
.vr-sub a{color:#0891B2;text-decoration:underline}
.vr-bd{font-size:9.5px;font-weight:800;border-radius:999px;padding:3px 9px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;display:inline-block;vertical-align:middle}
.bd-bl{background:#E0F2FE;color:#0369A1}.bd-am{background:#FEF3C7;color:#B45309}.bd-gr{background:#DCFCE7;color:#15803D}.bd-gy{background:#E2E8F0;color:#475569}.bd-sl{background:#F1F5F9;color:#64748B}
.vr-bds{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:250px}
.vr-foot{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.vr-foot .vr-btn{font-size:11px;padding:5px 10px}
/* roster popup rows */
.vr-sum{padding:9px 18px;font-size:12px;color:#475569;border-bottom:1px solid #E2E8F0}
.vr-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #F1F5F9}
.vr-row .no{width:16px;color:#94A3B8;font-size:11px;text-align:right;flex:none}
.vr-row .who{flex:1;min-width:0}
.vr-row .who b{display:block;font-size:12.5px;font-weight:700}
.vr-row .who small{display:block;font-size:10.5px;color:#64748B}
.vr-row .who small i{font-style:normal;color:#0E7490}
.vr-row .who a{color:#0891B2;text-decoration:underline}
.vr-pick{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid #F1F5F9}
.vr-pick b{display:block;font-size:12.5px}.vr-pick small{display:block;font-size:10.5px;color:#64748B}
.vr-cb{width:18px;height:18px;border:2px solid #94A3B8;border-radius:4px;background:#fff;position:relative;flex:none;transition:all .2s}
.vr-cb.on{background:#2563EB;border-color:#2563EB}
.vr-cb.on::after{content:"";position:absolute;left:4px;top:0;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.vr-lp{padding:9px 12px;margin:0 0 6px;border:2px solid #E2E8F0;border-radius:10px;background:#fff;font-weight:700;font-size:12.5px;transition:border-color .3s}
.vr-lp.on{border-color:#16A34A}
/* attendance */
.vr-attp{margin:0 0 10px;color:#64748B;font-size:12px;line-height:1.45}
.vr-at{display:flex;align-items:center;gap:11px;padding:8px 11px;border:1px solid #E7ECF1;border-radius:10px;margin-bottom:7px;background:#fff;transition:background .3s}
.vr-at.on{background:#F0FDF4}
.vr-at .who{flex:1}.vr-at .who b{display:block;font-size:13px}.vr-at .who small{font-size:10.5px;color:#64748B}
.vr-at .cf{color:#0369A1;font-weight:600}.vr-at .nc{color:#94A3B8}
/* hours */
.vr-hp{padding:8px 0;border-bottom:1px solid #F1F5F9}
.vr-hp .t{display:flex;align-items:baseline;gap:8px}
.vr-hp .t b{flex:1;font-size:13px}
.vr-hp .t .h{font-weight:800;color:#0E7490}.vr-hp .t .h.no{color:#94A3B8}
.vr-er{display:flex;gap:5px;align-items:center;padding:4px 0}
.vr-ti{border:1px solid #CBD5E1;border-radius:6px;padding:3px 7px;font-size:11px;background:#fff;white-space:nowrap}
.vr-ti.sel{flex:1}.vr-ti.sel::after{content:" ▾";color:#64748B}
.vr-er .to{color:#94A3B8;font-size:11px}
.vr-er em{font-style:normal;font-weight:700;width:42px;text-align:right;font-size:11.5px}
.vr-addl{font-size:10.5px;color:#0891B2;text-decoration:underline}
.vr-ck{background:#ECFEFF;border:1px solid #A5F3FC;border-radius:10px;padding:8px 11px;margin:4px 0}
.vr-ck b{color:#0E7490;font-size:12px}
.vr-ck .r{display:flex;gap:8px;align-items:center;margin-top:5px;font-size:11.5px;color:#334155}
.vr-ck small{display:block;font-size:10.5px;color:#64748B;margin-top:4px}
.vr-ty{background:#F0FDF4;border:1px solid #BBF7D0;border-radius:10px;padding:8px 11px;margin:10px 0 4px;display:flex;gap:10px;align-items:center;font-size:11.5px;color:#14532D}
.vr-cap{font-size:10.5px;font-weight:800;color:#166534;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.vr-typ{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12.5px}
.vr-typ .h{color:#0E7490}
/* email + phone */
.vr-mail{position:absolute;left:58px;top:122px;width:404px;background:#fff;border-radius:14px;box-shadow:0 14px 34px rgba(15,23,42,.16);overflow:hidden;z-index:4}
.vr-mail .mh{background:#F1F5F9;padding:8px 14px;font-size:11.5px;color:#475569;border-bottom:1px solid #E2E8F0;line-height:1.55}
.vr-mail .mh b{color:#0F172A}
.vr-mail .mb{padding:10px 16px 14px;font-family:Arial,Helvetica,sans-serif;font-size:12.5px;color:#1d2b32;line-height:1.5}
.vr-dt{border-collapse:collapse;background:#f6fafb;border:1px solid #d8e6ea;margin:8px 0}
.vr-dt td{padding:3px 12px 3px 8px;font-size:11.5px;vertical-align:top}
.vr-dt td:first-child{color:#54666e;white-space:nowrap}
.vr-yes{display:inline-block;background:#0e5f7a;color:#fff;font-weight:700;font-size:13.5px;padding:9px 20px;border-radius:8px;margin:6px 0 4px;transition:transform .15s}
.vr-paste{font-size:10px;color:#8a939a;margin:0}
.vr-sig{color:#54666e;margin-top:10px;font-size:11.5px;white-space:pre-line}
.vr-ph{position:absolute;left:480px;top:118px;width:290px;height:568px;background:#111827;border-radius:40px;padding:9px;box-shadow:0 24px 50px rgba(15,23,42,.35),inset 0 0 0 2px #374151;z-index:4}
.vr-ps{position:relative;width:100%;height:100%;border-radius:32px;overflow:hidden;background:linear-gradient(180deg,#eef6f8,#f7fbfc);font-family:"Source Sans 3","Nunito Sans",-apple-system,"Segoe UI",sans-serif;color:#1d2b32}
.vr-pu{height:46px;background:#fff;display:flex;align-items:flex-end;padding:0 10px 6px;border-bottom:1px solid #E2E8F0}
.vr-pu span{flex:1;height:24px;border-radius:12px;background:#F1F5F9;font-size:10.5px;color:#334155;display:flex;align-items:center;padding:0 10px;white-space:nowrap;overflow:hidden}
.vr-pc{margin:10px 9px;background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(14,95,122,.18);overflow:hidden}
.vr-phd{background:linear-gradient(135deg,#0e5f7a,#1490b4);color:#fff;text-align:center;padding:12px 10px 10px}
.vr-phd img{width:38px;height:38px;background:#fff;border-radius:10px;padding:4px;object-fit:contain;margin-bottom:5px}
.vr-phd h1{font-family:"Outfit",sans-serif;font-weight:800;font-size:15px;margin:0}
.cover .vr-phd h1{position:static;width:auto;font-size:15px;line-height:1.2;animation:none}
.cover .vr-pc .sub,.cover .vr-pc p{position:static;width:auto;font-size:inherit;animation:none}
.vr-pb{padding:12px 13px 14px;font-size:12px}
.vr-pb h2{font-family:"Outfit",sans-serif;font-size:15px;color:#0e5f7a;margin:0 0 4px}
.vr-pb .gr{color:#54666e;margin:0 0 9px;line-height:1.35}
.vr-pd{background:#f6fafb;border:1px solid #d8e6ea;border-radius:10px;padding:6px 9px;margin-bottom:11px}
.vr-pd div{display:flex;gap:8px;font-size:11px;padding:2px 0;line-height:1.3}
.vr-pd b{color:#54666e;min-width:52px;font-family:"Outfit",sans-serif}
.vr-pbtn{display:block;text-align:center;border-radius:10px;font-family:"Outfit",sans-serif;font-weight:800;font-size:13.5px;padding:10px;color:#fff;background:linear-gradient(135deg,#F97316,#FB923C);box-shadow:0 6px 16px rgba(249,115,22,.35);transition:transform .15s}
.vr-pm{color:#8a939a;font-size:10.5px;text-align:center;margin:9px 0 0;line-height:1.35}
.vr-ok{text-align:center}
.vr-ok .ck{width:46px;height:46px;border-radius:50%;background:#DCFCE7;color:#15803D;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:24px}
.vr-ok .ck.am{background:#FEF3C7;color:#B45309}
.vr-full{background:#FFFBEB;border:1px solid #FDE68A;color:#92580a;border-radius:10px;padding:7px 9px;font-size:11px;margin-bottom:9px;line-height:1.35}
/* check-in page */
.vr-cih{display:flex;gap:8px;align-items:center;background:#fff;padding:8px 10px;border-bottom:1px solid rgba(8,145,178,.12)}
.vr-cih img{width:34px;height:34px}
.vr-cih b{display:block;color:#0891B2;font-size:13px;font-family:"Outfit",sans-serif}.vr-cih small{display:block;font-size:9px;color:#64748B;line-height:1.2}
.vr-cib{padding:10px 12px;font-size:12px}
.vr-cib h3{margin:0;font-family:"Outfit",sans-serif;font-size:16px;color:#0B3A53}
.vr-cib p{margin:0 0 8px;color:#64748B;font-size:11px}
.vr-cireq{background:#fff;border:1px solid #CFE9F0;border-radius:12px;padding:8px 9px;margin-bottom:8px}
.vr-cireq>b{display:block;font-family:"Outfit",sans-serif;color:#0E7490;font-size:13px}.vr-cireq>small{display:block;color:#64748B;font-size:10.5px;margin-bottom:5px}
.vr-cin{background:#F8FAFC;border:1px solid #E2E8F0;border-radius:9px;padding:7px 9px;margin-top:5px;font-weight:700;font-size:12.5px;transition:background .3s,border-color .3s}

</div>
<script>
const DECK_ID='volunteer-help-requests';

/* Every screen below is drawn in HTML/CSS from the live code (2026-11-16):

   emails use example.org. */
const LOGO='../logo_blue.png';
const LOGO_T='../logo_transparent.png';

const tap=async(s,ms=850)=>{const e=typeof s==='string'?q(s):s;await move(e,ms);await click(e);return e};

const show=(e,ms=500)=>anim(e,[{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],ms,'ease-out').then(()=>{e.style.opacity=1});
const PTS=(items,top=140)=>`<div class="abs" style="left:790px;top:${top}px;width:440px"><ul class="pts">${items.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
const LOGOBOX=`<div style="position:absolute;left:70px;top:22px;background:#fff;border-radius:14px;padding:6px 10px;box-shadow:0 4px 14px rgba(0,0,0,.18);animation:rise .6s both"><img src="${LOGO}" alt="LDAH" style="height:80px;display:block"></div>`;
function around(els){const r=els.map(pos);const x=Math.min(...r.map(p=>p.x)),y=Math.min(...r.map(p=>p.y));return{x,y,w:Math.max(...r.map(p=>p.x+p.w))-x,h:Math.max(...r.map(p=>p.y+p.h))-y}}
/* scroll a modal's inner page by px */
async function mscroll(px){const m=q('.k-min');if(!m)return;m.style.transform=`translateY(${-px}px)`;await wait(750)}
function toast(msg,bg){const w=q('.k-win');const t=add(`<div class="vr-toast"${bg?` style="background:${bg}"`:''}>${msg}</div>`,w);pop(t);if(!FAST)setTimeout(()=>t.remove(),2800);else t.remove();return t}
async function confirmBox(lines){const w=q('.k-win');const sh=add('<div class="vr-csh"></div>',w);
 const c=add(`<div class="vr-conf"><h5>DAN says</h5>${lines.map(l=>`<p>${l}</p>`).join('')}<div class="r"><span class="no">Cancel</span><span class="ok">OK</span></div></div>`,w);
 await pop(c);await wait(900);await tap(c.querySelector('.ok'),700);c.remove();sh.remove()}
const typeIn=async(s,text,ms=40)=>{const e=typeof s==='string'?q(s):s;await move(e,600);await click(e);e.classList.add('foc');await type(e,text,ms);e.classList.remove('foc');return e};
async function closeMod(sel){const m=q(sel);if(m){await anim(m,[{opacity:1},{opacity:0,transform:'scale(.95)'}],300);m.remove()}const sh=q('.vr-sh');if(sh)sh.remove()}
async function openIn(html){q('.k-win').insertAdjacentHTML('beforeend',html);const m=q('.k-win').lastElementChild;await anim(m,[{opacity:0,transform:'scale(.94)'},{opacity:1,transform:'none'}],350);return m}

/* ---- the people (all made up) ---- */
const V={
 bi:{n:'Ben Ito',ini:'BI',c:'#F97316',em:'ben.i@example.org',ph:'(808) 555-0163',opp:'Event Helper',s:'Ben I.'},
 jl:{n:'Jordan Lee',ini:'JL',c:'#7C3AED',em:'jordan.l@example.org',ph:'(808) 555-0190',opp:'Event Helper',s:'Jordan L.'},
 ks:{n:'Keoni Silva',ini:'KS',c:'#E31C79',em:'keoni.s@example.org',ph:'(808) 555-0102',opp:'Event Helper',s:'Keoni S.'},
 ln:{n:'Leah Nakoa',ini:'LN',c:'#0891B2',em:'leah.n@example.org',ph:'(808) 555-0117',opp:'Event Helper',s:'Leah N.'},
 pm:{n:'Pua Medeiros',ini:'PM',c:'#65A30D',em:'pua.m@example.org',ph:'(808) 555-0148',opp:'Office Support',s:'Pua M.'},
 tk:{n:'Tasha Kim',ini:'TK',c:'#0E7490',em:'tasha.k@example.org',ph:'(808) 555-0125',opp:'Office Support',s:'Tasha K.'}};
const ORDER=['bi','jl','ks','ln','pm','tk'];
const PICKED=['bi','jl','ks','ln','pm'];
const LEADN='Kai Akana';
const R={t:'Sodexo Volunteer',date:'Friday, November 27',time:'10:00 AM',time2:'9:30 AM',loc:'UH arena, Mānoa',max:'3',
 det:'Wear closed-toe shoes and a plain dark shirt. Park in the lot by the arena.',
 msg:'Aloha! We need 3 volunteers for the Sodexo stand at the game. Can you help?'};
const SIG='Mahalo,\nThe LDAH Volunteer Team\nLeadership in Disabilities and Achievement of Hawaiʻi\n(808) 536-9684';

/* ================= DAN: Volunteers ================= */
const WIN=(inner,extra='')=>`<div class="vr-win k-win"><div class="vr-top"><img src="${LOGO}" alt="LDAH">DAN <span>· Content Management › Volunteers</span></div><div class="vr-vp"><div class="vr-in k-in">${inner}</div></div>${extra}</div>`;
const TABS=(t,n=1)=>`<div class="vr-h2">Volunteers <i class="vr-ib">i</i></div><div class="vr-tabs k-tabs">
 <span class="vr-tab k-troster${t==='r'?' on':''}">Roster<b>6</b></span><span class="vr-tab k-tapps${t==='a'?' on':''}">Applications</span>
 <span class="vr-tab k-treq${t==='h'?' on':''}">Help Requests${n?`<b class="or k-reqn">${n}</b>`:''}</span><span class="vr-tab">Opportunities</span><span class="vr-tab">In-Office Help</span></div>`;
const RCARD=(k,on)=>`<div class="vr-card k-rc-${k}${on?' sel':''}"><span class="vr-chk"></span><div class="vr-hd"><div class="vr-av" style="background:${V[k].c}">${V[k].ini}</div><div style="min-width:0"><div class="vr-nm">${V[k].n}</div><span class="vr-opp">${V[k].opp}</span></div></div>
 <div class="vr-meta"><a>${V[k].em}</a><br>${V[k].ph}</div><span class="vr-more">View details &amp; notes</span></div>`;
const ROSTER=(sel=[])=>TABS('r',0)+`<div class="vr-tool"><span class="vr-srch">Search approved volunteers by name or email…</span><span class="vr-gbtn k-qr">Check-in QR poster</span><span class="vr-gbtn k-selall">Select all</span></div>

/* The composer */
const COMP=()=>`<div class="vr-sh"></div><div class="vr-mod k-mod"><div class="vr-mh"><img src="${LOGO_T}" alt="">Send a Volunteer Help Request<span class="x">×</span></div><div class="vr-mvp"><div class="vr-min k-min">
 <div class="vr-cnt k-cnt">This will email <b>5</b> selected volunteers.</div>
 <span class="vr-l">Subject <span>— this becomes the request &amp; roster title</span></span><div class="vr-i ph k-subj">e.g. Molokaʻi ʻOhana Movie Night — set-up help</div>

 <span class="vr-l">Signature</span><div class="vr-ta k-sig">${SIG}</div>
 <div class="vr-fine k-fine">Each volunteer gets their own “Yes, I can help” link. Whoever confirms lands on this request’s roster. Sent through the system (logged in Email Log).</div>
 </div></div><div class="vr-mf"><span class="vr-btn">Cancel</span><span class="vr-btn pri k-send">Send</span></div></div>`;

/* A help request card. s: {conf,max,wait,att,full,done,lead,time} */
const RQ=(s={})=>{const max=s.max==null?3:s.max;const lbl=max>0?`${s.conf||0} confirmed · ${max} needed`:`${s.conf||0} of ${s.inv||5} confirmed`;
 return `<div class="vr-rq k-rq${s.done?' done':''}"><div class="vr-rqt"><div><div class="vr-rqn k-rqn">${s.t||R.t}${s.done?' <span class="vr-bd bd-gy">completed</span>':s.full?' <span class="vr-bd bd-gr k-full">full</span>':''}</div>
 <div class="vr-sub k-rqmeta">${s.date||R.date} · ${s.time||R.time} — ${s.loc||R.loc}</div>
 <div class="vr-sub k-lead">Lead: <b class="k-leadn">${s.lead||'not set'}</b> · <a class="k-setlead">${s.lead?'change':'set lead'}</a></div></div>
 <div class="vr-bds"><span class="vr-bd ${s.done?'bd-gy':'bd-bl'} k-conf">${lbl}</span>${s.wait?`<span class="vr-bd bd-am k-wait">${s.wait} waiting</span>`:''}${s.att?`<span class="vr-bd ${s.done?'bd-gy':'bd-gr'} k-att">${s.att} attended</span>`:''}</div></div>
 <div class="vr-foot k-foot"><span class="vr-btn pri k-take">Take attendance</span><span class="vr-btn k-view">View roster</span><span class="vr-btn k-hours">Hours</span><span class="vr-btn k-print">Print roster</span><span class="vr-btn k-add">+ Add volunteers</span><span class="vr-btn k-edit">Edit</span></div></div>`};

const REQS=(s={})=>TABS('h',s.done?0:1)+RQ(s)+OLD;

/* View roster */
const PILL={conf:'<span class="vr-bd bd-bl">confirmed</span>',staff:'<span class="vr-bd bd-bl k-pstaff">confirmed (added by staff)</span>',wait:'<span class="vr-bd bd-am k-pwait">waiting list</span>',none:'<span class="vr-bd bd-sl">no answer yet</span>'};

 <div class="vr-mvp" style="top:88px"><div class="vr-min">${rows.map(([k,p],i)=>RROW(k,i,p)).join('')}</div></div><div class="vr-mf"><span class="vr-btn">Print</span><span class="vr-btn pri">Take attendance</span></div></div>`;
const ROS1=[['bi','conf'],['ln','conf'],['jl','none'],['ks','none'],['pm','none']];
const ROS3=[['bi','conf'],['ln','conf'],['tk','staff'],['jl','none'],['ks','none'],['pm','none']];

/* + Add volunteers */
const ADDV=()=>`<div class="vr-sh"></div><div class="vr-mod k-addm" style="left:106px;width:500px;top:70px;height:330px"><div class="vr-mh gr"><div>Add volunteers<small>${R.t}</small></div><span class="x">×</span></div>
 <div style="padding:12px 18px 4px"><div class="vr-i ph">Search accepted volunteers</div><div class="vr-fine k-addnote" style="margin-top:6px">They are added as confirmed. No email is sent.</div></div>
 <div style="padding:4px 18px"><div class="vr-pick k-pk"><span class="vr-cb k-pkcb"></span><div><b>Tasha Kim</b><small>${V.tk.em}</small></div></div></div>

/* ---- quiz: the standard ask()/QUIZ pair. Each answer goes to ldahTrack.quiz(sec,i,correct). ---- */
window.QUIZ_TOTAL=3;
function ask(Q,i,sec){const w=q('.qz-wrap');
 w.innerHTML=`<div class="qz-card"><div class="qz-n">Question ${i+1} of 3</div><div class="qz-q">${Q.q}</div>${Q.o.map((o,j)=>`<button class="qz-o" data-j="${j}"><span class="qz-L">${'ABC'[j]}</span><span>${o}</span></button>`).join('')}<div class="qz-fb"></div></div>`;
 const card=w.firstChild,fb=card.querySelector('.qz-fb'),btns=[...card.querySelectorAll('.qz-o')];
 const finish=()=>{btns.forEach(b=>b.disabled=true);btns[Q.a].classList.add('qz-yes');const st=document.querySelectorAll('.scene.on .qz-stars i')[i];if(st)st.classList.add('on');fb.className='qz-fb good';fb.textContent='Yes! '+Q.y};
 if(FAST){finish();return Promise.resolve()}
 return new Promise(res=>{btns.forEach((b,j)=>b.onclick=async()=>{
  if(b.disabled)return;
  if(window.ldahTrack)ldahTrack.quiz(sec,i,j===Q.a);
  if(j===Q.a){finish();const p=pos(b);confetti(p.x+60,p.y+20,70);await speak('Yes! '+Q.y,run);await wait(700);res()}
  else{b.disabled=true;b.classList.add('qz-no');fb.className='qz-fb bad';fb.textContent='Not quite. '+Q.n+' Try again.';speak('Not quite. '+Q.n+' Try again.',run)}})})}
const QUIZ=(sec,qs)=>({cls:'quiz',html:()=>HEAD('Quick check','Your turn!')+`<div class="qz-stars">${qs.map(()=>'<i></i>').join('')}</div><div class="qz-wrap"><div class="qz-intro">Three quick questions.<small>Your first answer to each one counts. Click the answer you think is right.</small></div></div>`,
 steps:[{say:'Quick check. Three quick questions. Your first answer to each one counts.'},
  ...qs.map((Q,i)=>({say:`Question ${i+1}. ${Q.q}`,act:()=>ask(Q,i,sec)}))]});
