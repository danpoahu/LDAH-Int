<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What’s New: Email the Aloha Packet — Training</title>
<link rel="stylesheet" href="deck-base.css">
<!-- Same Firebase build as the dashboard, so the deck shares its sign-in and records progress. -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
/* Every class here starts with ap-, so nothing collides with deck-base.css.
   The Contact card copies DAN's .ct-info-card / .ct-info-field / #ixAlohaRow styles (STAGE/index.html). */
.ap-win{position:absolute;left:58px;top:118px;width:700px;background:#fff;border:1px solid #D5DEE8;border-radius:14px;overflow:hidden;box-shadow:0 14px 36px rgba(15,23,42,.16);z-index:4;color:#1E293B;font-size:13px;font-family:"Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.ap-top{background:linear-gradient(135deg,#0891B2,#0E7490);color:#fff;padding:12px 18px;font-weight:800;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.ap-top small{font-weight:600;opacity:.85;font-size:11px}
.ap-body{padding:16px 18px 18px;position:relative;min-height:380px}
.ap-lbl{font-weight:800;font-size:12.5px;color:#0B3A53;margin:0 0 8px}
.ap-card{display:grid;grid-template-columns:1fr 1fr;gap:10px;background:rgba(8,145,178,.04);border-radius:12px;padding:16px;margin-bottom:16px;border:1.5px solid rgba(8,145,178,.1)}
.ap-f label{font-weight:700;font-size:10.5px;text-transform:uppercase;color:#64748B;display:block;margin-bottom:1px;letter-spacing:.3px}
.ap-f .val{font-size:13px;color:#1E293B;font-weight:600}
.ap-f.span2{grid-column:span 2}
.ap-nm{color:#0891B2;font-weight:800;text-decoration:underline dotted;text-underline-offset:3px}
.ap-row .val{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ap-btn{font-size:12px;padding:6px 13px;background:#1F6874;color:#fff;border:2px solid #E7BE02;box-shadow:0 0 0 3px rgba(231,190,2,.25);border-radius:7px;font-weight:700;font-family:inherit;transition:transform .15s,opacity .3s}
.ap-btn.off{opacity:.5}
.ap-msg{font-size:11.5px;color:#64748B;transition:color .3s}
.ap-msg.new{color:#166534;font-weight:700}
.ap-det{background:#F8FAFC;border:1px solid #E2E8F0;border-radius:10px;padding:10px 12px;font-size:12px;color:#475569}
.ap-toast{position:absolute;left:50%;bottom:18px;transform:translate(-50%,12px);background:#16A34A;color:#fff;padding:9px 22px;border-radius:24px;font-size:12.5px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.18);opacity:0;transition:all .4s;white-space:nowrap;z-index:8}
.ap-toast.on{opacity:1;transform:translate(-50%,0)}
.ap-conf{position:absolute;left:120px;top:150px;width:440px;background:#fff;border-radius:10px;box-shadow:0 20px 50px rgba(15,23,42,.35);padding:16px 18px 12px;font-size:12.5px;z-index:9;opacity:0;transform:scale(.96);transition:all .3s;pointer-events:none}
.ap-conf.on{opacity:1;transform:none}
.ap-conf .b{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.ap-conf .b span{border-radius:6px;padding:5px 16px;font-weight:700;font-size:12px;background:#E2E8F0}
.ap-conf .b span.ok{background:#1F6874;color:#fff}
.ap-none{position:absolute;left:18px;right:18px;bottom:18px;opacity:0;transition:opacity .4s}
.ap-none.on{opacity:1}
.ap-toast.amber{background:#D97706}
.ap-matv{margin-top:12px;opacity:0;transition:opacity .4s}
.ap-matv.on{opacity:1}
.ap-matv label{font-weight:700;font-size:10.5px;text-transform:uppercase;color:#64748B;letter-spacing:.3px;display:block;margin-bottom:2px}
.ap-matv .val{font-size:12px;color:#1E293B;white-space:pre-line;line-height:1.45}
/* Real-screenshot viewer for the New Interaction scene. The photo is panned/zoomed, never squashed. */
.ph-vp{position:absolute;left:52px;top:112px;width:730px;height:596px;overflow:hidden;border-radius:14px;background:#fff;border:1px solid #D5DEE8;box-shadow:0 14px 36px rgba(15,23,42,.16);z-index:4}
.ph-img{position:absolute;left:0;top:0;width:1397px;transform-origin:0 0;transition:transform 1.1s cubic-bezier(.45,.05,.25,1),opacity .7s}
.ph-img img{display:block;width:1397px;height:auto}
.ph-hot{position:absolute;display:block}
.ph-ring{position:absolute;display:block;border:5px solid #E7BE02;border-radius:34px;box-shadow:0 0 0 8px rgba(231,190,2,.28),0 0 26px rgba(231,190,2,.55);opacity:0;transition:opacity .4s}
.ph-ring.on{opacity:1;animation:phring 1.6s ease-in-out infinite}
@keyframes phring{0%,100%{box-shadow:0 0 0 8px rgba(231,190,2,.28),0 0 26px rgba(231,190,2,.55)}50%{box-shadow:0 0 0 14px rgba(231,190,2,.12),0 0 34px rgba(231,190,2,.75)}}
.ph-vp .ap-toast{z-index:8}
.ph-row{position:absolute;display:block;left:30px;width:1334px;height:66px;border:4px solid #E7BE02;border-radius:10px;background:rgba(231,190,2,.10);opacity:0;transition:opacity .3s}
.ph-row.on{opacity:1}
/* email */
.ap-mail{position:absolute;left:58px;top:110px;width:640px;background:#f4f4f7;border-radius:14px;box-shadow:0 14px 36px rgba(15,23,42,.16);z-index:4;padding:14px;font-family:Arial,Helvetica,sans-serif;color:#222}
.ap-meta{font-size:11.5px;color:#475569;padding:0 4px 10px;line-height:1.5}
.ap-meta b{color:#0F172A}
.ap-eml{background:#fff;border-radius:8px;overflow:hidden}
.ap-eh{background:#1F6874;color:#fff;font-weight:700;font-size:16px;padding:12px 20px}
.ap-eb{padding:14px 20px 12px;font-size:12.5px;line-height:1.5}
.ap-eb p{margin:0 0 9px}
.ap-ebtn{display:inline-block;color:#fff;font-weight:700;border-radius:6px;padding:8px 18px;margin:0 0 10px;font-size:12.5px}
.ap-sig{border-top:1px solid #E5E7EB;padding-top:8px;margin-top:4px;font-size:12px;color:#333;line-height:1.45}
.ap-sig b{font-size:13px}
/* cover art */
.cv-a{position:absolute;left:790px;top:150px;width:420px;transform:rotate(3deg);animation:bob 6s ease-in-out infinite;z-index:3}
.cv-a .ap-card{background:#fff;margin:0;box-shadow:0 24px 50px rgba(0,0,0,.35);color:#1E293B;font-family:"Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
</style></head><body>
<div id="view"><div id="stage"><div id="nbar"><i></i></div>
<div id="scenes"></div>
<div id="spot"></div>
<svg id="cursor" viewBox="0 0 28 32"><path d="M3 2 L3 26 L9.5 19.5 L14 29 L18.5 27 L14 17.5 L23 17.5 Z" fill="#fff" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/></svg>
</div></div>
<div id="cap" aria-live="polite"></div>
<div id="bar">
 <button id="prev">Back</button><button id="play">Start</button><button id="next">Next</button>
 <div id="dots"></div>
 <button id="capbtn" aria-pressed="false">Captions</button><button id="voice" aria-pressed="true">Voice on</button>
</div>
<script>
const DECK_ID='whatsnew-aloha-packet-email';

/* What's new mini deck (2026-11-05): the Email Aloha Packet button (v154.19) on the New
   Interaction form (Also record row, fills the 7 brochures) and on a saved interaction's Contact card. Every family and staff name is MADE UP. The popup supplies
   Got it / Remind me later, so this deck draws none of those. No quiz (What's new mini). */

const tap=async(s,ms=850)=>{const e=typeof s==='string'?q(s):s;await move(e,ms);await click(e);return e};
const PTS=(items,top=140)=>`<div class="abs" style="left:800px;top:${top}px;width:430px"><ul class="pts">${items.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;

const FAM='Leilani Kahale', FAM_EMAIL='leilani.kahale@example.com';
const STAFF='Malia Kealoha', STAFF_TITLE='Family Consultant', STAFF_PHONE='(808) 555-0142', STAFF_EMAIL='mkealoha@ldahawaii.org';
// The 7 brochures in the packet, as DAN records them (_ALOHA_PACKET_MATERIALS).
const MATS=['Agency Brochure','School Readiness Brochure','Education & Training Brochure','Understanding ADHD Brochure','Understanding Autism','Understanding Dyslexia Brochure','What is a Learning Disability Brochure'];
const MATTXT=MATS.map(m=>m+' (1)').join('\n');

// ---- New Interaction (intake): the REAL live form (screenshots of v154.20, made-up family) ----
// Image coordinates are in screenshot pixels (both images are 1397px wide).
const HOT={before:{who:[26,416,664,60],btn:[1108,940,261,51],save:[1178,1008,191,56]},
 after:{pill:[994,883,232,47],btn:[1121,939,247,52],table:[26,1042,1342,824],save:[1176,1984,192,57]}};
const VIEWS={full:[0,0,730/1397],zoom:[640,468,730/757],table:[30,1000,.545]};
const HOTS=(k)=>Object.entries(HOT[k]).map(([n,r])=>`<i class="ph-hot k-${k}-${n}" style="left:${r[0]}px;top:${r[1]}px;width:${r[2]}px;height:${r[3]}px"></i>`).join('');
const NEWIX=()=>`<div class="ph-vp">
 <div class="ph-img k-before"><img src="img/whatsnew-aloha-new-ix-before.png" width="1397" height="1086" alt="The New Interaction form in DAN">${HOTS('before')}
  <i class="ph-ring k-ring1" style="left:1102px;top:934px;width:273px;height:63px"></i></div>
 <div class="ph-img k-after" style="opacity:0"><img src="img/whatsnew-aloha-new-ix-after.png" width="1397" height="2063" alt="The form after the packet was sent">${HOTS('after')}
  <i class="ph-ring k-ring2" style="left:1115px;top:933px;width:259px;height:64px"></i>
  ${[1159,1234,1308,1382,1456,1531,1828].map((y,i)=>`<i class="ph-row k-row${i}" style="top:${y-33}px"></i>`).join('')}</div>
 <div class="ap-toast k-toast" style="bottom:22px">Aloha Packet emailed to ${FAM_EMAIL}.</div>
 <div class="ap-toast amber k-warn" style="bottom:22px">Pick the family in Client / Entity first.</div></div>`;
const view=(name)=>{const [x,y,k]=VIEWS[name];document.querySelectorAll('.scene.on .ph-img').forEach(e=>e.style.transform=`translate(${-x*k}px,${-y*k}px) scale(${k})`)};

// ---- Existing interaction: Contact card (copies .ct-info-card / #ixAlohaRow) ----
const CARD=(msg='Sends a link to the Packet and the LDAH app.')=>`<div class="ap-card">
 <div class="ap-f"><label>Name</label><div class="val"><span class="ap-nm">${FAM}</span> <span style="font-size:11px;color:#64748B">(Parent/Guardian)</span></div></div>
 <div class="ap-f"><label>Email</label><div class="val">${FAM_EMAIL}</div></div>
 <div class="ap-f"><label>Phone</label><div class="val">(808) 555-0187</div></div>
 <div class="ap-f"><label>Grant / Program</label><div class="val">HI-PTI</div></div>
 <div class="ap-f span2 ap-row k-row"><label>Aloha Packet</label><div class="val"><button type="button" class="ap-btn k-btn">Email Aloha Packet</button><span class="ap-msg k-msg">${msg}</span></div></div></div>`;

const IX=()=>`<div class="ap-win"><div class="ap-top">Interaction · Phone call<small>DAN</small></div>
 <div class="ap-body"><div class="ap-lbl">Contact</div>${CARD()}
 <div class="ap-lbl">Details</div><div class="ap-det">Asked about workshops for her son. Wants to learn more about LDAH.
  <div class="ap-matv k-matv"><label>Materials distributed</label><div class="val">${MATTXT.replace(/&/g,'&amp;')}</div></div></div>
 <div class="ap-conf k-conf"><b>ldahawaii.org says</b><div style="margin-top:6px">The Aloha Packet was already emailed to this family Nov 5, 9:12 AM by ${STAFF}. Send it again?</div><div class="b"><span>Cancel</span><span class="ok">OK</span></div></div>
 <div class="ap-toast k-toast">Aloha Packet emailed to ${FAM_EMAIL}.</div></div></div>`;

const MAIL=()=>`<div class="ap-mail"><div class="ap-meta">From: <b>${STAFF}</b> &lt;${STAFF_EMAIL}&gt; · To: ${FAM_EMAIL}<br>Subject: <b>Your LDAH Aloha Packet</b></div>
 <div class="ap-eml"><div class="ap-eh">Your Aloha Packet</div><div class="ap-eb">
 <p class="k-hi">Aloha Leilani,</p>
 <p>Mahalo for connecting with us. Here is our Aloha Packet, our brochures about LDAH, our workshops and programs, and information on AD/HD, autism, dyslexia and learning disabilities.</p>
 <span class="ap-ebtn k-open" style="background:#1F6874">Open the Aloha Packet</span>
 <p>Our services for families are free. You can also find our upcoming workshops and resources in the LDAH app:</p>
 <span class="ap-ebtn k-app" style="background:#B45309">Get the LDAH App</span>
 <p>If you have any questions, just reply to this email.</p>
 <div class="ap-sig k-sig">Mahalo,<br><b>${STAFF}</b><br>${STAFF_TITLE}<br>${STAFF_PHONE} · ${STAFF_EMAIL}</div></div></div></div>`;

const LOGO=`<div class="ldah-logo" style="position:absolute;left:70px;top:22px;background:#fff;border-radius:14px;padding:6px 10px;box-shadow:0 4px 14px rgba(0,0,0,.18);animation:rise .6s both"><img src="../logo_blue.png" alt="LDAH" style="height:80px;display:block"></div>`;
const flash=async(sel,ms=2200)=>{const t=q(sel);t.classList.add('on');await wait(ms);t.classList.remove('on')};

const SC=[
// ================= COVER =================
{cls:'cover',html:()=>LOGO+`<div class="brand">Leadership in Disabilities &amp; Achievement of Hawaiʻi · What’s new · Nov 5, 2026</div><div class="hello">Aloha <span class="nm"></span></div>
 <h1>Email the Aloha Packet</h1><p class="sub" style="top:350px">One click emails the family, and the brochures are counted for you. About two minutes.</p>
 <div class="cv-a">${CARD('Last sent Nov 5, 2026 by '+STAFF)}</div>
 <div class="spark" style="left:1200px;top:80px">${SPARK}</div><div class="spark" style="left:770px;top:560px;animation-delay:1s">${SPARK}</div>
 <div class="gate" style="top:450px"><button class="btn" data-go="start">Play</button><label><input type="checkbox" id="voiceChk" checked> Read it out loud to me</label></div>${WAVES}`,
 steps:[{say:'Aloha {name}! You can now email a family the Aloha Packet from DAN, and the brochures are counted for you. The packet is updated too.'}]},

// ================= NEW INTERACTION (real screenshots) =================
{html:()=>HEAD('New button','When you log a new interaction')+NEWIX()+PTS([
 'Pick the family in <b>Client / Entity</b>.',
 'Click the gold <b>Email Aloha Packet</b> button. The email goes out right away.',
 '<b>Materials distributed</b> turns on, and the button reads <b>Aloha Packet sent</b>.',
 'Each of the <b>7 brochures</b> in the packet gets a 1.',
 'Click <b>Save interaction</b> as usual. The brochures count on reports.',
 'No family picked yet? DAN asks you to pick one first.'],130),
 init:()=>view('full'),
 steps:[
 {say:'This is where you will use it most: the New Interaction form. First, pick the family in Client / Entity.',li:0,act:async()=>{view('full');await wait(300);spot(q('.k-before-who'),5)}},
 {say:'Then click the gold Email Aloha Packet button. The email goes out to the family right away.',li:1,act:async()=>{spot(null);view('zoom');await wait(1300);q('.k-ring1').classList.add('on');spot(q('.k-before-btn'),8);await wait(700);await tap('.k-before-btn',900);await wait(500);flash('.k-toast',2600);hideCursor()}},
 {say:'Materials distributed turns on by itself, and the button now reads Aloha Packet sent.',li:2,act:async()=>{spot(null);q('.k-after').style.opacity='1';q('.k-before').style.opacity='0';q('.k-ring2').classList.add('on');await wait(800);spot(q('.k-after-pill'),6);await wait(1600);spot(q('.k-after-btn'),8)}},
 {say:'Further down, each of the seven brochures in the packet gets a 1.',li:3,act:async()=>{spot(null);view('table');await wait(1300);for(let i=0;i<7;i++){q('.k-row'+i).classList.add('on');await wait(260)}}},
 {say:'Save the interaction as usual, and the brochures count on your reports.',li:4,act:async()=>{spot(null);const s=await tap('.k-after-save',900);spot(s,6);await wait(400);hideCursor()}},
 {say:'And if you click it before picking a family, DAN reminds you to pick one first.',li:5,act:async()=>{spot(null);await flash('.k-warn',2600)}}]},

// ================= EXISTING INTERACTION =================
{html:()=>HEAD('Also on saved interactions','In the Contact section')+IX()+PTS([
 'On a saved interaction, the button is under <b>Phone</b> in <b>Contact</b>.',
 'The 7 brochures are recorded on that interaction. They show under <b>Materials distributed</b>. Sending again never doubles them.',
 'Sent in the last 24 hours? It asks <b>Send it again?</b> No email on file? The button is greyed out.'],130),
 steps:[
 {say:'On an interaction you already saved, the same button is in the Contact section, under Phone.',li:0,act:async()=>{spot(null);await tap('.k-btn',900);flash('.k-toast',2200);const m=q('.k-msg');m.textContent='Sent just now to '+FAM_EMAIL+'. The 7 brochures are recorded under Materials distributed.';m.classList.add('new');hideCursor();spot(q('.k-row'),5)}},
 {say:'The seven brochures are recorded on that interaction, and show in Details under Materials distributed. Sending it again never doubles the count.',li:1,act:async()=>{q('.k-matv').classList.add('on');spot(q('.k-matv'),5)}},
 {say:'If it went out in the last 24 hours, DAN asks Send it again first. And with no email on file, the button is greyed out.',li:2,act:async()=>{spot(null);await flash('.k-conf',2600)}}]},

// ================= THE EMAIL =================
{html:()=>HEAD('What the family gets','Signed by you')+MAIL()+PTS([
 'It opens with <b>Aloha</b> and the parent’s first name.',
 '<b>Open the Aloha Packet</b> and <b>Get the LDAH App</b> buttons.',
 'Signed by <b>you</b>: your name, title, phone and email. The family can <b>reply to you</b>.',
 'The packet is updated: <b>58 years</b>, and a <b>QR code</b> for the app on the back.'],130),
 steps:[
 {say:'Here is what the family gets. It opens with Aloha and the parent’s first name, then one button for the packet and one for the LDAH app.',li:1,act:async()=>{spot(q('.k-hi'),5);await wait(1800);spot(q('.k-open'),5);await wait(1600);spot(q('.k-app'),5)}},
 {say:'Here is the key part. It is signed by you, whoever presses the button, with your name, title, phone and email. When the family replies, it comes to you.',li:2,act:async()=>{spot(q('.k-sig'),6)}},
 {say:'And the packet itself is updated. It now says 58 years, and has a QR code on the back for the app.',li:3,act:async()=>{spot(null)}}]},

// ================= MAHALO =================
{cls:'cover',html:()=>LOGO+`<div class="brand">What’s new · Email the Aloha Packet</div><div class="hello">That’s the update</div><h1>Mahalo<span class="nmc"></span>!</h1>
 <p class="sub" style="top:300px">It is live in DAN now.</p>${WAVES}`,
 steps:[{say:'Mahalo {name}! It is live in DAN now.',act:async()=>{await wait(400);confetti(640,300,120)}}]}
];
</script>
<script src="deck-engine.js?v=6"></script>
<script src="deck-tracker.js"></script></body></html>
