<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What’s New: The ASQ Management Report — Training</title>
<link rel="stylesheet" href="deck-base.css">
<!-- Same Firebase build as the dashboard, so the deck shares its sign-in and records progress. -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
/* Every class here starts with aq- so nothing collides with deck-base.css. */
/* ---------- the dashboard window ---------- */
.aq-win{position:absolute;left:58px;top:118px;width:712px;height:570px;background:#F4F6F9;border:1px solid #D5DEE8;border-radius:12px;overflow:hidden;box-shadow:0 14px 36px rgba(15,23,42,.16);z-index:4;font-family:"Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:#1E293B}
.aq-in{position:relative;padding:12px 14px 30px}
.aq-top{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:nowrap}
.aq-back{font-size:11px;font-weight:700;color:#475569;border:1px solid #CBD5E1;border-radius:6px;padding:4px 8px;background:#fff;white-space:nowrap}
.aq-top h3{margin:0;flex:1;font-size:20px;color:#9D174D;font-weight:800;white-space:nowrap}
.aq-lab{font-size:11px;color:#64748B;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.aq-chk{display:inline-block;width:12px;height:12px;border:1.5px solid #9D174D;border-radius:3px;background:#9D174D;box-shadow:inset 0 0 0 2px #fff}
.aq-solid{font-size:11px;font-weight:700;color:#fff;background:#9D174D;border-radius:6px;padding:5px 10px;white-space:nowrap}
.aq-live{font-size:10px;font-weight:800;color:#166534;background:#DCFCE7;border-radius:999px;padding:2px 8px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.aq-live i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#16A34A;animation:aqpulse 1.4s ease-in-out infinite}
@keyframes aqpulse{0%,100%{opacity:1}50%{opacity:.3}}
/* KPI tiles (.cmr-kpi) */
.aq-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:9px}
.aq-kpi{background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(15,40,70,.08);padding:8px 10px;border-left:4px solid #9D174D}
.aq-kpi b{display:block;font-size:20px;font-weight:800;color:#9D174D;line-height:1.1}
.aq-kpi span{display:block;font-size:10px;color:#64748B;margin-top:1px}
.aq-kpi.al{border-left-color:#B45309}.aq-kpi.al b{color:#B45309}
.aq-kpi.gn{border-left-color:#16A34A}.aq-kpi.gn b{color:#16A34A}
/* the table (table.cmr-t) */
.aq-card{background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(15,40,70,.08);overflow:hidden}
.aq-tbl{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.aq-tbl th{text-align:left;padding:8px 10px;color:#9D174D;font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;background:#FDF2F8}
.aq-tbl th .ar{opacity:.35}
.aq-tbl td{padding:9px 10px;vertical-align:top;text-align:left;border-bottom:1px solid #FCE7F3}
.aq-tbl tr.closed td{opacity:.6}
.aq-tbl td.st{background:#FFF8FB}
.aq-ch{display:flex;align-items:baseline;gap:7px}
.aq-ch .x{color:#9D174D;font-size:11px;flex:none}
.aq-ch b{display:block;font-weight:700}
.aq-sub{font-size:10px;color:#64748B}
.aq-pill{display:inline-block;border-radius:999px;padding:2px 8px;font-size:9.5px;font-weight:700;white-space:nowrap}
.aq-acts{margin-top:5px;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.aq-sel{font-size:10.5px;padding:2px 18px 2px 5px;border:1px solid #FBCFE8;border-radius:6px;background:#fff;position:relative;white-space:nowrap}
.aq-sel::after{content:"▾";position:absolute;right:5px;top:1px;color:#64748B}
.aq-mini{font-size:10.5px;padding:3px 8px;color:#fff;border-radius:6px;font-weight:700;white-space:nowrap;background:#16A34A}
.aq-link{color:#64748B;font-size:10.5px;text-decoration:underline;white-space:nowrap}
.aq-dd{position:absolute;background:#fff;border:1px solid #FBCFE8;border-radius:6px;box-shadow:0 12px 26px rgba(15,23,42,.2);z-index:30;font-size:11px;padding:3px 0;min-width:140px}
.aq-dd div{padding:4px 10px}
.aq-dd div.hi{background:#DB2777;color:#fff}
.aq-flash{animation:aqflash 1.4s ease-out}
@keyframes aqflash{0%{background:#FDE68A}100%{background:#FFF8FB}}
.aq-toast{position:absolute;right:14px;bottom:14px;background:#0F172A;color:#fff;font-size:11.5px;border-radius:8px;padding:8px 12px;box-shadow:0 8px 20px rgba(0,0,0,.25);opacity:0}
/* Reports grid */
.aq-side{position:absolute;left:0;top:0;bottom:0;width:150px;background:#fff;border-right:1px solid #E2E8F0;padding:14px 10px}
.aq-side div{font-size:12.5px;padding:6px 9px;border-radius:6px;color:#334155;margin-bottom:2px}
.aq-side div.act{background:#E0F2FE;color:#0E6E8C;font-weight:700}
.aq-grid{position:absolute;left:150px;right:0;top:0;bottom:0;padding:16px}
.aq-grid h4{margin:0 0 10px;font-size:19px;color:#1E293B}
.aq-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.aq-tile{background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(15,40,70,.08);padding:12px;border:2px solid transparent;height:138px;box-sizing:border-box}
.aq-tile b{display:block;font-size:13px;margin-bottom:3px}
.aq-tile span{font-size:10.5px;color:#64748B;line-height:1.35;display:block}
.aq-tile i{display:block;width:22px;height:22px;border-radius:6px;background:#E0F2FE;margin-bottom:6px}
.aq-tile svg{display:block;margin-bottom:6px}
/* cover art */
.aq-cvw{position:absolute;left:780px;top:130px;width:430px;background:#fff;border-radius:14px;box-shadow:0 24px 50px rgba(0,0,0,.35);padding:12px 14px;color:#1E293B;transform:rotate(3deg);animation:bob 6s ease-in-out infinite;z-index:3;font-family:"Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.aq-cvs{position:absolute;left:850px;top:430px;width:300px;background:#fff;border-radius:12px;box-shadow:0 20px 40px rgba(0,0,0,.3);padding:12px 14px;color:#1E293B;transform:rotate(-5deg);animation:bob 5s 1s ease-in-out infinite;z-index:4}
</style></head><body>
<div id="view"><div id="stage"><div id="nbar"><i></i></div>
<div id="scenes"></div>
<div id="spot"></div>
<svg id="cursor" viewBox="0 0 28 32"><path d="M3 2 L3 26 L9.5 19.5 L14 29 L18.5 27 L14 17.5 L23 17.5 Z" fill="#fff" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/></svg>
</div></div>
<div id="cap" aria-live="polite"></div>
<div id="bar">
 <button id="prev">Back</button><button id="play">Start</button><button id="next">Next</button>
 <div id="dots"></div>
 <button id="capbtn" aria-pressed="false">Captions</button><button id="voice" aria-pressed="true">Voice on</button>
</div>
<script>
const DECK_ID='whatsnew-asq-management';

/* What's new mini deck. It plays inside the sign-in popup, so it is short and mostly summary.
   The mocks redraw the ASQ Management report as asqRender builds it (v152.58): the pink
   #asqReportInGrid palette, _asqStatusPill and _asqActions for the status cell. Every child,
   family and school is MADE UP. The popup supplies See the full training / Got it / Remind me
   later, so this deck draws none of those. */

/* ---- small helpers ---- */
const tap=async(s,ms=850)=>{const e=typeof s==='string'?q(s):s;await move(e,ms);await click(e);return e};
function all(s){return[...document.querySelectorAll('.scene.on '+s)]}
const show=(e,ms=500)=>anim(e,[{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],ms,'ease-out').then(()=>{e.style.opacity=1});
const PTS=(items,top=140)=>`<div class="abs" style="left:790px;top:${top}px;width:440px"><ul class="pts">${items.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
const PILL=(t,bg,fg)=>`<span class="aq-pill" style="background:${bg};color:${fg}">${t}</span>`;
const CHECK=(c,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>`;

/* ---- the status cell, as _asqStatusPill + _asqActions draw it ---- */
const TODO=()=>PILL('Not entered yet','#FEF3C7','#92400E');
const ACTS=k=>`<div class="aq-acts"><span class="aq-sel k-sel-${k}">ASQ-3</span><span class="aq-mini k-mark-${k}">Mark entered</span><span class="aq-link k-nn-${k}">Not needed</span></div>`;
const ENTERED=(t,by)=>PILL('Entered · '+t,'#DCFCE7','#166534')+`<div class="aq-sub" style="margin-top:3px">by ${by} · just now</div><div style="margin-top:4px"><span class="aq-link k-undo">Undo</span></div>`;
const NOTNEEDED=()=>PILL('Not needed','#F1F5F9','#475569')+`<div style="margin-top:4px"><span class="aq-link">Undo</span></div>`;

/* ---- the children: fictional ---- */
const KIDS=[
 {k:'a',child:'Keola Nakamura',room:'Room 4',fam:'Pua Nakamura',age:'4 yrs 2 mos',grade:'Pre-K',src:'Pali View',on:'2026-10-15'},
 {k:'b',child:'Malia Kahale',room:'Room 9',fam:'Kekoa Kahale',age:'6 yrs 1 mo',grade:'Grade 1',over:true,src:'Pali View',on:'2026-10-15'},
 {k:'c',child:'Ikaika Torres',room:'',fam:'Lani Torres',age:'3 yrs 8 mos',grade:'',src:'Lions',on:'2026-10-02'}];
const SRC=s=>s==='Lions'?PILL(s,'#EDE9FE','#5B21B6'):PILL(s,'#E0F2FE','#075985');
const ROW=r=>`<tr class="k-row-${r.k}">
 <td><div class="aq-ch"><span class="x">▸</span><div><b>${r.child}</b>${r.room?`<div class="aq-sub">${r.room}</div>`:''}</div></div></td>
 <td>${r.fam}<div class="aq-sub">${r.fam.split(' ')[0].toLowerCase()}@example.com</div></td>
 <td>${r.age}${r.grade?`<div class="aq-sub">${r.grade}</div>`:''}${r.over?`<div style="margin-top:3px" class="k-over">${PILL('Over ASQ age','#FEE2E2','#991B1B')}</div>`:''}</td>
 <td>${SRC(r.src)}<div class="aq-sub" style="margin-top:2px">${r.on}</div></td>
 <td class="st k-st-${r.k}">${TODO()}${ACTS(r.k)}</td></tr>`;
const TABLE=()=>`<div class="aq-card k-tbl"><table class="aq-tbl"><colgroup><col style="width:150px"><col style="width:140px"><col style="width:96px"><col style="width:96px"><col></colgroup>
 <thead><tr><th>Child <span class="ar">⇵</span></th><th>Family <span class="ar">⇵</span></th><th>Age / grade</th><th>Screening <span class="ar">⇵</span></th><th>ASQ status <span class="ar">⇵</span></th></tr></thead>
 <tbody>${KIDS.map(ROW).join('')}</tbody></table></div>`;
const KPIS=()=>`<div class="aq-kpis"><div class="aq-kpi"><b>3</b><span>children screened</span></div><div class="aq-kpi al"><b class="k-todo">3</b><span>not entered yet</span></div><div class="aq-kpi gn"><b class="k-done">0</b><span>entered in ASQ Online</span></div><div class="aq-kpi al"><b>1</b><span>over ASQ age</span></div></div>`;
const REPORT=()=>`<div class="aq-win"><div class="aq-in"><div class="aq-top"><span class="aq-back">← Back to Reports</span><h3>ASQ Management Report</h3>
 <span class="aq-lab"><span class="aq-chk"></span> Include entered</span><span class="aq-live k-live"><i></i>Live</span><span class="aq-solid">Export CSV</span></div>
 ${KPIS()}${TABLE()}</div><div class="aq-toast k-toast"></div></div>`;

/* Pick from the questionnaire picker, the way the native select opens. */
async function pick(k,val){const s=q('.k-sel-'+k);await tap(s,800);const p=pos(s),w=pos(q('.aq-win'));
 const dd=add(`<div class="aq-dd" style="left:${p.x-w.x}px;top:${p.y-w.y+p.h+2}px">${['ASQ-3','ASQ:SE-2','ASQ-3 + ASQ:SE-2'].map(o=>`<div>${o}</div>`).join('')}</div>`,q('.aq-win'));
 const it=[...dd.children].find(d=>d.textContent===val);await move(it,500);it.classList.add('hi');await wait(350);await click(it);dd.remove();s.textContent=val}
function setCell(k,html){const c=q('.k-st-'+k);c.innerHTML=html;c.classList.remove('aq-flash');void c.offsetWidth;c.classList.add('aq-flash')}
function counts(t,d){q('.k-todo').textContent=t;q('.k-done').textContent=d}
async function toast(t){const e=q('.k-toast');e.textContent=t;await show(e,350);await wait(1400);await anim(e,[{opacity:1},{opacity:0}],350,'ease-in');e.style.opacity=0}

/* ---- the Reports page: Case Advocacy, Case Management, then ASQ Management ---- */
const TILES=[['Case Advocacy','One row per family in case advocacy.','#7C3AED',null],['Case Management','One row per family after a screening referral.','#4338CA',null],['ASQ Management','Every child from the Pali View and Lions screenings. Entered in ASQ Online or not yet.','#9D174D',CHECK('#9D174D')],['Screenings','Vision and hearing results per child.','#0891B2',null],['Event Attendance','Every event, its signups and who came.','',null],['Participation','Who took part, by person.','',null]];
const REPORTS=()=>`<div class="aq-win"><div class="aq-side"><div>Home</div><div>My Day</div><div>Contacts</div><div>Events</div><div class="act">Reports</div><div>Training Videos</div></div>
 <div class="aq-grid"><h4>Reports</h4><div class="aq-tiles">${TILES.map(t=>`<div class="aq-tile${t[0]==='ASQ Management'?' k-tile':''}"${t[2]?` style="border-color:${t[2]}"`:''}>${t[3]||'<i></i>'}<b>${t[0]}</b><span>${t[1]}</span></div>`).join('')}</div></div></div>`;

const LOGO=`<div class="ldah-logo" style="position:absolute;left:70px;top:22px;background:#fff;border-radius:14px;padding:6px 10px;box-shadow:0 4px 14px rgba(0,0,0,.18);animation:rise .6s both"><img src="../logo_blue.png" alt="LDAH" style="height:80px;display:block"></div>`;

const SC=[
// ================= COVER =================
{cls:'cover',html:()=>LOGO+`<div class="brand">Leadership in Disabilities &amp; Achievement of Hawaiʻi · What’s new</div><div class="hello">Aloha <span class="nm"></span></div>
 <h1>The ASQ Management report</h1><p class="sub" style="top:350px">One row per screened child. Mark each one entered in ASQ Online. Under a minute.</p>
 <div class="aq-cvw"><table class="aq-tbl"><colgroup><col style="width:150px"><col></colgroup><thead><tr><th>Child</th><th>ASQ status</th></tr></thead>
  <tbody><tr><td><b>Keola Nakamura</b></td><td class="st">${TODO()}</td></tr><tr><td><b>Ikaika Torres</b></td><td class="st">${PILL('Entered · ASQ-3','#DCFCE7','#166534')}</td></tr><tr class="closed"><td><b>Malia Kahale</b></td><td class="st">${PILL('Not needed','#F1F5F9','#475569')}</td></tr></tbody></table></div>
 <div class="aq-cvs" style="display:flex;align-items:center;gap:10px">${CHECK('#9D174D',26)}<b style="color:#9D174D;font-size:16px">ASQ Management</b></div>
 <div class="spark" style="left:1200px;top:90px">${SPARK}</div><div class="spark" style="left:740px;top:560px;animation-delay:1s">${SPARK}</div>
 <div class="gate" style="top:450px"><button class="btn" data-go="start">Play</button><label><input type="checkbox" id="voiceChk" checked> Read it out loud to me</label></div>${WAVES}`,
 steps:[{say:'Aloha {name}! There is a new ASQ Management report. Here is what is new, in under a minute.'}]},

// ================= WHERE =================
{html:()=>HEAD('Where it is','Reports, then ASQ Management')+REPORTS()+PTS([
 'Go to <b>Reports</b> and click the pink <b>ASQ Management</b> card, right after <b>Case Advocacy</b> and <b>Case Management</b>.',
 '<b>One row per child</b> from the <b>Pali View</b> and <b>Lions</b> screenings.',
 'New Lions batches <b>appear on their own</b>.']),
 steps:[{say:'Go to Reports and click the pink ASQ Management card, right after Case Advocacy and Case Management.',li:0,act:async()=>{spot(q('.k-tile'),5);await wait(600);await tap('.k-tile',900);hideCursor()}},
 {say:'There is one row per child from the Pali View and Lions screenings. New Lions batches appear on their own.',li:1,act:async()=>{spot(null);await wait(1800);li(2)}}]},

// ================= THE JOB =================
{html:()=>HEAD('New','Enter the child, then mark it')+REPORT()+PTS([
 'Enter the child in <b>ASQ Online</b>.',
 'Pick the questionnaire, <b>ASQ-3</b> or <b>ASQ:SE-2</b>, and press <b>Mark entered</b>.',
 '<b>Undo</b> if it was wrong. <b>Not needed</b> for a child flagged <b>Over ASQ age</b>.',
 'It updates <b>live</b>, so several people can work the list at once.']),
 steps:[{say:'Enter the child in ASQ Online, then pick the questionnaire and press Mark entered.',li:0,act:async()=>{spot(q('.k-st-a'),4);await wait(500);li(1);spot(null);await pick('a','ASQ:SE-2');await tap('.k-mark-a',800);hideCursor();setCell('a',ENTERED('ASQ:SE-2','You'));counts(2,1);spot(q('.k-st-a'),4)}},
 {say:'Wrong child? Press Undo. Over ASQ age? Press Not needed.',li:2,act:async()=>{spot(q('.k-undo'),5);await wait(900);spot(q('.k-over'),5);await wait(500);await tap('.k-nn-b',800);hideCursor();setCell('b',NOTNEEDED());q('.k-row-b').classList.add('closed');counts(1,1);spot(q('.k-row-b'),3)}},
 {say:'It updates live, so several people can work the list at once.',li:3,act:async()=>{spot(null);await wait(400);setCell('c',ENTERED('ASQ-3','Sam T.'));counts(0,2);spot(q('.k-st-c'),4);await toast('Sam T. marked Ikaika Torres entered.');spot(q('.k-live'),5)}}]},

// ================= MAHALO =================
{cls:'cover',html:()=>LOGO+`<div class="brand">What’s new · The ASQ Management report</div><div class="hello">That’s the update</div><h1>Mahalo<span class="nmc"></span>!</h1>
 <p class="sub" style="top:300px">The full walkthrough, <b>The ASQ Management Report</b>, covers filters, notes, history and the lead’s progress view. To watch it now, tap <b>See the full training</b> below, or use this link:</p>
 <a href="asq-management.html" target="_blank" rel="noopener" style="position:absolute;left:70px;top:430px;display:inline-flex;align-items:center;gap:10px;background:#fff;color:#0E7490;font-weight:800;font-size:22px;text-decoration:none;border-radius:12px;padding:14px 22px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:5;">&#9654; Open The ASQ Management Report</a>${WAVES}`,
 steps:[{say:'Mahalo {name}! The full walkthrough covers filters, notes, history and the lead’s progress view. To watch it now, tap See the full training below.',act:async()=>{await wait(400);confetti(640,300,120)}}]}
];
</script>
<script src="deck-engine.js"></script>
<script src="deck-tracker.js"></script></body></html>
