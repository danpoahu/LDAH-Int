<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="stylesheet" href="deck-base.css">
<!-- Same Firebase build as the dashboard, so the deck shares its sign-in and records progress. -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
/* Every class here starts with ca- so nothing collides with deck-base.css. */
/* ---------- the dashboard window ---------- */
.ca-win{position:absolute;left:58px;top:118px;width:712px;height:570px;background:#F4F6F9;border:1px solid #D5DEE8;border-radius:12px;overflow:hidden;box-shadow:0 14px 36px rgba(15,23,42,.16);z-index:4;font-family:"Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:#1E293B}
.ca-win.wide{width:1172px}
.ca-in{position:relative;padding:12px 14px 30px}
.ca-top{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:nowrap}
.ca-back{font-size:11px;font-weight:700;color:#475569;border:1px solid #CBD5E1;border-radius:6px;padding:4px 8px;background:#fff;white-space:nowrap}
.ca-top h3{margin:0;flex:1;font-size:20px;color:#6D28D9;font-weight:800;white-space:nowrap}
.ca-lab{font-size:11px;color:#64748B;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.ca-chk{display:inline-block;width:12px;height:12px;border:1.5px solid #94A3B8;border-radius:3px;background:#fff}
.ca-chk.on{background:#6D28D9;border-color:#6D28D9;box-shadow:inset 0 0 0 2px #fff}
.ca-sel{font-size:11px;border:1px solid #CBD5E1;border-radius:5px;padding:3px 20px 3px 6px;background:#fff;position:relative;white-space:nowrap;color:#1E293B}
.ca-sel::after{content:"▾";position:absolute;right:5px;top:2px;color:#64748B}
.ca-exp{font-size:11px;font-weight:700;color:#fff;background:#6D28D9;border-radius:6px;padding:5px 10px;white-space:nowrap}
.ca-gh{font-size:11px;font-weight:700;color:#334155;border:1px solid #CBD5E1;border-radius:6px;padding:4px 9px;background:#fff;white-space:nowrap}
.ca-split{font-size:11px;color:#5B21B6;white-space:nowrap}
.ca-gen{font-size:10px;color:#64748B;white-space:nowrap}
/* KPI tiles, the report's kpi() */
.ca-kpis{display:grid;grid-template-columns:repeat(9,1fr);gap:8px;margin-bottom:9px}
.ca-kpi{background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(15,40,70,.08);padding:7px 9px;border-left:4px solid #6D28D9}
.ca-kpi b{display:block;font-size:19px;font-weight:800;color:#6D28D9;line-height:1.1}
.ca-kpi span{display:block;font-size:9.5px;color:#64748B;line-height:1.25;margin-top:1px}
.ca-kpi b span{display:inline;margin-top:0;line-height:inherit}
.ca-kpi.al{border-left-color:#B45309}.ca-kpi.al b{color:#B45309}
.ca-kpi.yl{border-left-color:#EAB308}.ca-kpi.gn{border-left-color:#16A34A}.ca-kpi.gn b{color:#16A34A}
/* readiness legend (.ar-legend) */
.ca-leg{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;background:#fff;border-radius:12px;box-shadow:0 1px 6px rgba(15,40,70,.08);padding:7px 12px;margin-bottom:9px;font-size:10.5px;color:#64748B}
.ca-leg b{color:#1E293B}
.ca-leg .sw{display:inline-block;width:20px;height:8px;border-radius:999px;vertical-align:middle;margin-right:4px}
/* the table */
.ca-card{background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(15,40,70,.08);overflow:hidden}
.ca-tbl{width:100%;border-collapse:collapse;font-size:11.5px;table-layout:fixed}
.ca-tbl th{text-align:left;padding:8px 9px;color:#6D28D9;font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;background:#F5F3FF;transition:background .3s}
.ca-tbl th.srt{cursor:pointer}
.ca-tbl th.on{background:#EDE9FE}
.ca-tbl th .ar{opacity:.35}
.ca-tbl th.on .ar{opacity:1}
.ca-tbl td{padding:7px 9px;border-bottom:1px solid #EDE9FE;vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ca-tbl tr.ca-closed td{opacity:.6}
.ca-tbl td.rd{background:#FFFCF5}
.ca-fam{display:flex;align-items:baseline;gap:6px}
.ca-fam .x{color:#6D28D9;font-size:11px;flex:none}
.ca-fam b{display:block;font-weight:700}
.ca-fam small{display:block;font-size:9.5px;color:#64748B}
.ca-pill{display:inline-block;border-radius:999px;padding:2px 8px;font-size:9px;font-weight:700;white-space:nowrap}
.ca-sub{font-size:9px;color:#64748B;margin-top:1px}
/* the readiness bar (_arBar) */
.rb{display:flex;align-items:center;gap:6px;min-width:0}
.rb-track{position:relative;flex:1;min-width:70px;height:10px;border-radius:999px;background:#F1F5F9;overflow:hidden}
.rb-ticks{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(10% - 1px),rgba(255,255,255,.9) calc(10% - 1px),rgba(255,255,255,.9) 10%)}
.rb-start,.rb-grow{position:absolute;top:0;bottom:0}
.rb-start{left:0;background:#F97316}
.rb-score{font-weight:800;font-size:11px;white-space:nowrap}
.rb-score .from{color:#F97316;background:none;padding:0;border-radius:0;font-size:inherit}.rb-score .arrow{color:#94A3B8;font-weight:600;margin:0 2px}
.rb-delta{font-size:8.5px;font-weight:700;border-radius:999px;padding:1px 6px;white-space:nowrap}
.ar-stage{font-size:8.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin-top:2px}
/* Reports grid */
.ca-side{position:absolute;left:0;top:0;bottom:0;width:150px;background:#fff;border-right:1px solid #E2E8F0;padding:14px 10px}
.ca-side div{font-size:12.5px;padding:6px 9px;border-radius:6px;color:#334155;margin-bottom:2px}
.ca-side div.act{background:#E0F2FE;color:#0E6E8C;font-weight:700}
.ca-grid{position:absolute;left:150px;right:0;top:0;bottom:0;padding:16px}
.ca-grid h4{margin:0 0 10px;font-size:19px;color:#1E293B}
.ca-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ca-tile{background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(15,40,70,.08);padding:12px;border:2px solid transparent;height:132px;box-sizing:border-box}
.ca-tile b{display:block;font-size:13px;margin-bottom:3px}
.ca-tile span{font-size:10.5px;color:#64748B;line-height:1.35;display:block}
.ca-tile i{display:block;width:22px;height:22px;border-radius:6px;background:#E0F2FE;margin-bottom:6px}
.ca-tile.car{border-color:#7C3AED}.ca-tile.car i{background:#EDE9FE}
.ca-role{display:inline-block;margin-top:5px;font-size:9px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:#F5F3FF;color:#6D28D9;border-radius:5px;padding:1px 6px}
/* rules scene */
.ca-h{font-size:13px;font-weight:800;color:#6D28D9;margin:0 0 6px}
.ca-rules{width:100%;border-collapse:collapse;font-size:12.5px}
.ca-rules th{text-align:left;color:#6D28D9;font-size:9.5px;text-transform:uppercase;letter-spacing:.4px;padding:6px 8px;background:#F5F3FF}
.ca-rules td{padding:6px 8px;border-bottom:1px solid #EDE9FE}
.ca-rules td:first-child{font-weight:700}
.ca-pad{padding:10px 12px}
.ca-note{font-size:10px;color:#64748B;margin-top:5px;line-height:1.4}
.ca-xp td{background:#FBFAFF;white-space:normal}
.ca-xp h5{margin:0 0 4px;font-size:9.5px;color:#6D28D9;text-transform:uppercase;letter-spacing:.05em}
.ca-line{font-size:10.5px;padding:3px 0;border-bottom:1px dashed #E9E4F8;display:flex;gap:6px;align-items:baseline}
.ca-line .p{font-weight:800;color:#166534;flex:none}
.ca-flash{animation:caflash 1.2s ease-out}
@keyframes caflash{0%{background:#FDE68A}100%{background:transparent}}
/* cover art */
.ca-cvw{position:absolute;left:770px;top:120px;width:440px;background:#fff;border-radius:14px;box-shadow:0 24px 50px rgba(0,0,0,.35);padding:12px 14px;color:#1E293B;transform:rotate(3deg);animation:bob 6s ease-in-out infinite;z-index:3;font-family:"Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.ca-cvs{position:absolute;left:850px;top:430px;width:300px;background:#fff;border-radius:12px;box-shadow:0 20px 40px rgba(0,0,0,.3);padding:10px 12px;color:#1E293B;transform:rotate(-5deg);animation:bob 5s 1s ease-in-out infinite;z-index:4}
</style></head><body>
<div id="view"><div id="stage"><div id="nbar"><i></i></div>
<div id="scenes"></div>
<div id="spot"></div>
<svg id="cursor" viewBox="0 0 28 32"><path d="M3 2 L3 26 L9.5 19.5 L14 29 L18.5 27 L14 17.5 L23 17.5 Z" fill="#fff" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/></svg>
</div></div>
<div id="cap" aria-live="polite"></div>
<div id="bar">
 <button id="prev">Back</button><button id="play">Start</button><button id="next">Next</button>
 <div id="dots"></div>
 <button id="capbtn" aria-pressed="false">Captions</button><button id="voice" aria-pressed="true">Voice on</button>
</div>
<script>
const DECK_ID='whatsnew-case-advocacy-sorting';

/* What's new mini deck. It plays inside the sign-in popup, so it is short and mostly summary.
   The mocks redraw the Case Advocacy report as _carRender builds it (v151.86): the header
   row with carSortBy headings, _CAR_COL_FIRST first-click directions, open cases first and
   unscored families last. Every family, advocate and score is MADE UP. The popup supplies
   See the full training / Got it / Remind me later, so this deck draws none of those. */

/* ---- small helpers ---- */
const tap=async(s,ms=850)=>{const e=typeof s==='string'?q(s):s;await move(e,ms);await click(e);return e};
function all(s){return[...document.querySelectorAll('.scene.on '+s)]}
const PTS=(items,top=140)=>`<div class="abs" style="left:790px;top:${top}px;width:440px"><ul class="pts">${items.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
const PILL=(t,bg,fg)=>`<span class="ca-pill" style="background:${bg};color:${fg}">${t}</span>`;

/* ---- readiness colours and bar, as _arCol / _arStage / _arBar draw them ---- */
function hex(h){return[1,3,5].map(i=>parseInt(h.substr(i,2),16))}
function mix(a,b,t){a=hex(a);b=hex(b);return'rgb('+a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(',')+')'}
function col(s){const t=Math.max(0,Math.min(10,s))/10;return t<.5?mix('#F97316','#EAB308',t/.5):mix('#EAB308','#16A34A',(t-.5)/.5)}
function arStage(s){return s>=10?['Self-advocate','#166534']:s>=7?['Getting there','#4D7C0F']:s>=2?['Knows the basics','#A16207']:['New to it','#C2410C']}
function BAR(a,b){const d=b-a;const grow=d>0?`<div class="rb-grow" style="left:${a*10}%;width:${d*10}%;background:linear-gradient(90deg,${col(a)},${col(b)})"></div>`:'';
 const delta=d>0?`<span class="rb-delta" style="background:#DCFCE7;color:#166534">+${d}</span>`:`<span class="rb-delta" style="background:#FEF3C7;color:#92400E">no change</span>`;
 return`<div class="rb"><div class="rb-track"><div class="rb-start" style="width:${a*10}%"></div>${grow}<div class="rb-ticks"></div></div><span class="rb-score"><span class="from">${a}</span><span class="arrow">→</span><span style="color:${col(b)}">${b}</span></span>${delta}</div>`}

/* ---- the families: fictional, today is 2026-10-02 ---- */
const FAM=[
 {id:'k',name:'Kalani Example',em:'kalani@example.com',notes:4,adv:'Alex K.',started:'2026-03-09',days:207,s:[2,5.5],auth:['SIGNED','2026-03-12'],letter:'2026-03-12',member:true,fu:'2026-10-06'},
 {id:'m',name:'Mele Sample',em:'mele@example.com',notes:3,adv:'Sam T.',started:'2026-05-18',days:137,s:[4,8],auth:['PAPER','2026-05-20'],letter:'2026-05-19',member:true,fu:'2026-09-28',over:true},
 {id:'l',name:'Leilani Demo',em:'leilani@example.com',notes:2,adv:'Alex K.',started:'2026-07-14',days:80,s:[3,3],stuck:80,auth:['SIGNED','2026-07-16'],letter:'2026-07-15',member:false,fu:'2026-10-09'},
 {id:'j',name:'Jordan Test',em:'jordan@example.com',notes:1,adv:'',started:'2026-08-24',days:39,s:[1,1.5],auth:null,letter:'2026-08-25',member:false,fu:''},
 {id:'r',name:'Riley Example',em:'riley@example.com',notes:1,adv:'Sam T.',started:'2026-09-15',days:17,s:null,auth:['SIGNED','2026-09-16'],letter:'',member:false,fu:'2026-10-05'}];
const BY=Object.fromEntries(FAM.map(f=>[f.id,f]));

/* _carRender's header row. Only these five carry a carSortBy key. */
const COLS=[['Family','name',176],['Advocate','advocate',112],['Started','started',92],['Open','days',78],['Self-advocacy readiness','score',248],['Authorization',null,112],['Welcome letter',null,104],['Member',null,82],['Next follow-up',null,]];
function TH(sort){return COLS.map(([t,k,w])=>{const on=k&&sort.key===k;const arrow=k?(on?` <span class="ar">${sort.dir==='asc'?'▲':'▼'}</span>`:' <span class="ar">⇵</span>'):'';
 return`<th class="${k?'srt k-h-'+k:''}${on?' on':''}"${w?` style="width:${w}px"`:''}>${t}${arrow}</th>`}).join('')}
function setHeads(sort){all('.ca-tbl thead tr').forEach(tr=>tr.innerHTML=TH(sort))}
function RD(f){if(!f.s)return`<td class="rd"><span style="font-size:10px;color:#64748B">Not scored yet</span></td>`;const st=arStage(f.s[1]);
 return`<td class="rd">${BAR(f.s[0],f.s[1])}<div class="ar-stage" style="color:${st[1]}">${st[0]}${f.stuck?` <span style="color:#B45309">· last moved ${f.stuck} days ago</span>`:''}</div></td>`}
function ROW(f,closed){return`<tr class="ca-row${closed?' ca-closed':''}" data-id="${f.id}">
 <td><div class="ca-fam"><span class="x">▸</span><div><b>${f.name}</b><small>${f.em} · Oʻahu · ${f.notes} note${f.notes===1?'':'s'}</small></div></div></td>
 <td>${f.adv||PILL('Needs advocate','#FEF3C7','#92400E')}</td>
 <td>${f.started}</td>
 <td>${closed?PILL('Closed '+closed,'#F1F5F9','#475569'):`<b>${f.days}</b> days`}</td>
 ${RD(f)}
 <td>${f.auth?PILL(f.auth[0],'#DCFCE7','#166534')+`<div class="ca-sub">${f.auth[1]}</div>`:PILL('Not on file','#FEE2E2','#991B1B')}</td>
 <td>${f.letter||PILL('Not sent','#F1F5F9','#475569')}</td>
 <td>${f.member?PILL('MEMBER','#DBEAFE','#1E40AF'):'<span style="color:#64748B">—</span>'}</td>
 <td>${f.fu?(f.over?PILL(f.fu+' · overdue','#FEE2E2','#991B1B'):f.fu):PILL('None set','#FEF3C7','#92400E')}</td></tr>`}
const DEF={key:'started',dir:'asc'};
const ORDER={started:['k','m','l','j','r'],hi:['m','k','l','j','r'],lo:['j','l','k','m','r']};

const TOP=()=>`<div class="ca-top"><span class="ca-back">← Back to Reports</span><h3>Case Advocacy Report</h3>
 <span class="ca-lab"><span class="ca-chk"></span> Include closed</span>
 <span class="ca-lab">Sort: <span class="ca-sel k-sel">By column (click a heading)</span></span>
 <span class="ca-exp">Export CSV</span><span class="ca-gh">Print</span><span class="ca-split"><b>5</b> case advocacy</span><span class="ca-gen">Generated 10/2/2026, 8:40 AM</span></div>`;
const KPI=(n,l,c='')=>`<div class="ca-kpi ${c}"><b>${n}</b><span>${l}</span></div>`;
const KPIS=()=>`<div class="ca-kpis">${KPI(5,'open cases')}${KPI(1,'open, no authorization','al')}${KPI(0,'open, predates consent flow')}${KPI(1,'open, no welcome letter','al')}${KPI(1,'open, no advocate named','al')}${KPI(2,'joined as members')}
 <div class="ca-kpi yl"><b><span style="color:#F97316">2.5</span><span style="color:#94A3B8;font-size:12px;margin:0 3px">→</span><span style="color:#65A30D">4.5</span></b><span>average readiness, start → now</span></div>${KPI(0,'at 9+ · ready to close','gn')}${KPI(1,'no movement in 30+ days','al')}</div>`;
const LEGEND=()=>`<div class="ca-leg"><b>Readiness scale</b>
 <span><span class="sw" style="background:#F97316"></span><b>0–1</b> New to it: has never heard of IDEA or a 504</span>
 <span><span class="sw" style="background:linear-gradient(90deg,#F97316,#EAB308)"></span><b>2–6</b> Knows the basics: has been through an IEP or two</span>
 <span><span class="sw" style="background:linear-gradient(90deg,#EAB308,#16A34A)"></span><b>7–9</b> Getting there: prepares, asks, and pushes back</span>
 <span><span class="sw" style="background:#16A34A"></span><b>10</b> Self-advocate: runs their own meetings without us</span></div>`;
const TABLE=(ids,sort=DEF)=>`<div class="ca-card"><table class="ca-tbl"><thead><tr>${TH(sort)}</tr></thead><tbody>${ids.map(i=>ROW(BY[i])).join('')}</tbody></table></div>`;
const REPORT=()=>`<div class="ca-win wide"><div class="ca-in">${TOP()}${KPIS()}${LEGEND()}${TABLE(ORDER.started)}</div></div>`;

/* Re-order the rows the way carApplySort re-renders them, and slide each row from where it was. */
async function reorder(ids){const tb=q('.ca-tbl tbody');const rows=[...tb.children];const before={};rows.forEach(r=>before[r.dataset.id]=r.offsetTop);
 ids.forEach(i=>tb.appendChild(rows.find(r=>r.dataset.id===i)));
 await Promise.all(ids.map(i=>{const r=tb.querySelector(`[data-id="${i}"]`);const d=before[i]-r.offsetTop;return d?anim(r,[{transform:`translateY(${d}px)`},{transform:'none'}],700,'ease-in-out'):null}));
 all('.ca-tbl td.rd').forEach(td=>{td.classList.remove('ca-flash');void td.offsetWidth;td.classList.add('ca-flash')})}
async function sortBy(key,dir,ids){await tap('.k-h-'+key,850);setHeads({key,dir});await reorder(ids)}

/* ---- the Reports page ---- */
const TILES=[['Event Attendance','Every event, its signups and who came.'],['Participation','Who took part, by person.'],['Membership Reports','Members, levels and renewals.'],['Feedback','Every evaluation response.'],['Case Advocacy','One row per family in case advocacy, with their advocate, start date and consent.'],['PTI Report','The reporting-period board document, for any date range.']];
const REPORTS=()=>`<div class="ca-win"><div class="ca-side"><div>Home</div><div>My Day</div><div>Contacts</div><div>Events</div><div class="act">Reports</div><div>Training Videos</div></div>
 <div class="ca-grid"><h4>Reports</h4><div class="ca-tiles">${TILES.map(t=>t[0]==='Case Advocacy'?`<div class="ca-tile car k-tile"><i></i><b>${t[0]}</b><span>${t[1]}</span><span class="ca-role">Super Admin · Admin</span></div>`:`<div class="ca-tile"><i></i><b>${t[0]}</b><span>${t[1]}</span></div>`).join('')}</div></div></div>`;

/* ---- rules scene: what each heading does, as _CAR_COL_FIRST and _carColCmp set it ---- */
const RULES=()=>`<div class="ca-win" style="padding:12px 14px;box-sizing:border-box">
 <div class="ca-card ca-pad k-rules"><div class="ca-h">Click a heading to sort. Click it again to flip.</div>
 <table class="ca-rules"><tr><th>Heading</th><th>First click</th><th>Second click</th></tr>
 <tr><td>Family</td><td>A → Z</td><td>Z → A</td></tr>
 <tr><td>Advocate</td><td>A → Z, no advocate last</td><td>Z → A</td></tr>
 <tr><td>Started</td><td>Oldest → newest</td><td>Newest → oldest</td></tr>
 <tr><td>Open</td><td>Longest open first</td><td>Shortest first</td></tr>
 <tr><td>Self-advocacy readiness</td><td>High → low</td><td>Low → high</td></tr></table>
 <div class="ca-note">The report always opens on <b>Started, oldest to newest</b>.</div></div>
 <div class="ca-card k-heads" style="margin-top:10px"><table class="ca-tbl"><thead><tr>
  <th class="srt">Family <span class="ar">⇵</span></th><th class="srt">Advocate <span class="ar">⇵</span></th><th class="srt on">Started <span class="ar">▲</span></th><th class="srt">Open <span class="ar">⇵</span></th><th>Authorization</th></tr></thead></table></div>
 <div class="ca-card k-rows" style="margin-top:10px"><table class="ca-tbl"><colgroup><col style="width:190px"><col style="width:90px"><col style="width:100px"><col></colgroup><tbody>
  <tr class="ca-row k-open"><td><div class="ca-fam"><span class="x k-x">▸</span><div><b>Mele Sample</b><small>Oʻahu · 3 notes</small></div></div></td><td>Sam T.</td><td><b>137</b> days</td><td class="rd">${BAR(4,8)}</td></tr>
  <tr class="ca-xp k-xp" style="display:none"><td colspan="4" style="padding:6px 10px 8px 28px"><h5>AI checks, Mon, Wed &amp; Fri · +4 so far</h5>
   <div class="ca-line"><span class="p">+1.5</span><span>School meeting, outcome Worked. The parent asked for the reading goal in writing.</span></div>
   <div class="ca-line"><span class="p">+0.5</span><span>Attended a Learning Lab workshop.</span></div>
   <div class="ca-line" style="border:none"><span style="color:#6D28D9;font-weight:700;flex:none">09-29 · Sam T.</span><span>Note: Mom is drafting her own questions for the next IEP.</span></div></td></tr>
