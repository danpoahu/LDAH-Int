<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What’s New: The Case Management Report — Training</title>
<link rel="stylesheet" href="deck-base.css">
<!-- Same Firebase build as the dashboard, so the deck shares its sign-in and records progress. -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
/* Every class here starts with cm- (report) or md- (My Day), so nothing collides with deck-base.css.
   Indigo theme as the live panel (#caseMgmtReportInGrid): head #4338CA, accent #6366F1, bg #EEF2FF, border #C7D2FE, line #E0E7FF. */
:root{--cmh:#4338CA;--cma:#6366F1;--cmb:#EEF2FF;--cmbr:#C7D2FE;--cml:#E0E7FF;--cmr:#F8F9FF}
/* ---------- the dashboard window ---------- */
.cm-win{position:absolute;left:58px;top:118px;width:712px;height:570px;background:#F4F6F9;border:1px solid #D5DEE8;border-radius:12px;overflow:hidden;box-shadow:0 14px 36px rgba(15,23,42,.16);z-index:4;color:#1E293B;font-size:12px;font-family:"Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.cm-in{position:relative;padding:12px 14px}
.cm-card{background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(15,40,70,.08);padding:10px 12px;margin-bottom:9px}
.cm-sel{display:inline-block;font-size:10.5px;border:1px solid #CBD5E1;border-radius:5px;padding:3px 20px 3px 7px;background:#fff;position:relative;white-space:nowrap;color:#0F172A}
.cm-sel::after{content:"▾";position:absolute;right:6px;color:#475569}
.cm-split{font-size:11px;color:var(--cmh);white-space:nowrap}
.cm-gen{font-size:10px;color:#64748B;white-space:nowrap;transition:background .4s;border-radius:4px;padding:1px 3px}
.cm-gen.flash{background:#FEF3C7}
.cm-sech{font-size:10.5px;font-weight:800;color:var(--cmh);text-transform:uppercase;letter-spacing:.4px;margin:0 0 7px}
/* caseload by staff (.cmr-staff) */
.cm-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cm-st{border:1px solid var(--cml);border-radius:10px;padding:6px 10px;background:var(--cmr);transition:border-color .3s,background .3s}
.cm-st .sn{font-weight:700;font-size:12px}
.cm-st .cnt{font-size:17px;font-weight:800;color:var(--cmh);line-height:1.2;margin-top:1px}
.cm-st .cnt span{font-size:10px;font-weight:600;color:#64748B}
.cm-st .ct{font-size:10px;color:#64748B;margin-top:1px;line-height:1.4}
.cm-bar{height:5px;border-radius:999px;background:#E2E8F0;margin-top:4px;overflow:hidden;display:flex}
.cm-bar span{display:block;height:100%;transition:width .5s}
/* needs attention: two columns with a thin divider, as .cmr-attn-rows */
.cm-g h5{margin:0 0 4px;font-size:11.5px;display:flex;align-items:center;gap:7px}
.cm-rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:22px;background:linear-gradient(#C7D2FE,#C7D2FE) center/1px 100% no-repeat}
.cm-ar{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed var(--cml);font-size:11px;transition:opacity .4s}
.cm-ar .who{flex:1;min-width:0}
.cm-ar .who small{display:block;color:#64748B;font-size:9.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cm-par{color:inherit;border-bottom:1px dotted var(--cma)}
.cm-sub{font-size:10px;color:#64748B}
.cm-asg{font-size:9.5px;padding:3px 18px 3px 6px;border-color:var(--cmbr)}
.cm-pill{display:inline-block;border-radius:999px;padding:1px 7px;font-size:9.5px;font-weight:700;white-space:nowrap;vertical-align:baseline}
/* dropdown list drawn over a select */
.cm-drop{position:absolute;z-index:26;background:#fff;border:1px solid #94A3B8;border-radius:6px;box-shadow:0 10px 26px rgba(15,23,42,.25);padding:3px 0;font-size:12px;min-width:150px}
.cm-drop div{padding:4px 12px;white-space:nowrap;color:#0F172A}
.cm-drop div.hi{background:#2563EB;color:#fff}
.cm-drop div.mut{color:#64748B}
/* reports grid */
.cm-side{position:absolute;left:0;top:0;bottom:0;width:132px;background:#fff;border-right:1px solid #E2E8F0;padding:14px 10px;font-size:12px}
.cm-side div{padding:6px 9px;border-radius:6px;color:#334155;margin-bottom:2px}
.cm-side div.act{background:#E0F2FE;color:#0E6E8C;font-weight:700}
.cm-rg{position:absolute;left:132px;right:0;top:0;bottom:0;padding:14px 16px}
.cm-rg h4{margin:0;font-size:19px;color:#0B3A53}
.cm-rg p{margin:2px 0 10px;font-size:11px;color:#64748B}
.cm-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cm-tile{background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(15,40,70,.08);padding:11px 13px;border:2px solid transparent;min-height:104px}
.cm-tile b{display:block;font-size:12.5px;margin-top:4px}
.cm-tile span{display:block;font-size:10px;color:#64748B;margin-top:3px;line-height:1.4}
.cm-tile .ic{width:22px;height:22px;border-radius:6px}
/* ---------- My Day task card ---------- */
.md-h{font-size:13px;font-weight:800;color:#0F172A;margin:0 0 6px;display:flex;align-items:center;gap:7px}
.md-task{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid #E2E8F0;border-left:4px solid var(--cmh);border-radius:10px;padding:8px 12px;margin-bottom:9px;box-shadow:0 1px 4px rgba(15,40,70,.06);transition:opacity .4s}
.md-task .ck{width:18px;height:18px;border-radius:50%;border:2px solid #94A3B8;flex:none;margin-top:1px;position:relative;transition:all .3s}
.md-task .ck.on{background:#16A34A;border-color:#16A34A}
.md-task .ck.on::after{content:"";position:absolute;left:5px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.md-task .meta{flex:1;min-width:0}
.md-task .ttl{font-size:13px;font-weight:800;color:#0F172A}
.md-task .sub{font-size:10.5px;color:#64748B;margin-top:2px}
.md-btn{display:inline-block;font-size:10.5px;font-weight:700;color:#fff;border-radius:6px;padding:5px 11px;margin-top:5px;white-space:nowrap}
.md-task.done .ttl{text-decoration:line-through;color:#94A3B8}
/* cover art */
.cv-a{position:absolute;left:800px;top:110px;width:400px;background:#fff;border-radius:14px;box-shadow:0 24px 50px rgba(0,0,0,.35);padding:12px 14px;color:#1E293B;transform:rotate(3deg);animation:bob 6s ease-in-out infinite;z-index:3}
.cv-a .md-task{margin:0}
.cv-a .md-task .sub{position:static;width:auto;font-size:10.5px;opacity:1;animation:none}/* not .cover .sub */
.cv-b{position:absolute;left:850px;top:400px;width:340px;background:#fff;border-radius:12px;box-shadow:0 20px 40px rgba(0,0,0,.3);padding:12px 14px;color:#1E293B;transform:rotate(-4deg);animation:bob 5s 1s ease-in-out infinite;z-index:4}
</style></head><body>
<div id="view"><div id="stage"><div id="nbar"><i></i></div>
<div id="scenes"></div>
<div id="spot"></div>
<svg id="cursor" viewBox="0 0 28 32"><path d="M3 2 L3 26 L9.5 19.5 L14 29 L18.5 27 L14 17.5 L23 17.5 Z" fill="#fff" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/></svg>
</div></div>
<div id="cap" aria-live="polite"></div>
<div id="bar">
 <button id="prev">Back</button><button id="play">Start</button><button id="next">Next</button>
 <div id="dots"></div>
 <button id="capbtn" aria-pressed="false">Captions</button><button id="voice" aria-pressed="true">Voice on</button>
</div>
<script>
const DECK_ID='whatsnew-case-management';

/* What's new mini deck. It plays inside the sign-in popup, so it is short and mostly summary.
   The mocks are the full deck's (case-management-report.html), drawn from #caseMgmtReportInGrid:
   the Reports tile, the one My Day task (workflowStep assignCaseMgmt) and the two-column
   Needs attention area with its Assign to… selects (_cmrRenderAttention). Every family and
   staff name is MADE UP. The popup supplies See the full training / Got it / Remind me later,
   so this deck draws none of those. */

/* ---- small helpers ---- */
const tap=async(s,ms=850)=>{const e=typeof s==='string'?q(s):s;await move(e,ms);await click(e);return e};
const PTS=(items,top=140)=>`<div class="abs" style="left:790px;top:${top}px;width:440px"><ul class="pts">${items.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
const P=(t,bg,fg)=>`<span class="cm-pill" style="background:${bg};color:${fg}">${t}</span>`;
const AMB=['#FEF3C7','#92400E'];
const PA=(t,c)=>P(t,c[0],c[1]);
const STAFF5=['Kai Akana','Malia Santos','Leah Fong','Ben Ito','Rae Kim'];
function drop(anchor,items){const p=pos(anchor);return add(`<div class="cm-drop" style="left:${p.x}px;top:${p.y+p.h+2}px">${items.map((t,i)=>`<div class="${i===0?'mut':''}">${t}</div>`).join('')}</div>`)}
async function pickFrom(d,i,ms=700){const it=d.children[i];await move(it,ms,.4,.6);d.querySelectorAll('div').forEach(x=>x.classList.remove('hi'));it.classList.add('hi');await click(it);await wait(250);d.remove()}

/* ---- the Reports page ---- */
const TILES=[['Case Advocacy','Every family in case advocacy: advocate, start date, consent, welcome letter and membership.','#7C3AED'],['Case Management','Every family in case management after a screening referral: staff, school, first contact against the 21-day date, last contact and what needs attention.','#4338CA'],['ASQ Management','Every child screened, and whether they are entered in ASQ Online.','#9D174D'],['Event Attendance','Every event, its signups and who came.',''],['Participation','Who took part, by person.',''],['PTI Report','The reporting-period board document.','']];
const CLIP='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4338CA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 12h6M9 16h4"/></svg>';
const REPORTS=()=>`<div class="cm-win"><div class="cm-side"><div>Home</div><div>My Day</div><div>Contacts</div><div>Events</div><div class="act">Reports</div><div>Admin</div></div>
 <div class="cm-rg"><h4>Reports</h4><p>Generate and export organizational reports.</p><div class="cm-tiles">${TILES.map((t,i)=>`<div class="cm-tile k-tile${i}" style="${t[2]?`border-color:${t[2]}`:''}">${i===1?CLIP:`<div class="ic" style="background:${t[2]||'#CBD5E1'};opacity:.25"></div>`}<b>${t[0]}</b><span>${t[1]}</span></div>`).join('')}</div></div></div>`;

/* ---- My Day: the one task for a batch ---- */
const ASSIGNTASK=n=>`<div class="md-task k-task"><span class="ck k-tck"></span><div class="meta"><div class="ttl">Assign <span class="k-tn">${n}</span> case management cases</div><div class="sub">New Lions screening batch · Waiʻalae Elementary and others · Due today</div>
 <span class="md-btn k-open" style="background:#4338CA">Open Case Management report →</span></div><div>${PA('Due today',AMB)}</div></div>`;

/* ---- caseload by staff: name, open, contacted, not yet due, overdue ---- */
const STAFF=()=>[['Kai Akana',4,3,1,0],['Malia Santos',5,2,3,0],['Leah Fong',3,1,1,1],['Ben Ito',2,1,0,1],['Rae Kim',2,1,1,0],['Needs staff',6,0,5,1]];
const slug=n=>n.toLowerCase().replace(/[^a-z]+/g,'-');
const SCARD=s=>{const t=s[1]||1;return`<div class="cm-st k-st-${slug(s[0])}"><div class="sn">${s[0]==='Needs staff'?PA('Needs staff',AMB):s[0]}</div>
 <div class="cnt">${s[1]} <span>open</span></div><div class="ct">${s[2]} contacted · ${s[3]} not yet due${s[4]?` · <b style="color:#DC2626">${s[4]} overdue</b>`:''}</div>
 <div class="cm-bar"><span style="width:${s[2]/t*100}%;background:#16A34A"></span><span style="width:${s[3]/t*100}%;background:#F59E0B"></span><span style="width:${s[4]/t*100}%;background:#DC2626"></span></div></div>`};
const STRIP=data=>`<div class="cm-card k-strip"><div class="cm-sech">Caseload by staff · open cases</div><div class="cm-strip">${data.map(SCARD).join('')}</div></div>`;

/* ---- Needs attention, No staff assigned group ---- */
const NOSTAFF=[['Mara Delgado','Sofia Delgado','Waiʻalae Elementary · vision Sep 30 · 12 days left to call'],['Kawika Pahia','Nalu Pahia','Waiʻalae Elementary · vision Sep 30 · 12 days left to call'],['Jenna Morales','Eli Morales','Waiʻalae Elementary · vision Sep 30 · 12 days left to call'],['Tevita Fifita','Sione Fifita','Liholiho Elementary · vision Sep 24 · 8 days left to call'],['Amy Chun','Lucas Chun','Pālolo Elementary · hearing Sep 29 · 13 days left to call'],['Rina Sato','Kenji Sato','Liholiho Elementary · vision Sep 15 · 1 day past the contact due date']];
const AROW=r=>`<div class="cm-ar" data-p="${slug(r[0])}"><div class="who"><b><span class="cm-par">${r[0]}</span></b> <span class="cm-sub">for ${r[1]}</span><small>${r[2]}</small></div><span class="cm-sel cm-asg">Assign to…</span></div>`;
const ATTN=()=>`<div class="cm-card k-attn" style="margin-bottom:0"><div class="cm-sech">Needs attention</div><div class="cm-g k-g-ns"><h5><span class="k-gn-ns">${PA(NOSTAFF.length,AMB)}</span> No staff assigned</h5><div class="cm-rows">${NOSTAFF.map(AROW).join('')}</div></div></div>`;

/* ---- assigning: the live listener re-reads, the row leaves, the counts move, the task counts down ---- */
let ST=STAFF(),NLEFT=6;
function setCard(name){const s=ST.find(x=>x[0]===name);const e=q('.k-st-'+slug(name));if(e)e.outerHTML=SCARD(s)}
function moved(staffIdx,k=3){/* k: 3 = not yet due, 4 = overdue */NLEFT--;const n=q('.k-gn-ns');if(n)n.innerHTML=PA(NLEFT,AMB);
 const nm=STAFF5[staffIdx];const s=ST.find(x=>x[0]===nm),ns=ST.find(x=>x[0]==='Needs staff');s[1]++;s[k]++;ns[1]--;ns[k]--;setCard(nm);setCard('Needs staff');
 const t=q('.k-tn');if(t)t.textContent=NLEFT;const g=q('.k-gen');if(g){g.textContent='Updated live 10/7/2026, 8:14:'+(20+NLEFT)+' AM';g.classList.add('flash');setTimeout(()=>g.classList.remove('flash'),1400)}}
async function assignRow(rowSlug,staffIdx){const row=q(`.k-g-ns .cm-ar[data-p="${rowSlug}"]`);const sel=row.querySelector('.cm-asg');
 await tap(sel,800);const d=drop(sel,['Assign to…',...STAFF5]);await wait(350);await pickFrom(d,staffIdx+1,700);
 sel.textContent=STAFF5[staffIdx];sel.style.background='#EEF2FF';await wait(400);
 await anim(row,[{opacity:1},{opacity:0}],400,'ease-out');row.remove();moved(staffIdx)}

const LOGO=`<div class="ldah-logo" style="position:absolute;left:70px;top:22px;background:#fff;border-radius:14px;padding:6px 10px;box-shadow:0 4px 14px rgba(0,0,0,.18);animation:rise .6s both"><img src="../logo_blue.png" alt="LDAH" style="height:80px;display:block"></div>`;

const SC=[
// ================= COVER =================
{cls:'cover',html:()=>LOGO+`<div class="brand">Leadership in Disabilities &amp; Achievement of Hawaiʻi · What’s new</div><div class="hello">Aloha <span class="nm"></span></div>
 <h1>The Case Management report</h1><p class="sub" style="top:350px">One task for each new batch of screenings, and every case assigned from one place. Under a minute.</p>
 <div class="cv-a">${ASSIGNTASK(6)}</div>
 <div class="cv-b"><div class="cm-sech">Needs attention</div><h5 style="margin:0 0 4px;font-size:12px;display:flex;gap:7px;align-items:center">${PA(6,AMB)} No staff assigned</h5>
  <div style="font-size:11px;padding:4px 0;border-bottom:1px dashed #E0E7FF"><b>Mara Delgado</b> <span class="cm-sub">for Sofia Delgado</span> <span class="cm-sel" style="float:right">Assign to…</span></div>
  <div style="font-size:11px;padding:4px 0"><b>Tevita Fifita</b> <span class="cm-sub">for Sione Fifita</span> <span class="cm-sel" style="float:right">Assign to…</span></div></div>
 <div class="spark" style="left:1200px;top:80px">${SPARK}</div><div class="spark" style="left:770px;top:560px;animation-delay:1s">${SPARK}</div>
 <div class="gate" style="top:450px"><button class="btn" data-go="start">Play</button><label><input type="checkbox" id="voiceChk" checked> Read it out loud to me</label></div>${WAVES}`,
 steps:[{say:'Aloha {name}! There is a new Case Management report. Here is what changed, in under a minute.'}]},

// ================= WHERE =================
{html:()=>HEAD('New','The Case Management report')+REPORTS()+PTS([
 'Go to <b>Reports</b>. The indigo <b>Case Management</b> card sits right after <b>Case Advocacy</b>.',
 '<b>One row per family</b> after a Lions screening referral.']),
 steps:[{say:'Go to Reports. The indigo Case Management card sits right after Case Advocacy.',li:0,act:async()=>{spot(q('.k-tile1'),5)}},
 {say:'It has one row per family after a Lions screening referral.',li:1,act:async()=>{await tap('.k-tile1',900);hideCursor()}}]},

// ================= ONE TASK, ASSIGN IN THE REPORT =================
{html:()=>HEAD('New','One task, then assign in the report')+`<div class="cm-win"><div class="cm-in" style="padding-top:10px">
 <div class="md-h">My Day</div><div class="k-tmini">${ASSIGNTASK(6)}</div>
 <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span class="cm-split"><b>Case Management Report</b></span><span class="cm-gen k-gen">Generated 10/7/2026, 8:14:02 AM</span></div>
 ${STRIP(ST)}${ATTN()}</div></div>`
 +PTS(['A new batch of screenings: <b>ONE</b> My Day task, <b>Assign N case management cases</b>.',
 'Its button opens the report. In <b>Needs attention</b>, under <b>No staff assigned</b>, use each <b>Assign to…</b> box.',
 'Keep it even with the <b>Caseload by staff</b> cards.',
 'The report <b>updates live</b>. The count goes down, and the task <b>closes itself</b> when every case has staff.'],130),
 init:()=>{ST=STAFF();NLEFT=6;const e=q('.k-strip');if(e)e.outerHTML=STRIP(ST)},
 steps:[
 {say:'When a new batch of screenings is saved, you get one My Day task, not one per family.',li:0,act:async()=>{spot(q('.k-tmini'),4)}},
 {say:'Its button opens the report. In Needs attention, under No staff assigned, pick a name in each Assign to box.',li:1,act:async()=>{spot(null);await tap('.k-open',800);await assignRow('mara-delgado',4);hideCursor();spot(q('.k-attn'),3)}},
 {say:'Use the caseload cards to keep it even.',li:2,act:async()=>{spot(q('.k-strip'),3)}},
 {say:'The report updates live. The count drops as you assign, and the task closes itself when every case has staff.',li:3,act:async()=>{spot(q('.k-tmini'),3);await wait(500);
  for(const [r,s] of [['kawika-pahia',3],['jenna-morales',0],['tevita-fifita',2],['amy-chun',1],['rina-sato',4]]){const row=q(`.k-g-ns .cm-ar[data-p="${r}"]`);if(!row)continue;
   await anim(row,[{opacity:1},{opacity:0}],250,'ease-out');row.remove();moved(s,r==='rina-sato'?4:3);await wait(260)}
  const g=q('.k-g-ns');if(g)g.outerHTML='<div class="cm-sub" style="padding:6px 0">Nothing needs attention.</div>';
  q('.k-task').classList.add('done');q('.k-tck').classList.add('on');await wait(300);spot(q('.k-tmini'),3)}}]},

// ================= MAHALO =================
{cls:'cover',html:()=>LOGO+`<div class="brand">What’s new · The Case Management report</div><div class="hello">That’s the update</div><h1>Mahalo<span class="nmc"></span>!</h1>
 <p class="sub" style="top:300px">The full walkthrough, <b>The Case Management Report</b>, covers the tiles, first-contact due dates, the table and notes. Tap <b>See the full training</b> below, or use this link:</p>
 <a href="case-management-report.html" target="_blank" rel="noopener" style="position:absolute;left:70px;top:420px;display:inline-flex;align-items:center;gap:10px;background:#fff;color:#4338CA;font-weight:800;font-size:22px;text-decoration:none;border-radius:12px;padding:14px 22px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:5;">&#9654; Open The Case Management Report</a>${WAVES}`,
 steps:[{say:'Mahalo {name}! The full walkthrough covers the tiles, first-contact due dates, the table and notes. To watch it now, tap See the full training below.',act:async()=>{await wait(400);confetti(640,300,120)}}]}
];
</script>
<script src="deck-engine.js"></script>
<script src="deck-tracker.js"></script></body></html>
