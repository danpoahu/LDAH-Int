<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What’s New: Choose Your Look — Training</title>
<link rel="stylesheet" href="deck-base.css">
<!-- Same Firebase build as the dashboard, so the deck shares its sign-in and records progress. -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
/* Every class starts with lk-. Colors copied from the dashboard's <style id="ldahThemes">. */
.lk-win{position:absolute;left:58px;top:118px;width:712px;height:560px;border:1px solid #D5DEE8;border-radius:12px;overflow:hidden;box-shadow:0 14px 36px rgba(15,23,42,.16);z-index:4;color:#1E293B;font-size:12px;font-family:"Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;transition:background .6s;--ac:#0891B2;--bd:#E2E8F0}
.lk-art{position:absolute;left:0;right:0;bottom:0;height:200px;transition:opacity .6s;opacity:0}
.lk-side{position:absolute;left:0;top:0;bottom:0;width:150px;padding:14px 10px;border-right:1px solid var(--bd);transition:background .6s,color .6s;z-index:2}
.lk-side .ttl{font-weight:800;font-size:13px;margin:0 0 10px 4px}
.lk-side .nv{padding:6px 9px;border-radius:6px;margin-bottom:2px;color:inherit;opacity:.85}
.lk-side .nv.act{background:var(--ac);color:#fff;opacity:1;font-weight:700;transition:background .6s}
.lk-foot{position:absolute;left:8px;right:8px;bottom:10px;border:1px solid var(--bd);border-radius:10px;padding:8px 8px;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;transition:background .6s}
.lk-foot b{margin-right:auto}
.lk-dot{width:20px;height:20px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.18);transition:box-shadow .3s}
.lk-dot.on{box-shadow:0 0 0 3px #FBBF24;transform:scale(1.2)}
.lk-dot{transition:box-shadow .3s,transform .3s}
.lk-main{position:absolute;left:150px;right:0;top:0;bottom:0;padding:14px 16px;z-index:1}
.lk-top{border:1px solid var(--bd);border-radius:10px;padding:10px 14px;font-weight:800;font-size:15px;transition:background .6s;display:flex;align-items:center}
.lk-top span{margin-left:auto;font-size:10px;font-weight:700;color:#fff;background:var(--ac);border-radius:6px;padding:4px 10px;transition:background .6s}
.lk-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.lk-kpi,.lk-card{border:1px solid var(--bd);border-radius:10px;padding:10px 12px;transition:background .6s}
.lk-kpi .v{font-size:22px;font-weight:800;color:var(--ac);transition:color .6s}
.lk-kpi .l{font-size:10.5px;opacity:.75}
.lk-card h5{margin:0 0 6px;font-size:12px}
.lk-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--bd);font-size:11px}
.lk-name{position:absolute;left:58px;top:690px;font-size:15px;font-weight:800;color:#0F172A}
/* the four looks */
.lk-win[data-l=moana]{background:linear-gradient(180deg,#E0F2FE,#F0F9FF 45%,#ECFEFF);--ac:#0369A1;--bd:rgba(3,105,161,.16);color:#0F172A}
.lk-win[data-l=moana] .lk-side{background:rgba(255,255,255,.58)}
.lk-win[data-l=moana] .lk-foot{background:rgba(224,242,254,.85)}
.lk-win[data-l=moana] :is(.lk-top,.lk-kpi,.lk-card){background:rgba(255,255,255,.78)}
.lk-win[data-l=moana] .a-moana{opacity:1}
.lk-win[data-l=koolau]{background:linear-gradient(160deg,#ECF5EE,#F4F8F1 60%,#E9F3EC);--ac:#15803D;--bd:rgba(21,94,59,.15)}
.lk-win[data-l=koolau] .lk-side{background:linear-gradient(180deg,#123524,#1B4D33);color:#E7F5EA;border-right:none}
.lk-win[data-l=koolau] .lk-side .nv.act{background:#86EFAC;color:#123524}
.lk-win[data-l=koolau] .lk-foot{background:rgba(255,255,255,.08);border-color:rgba(134,239,172,.3);color:#A7C9B1}
.lk-win[data-l=koolau] :is(.lk-top,.lk-kpi,.lk-card){background:rgba(255,255,255,.88)}
.lk-win[data-l=koolau] .a-koolau{opacity:1}
.lk-win[data-l=kapa]{background:#F7F1E6;--ac:#9A3412;--bd:#E8DCC6;color:#3B2A1A}
.lk-win[data-l=kapa] .lk-side{background:rgba(255,252,246,.94)}
.lk-win[data-l=kapa] .lk-foot{background:#F1E6D2;border-color:#D6B98C}
.lk-win[data-l=kapa] :is(.lk-top,.lk-kpi,.lk-card){background:rgba(255,252,246,.96)}
.lk-win[data-l=kapa] .a-kapa{opacity:1}
.lk-win[data-l=classic]{background:#F4F6F9;--ac:#0891B2;--bd:#E2E8F0}
.lk-win[data-l=classic] .lk-side{background:#fff}
.lk-win[data-l=classic] .lk-foot{background:#F8FAFC}
.lk-win[data-l=classic] :is(.lk-top,.lk-kpi,.lk-card){background:#fff}
/* cover swatch cards */
.lk-sw{position:absolute;width:170px;height:118px;border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.3);color:#fff;font-weight:800;font-size:17px;padding:12px 14px;display:flex;align-items:flex-end;animation:bob 6s ease-in-out infinite;z-index:3}
</style></head><body>
<div id="view"><div id="stage"><div id="nbar"><i></i></div>
<div id="scenes"></div>
<div id="spot"></div>
<svg id="cursor" viewBox="0 0 28 32"><path d="M3 2 L3 26 L9.5 19.5 L14 29 L18.5 27 L14 17.5 L23 17.5 Z" fill="#fff" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/></svg>
</div></div>
<div id="cap" aria-live="polite"></div>
<div id="bar">
 <button id="prev">Back</button><button id="play">Start</button><button id="next">Next</button>
 <div id="dots"></div>
 <button id="capbtn" aria-pressed="false">Captions</button><button id="voice" aria-pressed="true">Voice on</button>
</div>
<script>
const DECK_ID='whatsnew-looks';

/* What's new mini deck: the four Looks (v152.76+). The picker is the "Look" row of four dots in
   the sidebar footer (ldahSetTheme). Only colors change; the choice is kept per computer
   (localStorage ldahTheme). A pinned look (userRoles.lockedLook) hides the dots. No names drawn. */

const tap=async(s,ms=850)=>{const e=typeof s==='string'?q(s):s;await move(e,ms);await click(e);return e};
const PTS=(items,top=140)=>`<div class="abs" style="left:790px;top:${top}px;width:440px"><ul class="pts">${items.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
const LOOKS=[['moana','Moana','ocean','linear-gradient(135deg,#0369A1,#67E8F9)'],['koolau','Koʻolau','rainforest','linear-gradient(135deg,#14532D,#86EFAC)'],['kapa','Kapaʻa','warm sand','linear-gradient(135deg,#7C2D12,#E9D5B0)'],['classic','Classic','the original look','linear-gradient(135deg,#0891B2,#FED7AA)']];

/* background art, drawn (no images): waves, mountains with a palm, a kapa pattern */
const ART=`<svg class="lk-art a-moana" viewBox="0 0 712 200" preserveAspectRatio="none"><path d="M0 120 Q90 90 180 120 T360 120 T540 120 T720 120 V200 H0Z" fill="#7DD3FC" opacity=".35"/><path d="M0 150 Q110 125 220 150 T440 150 T660 150 T880 150 V200 H0Z" fill="#38BDF8" opacity=".3"/><ellipse cx="560" cy="95" rx="26" ry="18" fill="#0E7490" opacity=".25"/></svg>
<svg class="lk-art a-koolau" viewBox="0 0 712 200" preserveAspectRatio="none"><path d="M0 200 L0 120 L90 50 L170 110 L260 30 L360 105 L450 45 L560 115 L640 60 L712 100 V200Z" fill="#166534" opacity=".16"/><path d="M600 200 Q596 150 612 110" stroke="#15803D" stroke-width="5" fill="none" opacity=".25"/><path d="M612 110 q-30 -6 -48 12 M612 110 q30 -8 46 10 M612 110 q-10 -24 -32 -30 M612 110 q14 -24 36 -26" stroke="#15803D" stroke-width="5" fill="none" stroke-linecap="round" opacity=".25"/></svg>
<svg class="lk-art a-kapa" viewBox="0 0 712 200" preserveAspectRatio="none"><defs><pattern id="kp" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M20 4 L36 20 L20 36 L4 20Z" fill="none" stroke="#9A3412" stroke-width="2" opacity=".18"/></pattern></defs><rect width="712" height="200" fill="url(#kp)"/></svg>`;

const WIN=look=>`<div class="lk-win k-win" data-l="${look}">${ART}
 <div class="lk-side"><div class="ttl">LDAH-Int</div><div class="nv act">Home</div><div class="nv">My Day</div><div class="nv">Contacts</div><div class="nv">Events</div><div class="nv">Reports</div>
  <div class="lk-foot k-foot"><b>Look</b>${LOOKS.map(l=>`<span class="lk-dot k-d-${l[0]}${l[0]===look?' on':''}" style="background:${l[3]}" title="${l[1]}"></span>`).join('')}</div></div>
 <div class="lk-main"><div class="lk-top">Home<span>+ New</span></div>
  <div class="lk-kpis"><div class="lk-kpi"><div class="v">24</div><div class="l">Open tasks</div></div><div class="lk-kpi"><div class="v">8</div><div class="l">Events this week</div></div><div class="lk-kpi"><div class="v">132</div><div class="l">Signups</div></div></div>
  <div class="lk-card"><h5>My Day</h5><div class="lk-row"><span>Call back a parent</span><b>Today</b></div><div class="lk-row"><span>Send the event flyer</span><b>Wed</b></div><div class="lk-row" style="border:0"><span>Finish the event summary</span><b>Fri</b></div></div></div></div>`;

function setLook(l){const w=q('.k-win');w.setAttribute('data-l',l);document.querySelectorAll('.lk-dot').forEach(d=>d.classList.toggle('on',d.classList.contains('k-d-'+l)));
 const n=q('.k-lname');const L=LOOKS.find(x=>x[0]===l);if(n)n.textContent=L[1]+' · '+L[2]}
async function pick(l){await tap('.k-d-'+l,700);setLook(l);await wait(700)}

const LOGO=`<div class="ldah-logo" style="position:absolute;left:70px;top:22px;background:#fff;border-radius:14px;padding:6px 10px;box-shadow:0 4px 14px rgba(0,0,0,.18);animation:rise .6s both"><img src="../logo_blue.png" alt="LDAH" style="height:80px;display:block"></div>`;

const SC=[
// ================= COVER =================
{cls:'cover',html:()=>LOGO+`<div class="brand">Leadership in Disabilities &amp; Achievement of Hawaiʻi · What’s new</div><div class="hello">Aloha <span class="nm"></span></div>
 <h1>Choose your Look</h1><p class="sub" style="top:350px">LDAH-Int now comes in four Looks. Pick the one you like. Under a minute.</p>
 ${LOOKS.map((l,i)=>`<div class="lk-sw" style="left:${800+(i%2)*200}px;top:${130+Math.floor(i/2)*150}px;background:${l[3]};transform:rotate(${[-3,2,2,-3][i]}deg);animation-delay:${i*.6}s">${l[1]}</div>`).join('')}
 <div class="gate" style="top:450px"><button class="btn" data-go="start">Play</button><label><input type="checkbox" id="voiceChk" checked> Read it out loud to me</label></div>${WAVES}`,
 steps:[{say:'Aloha {name}! LDAH-Int now comes in four Looks. Here is how to pick yours.'}]},

// ================= THE PICKER =================
{html:()=>HEAD('New','Four Looks, one click')+WIN('moana')+`<div class="lk-name k-lname">Moana · ocean</div>`+PTS([
 'At the bottom of the left menu: <b>Look</b> and four dots.',
 '<b>Moana</b>, the ocean. This is the one you start in.',
 '<b>Koʻolau</b>, the rainforest. Dark green menu, mountains and palms.',
 '<b>Kapaʻa</b>, warm sand with a diamond pattern.',
 '<b>Classic</b>, the original look.']),
 init:()=>setLook('moana'),
 steps:[
 {say:'At the bottom of the left menu, next to the word Look, there are four dots.',li:0,act:async()=>{spot(q('.k-foot'),5)}},
 {say:'Moana, the ocean, is the one everyone starts in.',li:1,act:async()=>{spot(null);await pick('moana')}},
 {say:'Koʻolau is the rainforest, with a dark green menu, mountains and palms.',li:2,act:async()=>{await pick('koolau')}},
 {say:'[Kapaʻa|Ka paw ah] is warm sand, with a diamond pattern.',li:3,act:async()=>{await pick('kapa')}},
 {say:'And Classic is the original look.',li:4,act:async()=>{await pick('classic');hideCursor()}}]},

// ================= WHAT IT DOES =================
{html:()=>HEAD('Good to know','Only the colors change')+WIN('koolau')+`<div class="lk-name k-lname">Koʻolau · rainforest</div>`+PTS([
 '<b>Only the colors change.</b> Every button, menu and report stays right where it was.',
 'Your pick is saved <b>on this computer</b>. On a different computer, pick it again.',
 'No dots at the bottom of your menu? Your Look has been set for you.']),
 init:()=>setLook('koolau'),
 steps:[
 {say:'Only the colors change. Every button, menu and report stays right where it was.',li:0,act:async()=>{spot(q('.lk-main'),2);await wait(900);setLook('kapa');await wait(1100);setLook('koolau')}},
 {say:'Your pick is saved on this computer. On a different computer, just pick it again.',li:1,act:async()=>{spot(q('.k-foot'),5)}},
 {say:'If you don’t see the dots at the bottom of your menu, your Look has been set for you.',li:2,act:async()=>{spot(null)}}]},

// ================= MAHALO =================
{cls:'cover',html:()=>LOGO+`<div class="brand">What’s new · Choose your Look</div><div class="hello">That’s the update</div><h1>Mahalo<span class="nmc"></span>!</h1>
 <p class="sub" style="top:300px">Try all four. Look, at the bottom of the left menu.</p>${WAVES}`,
 steps:[{say:'Mahalo {name}! Try all four. You will find them at the bottom of the left menu.',act:async()=>{await wait(400);confetti(640,300,120)}}]}
];
</script>
<script src="deck-engine.js?v=3"></script>
<script src="deck-tracker.js"></script></body></html>
