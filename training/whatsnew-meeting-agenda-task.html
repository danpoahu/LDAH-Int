.sc-wc p b{color:#0F172A}
.sc-art{position:relative;height:150px}
.sc-strip{position:absolute;left:70px;top:494px;width:1140px;display:flex;align-items:center;gap:0;opacity:0}
.sc-strip div{flex:1;text-align:center;font-size:16px;font-weight:700;color:#0B3A53;position:relative;padding-top:30px}
.sc-strip div::before{content:"";position:absolute;left:50%;top:6px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#DC2626;border:3px solid #fff;box-shadow:0 0 0 2px #DC2626;z-index:1}
.sc-strip div::after{content:"";position:absolute;left:0;right:0;top:13px;height:3px;background:#FECACA}
.sc-strip div:first-child::after{left:50%}.sc-strip div:last-child::after{right:50%}
.sc-strip small{display:block;font-size:13px;color:#64748B;font-weight:600}
/* cover art */
.sc-cv1{position:absolute;left:800px;top:120px;width:390px;background:#fff;border-radius:14px;box-shadow:0 24px 50px rgba(0,0,0,.35);padding:14px 16px;color:#1E293B;transform:rotate(3deg);animation:bob 6s ease-in-out infinite;z-index:3;font-family:"Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.sc-cv2{position:absolute;left:860px;top:420px;width:330px;background:#fff;border-radius:12px;box-shadow:0 20px 40px rgba(0,0,0,.3);padding:12px 14px;color:#1E293B;transform:rotate(-4deg);animation:bob 5s 1s ease-in-out infinite;z-index:4;font-family:"Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
</style></head><body>
<div id="view"><div id="stage"><div id="nbar"><i></i></div>
<div id="scenes"></div>
<div id="spot"></div>
<svg id="cursor" viewBox="0 0 28 32"><path d="M3 2 L3 26 L9.5 19.5 L14 29 L18.5 27 L14 17.5 L23 17.5 Z" fill="#fff" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/></svg>
</div></div>
<div id="cap" aria-live="polite"></div>
<div id="bar">
 <button id="prev">Back</button><button id="play">Start</button><button id="next">Next</button>
 <div id="dots"></div>
 <button id="capbtn" aria-pressed="false">Captions</button><button id="voice" aria-pressed="true">Voice on</button>
</div>
<script>
const DECK_ID='whatsnew-meeting-agenda-task';

/* What's new mini deck. It plays inside the sign-in popup, so it is short and mostly summary.
   The mocks are the My Day task and agenda window from staff-calendar-meeting-agendas.html,
   matching staffAgenda.js askTask/finalTask wording (LIVE 2026-11-06). Every person is MADE UP.
   The popup supplies See the full training / Got it / Remind me later, so this deck draws none of those. */
const LOGO='../logo_blue.png';
const LOGO_T='../logo_transparent.png';
const ITEMS2=[['Budget for December','Malia Kahale'],['Holiday office hours','Kai Akana']];
const ITEMS3=ITEMS2.concat([['Volunteer fair booth staffing','Leah Nakoa']]);

const tap=async(s,ms=850)=>{const e=typeof s==='string'?q(s):s;await move(e,ms);await click(e);return e};
function all(s){return[...document.querySelectorAll('.scene.on '+s)]}
const show=(e,ms=500)=>anim(e,[{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],ms,'ease-out').then(()=>{e.style.opacity=1});
const PTS=(items,top=140)=>`<div class="abs" style="left:790px;top:${top}px;width:440px"><ul class="pts">${items.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
const LOGOBOX=`<div style="position:absolute;left:70px;top:22px;background:#fff;border-radius:14px;padding:6px 10px;box-shadow:0 4px 14px rgba(0,0,0,.18);animation:rise .6s both"><img src="${LOGO}" alt="LDAH" style="height:80px;display:block"></div>`;
const agTxt=n=>`Agenda · ${n} item${n===1?'':'s'}`;

/* ---- My Day ---- */
const MD=(who,when,tasks)=>`<div class="sc-md k-md"><div class="sc-mdh"><div><h3>My Day</h3><div class="hs">${when}</div></div><div class="sc-who">${who}</div></div><div class="sc-sect"><h4>Things to do today</h4></div><div class="sc-todos">${tasks}</div></div>`;
const T_MON=(done)=>`<div class="sc-todo k-tmon${done?' done':''}"><span class="sc-chk k-chk"></span><div><div class="sc-ttl k-tttl">Add your agenda items for Leadership Meeting (Wednesday, November 18)</div>
 <div class="sc-tnote"><span class="k-steps">1. Press Open agenda.<br>2. Type each thing you want to talk about and press Add.<br>3. Tick this task done.</span><br><span class="k-goes">The agenda goes to Malia Kahale at 3pm on Tuesday, November 17.</span></div><span class="sc-open k-open">Open agenda →</span></div></div>`;
const T_FILL=t=>`<div class="sc-todo plain"><span class="sc-chk"></span><div><div class="sc-ttl">${t}</div></div></div>`;
const T_SENT=()=>`<div class="sc-todo k-tsent"><span class="sc-chk"></span><div><div class="sc-ttl k-tttl">Agenda for Leadership Meeting (Wednesday, November 18): 3 items</div>
 <div class="sc-tnote k-tlist">3 items are on the agenda. Press Open agenda to read them, build the master agenda, upload it there for everyone in the meeting, and take meeting notes.</div><span class="sc-open k-open">Open agenda →</span></div></div>`;

/* ---- the agenda window ---- */
const IROW=(it,i,me)=>`<div class="sc-row k-it${i}"><span class="n">${i+1}.</span><span class="t">${it[0]}</span><span class="by">${it[1]}</span>${it[1]===me?'<span class="sc-x k-x">×</span>':''}</div>`;
const AG=(o={})=>{const items=o.items||[],me=o.me||'';
 return `<div class="sc-dim k-dim"></div><div class="sc-ag k-agwin"><div class="sc-mh red k-agh"><img src="${LOGO_T}" alt="LDAH"><span>Leadership Meeting — Wed, Nov 18</span><span class="x">×</span></div><div class="sc-agbd">
 <div class="k-base"><div class="sc-h4" style="margin-top:0">Base agenda</div><div class="sc-muted">No base agenda uploaded for this date yet.</div></div>
 <div class="k-itemsec"><div class="sc-h4 k-ih">Items (${items.length})</div><div class="k-items">${items.map((it,i)=>IROW(it,i,me)).join('')}</div></div>
 <div class="sc-add"><div class="sc-agta ph k-new">Something you want to talk about</div><span class="sc-btn k-add">Add</span></div>
 <div><div class="sc-h4">Meeting notes</div><div class="sc-notes ph">Notes from the meeting</div></div>
 </div></div>`};

const SC=[
// ================= COVER =================
{cls:'cover',html:()=>LOGOBOX+`<div class="brand">Leadership in Disabilities &amp; Achievement of Hawaiʻi · What’s new</div><div class="hello">Aloha <span class="nm"></span></div>
 <h1>Your meeting agenda task</h1><p class="sub" style="top:350px">On Monday, My Day asks you for your agenda items. Add them, tick it done. Under 2 minutes.</p>
 <div class="sc-cv1"><div class="sc-todo" style="border-left-color:#DC2626"><span class="sc-chk"></span><div><div class="sc-ttl">Add your agenda items for Leadership Meeting (Wednesday, November 18)</div><span class="sc-open">Open agenda →</span></div></div></div>
 <div class="sc-cv2"><div class="sc-h4" style="margin:0 0 6px">Items (3)</div>${ITEMS3.map((it,i)=>IROW(it,i,'')).join('')}</div>
 <div class="spark" style="left:1200px;top:90px">${SPARK}</div><div class="spark" style="left:760px;top:560px;animation-delay:1s">${SPARK}</div>
 <div class="gate" style="top:450px"><button class="btn" data-go="start">Play</button><label><input type="checkbox" id="voiceChk" checked> Read it out loud to me</label></div>${WAVES}`,
 steps:[{say:'Aloha {name}! If you are in a meeting with an agenda, DAN now asks you for your items. Here is how it works, in under 2 minutes.'}]},

// ================= MONDAY: THE TASK =================
{html:()=>HEAD('Monday 8am','A task in My Day')+MD('Leah Nakoa','Monday, November 16',T_MON()+T_FILL('Call back about Family Night signup')+T_FILL('Send the reminder for Parent Talk Cafe (Nov 25)'))+PTS([
 'Monday at <b>8am</b>, everyone in the meeting gets a task in <b>My Day</b>.',
 'The steps are in the task.',
 'It tells you <b>when the agenda goes out</b>: 3pm the day before the meeting.',
 'Press <b>Open agenda →</b>.']),
 steps:[{say:'Every Monday at 8am, everyone in a meeting with an agenda gets a task in My Day. Add your agenda items for the meeting.',li:0,act:async()=>{spot(q('.k-tttl'),4)}},
 {say:'The steps are right in the task. Open the agenda, add your items, then tick it done.',li:1,act:async()=>{spot(q('.k-steps'),4)}},
 {say:'It also tells you the deadline. The agenda goes out at 3pm the day before the meeting.',li:2,act:async()=>{spot(q('.k-goes'),4)}},
 {say:'Press Open agenda.',li:3,act:async()=>{spot(null);await tap('.k-open',800);hideCursor()}}]},

// ================= ADD YOUR ITEMS =================
{html:()=>HEAD('Your turn','Add your items, tick it done')+MD('Leah Nakoa','Monday, November 16',T_MON()+T_FILL('Call back about Family Night signup'))+AG({items:ITEMS2,me:'Leah Nakoa'})+PTS([
 'You see what others have added, and who added it.',
 'Type your item and press <b>Add</b>. One item each time.',
 'The small <b>×</b> removes your own item.',
 'Close the window and <b>tick the task done</b>.']),
 steps:[{say:'The agenda window opens. You can see what others have already added, and who added each one.',li:0,act:async()=>{spot(q('.k-itemsec'),4)}},
 {say:'Type your item in the box, and press Add. Do one item each time.',li:1,act:async()=>{spot(null);const t=q('.k-new');await tap(t,800);t.classList.add('foc');await type(t,'Volunteer fair booth staffing',40);t.classList.remove('foc');await tap('.k-add',700);hideCursor();
  t.textContent='Something you want to talk about';t.classList.add('ph');q('.k-items').insertAdjacentHTML('beforeend',IROW(ITEMS3[2],2,'Leah Nakoa'));q('.k-ih').textContent='Items (3)';const r=q('.k-it2');await anim(r,[{opacity:0,background:'#FEF2F2'},{opacity:1,background:'#fff'}],600);spot(r,3)}},
 {say:'Typed the wrong thing? The small x removes it. You can only remove your own items.',li:2,act:async()=>{spot(q('.k-x'),6)}},
 {say:'Then close the window, and tick the task done.',li:3,act:async()=>{spot(null);const w=q('.k-agwin');await anim(w,[{opacity:1},{opacity:0,transform:'scale(.95)'}],350);w.remove();q('.k-dim').remove();
  await tap('.k-chk',800);hideCursor();q('.k-tmon').classList.add('done');spot(q('.k-tmon'),4)}}]},

// ================= 3PM THE DAY BEFORE (key content before the close) =================
{html:()=>HEAD('3pm the day before','The agenda goes out')+MD('Malia Kahale','Tuesday, November 17',T_SENT()+T_FILL('Approve the December newsletter'))+
 `<div class="sc-pn" style="left:790px;top:140px;width:430px"><h4>Missed it?</h4>Any open Monday task <b>closes on its own</b> at 3pm.</div>
 <div class="sc-pn y" style="left:790px;top:270px;width:430px">A <b>late item still shows</b> in the agenda window. It is never lost.</div>
 <div class="sc-pn g" style="left:790px;top:400px;width:430px">Open the agenda <b>any time</b> from the <b>Agenda</b> button on the meeting’s card in the Staff Calendar.<div class="sc-ev staff big" style="width:auto;margin:10px 0 0"><div class="sc-et">Leadership Meeting</div><div class="sc-em">Wednesday · 8:30 AM</div><span class="sc-agb">${agTxt(3)}</span></div></div>`,
 steps:[{say:'At 3pm the day before the meeting, the person running it gets one task: the finished agenda, with the count of items.',act:async()=>{spot(q('.k-tttl'),4)}},
 {say:'If you did not get to yours, your Monday task closes on its own at 3pm.',act:async()=>{spot(null);const p=all('.sc-pn')[0];await show(p);spot(p,3)}},
 {say:'A late item still shows in the agenda window, so it is never lost.',act:async()=>{spot(null);await show(all('.sc-pn')[1])}},
 {say:'And you can open the agenda any time, from the Agenda button on the meeting’s card in the Staff Calendar. You do not have to wait for Monday.',act:async()=>{await show(all('.sc-pn')[2]);spot(all('.sc-pn')[2],3)}}]},

// ================= MAHALO =================
{cls:'cover',html:()=>LOGOBOX+`<div class="brand">What’s new · Your meeting agenda task</div><div class="hello">That’s the update</div><h1>Mahalo<span class="nmc"></span>!</h1>
 <p class="sub" style="top:300px">The full walkthrough, <b>Staff Calendar: Meeting Agendas</b>, covers adding a meeting, the master agenda and meeting notes. To watch it now, tap <b>See the full training</b> below, or use this link:</p>
 <a href="staff-calendar-meeting-agendas.html" target="_blank" rel="noopener" style="position:absolute;left:70px;top:430px;display:inline-flex;align-items:center;gap:10px;background:#fff;color:#0E7490;font-weight:800;font-size:22px;text-decoration:none;border-radius:12px;padding:14px 22px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:5;">&#9654; Open Staff Calendar: Meeting Agendas</a>${WAVES}`,
 steps:[{say:'Mahalo {name}! The full walkthrough covers adding a meeting, the master agenda and meeting notes. To watch it now, tap See the full training below.',act:async()=>{await wait(400);confetti(640,300,120)}}]}
];
</script>
<script src="deck-engine.js?v=6"></script>
<script src="deck-tracker.js"></script></body></html>
