<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What’s New: My Day Groups Your Tasks — Training</title>
<link rel="stylesheet" href="deck-base.css">
<!-- Same Firebase build as the dashboard, so the deck shares its sign-in and records progress. -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
/* Every class here starts with mg-, so nothing collides with deck-base.css.
   Drawn from the live My Day card: .todo rows and the .md-grp group cards (index.html, v153.45). */
.mg-win{position:absolute;left:58px;top:118px;width:712px;height:570px;background:#F4F6F9;border:1px solid #D5DEE8;border-radius:12px;overflow:hidden;box-shadow:0 14px 36px rgba(15,23,42,.16);z-index:4;color:#1E293B;font-size:12px;font-family:"Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.mg-card{position:relative;margin:12px 12px 0;background:#fff;border-radius:14px;box-shadow:0 1px 6px rgba(15,40,70,.08);padding:12px 14px 6px}
.mg-sect{display:flex;align-items:center;gap:6px;margin:0 0 9px}
.mg-sect h4{margin:0;font-size:12px;color:#0B3A53;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.mg-cnt{background:rgba(8,145,178,.12);color:#0B3A53;padding:1px 8px;border-radius:999px;font-size:10.5px;font-weight:800}
/* group card */
.mg-grp{border:1px solid rgba(8,145,178,.12);border-left:4px solid #0891B2;border-radius:11px;margin-bottom:7px;background:linear-gradient(90deg,rgba(8,145,178,.05),#fff 30%)}
.mg-grp.red{border-left-color:#DC2626;background:linear-gradient(90deg,rgba(220,38,38,.04),#fff 30%)}
.mg-grp.indigo{border-left-color:#4338CA;background:linear-gradient(90deg,rgba(67,56,202,.05),#fff 30%)}
.indigo .mg-gn{background:#4338CA}
.mg-case{display:flex;align-items:center;gap:9px;padding:6px 10px;background:#fff;border:1px solid rgba(8,145,178,.10);border-left:4px solid #7C3AED;border-radius:10px;margin-bottom:5px;font-size:11.5px}
.mg-case.cm{border-left-color:#4338CA}
.mg-case b{color:#0F172A}.mg-case small{color:#64748B;font-size:9.5px;margin-left:auto;white-space:nowrap}
.mg-grp.orange{border-left-color:#F97316;background:linear-gradient(90deg,rgba(249,115,22,.06),#fff 30%)}
.mg-gh{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:8px 11px;cursor:pointer}
.mg-gn{width:28px;height:28px;border-radius:8px;background:#0891B2;color:#fff;font-weight:800;font-size:12.5px;display:flex;align-items:center;justify-content:center}
.red .mg-gn{background:#DC2626}.orange .mg-gn{background:#F97316}
.mg-gt{font-weight:800;font-size:13px;color:#0F172A}
.mg-gs{font-size:10.5px;color:#64748B;margin-top:1px}
.mg-car{font-size:12px;color:#64748B;display:inline-block;transition:transform .2s}
.mg-grp.open .mg-car{transform:rotate(90deg)}
.mg-gb{display:none;padding:0 9px 8px}
.mg-grp.open .mg-gb{display:block}
.mg-more{display:none}.mg-grp.all .mg-more{display:block}
.mg-grp.all .mg-all{display:none}
.mg-all{border:none;background:none;color:#0891B2;font-weight:800;font-size:11px;padding:3px 2px;cursor:pointer;font-family:inherit}
/* task row */
.mg-todo{display:grid;grid-template-columns:16px 1fr auto;gap:9px;align-items:center;padding:6px 10px;background:#fff;border:1px solid rgba(8,145,178,.10);border-left:4px solid #94A3B8;border-radius:10px;margin-bottom:5px}
.mg-todo.urgent{border-left-color:#DC2626}.mg-todo.today{border-left-color:#F97316}
.mg-todo .ck{width:14px;height:14px;border-radius:50%;border:2px solid #94A3B8}
.mg-todo .t{font-size:11.5px;font-weight:700;color:#0F172A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mg-todo .s{font-size:9.5px;color:#64748B}
.mg-pill{display:inline-block;border-radius:999px;padding:1px 7px;font-size:9.5px;font-weight:800;white-space:nowrap}
.mg-pill.od{background:#FEE2E2;color:#991B1B}.mg-pill.td{background:#FFEDD5;color:#9A3412}.mg-pill.up{background:#E0F2FE;color:#0B3A53}
/* cover art */
.cv-a{position:absolute;left:790px;top:120px;width:420px;background:#fff;border-radius:14px;box-shadow:0 24px 50px rgba(0,0,0,.35);padding:12px 12px 6px;color:#1E293B;transform:rotate(3deg);animation:bob 6s ease-in-out infinite;z-index:3;font-family:"Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
</style></head><body>
<div id="view"><div id="stage"><div id="nbar"><i></i></div>
<div id="scenes"></div>
<div id="spot"></div>
<svg id="cursor" viewBox="0 0 28 32"><path d="M3 2 L3 26 L9.5 19.5 L14 29 L18.5 27 L14 17.5 L23 17.5 Z" fill="#fff" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/></svg>
</div></div>
<div id="cap" aria-live="polite"></div>
<div id="bar">
 <button id="prev">Back</button><button id="play">Start</button><button id="next">Next</button>
 <div id="dots"></div>
 <button id="capbtn" aria-pressed="false">Captions</button><button id="voice" aria-pressed="true">Voice on</button>
</div>
<script>
const DECK_ID='whatsnew-myday-grouped';

/* What's new mini deck: My Day "Things to do today" now folds 3 or more tasks of
   the same kind into one card (myDayGrpToggle / myDayGrpShowAll in index.html).
   Every family name is MADE UP. The popup supplies See the full training / Got it /
   Remind me later, so this deck draws none of those. */

const tap=async(s,ms=850)=>{const e=typeof s==='string'?q(s):s;await move(e,ms);await click(e);return e};
const PTS=(items,top=140)=>`<div class="abs" style="left:790px;top:${top}px;width:440px"><ul class="pts">${items.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;

const KIDS=['Keoni Akana','Lani Mahoe','Noa Kealoha','Mia Santos','Kai Nakamura','Ella Fong','Liam Ito'];
const ROW=(t,s,cls,pill)=>`<div class="mg-todo ${cls}"><span class="ck"></span><div style="min-width:0"><div class="t">${t}</div><div class="s">${s}</div></div><span class="mg-pill ${cls==='urgent'?'od':cls==='today'?'td':'up'}">${pill}</span></div>`;
const GRP=(k,n,title,sub,tone,rows)=>`<div class="mg-grp ${tone} k-${k}"><div class="mg-gh k-${k}-h"><div class="mg-gn">${n}</div><div><div class="mg-gt">${title}</div><div class="mg-gs">${sub}</div></div><span class="mg-car">&#9656;</span></div>
 <div class="mg-gb">${rows.map((r,i)=>`<div class="${i>=5?'mg-more':''}">${r}</div>`).join('')}${rows.length>5?`<button class="mg-all k-${k}-all">Show the other ${rows.length-5} &#9662;</button>`:''}</div></div>`;

const FPC=KIDS.map((n,i)=>ROW('Find a parent phone or email for '+n,'Lions vision referral · Kaimana Elementary · due 2026-10-1'+(i%3+4),'urgent','Overdue'));
const ADV=KIDS.slice(0,4).map(n=>ROW('Case advocacy: assign a parent consultant for '+n,'Lions hearing referral · due today','today','Due today'));
const CALL=KIDS.slice(2,5).map(n=>ROW('First call to the family of '+n,'Screening referral · due 2026-10-22','','Upcoming'));
const CASE=(p,k,s,c)=>`<div class="mg-case ${c}"><b>${p}</b> <span style="color:#64748B">${k}</span><small>${s}</small></div>`;
const CM1=[['Leah Mahoe','Kaia Mahoe'],['Sam Nakoa','Ian Nakoa'],['Joy Perez','Ana Perez'],['Dean Lum','Max Lum']].map(r=>CASE(r[0],'for '+r[1],'Case management · vision','cm'));
const CM2=[['Gina Toma','Lei Toma'],['Wes Hara','Jun Hara'],['Pua Kane','Koa Kane']].map(r=>CASE(r[0],'for '+r[1],'Case management · hearing','cm'));
const LIST=()=>`<div class="mg-win"><div class="mg-card k-card"><div class="mg-sect"><h4>Things to do today</h4><span class="mg-cnt">15</span></div>
 ${GRP('fpc',7,'Find Parent Contact','<b style="color:#991B1B">7 overdue</b> · oldest 2026-10-14','red',FPC)}
 ${GRP('adv',4,'Case Advocacy','<b style="color:#9A3412">4 due today</b>','orange',ADV)}
 <div class="k-one">${ROW('Send the volunteer packet to Rae Kim','Follow-up · due today','today','Due today')}</div>
 ${GRP('call',3,'Screening Initial Call','Not due yet · next 2026-10-22','',CALL)}</div>
 <div class="mg-card k-cases"><div class="mg-sect"><h4>My open cases</h4><span class="mg-cnt">9</span></div>
 ${CASE('Tia Kahale','for Mana Kahale','Advocacy · IEP meeting Oct 24','')}${CASE('Ruth Okada','for Ben Okada','Advocacy · started Oct 2','')}
 ${GRP('kai',4,'Kaimana Elementary · Lions','4 case management families','indigo',CM1)}
 ${GRP('pal',3,'Pālolo Elementary · Lions','3 case management families','indigo',CM2)}</div></div>`;

const LOGO=`<div class="ldah-logo" style="position:absolute;left:70px;top:22px;background:#fff;border-radius:14px;padding:6px 10px;box-shadow:0 4px 14px rgba(0,0,0,.18);animation:rise .6s both"><img src="../logo_blue.png" alt="LDAH" style="height:80px;display:block"></div>`;

const SC=[
// ================= COVER =================
{cls:'cover',html:()=>LOGO+`<div class="brand">Leadership in Disabilities &amp; Achievement of Hawaiʻi · What’s new</div><div class="hello">Aloha <span class="nm"></span></div>
 <h1>My Day groups your tasks</h1><p class="sub" style="top:350px">Lots of the same task now fold into one card. Tap to open, tap to close. About a minute.</p>
 <div class="cv-a">${GRP('c1',7,'Find Parent Contact','<b style="color:#991B1B">7 overdue</b> · oldest 2026-10-14','red',[])}${GRP('c2',4,'Case Advocacy','<b style="color:#9A3412">4 due today</b>','orange',[])}</div>
 <div class="spark" style="left:1200px;top:80px">${SPARK}</div><div class="spark" style="left:770px;top:560px;animation-delay:1s">${SPARK}</div>
 <div class="gate" style="top:450px"><button class="btn" data-go="start">Play</button><label><input type="checkbox" id="voiceChk" checked> Read it out loud to me</label></div>${WAVES}`,
 steps:[{say:'Aloha {name}! My Day now groups your tasks. Here is how it works, in under a minute.'}]},

// ================= OPEN, SHOW ALL, CLOSE =================
{html:()=>HEAD('New','Things to do today, grouped')+LIST()+PTS([
 'Three or more tasks of the same kind become <b>one card</b>. The number is how many.',
 'The colour tells you how urgent: <b style="color:#DC2626">red</b> overdue, <b style="color:#F97316">orange</b> due today, <b style="color:#0891B2">teal</b> not due yet.',
 '<b>Tap the card</b> to open it. You see the first five.',
 'Tap <b>Show the other…</b> to see the rest.',
 '<b>Tap the card again</b> to close it. Every task is counted. Nothing is hidden.',
 '<b>My open cases:</b> your advocacy cases come first. Case management families follow, <b>grouped by school</b>. Same tap to open and close.'],130),
 steps:[
 {say:'When you have three or more tasks of the same kind, they fold into one card. The number is how many are inside.',li:0,act:async()=>{spot(q('.k-fpc'),4)}},
 {say:'The colour tells you how urgent. Red is overdue, orange is due today, and teal is not due yet.',li:1,act:async()=>{spot(q('.k-card'),3)}},
 {say:'Tap the card to open it. You see the first five tasks.',li:2,act:async()=>{spot(null);await tap('.k-fpc-h',900);q('.k-fpc').classList.add('open');await wait(300);spot(q('.k-fpc'),4)}},
 {say:'Tap Show the other two to see the rest.',li:3,act:async()=>{spot(null);await tap('.k-fpc-all',800);q('.k-fpc').classList.add('all');await wait(300);spot(q('.k-fpc'),4)}},
 {say:'Tap the card again to close it. Every task still counts in your total. Nothing is hidden.',li:4,act:async()=>{spot(null);await tap('.k-fpc-h',800);q('.k-fpc').classList.remove('open');await wait(250);
  await tap('.k-adv-h',800);q('.k-adv').classList.add('open');await wait(900);await tap('.k-adv-h',700);q('.k-adv').classList.remove('open');hideCursor();spot(q('.k-card'),3)}},
 {say:'Under My open cases, your advocacy cases always come first. Right after them, your case management families are grouped by school. Tap a school to see its families, and tap again to close it.',li:5,act:async()=>{spot(q('.k-cases'),4);await wait(1200);spot(null);
  await tap('.k-kai-h',900);q('.k-kai').classList.add('open');await wait(300);spot(q('.k-cases'),4);await wait(1800);spot(null);
  await tap('.k-kai-h',800);q('.k-kai').classList.remove('open');hideCursor();spot(q('.k-cases'),4)}}]},

// ================= MAHALO =================
{cls:'cover',html:()=>LOGO+`<div class="brand">What’s new · My Day groups your tasks</div><div class="hello">That’s the update</div><h1>Mahalo<span class="nmc"></span>!</h1>
 <p class="sub" style="top:300px">Tap a card to open it, tap again to close it.</p>${WAVES}`,
 steps:[{say:'Mahalo {name}! Tap a card to open it, and tap again to close it.',act:async()=>{await wait(400);confetti(640,300,120)}}]}
];
</script>
<script src="deck-engine.js?v=3"></script>
<script src="deck-tracker.js"></script></body></html>
