<script>
const DECK_ID='whatsnew-pip-feedback-emails';

/* "What’s new" short version of pip-feedback-emails.html, played inside the sign-in popup.
   The popup draws its own See the full training / Got it / Remind me later buttons, so this
   deck draws none. Screens are drawn in HTML/CSS. All names are made up. */
const tap=async(s,ms=850)=>{const e=typeof s==='string'?q(s):s;await move(e,ms);await click(e);return e};
function all(s){return[...document.querySelectorAll('.scene.on '+s)]}
const show=(e,ms=500)=>anim(e,[{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],ms,'ease-out');
const TICK='<svg viewBox="0 0 16 16"><path d="M3 8.5 L6.5 12 L13 4.5"/></svg>';
/* ---- the one-off form, as a partner sees it (TOTAL box with the pink tick box beside it) ---- */
const MATS=['Agency Brochure','Education &amp; Training Brochure','What is a Learning Disability Brochure','Understanding ADHD Brochure','Understanding Dyslexia Brochure','Understanding Autism','Flyers','Newsletters'];
const aRow=a=>`<div class="arow"><span><b>${a[0]}</b><small>${a[1]}</small></span><span><span class="u">Update</span><span class="x">×</span></span></div>`;
const oRow=i=>`<tr class="orow"><td><span class="oin ph k-o${i}">Other (type what it was)</span></td><td class="n"><span class="k-op${i}">0</span></td><td class="n"><span class="k-od${i}">0</span></td></tr>`;
const val=(v,ph,cls='')=>`<div class="in2 ${cls}${v?'':' ph'}">${v||ph}</div>`;
const PEOPLE=[['Mele Sample','mele@example.com'],['Tavita Example','tavita@example.com']];
const FORM=o=>`<div class="oo"><div class="ooh"><span>${o.title||'Add One-Off Event'}</span><span>×</span></div><div class="oovp"><div class="ooin" data-y="0">
 <div class="f"><label class="lb">Event name *</label>${val(o.name,'e.g. Resource Fair Pop-Up','k-name')}</div>
 <div class="f f2"><div><label class="lb">Date *</label>${val(o.date,'mm/dd/yyyy','k-date')}</div><div><label class="lb">Presenter</label>${val(o.name?'Kim Example':'','First and last name','k-pres')}</div></div>
 <div class="f f2"><div><label class="lb">Location / Zoom *</label>${val(o.loc,'Place name, or Zoom','k-loc')}</div><div><label class="lb">Tier level</label>${val(o.name?'Tier 3: Workshops':'','— Select tier —','sel k-tier')}</div></div>
 <div class="f"><label class="lb">Which island is this for? *</label>${val(o.isl,'Choose an island','sel k-isl')}</div>
 <div class="f"><label class="lb">Description</label>${val('','What was this gathering about?','ta')}</div>
 <div class="f"><label class="lb">Distribution of Materials</label><table class="mt"><tr><th>MATERIAL</th><th># PACKED</th><th># DISSEMINATED</th></tr>${MATS.map(m=>`<tr><td>${m}</td><td class="n"><span>0</span></td><td class="n"><span>0</span></td></tr>`).join('')}<tbody class="oth">${oRow(0)}</tbody></table></div>
 <div class="f"><label class="lb">Presenter Comments / Concerns</label>${val('','Notes from the presenter about the session...','ta')}</div>
 <div class="atth"><b>Attendees (<span class="an">${(o.att||[]).length}</span>) · all marked attended</b><span class="nc">+ New contact</span></div>
 <div class="srch">Search contacts by name…</div><div class="alist">${(o.att||[]).length?(o.att||[]).map(aRow).join(''):'<div style="color:#64748B;font-size:13px;padding:4px 0">No attendees added yet.</div>'}</div>
 <div class="f" style="margin-top:8px"><label class="lb">How many people attended?</label>
 <div class="cntrow"><div class="numb${o.total?'':' ph'}">${o.total||'e.g. 24'}</div>
 <div class="fbw"><span class="fck">${TICK}</span><span><b>Send feedback emails</b><br>The attendees above will get a short feedback request after the event.</span></div></div>
 <div class="ynote"><b>This is the TOTAL attendance</b>, including the people you marked attended above. Example: 2 named above and 36 more with no names → enter 38.</div></div>
 <div style="height:16px"></div></div></div><div class="oof"><span class="cn">Cancel</span><span class="sv">Save</span></div></div>`;
const FILLED={title:'Add One-Off Event',name:'Family Talk Night',date:'09/29/2026',loc:'Hagåtña',isl:'Guam'};
function jumpForm(to){const inr=q('.ooin');let y=to==='bottom'?inr.scrollHeight-q('.oovp').clientHeight:to;y=Math.max(0,y);inr.style.transform=`translateY(${-y}px)`;inr.dataset.y=y}

/* ---- the email on a phone ---- */
const PHONE=()=>`<div class="phn"><div class="phs"><div class="phbar"><span>7:42</span><span>▮▮▮ 4G</span></div>
 <div class="mhead mpart p0"><div class="fr"><span class="av">PIP</span><div><b>Pacific Island Partners</b><small>to Mele</small></div></div><div class="sj">How was Family Talk Night? We’d love your feedback</div></div>
 <div class="mbody"><img class="lg mpart p1" src="pip-logo.png" alt="Pacific Island Partners">
 <p class="mpart p2">Hi Mele Sample,</p>
 <p class="mpart p2">Thank you for coming to <strong>Family Talk Night</strong>! Tell us what you thought. It takes one minute.</p>
 <span class="cta mpart p3">Share Your Feedback</span>
 <p class="raw mpart p3">Or open: https://ldahawaii.org/feedback.html?eventId=…</p>
 <p class="so mpart p4">Thank you,<br><strong>Pacific Island Partners</strong><small><a>ldahawaii.org/pacific.html</a></small></p></div></div></div>`;

/* ---- the Feedback report ---- */
const FCARDS=[
 {t:'Family Talk Night',d:'September 29, 2026',r:2,s:100,l:100},
 {t:'Parent Circle',d:'September 22, 2026',r:3,s:67,l:100},
 {t:'IEP Basics',d:'September 15, 2026',r:1,s:100,l:100}];
const fcard=c=>`<div class="fcd"><span class="chip">One-Off</span><b class="t">${c.t}</b><small>${c.d} · Kim Example</small><small class="isl">PIP · Guam</small><div class="pl"><span>Responses: ${c.r}</span><span class="g">Satisfied: ${c.s}%</span><span>Learned more: ${c.l}%</span></div></div>`;
const FBR=()=>`<div class="fbr"><div class="fbh"><span class="bk2">← Back to Reports</span><h3>Feedback Report</h3><span class="isel">All six islands ▾</span><span class="sp"></span><span class="gb">↻ Refresh</span><span class="gb">Download CSV</span></div>
 <div class="ffl"><div><label>Event type</label><div class="fx">All types</div></div><div><label>From</label><div class="fx">mm/dd/yyyy</div></div><div><label>To</label><div class="fx">mm/dd/yyyy</div></div><div><label>Search</label><div class="fx">Event or respondent name</div></div></div>
 <div class="kpis"><div class="kp"><b class="k1">0</b><span>Responses</span></div><div class="kp"><b class="k2">0</b><span>Sessions with feedback</span></div><div class="kp"><b class="k3">0</b><span>People</span></div><div class="kp"><b class="k4">0%</b><span>Satisfied overall</span></div></div>
 <div class="fcards">${FCARDS.map(fcard).join('')}</div></div>`;
const BARS=[['Presenter: very helpful',100],['Handouts: very helpful',50],['Satisfied overall',100],['Learned more',100],['Relevant to child',100],['Useful to me',100]];
const ANS=[['Q1. Participation mode','In person'],['Q2. Presenter rating','Very helpful'],['Q7. Overall satisfaction','Yes'],['Q12. What did you like best?','Hearing from other parents.'],['Q13. What would you improve?','More time for questions.']];
const FMOD=()=>`<div class="fmod"><div class="fmh"><span>Family Talk Night — September 29, 2026</span><span>×</span></div><div class="fmb">
 <div class="fms">Session</div><div class="kvs"><div class="kv"><small>Date</small>September 29, 2026</div><div class="kv"><small>Presenter</small>Kim Example</div><div class="kv"><small>Responses</small>2</div><div class="kv"><small>Island</small>Guam</div></div>
 <div class="fms">At a glance</div><div class="bars">${BARS.map(b=>`<div class="br"><span>${b[0]}</span><i><em data-w="${b[1]}"></em></i><b>${b[1]}%</b></div>`).join('')}</div>
 <div class="fms">Responses (2) · click a name to read all 13 answers</div>
 ${[['MS','Mele Sample','mele@example.com'],['TE','Tavita Example','tavita@example.com']].map((p,i)=>`<div class="resp r${i}"><div class="rsum"><span class="ini">${p[0]}</span><span class="nmx"><b>${p[1]}</b><small>${p[2]} · 9/29/2026, ${i?'8:05':'7:51'} PM</small></span><span class="sat">Satisfied: Yes</span></div>
 <div class="rans">${ANS.map(a=>`<div><span>${a[0]}</span><span>${a[1]}</span></div>`).join('')}</div></div>`).join('')}
 </div></div>`;

const SC=[
// ================= COVER =================
{cls:'cover',html:()=>`<div class="brand">Pacific Island Partners · What’s new</div><div class="hello">Hi <span class="nm"></span></div>
 <h1 class="wnh"><span class="wn">New</span><br>Feedback emails after your events</h1><p class="sub" style="top:398px">A pink tick box on the one-off event form, the short email families get, and where their answers show up. About two minutes.</p>
 <div class="pipglow"></div><div class="piplogo"><img src="pip-logo.png" alt="Pacific Island Partners"></div>
 ${[[740,110,0],[1190,150,.8],[1210,400,1.6],[760,420,.4],[980,80,1.2]].map(p=>`<div class="pipspk" style="left:${p[0]}px;top:${p[1]}px;animation-delay:${p[2]}s">${SPARK}</div>`).join('')}
 <div class="gate" style="top:520px"><button class="btn" data-go="start">Start</button><label><input type="checkbox" id="voiceChk" checked> Read it out loud to me</label></div>${WAVES}`,
 steps:[{say:'Hi {name}! Here is what’s new. After a one-off event, the families who came can now get a short feedback email, and you can read what they said. This takes about two minutes.'}]},

// ================= 1. THE PINK BOX =================
{html:()=>HEAD('New · On the one-off event form','Send feedback emails')+FORM(Object.assign({att:PEOPLE,total:'18'},FILLED))+`<div class="abs" style="left:660px;top:150px;width:570px"><ul class="pts"><li>Add the people who came, then type the <b>TOTAL</b>.</li><li>The pink <b>Send feedback emails</b> box is <b>ticked for you</b>. Leave it ticked.</li><li>Untick it <b>only</b> when these people should not get an email.</li></ul></div>`,
 init:()=>jumpForm('bottom'),
 steps:[{say:'On the one-off event form, add the people who came, then type the total. Right beside the total is a new pink box. Send feedback emails.',li:0,act:async()=>{spot(q('.atth'),6);await wait(1800);spot(q('.fbw'),8)}},
 {say:'It is ticked for you. Leave it ticked, and everyone on your list gets a short email after the event.',li:1,act:async()=>{spot(null);const b=add('<div class="nobub ok" style="left:320px;top:560px">Ticked = they get the email</div>');await pop(b);await wait(1800);b.remove()}},
 {say:'Untick it only when these people should not get an email.',li:2,act:async()=>{const c=q('.fck');await tap(c,800);c.classList.add('off');hideCursor();const b=add('<div class="nobub" style="left:320px;top:560px">Unticked = no feedback emails</div>');await pop(b);await wait(1400);b.remove();c.classList.remove('off');spot(q('.fbw'),8)}}]},

// ================= 2. AFTER SAVE + THE EMAIL =================
{html:()=>HEAD('New · After you click Save','A short email, made for phones')+PHONE()+`<div class="tl">
 <div class="tli"><i>1</i><div><h4>You click Save</h4><p>The pink box is ticked. Mele and Tavita are on the list.</p></div></div>
 <div class="tli t2"><i>2</i><div><h4>Minutes later</h4><p>Each person on the list <b>with an email</b> gets one short email from Pacific Island Partners.</p></div></div>
 <div class="tli t3"><i>3</i><div><h4>About 5 days after the event</h4><p>No answer yet? <b>One</b> reminder. That’s all.</p></div></div>
 <div class="chips"><span><b>Never twice</b>Saving again sends nothing.</span><span><b>Email only</b>No address, no email.</span><span><b>Nothing to press</b>It all happens by itself.</span></div></div>`,
 init:()=>{const p=q('.phn');p.style.left='120px';p.style.top='112px';p.style.height='576px'},
 steps:[{say:'Click Save, and the rest happens by itself. Within minutes, each person on your list with an email gets this.',act:async()=>{const t=all('.tli');await show(t[0]);await show(t[1]);await show(q('.p0'))}},
 {say:'It comes from Pacific Island Partners. Two short lines and one button, kept small for phones on cell data.',act:async()=>{await show(q('.p1'));for(const p of all('.p2'))await show(p);for(const p of all('.p3'))await show(p);for(const p of all('.p4'))await show(p);await tap('.cta',800);hideCursor()}},
 {say:'No answer after about five days? One reminder. It never sends twice, and you never press anything else.',act:async()=>{await show(all('.tli')[2]);for(const c of all('.chips span')){await show(c);await wait(200)}}}]},

// ================= 3. THE FEEDBACK REPORT =================
{html:()=>HEAD('New · Reading the answers','Reports → Feedback')+FBR()+`<div class="abs" style="left:800px;top:150px;width:420px"><ul class="pts"><li>Reports → the <b>Feedback</b> tile.</li><li>One card per event: how many answered, how many were satisfied.</li><li>Click a card for the bars. Click a name to read <b>every answer</b>.</li></ul></div>`,
 steps:[{say:'Their answers show up in Reports, then Feedback.',li:0,act:async()=>{spot(q('.kpis'),6);countTo(q('.k1'),6);countTo(q('.k2'),3);countTo(q('.k3'),6);await countTo(q('.k4'),83,'%')}},
 {say:'There is one card for each event, with how many answered and how many were satisfied.',li:1,act:async()=>spot(q('.fcd'),6)},
 {say:'Click a card to see the answers as bars. Click a name to read everything that person said.',li:2,act:async()=>{spot(null);await tap('.fcd');hideCursor();const m=add(FMOD());await pop(m);for(const e of all('.br em'))e.style.width=e.dataset.w+'%';await wait(900);await tap('.r0 .rsum');hideCursor();q('.r0 .rans').classList.add('open');await wait(300);spot(q('.r0'),4)}}]},

// ================= CLOSING =================
{cls:'cover',html:()=>`<div class="brand">Pacific Island Partners · What’s new</div><div class="hello">That’s the short version</div><h1 class="wnh" style="width:640px">Thank you<span class="nmc"></span>!</h1>
 <div class="where">The full walkthrough, with a quick quiz, is in <b>Training Videos</b>:<br><b>Feedback emails, start to finish</b>.</div>
 <div class="below"><svg viewBox="0 0 24 24" fill="none" stroke="#FDE68A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 V20 M5 13 L12 20 L19 13"/></svg>Tap “See the full training” below to watch it now.</div>
 <div class="pipglow"></div><div class="piplogo"><img src="pip-logo.png" alt="Pacific Island Partners"></div>${WAVES}`,
 steps:[{say:'That’s the short version. The full walkthrough, with a quick quiz, is in Training Videos. Tap See the full training below to watch it now.',act:async()=>{await wait(400);confetti(640,300,120)}}]}
];
