<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What’s new: Your 6 AM report list — Training</title>
<link rel="stylesheet" href="deck-base.css">
<!-- Same Firebase build as the dashboard, so the deck shares its sign-in and records progress. -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
/* Every deck-only class starts with rl- so nothing collides with deck-base.css. */
/* ---------- PIP purple accent ---------- */
.kicker{color:#7C3AED}
ul.pts li.now::marker{color:#7C3AED}
/* ---------- cover: the PIP logo, floating ---------- */
.piplogo{position:absolute;left:760px;top:120px;width:450px;padding:22px 26px 16px;background:#fff;border-radius:26px;box-shadow:0 30px 70px rgba(0,0,0,.38);z-index:3;animation:pipin 1.1s .3s cubic-bezier(.3,1.5,.5,1) both,pipfloat 9s 1.4s ease-in-out infinite}
.piplogo img{display:block;width:100%;height:auto}
.pipglow{position:absolute;left:720px;top:90px;width:530px;height:360px;border-radius:50%;background:radial-gradient(closest-side,rgba(196,181,253,.6),rgba(125,211,252,.25) 60%,transparent);z-index:2;animation:pipglow 4.5s ease-in-out infinite}
.pipspk{position:absolute;width:30px;height:30px;z-index:4;animation:twinkle 2.6s ease-in-out infinite}
@keyframes pipin{from{opacity:0;transform:translateY(-220px) rotate(-18deg) scale(.4)}to{opacity:1;transform:none}}
@keyframes pipfloat{0%,100%{transform:translate(0,0) rotate(0)}20%{transform:translate(-26px,-18px) rotate(-3deg)}45%{transform:translate(14px,-30px) rotate(2.5deg)}70%{transform:translate(26px,8px) rotate(-1.5deg)}85%{transform:translate(-10px,16px) rotate(2deg)}}
@keyframes pipglow{0%,100%{opacity:.6;transform:scale(.94)}50%{opacity:1;transform:scale(1.06)}}
.rl-new{display:inline-block;background:#7C3AED;color:#fff;font-weight:900;font-size:15px;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:5px 14px;margin-bottom:8px}
.cover h1.rl-h{font-size:56px}
/* ---------- generic ---------- */
.rl-made{position:absolute;font-size:12.5px;color:#64748B;font-style:italic}
.typing::after{content:"|";color:#7C3AED;animation:blink .6s steps(1) infinite}
.rl-bub{position:absolute;background:#0F172A;color:#fff;font-weight:800;font-size:17px;border-radius:12px;padding:10px 14px;z-index:30;box-shadow:0 12px 30px rgba(0,0,0,.25);max-width:420px;line-height:1.3}
.rl-bub.ok{background:#16A34A}
/* ---------- the dashboard window (kept left of the points list at 790) ---------- */
.rl-win{position:absolute;left:58px;top:118px;width:712px;height:570px;background:#F4F6F9;border:1px solid #D5DEE8;border-radius:12px;overflow:hidden;box-shadow:0 14px 36px rgba(15,23,42,.16);z-index:4;color:#1E293B;font-family:"Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.rl-side{position:absolute;left:0;top:0;bottom:0;width:158px;background:rgba(255,255,255,.95);border-right:1px solid rgba(8,145,178,.12);padding:12px 10px}
.rl-brand{font-weight:900;color:#0E7490;font-size:15px;letter-spacing:.02em}
.rl-brand small{display:block;font-size:9.5px;color:#64748B;font-weight:600;letter-spacing:0}
.rl-tabs{display:flex;gap:3px;margin-top:10px;padding:3px;background:rgba(8,145,178,.06);border:1px solid rgba(8,145,178,.14);border-radius:10px}
.rl-tab{flex:1;text-align:center;padding:6px 2px;font-weight:700;font-size:11px;color:#64748B;border-radius:8px}
.rl-tab.on{background:#fff;color:#0891B2;box-shadow:0 2px 8px rgba(8,145,178,.14)}
.rl-nav{margin-top:10px;display:flex;flex-direction:column;gap:4px}
.rl-nav div{padding:7px 9px;border-radius:10px;font-weight:600;font-size:12px;display:flex;justify-content:space-between;align-items:center;border:1px solid transparent}
.rl-nav div.on{background:linear-gradient(135deg,rgba(8,145,178,.14),rgba(34,211,238,.10));border-color:rgba(8,145,178,.18);color:#0891B2}
.rl-nav .pill{font-size:9.5px;padding:2px 6px;border-radius:999px;background:rgba(249,115,22,.10);color:#F97316;border:1px solid rgba(249,115,22,.18);font-weight:700}
.rl-main{position:absolute;left:158px;top:0;right:0;bottom:0;padding:16px 16px;overflow:hidden}
/* placeholder Home cards */
.rl-ph{background:#fff;border-radius:12px;box-shadow:0 1px 6px rgba(15,40,70,.08);padding:14px;margin-bottom:12px}
.rl-ph b{display:block;height:12px;width:40%;background:#CBD5E1;border-radius:6px;margin-bottom:14px}
.rl-ph s{display:block;height:9px;background:#E2E8F0;border-radius:5px;margin-bottom:10px;text-decoration:none}
/* List Management */
.rl-h2{font-family:Outfit,"Nunito Sans",sans-serif;font-size:22px;font-weight:800;color:#0891B2;margin:0 0 4px}
.rl-note{font-size:13px;color:#64748B;margin:0 0 12px}
.rl-card{background:#fff;border:1px solid #E2E8F0;border-radius:12px;box-shadow:0 1px 6px rgba(15,40,70,.06);overflow:hidden}
.rl-chd{padding:11px 14px;font-weight:800;font-size:14px;color:#0F172A;border-bottom:1px solid #E2E8F0;display:flex;align-items:center;gap:8px}
.rl-ib{width:16px;height:16px;border-radius:50%;background:#E0F2FE;color:#0891B2;font-size:10.5px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;font-style:italic}
.rl-cbd{padding:12px 10px}
.rl-add{display:inline-block;background:linear-gradient(135deg,#0891B2,#0E7490);color:#fff;font-weight:800;font-size:12.5px;border-radius:9px;padding:7px 12px;box-shadow:0 6px 14px rgba(8,145,178,.22);margin-bottom:10px}
.rl-tbl{width:100%;border-collapse:collapse;font-size:11px}
.rl-tbl th{text-align:left;padding:7px 6px;background:#F8FAFC;border-bottom:2px solid #E2E8F0;font-size:10.5px}
.rl-tbl th.c,.rl-tbl td.c{text-align:center}
.rl-tbl td{padding:7px 6px;border-bottom:1px solid #EEF2F6;vertical-align:middle}
.rl-tbl td.rl-nm{font-weight:700}
.rl-tbl td.rp{font-size:10.5px;line-height:1.2}
.rl-tbl tr.rl-in{animation:rlrow .7s both}
@keyframes rlrow{from{background:#EDE9FE;opacity:0}40%{opacity:1;background:#EDE9FE}to{background:transparent;opacity:1}}
.rl-bdg{color:#fff;padding:2px 7px;border-radius:10px;font-size:10px;font-weight:700;background:#22C55E}
.rl-bdg.off{background:#94A3B8}
.rl-act{white-space:nowrap}
.rl-act span{display:inline-block;color:#fff;padding:3px 7px;border-radius:6px;font-size:10px;font-weight:700;margin-right:3px}
.rl-act .ed{background:#0891B2}.rl-act .tg{background:#F59E0B}.rl-act .tg.on{background:#22C55E}.rl-act .rm{background:#DC2626;margin-right:0}
/* the Add Recipient popup */
.rl-dim{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:12;opacity:0;pointer-events:none}
.rl-mod{position:absolute;left:216px;top:130px;width:340px;background:#fff;border-radius:14px;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.25);z-index:13;opacity:0}
.rl-mod h3{margin:0 0 14px;font-size:17px;color:#0F172A}
.rl-mod label{display:block;font-size:12px;font-weight:700;color:#64748B;margin-bottom:4px}
.rl-in2{border:1.5px solid #CBD5E1;border-radius:8px;padding:8px 10px;font-size:14px;min-height:36px;margin-bottom:12px;background:#fff;color:#0F172A}
.rl-in2.ph{color:#94A3B8}
.rl-in2.sel{position:relative;background:#F1F5F9;color:#94A3B8}
.rl-in2.sel::after{content:"▾";position:absolute;right:10px;color:#CBD5E1}
.rl-mbtns{display:flex;gap:10px;justify-content:flex-end;margin-top:4px}
.rl-mbtns span{font-weight:800;font-size:13px;border-radius:9px;padding:8px 16px}
.rl-mbtns .cn{background:#fff;border:1px solid rgba(8,145,178,.3);color:#0891B2}
.rl-mbtns .sv{background:linear-gradient(135deg,#0891B2,#0E7490);color:#fff}
/* in the sign-in popup the popup has its own buttons, so the deck draws none */
body.wn-popup [data-go=skip],body.wn-popup [data-go=close]{display:none!important}
</style></head><body>
<div id="view"><div id="stage"><div id="nbar"><i></i></div>
<div id="scenes"></div>
<div id="spot"></div>
<svg id="cursor" viewBox="0 0 28 32"><path d="M3 2 L3 26 L9.5 19.5 L14 29 L18.5 27 L14 17.5 L23 17.5 Z" fill="#fff" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/></svg>
</div></div>
<div id="cap" aria-live="polite"></div>
<div id="bar">
 <button id="prev">Back</button><button id="play">Start</button><button id="next">Next</button>
 <div id="dots"></div>
 <button id="capbtn" aria-pressed="false">Captions</button><button id="voice" aria-pressed="true">Voice on</button>
</div>
<script>
const DECK_ID='whatsnew-pip-report-list';
if(new URLSearchParams(location.search).get('src')==='popup')document.body.classList.add('wn-popup');

/* What's new mini deck for the sign-in popup: a Super Partner can now choose who
   gets the 6 AM Pacific Island Partners report (Admin, List Management, Daily Report
   Recipients). Everything is drawn in CSS; no screenshots. All names are made up. */

/* ---- small helpers ---- */
const tap=async(s,ms=850)=>{const e=typeof s==='string'?q(s):s;await move(e,ms);await click(e);return e};
function all(s){return[...document.querySelectorAll('.scene.on '+s)]}
const fadeIn=(e,ms=450)=>anim(e,[{opacity:0},{opacity:1}],ms,'ease-out').then(()=>{e.style.opacity=1});
const fadeOut=(e,ms=350)=>anim(e,[{opacity:1},{opacity:0}],ms,'ease-in').then(()=>{e.style.opacity=0});
const PTS=(items,top=150)=>`<div class="abs" style="left:790px;top:${top}px;width:440px"><ul class="pts">${items.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
const bub=async(html,x,y,ok,ms=1700)=>{const b=add(`<div class="rl-bub${ok?' ok':''}" style="left:${x}px;top:${y}px">${html}</div>`);await pop(b);await wait(ms);b.remove()};
const MADE=`<div class="rl-made" style="left:60px;top:694px">Names shown are made up.</div>`;
const SPARKS=()=>[[740,110,0],[1190,150,.8],[1210,400,1.6],[760,420,.4],[980,80,1.2]].map(p=>`<div class="pipspk" style="left:${p[0]}px;top:${p[1]}px;animation-delay:${p[2]}s">${SPARK}</div>`).join('');
const PIPART=`<div class="pipglow"></div><div class="piplogo"><img src="pip-logo.png" alt="Pacific Island Partners"></div>`;

/* ---- the dashboard window: sidebar with Main / Admin / CMS tabs, then the page ---- */
const NAV_MAIN=['Home','Interactions','Downloads','Contacts','Reports','Training Videos'];
const NAV=(tab,act)=>tab==='admin'
 ?`<div class="k-lm${act==='lm'?' on':''}">List Management</div><div class="k-el">Email Log</div>`
 :NAV_MAIN.map((n,i)=>`<div class="${i===0?'on':''}">${n}${i===0?'<span class="pill">Today</span>':''}</div>`).join('');
const SIDE=(tab,act)=>`<div class="rl-side"><div class="rl-brand">LDAH<small>Internal dashboard</small></div>
 <div class="rl-tabs"><div class="rl-tab${tab==='main'?' on':''} k-tmain">Main</div><div class="rl-tab${tab==='admin'?' on':''} k-tadmin">Admin</div><div class="rl-tab k-tcms">CMS</div></div>
 <div class="rl-nav k-nav">${NAV(tab,act)}</div></div>`;
const HOME=`<div class="rl-ph"><b></b><s></s><s style="width:80%"></s><s style="width:60%"></s></div><div class="rl-ph"><b style="width:30%"></b><s></s><s style="width:70%"></s><s style="width:85%"></s></div><div class="rl-ph"><b style="width:25%"></b><s></s><s style="width:75%"></s></div>`;
const WIN=(tab,act,body,extra='')=>`<div class="rl-win">${SIDE(tab,act)}<div class="rl-main k-main">${body}</div>${extra}</div>`;

/* ---- List Management, as a Super Partner sees it: only the Daily Report Recipients card ---- */
const PEOPLE=[['Mele Faleolo','mele@example.com'],['Rosa Camacho','rosa@example.com'],['Ana Rengiil','ana@example.com'],['Kiko Lajar','kiko@example.com']];
const TAVITA=['Tavita Sio','tavita@example.com'];
const ROW=(p,i,cls='')=>`<tr class="r${i} ${cls}"><td class="rl-nm">${p[0]}</td><td>${p[1]}</td><td class="rp">Pacific Island Partners</td><td class="c"><span class="rl-bdg">Active</span></td>
 <td class="c rl-act"><span class="ed">Edit</span><span class="tg">Pause</span><span class="rm">Remove</span></td></tr>`;
const LM=rows=>`<h3 class="rl-h2">List Management</h3><p class="rl-note">You can choose who gets the 6 AM Pacific Island Partners report.</p>
 <div class="rl-card"><div class="rl-chd">Daily Report Recipients <span class="rl-ib">i</span></div><div class="rl-cbd">
 <span class="rl-add k-add">+ Add Recipient</span>
 <table class="rl-tbl"><thead><tr><th>Name</th><th>Email</th><th>Report</th><th class="c">Active</th><th class="c">Actions</th></tr></thead>
 <tbody class="k-rows">${rows.map((p,i)=>ROW(p,i)).join('')}</tbody></table></div></div>`;
const MODAL=`<div class="rl-dim"></div><div class="rl-mod"><h3>Add Recipient</h3>
 <label>Name</label><div class="rl-in2 ph k-name">Full name</div>
 <label>Email</label><div class="rl-in2 ph k-email">email@example.com</div>
 <label>Reports</label><div class="rl-in2 sel k-rep">Pacific Island Partners Daily Report</div>
 <div class="rl-mbtns"><span class="cn">Cancel</span><span class="sv k-save">Save</span></div></div>`;

const SC=[
// ================= COVER =================
{cls:'cover',html:()=>`<div class="brand">Pacific Island Partners · What’s new</div><div class="hello">Hi <span class="nm"></span></div>
 <h1 class="rl-h"><span class="rl-new">New</span><br>Your 6 AM report list</h1><p class="sub" style="top:390px">Under 2 minutes</p>
 ${PIPART}${SPARKS()}
 <div class="gate" style="top:470px"><button class="btn" data-go="start">Play</button><button class="btn ghost" data-go="skip">Skip for now</button><label><input type="checkbox" id="voiceChk" checked> Read it out loud to me</label></div>${WAVES}`,
 steps:[{say:'Hi {name}! Here is one new thing. You can now choose who gets your 6 AM report.'}]},

// ================= 1. WHERE IT IS =================
{html:()=>HEAD('1 · Where it is','Admin, then List Management')+WIN('main','home',HOME)+PTS(['A Pacific Island Partners report goes out by email every morning at 6 AM','Now you choose who gets it','Click <b>Admin</b>','Then click <b>List Management</b>']),
 steps:[
  {say:'Every morning at 6 AM, a Pacific Island Partners report goes out by email.',li:0},
  {say:'Now you can choose who gets it.',li:1},
  {say:'At the top of the menu, click Admin.',li:2,act:async()=>{await tap('.k-tadmin');hideCursor();
    q('.k-tmain').classList.remove('on');q('.k-tadmin').classList.add('on');q('.k-nav').innerHTML=NAV('admin');spot(q('.k-nav'),6)}},
  {say:'Then click List Management.',li:3,act:async()=>{spot(null);
    if(!q('.k-tadmin').classList.contains('on')){q('.k-tmain').classList.remove('on');q('.k-tadmin').classList.add('on');q('.k-nav').innerHTML=NAV('admin')}
    const l=await tap('.k-lm');l.classList.add('on');hideCursor();const m=q('.k-main');m.innerHTML=LM(PEOPLE);await fadeIn(m,450)}}
 ]},

// ================= 2. THE LIST =================
{html:()=>HEAD('2 · Daily Report Recipients','Your list')+WIN('admin','lm',LM(PEOPLE))+MADE+PTS(['One row = one person who gets the report','Green <b>Active</b> = they get it every morning','You only see the Pacific Island Partners list. Staff lists are separate.']),
 steps:[
  {say:'This is your list. It is called Daily Report Recipients.',act:async()=>spot(q('.rl-chd'),4)},
  {say:'Each row is one person who gets the report.',li:0,act:async()=>spot(q('.k-rows'),4)},
  {say:'The green Active badge means they get it every morning.',li:1,act:async()=>spot(q('.r0 .rl-bdg'),6)},
  {say:'You only see the Pacific Island Partners list. The staff lists are separate.',li:2,act:async()=>{spot(null);await bub('Report: Pacific Island Partners',330,600,true,1900)}}
 ]},

// ================= 3. ADD SOMEONE =================
{html:()=>HEAD('3 · Add someone','+ Add Recipient')+WIN('admin','lm',LM(PEOPLE),MODAL)+MADE+PTS(['Click <b>+ Add Recipient</b>','Type their <b>Name</b> and <b>Email</b>','The report is already set for you. Click <b>Save</b>.','They get it tomorrow at 6 AM']),
 steps:[
  {say:'To add someone, click Add Recipient.',li:0,act:async()=>{await tap('.k-add');hideCursor();fadeIn(q('.rl-dim'),300);
    const m=q('.rl-mod');await anim(m,[{opacity:0,transform:'translateY(20px)'},{opacity:1,transform:'none'}],450,'ease-out');m.style.opacity=1}},
  {say:'Type their name, then their email.',li:1,act:async()=>{q('.rl-dim').style.opacity=1;q('.rl-mod').style.opacity=1;
    await tap('.k-name',650);await type(q('.k-name'),TAVITA[0],60);await tap('.k-email',600);await type(q('.k-email'),TAVITA[1],45);hideCursor()}},
  {say:'The report is already set for you. Click Save.',li:2,act:async()=>{spot(q('.k-rep'),5);await wait(1500);spot(null);
    await tap('.k-save');hideCursor();await Promise.all([fadeOut(q('.rl-mod'),300),fadeOut(q('.rl-dim'),300)]);
    q('.k-rows').insertAdjacentHTML('beforeend',ROW(TAVITA,4,'rl-in'))}},
  {say:'Tavita is on the list now, and Active. Tavita gets the report tomorrow at 6 AM.',li:3,act:async()=>{q('.rl-mod').style.opacity=0;q('.rl-dim').style.opacity=0;
    if(!q('.r4'))q('.k-rows').insertAdjacentHTML('beforeend',ROW(TAVITA,4));spot(q('.r4'),3)}}
 ]},

// ================= 4. PAUSE OR REMOVE =================
{html:()=>HEAD('4 · Pause or remove','Pause, Activate, Remove, Edit')+WIN('admin','lm',LM([...PEOPLE,TAVITA]))+MADE+PTS(['<b>Pause</b> stops the emails. They stay on the list.','<b>Activate</b> turns the emails back on','<b>Remove</b> takes them off the list','<b>Edit</b> fixes a name or email']),
 steps:[
  {say:'Is someone on leave? Click Pause. The emails stop, but the person stays on the list.',li:0,act:async()=>{const t=await tap('.r2 .tg');hideCursor();
    t.textContent='Activate';t.classList.add('on');q('.r2 .rl-bdg').textContent='Paused';q('.r2 .rl-bdg').classList.add('off');spot(q('.r2'),3)}},
  {say:'When they are back, click Activate. The emails start again.',li:1,act:async()=>{spot(null);const t=q('.r2 .tg');
    if(!t.classList.contains('on')){t.textContent='Activate';t.classList.add('on');q('.r2 .rl-bdg').textContent='Paused';q('.r2 .rl-bdg').classList.add('off')}
    await tap(t);hideCursor();t.textContent='Pause';t.classList.remove('on');q('.r2 .rl-bdg').textContent='Active';q('.r2 .rl-bdg').classList.remove('off');spot(q('.r2'),3)}},
  {say:'Remove takes a person off the list.',li:2,act:async()=>{spot(null);await move(q('.r3 .rm'),800);hideCursor();spot(q('.r3 .rm'),5)}},
  {say:'Edit fixes a name or an email.',li:3,act:async()=>{spot(null);await move(q('.r0 .ed'),800);hideCursor();spot(q('.r0 .ed'),5)}}
 ]},

// ================= WRAP UP =================
{cls:'cover',html:()=>`<div class="brand">Pacific Island Partners · What’s new</div><div class="hello">All done</div><h1>Thank you, Sandy!</h1>
 <p class="sub" style="top:300px">You can watch this again any time in Training Videos → Pacific Island Partners.</p>
 ${PIPART}
 <div class="gate" style="top:420px"><button class="btn ghost" data-go="again">Watch again</button><button class="btn" data-go="close">Close</button></div>${WAVES}`,
 steps:[{say:'Thank you, Sandy! You can watch this again any time in Training Videos, under Pacific Island Partners.',act:async()=>{await wait(400);confetti(640,300,140)}}]}
];
</script>
<script src="deck-engine.js"></script>
<script src="deck-tracker.js"></script></body></html>
