<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What’s new: PTI Report Partner filter</title>
<link rel="stylesheet" href="deck-base.css">
<!-- Same Firebase build as the dashboard, so the deck shares its sign-in and records progress. -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
/* ---------- cover: the PIP logo, floating (same as pip-feedback-emails) ---------- */
.piplogo{position:absolute;left:760px;top:120px;width:450px;padding:22px 26px 16px;background:#fff;border-radius:26px;box-shadow:0 30px 70px rgba(0,0,0,.38);z-index:3;animation:pipin 1.1s .3s cubic-bezier(.3,1.5,.5,1) both,pipfloat 9s 1.4s ease-in-out infinite}
.piplogo img{display:block;width:100%;height:auto}
.pipglow{position:absolute;left:720px;top:90px;width:530px;height:360px;border-radius:50%;background:radial-gradient(closest-side,rgba(249,168,212,.55),rgba(125,211,252,.25) 60%,transparent);z-index:2;animation:pipglow 4.5s ease-in-out infinite}
.pipspk{position:absolute;width:30px;height:30px;z-index:4;animation:twinkle 2.6s ease-in-out infinite}
@keyframes pipin{from{opacity:0;transform:translateY(-220px) rotate(-18deg) scale(.4)}to{opacity:1;transform:none}}
@keyframes pipfloat{0%,100%{transform:translate(0,0) rotate(0)}20%{transform:translate(-26px,-18px) rotate(-3deg)}45%{transform:translate(14px,-30px) rotate(2.5deg)}70%{transform:translate(26px,8px) rotate(-1.5deg)}85%{transform:translate(-10px,16px) rotate(2deg)}}
@keyframes pipglow{0%,100%{opacity:.6;transform:scale(.94)}50%{opacity:1;transform:scale(1.06)}}
.wn{display:inline-block;background:#7C3AED;color:#fff;border-radius:999px;padding:3px 12px;font-size:14px;font-weight:800;letter-spacing:.06em;margin-right:8px;vertical-align:2px}
/* ---------- Reports tiles ---------- */
.rtiles{position:absolute;left:58px;top:140px;width:716px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;transition:opacity .4s}
.rt{background:#fff;border:2px solid #CBD5E1;border-radius:12px;padding:12px 14px;font-size:11.5px;color:#475569;min-height:104px}
.rt b{display:block;font-size:15px;color:#0F172A;margin:4px 0 3px}.rt .ic{display:block;width:26px;height:26px;border-radius:7px;background:#E2E8F0}
.rt.dim{opacity:.5}.rt.pti{border-color:#0F766E}.rt.pti .ic{background:#0F766E}
/* ---------- PTI Report mock ---------- */
.ptr{position:absolute;left:58px;top:124px;width:716px;opacity:0}
.ptbar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ptbar .bk2{border:1px solid #CBD5E1;border-radius:8px;padding:5px 9px;font-size:11.5px;font-weight:700;color:#0F766E;background:#fff;white-space:nowrap}
.ptbar h3{margin:0;font-size:22px;color:#0F766E;font-weight:800;flex:1}
.ptbar .ex{background:#0F766E;color:#fff;font-weight:700;font-size:11.5px;border-radius:6px;padding:6px 11px}
.pcard{background:#fff;border-radius:12px;box-shadow:0 4px 14px rgba(15,23,42,.08);padding:10px 12px;margin-bottom:8px}
.pctl{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-end}
.plb{display:block;font-size:9.5px;font-weight:800;color:#64748B;text-transform:uppercase;margin-bottom:3px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg span{border:1px solid #CBD5E1;border-radius:6px;padding:5px 9px;font-size:12px;font-weight:700;color:#334155;background:#fff;white-space:nowrap;transition:background .25s,color .25s}
.seg span.on{background:#7C3AED;color:#fff;border-color:#7C3AED}
.seg span.lock{background:#7C3AED;color:#fff;border-color:#7C3AED;opacity:.9}
.dt{border:1px solid #CBD5E1;border-radius:6px;padding:5px 8px;font-size:12px;color:#0F172A}
.phead .t{font-size:16px;font-weight:800;color:#0B3A53}
.phead .g{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:11.5px;margin:5px 0}
.phead .g small{display:block;font-size:9px;font-weight:800;color:#64748B;text-transform:uppercase}
.sline{background:#F5F3FF;border-left:4px solid #7C3AED;border-radius:6px;padding:6px 9px;font-size:11.5px;color:#3B0764;line-height:1.35}
.sline b.isl{background:#FDE68A;border-radius:4px;padding:0 3px}
.secs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sec{background:#fff;border-radius:12px;box-shadow:0 4px 14px rgba(15,23,42,.08);padding:9px 11px;border-top:3px solid #7C3AED}
.sec b{display:block;font-size:26px;line-height:1.1;color:#0F172A}.sec span{font-size:11px;color:#64748B;font-weight:700}
.sec.flash{animation:popn .6s}
.pfoot{font-size:11px;color:#64748B;margin-top:8px}
/* ---------- scene 3: where the island is named ---------- */
.named{position:absolute;left:70px;top:150px;width:1140px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.nc{background:#fff;border-radius:16px;box-shadow:0 10px 26px rgba(15,23,42,.1);padding:16px 18px 18px;border-top:8px solid #7C3AED;opacity:0;min-height:220px}
.nc i{display:flex;width:44px;height:44px;border-radius:50%;background:#7C3AED;color:#fff;font-style:normal;font-weight:900;font-size:21px;align-items:center;justify-content:center;margin-bottom:10px}
.nc h4{margin:0 0 12px;font-size:23px;color:#0B3A53}
.nc .mock{border:1px solid #E2E8F0;border-radius:10px;background:#F8FAFC;padding:10px 12px;font-size:14px;line-height:1.45;color:#334155}
.nc .mock mark{background:#FDE68A;color:#0F172A;font-weight:800;border-radius:4px;padding:0 3px}
.nc.c2{border-top-color:#DB2777}.nc.c2 i{background:#DB2777}
.nc.c3{border-top-color:#0F766E}.nc.c3 i{background:#0F766E}
.tabm{display:flex;align-items:center;gap:8px;background:#E2E8F0;border-radius:8px 8px 0 0;padding:6px 10px;font-size:12.5px;font-weight:700;color:#0F172A}
.tabm::before{content:"";width:14px;height:14px;border-radius:3px;background:#0F766E;flex:none}
.fnm{border:1px solid #CBD5E1;border-top:0;border-radius:0 0 8px 8px;background:#fff;padding:8px 10px;font-size:13px}
.fnm small{display:block;font-size:10px;font-weight:800;color:#64748B;text-transform:uppercase}
.bigchip{position:absolute;left:0;right:0;top:450px;text-align:center;opacity:0}
.bigchip span{display:inline-block;background:#7C3AED;color:#fff;font-size:40px;font-weight:900;border-radius:999px;padding:12px 38px;box-shadow:0 16px 36px rgba(124,58,237,.35)}
/* ---------- scene 4: opens on All partners, loads fast ---------- */
.two{position:absolute;left:70px;top:150px;width:1140px;display:grid;grid-template-columns:1fr 1fr;gap:28px}
.pan{background:#fff;border-radius:18px;box-shadow:0 12px 30px rgba(15,23,42,.1);padding:20px 22px;min-height:330px;opacity:0;position:relative}
.pan h4{margin:0 0 6px;font-size:26px;color:#0B3A53}
.pan p{margin:0 0 16px;font-size:18px;color:#475569;line-height:1.4}
.pan .seg span{font-size:15px;padding:7px 12px}
.why{margin-top:22px;background:#FEF3C7;border-left:5px solid #F59E0B;border-radius:8px;padding:12px 14px;font-size:18px;font-weight:700;color:#78350F;opacity:0}
.spin{display:flex;align-items:center;gap:14px;border:1px solid #E2E8F0;border-radius:12px;padding:20px;font-size:19px;color:#0F172A;background:#F8FAFC}
.spin i{width:30px;height:30px;border:4px solid #CCFBF1;border-top-color:#0F766E;border-radius:50%;flex:none;animation:spinr .8s linear infinite}
@keyframes spinr{to{transform:rotate(360deg)}}
.spin.ok i{animation:none;border-color:#16A34A;background:#16A34A}
.clock{margin-top:22px;display:flex;align-items:baseline;gap:10px;font-size:20px;font-weight:800;color:#0F766E;opacity:0}
.clock b{font-size:52px;line-height:1}
/* ---------- wrap-up cover ---------- */
.wrapl{position:absolute;left:70px;top:290px;width:620px;margin:0;padding:0;list-style:none}
.wrapl li{font-size:21px;line-height:1.35;margin-bottom:10px;padding-left:34px;position:relative;animation:rise .6s both}
.wrapl li::before{content:"";position:absolute;left:0;top:5px;width:20px;height:20px;border-radius:6px;background:#F9A8D4}
</style></head><body>
<div id="view"><div id="stage"><div id="nbar"><i></i></div>
<div id="scenes"></div>
<div id="spot"></div>
<svg id="cursor" viewBox="0 0 28 32"><path d="M3 2 L3 26 L9.5 19.5 L14 29 L18.5 27 L14 17.5 L23 17.5 Z" fill="#fff" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/></svg>
</div></div>
<div id="cap" aria-live="polite"></div>
<div id="bar">
 <button id="prev">Back</button><button id="play">Start</button><button id="next">Next</button>
 <div id="dots"></div>
 <button id="capbtn" aria-pressed="false">Captions</button><button id="voice" aria-pressed="true">Voice on</button>
</div>
<script>
const DECK_ID='whatsnew-pti-partner-filter';

/* A short "What's new" for Super Partners, played inside the sign-in popup.
   The popup draws its own "Got it" and "Remind me later", so this deck has no
   Skip, no Close and no quiz. Screens are drawn from the live code (Int v151.70
   Partner filter, v151.72 loading): _pbRenderControls, pbSetPartner,
   _pbScopeTag, _pbHeaderHtml. Every figure is made up. */

/* ---- small helpers ---- */
const tap=async(s,ms=850)=>{const e=typeof s==='string'?q(s):s;await move(e,ms);await click(e);return e};
function all(s){return[...document.querySelectorAll('.scene.on '+s)]}
const show=(e,ms=500)=>anim(e,[{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],ms,'ease-out');

/* Same order as PARTNER_ISLANDS_LIST, with All partners first. */
const ISL=['American Samoa','Guam','CNMI','Micronesia','Marshall Islands','Palau'];
const PERIOD='Jul 1 – Sep 30, 2026';
/* Made-up figures: all partners, then Guam only. */
const FIG=[['Training sessions',24,6],['People trained',310,72],['Individual help',58,14],['Case advocacy',11,3]];

const SCOPE=isl=>'<b>Scope:</b> Pacific partner (PIP) records only.'+(isl?` <b class="isl">${isl} only;</b> the other partner islands are left out.`:'')+' Every figure below is partner work only.';
const PTR=()=>`<div class="ptr">
 <div class="ptbar"><span class="bk2">← Back to Reports</span><h3>PTI Report</h3><span class="ex">Export PDF…</span></div>
 <div class="pcard pctl">
  <div><span class="plb">Showing</span><div class="seg"><span class="lock k-pip">PIP only</span></div></div>
  <div class="k-prow"><span class="plb">Partner</span><div class="seg">${['All partners',...ISL].map((p,i)=>`<span class="${i?'':'on'}" data-p="${p}">${p}</span>`).join('')}</div></div>
  <div><span class="plb">From</span><div class="dt">07/01/2026</div></div>
  <div><span class="plb">To</span><div class="dt">09/30/2026</div></div>
 </div>
 <div class="pcard phead"><div class="t">PTI Report</div>
  <div class="g"><div><small>Reporting period</small>${PERIOD}</div><div><small>Prepared by</small>Pat Example</div></div>
  <div class="sline k-scope">${SCOPE('')}</div></div>
 <div class="secs">${FIG.map(f=>`<div class="sec"><b>${f[1]}</b><span>${f[0]}</span></div>`).join('')}</div>
 <div class="pfoot k-foot">Read-only report. Figures for ${PERIOD} (<b>PIP only</b>).</div>
</div>`;
const RTILES=()=>`<div class="rtiles">${['Event Attendance','Feedback','Interactions','Staff Training','Training Deck Report','PTI Report'].map(t=>`<div class="rt ${t==='PTI Report'?'pti':'dim'}"><span class="ic"></span><b>${t}</b>${t==='PTI Report'?'The board document for any date range.':''}</div>`).join('')}</div>`;

const SC=[
// ================= COVER =================
{cls:'cover',html:()=>`<div class="brand"><span class="wn">NEW</span>Pacific Island Partners · What’s new</div><div class="hello">Hi <span class="nm"></span></div>
 <h1>PTI Report: pick one island</h1><p class="sub">The PTI Report now has a Partner filter. About one minute.</p>
 <div class="pipglow"></div><div class="piplogo"><img src="pip-logo.png" alt="Pacific Island Partners"></div>
 ${[[740,110,0],[1190,150,.8],[1210,400,1.6],[760,420,.4],[980,80,1.2]].map(p=>`<div class="pipspk" style="left:${p[0]}px;top:${p[1]}px;animation-delay:${p[2]}s">${SPARK}</div>`).join('')}
 <div class="gate"><button class="btn" data-go="start">Show me</button><label><input type="checkbox" id="voiceChk" checked> Read it out loud to me</label></div>${WAVES}`,
 steps:[{say:'Hi {name}! Here is what is new in the PTI Report. You can now look at one partner island at a time. This takes about one minute.'}]},

// ================= THE PARTNER ROW =================
{html:()=>HEAD('Reports → PTI Report','The new Partner row')+RTILES()+PTR()+`<div class="abs" style="left:800px;top:150px;width:420px"><ul class="pts"><li>Reports → the <b>PTI Report</b> tile.</li><li>Your report is always <b>PIP only</b>.</li><li>New: a <b>Partner</b> row. All partners, or one island.</li><li>Pick an island and <b>every section</b> narrows to it.</li></ul></div>`,
 steps:[{say:'Go to Reports, and click the PTI Report tile.',li:0,act:async()=>{await tap('.rt.pti');hideCursor();q('.rtiles').style.opacity=0;await wait(300);q('.rtiles').remove();await show(q('.ptr'))}},
 {say:'As a Super Partner, your report always shows PIP only.',li:1,act:async()=>spot(q('.k-pip'),6)},
 {say:'Under it is the new Partner row. All partners, then one button for each island.',li:2,act:async()=>spot(q('.k-prow'),6)},
 {say:'Click Guam. Every section now counts Guam only.',li:3,act:async()=>{spot(null);const g=q('[data-p="Guam"]');await tap(g,800);hideCursor();
   all('.k-prow .seg span').forEach(s=>s.classList.toggle('on',s===g));
   q('.k-scope').innerHTML=SCOPE('Guam');q('.k-foot').innerHTML=`Read-only report. Figures for ${PERIOD} (<b>PIP only · Guam</b>).`;
   const secs=all('.sec');await Promise.all(secs.map((s,i)=>{s.classList.add('flash');return countTo(s.querySelector('b'),FIG[i][2],'',900)}));spot(q('.secs'),6)}}]},

// ================= IT ALWAYS SAYS WHICH ISLAND =================
{html:()=>HEAD('Always labelled','It always says which island')+`<div class="named">
 <div class="nc"><i>1</i><h4>The scope line at the top</h4><div class="mock">Scope: Pacific partner (PIP) records only. <mark>Guam only;</mark> the other partner islands are left out.</div></div>
 <div class="nc c2"><i>2</i><h4>The footer</h4><div class="mock">Read-only report. Figures for ${PERIOD} (<mark>PIP only · Guam</mark>).</div></div>
 <div class="nc c3"><i>3</i><h4>The PDF title</h4><div class="tabm">PTI Report — ${PERIOD} — PIP only · Guam</div><div class="fnm"><small>Saved as</small>PTI Report — ${PERIOD} — <mark style="background:#FDE68A;font-weight:800">PIP only · Guam</mark>.pdf</div></div>
</div><div class="bigchip"><span>PIP only · Guam</span></div>`,
 steps:[{say:'The report always tells you which island you are looking at.',act:async()=>{const c=all('.nc');await show(c[0])}},
 {say:'The scope line at the top says Guam only.',act:async()=>spot(all('.nc')[0],6)},
 {say:'The footer says PIP only, Guam.',act:async()=>{spot(null);await show(all('.nc')[1]);spot(all('.nc')[1],6)}},
 {say:'So does the PDF title, so the saved file has the island in its name too.',act:async()=>{spot(null);await show(all('.nc')[2]);spot(all('.nc')[2],6);await wait(900);spot(null);await show(q('.bigchip'))}}]},

// ================= OPENS ON ALL PARTNERS, LOADS FAST =================
{html:()=>HEAD('Good to know','Opens on All partners, and it’s quick')+`<div class="two">
 <div class="pan p1"><h4>Every time you open it</h4><p>The Partner row starts on <b>All partners</b>. Your last island is not remembered.</p>
  <div class="seg">${['All partners',...ISL].map((p,i)=>`<span class="${i?'':'on'}">${p}</span>`).join('')}</div>
  <div class="why">So nobody reads one island’s numbers thinking they are the whole program.</div></div>
 <div class="pan p2"><h4>A few seconds to load</h4><p>A spinner and a running count show it working.</p>
  <div class="spin"><i></i><span class="k-cnt">Reading sign-ups: 0 of 240 events…</span></div>
  <div class="clock"><b>3</b> seconds or so</div></div>
</div>`,
 steps:[{say:'When you open the report again, it starts on All partners. That way, nobody reads one island’s numbers thinking they are the whole program.',act:async()=>{const p=q('.p1');await show(p);spot(q('.p1 .seg span.on'),6);await wait(1400);spot(null);await show(q('.why'))}},
 {say:'It also loads in a few seconds now. You see a spinner and a running count while it reads.',act:async()=>{await show(q('.p2'));const c=q('.k-cnt');for(let n=30;n<=240;n+=30){await wait(380);c.textContent=n<240?`Reading sign-ups: ${n} of 240 events…`:'Reading interactions and contacts…'}await wait(500);q('.spin').classList.add('ok');c.textContent='Ready';await show(q('.clock'))}}]},

// ================= WRAP-UP =================
{cls:'cover',html:()=>`<div class="brand"><span class="wn">NEW</span>PTI Report · Partner filter</div><div class="hello">All done</div><h1 style="font-size:50px;white-space:nowrap">Thank you<span class="nmc"></span>!</h1>
 <ul class="wrapl"><li style="animation-delay:.3s">Reports → <b>PTI Report</b>.</li><li style="animation-delay:.45s">Pick an island in the <b>Partner</b> row, or leave it on All partners.</li><li style="animation-delay:.6s">The scope line, footer and PDF title name the island.</li><li style="animation-delay:.75s">It always opens on All partners.</li></ul>
 <div class="pipglow"></div><div class="piplogo"><img src="pip-logo.png" alt="Pacific Island Partners"></div>
 <div class="gate" style="top:490px"><button class="btn ghost" data-go="again">Watch again</button></div>${WAVES}`,
 steps:[{say:'That’s it, {name}. Open Reports, then the PTI Report. Pick an island in the Partner row, or leave it on All partners. The scope line at the top always tells you which island you are reading.',act:async()=>{await wait(400);confetti(640,300,160)}}]}
];
</script>
<script src="deck-engine.js"></script>
<script src="deck-tracker.js"></script></body></html>
