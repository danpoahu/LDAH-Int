<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What’s New: The PTI Report — Training</title>
<link rel="stylesheet" href="deck-base.css">
<!-- Same Firebase build as the dashboard, so the deck shares its sign-in and records progress. -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
/* Every class here starts with pt- so nothing collides with deck-base.css. */
/* ---------- the dashboard window ---------- */
.pt-win{position:absolute;left:58px;top:118px;width:712px;height:570px;background:#F4F6F9;border:1px solid #D5DEE8;border-radius:12px;overflow:hidden;box-shadow:0 14px 36px rgba(15,23,42,.16);z-index:4;font-family:"Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:#1E293B}
.pt-vp{position:absolute;inset:0;overflow:hidden}
.pt-in{position:relative;padding:12px 14px 30px}
.pt-top{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.pt-back{font-size:11.5px;font-weight:700;color:#475569;border:1px solid #CBD5E1;border-radius:6px;padding:4px 8px;background:#fff;white-space:nowrap}
.pt-top h3{margin:0;flex:1;font-size:21px;color:#0F766E;font-weight:800}
.pt-exp{font-size:11.5px;font-weight:700;color:#fff;background:#0F766E;border-radius:6px;padding:5px 11px;white-space:nowrap}
.pt-gen{font-size:10.5px;color:#64748B;white-space:nowrap}
.pt-card{background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(15,40,70,.08);padding:10px 12px;margin-bottom:9px}
/* controls */
.pt-ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.pt-lbl{display:block;font-size:9.5px;font-weight:800;color:#64748B;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.pt-seg{display:flex;border:1px solid #CBD5E1;border-radius:6px;overflow:hidden;background:#fff}
.pt-seg span{font-size:11.5px;font-weight:700;padding:5px 10px;color:#475569;white-space:nowrap;transition:background .3s,color .3s}
.pt-seg span+span{border-left:1px solid #E2E8F0}
.pt-seg span.on{background:#0F766E;color:#fff}
.pt-seg span.hi{background:#0891B2;color:#fff}
.pt-date{font-size:11.5px;border:1px solid #CBD5E1;border-radius:6px;padding:4px 7px;background:#fff;white-space:nowrap;transition:background .4s}
.pt-date.flash{background:#FEF3C7}
.pt-selq{font-size:11.5px;border:1px solid #CBD5E1;border-radius:6px;padding:4px 22px 4px 7px;background:#fff;position:relative;white-space:nowrap}
.pt-selq::after{content:"▾";position:absolute;right:6px;top:3px;color:#64748B}
.pt-gh{font-size:11.5px;font-weight:700;color:#334155;border:1px solid #CBD5E1;border-radius:6px;padding:4px 9px;background:#fff;white-space:nowrap}
.pt-dd{position:absolute;background:#fff;border:1px solid #CBD5E1;border-radius:6px;box-shadow:0 12px 26px rgba(15,23,42,.2);z-index:30;font-size:12px;padding:3px 0;min-width:200px}
.pt-dd div{padding:5px 10px;transition:background .2s}
.pt-dd div.hi{background:#0891B2;color:#fff}
/* report body */
.pt-head{border-top:4px solid #0F766E}
.pt-ht{font-size:16px;font-weight:800;color:#0F766E}
.pt-hg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.pt-hg b{display:block;font-size:12px}
.pt-sub{font-size:11.5px;color:#475569;line-height:1.45}
.pt-sec{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:800;color:#0F766E;padding:7px 12px}
.pt-sec small{font-weight:600;color:#64748B;font-size:11px}
.pt-h{font-size:13px;font-weight:800;color:#0F766E;margin:0 0 5px}
.pt-h small{font-weight:600;color:#64748B;font-size:11px;margin-left:5px}
.pt-tbl{width:100%;border-collapse:collapse;font-size:11px}
.pt-tbl th,.pt-tbl td{padding:3px 5px;border-bottom:1px solid #EEF2F6;text-align:left}
.pt-tbl th{color:#64748B;font-size:9.5px;text-transform:uppercase;letter-spacing:.03em}
.pt-tbl .n{text-align:right;font-weight:700}
.pt-note{font-size:10.5px;color:#64748B;margin-top:4px;line-height:1.4}
.pt-tag{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border-radius:5px;padding:1px 6px;white-space:nowrap}
.pt-auto{background:#DCFCE7;color:#15803D}.pt-part{background:#FEF3C7;color:#B45309}.pt-type{background:#EDE9FE;color:#6D28D9}.pt-newf{background:#FCE7F3;color:#BE185D}
.pt-box{display:inline-block;width:62px;height:21px;text-align:right;padding:2px 6px;border:1.5px dashed #8B5CF6;border-radius:6px;background:#F5F3FF;font-weight:700;color:#5B21B6;font-size:11px;vertical-align:middle}
.pt-box.typing::after{content:"|";color:#6D28D9;animation:blink .6s steps(1) infinite}
.pt-bp{font-size:11px;font-weight:700;color:#fff;background:#6D28D9;border-radius:6px;padding:5px 10px;white-space:nowrap;display:inline-block}
.pt-bt{font-size:11px;font-weight:700;color:#fff;background:#0F766E;border-radius:6px;padding:5px 10px;white-space:nowrap;display:inline-block}
.pt-bg{font-size:11px;font-weight:700;color:#334155;border:1px solid #CBD5E1;background:#fff;border-radius:6px;padding:4px 9px;white-space:nowrap;display:inline-block}
.pt-btns{display:flex;gap:6px;flex-wrap:wrap}
.pt-saved{font-size:10.5px;color:#64748B;margin-top:5px;transition:color .3s}
.pt-saved.ok{color:#15803D;font-weight:700}
/* loading */
.pt-load{display:flex;align-items:center;justify-content:center;gap:12px;padding:22px;font-size:13px}
.pt-spin{width:22px;height:22px;border:3px solid #CCFBF1;border-top-color:#0F766E;border-radius:50%;flex:none;animation:rot .8s linear infinite}
/* reports grid */
.pt-side{position:absolute;left:0;top:0;bottom:0;width:150px;background:#fff;border-right:1px solid #E2E8F0;padding:14px 10px}
.pt-side div{font-size:12.5px;padding:6px 9px;border-radius:6px;color:#334155;margin-bottom:2px}
.pt-side div.act{background:#E0F2FE;color:#0E6E8C;font-weight:700}
.pt-grid{position:absolute;left:150px;right:0;top:0;bottom:0;padding:16px 16px}
.pt-grid h4{margin:0 0 10px;font-size:19px;color:#1E293B}
.pt-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pt-tile{background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(15,40,70,.08);padding:12px;border:2px solid transparent;height:104px}
.pt-tile b{display:block;font-size:13px;margin-bottom:3px}
.pt-tile span{font-size:10.5px;color:#64748B;line-height:1.35;display:block}
.pt-tile i{display:block;width:22px;height:22px;border-radius:6px;background:#E0F2FE;margin-bottom:6px}
.pt-tile.pti{border-color:#0F766E}.pt-tile.pti i{background:#CCFBF1}
/* spreadsheet */
.pt-xl{position:absolute;background:#fff;border:1px solid #CBD5E1;border-radius:8px;box-shadow:0 16px 34px rgba(15,23,42,.22);overflow:hidden;z-index:12;font-size:11.5px}
.pt-xlh{background:#1E7145;color:#fff;font-weight:700;padding:6px 10px;font-size:11.5px}
.pt-xl table{border-collapse:collapse;width:100%}
.pt-xl td{border:1px solid #E2E8F0;padding:3px 7px;height:21px}
.pt-xl td.rn{width:26px;background:#F1F5F9;color:#64748B;text-align:center;font-size:10px}
.pt-xlt{display:flex;gap:2px;background:#F1F5F9;padding:4px 6px 0}
.pt-xlt span{padding:3px 12px;font-weight:700;color:#475569;border-radius:5px 5px 0 0;transition:background .3s}
.pt-xlt span.on{background:#fff;color:#1E7145}
/* PDF options */
.pt-opt td{text-align:center}.pt-opt td:first-child{text-align:left}
.pt-rad{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid #94A3B8;vertical-align:middle}
.pt-rad.on{border-color:#0F766E;background:#0F766E;box-shadow:inset 0 0 0 2px #fff}
/* right-hand notes + compare cards */
.pt-note2{position:absolute;background:#FEF3C7;border-left:6px solid #F59E0B;border-radius:12px;padding:11px 16px;font-size:17px;line-height:1.4;color:#0F172A;opacity:0}
.pt-note2.pu{background:#F5F3FF;border-left-color:#7C3AED}
.pt-note2.gr{background:#ECFDF5;border-left-color:#16A34A}
.pt-cmp{position:absolute;left:790px;width:440px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pt-cc{background:#fff;border-radius:14px;box-shadow:0 8px 22px rgba(15,23,42,.1);padding:11px 13px;font-size:15px;line-height:1.4;opacity:0;border-top:6px solid #0891B2}
.pt-cc h4{margin:0 0 5px;font-size:17px;color:#0369A1}
.pt-cc.or{border-top-color:#F59E0B}.pt-cc.or h4{color:#B45309}
.pt-key{position:absolute;background:#fff;border-radius:14px;box-shadow:0 8px 22px rgba(15,23,42,.1);padding:12px 16px;font-size:15.5px;line-height:1.35;opacity:0}
.pt-key div{margin-bottom:8px;display:flex;align-items:flex-start}.pt-key div:last-child{margin:0}
.pt-key .pt-tag{flex:none;font-size:12px;width:92px;text-align:center;padding:4px 0;margin-right:10px;vertical-align:middle}
/* cover art */
.pt-cvw{position:absolute;left:790px;top:110px;width:420px;background:#fff;border-radius:14px;box-shadow:0 24px 50px rgba(0,0,0,.35);padding:14px 16px;color:#1E293B;transform:rotate(3deg);animation:bob 6s ease-in-out infinite;z-index:3}
.pt-cvw .pt-tbl{font-size:12px}
.pt-cvs{position:absolute;left:860px;top:440px;width:300px;background:#fff;border-radius:12px;box-shadow:0 20px 40px rgba(0,0,0,.3);padding:12px 14px;color:#1E293B;transform:rotate(-5deg);animation:bob 5s 1s ease-in-out infinite;z-index:4}
</style></head><body>
<div id="view"><div id="stage"><div id="nbar"><i></i></div>
<div id="scenes"></div>
<div id="spot"></div>
<svg id="cursor" viewBox="0 0 28 32"><path d="M3 2 L3 26 L9.5 19.5 L14 29 L18.5 27 L14 17.5 L23 17.5 Z" fill="#fff" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/></svg>
</div></div>
<div id="cap" aria-live="polite"></div>
<div id="bar">
 <button id="prev">Back</button><button id="play">Start</button><button id="next">Next</button>
 <div id="dots"></div>
 <button id="capbtn" aria-pressed="false">Captions</button><button id="voice" aria-pressed="true">Voice on</button>
</div>
<script>
const DECK_ID='whatsnew-pti-report-update';

/* What's new mini deck. It plays inside the sign-in popup, so it is short and mostly summary.
   The mocks are the full deck's (pti-report-parent-center-data.html). Every figure is made
   up; no person appears. The popup supplies See the full training / Got it / Remind me
   later, so this deck draws none of those. */

/* ---- small helpers ---- */
const tap=async(s,ms=850)=>{const e=typeof s==='string'?q(s):s;await move(e,ms);await click(e);return e};
function all(s){return[...document.querySelectorAll('.scene.on '+s)]}
const show=(e,ms=500)=>anim(e,[{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],ms,'ease-out').then(()=>{e.style.opacity=1});
const PTS=(items,top=140)=>`<div class="abs" style="left:790px;top:${top}px;width:440px"><ul class="pts">${items.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
async function scrollTo(target,ms=800){const inr=q('.pt-in');const vp=inr.parentElement;const max=Math.max(0,inr.scrollHeight-vp.clientHeight);
 let y=target==='bottom'?max:target&&target.nodeType?(target.getBoundingClientRect().top-inr.getBoundingClientRect().top)/scale-12:(target||0);y=Math.max(0,Math.min(y,max));
 const from=+inr.dataset.y||0;await anim(inr,[{transform:`translateY(${-from}px)`},{transform:`translateY(${-y}px)`}],ms,'ease-in-out');inr.dataset.y=y}

/* ---- dates, the way _pbRangeLabel spells them ---- */
const Q3={from:'07/01/2026',to:'09/30/2026',label:'July 1, 2026 – September 30, 2026'};
const PY={from:'10/01/2025',to:'09/30/2026',label:'October 1, 2025 – September 30, 2026'};
const LM={from:'09/01/2026',to:'09/30/2026',label:'September 1, 2026 – September 30, 2026'};

/* ---- the report window: title row, controls, body ---- */
const TOP=()=>`<div class="pt-top"><span class="pt-back">← Back to Reports</span><h3>PTI Report</h3><span class="pt-exp k-exp">Export PDF…</span><span class="pt-gen">Generated 10/1/2026, 9:12 AM</span></div>`;
const CTL=(v,d)=>`<div class="pt-card"><div class="pt-ctl">
 <div><span class="pt-lbl">Report</span><div class="pt-seg"><span class="k-vb${v==='board'?' on':''}">Board Report</span><span class="k-vc${v==='cpir'?' on':''}">Parent Center Data Collection</span></div></div>
 <div class="k-hpti" style="${v==='cpir'?'':'display:none'}"><span class="pt-lbl">Showing</span><div class="pt-seg"><span class="hi">Hawaii PTI only</span></div></div>
 <div><span class="pt-lbl">From</span><div class="pt-date k-from">${d.from}</div></div>
 <div><span class="pt-lbl">To</span><div class="pt-date k-to">${d.to}</div></div>
 <div><span class="pt-lbl">Quick range</span><div class="pt-selq k-qr">Choose…</div></div>
 <div><span class="pt-lbl"> </span><span class="pt-gh k-regen">Regenerate</span></div>
 <div><span class="pt-lbl"> </span><span class="pt-gh k-reread">↻ Re-read data</span></div>
 <div><span class="pt-lbl"> </span><span class="pt-gh">+ Create summary tasks</span></div></div></div>`;
const BSEC=['Education & Training Activities','Individual Assistance (Tier 1)','Participant Demographics','Resource Dissemination','New Interactions','New Case Advocacy','Upcoming Events'];
const BOARD=d=>`<div class="pt-card pt-head"><div class="pt-ht">PTI Report</div><div class="pt-hg">
 <div><span class="pt-lbl">Program Name</span><b>Hawaii PTI</b></div><div><span class="pt-lbl">Reporting Period</span><b class="k-period">${d.label}</b></div>
 <div><span class="pt-lbl">Prepared By</span><b>You</b></div><div><span class="pt-lbl">Date of Submission</span><b>Oct 1, 2026</b></div></div></div>
 ${BSEC.map((s,i)=>`<div class="pt-card pt-sec"><span>${i+1}. ${s}</span><small>▸</small></div>`).join('')}`;
const LOADING=n=>`<div class="pt-card pt-load"><span class="pt-spin"></span><span class="k-ld">${n}</span></div>`;
const WIN=(body,o={})=>`<div class="pt-win"${o.style?` style="${o.style}"`:''}><div class="pt-vp"><div class="pt-in" data-y="0">${TOP()}${CTL(o.v||'board',o.d||Q3)}<div class="k-body">${body}</div></div></div></div>`;

/* ---- Parent Center Data Collection body ---- */
const TAG=k=>`<span class="pt-tag pt-${k}">${{auto:'Auto',part:'Partly',type:'Type in',newf:'New field'}[k]}</span>`;
const CHEAD=()=>`<div class="pt-card"><div class="pt-ht">Parent Center Data Collection — Part 1</div>
 <div class="pt-sub">${PY.label} · <b>Hawaii PTI only</b>. Transition age is <b>14 and over</b>. Section numbers match the CPIR worksheet, so each box can be copied into the online form.</div>
 <div class="pt-sub k-tags" style="margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">${TAG('auto')} counted ${TAG('part')} counted, split approximately ${TAG('type')} typed once and saved ${TAG('newf')} needs a new question on a form</div>
 <div class="pt-btns" style="margin-top:7px"><span class="pt-bp k-save">Save typed figures</span><span class="pt-bg k-csv">Export CSV</span><span class="pt-bg k-print">Print / PDF</span></div>
 <div class="pt-saved k-saved">Typed figures for this date range have not been saved yet.</div></div>`;
const AUD=[['Parents of children under transition age',48,21,'part'],['Parents of transition-age youth and older',12,6,'part'],['Professionals / others',17,9,'auto'],['Students under transition age',0,0,'auto'],['Youth and young adults of transition age and older',3,2,'auto']];
const IA=()=>`<div class="pt-card k-ia"><div class="pt-h">I.A  Trainings <small>118 attendees</small></div><table class="pt-tbl"><tr><th>Number of … attending</th><th class="n">In-person</th><th class="n">Virtual</th><th></th></tr>
 ${AUD.map(a=>`<tr><td>${a[0]}</td><td class="n">${a[1]}</td><td class="n">${a[2]}</td><td>${TAG(a[3])}</td></tr>`).join('')}</table>
 <div class="pt-note">Tier 2 and Tier 3 sessions in the period. Each person counts once per session.</div></div>`;
const IB=()=>`<div class="pt-card k-ib"><div class="pt-h">I.B  Individual assistance contacts <small>204 contacts</small></div><table class="pt-tbl"><tr><th>Reached through</th><th class="n">Parents &lt; TA</th><th class="n">Parents TA+</th><th class="n">Prof. / other</th><th></th></tr>
 <tr><td>Phone calls</td><td class="n">96</td><td class="n">14</td><td class="n">11</td><td>${TAG('auto')}</td></tr>
 <tr class="k-letter"><td>Letters</td><td class="n"><span class="pt-box k-box1"></span></td><td class="n"><span class="pt-box"></span></td><td class="n"><span class="pt-box"></span></td><td>${TAG('type')}</td></tr>
 <tr><td>Emails / texts / other electronic</td><td class="n">41</td><td class="n">6</td><td class="n">9</td><td>${TAG('auto')}</td></tr>
 <tr><td>In-person meetings</td><td class="n">19</td><td class="n">5</td><td class="n">3</td><td>${TAG('auto')}</td></tr></table>
 <div class="pt-note">Tier 1 interactions in the period, placed by the contact’s type and their children’s ages.</div></div>`;
const II=()=>`<div class="pt-card k-ii"><div class="pt-h">II  Unduplicated number served</div><table class="pt-tbl">
 <tr><td>Parents of children under transition age</td><td class="n">131</td><td>${TAG('auto')}</td></tr><tr><td>Parents of transition-age youth and older</td><td class="n">27</td><td>${TAG('auto')}</td></tr><tr><td>Youth and young adults</td><td class="n">5</td><td>${TAG('auto')}</td></tr></table>
 <div class="pt-note">Each person once. Only people with a real phone number or email count.</div></div>`;
const III=()=>`<div class="pt-card k-iii"><div class="pt-h">III.A–D  Demographics</div><table class="pt-tbl"><tr><th>Section</th><th>What it counts</th></tr>
 <tr><td>III.A</td><td>Federal disability categories (17 rows)</td></tr><tr><td>III.B</td><td>Ages, birth to transition age and older</td></tr><tr><td>III.C</td><td>Ethnicity and race</td></tr><tr><td>III.D</td><td>Primary language spoken by parents ${TAG('newf')}</td></tr></table>
 <div class="pt-note">Four columns each: individual assistance and training, under transition age and transition age and older.</div></div>`;
const IV=()=>`<div class="pt-card k-iv"><div class="pt-h">IV.A  Meetings attended to support parents <small>23 school meetings logged</small></div><table class="pt-tbl">
 <tr><td>IFSP / IEP / 504 meetings</td><td class="n"><span class="pt-box"></span></td><td>${TAG('newf')}</td></tr><tr><td>Transition IEP meetings</td><td class="n"><span class="pt-box"></span></td><td>${TAG('newf')}</td></tr><tr><td>… and seven more meeting types</td><td></td><td></td></tr></table>
 <div class="pt-h" style="margin-top:8px">IV.B  Collaborations for improving systems</div><table class="pt-tbl"><tr><td>Local, state and national systems meetings</td><td class="n"><span class="pt-box"></span></td><td>${TAG('type')}</td></tr></table></div>`;
const V=()=>`<div class="pt-card k-v"><div class="pt-h">V  Outreach and dissemination</div><table class="pt-tbl">
 <tr><td>Newsletters, social media reach, website page views, media events</td><td class="n"><span class="pt-box"></span></td><td>${TAG('type')}</td></tr>
 <tr><td>Exhibits and resource fairs — materials disseminated</td><td class="n">640</td><td>${TAG('auto')}</td></tr><tr><td>Exhibits and resource fairs — events attended</td><td class="n">9</td><td>${TAG('auto')}</td></tr></table></div>`;
const P2=()=>`<div class="pt-card k-p2"><div class="pt-h">Part 2  Lists of contacts for the Program Measures Survey</div>
 <div class="pt-sub">Families and youth served from <b>Mar 31, 2026</b> (the last six months of the period) who have a real phone or email. <b>FC</b> 58 · <b>FT</b> 14 · <b>Y</b> 4. CPIR needs at least 2 on each list.</div>
 <div class="pt-btns" style="margin-top:7px"><span class="pt-bt k-xlsx">Download lists for CPIR (.xlsx)</span><span class="pt-bg k-key">Private key with names (.csv)</span></div>
 <div class="pt-note">The CPIR file carries codes only. The private key is for LDAH and must never be sent.</div></div>`;
const CPIR=()=>CHEAD()+IA()+IB()+II()+III()+IV()+V()+P2();

/* ---- the Reports page ---- */
const TILES=[['Event Attendance','Every event, its signups and who came.'],['Participation','Who took part, by person.'],['Contact Demographics','Ages, ethnicity and disability across contacts.'],['Feedback','Every evaluation response.'],['Ke Ola Mamo Monthly','The grant’s monthly figures.'],['PTI Report','The reporting-period board document, for any date range.']];
const REPORTS=()=>`<div class="pt-win"><div class="pt-side"><div>Home</div><div>My Day</div><div>Contacts</div><div>Events</div><div class="act">Reports</div><div>Training Videos</div></div>
 <div class="pt-grid"><h4>Reports</h4><div class="pt-tiles">${TILES.map(t=>`<div class="pt-tile${t[0]==='PTI Report'?' pti k-tile':''}"><i></i><b>${t[0]}</b><span>${t[1]}</span></div>`).join('')}</div></div></div>`;

/* ---- switch the view, the way pbSetView does ---- */
async function setView(v){const b=q(v==='cpir'?'.k-vc':'.k-vb');await tap(b,800);
 q('.k-vb').classList.toggle('on',v!=='cpir');q('.k-vc').classList.toggle('on',v==='cpir');
 q('.k-hpti').style.display=v==='cpir'?'':'none';const d=v==='cpir'?PY:Q3;
 q('.k-from').textContent=d.from;q('.k-to').textContent=d.to;['.k-from','.k-to'].forEach(s=>{const e=q(s);e.classList.add('flash');setTimeout(()=>e.classList.remove('flash'),1200)});
 const body=q('.k-body');body.innerHTML=v==='cpir'?CPIR():BOARD(d);await anim(body,[{opacity:0},{opacity:1}],400,'ease-out')}

const LOGO=`<div class="ldah-logo" style="position:absolute;left:70px;top:22px;background:#fff;border-radius:14px;padding:6px 10px;box-shadow:0 4px 14px rgba(0,0,0,.18);animation:rise .6s both"><img src="../logo_blue.png" alt="LDAH" style="height:80px;display:block"></div>`;

const SC=[

{cls:'cover',html:()=>LOGO+`<div class="brand">Leadership in Disabilities &amp; Achievement of Hawaiʻi · What’s new</div><div class="hello">Aloha <span class="nm"></span></div>

  <div class="pt-h">I.A  Trainings</div><table class="pt-tbl">${AUD.slice(0,3).map(a=>`<tr><td>${a[0]}</td><td class="n">${a[1]}</td><td>${TAG(a[3])}</td></tr>`).join('')}</table></div>
 <div class="pt-cvs"><div class="pt-load" style="padding:6px;justify-content:flex-start"><span class="pt-spin"></span><span>Reading sign-ups: 180 of 240 events…</span></div></div>

 {say:'It is a Super Admin report.',li:1,act:async()=>{spot(null)}},

  const w=q('.pt-win');w.outerHTML=WIN(LOADING('Reading events…'));await wait(400);const l=q('.k-ld');
  for(let n=0;n<=240;n+=40){l.textContent=`Reading sign-ups: ${n} of 240 events…`;await wait(300)}l.textContent='Reading interactions and contacts…';await wait(500)}},
 {say:'Once it has loaded, every change you make is instant.',li:3,act:async()=>{const b=q('.k-body');b.innerHTML=BOARD(Q3);await anim(b,[{opacity:0},{opacity:1}],400,'ease-out');spot(q('.pt-head'),4)}}]},

 'The yearly federal <b>CPIR worksheet</b>, box for box.',
 '<b>Hawaii PTI only</b>, on <b>program year</b> dates.',

 steps:[{say:'The big change is a new view. In the Report switch, click Parent Center Data Collection.',li:0,act:async()=>{spot(q('.pt-seg'),5);await wait(500);spot(null);await setView('cpir');hideCursor();spot(q('.pt-seg'),5)}},
