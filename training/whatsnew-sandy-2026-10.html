<script>
const DECK_ID='whatsnew-sandy-2026-10';

/* What's new for a Pacific Island Partners Super Partner, October 2026.
   Every screen is drawn in HTML/CSS from the live dashboard (index.html, v152.x):
   the out-of-date bar (#staleBanner), the One-Off form's Other materials rows
   (_ooOtherRowHtml), the pink Send feedback emails box (#ooFeedbackWrap), the
   Super Partner Email Log (loadEmailLog / renderEmailLogTable) and the My Day
   "Enter TOTAL attendance" task button. All family names are made up. */

/* ---- small helpers ---- */
const tap=async(s,ms=850)=>{const e=typeof s==='string'?q(s):s;await move(e,ms);await click(e);return e};
function all(s){return[...document.querySelectorAll('.scene.on '+s)]}
const show=(e,ms=500)=>anim(e,[{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],ms,'ease-out');
const bub=async(html,x,y,ok,ms=1700)=>{const b=add(`<div class="nobub${ok?' ok':''}" style="left:${x}px;top:${y}px">${html}</div>`);await pop(b);await wait(ms);b.remove()};
const TICK='<svg viewBox="0 0 16 16"><path d="M3 8.5 L6.5 12 L13 4.5"/></svg>';
const MADE='Names shown are made up.';

/* ---- the dashboard window (sidebar + main) ---- */
const NAV_MAIN=[['Home','<span class="pill">Today</span>'],['Interactions'],['Downloads'],['Contacts'],['Reports'],['Training Videos']];
const SIDE=(tab,act)=>`<div class="wn-side"><div class="wn-brand">LDAH<small>Internal dashboard</small></div>
 <div class="wn-tabs"><div class="wn-tab${tab==='main'?' on':''} k-tmain">Main</div><div class="wn-tab${tab==='admin'?' on':''} k-tadmin">Admin</div><div class="wn-tab k-tcms">CMS</div></div>
 <div class="wn-nav k-nav">${tab==='admin'?`<div class="k-elog${act==='elog'?' on':''}">Email Log</div>`:NAV_MAIN.map((n,i)=>`<div class="${i===0&&act==='home'?'on':''}">${n[0]}${n[1]||''}</div>`).join('')}</div></div>`;

/* ---- My Day card ---- */
const TODO=(t)=>`<div class="wn-todo ${t.cls||''} ${t.k||''}"><div class="wn-ck"></div><div class="meta"><div class="ttl">${t.ttl}</div>${t.sub?`<div class="sub">${t.sub}</div>`:''}${t.btn||''}</div><div class="tags">${t.pill||''}</div></div>`;
const TOTAL_TASK={cls:'today',k:'k-task',ttl:'The TOTAL box for “ASCIL Grantor Meeting” shows 0. Click Enter TOTAL attendance, type how many people came, and Save.',btn:'<span class="wn-abtn k-abtn">Enter TOTAL attendance →</span>',pill:'<span class="pill due">TODAY</span>'};
const OTHER_TASKS=[
 {ttl:'Call Mele Sample back about the school meeting',sub:'Open follow-up · created <b>Oct 1</b>',pill:'<span class="pill">FOLLOW-UP</span>'},
 {ttl:'Add the people who came to Family Talk Night',sub:'Open task · created <b>Oct 2</b>',pill:'<span class="pill">EVENT</span>'}];
const MYDAY=(n,ghost)=>`<div class="wn-md${ghost?' wn-ghost':''}"><div class="wn-hero"><div><h3>Home</h3><small>Your day at a glance</small></div><div class="wn-chips"><div class="wn-chip"><b>1</b><span>Today</span></div><div class="wn-chip"><b>3</b><span>This wk</span></div><div class="wn-chip"><b>12</b><span>Done</span></div></div></div>

/* ---- quiz (same pattern as the Super Partner deck) ---- */
function ask(Q,i,sec){const w=q('.qwrap');
 w.innerHTML=`<div class="qcard"><div class="qn">Question ${i+1}</div><div class="qq">${Q.q}</div>${Q.o.map((o,j)=>`<button class="qo" data-j="${j}"><span class="L">${'ABC'[j]}</span><span>${o}</span></button>`).join('')}<div class="qfb"></div></div>`;
 const card=w.firstChild,fb=card.querySelector('.qfb'),btns=[...card.querySelectorAll('.qo')];
 const finish=()=>{btns.forEach(b=>b.disabled=true);btns[Q.a].classList.add('yes');const st=all('.stars i')[i];if(st)st.classList.add('on');fb.className='qfb good';fb.textContent='Yes! '+Q.y};
 if(FAST){finish();return Promise.resolve()}
 return new Promise(res=>{btns.forEach((b,j)=>b.onclick=async()=>{
  if(b.disabled)return;
  if(window.ldahTrack)ldahTrack.quiz(sec,i,j===Q.a);
  if(j===Q.a){finish();const p=pos(b);confetti(p.x+60,p.y+20,70);await speak('Yes! '+Q.y,run);await wait(700);res()}
  else{b.disabled=true;b.classList.add('no');fb.className='qfb bad';fb.textContent='Not quite. '+Q.n+' Try again.';speak('Not quite. '+Q.n+' Try again.',run)}})})}
const QUIZ=(sec,qs,first)=>({cls:'quiz',html:()=>HEAD('Quick check','Your turn!')+`<div class="stars">${qs.map(()=>'<i></i>').join('')}</div><div class="qwrap"><div class="qintro">${qs.length} quick question${qs.length>1?'s':''}.${first?'<small>Click the answer you think is right. If you miss, you can try again. Your first answer to each question counts.</small>':''}</div></div>${first?'<div class="qhelp">Take your time. The next question waits for you.</div>':''}`,
 steps:[{say:first?`Quick check! ${qs.length} questions. Click the answer you think is right. If you miss, just try again.`:`Quick check. ${qs.length} questions.`},
  ...qs.map((Q,i)=>({say:`Question ${i+1}. ${Q.q}`,act:()=>ask(Q,i,sec)}))]});
