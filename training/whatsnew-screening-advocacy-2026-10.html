<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What’s New: Screenings Report and Advocacy Report — Training</title>
<link rel="stylesheet" href="deck-base.css">
<!-- Same Firebase build as the dashboard, so the deck shares its sign-in and records progress. -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
/* Every class here starts with sa-, so nothing collides with deck-base.css. */
.sa-win{position:absolute;left:58px;top:118px;width:712px;background:#F4F6F9;border:1px solid #D5DEE8;border-radius:12px;overflow:hidden;box-shadow:0 14px 36px rgba(15,23,42,.16);z-index:4;color:#1E293B;font-size:12px;font-family:"Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.sa-top{background:#0B3A53;color:#fff;padding:9px 14px;font-weight:800;font-size:12.5px;display:flex;justify-content:space-between;align-items:center}
.sa-top small{font-weight:600;opacity:.8;font-size:10.5px}
.sa-card{margin:12px;background:#fff;border-radius:12px;box-shadow:0 1px 6px rgba(15,40,70,.08);padding:10px 12px 8px}
.sa-sch{display:flex;align-items:center;gap:8px;margin:0 0 8px}
.sa-sch h4{margin:0;font-size:12.5px;color:#0B3A53;font-weight:800}
.sa-cnt{background:rgba(8,145,178,.12);color:#0B3A53;padding:1px 8px;border-radius:999px;font-size:10.5px;font-weight:800}
.sa-hd,.sa-row{display:grid;grid-template-columns:150px 70px 70px 1fr;gap:8px;align-items:center;padding:6px 9px}
.sa-hd{font-size:9.5px;font-weight:800;color:#64748B;text-transform:uppercase;letter-spacing:.4px}
.sa-row{border:1px solid #E2E8F0;border-radius:9px;margin-bottom:5px;background:#fff;font-size:11.5px}
.sa-row.vref{background:#FFFBEB;border-color:#FDE68A}
.sa-row.href{border-left:4px solid #F97316}
.sa-row b{color:#0F172A}
.sa-pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:9.5px;font-weight:800;white-space:nowrap}
.sa-pill.ref{background:#FEE2E2;color:#991B1B}.sa-pill.ok{background:#DCFCE7;color:#166534}
.sa-by{font-size:10.5px;color:#334155;white-space:nowrap;cursor:pointer}
.sa-by .v{color:#1E3A8A;font-weight:800}.sa-by .h{color:#C2410C}.sa-by .d{font-weight:900;color:#0F172A;margin:0 4px}
.sa-by.empty{color:#94A3B8;font-style:italic}
.sa-pdf{margin:0 12px 12px;background:#fff;border-radius:12px;box-shadow:0 1px 6px rgba(15,40,70,.08);padding:10px 12px}
.sa-pdf h5{margin:0 0 7px;font-size:11px;color:#0B3A53;text-transform:uppercase;letter-spacing:.4px}
.sa-pdfrow{display:flex;align-items:center;gap:8px;font-size:11.5px;margin-bottom:6px}
.sa-lnk{color:#0891B2;font-weight:800}.sa-rm{color:#991B1B;font-weight:800}
.sa-add{border:1px dashed #0891B2;color:#0891B2;background:#F0F9FF;border-radius:8px;padding:3px 10px;font-weight:800;font-size:11px;display:inline-block}
.sa-live{margin:0 12px 12px;display:flex;align-items:center;gap:10px;font-size:11.5px;background:#fff;border-radius:12px;box-shadow:0 1px 6px rgba(15,40,70,.08);padding:9px 12px}
.sa-sel{border:1px solid #CBD5E1;border-radius:8px;padding:4px 26px 4px 10px;font-weight:700;background:#fff;position:relative}
.sa-sel:after{content:"▾";position:absolute;right:9px;color:#64748B}
/* advocacy */
.sa-arow{display:grid;grid-template-columns:170px 1fr 150px;gap:10px;align-items:center;padding:9px 11px;border:1px solid #E2E8F0;border-radius:10px;margin-bottom:6px;background:#fff;font-size:12px}
.sa-fam{color:#0F172A;font-weight:800;text-decoration:underline dotted #64748B;text-underline-offset:3px;cursor:pointer}
.sa-cons{display:flex;flex-direction:column;align-items:flex-start;gap:5px}
.sa-nof{background:#FEE2E2;color:#991B1B}
.sa-btn{border:1.5px solid #6D28D9;color:#6D28D9;background:#fff;border-radius:8px;padding:3px 10px;font-weight:800;font-size:11px;font-family:inherit;transition:all .3s}
.sa-btn.sent{background:#DCFCE7;color:#166534;border-color:#86EFAC}
.sa-card2{position:absolute;left:400px;top:470px;width:350px;background:#fff;border-radius:12px;box-shadow:0 18px 40px rgba(15,23,42,.25);padding:12px 14px;font-size:11.5px;z-index:6;opacity:0;transform:translateY(10px);transition:all .35s;font-family:"Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:#1E293B}
.sa-card2.on{opacity:1;transform:none}
.sa-card2 b{font-size:13px;color:#0B3A53}
/* cover art */
.cv-a{position:absolute;left:790px;top:130px;width:420px;background:#fff;border-radius:14px;box-shadow:0 24px 50px rgba(0,0,0,.35);padding:12px 12px 8px;color:#1E293B;transform:rotate(3deg);animation:bob 6s ease-in-out infinite;z-index:3;font-size:12px;font-family:"Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.cv-a .sa-hd,.cv-a .sa-row{grid-template-columns:120px 60px 60px 1fr}
.cv-a .sa-by{font-size:9px;overflow:hidden;text-overflow:ellipsis;min-width:0;display:block}
</style></head><body>
<div id="view"><div id="stage"><div id="nbar"><i></i></div>
<div id="scenes"></div>
<div id="spot"></div>
<svg id="cursor" viewBox="0 0 28 32"><path d="M3 2 L3 26 L9.5 19.5 L14 29 L18.5 27 L14 17.5 L23 17.5 Z" fill="#fff" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/></svg>
</div></div>
<div id="cap" aria-live="polite"></div>
<div id="bar">
 <button id="prev">Back</button><button id="play">Start</button><button id="next">Next</button>
 <div id="dots"></div>
 <button id="capbtn" aria-pressed="false">Captions</button><button id="voice" aria-pressed="true">Voice on</button>
</div>
<script>
const DECK_ID='whatsnew-screening-advocacy-2026-10';

/* What's new mini deck (2026-10-27): the Screenings report (refer rows on top, Screened by,
   Printouts and PDFs, live page school drop-down) and the Case Advocacy report (family name
   opens the contact card, Resend consent). Every family name is MADE UP. The popup supplies
   Got it / Remind me later, so this deck draws none of those. No quiz (What's new mini). */

const tap=async(s,ms=850)=>{const e=typeof s==='string'?q(s):s;await move(e,ms);await click(e);return e};
const PTS=(items,top=140)=>`<div class="abs" style="left:790px;top:${top}px;width:440px"><ul class="pts">${items.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;

const BY=(v,h)=>`<span class="sa-by">${v?`<span class="v">V: ${v}</span>`:''}${v&&h?'<span class="d">|</span>':''}${h?`<span class="h">H: ${h}</span>`:''}</span>`;
const P=(r)=>`<span class="sa-pill ${r?'ref':'ok'}">${r?'Refer':'Pass'}</span>`;
const SROW=(cls,name,v,h,by)=>`<div class="sa-row ${cls}"><b>${name}</b>${P(v)}${P(h)}${by}</div>`;
const SLIST=(extra='')=>`<div class="sa-hd"><span>Child</span><span>Vision</span><span>Hearing</span><span>Screened by</span></div>
 <div class="k-refs">${SROW('vref k-r1','Keoni Akana',1,0,BY('Chassidy 9:39 AM','Noelani 9:45 AM'))}${SROW('href','Lani Mahoe',0,1,BY('Chassidy 9:52 AM','Noelani 9:58 AM'))}</div>
 ${SROW('','Noa Kealoha',0,0,BY('Chassidy 10:04 AM','Noelani 10:11 AM'))}${SROW('','Mia Santos',0,0,BY('Chassidy 10:15 AM',''))}${extra}`;

const SCREEN=()=>`<div class="sa-win"><div class="sa-top">Reports · Screenings<small>DAN</small></div>
 <div class="sa-card k-list"><div class="sa-sch"><h4>Kaimana Elementary</h4><span class="sa-cnt">4 children</span></div>${SLIST()}</div>
 <div class="sa-pdf k-pdf"><h5>Edit results · Printouts and PDFs</h5>
  <div class="sa-pdfrow">Vision printout: <span class="sa-lnk">View</span> · <span class="sa-rm">Remove</span></div>
  <span class="sa-add">+ Add hearing PDF</span></div>
 <div class="sa-live k-live"><span>ldahawaii.org/screening/live/</span><span class="sa-sel">Kaimana Elementary (today)</span></div></div>`;

const AROW=(fam,kid,on,k)=>`<div class="sa-arow"><span class="sa-fam ${k}-n">${fam}</span><span style="color:#64748B">for ${kid} · Lions vision referral</span>
 <div class="sa-cons">${on?'<span class="sa-pill ok">On file</span>':`<span class="sa-pill sa-nof">Not on file</span><button class="sa-btn ${k}-b">Resend consent</button>`}</div></div>`;
const ADV=()=>`<div class="sa-win"><div class="sa-top">Reports · Case Advocacy<small>Admins</small></div>
 <div class="sa-card k-adv"><div class="sa-sch"><h4>Open cases</h4><span class="sa-cnt">3</span></div>
 <div class="sa-hd" style="grid-template-columns:170px 1fr 150px"><span>Family</span><span>Case</span><span>Consent</span></div>
 ${AROW('Leah Mahoe','Kaia Mahoe',0,'k-a1')}${AROW('Sam Nakoa','Ian Nakoa',1,'k-a2')}${AROW('Joy Perez','Ana Perez',1,'k-a3')}</div></div>
 <div class="sa-card2 k-cc"><b>Leah Mahoe</b><div style="color:#64748B;margin:2px 0 8px">Contact card · Parent/Guardian</div>Children: Kaia Mahoe<br>Case advocacy: open · consent not on file</div>`;

const LOGO=`<div class="ldah-logo" style="position:absolute;left:70px;top:22px;background:#fff;border-radius:14px;padding:6px 10px;box-shadow:0 4px 14px rgba(0,0,0,.18);animation:rise .6s both"><img src="../logo_blue.png" alt="LDAH" style="height:80px;display:block"></div>`;

const SC=[
// ================= COVER =================
{cls:'cover',html:()=>LOGO+`<div class="brand">Leadership in Disabilities &amp; Achievement of Hawaiʻi · What’s new · Oct 27, 2026</div><div class="hello">Aloha <span class="nm"></span></div>
 <h1>Screenings report and Advocacy report</h1><p class="sub" style="top:350px">Two reports got a little easier. About a minute.</p>
 <div class="cv-a">${SLIST()}</div>
 <div class="spark" style="left:1200px;top:80px">${SPARK}</div><div class="spark" style="left:770px;top:560px;animation-delay:1s">${SPARK}</div>
 <div class="gate" style="top:450px"><button class="btn" data-go="start">Play</button><label><input type="checkbox" id="voiceChk" checked> Read it out loud to me</label></div>${WAVES}`,
 steps:[{say:'Aloha {name}! The Screenings report and the Case Advocacy report are updated. Here is what changed, in about a minute.'}]},

// ================= SCREENINGS REPORT =================
{html:()=>HEAD('Updated','The Screenings report')+SCREEN()+PTS([
 'Children who need a <b>referral</b> are now at the <b>top</b> of each school. Vision refers are tinted yellow.',
 '<b>Screened by</b> fills itself in when you click Add results: your name and the time. Click it to change it.',
 'In Edit results, <b>Printouts and PDFs</b> always shows View, Remove and <b>+ Add hearing PDF</b>.',
 'The <b>live screening page</b> has a school drop-down that picks today’s school for you.'],130),
 steps:[
 {say:'In the Screenings report, every child who needs a referral is now at the top of each school’s list. Vision refers are tinted light yellow.',li:0,act:async()=>{spot(q('.k-refs'),5);await move(q('.k-r1'),900);await wait(600);hideCursor()}},
 {say:'Screened by fills itself in when you click Add results. It shows your name and the time, vision in blue and hearing in orange. Click it if you need to change it.',li:1,act:async()=>{spot(null);await tap(q('.k-r1 .sa-by'),900);spot(q('.k-r1 .sa-by'),5);await wait(500);hideCursor()}},
 {say:'In Edit results, Printouts and PDFs always shows View, Remove, and Add hearing PDF.',li:2,act:async()=>{spot(q('.k-pdf'),5)}},
 {say:'And the live screening page now has a school drop-down that picks today’s school from the calendar.',li:3,act:async()=>{spot(q('.k-live'),5)}}]},

// ================= CASE ADVOCACY REPORT =================
{html:()=>HEAD('Updated','The Case Advocacy report')+ADV()+PTS([
 'Click a <b>family’s name</b> to open their contact card.',
 'Consent <b>Not on file</b>? Click <b>Resend consent</b>. The family gets the signing link again by email.',
 'The button turns green and says <b>Sent</b>.'],150),
 steps:[
 {say:'In the Case Advocacy report, click a family’s name to open their contact card.',li:0,act:async()=>{spot(null);await tap('.k-a1-n',900);q('.k-cc').classList.add('on');await wait(1400);q('.k-cc').classList.remove('on');hideCursor()}},
 {say:'If the signed release is not on file, click Resend consent. The family gets the signing link again by email, in one click.',li:1,act:async()=>{spot(q('.k-a1-b'),6);await tap('.k-a1-b',900);const b=q('.k-a1-b');b.classList.add('sent');b.textContent='Sent';hideCursor()}},
 {say:'The button turns green and says Sent, so you know it went out.',li:2,act:async()=>{spot(q('.k-a1-b'),6)}}]},

// ================= MAHALO =================
{cls:'cover',html:()=>LOGO+`<div class="brand">What’s new · Screenings report and Advocacy report</div><div class="hello">That’s the update</div><h1>Mahalo<span class="nmc"></span>!</h1>
 <p class="sub" style="top:300px">That’s it. These are live now.</p>${WAVES}`,
 steps:[{say:'Mahalo {name}! That’s it. These are live now.',act:async()=>{await wait(400);confetti(640,300,120)}}]}
];
</script>
<script src="deck-engine.js?v=3"></script>
<script src="deck-tracker.js"></script></body></html>
