<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What’s New: The Volunteer Sign-Up Sheet — Training</title>
<link rel="stylesheet" href="deck-base.css">
<!-- Same Firebase build as the dashboard, so the deck shares its sign-in and records progress. -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
/* Every class here starts with sc- so nothing collides with deck-base.css. */
.sc-win{position:absolute;left:58px;top:118px;width:712px;height:570px;background:#F4F6F9;border:1px solid #D5DEE8;border-radius:12px;overflow:hidden;box-shadow:0 14px 36px rgba(15,23,42,.16);z-index:4;font-family:"Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:#1E293B}
.sc-side{position:absolute;left:0;top:0;bottom:0;width:190px;background:#fff;border-right:1px solid #E2E8F0;padding:12px 10px}
.sc-side .lg{display:flex;align-items:center;gap:8px;margin:0 0 10px 4px}
.sc-side .lg img{height:30px}
.sc-gh{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#64748B;padding:9px 8px 4px;border-radius:6px;display:flex;justify-content:space-between;transition:background .3s}
.sc-gh i{font-style:normal;transition:transform .3s}.sc-gh.open i{transform:rotate(90deg)}
.sc-side a{display:block;font-size:12.5px;padding:5px 9px;border-radius:6px;color:#334155;transition:background .3s}
.sc-side a.act{background:#E0F2FE;color:#0E6E8C;font-weight:700}
.sc-grp{max-height:0;overflow:hidden;transition:max-height .5s ease}.sc-grp.open{max-height:300px}
.sc-main{position:absolute;left:190px;right:0;top:0;bottom:0;padding:16px 18px}
.sc-main h3{margin:0 0 10px;font-size:19px;color:#0B3A53}
.sc-ghost{background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(15,40,70,.08);height:84px;margin-bottom:10px;padding:12px}
.sc-ghost u{display:block;height:8px;border-radius:4px;background:#E2E8F0;margin-bottom:8px;text-decoration:none}
.sc-tabs{display:flex;gap:4px;border-bottom:2px solid #E2E8F0;margin-bottom:12px}
.sc-tab{font-size:12px;font-weight:700;color:#64748B;padding:7px 10px;border-bottom:3px solid transparent;margin-bottom:-2px;transition:color .3s,border-color .3s}
.sc-tab.on{color:#0E7490;border-bottom-color:#0E7490}
.sc-tab b{display:inline-block;background:#F97316;color:#fff;border-radius:999px;font-size:9.5px;padding:0 6px;margin-left:3px}
.sc-pane{display:none}.sc-pane.on{display:block}
.sc-top{display:flex;justify-content:flex-end;margin-bottom:10px}
.sc-ssbtn{background:#0E7490;color:#fff;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:800;transition:transform .15s}
.sc-req{background:#fff;border:1px solid #E7ECF1;border-radius:12px;padding:11px 13px;margin-bottom:9px}
.sc-req .t{font-weight:800;font-size:13px;color:#0F172A}.sc-req .m{font-size:11px;color:#64748B;margin-top:2px}
.sc-bdg{display:inline-block;font-size:10px;font-weight:700;border-radius:999px;padding:2px 8px;background:#E0F2FE;color:#0369A1;margin-top:6px}
/* the sign-up sheet pop-up */
.sc-dim{position:absolute;left:58px;top:118px;width:712px;height:570px;background:rgba(15,23,42,.55);border-radius:12px;z-index:13}
.sc-mod{position:absolute;left:78px;top:132px;width:672px;height:542px;background:#fff;border-radius:12px;box-shadow:0 26px 60px rgba(15,23,42,.4);z-index:14;overflow:hidden;display:flex;flex-direction:column;font-family:Arial,Helvetica,sans-serif;color:#0F172A}
.sc-mh{background:#1a3c6e;color:#fff;padding:9px 12px;display:flex;align-items:center;gap:8px;font-size:11px}
.sc-mh .tt{font-weight:700;font-size:12px;margin-right:auto;white-space:nowrap}
.sc-mh>span{white-space:nowrap;flex:none}
.sc-mh .sc-cbl{display:flex;align-items:center;gap:4px}
.sc-mh .sc-cbl i{display:inline-block;width:11px;height:11px;border:1.5px solid #fff;border-radius:2px;position:relative}
.sc-mh .sc-cbl i.on{background:#fff}.sc-mh .sc-cbl i.on::after{content:"";position:absolute;left:3px;top:0;width:3px;height:6px;border:solid #1a3c6e;border-width:0 2px 2px 0;transform:rotate(45deg)}
.sc-mh .pb{background:#fff;color:#1a3c6e;border-radius:6px;padding:4px 9px;font-weight:700}
.sc-mh .db{background:rgba(255,255,255,.18);border-radius:6px;padding:4px 9px;font-weight:700}
.sc-mh .x{font-size:17px;line-height:1;padding:0 2px}
.sc-mb{flex:1;overflow:hidden;position:relative}
.sc-mbi{padding:10px 12px;transition:transform 1.2s cubic-bezier(.45,.05,.25,1)}
.sc-key{font-size:10px;margin-bottom:7px}
.sc-ch{display:inline-block;border-radius:999px;padding:1px 7px;font-size:9.5px;font-weight:700}
.sc-ch.s{background:#ECFEFF;color:#0E7490}.sc-ch.v{background:#F5F3FF;color:#7C3AED}.sc-ch.o{background:#FFFBEB;color:#B45309}
.sc-tbl{width:100%;border-collapse:collapse;font-size:10.5px}
.sc-tbl th,.sc-tbl td{border:1px solid #CBD5E1;padding:4px 6px;text-align:left;vertical-align:top}
.sc-tbl th{background:#1a3c6e;color:#fff;font-size:8.5px;text-transform:uppercase;letter-spacing:.03em}
.sc-tbl td.ev{width:36%;font-weight:700}.sc-tbl td.ev small{display:block;font-weight:400;color:#64748B;font-size:9.5px}
.sc-tbl td.ev em{display:block;font-style:normal;font-weight:400;font-size:9.5px;margin-top:3px}
.sc-tbl td.n{width:20px;text-align:center;color:#64748B}.sc-tbl td.in{width:56px;text-align:center;font-weight:700}
.sc-tbl td.op{color:#94A3B8;font-style:italic}
.sc-tbl tr.gap td{border-left:none;border-right:none;height:6px;padding:0}
.sc-tbl tbody.done{display:none}.sc-tbl.showdone tbody.done{display:table-row-group}
.sc-sb{position:absolute;right:3px;top:6px;width:5px;height:120px;border-radius:3px;background:#CBD5E1;transition:top 1.2s cubic-bezier(.45,.05,.25,1)}
/* right-hand panels */
.sc-pn{position:absolute;background:#fff;border-radius:14px;box-shadow:0 8px 22px rgba(15,23,42,.1);padding:12px 16px;font-size:16px;line-height:1.4;opacity:0;font-family:"Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.sc-pn.y{background:#FEF3C7;border-left:6px solid #F59E0B;box-shadow:none}
.sc-pn.g{background:#ECFDF5;border-left:6px solid #16A34A;box-shadow:none}
/* cover art */
.sc-cv1{position:absolute;left:790px;top:130px;width:410px;background:#fff;border-radius:14px;box-shadow:0 24px 50px rgba(0,0,0,.35);padding:12px 14px;color:#1E293B;transform:rotate(3deg);animation:bob 6s ease-in-out infinite;z-index:3;font-family:Arial,Helvetica,sans-serif}
.sc-cv2{position:absolute;left:880px;top:470px;width:250px;background:#fff;border-radius:12px;box-shadow:0 20px 40px rgba(0,0,0,.3);padding:12px 14px;color:#1E293B;transform:rotate(-4deg);animation:bob 5s 1s ease-in-out infinite;z-index:4;text-align:center;font-family:"Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
</style></head><body>
<div id="view"><div id="stage"><div id="nbar"><i></i></div>
<div id="scenes"></div>
<div id="spot"></div>
<svg id="cursor" viewBox="0 0 28 32"><path d="M3 2 L3 26 L9.5 19.5 L14 29 L18.5 27 L14 17.5 L23 17.5 Z" fill="#fff" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/></svg>
</div></div>
<div id="cap" aria-live="polite"></div>
<div id="bar">
 <button id="prev">Back</button><button id="play">Start</button><button id="next">Next</button>
 <div id="dots"></div>
 <button id="capbtn" aria-pressed="false">Captions</button><button id="voice" aria-pressed="true">Voice on</button>
</div>
<script>
const DECK_ID='whatsnew-signup-sheet';

/* What's new mini deck (Daniel 2026-11-19: "simply shows this new modal and how you got there").
   The mocks copy DAN v155.0: Content Management > Volunteers > Help Requests > Sign-Up Sheet,
   which opens the sheet in a pop-up that fits the screen and scrolls. Every person is MADE UP.
   The popup supplies See the full training / Got it / Remind me later, so this deck draws none of those. */
const LOGO='../logo_blue.png';
const tap=async(s,ms=850)=>{const e=typeof s==='string'?q(s):s;await move(e,ms);await click(e);return e};
function all(s){return[...document.querySelectorAll('.scene.on '+s)]}
const show=(e,ms=500)=>anim(e,[{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],ms,'ease-out').then(()=>{e.style.opacity=1});
const PTS=(items,top=140)=>`<div class="abs" style="left:790px;top:${top}px;width:440px"><ul class="pts">${items.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
const LOGOBOX=`<div style="position:absolute;left:70px;top:22px;background:#fff;border-radius:14px;padding:6px 10px;box-shadow:0 4px 14px rgba(0,0,0,.18);animation:rise .6s both"><img src="${LOGO}" alt="LDAH" style="height:80px;display:block"></div>`;

/* ---- made-up events for the sheet ---- */
const EVS=[
 {t:'Dippin’ Dots at the Arena',d:'November 9 · 4:00 p.m.',done:1,ask:'6 needed',rows:[['Kai Akana','s','KA'],['Malia Kahale','s','MK'],['Leah Nakoa','s','LN'],['Noa Keliʻi','v','LN']]},
 {t:'Saimin Stand',d:'November 27 · 10:00 a.m.',ask:'Asked for 2 staff + 1 volunteer<br>Staff 3 of 2 · Volunteers 1 of 1<br>1 extra staff counted as volunteer',rows:[['Malia Kahale','s','MK'],['Kai Akana','s','KA'],['Leah Nakoa','x','LN']]},
 {t:'Saimin Stand',d:'November 28 · 10:00 a.m.',ask:'Asked for 1 staff + 2 volunteers<br>Staff 1 of 1 · Volunteers 1 of 2',rows:[['Leah Nakoa','s','LN'],['Pua Kamaka','v','online'],['','ov','']]},
 {t:'Saimin Stand',d:'November 29 · 9:00 a.m.',ask:'Asked for 1 staff + 2 volunteers<br>Staff 0 of 1 · Volunteers 0 of 2',rows:[['','os',''],['','ov',''],['','ov','']]},
 {t:'Dippin’ Dots at the Arena',d:'December 22 · 4:00 p.m.',ask:'Asked for 3 staff + 2 volunteers<br>Staff 1 of 3 · Volunteers 0 of 2',rows:[['Kai Akana','s','KA'],['','os',''],['','os',''],['','ov',''],['','ov','']]},
 {t:'Dippin’ Dots at the Arena',d:'March 2 · 4:00 p.m.',ask:'Asked for 2 staff + 2 volunteers<br>Staff 1 of 2 · Volunteers 0 of 2',rows:[['Malia Kahale','s','MK'],['','os',''],['','ov',''],['','ov','']]}
];
const TYPE={s:['s','Staff'],v:['v','Volunteer'],x:['s','Staff, extra (counts as volunteer)'],os:['o','Staff needed'],ov:['o','Volunteer needed']};
const SHEET=(list,cls)=>`<table class="${cls||'sc-tbl k-tbl'}"><thead><tr><th>Date of event</th><th>#</th><th>Name of volunteer / staff</th><th>Type</th><th>Staff (initials)</th></tr></thead>${(list||EVS).map((e,ei)=>`<tbody class="k-ev${ei}${e.done?' done':''}">${e.rows.map((r,i)=>`<tr>${i===0?`<td class="ev" rowspan="${e.rows.length}">${e.t}<small>${e.d}${e.done?' · Completed':''}</small><em>${e.ask}</em></td>`:''}<td class="n">${i+1}</td><td${r[0]?'':' class="op"'}>${r[0]||'open'}</td><td><span class="sc-ch ${TYPE[r[1]][0]}">${TYPE[r[1]][1]}</span></td><td class="in">${r[2]}</td></tr>`).join('')}<tr class="gap"><td colspan="5"></td></tr></tbody>`).join('')}</table>`;
const MODAL=()=>`<div class="sc-dim k-dim"></div><div class="sc-mod k-mod"><div class="sc-mh"><span class="tt">Volunteer Sign-Up Sheet for LDAH 2026–2027</span><span class="sc-cbl k-cb"><i class="k-cbx"></i>Show completed</span><span class="pb k-print">Print</span><span class="db k-dl">Download for Excel</span><span class="x k-x">×</span></div>
 <div class="sc-mb k-mb"><div class="sc-mbi k-mbi"><div class="sc-key"><span class="sc-ch s">Staff</span> <span class="sc-ch v">Volunteer</span> <span class="sc-ch o">Still needed</span></div>${SHEET()}</div><div class="sc-sb k-sb"></div></div></div>`;

/* ---- the DAN window ---- */
const WIN=(o={})=>`<div class="sc-win k-win"><div class="sc-side"><div class="lg"><img src="${LOGO}" alt="LDAH"></div>
 <div class="sc-gh">Main <i>›</i></div><a>Home</a><a>Contacts</a><a>Reports</a>
 <div class="sc-gh k-cmh${o.open?' open':''}">Content Management <i>›</i></div>
 <div class="sc-grp k-cmg${o.open?' open':''}"><a>Dashboard</a><a>Events &amp; Programs</a><a class="k-vol${o.vol?' act':''}">Volunteers</a><a>Website Data</a></div></div>
 <div class="sc-main">${o.vol?`<h3>Volunteers</h3><div class="sc-tabs"><span class="sc-tab k-troster${o.req?'':' on'}">Roster</span><span class="sc-tab">Applications</span><span class="sc-tab k-treq${o.req?' on':''}">Help Requests <b>4</b></span><span class="sc-tab">Opportunities</span></div>
  <div class="sc-pane k-proster${o.req?'':' on'}"><div class="sc-ghost"><u style="width:40%"></u><u style="width:70%"></u></div><div class="sc-ghost"><u style="width:55%"></u><u style="width:35%"></u></div></div>
  <div class="sc-pane k-preq${o.req?' on':''}"><div class="sc-top"><span class="sc-ssbtn k-ss">Sign-Up Sheet</span></div>
   <div class="sc-req"><div class="t">Saimin Stand</div><div class="m">November 27 · 10:00 a.m. to 2:30 p.m.</div><span class="sc-bdg">Staff 3 of 2 · Volunteers 1 of 1</span></div>
   <div class="sc-req"><div class="t">Saimin Stand</div><div class="m">November 28 · 10:00 a.m. to 2:30 p.m.</div><span class="sc-bdg">Staff 1 of 1 · Volunteers 1 of 2</span></div></div>`
 :`<h3>Aloha</h3><div class="sc-ghost"><u style="width:40%"></u><u style="width:70%"></u></div><div class="sc-ghost"><u style="width:55%"></u><u style="width:35%"></u></div><div class="sc-ghost"><u style="width:65%"></u><u style="width:45%"></u></div>`}</div></div>`;

const SC=[
// ================= COVER =================
{cls:'cover',html:()=>LOGOBOX+`<div class="brand">Leadership in Disabilities &amp; Achievement of Hawaiʻi · What’s new</div><div class="hello">Aloha <span class="nm"></span></div>
 <h1>The Volunteer Sign-Up Sheet</h1><p class="sub" style="top:350px">The sheet you used in Excel now lives in DAN. Here is where to find it. Under 1 minute.</p>
 <div class="sc-cv1">${SHEET(EVS.slice(1,3),'sc-tbl')}</div>
 <div class="sc-cv2"><span class="sc-ssbtn" style="display:inline-block;font-size:15px;padding:9px 18px">Sign-Up Sheet</span></div>
 <div class="spark" style="left:1200px;top:90px">${SPARK}</div><div class="spark" style="left:760px;top:560px;animation-delay:1s">${SPARK}</div>
 <div class="gate" style="top:450px"><button class="btn" data-go="start">Play</button><label><input type="checkbox" id="voiceChk" checked> Read it out loud to me</label></div>${WAVES}`,
 steps:[{say:'Aloha {name}! The volunteer sign-up sheet you used in Excel now lives in DAN. Here is where to find it.'}]},

// ================= HOW TO GET THERE =================
{html:()=>HEAD('Getting there','Volunteers, then Help Requests')+WIN()+PTS([
 'In the left menu, open <b>Content Management</b>.',
 'Click <b>Volunteers</b>.',
 'Click the <b>Help Requests</b> tab.',
 'Press <b>Sign-Up Sheet</b> at the top right.']),
 steps:[{say:'In the left menu, open Content Management.',li:0,act:async()=>{const h=await tap('.k-cmh',900);h.classList.add('open');q('.k-cmg').classList.add('open');hideCursor();await wait(450);spot(q('.k-cmg'),3)}},
 {say:'Click Volunteers.',li:1,act:async()=>{spot(null);await tap('.k-vol',800);hideCursor();q('.k-win').outerHTML=WIN({open:1,vol:1});spot(q('.sc-tabs'),3)}},
 {say:'Click the Help Requests tab.',li:2,act:async()=>{spot(null);await tap('.k-treq',800);hideCursor();q('.k-win').outerHTML=WIN({open:1,vol:1,req:1})}},
 {say:'Then press Sign-Up Sheet, at the top right.',li:3,act:async()=>{const b=q('.k-ss');spot(b,6);await move(b,800);await click(b);hideCursor()}}]},

// ================= THE POP-UP =================
{html:()=>HEAD('The Sign-Up Sheet','It opens right in DAN')+WIN({open:1,vol:1,req:1})+MODAL()+
 `<div class="sc-pn" style="left:790px;top:140px;width:430px">Same layout as the Excel sheet: <b>one block per event</b>, numbered lines, the name, and the <b>staff initials</b>.</div>
 <div class="sc-pn y" style="left:790px;top:276px;width:430px"><span class="sc-ch o" style="font-size:13px">Staff needed</span> <span class="sc-ch o" style="font-size:13px">Volunteer needed</span> lines show the spots <b>still open</b>.</div>
 <div class="sc-pn g" style="left:790px;top:400px;width:430px">It <b>fits your screen</b>. A long list <b>scrolls inside</b> it.</div>
 <div class="sc-pn" style="left:790px;top:510px;width:430px"><b>Show completed</b>, <b>Print</b>, <b>Download for Excel</b>. Close with the <b>×</b>.</div>`,
 steps:[{say:'The sheet opens right inside DAN. It is the same layout as the Excel sheet. One block per event, numbered lines, the name, and the staff initials.',act:async()=>{const p=all('.sc-pn')[0];await show(p);spot(q('.k-ev1'),4)}},
 {say:'Spots that are still open show as Staff needed or Volunteer needed.',act:async()=>{spot(null);await show(all('.sc-pn')[1]);spot(q('.k-ev3'),4)}},
 {say:'It fits your screen. When the list is long, it scrolls inside the window.',act:async()=>{spot(null);await show(all('.sc-pn')[2]);
  const mb=q('.k-mb'),inner=q('.k-mbi'),d=Math.max(0,inner.scrollHeight-mb.clientHeight);inner.style.transform='translateY(-'+d+'px)';q('.k-sb').style.top=(mb.clientHeight-130)+'px';await wait(1500);
  inner.style.transform='none';q('.k-sb').style.top='6px';await wait(1300)}},
 {say:'Across the top: Show completed adds past events back in. Print and Download for Excel give you a copy. The x closes it.',act:async()=>{await show(all('.sc-pn')[3]);
  await tap('.k-cb',800);q('.k-cbx').classList.add('on');q('.k-tbl').classList.add('showdone');hideCursor();spot(q('.k-ev0'),3);await wait(1400);spot(null);spot(q('.k-print'),3);await wait(900);spot(q('.k-dl'),3)}}]},

// ================= MAHALO =================
{cls:'cover',html:()=>LOGOBOX+`<div class="brand">What’s new · The Volunteer Sign-Up Sheet</div><div class="hello">That’s the update</div><h1>Mahalo<span class="nmc"></span>!</h1>
 <p class="sub" style="top:300px"><b>Content Management → Volunteers → Help Requests → Sign-Up Sheet.</b> The full walkthrough, <b>Volunteer Help Requests</b>, covers sending a request. To watch it now, tap <b>See the full training</b> below.</p>${WAVES}`,
 steps:[{say:'Mahalo {name}! Content Management, Volunteers, Help Requests, then Sign-Up Sheet. To learn about sending a help request, tap See the full training below.',act:async()=>{await wait(400);confetti(640,300,120)}}]}
];
</script>
<script src="deck-engine.js?v=6"></script>
<script src="deck-tracker.js"></script></body></html>
