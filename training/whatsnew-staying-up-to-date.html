<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What’s new: Staying up to date — Training</title>
<link rel="stylesheet" href="deck-base.css">
<!-- Same Firebase build as the dashboard, so the deck shares its sign-in and records progress. -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
/* Every class here starts with su- so nothing collides with deck-base.css. */
/* ---------- the dashboard window (kept left of the points list at 790) ---------- */
.su-win{position:absolute;left:58px;top:126px;width:712px;height:560px;background:#F4F6F9;border:1px solid #D5DEE8;border-radius:12px;overflow:hidden;box-shadow:0 14px 36px rgba(15,23,42,.16);z-index:4;font-family:"Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:#1E293B}
.su-page{position:absolute;inset:0;padding:14px}
/* the header card, top-right corner of the dashboard */
.su-hdr{position:relative;background:#fff;border-radius:12px;box-shadow:0 1px 6px rgba(15,40,70,.08);height:104px;padding:0 16px}
.su-ver{position:absolute;top:8px;right:14px;font-size:14px;font-weight:800;color:#94A3B8;letter-spacing:.02em;display:flex;gap:10px;align-items:baseline}
.su-ver .new{color:#DC2626;text-decoration:underline;font-weight:800;cursor:pointer;opacity:0;display:none}
.su-row{position:absolute;left:16px;right:16px;bottom:16px;display:flex;align-items:center;justify-content:flex-end;gap:12px}
.su-logo{margin-right:auto;font-size:22px;font-weight:800;color:#1a3c6e}
.su-wx{font-size:14px;font-weight:700;color:#0F172A;background:#E0F2FE;border-radius:999px;padding:6px 12px;white-space:nowrap}
.su-wx i{display:inline-block;width:12px;height:12px;border-radius:50%;background:#F59E0B;margin-right:6px;vertical-align:-1px}
.su-alerts{font-size:14px;font-weight:700;color:#475569;border:1px solid #CBD5E1;border-radius:8px;padding:6px 12px;background:#fff}
.su-chat{width:38px;height:38px;border-radius:50%;background:#F97316;position:relative;flex:none}
.su-chat::before{content:"";position:absolute;left:10px;top:11px;width:18px;height:13px;background:#fff;border-radius:4px}
.su-chat::after{content:"";position:absolute;left:13px;top:22px;border:5px solid transparent;border-top-color:#fff;border-left-color:#fff}
.su-newi{font-size:14px;font-weight:800;color:#fff;background:#0F766E;border-radius:8px;padding:8px 14px;white-space:nowrap}
.su-av{width:38px;height:38px;border-radius:50%;background:#64748B;color:#fff;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
/* placeholder dashboard content under the header */
.su-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.su-c{background:#fff;border-radius:10px;height:150px;box-shadow:0 1px 6px rgba(15,40,70,.08);padding:14px}
.su-c b{display:block;height:12px;width:45%;background:#CBD5E1;border-radius:6px;margin-bottom:14px}
.su-c s{display:block;height:9px;background:#E2E8F0;border-radius:5px;margin-bottom:10px;text-decoration:none}
.su-wide{grid-column:1 / span 2;height:110px}
/* the reload flash */
.su-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:30}
/* the blue out-of-date bar, bottom centre */
.su-blue{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:640px;background:#0E5F7A;color:#fff;border-radius:12px;box-shadow:0 10px 28px rgba(14,95,122,.35);padding:14px 16px;display:flex;align-items:center;gap:14px;font-size:15.5px;font-weight:600;line-height:1.35;z-index:10}
.su-blue span{flex:1}
.su-blue button{font:inherit;font-weight:800;font-size:15px;background:#fff;color:#0E5F7A;border:0;border-radius:8px;padding:9px 14px;white-space:nowrap}
/* the Chrome popup */
.su-dim{position:absolute;inset:0;background:rgba(15,23,42,.45);z-index:12}
.su-modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:500px;background:#fff;border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.35);padding:24px 26px;z-index:13}
.su-modal h4{margin:0 0 10px;font-size:22px;font-weight:800;color:#0F172A}
.su-modal p{margin:0 0 20px;font-size:16px;line-height:1.45;color:#475569}
.su-btns{display:flex;gap:10px;flex-wrap:wrap}
.su-b{font:inherit;font-size:15px;font-weight:800;border:0;border-radius:8px;padding:10px 16px;white-space:nowrap}
.su-b.blue{background:#1a73e8;color:#fff}
.su-b.lblue{background:#E8F0FE;color:#1a73e8}
.su-b.grey{background:#E2E8F0;color:#334155}
/* phone version of the popup */
.su-phone{position:absolute;left:440px;top:120px;width:250px;height:420px;background:#0F172A;border-radius:34px;padding:12px;box-shadow:0 24px 50px rgba(0,0,0,.4);z-index:20;opacity:0}
.su-scr{position:relative;width:100%;height:100%;background:rgba(15,23,42,.5);border-radius:24px;overflow:hidden}
.su-scr .su-modal{width:200px;padding:14px}
.su-scr h4{font-size:16px}.su-scr p{font-size:12.5px;margin-bottom:12px}
.su-scr .su-b{font-size:13px;padding:8px 10px;width:100%}
/* the desktop-icon card, bottom right */
.su-offer{position:absolute;right:16px;bottom:16px;width:380px;background:#fff;border-radius:14px;box-shadow:0 14px 40px rgba(15,23,42,.28);padding:16px;display:flex;gap:14px;z-index:10}
.su-ico{width:44px;height:44px;border-radius:11px;background:#1a3c6e;flex:none;display:flex;align-items:center;justify-content:center}
.su-ico svg{width:30px;height:30px}
.su-offer h5{margin:0 0 4px;font-size:16px;font-weight:800;color:#0F172A}
.su-offer p{margin:0 0 12px;font-size:13.5px;line-height:1.4;color:#475569}
.su-offer .su-btns{justify-content:flex-end}
.su-offer .su-b{font-size:14px;padding:8px 14px}
/* Chrome's install prompt */
.su-inst{position:absolute;right:16px;top:14px;width:330px;background:#fff;border-radius:10px;box-shadow:0 14px 40px rgba(15,23,42,.3);padding:16px;z-index:14;opacity:0}
.su-inst h5{margin:0 0 12px;font-size:17px;font-weight:800}
.su-inst .who{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:700;margin-bottom:16px}
.su-inst .su-ico{width:32px;height:32px;border-radius:8px}.su-inst .su-ico svg{width:22px;height:22px}
.su-inst .su-btns{justify-content:flex-end}
/* mock desktop strip and Mac Dock */
.su-desk{position:absolute;left:0;right:0;bottom:0;height:150px;background:linear-gradient(135deg,#1E3A5F,#2F6690);z-index:15;opacity:0;padding:20px 26px;display:flex;gap:30px}
.su-dico{width:96px;text-align:center;color:#fff;font-size:13px;font-weight:700;line-height:1.25}
.su-dico .su-ico{margin:0 auto 8px;width:56px;height:56px;border-radius:14px}
.su-dico .su-ico svg{width:38px;height:38px}
.su-dico.dim{opacity:.55}.su-dico.dim .su-ico{background:#94A3B8}
.su-dock{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(255,255,255,.55);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.6);border-radius:18px;padding:8px 12px;display:flex;gap:10px;z-index:16;opacity:0}
.su-dock i{width:48px;height:48px;border-radius:12px;display:block}
.su-dock .su-ico{width:48px;height:48px;border-radius:12px;position:relative}
.su-dock .su-ico::after{content:"";position:absolute;left:50%;bottom:-7px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#0F172A}
.su-menu{position:absolute;z-index:17;background:#F8FAFC;border:1px solid #CBD5E1;border-radius:8px;box-shadow:0 10px 26px rgba(0,0,0,.25);padding:6px;font-size:14px;font-weight:600;color:#0F172A;width:170px;opacity:0}
.su-menu div{padding:6px 10px;border-radius:5px;white-space:nowrap}
.su-menu .hl{background:#1a73e8;color:#fff}
/* cover art: the version corner floating on the right */
.su-cv{position:absolute;left:780px;top:170px;width:400px;background:#fff;border-radius:14px;box-shadow:0 24px 50px rgba(0,0,0,.35);padding:18px 22px;color:#1E293B;transform:rotate(3deg);animation:bob 6s ease-in-out infinite;z-index:3;font-family:"Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.su-cv small{display:block;font-size:13px;color:#64748B;margin-bottom:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.su-cv .vv{font-size:30px;font-weight:800;color:#94A3B8;display:flex;gap:18px}
.su-cv .vv u{color:#DC2626}
/* in the sign-in popup the popup has its own buttons, so the deck draws none */
body.wn-popup [data-go=skip],body.wn-popup [data-go=close]{display:none!important}
</style></head><body>
<div id="view"><div id="stage"><div id="nbar"><i></i></div>
<div id="scenes"></div>
<div id="spot"></div>
<svg id="cursor" viewBox="0 0 28 32"><path d="M3 2 L3 26 L9.5 19.5 L14 29 L18.5 27 L14 17.5 L23 17.5 Z" fill="#fff" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/></svg>
</div></div>
<div id="cap" aria-live="polite"></div>
<div id="bar">
 <button id="prev">Back</button><button id="play">Start</button><button id="next">Next</button>
 <div id="dots"></div>
 <button id="capbtn" aria-pressed="false">Captions</button><button id="voice" aria-pressed="true">Voice on</button>
</div>
<script>
const DECK_ID='whatsnew-staying-up-to-date';
if(new URLSearchParams(location.search).get('src')==='popup')document.body.classList.add('wn-popup');

/* What's new mini deck for the sign-in popup: the red version number, the blue
   out-of-date bar, the Use Chrome popup and the desktop icon. Everything is drawn
   in CSS; no screenshots, no people. */

/* ---- small helpers ---- */
const tap=async(s,ms=850)=>{const e=typeof s==='string'?q(s):s;await move(e,ms);await click(e);return e};
function all(s){return[...document.querySelectorAll('.scene.on '+s)]}
const fadeIn=(e,ms=450)=>anim(e,[{opacity:0},{opacity:1}],ms,'ease-out').then(()=>{e.style.opacity=1});
const fadeOut=(e,ms=350)=>anim(e,[{opacity:1},{opacity:0}],ms,'ease-in').then(()=>{e.style.opacity=0});
const PTS=(items,top=140)=>`<div class="abs" style="left:790px;top:${top}px;width:440px"><ul class="pts">${items.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
/* a quick white flash, the way a reload looks */
async function reload(){const f=q('.su-flash');await anim(f,[{opacity:0},{opacity:1}],220,'ease-in');await wait(150);await anim(f,[{opacity:1},{opacity:0}],380,'ease-out');f.style.opacity=0}

/* the LDAH emblem: a circle with six spokes */
const EMB=`<svg viewBox="0 0 30 30"><g stroke="#fff" stroke-width="2.4" stroke-linecap="round" fill="none"><circle cx="15" cy="15" r="4.2"/>${[0,60,120,180,240,300].map(a=>`<line x1="15" y1="8" x2="15" y2="2.5" transform="rotate(${a} 15 15)"/><line x1="15" y1="5.5" x2="12.6" y2="3.6" transform="rotate(${a} 15 15)"/><line x1="15" y1="5.5" x2="17.4" y2="3.6" transform="rotate(${a} 15 15)"/>`).join('')}</g></svg>`;
const ICO=`<div class="su-ico">${EMB}</div>`;

/* the dashboard, drawn: header card + placeholder cards */
const HDR=ver=>`<div class="su-hdr"><div class="su-ver"><span class="cur">${ver}</span><span class="new">v152.21</span></div>
 <div class="su-row"><div class="su-logo">LDAH</div><div class="su-wx"><i></i>82° Partly sunny</div><div class="su-chat"></div><div class="su-alerts">Alerts</div><div class="su-newi">+ New Interaction</div><div class="su-av">JD</div></div></div>`;
const CARDS=`<div class="su-cards"><div class="su-c"><b></b><s></s><s style="width:80%"></s><s style="width:60%"></s></div><div class="su-c"><b></b><s></s><s style="width:70%"></s><s style="width:85%"></s></div>
 <div class="su-c su-wide"><b style="width:25%"></b><s></s><s style="width:75%"></s></div></div>`;
const WIN=(extra='',ver='v152.20')=>`<div class="su-win"><div class="su-page">${HDR(ver)}${CARDS}</div>${extra}<div class="su-flash"></div></div>`;

const COVER_LOGO=`<div class="ldah-logo" style="position:absolute;left:70px;top:22px;background:#fff;border-radius:14px;padding:6px 10px;box-shadow:0 4px 14px rgba(0,0,0,.18);animation:rise .6s both"><img src="../logo_blue.png" alt="LDAH" style="height:80px;display:block"></div>`;

const SC=[
// ================= COVER =================
{cls:'cover',html:()=>`${COVER_LOGO}<div class="brand">What’s new · Staying up to date</div><div class="hello">Hi <span class="nm"></span></div>
 <h1>Staying up to date</h1><p class="sub" style="top:300px">4 quick things · under 2 minutes</p>
 <div class="su-cv"><small>Your version</small><div class="vv"><span>v152.20</span><u>v152.21</u></div></div>
 <div class="spark" style="left:1190px;top:120px">${SPARK}</div><div class="spark" style="left:760px;top:420px;animation-delay:1s">${SPARK}</div>
 <div class="gate" style="top:400px"><button class="btn" data-go="start">Play</button><button class="btn ghost" data-go="skip">Skip for now</button><label><input type="checkbox" id="voiceChk" checked> Read it out loud to me</label></div>${WAVES}`,
 steps:[{say:'Hi {name}! Here are four quick things that help you stay up to date.'}]},

// ================= 1. THE VERSION NUMBER =================
{html:()=>HEAD('1 · Top right of the dashboard','The version number')+WIN()+PTS(['Grey number: the version you are using','Red number: a newer version is ready','Click it to update. Save your work first.']),
 steps:[
  {say:'The small grey number at the top right is the version you are using.',li:0,act:async()=>{spot(q('.su-ver .cur'),8)}},
  {say:'When we improve the dashboard, the newest number shows up in red next to yours.',li:1,act:async()=>{const n=q('.su-ver .new');n.style.display='inline';await fadeIn(n,600);spot(q('.su-ver'),8)}},
  {say:'Click the red number and the dashboard updates in a second. Finish what you are typing and save first.',li:2,act:async()=>{spot(null);const n=q('.su-ver .new');n.style.display='inline';n.style.opacity=1;
    await tap(n);await reload();n.remove();q('.su-ver .cur').textContent='v152.21';hideCursor();spot(q('.su-ver'),8)}}
 ]},

// ================= 2. THE BLUE BAR =================
{html:()=>HEAD('2 · Bottom of the page','The blue bar')+WIN(`<div class="su-blue"><span>This page is out of date — reload to pick up the current version.</span><button>Reload now</button></div>`)+PTS(['Same message as the red number','Click Reload now']),
 steps:[
  {say:'Some days you will also see this blue bar at the bottom of the page.',li:0,act:async()=>{const b=q('.su-blue');await anim(b,[{opacity:0,transform:'translate(-50%,30px)'},{opacity:1,transform:'translate(-50%,0)'}],600,'ease-out');spot(b,6)}},
  {say:'It means the same thing. Click Reload now.',li:1,act:async()=>{spot(null);await tap('.su-blue button');await reload();q('.su-blue').remove();q('.su-ver .cur').textContent='v152.21';hideCursor()}}
 ]},

// ================= 3. PLEASE USE CHROME =================
{html:()=>HEAD('3 · In another browser','Please use Chrome')+WIN(`<div class="su-dim"></div><div class="su-modal"><h4>Please use Google Chrome</h4>
  <p>You are using Edge 154. The dashboard works best, and picks up updates most reliably, in Google Chrome.</p>
  <div class="su-btns"><button class="su-b blue su-copy">Copy link</button><button class="su-b lblue">Get Chrome</button><button class="su-b grey">Not now</button></div></div>
  <div class="su-phone"><div class="su-scr"><div class="su-modal"><h4>Please use Google Chrome</h4><p>The dashboard works best in Google Chrome.</p>
  <div class="su-btns"><button class="su-b blue su-oic">Open in Chrome</button><button class="su-b grey">Not now</button></div></div></div></div>`)+PTS(['Edge or Firefox? This popup suggests Chrome','Computer: Copy link, open Chrome, paste','Phone or iPad: Open in Chrome']),
 steps:[
  {say:'If you open the dashboard in another browser, like Edge or Firefox, this popup suggests Chrome.',li:0,act:async()=>{const m=q('.su-modal');await anim(m,[{opacity:0,transform:'translate(-50%,-46%)'},{opacity:1,transform:'translate(-50%,-50%)'}],500,'ease-out');spot(m,6)}},
  {say:'On a computer, click Copy link, open Chrome, and paste it.',li:1,act:async()=>{spot(null);const b=await tap('.su-copy');b.textContent='Link copied';hideCursor()}},
  {say:'On a phone or iPad, Open in Chrome does it for you.',li:2,act:async()=>{const p=q('.su-phone');await anim(p,[{opacity:0,transform:'translateY(40px)'},{opacity:1,transform:'none'}],600,'ease-out');p.style.opacity=1;await tap('.su-oic');hideCursor()}}
 ]},

// ================= 4. YOUR DESKTOP ICON =================
{html:()=>HEAD('4 · In Chrome','Your desktop icon')+WIN(`<div class="su-offer">${ICO}<div><h5>Put the dashboard on your desktop?</h5>
  <p>Adds an LDAH Dashboard icon to your desktop and taskbar. It always opens the dashboard in Chrome.</p>
  <div class="su-btns"><button class="su-b grey">No thanks</button><button class="su-b blue su-add">Add icon</button></div></div></div>
  <div class="su-inst"><h5>Install app?</h5><div class="who">${ICO}LDAH Dashboard</div><div class="su-btns"><button class="su-b grey">Cancel</button><button class="su-b blue su-go">Install</button></div></div>
  <div class="su-desk"><div class="su-dico dim"><div class="su-ico"></div>Documents</div><div class="su-dico dim"><div class="su-ico"></div>Notes</div><div class="su-dico su-mine">${ICO}LDAH Dashboard</div></div>
  <div class="su-dock"><i style="background:#60A5FA"></i><i style="background:#34D399"></i><i style="background:#FBBF24"></i>${ICO}</div>
  <div class="su-menu su-m1" style="left:420px;top:330px"><div>Open</div><div class="hl">Options ›</div><div>Quit</div></div>
  <div class="su-menu su-m2" style="left:240px;top:290px"><div class="hl">Keep in Dock</div><div>Open at Login</div></div>`)+PTS(['Chrome offers a desktop icon','Click Add icon, then Install','Mac: right-click, Options, Keep in Dock']),
 steps:[
  {say:'In Chrome, the dashboard offers to put an LDAH Dashboard icon on your desktop.',li:0,act:async()=>{const o=q('.su-offer');await anim(o,[{opacity:0,transform:'translateY(30px)'},{opacity:1,transform:'none'}],550,'ease-out');spot(o,6)}},
  {say:'Click Add icon, then Install. The icon appears on your desktop.',li:1,act:async()=>{spot(null);await tap('.su-add');await fadeOut(q('.su-offer'));
    await fadeIn(q('.su-inst'));await tap('.su-go');await fadeOut(q('.su-inst'));hideCursor();await fadeIn(q('.su-desk'),500);spot(q('.su-mine'),8)}},
  {say:'On a Mac it opens right away. Right-click its icon in the Dock, then Options, then Keep in Dock.',li:2,act:async()=>{spot(null);q('.su-desk').style.opacity=0;
    const d=q('.su-dock');await fadeIn(d);const ic=d.querySelector('.su-ico');await move(ic,800);await click(ic);
    const ip=pos(ic),wp=pos(q('.su-win'));const m1=q('.su-m1'),m2=q('.su-m2');
    m1.style.left=(ip.x-wp.x-60)+'px';m1.style.top=(ip.y-wp.y-118)+'px';await fadeIn(m1,250);
    await move(m1.querySelector('.hl'),600);m2.style.left=(ip.x-wp.x-232)+'px';m2.style.top=(ip.y-wp.y-118)+'px';await fadeIn(m2,250);
    await tap(m2.querySelector('.hl'),600);spot(m2,6)}}
 ]},

// ================= WRAP UP =================
{cls:'cover',html:()=>`${COVER_LOGO}<div class="brand">What’s new · Staying up to date</div><div class="hello">That’s it</div><h1>Thank you!</h1>
 <p class="sub" style="top:300px">You can watch this again any time in Training Videos.</p>
 <div class="gate" style="top:400px"><button class="btn ghost" data-go="again">Watch again</button><button class="btn" data-go="close">Close</button></div>${WAVES}`,
 steps:[{say:'Thank you! You can watch this again any time in Training Videos.',act:async()=>{await wait(400);confetti(640,300,140)}}]}
];
</script>
<script src="deck-engine.js"></script>
<script src="deck-tracker.js"></script></body></html>
