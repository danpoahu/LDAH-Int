<link rel="stylesheet" href="deck-base.css">
<!-- Same Firebase build as the dashboard, so the deck shares its sign-in and records progress. -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<style>
/* Every class here starts with va- so nothing collides with deck-base.css. */
.va-win{position:absolute;left:58px;top:118px;width:712px;height:570px;background:#F4F6F9;border:1px solid #D5DEE8;border-radius:12px;overflow:hidden;box-shadow:0 14px 36px rgba(15,23,42,.16);z-index:4;font-family:"Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:#1E293B}
.va-in{position:relative;padding:12px 16px}
.va-crumb{font-size:11px;color:#64748B;margin-bottom:4px}
.va-crumb b{color:#0E7490}
.va-ttl{font-family:Outfit,"Nunito Sans",sans-serif;font-weight:800;font-size:20px;color:#1E293B;margin:0 0 8px}
/* tabs */
.va-tabs{display:flex;gap:4px;border-bottom:2px solid #E2E8F0;margin-bottom:10px}
.va-tab{font-size:12.5px;font-weight:700;color:#64748B;padding:7px 12px;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.va-tab.on{color:#0E7490;border-bottom-color:#0E7490}
.va-tab .n{display:inline-block;font-size:10px;background:#E0F2FE;color:#0369A1;border-radius:999px;padding:0 6px;margin-left:4px}
.va-chips{display:flex;gap:6px;margin-bottom:8px}
.va-chip{border:1px solid #E7ECF1;background:#fff;border-radius:999px;padding:4px 11px;font-size:10.5px;font-weight:600;color:#64748B}
.va-chip.on{background:#0E7490;color:#fff;border-color:#0E7490}
/* scrolling list */
.va-scroll{position:absolute;left:16px;right:16px;top:150px;bottom:0;overflow:hidden}
.va-list{transition:transform .9s ease-in-out}
.va-group{margin-bottom:12px}
.va-gh{display:flex;align-items:center;gap:8px;border-bottom:1px solid #E7ECF1;padding-bottom:5px;margin-bottom:8px}
.va-gt{font-family:Outfit,"Nunito Sans",sans-serif;font-weight:800;font-size:15px;color:#1E293B}
.va-gc{font-size:10.5px;font-weight:800;background:#E0F2FE;color:#0369A1;border-radius:999px;padding:1px 8px}
.va-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* a card, like .vros-card / .vapp-card */
.va-card{position:relative;background:#fff;border:1px solid #E7ECF1;border-radius:12px;padding:11px 12px;box-shadow:0 6px 20px rgba(2,132,199,.06);font-size:11px}
.va-head{display:flex;gap:9px;align-items:center}
.va-av{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:12px}
.va-name{font-family:Outfit,"Nunito Sans",sans-serif;font-weight:800;font-size:13.5px;padding-right:70px}
.va-opp{display:inline-block;margin-top:2px;font-size:9.5px;font-weight:700;padding:1px 8px;border-radius:999px;background:#E0F2FE;color:#0369A1;white-space:nowrap}
.va-pill{position:absolute;top:10px;right:10px;font-size:8.5px;font-weight:800;border-radius:999px;padding:3px 8px;text-transform:uppercase;letter-spacing:.04em}
.vb-new{background:#EEF2FF;color:#4338CA}.vb-contacted{background:#E0F2FE;color:#0369A1}.vb-interviewing{background:#F3E8FF;color:#7C3AED}.vb-declined{background:#FEE2E2;color:#B91C1C}.vb-accepted{background:#DCFCE7;color:#15803D}
.va-meta{margin-top:7px;color:#475569;line-height:1.45}
.va-snip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.va-ftag{display:inline-block;margin-top:5px;font-size:9.5px;font-weight:700;border-radius:999px;padding:1px 8px;border:1px solid #E2E8F0;background:#F1F5F9;color:#64748B}
.va-ftag.on{background:#F0FDF4;color:#15803D;border-color:#BBF7D0}
.va-acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;padding-top:8px;border-top:1px dashed #E7ECF1}
.va-act{font-weight:700;font-size:10.5px;color:#0E7490;background:#F0F9FF;border:1px solid #BAE6FD;border-radius:7px;padding:4px 9px;white-space:nowrap}
.va-act.sent{color:#15803D;background:#F0FDF4;border-color:#BBF7D0}
.va-more{font-size:10.5px;font-weight:700;color:#0E7490;text-decoration:underline}
.va-sent{flex-basis:100%;font-size:9.5px;color:#64748B}
.va-none{font-size:11px;color:#94A3B8}
/* the roster docs tags */
.va-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.va-dtag{display:inline-block;font-size:9.5px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid transparent}
.va-dtag.none{background:#F1F5F9;color:#64748B;border-color:#E2E8F0}
.va-dtag.part{background:#FFFBEB;color:#B45309;border-color:#FDE68A}
.va-dtag.ok{background:#F0FDF4;color:#15803D;border-color:#BBF7D0}
.va-dtag.hrs{background:#ECFEFF;color:#0E7490;border-color:#A5F3FC}
/* modal over the window */
.va-veil{position:absolute;inset:0;background:rgba(15,23,42,.38);display:none;z-index:6}
.va-modal{position:absolute;left:50px;right:50px;top:14px;max-height:calc(100% - 28px);background:#fff;border-radius:12px;box-shadow:0 18px 44px rgba(0,0,0,.3);overflow:hidden;display:flex;flex-direction:column}
.va-mh{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid #E2E8F0;font-family:Outfit,"Nunito Sans",sans-serif;font-weight:800;font-size:15px}
.va-mh .x{color:#94A3B8;font-weight:400}
.va-mb{padding:10px 14px;overflow:hidden;font-size:11px;flex:1}
.va-lbl{font-size:9.5px;font-weight:800;color:#475569;text-transform:uppercase;letter-spacing:.04em;margin:9px 0 3px}
.va-fa{border:1px solid #E2E8F0;border-radius:10px;margin-top:8px}
.va-fa .sm{display:flex;align-items:center;gap:8px;padding:8px 11px;border-bottom:1px solid #EEF2F6}
.va-fa .sm b{font-size:12.5px}
.va-st{font-size:9.5px;font-weight:700;border-radius:999px;padding:2px 8px;background:#F0FDF4;color:#15803D}
.va-fa .bd{padding:6px 11px 9px}
.va-print{float:right;font-size:10.5px;font-weight:700;border:1px solid #CBD5E1;border-radius:6px;padding:4px 10px;background:#fff;color:#334155}
.va-h{font-size:9.5px;font-weight:800;color:#0E7490;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid #E0F2FE;padding-bottom:2px;margin:9px 0 4px}
.va-dl{display:grid;grid-template-columns:38% 1fr;gap:2px 10px;font-size:10.5px;margin:0}
.va-dl dt{color:#64748B}.va-dl dd{margin:0}
/* website Step 2 */
.va-site{position:absolute;inset:0;background:#E6F4F1;display:flex;align-items:center;justify-content:center}
.va-step2{width:470px;background:#fff;border-radius:16px;box-shadow:0 18px 40px rgba(15,23,42,.18);padding:16px 20px}
.va-kick{font-size:10px;font-weight:800;color:#0E7490;text-transform:uppercase;letter-spacing:.06em}
.va-step2 h4{margin:3px 0 4px;font-family:Outfit,"Nunito Sans",sans-serif;font-size:20px}
.va-step2 p{margin:0 0 10px;font-size:11.5px;color:#64748B}
.va-fld{margin-bottom:8px}
.va-fld span{display:block;font-size:10px;font-weight:700;color:#475569;margin-bottom:2px}
.va-fld i{display:block;font-style:normal;border:1px solid #CBD5E1;border-radius:7px;padding:6px 9px;font-size:12px;background:#F0FDF4}
.va-fld i.e{background:#fff;color:#94A3B8}
.va-url{position:absolute;left:0;right:0;top:0;height:26px;background:#fff;border-bottom:1px solid #D5DEE8;font-size:10.5px;color:#64748B;display:flex;align-items:center;padding:0 12px}
/* documents panel */
.va-send{background:#F8FAFC;border:1px solid #E2E8F0;border-radius:9px;padding:8px 10px}
.va-sup{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:10px;color:#475569}
.va-sup i{font-style:normal;flex:1;border:1px solid #CBD5E1;border-radius:6px;padding:4px 8px;background:#fff;color:#1E293B;font-size:11px}
.va-btnp{font-weight:700;font-size:11px;color:#fff;background:#0E7490;border-radius:7px;padding:6px 11px;white-space:nowrap}
.va-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #EEF2F6}
.va-row .t{flex:1;font-weight:700;font-size:11.5px}
.va-dp{font-size:9.5px;font-weight:700;border-radius:999px;padding:2px 8px}
.va-dp.ok{background:#F0FDF4;color:#15803D}.va-dp.no{background:#F1F5F9;color:#64748B}.va-dp.hrs{background:#ECFEFF;color:#0E7490}
.va-link{font-size:10px;font-weight:700;color:#0E7490}
.va-hide{display:none}
/* cover art */
.va-cv1{position:absolute;left:780px;top:130px;width:330px;transform:rotate(3deg);animation:bob 6s ease-in-out infinite;z-index:3;box-shadow:0 24px 50px rgba(0,0,0,.35)}
.va-cv2{position:absolute;left:880px;top:390px;width:300px;transform:rotate(-4deg);animation:bob 5s 1s ease-in-out infinite;z-index:4;box-shadow:0 20px 40px rgba(0,0,0,.3)}
.cover .va-card{font-family:"Nunito Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:#1E293B}
</style></head><body>
<div id="view"><div id="stage"><div id="nbar"><i></i></div>
<div id="scenes"></div>
<div id="spot"></div>
<svg id="cursor" viewBox="0 0 28 32"><path d="M3 2 L3 26 L9.5 19.5 L14 29 L18.5 27 L14 17.5 L23 17.5 Z" fill="#fff" stroke="#0F172A" stroke-width="2" stroke-linejoin="round"/></svg>
</div></div>
<div id="cap" aria-live="polite"></div>
<div id="bar">
 <button id="prev">Back</button><button id="play">Start</button><button id="next">Next</button>
 <div id="dots"></div>
 <button id="capbtn" aria-pressed="false">Captions</button><button id="voice" aria-pressed="true">Voice on</button>
</div>
<script>
const DECK_ID='whatsnew-volunteer-applications';

/* What's new mini deck. It plays inside the sign-in popup, so it is short and mostly summary.
   The mocks redraw the Volunteers section as Int v152.3 builds it: cmsRenderApplications
   (grouped cards, Full application / Short form only tag, _vappActsHtml buttons),
   _vfaSectionHtml (Full application section, Print / Save PDF), cmsRenderRoster with
   cmsVolDocsTag, and cmsRosterDetails + cmsRenderVolDocs. The website panel is the Step 2
   form in volunteer.html. Every name is MADE UP. The popup supplies See the full training /
   Got it / Remind me later, so this deck draws none of those. */

/* ---- small helpers ---- */
const tap=async(s,ms=850)=>{const e=typeof s==='string'?q(s):s;await move(e,ms);await click(e);return e};
const PTS=(items,top=140)=>`<div class="abs" style="left:790px;top:${top}px;width:440px"><ul class="pts">${items.map(t=>`<li>${t}</li>`).join('')}</ul></div>`;
const show=(s,on=true)=>{const e=q(s);e.style.display=on?'block':'none';return e};
const fadeIn=async(s)=>{const e=show(s);await anim(e,[{opacity:0},{opacity:1}],350,'ease-out');return e};

/* ---- fictional people ---- */
const AV=['#0891B2','#F97316','#65A30D','#7C3AED','#E31C79','#0E7490'];
const P={
 kai:{n:'Kai Example',i:'KE',c:AV[0],opp:'Event Helper',d:'Oct 1, 2026',m:'I would love to help at family events.',st:'new',full:true},
 mele:{n:'Mele Sample',i:'MS',c:AV[1],opp:'Office Support',d:'Oct 1, 2026',m:'Weekday mornings work best for me.',st:'new',full:false},
 noa:{n:'Noa Demo',i:'ND',c:AV[2],opp:'Event Helper',d:'Sep 28, 2026',m:'My son went through an IEP last year.',st:'contacted',full:true},
 lani:{n:'Lani Test',i:'LT',c:AV[3],opp:'Outreach Booth',d:'Sep 24, 2026',m:'I can drive to Windward events.',st:'interviewing',full:true},
 sam:{n:'Sam Placeholder',i:'SP',c:AV[4],opp:'Office Support',d:'Sep 15, 2026',m:'Only free in December.',st:'declined',full:false}};
const BADGE={new:'new',contacted:'contacted',interviewing:'interviewing',declined:'Declined'};

function CARD(k,{acts=true,sent=false,cls=''}={}){const p=P[k];
 return`<div class="va-card ${cls}" data-k="${k}"><span class="va-pill vb-${p.st}">${BADGE[p.st]}</span>
 <div class="va-head"><div class="va-av" style="background:${p.c}">${p.i}</div><div style="min-width:0"><div class="va-name">${p.n}</div><span class="va-opp">${p.opp}</span></div></div>
 <div class="va-meta"><div>Applied ${p.d}</div><div class="va-snip">${p.m}</div>
 ${p.full?'<span class="va-ftag on">Full application</span>':'<span class="va-ftag">Short form only</span>'}</div>
 ${acts?`<div class="va-acts"><span class="va-act k-view-${k}">View application</span><span class="va-act k-send-${k}">Resend application link</span>${sent?'<span class="va-sent">Link sent Sep 30</span>':''}</div>`:''}</div>`}
const GROUP=(t,keys,o)=>`<div class="va-group k-g-${t.toLowerCase()}"><div class="va-gh"><span class="va-gt">${t}</span><span class="va-gc">${keys.length}</span></div>
 ${keys.length?`<div class="va-grid">${keys.map(k=>CARD(k,o)).join('')}</div>`:'<div class="va-none">No applications here.</div>'}</div>`;
const TABS=(on)=>`<div class="va-tabs">${[['Roster',2],['Applications',5],['Help Requests',0],['Opportunities',4]].map(([t,n])=>`<span class="va-tab k-tab-${t.split(' ')[0].toLowerCase()}${t===on?' on':''}">${t}${n?`<span class="n">${n}</span>`:''}</span>`).join('')}</div>`;
const TOP=(on)=>`<div class="va-crumb">CMS · <b>Volunteers</b></div><div class="va-ttl">Volunteers</div>${TABS(on)}`;

/* ---- scene 2: the Applications tab ---- */
const APPS=()=>`<div class="va-win"><div class="va-in">${TOP('Applications')}
 <div class="va-chips"><span class="va-chip on">All</span><span class="va-chip">New</span><span class="va-chip">Contacted</span><span class="va-chip">Interviewing</span><span class="va-chip">Declined</span></div></div>
 <div class="va-scroll"><div class="va-list k-list">${GROUP('New',['kai','mele'],{acts:false})}${GROUP('Contacted',['noa'],{acts:false})}${GROUP('Interviewing',['lani'],{acts:false})}${GROUP('Declined',['sam'],{acts:false})}</div></div></div>`;

/* ---- scene 3: website Step 2, then the cards, the View popup and Resend ---- */
const FULL=()=>`<div class="va-win"><div class="va-in">${TOP('Applications')}</div>
 <div class="va-scroll" style="top:118px">${GROUP('New',['kai','mele'],{sent:false})}${GROUP('Contacted',['noa'],{sent:true})}</div>
 <div class="va-veil k-pop"><div class="va-modal"><div class="va-mh">Kai Example <span class="x">✕</span></div><div class="va-mb">
  <div style="color:#64748B">kai@example.com · (808) 555-0100</div>
  <div style="margin-top:5px;color:#64748B">Opportunity: <b style="color:#334155">Event Helper</b> · Applied Thu, Oct 1, 2026</div>
  <div class="va-fa k-fa"><div class="sm"><b>Full application</b><span class="va-st">Signed Oct 1, 2026</span></div><div class="bd">
   <span class="va-print k-print">Print / Save PDF</span>
   <div class="va-h">Applicant</div><dl class="va-dl"><dt>Name</dt><dd>Kai Example</dd><dt>Address</dt><dd>123 Sample St, Honolulu</dd><dt>Under 18</dt><dd>No</dd></dl>
   <div class="va-h">Volunteer experience and availability</div><dl class="va-dl"><dt>Days available</dt><dd>Saturdays</dd><dt>Interests</dt><dd>Family events, outreach</dd></dl>
   <div class="va-h">References (not a relative)</div><dl class="va-dl"><dt>Reference 1</dt><dd>Alex Placeholder</dd></dl>
   <div class="va-h">Certification and signature</div><dl class="va-dl"><dt>Signature (typed)</dt><dd>Kai Example</dd><dt>Certified true and complete</dt><dd>Yes</dd></dl>
  </div></div></div></div></div>
 <div class="va-site k-site"><div class="va-url">ldahawaii.org/volunteer</div><div class="va-step2">
  <div class="va-kick">Step 2 of 2 · Volunteer application</div><h4>Complete your volunteer application</h4>
  <p>Pre-filled from the short form.</p>
  <div class="va-fld"><span>First name</span><i>Mele</i></div><div class="va-fld"><span>Last name</span><i>Sample</i></div>
  <div class="va-fld"><span>Email</span><i>mele@example.com</i></div><div class="va-fld"><span>Phone</span><i>(808) 555-0123</i></div>
  <div class="va-fld"><span>Street address</span><i class="e">Street address</i></div></div></div></div>`;

/* ---- scene 4: the Roster and the documents ---- */
const ROSTER=()=>`<div class="va-win"><div class="va-in">${TOP('Roster')}
 <div class="va-chips"><span class="va-chip on">All 2</span><span class="va-chip">Event Helper 1</span><span class="va-chip">Outreach Booth 1</span></div>
 <div class="va-grid" style="margin-top:4px">
  <div class="va-card k-rcard"><div class="va-head"><div class="va-av" style="background:${AV[0]}">KE</div><div><div class="va-name">Kai Example</div><span class="va-opp">Event Helper</span></div></div>
   <div class="va-meta"><div style="color:#0E7490">kai@example.com</div><div>(808) 555-0100</div><div style="color:#94A3B8;font-size:10px">Volunteer since Oct 2026</div>
   <div class="va-tags k-tags"><span class="va-dtag none">Docs not sent</span></div>
   <div class="va-acts" style="justify-content:space-between"><span class="va-more k-more">View details &amp; notes</span><span class="va-act">View application</span></div></div></div>
  <div class="va-card"><div class="va-head"><div class="va-av" style="background:${AV[3]}">LT</div><div><div class="va-name">Lani Test</div><span class="va-opp">Outreach Booth</span></div></div>
   <div class="va-meta"><div style="color:#0E7490">lani@example.com</div><div style="color:#94A3B8;font-size:10px">Volunteer since Sep 2026</div>
   <div class="va-tags"><span class="va-dtag ok">Docs 3/3</span><span class="va-dtag hrs">12 h logged</span></div>
   <div class="va-acts" style="justify-content:space-between"><span class="va-more">View details &amp; notes</span><span class="va-act">View application</span></div></div></div>
 </div></div>
 <div class="va-veil k-dpop"><div class="va-modal"><div class="va-mh">Kai Example <span class="x">✕</span></div><div class="va-mb">
  <div style="color:#64748B">Opportunity: <b style="color:#334155">Event Helper</b> · Status: <b style="color:#15803D">accepted</b></div>
  <div class="va-fa"><div class="sm"><b>Full application</b><span class="va-st">Signed Oct 1, 2026</span></div></div>
  <div class="va-lbl">Volunteer documents</div>
  <div class="va-send k-sendbox"><div class="k-sentline" style="color:#475569">Not sent yet. The volunteer gets one personal link to all four documents.</div>
   <div class="va-sup">Supervising staff person <i>Alex Placeholder</i><span class="va-btnp k-sendbtn">Send volunteer documents</span></div></div>
  <div class="k-docs">
   <div class="va-row"><span class="t">Confidentiality Agreement</span><span class="va-dp no k-d1">Not yet</span></div>
   <div class="va-row"><span class="t">Drug-Free Workplace Policy</span><span class="va-dp no k-d2">Not yet</span></div>
   <div class="va-row"><span class="t">Emergency contacts</span><span class="va-dp no">Not yet</span></div>
   <div class="va-row"><span class="t">Service log</span><span class="va-dp hrs k-d4">0 hours</span><span class="va-link">View / Print</span></div>
   <div style="display:flex;gap:14px;font-size:10px;color:#64748B;padding-top:5px" class="k-split"><span>LDAH <b>0</b></span><span>PTI <b>0</b></span><span>SRP <b>0</b></span><span>0 entries</span></div>
  </div></div></div></div></div>`;

const LOGO=`<div class="ldah-logo" style="position:absolute;left:70px;top:22px;background:#fff;border-radius:14px;padding:6px 10px;box-shadow:0 4px 14px rgba(0,0,0,.18);animation:rise .6s both"><img src="../logo_blue.png" alt="LDAH" style="height:80px;display:block"></div>`;

const SC=[
// ================= COVER =================
{cls:'cover',html:()=>LOGO+`<div class="brand">Leadership in Disabilities &amp; Achievement of Hawaiʻi · What’s new</div><div class="hello">Aloha <span class="nm"></span></div>
 <h1>Volunteers, from application to roster</h1><p class="sub" style="top:350px">Application cards, the full application, and volunteer documents. Under two minutes.</p>
 <div class="va-cv1">${CARD('kai',{acts:true})}</div>
 <div class="va-cv2"><div class="va-card"><div class="va-head"><div class="va-av" style="background:${AV[3]}">LT</div><div><div class="va-name">Lani Test</div><span class="va-opp">Outreach Booth</span></div></div><div class="va-tags"><span class="va-dtag part">Docs 2/3</span><span class="va-dtag hrs">4.5 h logged</span></div></div></div>
 <div class="spark" style="left:1200px;top:90px">${SPARK}</div><div class="spark" style="left:740px;top:560px;animation-delay:1s">${SPARK}</div>
 <div class="gate" style="top:450px"><button class="btn" data-go="start">Play</button><label><input type="checkbox" id="voiceChk" checked> Read it out loud to me</label></div>${WAVES}`,
 steps:[{say:'Aloha {name}! The volunteer system is live. Here is what is new, in under two minutes.'}]},

// ================= APPLICATIONS =================
{html:()=>HEAD('Where it is','CMS, Volunteers, Applications')+APPS()+PTS([
 'Go to <b>CMS</b> → <b>Volunteers</b> → <b>Applications</b>.',
 'Applications are <b>cards in groups</b>: <b>New</b>, <b>Contacted</b>, <b>Interviewing</b>, <b>Declined</b>.',
 'Accept someone and they move to the <b>Roster</b>.']),
 steps:[{say:'Go to CMS, then Volunteers, then the Applications tab.',li:0,act:async()=>{await tap('.k-tab-applications',900);hideCursor();spot(q('.k-tab-applications'),4)}},
 {say:'Applications are now cards, in groups: New, Contacted, Interviewing and Declined.',li:1,act:async()=>{spot(q('.k-g-new'),4);await wait(1400);const L=q('.k-list');L.style.transform=`translateY(-${Math.max(0,L.offsetHeight-L.parentNode.clientHeight+4)}px)`;await wait(1000);spot(q('.k-g-declined'),4)}},
 {say:'Once you accept someone, they move to the Roster tab.',li:2,act:async()=>{spot(null);q('.k-list').style.transform='none';await wait(500);spot(q('.k-tab-roster'),4)}}]},

// ================= FULL APPLICATION =================
{html:()=>HEAD('New','The full volunteer application')+FULL()+PTS([
 'The short form on the website goes <b>straight to the full LDAH Volunteer Application</b>, pre-filled.',
 'Cards show <b>Full application</b> or <b>Short form only</b>.',
 '<b>View application</b> opens it, with <b>Print / Save PDF</b>.',
 '<b>Resend application link</b> emails a link that opens it <b>pre-filled, on any device</b>.'],130),
 steps:[{say:'When someone sends the short volunteer form on the website, it takes them straight to the full LDAH Volunteer Application, already filled in with their name, email and phone.',li:0,act:async()=>{spot(q('.va-step2'),4)}},
 {say:'Each card shows Full application, or Short form only.',li:1,act:async()=>{spot(null);const s=q('.k-site');await anim(s,[{opacity:1},{opacity:0}],400,'ease-in');s.style.display='none';spot(q('.va-card[data-k="kai"] .va-ftag'),5);await wait(1300);spot(q('.va-card[data-k="mele"] .va-ftag'),5)}},
 {say:'View application opens it, signed and in full, with a Print or Save PDF button.',li:2,act:async()=>{spot(null);await tap('.k-view-kai',850);hideCursor();await fadeIn('.k-pop');await wait(300);spot(q('.k-print'),5)}},
 {say:'For a short form only, tap Resend application link. They get an email with a personal link that opens the application pre-filled, on any device.',li:3,act:async()=>{spot(null);q('.k-pop').style.display='none';const b=await tap('.k-send-mele',850);hideCursor();b.classList.add('sent');b.textContent='Resent ✓ just now';spot(b,5)}}]},

// ================= ROSTER DOCUMENTS =================
{html:()=>HEAD('New','Volunteer documents on the Roster')+ROSTER()+PTS([
 'On the <b>Roster</b>, open <b>View details &amp; notes</b>.',
 '<b>Send volunteer documents</b> emails one link: <b>Confidentiality</b> and <b>Drug-Free</b> agreements, <b>Emergency contacts</b>, and a <b>Service Log</b>.',
 'Each signed form shows here, with <b>View / Print</b>.',
 'The card shows <b>Docs 2/3 · 4.5 h logged</b>.'],130),
 steps:[{say:'On the Roster, open a volunteer with View details and notes.',li:0,act:async()=>{await tap('.k-more',900);hideCursor();await fadeIn('.k-dpop')}},
 {say:'Under Volunteer documents, tap Send volunteer documents. They get one email link to their Confidentiality and Drug-Free agreements, Emergency contacts, and a Service Log for their hours.',li:1,act:async()=>{await tap('.k-sendbtn',850);hideCursor();q('.k-sendbtn').textContent='Resend documents';q('.k-sentline').textContent='Sent Oct 2, 2026';spot(q('.k-sendbox'),4)}},
 {say:'As they sign each form, it shows here, and you can view or print it.',li:2,act:async()=>{spot(null);[['.k-d1','Signed Oct 2, 2026'],['.k-d2','Signed Oct 2, 2026']].forEach(([s,t])=>{const e=q(s);e.className='va-dp ok';e.textContent=t;e.insertAdjacentHTML('afterend','<span class="va-link">View / Print</span>')});q('.k-d4').textContent='4.5 hours';q('.k-split').innerHTML='<span>LDAH <b>4.5</b></span><span>PTI <b>0</b></span><span>SRP <b>0</b></span><span>2 entries</span>';spot(q('.k-docs'),4)}},
 {say:'Back on the card, it shows Docs two of three, and the hours they have logged.',li:3,act:async()=>{spot(null);await anim(q('.k-dpop'),[{opacity:1},{opacity:0}],300,'ease-in');q('.k-dpop').style.display='none';q('.k-tags').innerHTML='<span class="va-dtag part">Docs 2/3</span><span class="va-dtag hrs">4.5 h logged</span>';spot(q('.k-tags'),5)}}]},
